<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080e1a;
      --bg-card: #0f172a;
      --bg-surface: #1e293b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --accent-green: #34d399;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(56, 189, 248, 0.35);
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .quiz-container {
      width: 100%;
      max-width: 880px;
      background: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.35) 0%, rgba(14, 17, 36, 0) 70%), var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 20px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.35);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .quiz-header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
    }

    .topic-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--border-accent);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .progress-pill {
      font-family: monospace;
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg-surface);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a855f7);
      width: 10%;
      transition: width 0.3s ease;
    }

    .quiz-body {
      padding: 36px 32px;
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }

    .question-stem {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 24px;
      color: #ffffff;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--text-main);
      font-size: 14.5px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(4px);
    }

    .option-btn.correct {
      background: rgba(52, 211, 153, 0.15) !important;
      border-color: var(--accent-green) !important;
      color: #ffffff !important;
    }

    .option-btn.incorrect {
      background: rgba(239, 68, 68, 0.15) !important;
      border-color: var(--accent-red) !important;
      color: #ffffff !important;
    }

    .opt-letter {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .explanation-box {
      display: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 24px;
      animation: fadeIn 0.3s ease;
    }

    .explanation-box h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 6px;
      font-weight: 800;
    }

    .explanation-box p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .quiz-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
    }

    .score-indicator {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .next-btn {
      background: var(--accent);
      color: #030712;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .next-btn:hover:not(:disabled) {
      filter: brightness(1.15);
      transform: translateY(-2px);
    }

    .next-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Completion Screen */
    .summary-screen {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .summary-title {
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
      border: 3px solid var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 24px auto;
    }

    .score-val {
      font-size: 42px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
    }

    .score-max {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .grade-badge {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

  
    /* === MTG QUIZ MOBILE PHONE RESPONSIVENESS OVERRIDES === */
    @media (max-width: 640px) {
      html, body {
        padding: 6px !important;
        justify-content: flex-start !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        min-height: 100vh !important;
      }
      .quiz-container, .quiz-card, .quiz-wrapper {
        border-radius: 14px !important;
        max-width: 100% !important;
        width: 100% !important;
      }
      .quiz-header, .header-bar, header {
        padding: 12px 14px !important;

      }
      .quiz-body, #quizStage, #questionScreen, .question-stage, #quizBody {
        padding: 14px !important;
        gap: 12px !important;
        min-height: auto !important;
      }
      .question-stem, #qText, #questionTitle, #questionText, .q-text {
        font-size: 15.5px !important;
        line-height: 1.38 !important;
        margin-bottom: 8px !important;
      }
      .options-grid, #optionsGrid, #answersGrid {
        gap: 8px !important;
      }
      .option-btn, .answer-btn {
        padding: 10px 12px !important;
        font-size: 13px !important;
        line-height: 1.4 !important;
        gap: 10px !important;
        border-radius: 10px !important;
      }
      .explanation-card, #insightCard, #feedbackBox, #explanationBox {
        padding: 12px 14px !important;
        font-size: 12.5px !important;
        line-height: 1.45 !important;

      }
      .quiz-footer, .controls-row, #quizFooter, footer {
        padding: 12px 14px !important;
        position: sticky !important;
        bottom: 0 !important;
        background: rgba(15, 23, 42, 0.96) !important;
        backdrop-filter: blur(8px) !important;
        -webkit-backdrop-filter: blur(8px) !important;
        z-index: 20 !important;
      }
    }
    /* === END MTG QUIZ MOBILE PHONE RESPONSIVENESS OVERRIDES === */

  </style>

<body>

  <div class="quiz-container">
    <div class="quiz-header">
      <div class="topic-badge">
        <span>🏛️</span>
        <span>Edexcel Component 3 &bull; Spatial &amp; Acoustic Processing</span>
      </div>
      <div class="progress-pill" id="progressPill">Q 1 / 10</div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="quiz-body" id="quizBody">
      <div class="question-stem" id="questionStem">Loading Question...</div>

      <div class="options-grid" id="optionsGrid"></div>

      <div class="explanation-box" id="explanationBox">
        <h4>Examiner Specification Insight</h4>
        <p id="explanationText"></p>
      </div>

      <div class="quiz-footer">
        <div class="score-indicator" id="scoreIndicator">Score: 0 / 0</div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>
          <span>Next Question</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <!-- SUMMARY SCREEN -->
    <div class="summary-screen" id="summaryScreen">
      <div class="topic-badge" style="margin-bottom: 16px;">Assessment Complete</div>
      <h2 class="summary-title">Reverb Effects &amp; Acoustic Space Completed!</h2>
      <p style="color: var(--text-muted); font-size: 15px;">Official Pearson Edexcel Component 3 Specification Review</p>

      <div class="score-circle">
        <div class="score-val" id="finalScoreVal">10</div>
        <div class="score-max">/ 10 MARKS</div>
      </div>

      <div class="grade-badge" id="gradeBadge">Grade A*</div>

      <p id="feedbackMessage" style="color: var(--text-muted); font-size: 14px; max-width: 500px; margin: 0 auto 30px; line-height: 1.6;"></p>

      <button class="next-btn" onclick="restartQuiz()" style="margin: 0 auto;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        <span>Retake Specification Quiz</span>
      </button>
    </div>
  </div>

  <script>
    const questions = [{"q": "In architectural acoustics and audio engineering, how is RT60 precisely defined?", "options": ["The time in milliseconds for the first 60 early reflections to reach the listener", "The maximum room volume in cubic meters before acoustic resonance occurs", "The time in seconds required for sound reflections to decay by 60 dB below the direct sound level", "The frequency threshold where low-end room modes begin to resonate"], "correct": 2, "expl": "RT60 (Reverberation Time 60 dB), established by Wallace Clement Sabine, is the standard scientific measurement of reverb decay time: the duration required for the sound pressure level of an acoustic space to drop by 60 decibels after the sound source stops."}, {"q": "What is the primary acoustic and mix benefit of increasing the Pre-Delay parameter on a vocal reverb?", "options": ["It inserts a time gap before reflections begin, preserving upfront vocal articulation and intelligibility before the reverb wash", "It extends the overall RT60 tail by several seconds", "It filters out sub-bass frequencies below 100 Hz to prevent low-end mud", "It pans the reverb reflections to opposite sides of the stereo field"], "correct": 0, "expl": "Pre-delay creates a time buffer (typically 15ms to 60ms) between the direct dry vocal transient and the onset of early reflections. This psychoacoustically simulates a large room, keeping the lead vocal clear, intimate, and upfront."}, {"q": "How does an EMT 140 Plate Reverb mechanically generate artificial reverberation?", "options": ["By driving sound through coiled steel springs suspended in an oil bath", "By playing audio through a horn speaker into a tiled underground bunker", "By bouncing sound between two parallel quartz glass plates inside a vacuum tube", "By exciting a large 1x2 meter cold-rolled steel plate with an electromagnetic transducer, captured by contact pickups"], "correct": 3, "expl": "Invented by Elektro-Mess-Technik in 1957, the EMT 140 suspended a 600lb, 1x2m steel sheet inside a heavy frame. An electromagnetic driver vibrated the plate, and contact pickups captured the dense dispersion of transverse bending waves."}, {"q": "Why does Spring Reverb possess a distinctively 'twangy' and bright fluttering sound characteristic of surf rock and guitar combos?", "options": ["Because springs completely eliminate high frequencies above 2 kHz", "Because high frequencies travel along coiled steel springs slower than low frequencies, causing dispersion and mechanical flutter", "Because the spring tank is powered by high-voltage vacuum tube rectifiers", "Because the signal is multiplied by an LFO pitch oscillator"], "correct": 1, "expl": "In a spring tank, audio vibrations travel along tightly coiled steel wires. Higher frequencies exhibit frequency-dependent dispersion, arriving with a micro-time lag and fluttering mechanical resonance known as the spring 'boing' or 'twang'."}, {"q": "What is the exact signal processing routing required to create the iconic 1980s Gated Reverb drum sound (e.g., Phil Collins' 'In The Air Tonight')?", "options": ["Snare Drum &rarr; Low-pass filter &rarr; Tape delay &rarr; Stereo chorus", "Snare Drum &rarr; 4-stage phaser &rarr; Spring reverb tank &rarr; Limiter", "Snare Drum &rarr; Huge ambient room/plate reverb &rarr; Heavy compression &rarr; Noise gate with fast release", "Snare Drum &rarr; BBD delay &rarr; Flanger &rarr; Direct-to-mono bus"], "correct": 2, "expl": "Originating in the stone live room at London's Townhouse Studios via an SSL 4000 console's listen mic compressor, the snare was fed into a massive room or non-linear plate, heavily compressed, and then truncated abruptly by an aggressive noise gate."}, {"q": "How does a Convolution Reverb recreate the acoustic signature of a specific physical space (e.g., Sydney Opera House)?", "options": ["By generating randomized mathematical delay algorithms using digital feedback networks", "By convolving the incoming audio with an Impulse Response (IR)—a high-resolution recording of the room's reaction to a transient impulse", "By filtering the track through 12 cascaded all-pass phase stages", "By modeling the physical thermal temperature of the air using analog circuits"], "correct": 1, "expl": "Convolution reverb uses digital signal processing (Fast Fourier Transform multiplication) to merge input audio with an Impulse Response (IR). The IR is recorded in the real room by firing a starter pistol, sine sweep, or acoustic transient."}, {"q": "What is the famous 'Abbey Road Reverb EQ' technique and why is it applied to reverb send buses?", "options": ["Boosting 3 kHz and 10 kHz by +6 dB to make vocals sound airy and modern", "Summing all reverb frequencies below 200 Hz to mono while keeping highs stereo", "Applying a steep notch filter at 1 kHz to cancel out guitar resonance", "High-passing at approx 600 Hz and low-passing at approx 10 kHz to prevent low-end mud and harsh sibilance in the reverb tail"], "correct": 3, "expl": "Abbey Road engineers filtered sends to EMT 140 plates with a high-pass filter around 500-600 Hz (eliminating low-end boom and mud) and a low-pass filter around 10 kHz (preventing harsh vocal sibilance 'ess' sounds from splashing in the plate)."}, {"q": "What acoustic information is conveyed to human hearing by Early Reflections, and how do they differ from the Late Reverb Tail?", "options": ["Early reflections convey room dimensions and boundary proximity; the late tail provides a diffuse, dense exponential decay", "Early reflections contain no high frequencies, while the late tail contains only treble", "Early reflections occur only after 500ms of silence", "Early reflections are created by contact pickups, while the tail is generated by speakers"], "correct": 0, "expl": "Early reflections are the first discrete acoustic bounces from the nearest floor, walls, and ceiling (0–30ms), allowing the brain to calculate room dimensions. The late tail is an unrecognizable cloud of millions of overlapping reflections."}, {"q": "On a digital algorithmic reverb, what sonic change occurs when you increase the Diffusion parameter?", "options": ["The pre-delay gap increases in length", "The density of early reflections increases, smoothing out distinct echoes into a silky, continuous wash", "The reverb tail is converted from stereo into mono", "High frequencies are attenuated faster than low frequencies"], "correct": 1, "expl": "Low diffusion keeps individual reflection taps sparse, discrete, and grainier (ideal for percussive instruments where clarity is desired). High diffusion packs reflections tightly together, turning echoes into an ethereal, seamless cloud."}, {"q": "What is an Acoustic Echo Chamber in recording studio history?", "options": ["A wooden box filled with sand placed over a guitar cabinet", "A digital synthesizer patch that emulates stadium acoustics", "An acoustic guitar body miked from the inside using a lavalier microphone", "A specially constructed subterranean room with hard, highly reflective surfaces (tiles/plaster), equipped with a speaker and microphones"], "correct": 3, "expl": "Pioneered by Bill Putnam at Universal Recording and perfected at Capitol and Abbey Road, acoustic chambers were dedicated tiled basement rooms. A studio feed was played into the chamber via a monitor speaker and recaptured by stereo condenser mics."}];
    let currentIdx = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      answered = false;
      const q = questions[currentIdx];
      if (q && Array.isArray(q.options) && typeof q.correct === 'number') {
        const _correctOpt = q.options[q.correct];
        for (let _i = q.options.length - 1; _i > 0; _i--) {
          const _j = Math.floor(Math.random() * (_i + 1));
          const _tmp = q.options[_i];
          q.options[_i] = q.options[_j];
          q.options[_j] = _tmp;
        }
        q.correct = q.options.indexOf(_correctOpt);
      }

      // Update counters
      document.getElementById('progressPill').textContent = `Q ${currentIdx + 1} / ${questions.length}`;
      document.getElementById('progressFill').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
      document.getElementById('scoreIndicator').textContent = `Score: ${score} / ${currentIdx}`;

      // Update Question
      document.getElementById('questionStem').textContent = q.q;

      // Update Options
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span><span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        grid.appendChild(btn);
      });

      // Reset explanation & button
      document.getElementById('explanationBox').style.display = 'none';
      document.getElementById('nextBtn').disabled = true;
      document.getElementById('nextBtn').innerHTML = (currentIdx === questions.length - 1) 
        ? '<span>Finish Assessment</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>' 
        : '<span>Next Question</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
    }

    function selectOption(selectedIdx) {
      if (answered) return;
      answered = true;

      const q = questions[currentIdx];
      const buttons = document.querySelectorAll('.option-btn');

      buttons.forEach(btn => btn.disabled = true);

      if (selectedIdx === q.correct) {
        buttons[selectedIdx].classList.add('correct');
        score++;
      } else {
        buttons[selectedIdx].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
      }

      // Show explanation
      document.getElementById('explanationText').textContent = q.expl;
      document.getElementById('explanationBox').style.display = 'block';

      // Update score & enable next
      document.getElementById('scoreIndicator').textContent = `Score: ${score} / ${currentIdx + 1}`;
      document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
      if (currentIdx < questions.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        showSummary();
      }
    }

    function showSummary() {
      document.getElementById('quizBody').style.display = 'none';
      document.getElementById('summaryScreen').style.display = 'block';
      document.getElementById('finalScoreVal').textContent = score;

      const pct = (score / questions.length) * 100;
      const badge = document.getElementById('gradeBadge');
      const msg = document.getElementById('feedbackMessage');

      if (pct >= 80) {
        badge.style.background = 'rgba(52, 211, 153, 0.2)';
        badge.style.border = '1px solid #34d399';
        badge.style.color = '#34d399';
        badge.textContent = 'Grade A* / Distinction (Master Level)';
        msg.textContent = 'Outstanding specification knowledge! You have mastered the technical signal flow, parameters, and historical contexts of this effect.';
      } else if (pct >= 60) {
        badge.style.background = 'rgba(56, 189, 248, 0.2)';
        badge.style.border = '1px solid #38bdf8';
        badge.style.color = '#38bdf8';
        badge.textContent = 'Grade B (Solid Understanding)';
        msg.textContent = 'Good work! Review the technical formulas, routing distinctions, and parameter calculations to convert this into top-mark mastery.';
      } else {
        badge.style.background = 'rgba(239, 68, 68, 0.2)';
        badge.style.border = '1px solid #ef4444';
        badge.style.color = '#ef4444';
        badge.textContent = 'Needs Review';
        msg.textContent = 'Spend some time revisiting the interactive slide deck and technical homework guide to solidify your understanding of these core principles.';
      }
    }

    function restartQuiz() {
      currentIdx = 0;
      score = 0;
      document.getElementById('summaryScreen').style.display = 'none';
      document.getElementById('quizBody').style.display = 'flex';
      renderQuestion();
    }

    // Init
    renderQuestion();
  </script>
</body>
</html>
