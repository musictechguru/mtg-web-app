        ],
        correct: 0,
        explanation: "The Korg M1 'Organ 2' preset became an immortal dance staple. Its bright, punchy, percussive harmonic transient cut through dense mixes, serving as the punchy bassline for hundreds of classic 90s House and UK Garage anthems (such as Robin S - 'Show Me Love').",
        tip: "Korg M1 Landmark Sound: 'Organ 2' preset = foundational percussive bassline of 90s House & UK Garage."
      }
    ];

    let currentQ = 0;
    let score = 0;
    let answered = false;

    const qText = document.getElementById('qText');
    const qCategory = document.getElementById('qCategory');
    const qAoTag = document.getElementById('qAoTag');
    const optionsGrid = document.getElementById('optionsGrid');
    const insightCard = document.getElementById('insightCard');
    const insightBody = document.getElementById('insightBody');
    const insightTip = document.getElementById('insightTip');
    const qCounter = document.getElementById('qCounter');
    const currentScore = document.getElementById('currentScore');
    const progressFill = document.getElementById('progressFill');
    const nextBtn = document.getElementById('nextBtn');
    const quizStage = document.getElementById('quizStage');
    const resultsScreen = document.getElementById('resultsScreen');
    const finalScoreVal = document.getElementById('finalScoreVal');
    const gradeBadge = document.getElementById('gradeBadge');
    const resultTitle = document.getElementById('resultTitle');
    const resultMessage = document.getElementById('resultMessage');

    const letters = ['A', 'B', 'C', 'D'];

    function loadQuestion(index) {
      answered = false;
      const q = questions[index];
      
      qCategory.textContent = q.category;
      qAoTag.textContent = q.ao;
      qText.textContent = q.text;
      qCounter.textContent = `Question ${index + 1} of ${questions.length}`;
      currentScore.textContent = score;
      
      const pct = ((index + 1) / questions.length) * 100;
      progressFill.style.width = `${pct}%`;
      
      insightCard.classList.remove('open');
      nextBtn.disabled = true;

      optionsGrid.innerHTML = '';
      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.onclick = () => selectOption(optIdx);
        
        btn.innerHTML = `
          <span class="option-letter">${letters[optIdx]}</span>
          <span>${optText}</span>
        `;
        optionsGrid.appendChild(btn);
      });
    }

    function selectOption(selectedIdx) {
      if (answered) return;
      answered = true;
      
      const q = questions[currentQ];
      const buttons = optionsGrid.querySelectorAll('.option-btn');
      
      buttons.forEach(btn => btn.disabled = true);
      
      if (selectedIdx === q.correct) {
        buttons[selectedIdx].classList.add('correct');
        score++;
        currentScore.textContent = score;
      } else {
        buttons[selectedIdx].classList.add('wrong');
        buttons[q.correct].classList.add('correct');
      }

      insightBody.textContent = q.explanation;
      insightTip.innerHTML = `<strong>Revision Note:</strong> ${q.tip}`;
      insightCard.classList.add('open');

      nextBtn.disabled = false;
    }

    function nextQuestion() {
      if (currentQ < questions.length - 1) {
        currentQ++;
        loadQuestion(currentQ);
      } else {
        showResults();
      }
    }

    function showResults() {
      quizStage.style.display = 'none';
      resultsScreen.classList.add('open');
      finalScoreVal.textContent = score;

      const percentage = (score / questions.length) * 100;
      if (percentage >= 85) {
        gradeBadge.textContent = 'Grade 9 • Distinction Star';
        resultTitle.textContent = 'Spectacular Dance Music Specification Mastery!';
        resultMessage.textContent = 'You have demonstrated complete, exam-ready mastery of Electronic Dance Music production, from TB-303 filter resonance sweeps and TR-909 hybrid voices to Akai S950 timestretching, the JP-8000 supersaw, and sidechain ducking compression.';
      } else if (percentage >= 65) {
        gradeBadge.textContent = 'Grade 7-8 • Merit / Distinction';
        resultTitle.textContent = 'Strong Syllabus Understanding';
        resultMessage.textContent = 'Great foundation! Review the exact oscillator detuning mechanics of the Roland JP-8000 Supersaw, and the precise timestretching artifacts produced by the Akai S950 on the Amen break.';
      } else {
        gradeBadge.textContent = 'Revision Recommended';
        resultTitle.textContent = 'Targeted Revision Needed';
        resultMessage.textContent = 'Revisit the Electronic Dance Music study deck above to solidify TB-303 filter parameters, TR-909 voice architecture, 2-step garage swing, and Section B comparative criteria.';
      }
    }

    function restartQuiz() {
      currentQ = 0;
      score = 0;
      resultsScreen.classList.remove('open');
      quizStage.style.display = 'flex';
      loadQuestion(0);
    }

    // Initialize
    loadQuestion(0);
  </script>
</body>
</html>
