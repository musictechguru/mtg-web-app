    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {

    .next-btn {

    .next-btn:hover:not(:disabled) {

    /* Completion Screen */
    .summary-screen {
      display: none;

      padding: 40px 20px;
    }

    .summary-title {
      font-size: 32px;

    .score-circle {
      width: 140px;

    .score-val {

    .grade-badge {

    @keyframes fadeIn {

<body>

  <div class="quiz-container">
    <div class="quiz-header">
      <div class="topic-badge">
        <span>🌊</span>
        <span>Edexcel Component 3 &bull; Modulation Processing</span>
      </div>
      <div class="progress-pill" id="progressPill">Q 1 / 10</div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="quiz-body" id="quizBody">
      <div class="question-stem" id="questionStem">Loading Question...</div>

      <div class="options-grid" id="optionsGrid"></div>

      <div class="explanation-box" id="explanationBox">
        <h4>Examiner Specification Insight</h4>
        <p id="explanationText"></p>
      </div>

      <div class="quiz-footer">
        <div class="score-indicator" id="scoreIndicator">Score: 0 / 0</div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>
          <span>Next Question</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <!-- SUMMARY SCREEN -->
    <div class="summary-screen" id="summaryScreen">
      <div class="topic-badge" style="margin-bottom: 16px;">Assessment Complete</div>
      <h2 class="summary-title">Chorus Modulation &amp; Stereo Width Completed!</h2>
      <p style="color: var(--text-muted); font-size: 15px;">Official Pearson Edexcel Component 3 Specification Review</p>

      <div class="score-circle">
        <div class="score-val" id="finalScoreVal">10</div>
        <div class="score-max">/ 10 MARKS</div>
      </div>

      <div class="grade-badge" id="gradeBadge">Grade A*</div>

      <p id="feedbackMessage" style="color: var(--text-muted); font-size: 14px; max-width: 500px; margin: 0 auto 30px; line-height: 1.6;"></p>

      <button class="next-btn" onclick="restartQuiz()" style="margin: 0 auto;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        <span>Retake Specification Quiz</span>
      </button>
    </div>
  </div>

  <script>
    const questions = [{"q": "What is the typical time delay range employed in an analog BBD chorus circuit?", "options": ["0.1 ms to 0.8 ms", "1 ms to 10 ms", "15 ms to 35 ms", "100 ms to 350 ms"], "correct": 2, "expl": "The chorus effect operates in the 15ms to 35ms delay zone. Below 15ms, the ear perceives comb filtering (flanging); above 35ms, the ear separates the repeats as distinct slapback echoes. 15–35ms creates natural Haas doubling."}, {"q": "What physical phenomenon does an electronic chorus effect simulate?", "options": ["Multiple vocalists or instrumentalists performing the same part in unison with natural micro-timing and pitch fluctuations", "The resonant acoustic standing waves inside an organ pipe", "The Doppler effect of an ambulance siren passing by a stationary listener at high speed", "The electromagnetic induction of a vibrating steel guitar string"], "correct": 0, "expl": "When a choir or string ensemble plays in unison, no two performers ever play with 100% identical pitch or timing. These micro-discrepancies create natural acoustic phase beating and richness that chorus pedals replicate electronically."}, {"q": "How does modulating a delay line with a Low-Frequency Oscillator (LFO) produce pitch detuning in a chorus effect?", "options": ["By passing the signal through a digital harmonizer chip set to +12 cents", "By altering the input voltage to the amplifier's power transformer", "By boosting high midrange frequencies with a parametric bell curve", "By continuously speeding up and slowing down delay clock time, generating Doppler pitch shifts (sharp as delay shortens, flat as delay lengthens)"], "correct": 3, "expl": "Modulating the delay clock with an LFO causes the delay time to vary continuously. By the Doppler effect, shrinking delay time compresses waveforms (pitch shifts sharp); expanding delay time stretches waveforms (pitch shifts flat)."}, {"q": "What made the 1979 Roland Dimension D (SDD-320) studio rack unit legendary compared to standard chorus pedals?", "options": ["It generated aggressive jet-plane feedback sweeps using extreme regeneration", "It used dual cross-mixed delay lines with opposite LFO phases, creating dimensional stereo width with virtually zero audible pitch wobbling", "It was the first digital reverb processor with 24-bit resolution", "It was strictly a mono distortion unit for rock vocals"], "correct": 1, "expl": "The Dimension D used a dual-delay BBD architecture where phase-inverted modulated signals canceled out obvious pitch vibrato, leaving behind pure psychoacoustic stereo width, air, and dimension without noticeable chorus warble."}, {"q": "How does the classic Roland JC-120 (Jazz Chorus) amplifier generate true spatial chorus in physical room air?", "options": ["By rotating two mechanical speaker horns inside a wooden cabinet", "By applying a digital convolution impulse response to both 12-inch drivers", "By feeding the dry signal to one speaker driver and the pitch-vibrato signal to the second speaker driver, allowing acoustic mixing in the air", "By using all-pass filter stages wired in series with the preamp tubes"], "correct": 2, "expl": "The JC-120 has dual 60W power amps and two 12-inch speakers. In chorus mode, one speaker plays the dry unmodulated guitar, while the other speaker plays the pitch-modulated wet signal. The chorus interaction occurs organically in the room air."}, {"q": "On a chorus processor, what exact parameter does the Depth control govern?", "options": ["The overall RT60 reverberation decay time", "The width or intensity of the pitch deviation (how far sharp and flat the signal detunes in cents)", "The number of repeats in the feedback regeneration loop", "The low-pass filter cutoff frequency of the dry channel"], "correct": 1, "expl": "Depth (or Width) dictates the modulation amplitude of the LFO. High depth produces deep, dramatic pitch wobbling (seasick detuning); low depth produces subtle, elegant acoustic thickening."}, {"q": "Why does a chorus effect sound lush and shimmering rather than harsh and metallic like a flanger?", "options": ["Because chorus pedals use optical photocells instead of capacitor chips", "Because chorus eliminates all low frequencies below 500 Hz", "Because chorus only operates on monophonic audio signals", "Because chorus operates with a longer delay time (15–35ms) and avoids high feedback loops that produce resonant comb filter peaks"], "correct": 3, "expl": "Flangers use ultra-short delays (1–15ms) with high feedback, causing deep, harmonically related comb filtering (metallic resonance). Chorus uses longer delays (15–35ms) where individual comb notches blur together into smooth pitch movement."}, {"q": "Which iconic guitar track prominently features Kurt Cobain's Electro-Harmonix Small Clone analog chorus pedal?", "options": ["Nirvana &ndash; 'Come As You Are'", "The Beatles &ndash; 'Strawberry Fields Forever'", "Led Zeppelin &ndash; 'Whole Lotta Love'", "Pink Floyd &ndash; 'Money'"], "correct": 0, "expl": "Kurt Cobain plugged his Fender Jaguar into an Electro-Harmonix Small Clone analog chorus pedal for the famous clean, watery intro riff of 'Come As You Are' on Nevermind (1991), engineered by Butch Vig."}, {"q": "Why did vintage polyphonic synthesizers like the Roland Juno-6 and Juno-106 include built-in analog chorus circuits?", "options": ["To prevent the synthesizer from overloading mixing console inputs", "To thicken the sound of their single DCO (Digitally Controlled Oscillator) per voice, turning thin waves into massive, lush stereo ensembles", "To tune the synthesizer automatically to concert pitch A440", "To replace the need for an external amplifier cabinet"], "correct": 1, "expl": "To keep manufacturing costs low, the Juno series provided only one oscillator per voice. To prevent the synth from sounding thin, Roland built in a lush MN3009 BBD stereo chorus (Modes I and II) that transformed single saws into massive brass and string pads."}, {"q": "What potential mix hazard occurs if an aggressive stereo chorus with inverted phase on the sides is played back on a mono speaker (e.g. mobile phone)?", "options": ["The overall track tempo will fluctuate noticeably", "The delay time will double automatically", "The audio file will clip and distort digitally at 0 dBFS", "Destructive phase interference causes the chorused tracks to cancel out or become thin and distant"], "correct": 3, "expl": "If stereo widening is created by inverting the phase of the wet chorus on the right channel ($L + R$), summing the stereo channels to mono causes the opposing wet waveforms to cancel each other out ($+1 + -1 = 0$), losing presence."}];
    let currentIdx = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      answered = false;
      const q = questions[currentIdx];
      if (q && Array.isArray(q.options) && typeof q.correct === 'number') {
        const _correctOpt = q.options[q.correct];
        for (let _i = q.options.length - 1; _i > 0; _i--) {
          const _j = Math.floor(Math.random() * (_i + 1));
          const _tmp = q.options[_i];
          q.options[_i] = q.options[_j];
          q.options[_j] = _tmp;
        }
        q.correct = q.options.indexOf(_correctOpt);
      }

      // Update counters
      document.getElementById('progressPill').textContent = `Q ${currentIdx + 1} / ${questions.length}`;
      document.getElementById('progressFill').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
      document.getElementById('scoreIndicator').textContent = `Score: ${score} / ${currentIdx}`;

      // Update Question
      document.getElementById('questionStem').textContent = q.q;

      // Update Options
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span><span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        grid.appendChild(btn);
      });

      // Reset explanation & button
      document.getElementById('explanationBox').style.display = 'none';
      document.getElementById('nextBtn').disabled = true;
      document.getElementById('nextBtn').innerHTML = (currentIdx === questions.length - 1) 
        ? '<span>Finish Assessment</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>' 
        : '<span>Next Question</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
    }

    function selectOption(selectedIdx) {
      if (answered) return;
      answered = true;

      const q = questions[currentIdx];
      const buttons = document.querySelectorAll('.option-btn');

      buttons.forEach(btn => btn.disabled = true);

      if (selectedIdx === q.correct) {
        buttons[selectedIdx].classList.add('correct');
        score++;
      } else {
        buttons[selectedIdx].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
      }

      // Show explanation
      document.getElementById('explanationText').textContent = q.expl;
      document.getElementById('explanationBox').style.display = 'block';

      // Update score & enable next
      document.getElementById('scoreIndicator').textContent = `Score: ${score} / ${currentIdx + 1}`;
      document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
      if (currentIdx < questions.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        showSummary();
      }
    }

    function showSummary() {
      document.getElementById('quizBody').style.display = 'none';
      document.getElementById('summaryScreen').style.display = 'block';
      document.getElementById('finalScoreVal').textContent = score;

      const pct = (score / questions.length) * 100;
      const badge = document.getElementById('gradeBadge');
      const msg = document.getElementById('feedbackMessage');

      if (pct >= 80) {
        badge.style.background = 'rgba(52, 211, 153, 0.2)';
        badge.style.border = '1px solid #34d399';
        badge.style.color = '#34d399';
        badge.textContent = 'Grade A* / Distinction (Master Level)';
        msg.textContent = 'Outstanding specification knowledge! You have mastered the technical signal flow, parameters, and historical contexts of this effect.';
      } else if (pct >= 60) {
        badge.style.background = 'rgba(56, 189, 248, 0.2)';
        badge.style.border = '1px solid #38bdf8';
        badge.style.color = '#38bdf8';
        badge.textContent = 'Grade B (Solid Understanding)';
        msg.textContent = 'Good work! Review the technical formulas, routing distinctions, and parameter calculations to convert this into top-mark mastery.';
      } else {
        badge.style.background = 'rgba(239, 68, 68, 0.2)';
        badge.style.border = '1px solid #ef4444';
        badge.style.color = '#ef4444';
        badge.textContent = 'Needs Review';
        msg.textContent = 'Spend some time revisiting the interactive slide deck and technical homework guide to solidify your understanding of these core principles.';
      }
    }

    function restartQuiz() {
      currentIdx = 0;
      score = 0;
      document.getElementById('summaryScreen').style.display = 'none';
      document.getElementById('quizBody').style.display = 'flex';
      renderQuestion();
    }

    // Init
    renderQuestion();
  </script>
</body>
</html>
