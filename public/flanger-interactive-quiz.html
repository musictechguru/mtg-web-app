<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flanger Effect &amp; Comb Filtering • Edexcel Component 3 Specification Quiz | Music Tech Guru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080e1a;
      --bg-card: #0f172a;
      --bg-surface: #1e293b;
      --accent: #ec4899;
      --accent-glow: rgba(236, 72, 153, 0.35);
      --accent-green: #34d399;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(236, 72, 153, 0.35);
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .quiz-container {
      width: 100%;
      max-width: 880px;
      background: radial-gradient(circle at 50% 0%, rgba(236, 72, 153, 0.35) 0%, rgba(14, 17, 36, 0) 70%), var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 20px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(236, 72, 153, 0.35);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .quiz-header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
    }

    .topic-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--border-accent);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .progress-pill {
      font-family: monospace;
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg-surface);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a855f7);
      width: 10%;
      transition: width 0.3s ease;
    }

    .quiz-body {
      padding: 36px 32px;
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }

    .question-stem {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 24px;
      color: #ffffff;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--text-main);
      font-size: 14.5px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(4px);
    }

    .option-btn.correct {
      background: rgba(52, 211, 153, 0.15) !important;
      border-color: var(--accent-green) !important;
      color: #ffffff !important;
    }

    .option-btn.incorrect {
      background: rgba(239, 68, 68, 0.15) !important;
      border-color: var(--accent-red) !important;
      color: #ffffff !important;
    }

    .opt-letter {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .explanation-box {
      display: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 24px;
      animation: fadeIn 0.3s ease;
    }

    .explanation-box h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 6px;
      font-weight: 800;
    }

    .explanation-box p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .quiz-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
    }

    .score-indicator {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .next-btn {
      background: var(--accent);
      color: #030712;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .next-btn:hover:not(:disabled) {
      filter: brightness(1.15);
      transform: translateY(-2px);
    }

    .next-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Completion Screen */
    .summary-screen {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .summary-title {
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
      border: 3px solid var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 24px auto;
    }

    .score-val {
      font-size: 42px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
    }

    .score-max {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .grade-badge {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <div class="quiz-header">
      <div class="topic-badge">
        <span>✈️</span>
        <span>Edexcel Component 3 &bull; Modulation Processing</span>
      </div>
      <div class="progress-pill" id="progressPill">Q 1 / 10</div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="quiz-body" id="quizBody">
      <div class="question-stem" id="questionStem">Loading Question...</div>

      <div class="options-grid" id="optionsGrid"></div>

      <div class="explanation-box" id="explanationBox">
        <h4>Examiner Specification Insight</h4>
        <p id="explanationText"></p>
      </div>

      <div class="quiz-footer">
        <div class="score-indicator" id="scoreIndicator">Score: 0 / 0</div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>
          <span>Next Question</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <!-- SUMMARY SCREEN -->
    <div class="summary-screen" id="summaryScreen">
      <div class="topic-badge" style="margin-bottom: 16px;">Assessment Complete</div>
      <h2 class="summary-title">Flanger Effect &amp; Comb Filtering Completed!</h2>
      <p style="color: var(--text-muted); font-size: 15px;">Official Pearson Edexcel Component 3 Specification Review</p>

      <div class="score-circle">
        <div class="score-val" id="finalScoreVal">10</div>
        <div class="score-max">/ 10 MARKS</div>
      </div>

      <div class="grade-badge" id="gradeBadge">Grade A*</div>

      <p id="feedbackMessage" style="color: var(--text-muted); font-size: 14px; max-width: 500px; margin: 0 auto 30px; line-height: 1.6;"></p>

      <button class="next-btn" onclick="restartQuiz()" style="margin: 0 auto;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        <span>Retake Specification Quiz</span>
      </button>
    </div>
  </div>

  <script>
    const questions = [{"q": "What is the typical time delay range characteristic of an audio Flanger effect?", "options": ["0.01 ms to 0.1 ms", "1 ms to 15 ms", "20 ms to 50 ms", "100 ms to 500 ms"], "correct": 1, "expl": "Flanging requires an ultra-short micro delay between 1ms and 15ms. In this time window, the direct sound and delayed sound combine acoustically, creating a series of deep phase cancellations without being perceived as separate echoes."}, {"q": "What is the name of the distinct frequency response pattern produced across the audio spectrum by a flanger?", "options": ["High-pass shelf filter", "Comb filter", "All-pass phase ladder", "Parametric notch bell"], "correct": 1, "expl": "Summing an audio signal with an identical copy delayed by milliseconds creates destructive cancellation at frequencies where the signals are 180\u00b0 out of phase. The alternating peaks and troughs visually resemble the teeth of a hair comb, hence 'comb filter'."}, {"q": "Why is the effect called 'Flanging' in recording studio history?", "options": ["It was named after sound engineer John Flange at Olympic Studios", "Engineers physically pressed their thumb against the metal flange (outer rim) of a tape supply reel to temporarily delay it by milliseconds", "It references the metal flange bracket on an electric guitar bridge", "It refers to the flanged shape of an exponential acoustic speaker horn"], "correct": 1, "expl": "In 1960s studios, two identical tape recordings were played in synchronization on separate tape machines. By pressing a finger or thumb on the rim (flange) of one tape reel, the engineer slowed it down by fractions of a second, producing the sweeping phase cancellation."}, {"q": "Which 1967 British psychedelic rock song by The Small Faces was the first commercial pop record to prominently showcase tape flanging on the drums and master track?", "options": ["'A Day in the Life'", "'Itchycoo Park'", "'See Emily Play'", "'Purple Haze'"], "correct": 1, "expl": "Engineered by George Chkiantz at Olympic Studios in London, The Small Faces' 'Itchycoo Park' (1967) featured sweeping tape flanging across the drum fills and bridge, popularizing the dramatic jet-plane swoosh worldwide."}, {"q": "At what frequencies do the cancellation notches occur in a standard flanger comb filter when the delay time is tau (tau in seconds)?", "options": ["At random non-harmonic frequencies determined by capacitor tolerance", "At odd half-wavelength multiples: f = 1/(2*tau), 3/(2*tau), 5/(2*tau)...", "Strictly at the fundamental pitch of the bass instrument", "Exclusively above the Nyquist sampling frequency"], "correct": 1, "expl": "Destructive phase cancellation occurs whenever the delayed waveform arrives exactly half a wavelength out of phase with the original sound. This mathematical relationship produces a linear harmonic sequence of notches at odd multiples: $f = \\frac{1}{2\\tau}, \\frac{3}{2\\tau}, \\frac{5}{2\\tau}...$"}, {"q": "What sonic result is produced when high Feedback (Regeneration) is dialed in on a flanger pedal?", "options": ["The audio converts into distinct ping-pong slapback echoes", "The resonant peaks between the comb notches are reinforced, creating an aggressive, whistling metallic 'jet-plane whoosh'", "The low-end frequencies are boosted by +12 dB", "The flanger automatically sums the stereo channels to mono"], "correct": 1, "expl": "Feeding the delayed signal back into the flanger input amplifies the resonant peaks between the cancellation notches. As the LFO sweeps the delay time, these whistling peaks travel up and down the spectrum, mimicking an aircraft jet engine."}, {"q": "How does Negative Feedback (inverting the phase of the feedback signal) alter the tone of a flanger compared to positive feedback?", "options": ["It produces a hollow, eerie, metallic 'tubular' bite by canceling odd harmonics and shifting notch frequencies", "It completely silences the flanger effect through total phase cancellation", "It converts the flanger into an analog spring reverb", "It eliminates all pitch modulation"], "correct": 0, "expl": "Positive feedback emphasizes even harmonics, producing a warmer, woody resonance. Negative feedback phase-inverts the return, shifting the comb filter peaks to odd harmonic troughs, resulting in an eerie, aggressive, metallic hollow bite."}, {"q": "Which classic 1977 hard rock track by Heart prominently features galloping flanger modulation on Nancy Wilson's rhythm guitar?", "options": ["'Magic Man'", "'Barracuda'", "'Crazy on You'", "'Straight On'"], "correct": 1, "expl": "The heavy galloping E-string chug of Heart's 'Barracuda' (Little Queen, 1977) was processed with an analog flanger, giving the heavy guitar riff its iconic sweeping metallic growl and rhythmic motion."}, {"q": "What happens psychoacoustically if the delay time on a flanger is extended significantly beyond 35 milliseconds?", "options": ["The comb filtering effect disappears and the ear perceives a distinct, separate slapback echo", "The signal enters digital aliasing distortion", "The frequency notches become completely inaudible", "The audio drops in volume by -6 dB due to acoustic boundary loading"], "correct": 0, "expl": "Due to the Haas effect (precedence effect), delays under 30\u201335ms are integrated by the human brain as a single sound with altered timbral character (comb filtering). Beyond 35ms, the ear separates the two signals as distinct discrete echoes."}, {"q": "What is 'Through-Zero Flanging' (TZF), and why was it originally only possible using physical tape decks rather than electronic delay pedals?", "options": ["A technique where the flanger delay time hits exactly 0 milliseconds and the delayed signal momentarily leads ahead of the dry track, creating total phase cancellation silence", "A digital brickwall limiter that prevents delay levels from exceeding 0 dBFS", "A technique that mutes all frequencies below 0 Hz", "An analog circuit that grounds the chassis to eliminate mains ground hum"], "correct": 0, "expl": "In electronic delay circuits, delay time can approach zero but cannot be negative (the wet signal cannot precede the dry signal). On two tape machines, by slowing the reference tape, the delayed tape can actually pull ahead of it, crossing 'through zero' for complete cancellation silence."}];
    let currentIdx = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      answered = false;
      const q = questions[currentIdx];

      // Update counters
      document.getElementById('progressPill').textContent = `Q ${currentIdx + 1} / ${questions.length}`;
      document.getElementById('progressFill').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
      document.getElementById('scoreIndicator').textContent = `Score: ${score} / ${currentIdx}`;

      // Update Question
      document.getElementById('questionStem').textContent = q.q;

      // Update Options
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span><span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        grid.appendChild(btn);
      });

      // Reset explanation & button
      document.getElementById('explanationBox').style.display = 'none';
      document.getElementById('nextBtn').disabled = true;
      document.getElementById('nextBtn').innerHTML = (currentIdx === questions.length - 1) 
        ? '<span>Finish Assessment</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>' 
        : '<span>Next Question</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
    }

    function selectOption(selectedIdx) {
      if (answered) return;
      answered = true;

      const q = questions[currentIdx];
      const buttons = document.querySelectorAll('.option-btn');

      buttons.forEach(btn => btn.disabled = true);

      if (selectedIdx === q.correct) {
        buttons[selectedIdx].classList.add('correct');
        score++;
      } else {
        buttons[selectedIdx].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
      }

      // Show explanation
      document.getElementById('explanationText').textContent = q.expl;
      document.getElementById('explanationBox').style.display = 'block';

      // Update score & enable next
      document.getElementById('scoreIndicator').textContent = `Score: ${score} / ${currentIdx + 1}`;
      document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
      if (currentIdx < questions.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        showSummary();
      }
    }

    function showSummary() {
      document.getElementById('quizBody').style.display = 'none';
      document.getElementById('summaryScreen').style.display = 'block';
      document.getElementById('finalScoreVal').textContent = score;

      const pct = (score / questions.length) * 100;
      const badge = document.getElementById('gradeBadge');
      const msg = document.getElementById('feedbackMessage');

      if (pct >= 80) {
        badge.style.background = 'rgba(52, 211, 153, 0.2)';
        badge.style.border = '1px solid #34d399';
        badge.style.color = '#34d399';
        badge.textContent = 'Grade A* / Distinction (Master Level)';
        msg.textContent = 'Outstanding specification knowledge! You have mastered the technical signal flow, parameters, and historical contexts of this effect.';
      } else if (pct >= 60) {
        badge.style.background = 'rgba(56, 189, 248, 0.2)';
        badge.style.border = '1px solid #38bdf8';
        badge.style.color = '#38bdf8';
        badge.textContent = 'Grade B (Solid Understanding)';
        msg.textContent = 'Good work! Review the technical formulas, routing distinctions, and parameter calculations to convert this into top-mark mastery.';
      } else {
        badge.style.background = 'rgba(239, 68, 68, 0.2)';
        badge.style.border = '1px solid #ef4444';
        badge.style.color = '#ef4444';
        badge.textContent = 'Needs Review';
        msg.textContent = 'Spend some time revisiting the interactive slide deck and technical homework guide to solidify your understanding of these core principles.';
      }
    }

    function restartQuiz() {
      currentIdx = 0;
      score = 0;
      document.getElementById('summaryScreen').style.display = 'none';
      document.getElementById('quizBody').style.display = 'flex';
      renderQuestion();
    }

    // Init
    renderQuestion();
  </script>
</body>
</html>
