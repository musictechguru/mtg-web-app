<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delay &amp; Echo Effects • Edexcel Component 3 Specification Quiz | Music Tech Guru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080e1a;
      --bg-card: #0f172a;
      --bg-surface: #1e293b;
      --accent: #00C1F0;
      --accent-glow: rgba(0, 193, 240, 0.35);
      --accent-green: #34d399;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(0, 193, 240, 0.35);
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .quiz-container {
      width: 100%;
      max-width: 880px;
      background: radial-gradient(circle at 50% 0%, rgba(0, 193, 240, 0.35) 0%, rgba(14, 17, 36, 0) 70%), var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 20px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 193, 240, 0.35);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .quiz-header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
    }

    .topic-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--border-accent);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .progress-pill {
      font-family: monospace;
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg-surface);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      width: 100%;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a855f7);
      width: 10%;
      transition: width 0.3s ease;
    }

    .quiz-body {
      padding: 36px 32px;
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }

    .question-stem {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 24px;
      color: #ffffff;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--text-main);
      font-size: 14.5px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(4px);
    }

    .option-btn.correct {
      background: rgba(52, 211, 153, 0.15) !important;
      border-color: var(--accent-green) !important;
      color: #ffffff !important;
    }

    .option-btn.incorrect {
      background: rgba(239, 68, 68, 0.15) !important;
      border-color: var(--accent-red) !important;
      color: #ffffff !important;
    }

    .opt-letter {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .explanation-box {
      display: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 24px;
      animation: fadeIn 0.3s ease;
    }

    .explanation-box h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 6px;
      font-weight: 800;
    }

    .explanation-box p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .quiz-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
    }

    .score-indicator {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .next-btn {
      background: var(--accent);
      color: #030712;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .next-btn:hover:not(:disabled) {
      filter: brightness(1.15);
      transform: translateY(-2px);
    }

    .next-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Completion Screen */
    .summary-screen {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .summary-title {
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
      border: 3px solid var(--accent);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 24px auto;
    }

    .score-val {
      font-size: 42px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
    }

    .score-max {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .grade-badge {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <div class="quiz-header">
      <div class="topic-badge">
        <span>🔁</span>
        <span>Edexcel Component 3 &bull; Time-Based Processing</span>
      </div>
      <div class="progress-pill" id="progressPill">Q 1 / 10</div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="quiz-body" id="quizBody">
      <div class="question-stem" id="questionStem">Loading Question...</div>

      <div class="options-grid" id="optionsGrid"></div>

      <div class="explanation-box" id="explanationBox">
        <h4>Examiner Specification Insight</h4>
        <p id="explanationText"></p>
      </div>

      <div class="quiz-footer">
        <div class="score-indicator" id="scoreIndicator">Score: 0 / 0</div>
        <button class="next-btn" id="nextBtn" onclick="nextQuestion()" disabled>
          <span>Next Question</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>

    <!-- SUMMARY SCREEN -->
    <div class="summary-screen" id="summaryScreen">
      <div class="topic-badge" style="margin-bottom: 16px;">Assessment Complete</div>
      <h2 class="summary-title">Delay &amp; Echo Effects Completed!</h2>
      <p style="color: var(--text-muted); font-size: 15px;">Official Pearson Edexcel Component 3 Specification Review</p>

      <div class="score-circle">
        <div class="score-val" id="finalScoreVal">10</div>
        <div class="score-max">/ 10 MARKS</div>
      </div>

      <div class="grade-badge" id="gradeBadge">Grade A*</div>

      <p id="feedbackMessage" style="color: var(--text-muted); font-size: 14px; max-width: 500px; margin: 0 auto 30px; line-height: 1.6;"></p>

      <button class="next-btn" onclick="restartQuiz()" style="margin: 0 auto;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        <span>Retake Specification Quiz</span>
      </button>
    </div>
  </div>

  <script>
    const questions = [{"q": "What primary technology was used at Sun Records in the 1950s to create the signature slapback echo on Elvis Presley's vocal tracks?", "options": ["An analog BBD solid-state delay pedal", "An EMT 140 suspended steel plate with pickup coils", "A reel-to-reel tape machine utilizing the physical gap between record and playback heads", "A digital DSP processor synced to project MIDI clock"], "correct": 2, "expl": "Sam Phillips pioneered slapback delay at Sun Studio using two reel-to-reel tape decks. The physical distance between the record and playback head at 15 ips produced a single discrete repeat between 75ms and 130ms with zero feedback."}, {"q": "In a project with a tempo of 120 BPM, what is the exact delay time in milliseconds required to generate a dotted-eighth note repeat?", "options": ["375 ms", "250 ms", "500 ms", "750 ms"], "correct": 0, "expl": "At 120 BPM, a quarter note is (60,000 / 120) = 500ms. An eighth note is 250ms. A dotted-eighth note is equal to three sixteenth notes (1.5 x eighth note), so: 250ms x 1.5 = 375ms (or 500ms x 0.75 = 375ms)."}, {"q": "What occurs when the Feedback (Regeneration) control on an analog delay unit is turned past 100%?", "options": ["The delayed repeats drop in pitch by one octave", "The delay time automatically halves", "The digital converter mutes the channel to prevent digital clipping", "The signal enters runaway self-oscillation, creating an escalating saturated wall of sound"], "correct": 3, "expl": "Feedback controls the amount of output returned to the input. Setting feedback to 100% or above feeds back more energy than is lost, forcing the analog circuit into runaway self-oscillation and non-linear harmonic saturation."}, {"q": "How does an analog Bucket Brigade Device (BBD) delay line store and delay an audio signal without magnetic tape?", "options": ["By digitizing the audio into 16-bit binary samples in flash memory", "By passing analog electrical charge packets across a chain of microscopic capacitors clocked by an oscillator", "By reflecting sound waves inside an oil-filled cylindrical metal canister", "By phase-shifting frequencies through active all-pass RC filters"], "correct": 1, "expl": "BBD chips (like the Panasonic MN3005/MN3007) function like a human firefighting bucket line: analog voltage charges are passed from one capacitor to the next at each clock pulse, introducing delay without moving mechanical parts."}, {"q": "What is the primary acoustic purpose of applying High-Frequency Damping inside a delay feedback loop?", "options": ["To eliminate bass frequencies and stop the kick drum from echoing", "To invert the phase of every second repeat for pseudo-stereo widening", "To progressively filter out treble on each repeat, mimicking natural air dissipation and keeping the dry vocal intelligible", "To shorten the delay time dynamically as the vocalist gets louder"], "correct": 2, "expl": "In physical acoustic spaces, high frequencies are absorbed by air and room surfaces much faster than low frequencies. High damping filters successive repeats, preventing bright high-frequency clutter from competing with the lead vocal."}, {"q": "Which mechanical factors cause the characteristic warmth and subtle pitch modulation in vintage tape echo units (e.g., Roland Space Echo RE-201)?", "options": ["Clock jitter in the analog-to-digital converter", "Motor speed fluctuations, pinch roller friction, and tape stretching known as wow and flutter", "Resonant notches caused by all-pass phase cancellation", "Quantization distortion from 8-bit resolution"], "correct": 1, "expl": "Because magnetic tape is physically pulled past heads by mechanical motors and rubber rollers, microscopic speed variations occur continuously. These slow (wow) and fast (flutter) speed fluctuations modulate delay time, producing musical pitch chorus warmth."}, {"q": "Why is it standard studio practice to route delay as a parallel Auxiliary Send / Return rather than an inline Channel Insert?", "options": ["Because delay units cannot accept line-level audio signals", "To eliminate the need for feedback parameter adjustment", "Because channel inserts automatically force the delay to 100% wet mix", "To allow multiple channels to share a single delay unit, keeping dry signals uncolored while controlling the wet return level"], "correct": 3, "expl": "Auxiliary send routing preserves 100% of the original track's transient punch and clarity on its channel strip, while sending variable amounts to a shared delay bus (set to 100% wet), which saves DSP and creates cohesive mix depth."}, {"q": "What is the defining operational feature of a stereo Ping-Pong delay?", "options": ["Repeats alternate consecutively between the hard left and hard right stereo channels", "Repeats are pitch-shifted up by a major third on every bounce", "The delay time dynamically tracks the tempo of the drummer's hi-hat", "Repeats are filtered alternately with high-pass and low-pass curves"], "correct": 0, "expl": "In a ping-pong delay, delayed repeats are fed back cross-wise into opposite channels, bouncing back and forth across the stereo spectrum (Left &rarr; Right &rarr; Left &rarr; Right), creating wide spatial movement."}, {"q": "How does a Multi-Tap delay differ from a conventional single delay line?", "options": ["It uses multiple physical tape loops running at different motor speeds simultaneously", "A single delay line has multiple pickup 'taps' that output repeats at distinct rhythmic subdivisions and pan positions", "It requires the user to tap the tempo footswitch multiple times per measure", "It converts delay repeats into synthesizer MIDI notes"], "correct": 1, "expl": "Multi-tap delays allow multiple output points along a single delay buffer. Each 'tap' can have its own independent volume, time offset, filter cutoff, and stereo pan position, enabling complex rhythmic polyrhythms from a single dry note."}, {"q": "In modern vocal and pop production, how does a Ducking Delay operate?", "options": ["It applies a high-frequency band-pass filter to make vocals sound like a telephone", "It gates all audio below a -40 dBFS noise threshold", "It randomly modulates delay time to create tape flanging", "A sidechained compressor attenuates the delay level while the lead vocal is singing, allowing repeats to swell up during pauses"], "correct": 3, "expl": "Ducking delay uses a sidechain compressor keyed to the lead vocal. While the artist sings, the delay volume is ducked by 6–12 dB to prevent muddying lyrical intelligibility. The moment the vocal pauses, the delay blooms to fill the empty space."}];
    let currentIdx = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      answered = false;
      const q = questions[currentIdx];
      if (q && Array.isArray(q.options) && typeof q.correct === 'number') {
        const _correctOpt = q.options[q.correct];
        for (let _i = q.options.length - 1; _i > 0; _i--) {
          const _j = Math.floor(Math.random() * (_i + 1));
          const _tmp = q.options[_i];
          q.options[_i] = q.options[_j];
          q.options[_j] = _tmp;
        }
        q.correct = q.options.indexOf(_correctOpt);
      }

      // Update counters
      document.getElementById('progressPill').textContent = `Q ${currentIdx + 1} / ${questions.length}`;
      document.getElementById('progressFill').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
      document.getElementById('scoreIndicator').textContent = `Score: ${score} / ${currentIdx}`;

      // Update Question
      document.getElementById('questionStem').textContent = q.q;

      // Update Options
      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span><span>${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        grid.appendChild(btn);
      });

      // Reset explanation & button
      document.getElementById('explanationBox').style.display = 'none';
      document.getElementById('nextBtn').disabled = true;
      document.getElementById('nextBtn').innerHTML = (currentIdx === questions.length - 1) 
        ? '<span>Finish Assessment</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>' 
        : '<span>Next Question</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>';
    }

    function selectOption(selectedIdx) {
      if (answered) return;
      answered = true;

      const q = questions[currentIdx];
      const buttons = document.querySelectorAll('.option-btn');

      buttons.forEach(btn => btn.disabled = true);

      if (selectedIdx === q.correct) {
        buttons[selectedIdx].classList.add('correct');
        score++;
      } else {
        buttons[selectedIdx].classList.add('incorrect');
        buttons[q.correct].classList.add('correct');
      }

      // Show explanation
      document.getElementById('explanationText').textContent = q.expl;
      document.getElementById('explanationBox').style.display = 'block';

      // Update score & enable next
      document.getElementById('scoreIndicator').textContent = `Score: ${score} / ${currentIdx + 1}`;
      document.getElementById('nextBtn').disabled = false;
    }

    function nextQuestion() {
      if (currentIdx < questions.length - 1) {
        currentIdx++;
        renderQuestion();
      } else {
        showSummary();
      }
    }

    function showSummary() {
      document.getElementById('quizBody').style.display = 'none';
      document.getElementById('summaryScreen').style.display = 'block';
      document.getElementById('finalScoreVal').textContent = score;

      const pct = (score / questions.length) * 100;
      const badge = document.getElementById('gradeBadge');
      const msg = document.getElementById('feedbackMessage');

      if (pct >= 80) {
        badge.style.background = 'rgba(52, 211, 153, 0.2)';
        badge.style.border = '1px solid #34d399';
        badge.style.color = '#34d399';
        badge.textContent = 'Grade A* / Distinction (Master Level)';
        msg.textContent = 'Outstanding specification knowledge! You have mastered the technical signal flow, parameters, and historical contexts of this effect.';
      } else if (pct >= 60) {
        badge.style.background = 'rgba(56, 189, 248, 0.2)';
        badge.style.border = '1px solid #38bdf8';
        badge.style.color = '#38bdf8';
        badge.textContent = 'Grade B (Solid Understanding)';
        msg.textContent = 'Good work! Review the technical formulas, routing distinctions, and parameter calculations to convert this into top-mark mastery.';
      } else {
        badge.style.background = 'rgba(239, 68, 68, 0.2)';
        badge.style.border = '1px solid #ef4444';
        badge.style.color = '#ef4444';
        badge.textContent = 'Needs Review';
        msg.textContent = 'Spend some time revisiting the interactive slide deck and technical homework guide to solidify your understanding of these core principles.';
      }
    }

    function restartQuiz() {
      currentIdx = 0;
      score = 0;
      document.getElementById('summaryScreen').style.display = 'none';
      document.getElementById('quizBody').style.display = 'flex';
      renderQuestion();
    }

    // Init
    renderQuestion();
  </script>
</body>
</html>
