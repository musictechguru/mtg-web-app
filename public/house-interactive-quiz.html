        correct: 0,
        explanation: "This contrast defines Section B: early Chicago house was low-budget DIY (standalone drum machines, 4-track tape, manual filter tweaking, acetate pressings). 1990s house was high-budget commercial production (computer MIDI sequencing, PCM workstations like M1, SSL consoles, DAT mastering, and international CD singles).",
        tip: "Section B Essay Matrix: 1980s Chicago DIY (TR-808/909, tape, vinyl) vs 1990s Commercial (Atari MIDI, Korg M1, SSL consoles, DAT masters)."
      }
    ];

    let currentQ = 0;
    let score = 0;
    let answered = false;

    const qText = document.getElementById('qText');
    const qCategory = document.getElementById('qCategory');
    const qAoTag = document.getElementById('qAoTag');
    const optionsGrid = document.getElementById('optionsGrid');
    const insightCard = document.getElementById('insightCard');
    const insightBody = document.getElementById('insightBody');
    const insightTip = document.getElementById('insightTip');
    const qCounter = document.getElementById('qCounter');
    const currentScore = document.getElementById('currentScore');
    const progressFill = document.getElementById('progressFill');
    const nextBtn = document.getElementById('nextBtn');
    const quizStage = document.getElementById('quizStage');
    const resultsScreen = document.getElementById('resultsScreen');
    const finalScoreVal = document.getElementById('finalScoreVal');
    const gradeBadge = document.getElementById('gradeBadge');
    const resultTitle = document.getElementById('resultTitle');
    const resultMessage = document.getElementById('resultMessage');

    const letters = ['A', 'B', 'C', 'D'];

    function loadQuestion(index) {
      answered = false;
      const q = questions[index];
      
      qCategory.textContent = q.category;
      qAoTag.textContent = q.ao;
      qText.textContent = q.text;
      qCounter.textContent = `Question ${index + 1} of ${questions.length}`;
      currentScore.textContent = score;
      
      const pct = ((index + 1) / questions.length) * 100;
      progressFill.style.width = `${pct}%`;
      
      insightCard.classList.remove('open');
      nextBtn.disabled = true;

      optionsGrid.innerHTML = '';
      q.options.forEach((optText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.onclick = () => selectOption(optIdx);
        
        btn.innerHTML = `
          <span class="option-letter">${letters[optIdx]}</span>
          <span>${optText}</span>
        `;
        optionsGrid.appendChild(btn);
      });
    }

    function selectOption(selectedIdx) {
      if (answered) return;
      answered = true;
      
      const q = questions[currentQ];
      const buttons = optionsGrid.querySelectorAll('.option-btn');
      
      buttons.forEach(btn => btn.disabled = true);
      
      if (selectedIdx === q.correct) {
        buttons[selectedIdx].classList.add('correct');
        score++;
        currentScore.textContent = score;
      } else {
        buttons[selectedIdx].classList.add('wrong');
        buttons[q.correct].classList.add('correct');
      }

      insightBody.textContent = q.explanation;
      insightTip.innerHTML = `<strong>Revision Note:</strong> ${q.tip}`;
      insightCard.classList.add('open');

      nextBtn.disabled = false;
    }

    function nextQuestion() {
      if (currentQ < questions.length - 1) {
        currentQ++;
        loadQuestion(currentQ);
      } else {
        showResults();
      }
    }

    function showResults() {
      quizStage.style.display = 'none';
      resultsScreen.classList.add('open');
      finalScoreVal.textContent = score;

      const percentage = (score / questions.length) * 100;
      if (percentage >= 85) {
        gradeBadge.textContent = 'Grade 9 • Distinction Star';
        resultTitle.textContent = 'Extraordinary House Music Specification Mastery!';
        resultMessage.textContent = 'You have demonstrated complete, exam-ready command of the History of House Music: The Warehouse, TR-909 rhythm science, TB-303 resonant filter sweeps, Korg M1 Organ 2 basslines, Diva house vocal engineering, and French Touch sidechain dynamics.';
      } else if (percentage >= 65) {
        gradeBadge.textContent = 'Grade 7-8 • Merit / Distinction';
        resultTitle.textContent = 'Strong Syllabus Understanding';
        resultMessage.textContent = 'Great foundation! Review the exact synthesis architecture of the Roland TR-909 (analog vs PCM voices), and the precise role of the Korg M1 in 1990s house basslines.';
      } else {
        gradeBadge.textContent = 'Revision Recommended';
        resultTitle.textContent = 'Targeted Revision Needed';
        resultMessage.textContent = 'Revisit the History of House Music study deck above to solidify early Chicago labels (Trax/DJ International), Marshall Jefferson piano stabs, and Section B comparative criteria.';
      }
    }

    function restartQuiz() {
      currentQ = 0;
      score = 0;
      resultsScreen.classList.remove('open');
      quizStage.style.display = 'flex';
      loadQuestion(0);
    }

    // Initialize
    loadQuestion(0);
  </script>
</body>
</html>
