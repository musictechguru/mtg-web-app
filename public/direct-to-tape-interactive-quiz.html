  <script>
    const questions = [
  {
    "category": "Tape Mechanics",
    "ao": "AO3: Magnetic Recording Physics",

    "correct": "The record head's electromagnet aligns microscopic iron-oxide particles along the tape ribbon into magnetic domains matching the input audio AC waveform",
    "wrong": [
      "The record head mechanically cuts a continuous microscopic spiral groove into a plastic lacquer coating layered across the flexible tape ribbon backing",

    "explanation": "Reel-to-reel tape consists of a plastic film base coated with magnetic iron-oxide or ferric particles. As the tape passes the record head's magnetic gap, the audio signal's fluctuating electromagnetic field magnetizes these particles into corresponding polar patterns."

  {

  {

  {

  {

  {

    "wrong": [
      "In an anechoic soundstage at Bell Telephone Laboratories, using custom artificial digital spring reverberation networks applied in post-production",
      "In a residential bedroom in Nashville, Tennessee, using sound-on-sound multi-track cassette ping-pong bouncing with natural room reflections",
      "In the basement echo vaults of Abbey Road Studios in London, using newly developed synthetic algorithmic EMT plate reverb hardware processors"
    ],
    "explanation": "Produced by Milt Gabler in April 1954, 'Rock Around the Clock' was cut live at Decca's Pythian Temple (a converted ballroom with high plaster ceilings and stone acoustics) direct to mono tape, capturing the explosive room slap and live energy."
  },
  {
    "category": "Outboard Processing",
    "ao": "AO3: Pultec Equalisation",
    "text": "What unique equalization capability makes the 1950s Pultec EQP-1A tube program equalizer famous among recording engineers?",
    "correct": "The ability to simultaneously boost and attenuate the same low frequency, creating a deep resonant low-end boost with a clarifying scoop in the muddy low-mids",
    "wrong": [
      "An integrated brickwall digital high-pass filter that eliminates all subsonic frequencies below 20 Hz with an ultra-steep 96 dB/octave attenuation curve",
      "A frequency-tracking dynamic expansion circuit that automatically detects and follows the moving fundamental pitch of an electric bass guitar in real time",
      "A motorized parametric notch-filtering system containing 32 motorized faders that sweep through resonant frequencies to suppress feedback frequencies"
    ],
    "explanation": "Due to slightly different curves and circuit impedances for the boost and attenuation controls on the Pultec EQP-1A, boosting and attenuating the same frequency creates a resonant low-end punch while simultaneously carving out muddiness around 200\u2013400 Hz."
  }
];

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    let currentQ = 0;
    let score = 0;
    let answered = false;
    let currentOptions = [];

    const qText = document.getElementById('qText');
    const qCategory = document.getElementById('qCategory');
    const qAoTag = document.getElementById('qAoTag');
    const optionsGrid = document.getElementById('optionsGrid');
    const insightCard = document.getElementById('insightCard');
    const insightBody = document.getElementById('insightBody');
    const insightTip = document.getElementById('insightTip');
    const qCounter = document.getElementById('qCounter');
    const currentScore = document.getElementById('currentScore');
    const progressFill = document.getElementById('progressFill');
    const nextBtn = document.getElementById('nextBtn');
    const quizStage = document.getElementById('quizStage');
    const resultsScreen = document.getElementById('resultsScreen');
    const finalScoreVal = document.getElementById('finalScoreVal');
    const gradeBadge = document.getElementById('gradeBadge');
    const resultTitle = document.getElementById('resultTitle');
    const resultMessage = document.getElementById('resultMessage');
    const letters = ['A', 'B', 'C', 'D'];

    function loadQuestion(index) {
      answered = false;
      const q = questions[index];
      qText.innerHTML = q.text;
      qCategory.innerText = q.category;
      qAoTag.innerText = q.ao;
      qCounter.innerText = `Question ${index + 1} of ${questions.length}`;
      currentScore.innerText = `Score: ${score}/${questions.length}`;
      progressFill.style.width = `${((index) / questions.length) * 100}%`;

      insightCard.classList.remove('show');
      nextBtn.disabled = true;

      // SHUFFLE OPTIONS so correct answer is NOT always in the same position
      currentOptions = shuffle([
        { text: q.correct, ok: true },
        ...q.wrong.map(w => ({ text: w, ok: false }))
      ]);

      optionsGrid.innerHTML = '';
      currentOptions.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${letters[idx]}</span><span>${opt.text}</span>`;
        btn.onclick = () => selectOption(idx, btn);
        optionsGrid.appendChild(btn);
      });
    }

    function selectOption(idx, btn) {
      if (answered) return;
      answered = true;

      const q = questions[currentQ];
      const isCorrect = currentOptions[idx].ok;
      const btns = optionsGrid.querySelectorAll('.option-btn');

      btns.forEach((b, i) => {
        b.disabled = true;
        if (currentOptions[i].ok) {
          b.classList.add('correct');
        }
      });

      if (isCorrect) {
        btn.classList.add('correct');
        score++;
      } else {
        btn.classList.add('wrong');
      }

      currentScore.innerText = `Score: ${score}/${questions.length}`;
      insightBody.innerHTML = q.explanation;
      insightTip.innerHTML = `<strong>Specification Tip:</strong> ${q.tip}`;
      insightCard.classList.add('show');

      nextBtn.disabled = false;
      if (currentQ === questions.length - 1) {
        nextBtn.innerText = 'View Results & Analysis';
      }
    }

    function handleNext() {
      if (currentQ < questions.length - 1) {
        currentQ++;
        loadQuestion(currentQ);
      } else {
        showResults();
      }
    }

    function showResults() {
      quizStage.style.display = 'none';
      resultsScreen.style.display = 'block';
      progressFill.style.width = '100%';

      finalScoreVal.innerText = `${score} / ${questions.length}`;
      const pct = (score / questions.length) * 100;

      if (pct >= 80) {
        gradeBadge.innerText = 'Grade A* / A - Master of Folk Technology';
        gradeBadge.style.color = '#fbbf24';
        gradeBadge.style.borderColor = '#fbbf24';
        resultTitle.innerText = 'Outstanding Performance!';
        resultMessage.innerText = 'You demonstrated comprehensive mastery of acoustic folk recording, stereo transducer arrays, microphone positioning, and historical context.';
      } else if (pct >= 60) {
        gradeBadge.innerText = 'Grade B / C - Solid Knowledge Base';
        gradeBadge.style.color = '#f59e0b';
        gradeBadge.style.borderColor = '#f59e0b';
        resultTitle.innerText = 'Strong Foundation!';
        resultMessage.innerText = 'Good grasp of core concepts. Review the 12th fret acoustic placement and stereo microphone configurations to secure the highest marks.';
      } else {
        gradeBadge.innerText = 'Revision Required';
        gradeBadge.style.color = '#f87171';
        gradeBadge.style.borderColor = '#f87171';
        resultTitle.innerText = 'Keep Revising!';
        resultMessage.innerText = 'Use the 14-slide presentation deck to reinforce your understanding of acoustic capture, vintage equipment, and key artists.';
      }
    }

    function restartQuiz() {
      currentQ = 0;
      score = 0;
      nextBtn.innerText = 'Next Question &rarr;';
      quizStage.style.display = 'block';
      resultsScreen.style.display = 'none';
      loadQuestion(0);
    }

    window.onload = () => loadQuestion(0);
</script>
