<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Cardioid Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cardioid Fill Gradient -->
    <radialGradient id="cardioid-radial" cx="205" cy="167.5" r="135" fx="205" fy="167.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </radialGradient>

    <!-- Marker Arrow -->
    <marker id="arrowhead-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow-badge)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">CARDIOID POLAR PATTERN: SENSITIVITY &amp; NULL ANGLES</text>
    <rect x="525" y="6" width="135" height="22" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="0.8" />
    <text x="592" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">UNIDIRECTIONAL</text>
  </g>

  <!-- LEFT: POLAR RADAR GRAPH -->
  <g id="polar-radar">
    <!-- Radar outer boundary plate -->
    <circle cx="205" cy="235" r="160" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />

    <!-- Concentric dB Circles -->
    <!-- 0 dB circle (R = 135) -->
    <circle cx="205" cy="235" r="135" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3" />
    <!-- -6 dB circle (r = R * 0.75 = 101.25) -->
    <circle cx="205" cy="235" r="101.3" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" />
    <!-- -12 dB circle (r = R * 0.5 = 67.5) -->
    <circle cx="205" cy="235" r="67.5" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" />
    <!-- -18 dB circle (r = R * 0.25 = 33.75) -->
    <circle cx="205" cy="235" r="33.8" fill="none" stroke="#1e293b" stroke-width="1" />

    <!-- dB Labels along 0 deg axis -->
    <rect x="208" y="102" width="32" height="13" rx="2" fill="#0f172a" fill-opacity="0.8" />
    <text x="211" y="112" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">0 dB</text>

    <text x="211" y="144.8" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">-6 dB</text>
    <text x="211" y="178.5" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">-12 dB</text>
    <text x="211" y="212.3" fill="#475569" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">-18 dB</text>

    <!-- Radial Spokes (every 30 deg) -->
    <line x1="205" y1="235" x2="280.0" y2="105.1" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />
    <line x1="205" y1="235" x2="334.9" y2="160.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />
    <line x1="205" y1="235" x2="334.9" y2="310.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />
    <line x1="205" y1="235" x2="280.0" y2="364.9" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />
    <line x1="205" y1="235" x2="130.0" y2="364.9" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />
    <line x1="205" y1="235" x2="75.1" y2="310.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />
    <line x1="205" y1="235" x2="75.1" y2="160.0" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />
    <line x1="205" y1="235" x2="130.0" y2="105.1" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" />

    <!-- Primary Axes: 0-180 and 90-270 -->
    <line x1="205" y1="80" x2="205" y2="390" stroke="#334155" stroke-width="1.2" />
    <line x1="50" y1="235" x2="360" y2="235" stroke="#334155" stroke-width="1.2" />

    <!-- Cardioid Pick-Up Region (Heart Shape) -->
    <path d="M 205.00 100.00 L 209.71 100.12 L 214.41 100.49 L 219.07 101.11 L 223.70 101.96 L 228.26 103.06 L 232.76 104.39 L 237.17 105.96 L 241.49 107.74 L 245.70 109.75 L 249.78 111.97 L 253.73 114.39 L 257.54 117.00 L 261.19 119.80 L 264.67 122.78 L 267.98 125.92 L 271.10 129.21 L 274.04 132.65 L 276.77 136.21 L 279.30 139.89 L 281.63 143.68 L 283.73 147.56 L 285.62 151.52 L 287.28 155.54 L 288.73 159.61 L 289.95 163.72 L 290.94 167.86 L 291.71 172.00 L 292.25 176.15 L 292.58 180.28 L 292.69 184.38 L 292.58 188.43 L 292.26 192.44 L 291.75 196.38 L 291.03 200.24 L 290.12 204.02 L 289.03 207.70 L 287.77 211.27 L 286.34 214.72 L 284.75 218.05 L 283.02 221.24 L 281.15 224.30 L 279.15 227.21 L 277.03 229.96 L 274.81 232.56 L 272.50 235.00 L 270.10 237.27 L 267.64 239.38 L 265.11 241.32 L 262.54 243.09 L 259.93 244.69 L 257.30 246.12 L 254.65 247.38 L 252.00 248.48 L 249.36 249.41 L 246.74 250.19 L 244.14 250.81 L 241.58 251.29 L 239.07 251.62 L 236.62 251.81 L 234.23 251.88 L 231.91 251.81 L 229.67 251.64 L 227.51 251.35 L 225.44 250.97 L 223.47 250.50 L 221.60 249.94 L 219.83 249.32 L 218.16 248.63 L 216.60 247.88 L 215.15 247.10 L 213.81 246.28 L 212.58 245.43 L 211.45 244.57 L 210.44 243.70 L 209.52 242.83 L 208.71 241.98 L 207.99 241.14 L 207.37 240.33 L 206.84 239.56 L 206.39 238.83 L 206.02 238.14 L 205.72 237.51 L 205.49 236.95 L 205.31 236.44 L 205.18 236.01 L 205.09 235.65 L 205.04 235.37 L 205.01 235.16 L 205.00 235.04 L 205.00 235.00 L 205.00 235.04 L 204.99 235.16 L 204.96 235.37 L 204.91 235.65 L 204.82 236.01 L 204.69 236.44 L 204.51 236.95 L 204.28 237.51 L 203.98 238.14 L 203.61 238.83 L 203.16 239.56 L 202.63 240.33 L 202.01 241.14 L 201.29 241.98 L 200.48 242.83 L 199.56 243.70 L 198.55 244.57 L 197.42 245.43 L 196.19 246.28 L 194.85 247.10 L 193.40 247.88 L 191.84 248.63 L 190.17 249.32 L 188.40 249.94 L 186.53 250.50 L 184.56 250.97 L 182.49 251.35 L 180.33 251.64 L 178.09 251.81 L 175.77 251.88 L 173.38 251.81 L 170.93 251.62 L 168.42 251.29 L 165.86 250.81 L 163.26 250.19 L 160.64 249.41 L 158.00 248.48 L 155.35 247.38 L 152.70 246.12 L 150.07 244.69 L 147.46 243.09 L 144.89 241.32 L 142.36 239.38 L 139.90 237.27 L 137.50 235.00 L 135.19 232.56 L 132.97 229.96 L 130.85 227.21 L 128.85 224.30 L 126.98 221.24 L 125.25 218.05 L 123.66 214.72 L 122.23 211.27 L 120.97 207.70 L 119.88 204.02 L 118.97 200.24 L 118.25 196.38 L 117.74 192.44 L 117.42 188.43 L 117.31 184.38 L 117.42 180.28 L 117.75 176.15 L 118.29 172.00 L 119.06 167.86 L 120.05 163.72 L 121.27 159.61 L 122.72 155.54 L 124.38 151.52 L 126.27 147.56 L 128.37 143.68 L 130.70 139.89 L 133.23 136.21 L 135.96 132.65 L 138.90 129.21 L 142.02 125.92 L 145.33 122.78 L 148.81 119.80 L 152.46 117.00 L 156.27 114.39 L 160.22 111.97 L 164.30 109.75 L 168.51 107.74 L 172.83 105.96 L 177.24 104.39 L 181.74 103.06 L 186.30 101.96 L 190.93 101.11 L 195.59 100.49 L 200.29 100.12 L 205.00 100.00 Z" fill="url(#cardioid-radial)" stroke="#38bdf8" stroke-width="3" filter="url(#glow-cyan)" />

    <!-- Center Microphone Icon at Origin (Pointing Up to 0 deg) -->
    <g transform="translate(195, 223)">
      <!-- Mic body -->
      <rect x="6" y="14" width="8" height="16" rx="2" fill="#64748b" stroke="#94a3b8" stroke-width="0.8" />
      <line x1="10" y1="30" x2="10" y2="36" stroke="#475569" stroke-width="2" />
      <!-- Mic grille capsule pointing up -->
      <rect x="4" y="0" width="12" height="14" rx="6" fill="#334155" stroke="#38bdf8" stroke-width="1.2" />
      <line x1="4" y1="5" x2="16" y2="5" stroke="#38bdf8" stroke-width="0.7" />
      <line x1="4" y1="9" x2="16" y2="9" stroke="#38bdf8" stroke-width="0.7" />
      <line x1="10" y1="0" x2="10" y2="14" stroke="#38bdf8" stroke-width="0.7" />
    </g>

    <!-- Angle Badges -->
    <!-- 0° ON-AXIS BADGE (FRONT) -->
    <g transform="translate(205, 74)">
      <rect x="-56" y="-12" width="112" height="24" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-badge)" />
      <text x="0" y="4" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">0° (FRONT / ON-AXIS)</text>
    </g>

    <!-- 90° (RIGHT SIDE) -->
    <g transform="translate(352, 225)">
      <rect x="0" y="0" width="34" height="20" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1" />
      <text x="17" y="14" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">90°</text>
    </g>

    <!-- 270° (LEFT SIDE) -->
    <g transform="translate(24, 225)">
      <rect x="0" y="0" width="36" height="20" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1" />
      <text x="18" y="14" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">270°</text>
    </g>

    <!-- 180° REAR NULL BADGE -->
    <g transform="translate(205, 384)">
      <rect x="-50" y="0" width="100" height="22" rx="5" fill="#4c0519" stroke="#f43f5e" stroke-width="1.2" />
      <text x="0" y="15" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">180° (REAR NULL)</text>
    </g>
  </g>

  <!-- RIGHT: EDUCATIONAL BREAKDOWN & TECHNICAL EXPLANATION -->
  <g transform="translate(390, 68)">
    <!-- CARD 1: 0° DIRECTLY IN FRONT (CORRECT ANSWER HIGHLIGHT) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="305" height="88" rx="8" fill="#0c2340" stroke="#38bdf8" stroke-width="2" />
      <rect x="10" y="10" width="70" height="20" rx="4" fill="#0284c7" />
      <text x="45" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">0° ON-AXIS</text>
      <text x="90" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800">MAX SENSITIVITY (0 dB)</text>
      
      <text x="12" y="48" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Directly in front of the microphone capsule.</text>
      <text x="12" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Captures full frequency response with 100%</text>
      <text x="12" y="79" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">amplitude (0 dB reference level).</text>
    </g>

    <!-- CARD 2: 90° & 270° SIDES -->
    <g transform="translate(0, 98)">
      <rect x="0" y="0" width="305" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="9" width="76" height="18" rx="4" fill="#422006" stroke="#f59e0b" stroke-width="0.8" />
      <text x="48" y="22" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">90° / 270°</text>
      <text x="94" y="23" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">-6 dB (HALF VOLUME)</text>
      
      <text x="12" y="44" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">Signals entering from 90° off-axis are attenuated</text>
      <text x="12" y="59" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">by -6 dB (50% amplitude), reducing room spill.</text>
    </g>

    <!-- CARD 3: 180° REAR NULL -->
    <g transform="translate(0, 182)">
      <rect x="0" y="0" width="305" height="88" rx="8" fill="#1e1824" stroke="#f43f5e" stroke-width="1.2" />
      <rect x="10" y="9" width="70" height="18" rx="4" fill="#881337" />
      <text x="45" y="22" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">180° REAR</text>
      <text x="88" y="23" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">MAX REJECTION (-∞ dB)</text>
      
      <text x="12" y="45" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Rear acoustic porting creates 180° phase null.</text>
      <text x="12" y="61" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Aim the 180° null directly at stage monitor wedges</text>
      <text x="12" y="75" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">or hi-hat spill to eliminate feedback &amp; crosstalk.</text>
    </g>

    <!-- EXAM SUMMARY PILL -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="305" height="52" rx="6" fill="#0f172a" stroke="#0284c7" stroke-dasharray="4 3" stroke-width="1" />
      <text x="12" y="21" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STUDIO TIP / EXAM TAKEAWAY:</text>
      <text x="12" y="38" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">Cardioid = Most sensitive at <tspan fill="#38bdf8" font-weight="700">0° (front)</tspan> &amp; deaf at <tspan fill="#fb7185" font-weight="700">180° (rear)</tspan>.</text>
    </g>
  </g>
</svg>