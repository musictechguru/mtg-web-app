<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(30, 16)">
    <rect width="270" height="32" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.2" />
    <text x="135" y="21" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ABBEY ROAD REVERB EQ TRICK</text>
    <rect x="282" y="0" width="360" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="462" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">HPF @ 600 Hz (Cut Mud) • LPF @ 10 kHz (Cut Harshness)</text>
  </g>

  <!-- Main Frequency Graph Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Frequency Curve Plot Area -->
    <g transform="translate(20, 20)">
      <rect width="700" height="195" rx="6" fill="#0b1120" stroke="#1e293b" />

      <!-- Grid lines -->
      <line x1="30" y1="155" x2="670" y2="155" stroke="#334155" stroke-width="1" />
      <line x1="30" y1="95" x2="670" y2="95" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />
      <line x1="30" y1="35" x2="670" y2="35" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />

      <!-- Shaded Rejected Lows Zone -->
      <rect x="30" y="20" width="180" height="135" fill="#ef4444" fill-opacity="0.08" />
      <!-- Shaded Passband Zone -->
      <rect x="210" y="20" width="330" height="135" fill="#10b981" fill-opacity="0.08" />
      <!-- Shaded Rejected Highs Zone -->
      <rect x="540" y="20" width="130" height="135" fill="#ef4444" fill-opacity="0.08" />

      <!-- EQ Bandpass Filter Curve: rolls off < 600Hz and > 10kHz -->
      <path d="M 40,155 C 100,155 160,150 210,65 C 240,40 500,40 540,65 C 580,110 630,155 660,155" fill="none" stroke="#fbbf24" stroke-width="3.5" />

      <!-- 600 Hz Marker Line & Pill -->
      <line x1="210" y1="20" x2="210" y2="155" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 2" />
      <g transform="translate(145, 75)">
        <rect width="120" height="22" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
        <text x="60" y="15" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">HPF @ 600 Hz</text>
      </g>

      <!-- 10 kHz Marker Line & Pill -->
      <line x1="540" y1="20" x2="540" y2="155" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 2" />
      <g transform="translate(485, 75)">
        <rect width="120" height="22" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
        <text x="60" y="15" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">LPF @ 10 kHz</text>
      </g>

      <!-- Passband Sweet Spot Pill -->
      <g transform="translate(290, 48)">
        <rect width="170" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
        <text x="85" y="16" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">CLEAN REVERB PASSBAND</text>
      </g>

      <!-- Freq scale labels in boxes -->
      <g transform="translate(40, 162)">
        <rect width="45" height="16" rx="2" fill="#0f172a" stroke="#334155" />
        <text x="22" y="12" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">20 Hz</text>
      </g>
      <g transform="translate(195, 162)">
        <rect width="50" height="16" rx="2" fill="#0f172a" stroke="#ef4444" />
        <text x="25" y="12" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">600 Hz</text>
      </g>
      <g transform="translate(350, 162)">
        <rect width="50" height="16" rx="2" fill="#0f172a" stroke="#334155" />
        <text x="25" y="12" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">2 kHz</text>
      </g>
      <g transform="translate(520, 162)">
        <rect width="55" height="16" rx="2" fill="#0f172a" stroke="#ef4444" />
        <text x="27" y="12" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">10 kHz</text>
      </g>
      <g transform="translate(615, 162)">
        <rect width="50" height="16" rx="2" fill="#0f172a" stroke="#334155" />
        <text x="25" y="12" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">20 kHz</text>
      </g>
    </g>

    <!-- 3 Action Columns -->
    <g transform="translate(20, 225)">
      <g transform="translate(0, 0)">
        <rect width="220" height="75" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1" />
        <g transform="translate(10, 8)">
          <rect width="110" height="18" rx="3" fill="#450a0a" />
          <text x="55" y="13" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">HIGH-PASS CUT</text>
        </g>
        <text x="12" y="42" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">Removes low rumble &amp; mud</text>
        <text x="12" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Keeps kick and bass punchy</text>
      </g>

      <g transform="translate(240, 0)">
        <rect width="220" height="75" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1" />
        <g transform="translate(10, 8)">
          <rect width="110" height="18" rx="3" fill="#064e3b" />
          <text x="55" y="13" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">FOCUSED MIDS</text>
        </g>
        <text x="12" y="42" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">Warm vocal reverb space</text>
        <text x="12" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Positions vocal deep in mix</text>
      </g>

      <g transform="translate(480, 0)">
        <rect width="220" height="75" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1" />
        <g transform="translate(10, 8)">
          <rect width="110" height="18" rx="3" fill="#450a0a" />
          <text x="55" y="13" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">LOW-PASS CUT</text>
        </g>
        <text x="12" y="42" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">Tames harsh sibilance ('s' / 't')</text>
        <text x="12" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Prevents splashy high wash</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway -->
  <g transform="translate(30, 390)">
    <rect width="740" height="52" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" />
    <g transform="translate(12, 16)">
      <rect width="80" height="20" rx="3" fill="#d97706" />
      <text x="40" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="104" y="32" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">The Abbey Road trick filters reverb (HPF 600 Hz / LPF 10 kHz) to keep mixes clear and uncluttered.</text>
  </g>
</svg>
