<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">SPRING REVERB TANK</text>
    <rect x="262" y="0" width="310" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="417" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Electro-Mechanical Spring Oscillation</text>
  </g>

  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#shadow)" />
    
    <!-- Outer Metal Reverb Chassis Box -->
    <g transform="translate(60, 45)">
      <rect width="620" height="190" rx="8" fill="#0b1120" stroke="#475569" stroke-width="2" />

      <!-- Input Transducer -->
      <g transform="translate(30, 40)">
        <rect width="80" height="110" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
        <text x="40" y="30" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">INPUT</text>
        <text x="40" y="45" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">TRANSDUCER</text>
        <circle cx="40" cy="80" r="16" fill="#0b1120" stroke="#38bdf8" stroke-width="1" />
        <text x="40" y="84" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">DRIVE</text>
      </g>

      <!-- Coiled Springs (Spring 1 & Spring 2) -->
      <!-- Top Spring -->
      <path d="M 110,75 C 130,55 140,95 160,75 C 180,55 190,95 210,75 C 230,55 240,95 260,75 C 280,55 290,95 310,75 C 330,55 340,95 360,75 C 380,55 390,95 410,75 C 430,55 440,95 460,75 C 480,55 490,95 510,75" fill="none" stroke="#fbbf24" stroke-width="3" />
      <!-- Bottom Spring -->
      <path d="M 110,115 C 130,95 140,135 160,115 C 180,95 190,135 210,115 C 230,95 240,135 260,115 C 280,95 290,135 310,115 C 330,95 340,135 360,115 C 380,95 390,135 410,115 C 430,95 440,135 460,115 C 480,95 490,135 510,115" fill="none" stroke="#fbbf24" stroke-width="3" />

      <!-- Center Spring Badge -->
      <g transform="translate(230, 20)">
        <rect width="160" height="24" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" />
        <text x="80" y="16" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="900" text-anchor="middle">COILED STEEL SPRINGS</text>
      </g>

      <!-- Output Pickup Transducer -->
      <g transform="translate(510, 40)">
        <rect width="80" height="110" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
        <text x="40" y="30" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">OUTPUT</text>
        <text x="40" y="45" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">PICKUP</text>
        <circle cx="40" cy="80" r="16" fill="#0b1120" stroke="#10b981" stroke-width="1" />
        <text x="40" y="84" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">COIL</text>
      </g>
    </g>

    <!-- Bottom Characteristic Chips -->
    <g transform="translate(130, 255)">
      <rect x="0" y="0" width="150" height="28" rx="4" fill="#0b1120" stroke="#fbbf24" stroke-width="0.8" />
      <text x="75" y="18" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Metallic / Boingy Timbre</text>

      <rect x="165" y="0" width="150" height="28" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="0.8" />
      <text x="240" y="18" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Guitar Amps (Fender Twin)</text>

      <rect x="330" y="0" width="150" height="28" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="0.8" />
      <text x="405" y="18" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Surf Rock / Dub Reggae</text>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="24" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="44" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Mechanics: Audio vibrates physical coiled steel springs via a transducer, creating a distinctive retro bounce.</text>
  </g>
</svg>