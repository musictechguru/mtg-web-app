<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.2" />
    <text x="125" y="21" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">DITHERING &amp; BIT REDUCTION</text>
    <rect x="262" y="0" width="370" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="447" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">TPDF Noise Eliminates Truncation Distortion on Fades</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left: Truncation (No Dither) -->
    <g transform="translate(20, 20)">
      <rect width="335" height="275" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1.2" />
      <g transform="translate(15, 12)">
        <rect width="210" height="24" rx="4" fill="#450a0a" />
        <text x="105" y="16" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TRUNCATION (HARSH DISTORTION)</text>
      </g>

      <!-- Graphic showing staircase jagged waveform on low decay -->
      <g transform="translate(15, 48)">
        <rect width="305" height="120" rx="4" fill="#0f172a" stroke="#1e293b" />
        <!-- Low signal baseline -->
        <line x1="20" y1="100" x2="285" y2="100" stroke="#334155" stroke-width="1" />
        <!-- Jagged staircase quantization -->
        <path d="M 25,25 L 75,25 L 75,55 L 135,55 L 135,80 L 195,80 L 195,100 L 285,100" fill="none" stroke="#ef4444" stroke-width="2.5" />
        <!-- Smooth target dotted line -->
        <path d="M 25,25 Q 110,60 285,100" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3 2" />

        <g transform="translate(150, 20)">
          <rect width="135" height="20" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
          <text x="67" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">QUANTIZATION STEPPING</text>
        </g>
      </g>

      <g transform="translate(15, 180)">
        <rect width="305" height="80" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="0.8" />
        <text x="12" y="22" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Harmonic Distortion Artifacts</text>
        <text x="12" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Correlated with low-level audio signal</text>
        <text x="12" y="56" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Audible raspy buzzing on reverb tails</text>
        <text x="12" y="70" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="8.5">• Ruins delicate acoustic and vocal fades</text>
      </g>
    </g>

    <!-- Right: TPDF Dithered -->
    <g transform="translate(385, 20)">
      <rect width="335" height="275" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
      <g transform="translate(15, 12)">
        <rect width="210" height="24" rx="4" fill="#064e3b" />
        <text x="105" y="16" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TPDF DITHER (CLEAN DECAY)</text>
      </g>

      <!-- Graphic showing microscopic dither noise preserving smooth decay -->
      <g transform="translate(15, 48)">
        <rect width="305" height="120" rx="4" fill="#0f172a" stroke="#1e293b" />
        <!-- Low signal baseline -->
        <line x1="20" y1="100" x2="285" y2="100" stroke="#334155" stroke-width="1" />
        <!-- Smooth decay line with micro-jitter -->
        <path d="M 25,25 Q 110,60 285,100" fill="none" stroke="#10b981" stroke-width="2.5" />
        <!-- Dither noise envelope dots -->
        <circle cx="50" cy="33" r="1.5" fill="#34d399" />
        <circle cx="80" cy="46" r="1.5" fill="#34d399" />
        <circle cx="120" cy="62" r="1.5" fill="#34d399" />
        <circle cx="170" cy="78" r="1.5" fill="#34d399" />
        <circle cx="220" cy="89" r="1.5" fill="#34d399" />
        <circle cx="260" cy="97" r="1.5" fill="#34d399" />

        <g transform="translate(150, 20)">
          <rect width="135" height="20" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
          <text x="67" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">RANDOMIZED LSB NOISE</text>
        </g>
      </g>

      <g transform="translate(15, 180)">
        <rect width="305" height="80" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
        <text x="12" y="22" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Smooth, Linear Decay Resolution</text>
        <text x="12" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Converts distortion into steady silent hiss</text>
        <text x="12" y="56" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Noise floor pushed below -110 dB</text>
        <text x="12" y="70" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="8.5">• Allows reverb tails to fade gracefully to zero</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 12)">
      <rect width="75" height="20" rx="3" fill="#0284c7" />
      <text x="37" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="98" y="27" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Dither adds randomized noise before bit reduction to eliminate harsh quantization distortion on fades.</text>
  </g>
</svg>
