<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="centerConeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.0" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Outer Header -->
  <g transform="translate(30, 20)">
    <rect width="280" height="30" rx="6" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.2" />
    <text x="140" y="20" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">CENTER PANNING CONVENTIONS</text>
    <text x="295" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">The mix spine: Kick, Bass, Snare &amp; Lead Vocal</text>
  </g>

  <!-- Main Soundstage Visualization Card -->
  <g transform="translate(30, 62)">
    <rect width="740" height="304" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

    <!-- Studio Soundstage Stage Box -->
    <rect x="30" y="24" width="680" height="198" rx="6" fill="#0b1120" stroke="#1e293b" />

    <!-- Stereo Panning Arc Grid (180 degree panoramic arc) -->
    <!-- Center Pan Line -->
    <line x1="370" y1="24" x2="370" y2="222" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3" />
    
    <!-- Left 100% Pan Line -->
    <line x1="80" y1="24" x2="80" y2="222" stroke="#334155" stroke-width="1" stroke-dasharray="2" />
    <text x="80" y="38" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">HARD LEFT (100% L)</text>

    <!-- Right 100% Pan Line -->
    <line x1="660" y1="24" x2="660" y2="222" stroke="#334155" stroke-width="1" stroke-dasharray="2" />
    <text x="660" y="38" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">HARD RIGHT (100% R)</text>

    <!-- LEFT STUDIO MONITOR -->
    <g transform="translate(90, 150)">
      <rect width="36" height="56" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="18" cy="20" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <circle cx="18" cy="42" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="18" y="68" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" text-anchor="middle">LEFT</text>
    </g>

    <!-- RIGHT STUDIO MONITOR -->
    <g transform="translate(614, 150)">
      <rect width="36" height="56" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="18" cy="20" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <circle cx="18" cy="42" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="18" y="68" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" text-anchor="middle">RIGHT</text>
    </g>

    <!-- Phantom Center Spotlight Cone -->
    <polygon points="370,30 260,222 480,222" fill="url(#centerConeGrad)" />

    <!-- Stereophonic Soundstage Elements (Sides) -->
    <!-- Rhythm Guitar Left -->
    <rect x="145" y="70" width="80" height="26" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="185" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Guitars (Left)</text>

    <!-- Backing Vocals / Keyboards Left -->
    <rect x="160" y="115" width="84" height="26" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="202" y="131" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Keys / FX (Left)</text>

    <!-- Rhythm Guitar Right -->
    <rect x="515" y="70" width="80" height="26" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="555" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Guitars (Right)</text>

    <!-- Cymbals / Overhead Right -->
    <rect x="495" y="115" width="84" height="26" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="537" y="131" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Cymbals (Right)</text>

    <!-- THE 4 CORE CENTER ANCHORS (THE MIX SPINE) -->
    <!-- 1. Lead Vocal -->
    <g transform="translate(285, 38)">
      <rect width="170" height="34" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <circle cx="20" cy="17" r="9" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
      <text x="20" y="21" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle">1</text>
      <text x="96" y="16" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="900" text-anchor="middle">LEAD VOCAL</text>
      <text x="96" y="28" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Primary focal point of song</text>
    </g>

    <!-- 2. Snare Drum -->
    <g transform="translate(285, 78)">
      <rect width="170" height="34" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="20" cy="17" r="9" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
      <text x="20" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle">2</text>
      <text x="96" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="900" text-anchor="middle">SNARE DRUM</text>
      <text x="96" y="28" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Backbeat rhythmic anchor</text>
    </g>

    <!-- 3. Bass Guitar / Synth Bass -->
    <g transform="translate(285, 118)">
      <rect width="170" height="34" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <circle cx="20" cy="17" r="9" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="20" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle">3</text>
      <text x="96" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="900" text-anchor="middle">BASS GUITAR</text>
      <text x="96" y="28" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Low-frequency foundation</text>
    </g>

    <!-- 4. Kick Drum -->
    <g transform="translate(285, 158)">
      <rect width="170" height="34" rx="5" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
      <circle cx="20" cy="17" r="9" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1" />
      <text x="20" y="21" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle">4</text>
      <text x="96" y="16" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="900" text-anchor="middle">KICK DRUM</text>
      <text x="96" y="28" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Sub weight &amp; groove pulse</text>
    </g>

    <!-- Sweet Spot Listener at bottom center -->
    <circle cx="370" cy="208" r="7" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />
    <text x="370" y="218" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Sweet Spot</text>

    <!-- 3 Bottom Benefit Cards -->
    <g transform="translate(30, 240)">
      <!-- Benefit 1: Low End Power -->
      <rect width="215" height="50" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="107" y="18" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">1. EQUAL SPEAKER POWER</text>
      <text x="107" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">Sharing bass across both woofers</text>
      <text x="107" y="43" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">maximises headroom without distortion</text>

      <!-- Benefit 2: Mono Compatibility -->
      <g transform="translate(232, 0)">
        <rect width="215" height="50" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="107" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">2. MONO COMPATIBILITY</text>
        <text x="107" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">Center signals never cancel out</text>
        <text x="107" y="43" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Translates to smartphones &amp; club systems</text>
      </g>

      <!-- Benefit 3: Clear Focal Image -->
      <g transform="translate(465, 0)">
        <rect width="215" height="50" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="107" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">3. ANCHORED VOCAL FOCUS</text>
        <text x="107" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">Locks lead vocal and snare dead ahead</text>
        <text x="107" y="43" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Giving guitars room to breathe on the sides</text>
      </g>
    </g>
  </g>

  <!-- Bottom Key Exam Takeaway -->
  <g transform="translate(30, 380)">
    <rect width="740" height="82" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
    <circle cx="36" cy="41" r="14" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5" />
    <text x="36" y="46" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">i</text>
    
    <text x="64" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Edexcel Exam Rule: Why Pan Kick, Bass, Snare &amp; Lead Vocal Center?</text>
    <text x="64" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">1. <tspan fill="#fbbf24" font-weight="bold">Bass Power Balance:</tspan> Low-end energy (Kick &amp; Bass) requires huge amplifier power. Centering them splits the workload equally across both speakers.</text>
    <text x="64" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">2. <tspan fill="#38bdf8" font-weight="bold">Rhythmic &amp; Melodic Anchor:</tspan> The snare sets the backbeat while the lead vocal carries the message—both must be anchored dead center.</text>
    <text x="64" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">3. <tspan fill="#34d399" font-weight="bold">Mono Safety:</tspan> Playback on mono smart speakers, mobile phones, and club PA systems preserves the core foundation without phase loss.</text>
  </g>
</svg>
