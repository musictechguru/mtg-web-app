<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Header Badges -->
  <g transform="translate(30, 16)">
    <rect width="210" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="105" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">MONO BASS ESSENTIALS</text>
    <rect x="222" y="0" width="440" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="442" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Why Low Frequencies (&lt;100 Hz) Must Be Centered in Mono</text>
  </g>

  <!-- Main Comparison Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="340" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left Column: Acoustic & Psychoacoustic Reasons -->
    <g transform="translate(20, 18)">
      <rect width="345" height="304" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
      
      <!-- Title Badge -->
      <g transform="translate(15, 12)">
        <rect width="315" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
        <text x="157" y="17" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">ACOUSTIC &amp; PLAYBACK ADVANTAGES</text>
      </g>

      <!-- 3 Cards -->
      <g transform="translate(15, 46)">
        
        <!-- Reason 1: Subwoofer Summing -->
        <g transform="translate(0, 0)">
          <rect width="315" height="74" rx="3" fill="#0f172a" stroke="#1e293b" />
          <g transform="translate(8, 8)">
            <rect width="145" height="20" rx="2" fill="#064e3b" />
            <text x="72" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">1. SUBWOOFER SUMMING</text>
          </g>
          <g transform="translate(160, 8)">
            <rect width="147" height="20" rx="2" fill="#0b1120" />
            <text x="73" y="14" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">+6 dB Solid Low-End Punch</text>
          </g>
          <g transform="translate(8, 34)">
            <rect width="299" height="32" rx="2" fill="#0b1120" />
            <text x="149" y="14" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">Club PAs &amp; domestic subs sum to a single mono speaker;</text>
            <text x="149" y="25" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">stereo bass causes severe destructive phase cancellation.</text>
          </g>
        </g>

        <!-- Reason 2: Human Hearing Non-Localization -->
        <g transform="translate(0, 82)">
          <rect width="315" height="74" rx="3" fill="#0f172a" stroke="#1e293b" />
          <g transform="translate(8, 8)">
            <rect width="145" height="20" rx="2" fill="#0c4a6e" />
            <text x="72" y="14" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">2. HUMAN EAR PERCEPTION</text>
          </g>
          <g transform="translate(160, 8)">
            <rect width="147" height="20" rx="2" fill="#0b1120" />
            <text x="73" y="14" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">&lt;80 Hz Wavelength &gt; 4m</text>
          </g>
          <g transform="translate(8, 34)">
            <rect width="299" height="32" rx="2" fill="#0b1120" />
            <text x="149" y="14" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">Sub-bass waves are far wider than human head width;</text>
            <text x="149" y="25" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">ears cannot localize bass direction, making stereo width futile.</text>
          </g>
        </g>

        <!-- Reason 3: Headroom & Power Distribution -->
        <g transform="translate(0, 164)">
          <rect width="315" height="78" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
          <g transform="translate(8, 8)">
            <rect width="145" height="20" rx="2" fill="#064e3b" />
            <text x="72" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">3. HEADROOM EFFICIENCY</text>
          </g>
          <g transform="translate(160, 8)">
            <rect width="147" height="20" rx="2" fill="#0b1120" />
            <text x="73" y="14" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Equal Amplifier Workload</text>
          </g>
          <g transform="translate(8, 34)">
            <rect width="299" height="36" rx="2" fill="#0b1120" />
            <text x="149" y="15" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">Distributes high-energy sub frequencies equally across</text>
            <text x="149" y="27" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">left &amp; right channels, maximizing available limiter headroom.</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Right Column: The Vinyl Record & Lathe Reality -->
    <g transform="translate(380, 18)">
      <rect width="340" height="304" rx="6" fill="#0b1120" stroke="#f59e0b" stroke-width="1.2" />

      <!-- Title Badge -->
      <g transform="translate(15, 12)">
        <rect width="310" height="26" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="0.8" />
        <text x="155" y="17" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">VINYL RECORD CUTTING MECHANICS</text>
      </g>

      <!-- Vinyl Groove Comparison Visual -->
      <g transform="translate(15, 46)">
        <!-- Box 1: Mono Cut (Horizontal / Stable) -->
        <g transform="translate(0, 0)">
          <rect width="310" height="74" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
          <g transform="translate(8, 8)">
            <rect width="135" height="20" rx="2" fill="#064e3b" />
            <text x="67" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">MONO BASS GROOVE</text>
          </g>
          <g transform="translate(150, 8)">
            <rect width="152" height="20" rx="2" fill="#0b1120" />
            <text x="76" y="14" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Lateral (Side-to-Side) Cut</text>
          </g>
          <g transform="translate(8, 34)">
            <rect width="294" height="32" rx="2" fill="#0b1120" />
            <text x="147" y="14" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">In-phase bass moves stylus horizontally in an even groove;</text>
            <text x="147" y="25" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">turntable needle tracks perfectly with zero skipping.</text>
          </g>
        </g>

        <!-- Box 2: Stereo Bass Hazard (Vertical / Skip) -->
        <g transform="translate(0, 82)">
          <rect width="310" height="86" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
          <g transform="translate(8, 8)">
            <rect width="135" height="20" rx="2" fill="#450a0a" />
            <text x="67" y="14" fill="#f87171" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">STEREO BASS HAZARD</text>
          </g>
          <g transform="translate(150, 8)">
            <rect width="152" height="20" rx="2" fill="#0b1120" />
            <text x="76" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Vertical (Up-and-Down) Cut</text>
          </g>
          <g transform="translate(8, 34)">
            <rect width="294" height="44" rx="2" fill="#0b1120" />
            <text x="147" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">Out-of-phase bass forces cutting lathe up and down (L - R);</text>
            <text x="147" y="26" fill="#f87171" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">creates shallow grooves that throw playback needles out!</text>
            <text x="147" y="38" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="7" text-anchor="middle">Record plants will reject masters with wide stereo sub-bass.</text>
          </g>
        </g>

        <!-- Elliptical EQ Tool Badge -->
        <g transform="translate(0, 176)">
          <rect width="310" height="66" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8" />
          <g transform="translate(8, 8)">
            <rect width="135" height="20" rx="2" fill="#451a03" />
            <text x="67" y="14" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">MASTERING SOLUTION</text>
          </g>
          <g transform="translate(150, 8)">
            <rect width="152" height="20" rx="2" fill="#0b1120" />
            <text x="76" y="14" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Mono Maker / Elliptical EQ</text>
          </g>
          <g transform="translate(8, 34)">
            <rect width="294" height="24" rx="2" fill="#0b1120" />
            <text x="147" y="16" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">High-pass filter the Side (S) channel below 80–120 Hz</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar with Enclosed Badge -->
  <g transform="translate(30, 412)">
    <rect width="740" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 14)">
      <rect width="80" height="20" rx="3" fill="#0284c7" />
      <text x="40" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <g transform="translate(100, 12)">
      <rect width="628" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="314" y="16" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Mono bass prevents destructive subwoofer phase cancellation, protects dynamic headroom, and stops vinyl stylus skips.</text>
    </g>
  </g>
</svg>
