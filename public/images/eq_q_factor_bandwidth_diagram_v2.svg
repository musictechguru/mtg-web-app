<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="boostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="notchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.35" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Subtle Studio Grid -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="260" x2="800" y2="260" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="460" />
    <line x1="400" y1="0" x2="400" y2="460" />
    <line x1="600" y1="0" x2="600" y2="460" />
  </g>

  <!-- Header Section with Padded Badges -->
  <g transform="translate(30, 16)">
    <!-- Main Title Pill -->
    <rect x="0" y="0" width="280" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="140" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">EQ Q FACTOR &amp; BANDWIDTH</text>

    <!-- Subtitle Pill -->
    <rect x="290" y="0" width="260" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="420" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Musical Tone vs Surgical Problem Fixes</text>
  </g>

  <!-- Left Card: Low Q (Wide Bandwidth) -->
  <g transform="translate(30, 60)">
    <rect width="355" height="315" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Card Header Pill -->
    <g transform="translate(16, 14)">
      <rect width="210" height="26" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
      <text x="105" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">LOW Q = WIDE BANDWIDTH</text>
    </g>

    <!-- Spectrum Display Screen -->
    <g transform="translate(16, 50)">
      <rect width="323" height="190" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" />

      <!-- Horizontal grid -->
      <line x1="0" y1="48" x2="323" y2="48" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="0" y1="95" x2="323" y2="95" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="0" y1="142" x2="323" y2="142" stroke="#475569" stroke-width="1" />

      <!-- Unity 0 dB badge -->
      <rect x="275" y="132" width="38" height="18" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="294" y="145" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">0 dB</text>

      <!-- Frequency vertical grid -->
      <line x1="80" y1="0" x2="80" y2="190" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="162" y1="0" x2="162" y2="190" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="244" y1="0" x2="244" y2="190" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />

      <!-- Shaded Bell Zone -->
      <path d="M 35,142 Q 100,142 135,85 Q 162,50 189,85 Q 224,142 290,142 Z" fill="url(#boostGrad)" />

      <!-- Wide Bell Boost Curve (Q = 0.7) -->
      <path d="M 20,142 L 35,142 Q 100,142 135,85 Q 162,50 189,85 Q 224,142 290,142 L 305,142" fill="none" stroke="#38bdf8" stroke-width="3" />

      <!-- Center Frequency Marker Dot -->
      <circle cx="162" cy="50" r="4.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5" />

      <!-- Top Badges inside display -->
      <g transform="translate(14, 18)">
        <rect width="96" height="22" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="48" y="15" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Q = 0.7 (Wide)</text>
      </g>

      <g transform="translate(208, 18)">
        <rect width="102" height="22" rx="3" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />
        <text x="51" y="15" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Center: 1 kHz</text>
      </g>

      <!-- Bandwidth Indicator Arrow Pill -->
      <g transform="translate(92, 90)">
        <rect width="140" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="70" y="15" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">WIDE BAND (2 Octaves)</text>
      </g>

      <!-- Freq chips at bottom of display -->
      <rect x="18" y="164" width="44" height="18" rx="2" fill="#0f172a" />
      <text x="40" y="177" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">200 Hz</text>

      <rect x="140" y="164" width="44" height="18" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
      <text x="162" y="177" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">1 kHz</text>

      <rect x="260" y="164" width="46" height="18" rx="2" fill="#0f172a" />
      <text x="283" y="177" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">5 kHz</text>
    </g>

    <!-- Bottom Result Pill -->
    <g transform="translate(16, 252)">
      <rect width="323" height="48" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1" />
      <text x="161" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">MUSICAL TONAL SHAPING</text>
      <text x="161" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="middle">Gently boosts broader harmonics naturally</text>
    </g>
  </g>

  <!-- Right Card: High Q (Narrow Surgical Notch) -->
  <g transform="translate(415, 60)">
    <rect width="355" height="315" rx="8" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Card Header Pill -->
    <g transform="translate(16, 14)">
      <rect width="210" height="26" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
      <text x="105" y="18" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">HIGH Q = NARROW NOTCH</text>
    </g>

    <!-- Spectrum Display Screen -->
    <g transform="translate(16, 50)">
      <rect width="323" height="190" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" />

      <!-- Horizontal grid -->
      <line x1="0" y1="48" x2="323" y2="48" stroke="#475569" stroke-width="1" />
      <line x1="0" y1="95" x2="323" y2="95" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="0" y1="142" x2="323" y2="142" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />

      <!-- Unity 0 dB badge -->
      <rect x="275" y="38" width="38" height="18" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="294" y="51" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">0 dB</text>

      <!-- Frequency vertical grid -->
      <line x1="80" y1="0" x2="80" y2="190" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="162" y1="0" x2="162" y2="190" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="244" y1="0" x2="244" y2="190" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />

      <!-- Shaded Notch Zone -->
      <path d="M 148,48 L 157,135 L 162,148 L 167,135 L 176,48 Z" fill="url(#notchGrad)" />

      <!-- Surgical Notch Curve (Q = 10) -->
      <path d="M 20,48 L 148,48 Q 155,48 158,115 L 162,148 L 166,115 Q 169,48 176,48 L 305,48" fill="none" stroke="#ef4444" stroke-width="3" />

      <!-- Center Notch Frequency Dot -->
      <circle cx="162" cy="148" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />

      <!-- Top Badges inside display -->
      <g transform="translate(14, 18)">
        <rect width="96" height="22" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
        <text x="48" y="15" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Q = 8 to 12</text>
      </g>

      <g transform="translate(208, 18)">
        <rect width="102" height="22" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
        <text x="51" y="15" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Cut: 347 Hz</text>
      </g>

      <!-- Narrow Notch Indicator Pill -->
      <g transform="translate(92, 85)">
        <rect width="140" height="22" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
        <text x="70" y="15" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">SURGICAL NOTCH</text>
      </g>

      <!-- Freq chips at bottom of display -->
      <rect x="18" y="164" width="44" height="18" rx="2" fill="#0f172a" />
      <text x="40" y="177" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">100 Hz</text>

      <rect x="134" y="164" width="56" height="18" rx="2" fill="#0f172a" stroke="#ef4444" stroke-width="0.8" />
      <text x="162" y="177" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">347 Hz</text>

      <rect x="260" y="164" width="46" height="18" rx="2" fill="#0f172a" />
      <text x="283" y="177" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">1 kHz</text>
    </g>

    <!-- Bottom Result Pill -->
    <g transform="translate(16, 252)">
      <rect width="323" height="48" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1" />
      <text x="161" y="22" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">SURGICAL RESONANCE CUT</text>
      <text x="161" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="middle">Removes wolf ring without thinning guitar body</text>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 392)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="26" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="26" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="46" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Rule: Boost with wide Q (0.7) for musical tone; cut with high Q (8–12) for surgical fixes.</text>
  </g>
</svg>