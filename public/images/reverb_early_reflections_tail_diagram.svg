<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(30, 16)">
    <rect width="280" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="140" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">REVERB ACOUSTIC TIMELINE</text>
    <rect x="292" y="0" width="350" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="467" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Direct Sound • Early Reflections • Late Diffuse Tail</text>
  </g>

  <!-- Main Graph Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Plot Area -->
    <g transform="translate(20, 20)">
      <rect width="700" height="200" rx="6" fill="#0b1120" stroke="#1e293b" />
      <line x1="20" y1="170" x2="680" y2="170" stroke="#334155" stroke-width="1.5" />
      <line x1="20" y1="20" x2="20" y2="170" stroke="#334155" stroke-width="1.5" />

      <!-- Direct Sound (t=0) -->
      <line x1="50" y1="170" x2="50" y2="25" stroke="#10b981" stroke-width="4" />
      <circle cx="50" cy="25" r="4" fill="#10b981" />

      <!-- Pre-delay bracket -->
      <line x1="52" y1="90" x2="140" y2="90" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3 2" />
      <g transform="translate(62, 70)">
        <rect width="70" height="18" rx="3" fill="#0f172a" stroke="#fbbf24" stroke-width="0.8" />
        <text x="35" y="13" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PRE-DELAY</text>
      </g>

      <!-- Early Reflections (140 to 300) -->
      <rect x="135" y="20" width="170" height="150" fill="#38bdf8" fill-opacity="0.05" />
      <line x1="145" y1="170" x2="145" y2="60" stroke="#38bdf8" stroke-width="3" />
      <line x1="175" y1="170" x2="175" y2="75" stroke="#38bdf8" stroke-width="2.5" />
      <line x1="205" y1="170" x2="205" y2="85" stroke="#38bdf8" stroke-width="2.2" />
      <line x1="240" y1="170" x2="240" y2="105" stroke="#38bdf8" stroke-width="2" />
      <line x1="275" y1="170" x2="275" y2="115" stroke="#38bdf8" stroke-width="1.8" />
      <line x1="300" y1="170" x2="300" y2="125" stroke="#38bdf8" stroke-width="1.5" />

      <!-- Late Diffuse Tail (310 to 660) -->
      <rect x="305" y="20" width="375" height="150" fill="#a855f7" fill-opacity="0.05" />
      <!-- Diffuse decaying peaks -->
      <path d="M 310,130 L 315,120 L 320,135 L 325,125 L 330,140 L 335,130 L 340,142 L 345,133 L 350,145 L 360,138 L 370,148 L 380,142 L 390,150 L 405,145 L 420,153 L 440,149 L 460,156 L 485,152 L 510,158 L 540,155 L 570,162 L 605,160 L 640,166 L 665,168" fill="none" stroke="#c084fc" stroke-width="1.5" />
      <!-- Envelope decay curve -->
      <path d="M 145,55 Q 260,110 660,168" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 2" />

      <!-- Graph Zone Labels inside Boxes -->
      <g transform="translate(18, 30)">
        <rect width="70" height="20" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1" />
        <text x="35" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">DIRECT</text>
      </g>
      <g transform="translate(160, 30)">
        <rect width="125" height="20" rx="3" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
        <text x="62" y="14" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">EARLY REFLECTIONS</text>
      </g>
      <g transform="translate(420, 30)">
        <rect width="150" height="20" rx="3" fill="#3b0764" stroke="#9333ea" stroke-width="1" />
        <text x="75" y="14" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">LATE DIFFUSE REVERB TAIL</text>
      </g>
    </g>

    <!-- 3 Explanatory Column Cards -->
    <g transform="translate(20, 230)">
      <!-- Col 1 -->
      <g transform="translate(0, 0)">
        <rect width="220" height="70" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1" />
        <g transform="translate(10, 8)">
          <rect width="90" height="18" rx="3" fill="#064e3b" />
          <text x="45" y="13" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">DIRECT SOUND</text>
        </g>
        <text x="12" y="42" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">Travels line-of-sight</text>
        <text x="12" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Defines source position &amp; tone</text>
      </g>

      <!-- Col 2 -->
      <g transform="translate(240, 0)">
        <rect width="220" height="70" rx="6" fill="#0b1120" stroke="#0284c7" stroke-width="1" />
        <g transform="translate(10, 8)">
          <rect width="130" height="18" rx="3" fill="#0c4a6e" />
          <text x="65" y="13" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">EARLY REFLECTIONS</text>
        </g>
        <text x="12" y="42" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">First wall/boundary bounces</text>
        <text x="12" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Cues room size &amp; wall distance</text>
      </g>

      <!-- Col 3 -->
      <g transform="translate(480, 0)">
        <rect width="220" height="70" rx="6" fill="#0b1120" stroke="#9333ea" stroke-width="1" />
        <g transform="translate(10, 8)">
          <rect width="120" height="18" rx="3" fill="#3b0764" />
          <text x="60" y="13" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">LATE REVERB TAIL</text>
        </g>
        <text x="12" y="42" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">Dense chaotic reflections</text>
        <text x="12" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Decays over RT60 decay time</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway -->
  <g transform="translate(30, 390)">
    <rect width="740" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <g transform="translate(12, 16)">
      <rect width="80" height="20" rx="3" fill="#0284c7" />
      <text x="40" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="104" y="32" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Early reflections cue room boundaries and dimensions; the diffuse tail creates smooth decay sustain.</text>
  </g>
</svg>
