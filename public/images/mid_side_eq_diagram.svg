<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Side Cut Fill -->
    <linearGradient id="hpfSideFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" rx="14" fill="url(#bgMS)" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="165" height="24" rx="6" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1.2" />
    <text x="82" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">STEREO EQUALIZATION</text>
    
    <text x="180" y="18" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">Mid/Side (M/S) Equalization Workflow</text>
    <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Processing the center mono sum (Mid = L+R) independently from the stereo difference information (Side = L-R).
    </text>
  </g>

  <!-- Two Main Channel Cards -->
  <!-- 1. MID CHANNEL CARD (Center / Mono Sum) -->
  <g transform="translate(50, 80)">
    <rect width="375" height="325" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />

    <!-- Card Header -->
    <rect x="15" y="14" width="345" height="30" rx="6" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1.2" />
    <text x="187" y="34" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">MID CHANNEL (Center Sum: L + R)</text>

    <!-- Display Scope -->
    <rect x="15" y="55" width="345" height="120" rx="6" fill="#020617" stroke="#1e293b" />
    <line x1="15" y1="125" x2="360" y2="125" stroke="#334155" stroke-dasharray="3 3" />
    <text x="25" y="73" fill="#64748b" font-family="monospace" font-size="10">20 Hz</text>
    <text x="187" y="73" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">1 kHz</text>
    <text x="350" y="73" fill="#64748b" font-family="monospace" font-size="10" text-anchor="end">20 kHz</text>

    <!-- EQ Curve: Solid flat low end, gentle presence boost on lead vocal -->
    <path d="M 25,125 
             L 100,125 
             C 140,125 180,95 210,95 
             C 240,95 270,125 350,125" 
          fill="none" stroke="#10b981" stroke-width="3" filter="url(#glowGreen)" />

    <!-- Presence Boost Indicator -->
    <circle cx="210" cy="95" r="5" fill="#34d399" stroke="#ffffff" stroke-width="1.5" />
    <text x="210" y="85" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">+3 dB Vocal Presence (3 kHz)</text>

    <!-- Mid Channel Contents -->
    <g transform="translate(20, 190)">
      <text x="0" y="16" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Contained Audio Elements:</text>
      <text x="0" y="38" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">• Kick drum, snare drum, and bass guitar</text>
      <text x="0" y="58" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">• Primary lead vocal and center soloists</text>
      
      <text x="0" y="84" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">Mastering Rule:</text>
      <text x="100" y="84" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Keep sub-bass intact and punchy.</text>
    </g>

    <!-- Badge -->
    <rect x="15" y="285" width="345" height="26" rx="5" fill="#064e3b" />
    <text x="187" y="302" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Anchors Mix Power, Intelligibility &amp; Punch</text>
  </g>

  <!-- 2. SIDE CHANNEL CARD (Stereo Difference: L - R) -->
  <g transform="translate(455, 80)">
    <rect width="375" height="325" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />

    <!-- Card Header -->
    <rect x="15" y="14" width="345" height="30" rx="6" fill="#082f49" fill-opacity="0.5" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="187" y="34" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">SIDE CHANNEL (Stereo Width: L - R)</text>

    <!-- Display Scope -->
    <rect x="15" y="55" width="345" height="120" rx="6" fill="#020617" stroke="#1e293b" />
    <line x1="15" y1="125" x2="360" y2="125" stroke="#334155" stroke-dasharray="3 3" />
    <text x="25" y="73" fill="#64748b" font-family="monospace" font-size="10">20 Hz</text>
    <text x="187" y="73" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">1 kHz</text>
    <text x="350" y="73" fill="#64748b" font-family="monospace" font-size="10" text-anchor="end">20 kHz</text>

    <!-- Side EQ Curve: HPF at 120 Hz cutting low end + High Shelf boost at 10 kHz -->
    <!-- Low-cut shaded area -->
    <path d="M 25,170 C 60,170 85,135 110,125 L 25,125 Z" fill="url(#hpfSideFill)" />

    <path d="M 25,170 
             C 65,170 90,132 115,125 
             L 240,125 
             C 270,125 295,95 350,95" 
          fill="none" stroke="#0ea5e9" stroke-width="3" filter="url(#glowCyan)" />

    <!-- HPF 120 Hz Cutoff Node -->
    <circle cx="115" cy="125" r="5" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" />
    <text x="115" y="155" fill="#fda4af" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">HPF @ 120 Hz (Mono Bass)</text>

    <!-- High Shelf Boost Node -->
    <circle cx="310" cy="102" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <text x="290" y="85" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">+3 dB Air Shelf</text>

    <!-- Side Channel Contents -->
    <g transform="translate(20, 190)">
      <text x="0" y="16" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Golden Mastering Technique:</text>
      <text x="0" y="38" fill="#fda4af" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">• High-Pass Side at 100–120 Hz:</text>
      <text x="0" y="54" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">  Removes muddy, out-of-phase sub frequencies from stereo edges.</text>
      
      <text x="0" y="74" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">• High-Shelf Boost on Side:</text>
      <text x="0" y="90" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">  Widens acoustic reverb and sheen without muddying center vocal.</text>
    </g>

    <!-- Badge -->
    <rect x="15" y="285" width="345" height="26" rx="5" fill="#082f49" />
    <text x="187" y="302" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Controls Stereo Spread &amp; Ambient Dimension</text>
  </g>

  <!-- Bottom Panel -->
  <g transform="translate(50, 424)">
    <rect width="780" height="80" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.2" />

    <text x="20" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Why Mono Bass via M/S is Essential:</text>
    <text x="20" y="44" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      • Subwoofers in clubs and live venues are omnidirectional and run in mono; stereo low-end risks phase cancellation.
    </text>
    <text x="20" y="64" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      • High-passing the Side channel guarantees that all low frequencies (kick and bass) are centered, tight, and punchy everywhere.
    </text>
  </g>
</svg>
