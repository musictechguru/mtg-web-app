<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">DYNAMIC EQ VS MULTIBAND</text>
    <rect x="262" y="0" width="370" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="447" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Zero Crossover Phase Shift vs Broad Crossover Splitting</text>
  </g>

  <!-- Main Comparison Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left: Multiband Crossover Filters -->
    <g transform="translate(20, 20)">
      <rect width="335" height="275" rx="6" fill="#0b1120" stroke="#f59e0b" stroke-width="1.2" />
      <g transform="translate(15, 12)">
        <rect width="210" height="24" rx="4" fill="#451a03" />
        <text x="105" y="16" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">MULTIBAND (CROSSOVER BANDS)</text>
      </g>

      <!-- Crossover Splitting Plot -->
      <g transform="translate(15, 48)">
        <rect width="305" height="120" rx="4" fill="#0f172a" stroke="#1e293b" />
        <!-- Low band curve -->
        <path d="M 20,40 L 70,40 C 95,40 105,95 125,95" fill="none" stroke="#ef4444" stroke-width="2" />
        <!-- Mid band curve -->
        <path d="M 85,95 C 105,95 115,40 140,40 L 190,40 C 215,40 225,95 245,95" fill="none" stroke="#f59e0b" stroke-width="2" />
        <!-- High band curve -->
        <path d="M 205,95 C 225,95 235,40 260,40 L 290,40" fill="none" stroke="#38bdf8" stroke-width="2" />

        <!-- Crossover Marker Lines -->
        <line x1="105" y1="20" x2="105" y2="105" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2" />
        <line x1="225" y1="20" x2="225" y2="105" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2" />

        <g transform="translate(35, 15)">
          <rect width="135" height="18" rx="2" fill="#451a03" stroke="#f59e0b" stroke-width="0.8" />
          <text x="67" y="13" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">CROSSOVER PHASE SMEAR</text>
        </g>
      </g>

      <g transform="translate(15, 180)">
        <rect width="305" height="80" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8" />
        <text x="12" y="22" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Broad Spectral Splitting</text>
        <text x="12" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Divides audio through steep crossover filters</text>
        <text x="12" y="56" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Fixed crossover frequencies can introduce phase shift</text>
        <text x="12" y="70" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="8.5">• Great for broad tonal shaping of entire sections</text>
      </g>
    </g>

    <!-- Right: Dynamic EQ (Surgical & Zero Crossover) -->
    <g transform="translate(385, 20)">
      <rect width="335" height="275" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
      <g transform="translate(15, 12)">
        <rect width="210" height="24" rx="4" fill="#064e3b" />
        <text x="105" y="16" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">DYNAMIC EQ (SURGICAL PRECISION)</text>
      </g>

      <!-- Dynamic Bell Curve Plot -->
      <g transform="translate(15, 48)">
        <rect width="305" height="120" rx="4" fill="#0f172a" stroke="#1e293b" />
        <!-- Flat baseline 0 dB -->
        <line x1="20" y1="50" x2="285" y2="50" stroke="#334155" stroke-width="1.5" />
        <!-- Static resting curve -->
        <line x1="20" y1="50" x2="285" y2="50" stroke="#10b981" stroke-width="2" />
        <!-- Dynamic dipping bell filter -->
        <path d="M 90,50 Q 140,50 152,90 Q 165,50 215,50" fill="none" stroke="#38bdf8" stroke-width="2.5" />
        <!-- Threshold dotted line -->
        <line x1="120" y1="70" x2="185" y2="70" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="2 2" />

        <g transform="translate(155, 15)">
          <rect width="135" height="18" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
          <text x="67" y="13" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">ZERO CROSSOVER PHASE</text>
        </g>
        <g transform="translate(45, 95)">
          <rect width="125" height="18" rx="2" fill="#0b1120" stroke="#38bdf8" stroke-width="0.8" />
          <text x="62" y="13" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">Dynamic Cut on Resonance</text>
        </g>
      </g>

      <g transform="translate(15, 180)">
        <rect width="305" height="80" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
        <text x="12" y="22" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Parametric Dynamic Freedom</text>
        <text x="12" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Operates with variable Q on exact problem frequencies</text>
        <text x="12" y="56" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• No crossover network means zero phase degradation</text>
        <text x="12" y="70" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8.5">• Only cuts when offending peak breaches threshold</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 12)">
      <rect width="75" height="20" rx="3" fill="#0284c7" />
      <text x="37" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="98" y="27" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Dynamic EQ tames selective resonances with zero crossover phase shift, preserving master mix clarity.</text>
  </g>
</svg>
