<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="vuGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Header Badges -->
  <g transform="translate(30, 16)">
    <rect width="180" height="32" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1.2" />
    <text x="90" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">METERING TYPES</text>
    <rect x="192" y="0" width="460" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="422" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Peak Meters (Fast Transients) vs VU Meters (Perceived Loudness)</text>
  </g>

  <!-- Main Comparison Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="340" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left Column: Peak Meter -->
    <g transform="translate(20, 18)">
      <rect width="340" height="304" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2" />
      
      <!-- Title Badge -->
      <g transform="translate(15, 12)">
        <rect width="310" height="26" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.8" />
        <text x="155" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">PEAK METER (SAMPLE / PPM)</text>
      </g>

      <!-- Digital Bar Graphic -->
      <g transform="translate(25, 48)">
        <!-- Meter Box -->
        <rect width="100" height="120" rx="4" fill="#030712" stroke="#1e293b" />
        
        <!-- Peak Level Segments -->
        <rect x="15" y="10" width="30" height="12" rx="2" fill="#ef4444" />
        <rect x="15" y="26" width="30" height="12" rx="2" fill="#f59e0b" />
        <rect x="15" y="42" width="30" height="12" rx="2" fill="#10b981" />
        <rect x="15" y="58" width="30" height="12" rx="2" fill="#10b981" />
        <rect x="15" y="74" width="30" height="12" rx="2" fill="#10b981" />
        <rect x="15" y="90" width="30" height="12" rx="2" fill="#10b981" />

        <!-- Peak Indicator Line -->
        <line x1="10" y1="16" x2="50" y2="16" stroke="#ffffff" stroke-width="2" />

        <!-- Scale Badges -->
        <g transform="translate(52, 10)">
          <rect width="40" height="14" rx="2" fill="#450a0a" stroke="#ef4444" stroke-width="0.6" />
          <text x="20" y="10" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" text-anchor="middle">0 dBFS</text>
        </g>
        <g transform="translate(52, 42)">
          <rect width="40" height="14" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.6" />
          <text x="20" y="10" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" text-anchor="middle">-12 dB</text>
        </g>
        <g transform="translate(52, 90)">
          <rect width="40" height="14" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.6" />
          <text x="20" y="10" fill="#64748b" font-family="-apple-system, sans-serif" font-size="7" font-weight="700" text-anchor="middle">-36 dB</text>
        </g>

        <!-- Response Chip -->
        <g transform="translate(112, 14)">
          <rect width="175" height="42" rx="4" fill="#0f172a" stroke="#1e293b" />
          <text x="87" y="16" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">BALLISTICS: INSTANT</text>
          <text x="87" y="30" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">Attack time &lt; 1 ms (Instantaneous)</text>
        </g>

        <g transform="translate(112, 64)">
          <rect width="175" height="42" rx="4" fill="#0f172a" stroke="#1e293b" />
          <text x="87" y="16" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">CATCHES TRANSIENTS</text>
          <text x="87" y="30" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">Fast drum snare &amp; percussion spikes</text>
        </g>
      </g>

      <!-- Key Facts Badges -->
      <g transform="translate(15, 180)">
        <g transform="translate(0, 0)">
          <rect width="310" height="26" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="155" y="17" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">PRIMARY GOAL: PREVENT DIGITAL CLIPPING</text>
        </g>
        <g transform="translate(0, 32)">
          <rect width="310" height="26" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="155" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">MONITORS: True maximum voltage / sample spikes</text>
        </g>
        <g transform="translate(0, 64)">
          <rect width="310" height="26" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
          <text x="155" y="17" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">LIMITATION: Poor guide for perceived loudness</text>
        </g>
      </g>
    </g>

    <!-- Right Column: VU Meter -->
    <g transform="translate(380, 18)">
      <rect width="340" height="304" rx="6" fill="#0b1120" stroke="#f59e0b" stroke-width="1.2" />

      <!-- Title Badge -->
      <g transform="translate(15, 12)">
        <rect width="310" height="26" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="0.8" />
        <text x="155" y="17" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">VU METER (VOLUME UNIT)</text>
      </g>

      <!-- Analog Meter Graphic -->
      <g transform="translate(25, 48)">
        <!-- VU Face Plate -->
        <rect width="140" height="120" rx="6" fill="url(#vuGrad)" stroke="#78350f" stroke-width="1.2" />
        
        <!-- Arc scale line -->
        <path d="M 20,80 A 70,70 0 0,1 120,80" fill="none" stroke="#1f2937" stroke-width="2" />
        <!-- Red scale segment (> 0 VU) -->
        <path d="M 95,50 A 70,70 0 0,1 120,80" fill="none" stroke="#dc2626" stroke-width="3" />

        <!-- Scale numbers in badges -->
        <g transform="translate(20, 85)">
          <rect width="25" height="12" rx="2" fill="#1f2937" />
          <text x="12" y="9" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="800" text-anchor="middle">-20</text>
        </g>
        <g transform="translate(85, 34)">
          <rect width="25" height="12" rx="2" fill="#dc2626" />
          <text x="12" y="9" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="6.5" font-weight="800" text-anchor="middle">0 VU</text>
        </g>

        <!-- Needle -->
        <line x1="70" y1="110" x2="88" y2="48" stroke="#111827" stroke-width="2" stroke-linecap="round" />
        <circle cx="70" cy="110" r="6" fill="#111827" />

        <!-- Response Chip -->
        <g transform="translate(150, 14)">
          <rect width="145" height="42" rx="4" fill="#0f172a" stroke="#1e293b" />
          <text x="72" y="16" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">BALLISTICS: SLOW</text>
          <text x="72" y="30" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">Integration time ~300 ms</text>
        </g>

        <g transform="translate(150, 64)">
          <rect width="145" height="42" rx="4" fill="#0f172a" stroke="#1e293b" />
          <text x="72" y="16" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">HUMAN EAR RESPONSE</text>
          <text x="72" y="30" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">Tracks RMS average loudness</text>
        </g>
      </g>

      <!-- Key Facts Badges -->
      <g transform="translate(15, 180)">
        <g transform="translate(0, 0)">
          <rect width="310" height="26" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="155" y="17" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">PRIMARY GOAL: MONITOR PERCEIVED LOUDNESS</text>
        </g>
        <g transform="translate(0, 32)">
          <rect width="310" height="26" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="155" y="17" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">STANDARD REFERENCE: 0 VU = +4 dBu (1.228 V)</text>
        </g>
        <g transform="translate(0, 64)">
          <rect width="310" height="26" rx="3" fill="#451a03" stroke="#f59e0b" stroke-width="0.8" />
          <text x="155" y="17" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">LIMITATION: Too slow to catch fast transient clips</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar with Enclosed Badge -->
  <g transform="translate(30, 412)">
    <rect width="740" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 14)">
      <rect width="80" height="20" rx="3" fill="#0284c7" />
      <text x="40" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <g transform="translate(98, 12)">
      <rect width="630" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="315" y="16" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Peak meters catch fast transient peaks to prevent clipping; VU meters track human perceived loudness.</text>
    </g>
  </g>
</svg>
