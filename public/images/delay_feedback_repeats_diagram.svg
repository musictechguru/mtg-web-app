<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">DELAY FEEDBACK LOOP</text>
    <rect x="262" y="0" width="310" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="417" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Signal Regeneration &amp; Repeat Count</text>
  </g>

  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#shadow)" />
    
    <!-- Signal Flow Architecture -->
    <!-- Input Node -->
    <g transform="translate(60, 90)">
      <rect width="110" height="40" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5" />
      <text x="55" y="25" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">DRY INPUT</text>
    </g>

    <line x1="170" y1="110" x2="250" y2="110" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />
    <polygon points="250,110 240,105 240,115" fill="#38bdf8" />

    <!-- Delay Memory Buffer -->
    <g transform="translate(255, 75)">
      <rect width="180" height="70" rx="8" fill="#0b1120" stroke="#fbbf24" stroke-width="2" />
      <text x="90" y="32" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="12" font-weight="900" text-anchor="middle">DELAY BUFFER</text>
      <rect x="30" y="42" width="120" height="20" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8" />
      <text x="90" y="56" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Delay Time (250 ms)</text>
    </g>

    <line x1="435" y1="110" x2="520" y2="110" stroke="#10b981" stroke-width="2.5" />
    <polygon points="520,110 510,105 510,115" fill="#10b981" />

    <!-- Output Mixer Node -->
    <g transform="translate(525, 90)">
      <rect width="140" height="40" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.5" />
      <text x="70" y="25" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">WET ECHO OUTPUT</text>
    </g>

    <!-- Feedback Loop Branch -->
    <path d="M 480,110 L 480,210 L 210,210 L 210,115" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="5 3" />
    <polygon points="210,110 205,122 215,122" fill="#f87171" />

    <!-- Feedback Attenuator Badge in Loop -->
    <g transform="translate(285, 195)">
      <rect width="170" height="30" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
      <text x="85" y="20" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">FEEDBACK REGENERATION</text>
    </g>

    <!-- Echo Repeats Waveform Display at bottom -->
    <g transform="translate(80, 240)">
      <rect width="580" height="60" rx="6" fill="#0b1120" stroke="#1e293b" />
      
      <!-- Repeat 1 -->
      <line x1="90" y1="50" x2="90" y2="10" stroke="#38bdf8" stroke-width="3" />
      <rect x="50" y="15" width="35" height="16" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
      <text x="67" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">100%</text>

      <!-- Repeat 2 -->
      <line x1="220" y1="50" x2="220" y2="22" stroke="#fbbf24" stroke-width="3" />
      <rect x="180" y="22" width="35" height="16" rx="2" fill="#0f172a" stroke="#fbbf24" stroke-width="0.8" />
      <text x="197" y="33" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">60%</text>

      <!-- Repeat 3 -->
      <line x1="350" y1="50" x2="350" y2="32" stroke="#10b981" stroke-width="3" />
      <rect x="310" y="30" width="35" height="16" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
      <text x="327" y="41" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">36%</text>

      <!-- Repeat 4 -->
      <line x1="480" y1="50" x2="480" y2="40" stroke="#64748b" stroke-width="2.5" />
      <rect x="440" y="35" width="35" height="16" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="0.8" />
      <text x="457" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">20%</text>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="24" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="44" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Principle: Feedback routes the delayed output back into the input buffer to generate multiple repeats.</text>
  </g>
</svg>