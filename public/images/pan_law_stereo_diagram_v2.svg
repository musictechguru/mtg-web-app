<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="surgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="flatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Subtle Studio Grid -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="260" x2="800" y2="260" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="460" />
    <line x1="400" y1="0" x2="400" y2="460" />
    <line x1="600" y1="0" x2="600" y2="460" />
  </g>

  <!-- Header Section with Padded Badges -->
  <g transform="translate(30, 16)">
    <!-- Main Title Pill -->
    <rect x="0" y="0" width="230" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="115" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">STEREO PAN LAW</text>

    <!-- Subtitle Pill -->
    <rect x="240" y="0" width="340" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="410" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Equal Perceived Volume Across Left, Center &amp; Right</text>
  </g>

  <!-- Left Card: WITHOUT PAN LAW -->
  <g transform="translate(30, 60)">
    <rect width="355" height="315" rx="8" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Card Header Pill -->
    <g transform="translate(16, 14)">
      <rect width="210" height="26" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
      <text x="105" y="18" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">WITHOUT PAN LAW (0 dB)</text>
    </g>

    <!-- Graph Screen -->
    <g transform="translate(16, 50)">
      <rect width="323" height="190" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" />

      <!-- Horizontal grid lines -->
      <line x1="0" y1="50" x2="323" y2="50" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="0" y1="100" x2="323" y2="100" stroke="#475569" stroke-width="1" />
      <line x1="0" y1="150" x2="323" y2="150" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />

      <!-- dB Level Chips -->
      <rect x="10" y="42" width="46" height="16" rx="2" fill="#0f172a" stroke="#ef4444" stroke-width="0.8" />
      <text x="33" y="54" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">+3 dB</text>

      <rect x="10" y="92" width="46" height="16" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="33" y="104" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">0 dB</text>

      <!-- Center guide line -->
      <line x1="162" y1="0" x2="162" y2="190" stroke="#1e293b" stroke-width="1" stroke-dasharray="3" />

      <!-- Shaded Center Bump -->
      <path d="M 60,100 Q 162,35 264,100 Z" fill="url(#surgeGrad)" />

      <!-- Bulging Perceived Level Curve -->
      <path d="M 40,100 Q 162,45 284,100" fill="none" stroke="#ef4444" stroke-width="3.5" />

      <!-- Center Peak Node -->
      <circle cx="162" cy="50" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />

      <!-- Center Surge Badge -->
      <g transform="translate(97, 65)">
        <rect width="130" height="22" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
        <text x="65" y="15" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">+3 dB Volume Surge</text>
      </g>

      <!-- Pan Position Chips at bottom -->
      <rect x="25" y="164" width="56" height="18" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="53" y="177" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Hard L</text>

      <rect x="134" y="164" width="56" height="18" rx="2" fill="#0f172a" stroke="#ef4444" stroke-width="0.8" />
      <text x="162" y="177" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">Center</text>

      <rect x="243" y="164" width="56" height="18" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="271" y="177" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Hard R</text>
    </g>

    <!-- Bottom Result Pill -->
    <g transform="translate(16, 252)">
      <rect width="323" height="48" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1" />
      <text x="161" y="22" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">UNEVEN LOUDNESS</text>
      <text x="161" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="middle">Center elements sound unnaturally louder than sides</text>
    </g>
  </g>

  <!-- Right Card: WITH PAN LAW (-3 dB) -->
  <g transform="translate(415, 60)">
    <rect width="355" height="315" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Card Header Pill -->
    <g transform="translate(16, 14)">
      <rect width="210" height="26" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
      <text x="105" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">WITH PAN LAW (-3 dB)</text>
    </g>

    <!-- Graph Screen -->
    <g transform="translate(16, 50)">
      <rect width="323" height="190" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" />

      <!-- Horizontal grid lines -->
      <line x1="0" y1="50" x2="323" y2="50" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="0" y1="100" x2="323" y2="100" stroke="#10b981" stroke-width="1.2" />
      <line x1="0" y1="150" x2="323" y2="150" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3" />

      <!-- dB Level Chips -->
      <rect x="10" y="92" width="46" height="16" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
      <text x="33" y="104" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" text-anchor="middle">0 dB</text>

      <rect x="10" y="142" width="46" height="16" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
      <text x="33" y="154" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">-3 dB</text>

      <!-- Center guide line -->
      <line x1="162" y1="0" x2="162" y2="190" stroke="#1e293b" stroke-width="1" stroke-dasharray="3" />

      <!-- Perfectly Flat Perceived Level -->
      <line x1="40" y1="100" x2="284" y2="100" stroke="#34d399" stroke-width="4" stroke-linecap="round" />

      <!-- Center Compensation Dip Curve (DAW Internal Attenuation) -->
      <path d="M 40,100 Q 162,150 284,100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" />
      <circle cx="162" cy="148" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2" />

      <!-- Center Attenuation Tag -->
      <g transform="translate(87, 50)">
        <rect width="150" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
        <text x="75" y="15" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">Constant Perceived Level</text>
      </g>

      <!-- Compensation Tag -->
      <g transform="translate(97, 120)">
        <rect width="130" height="20" rx="3" fill="#0b1120" stroke="#38bdf8" stroke-width="0.8" />
        <text x="65" y="14" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">DAW Dips Center -3 dB</text>
      </g>

      <!-- Pan Position Chips at bottom -->
      <rect x="25" y="164" width="56" height="18" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="53" y="177" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Hard L</text>

      <rect x="134" y="164" width="56" height="18" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
      <text x="162" y="177" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">Center</text>

      <rect x="243" y="164" width="56" height="18" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="271" y="177" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Hard R</text>
    </g>

    <!-- Bottom Result Pill -->
    <g transform="translate(16, 252)">
      <rect width="323" height="48" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1" />
      <text x="161" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">SMOOTH &amp; CONSISTENT</text>
      <text x="161" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="middle">Volume stays uniform when panning anywhere in stereo</text>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 392)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="26" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="26" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="46" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Rule: Pan Law lowers center-panned tracks by -3 dB to maintain constant perceived loudness.</text>
  </g>
</svg>