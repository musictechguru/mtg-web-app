<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-sync" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="quant-hit-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="human-hit-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="glow-badge-sync" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan-sync" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad-sync)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow-badge-sync)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">RHYTHM &amp; SYNC: HUMAN MICRO-TIMING vs STRICT STEP QUANTIZATION</text>
    <rect x="526" y="6" width="134" height="22" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="0.8" />
    <text x="593" y="21" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">VERSION B: QUANTIZED</text>
  </g>

  <!-- ==================== MAIN COMPARISON GRIDS ==================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="672" height="248" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- TOP: HUMAN TIMING (GLORIA JONES 1964) -->
    <g transform="translate(18, 14)">
      <rect x="0" y="0" width="636" height="98" rx="8" fill="#181313" stroke="#f59e0b" stroke-width="1.2" />
      <rect x="12" y="8" width="260" height="20" rx="4" fill="#78350f" />
      <text x="142" y="22" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">HUMAN DRUMMER (PUSH &amp; PULL GROOVE)</text>
      <text x="300" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Natural micro-timing offsets (-15ms drag, +10ms rush)</text>

      <!-- Grid Line Markings -->
      <g transform="translate(40, 36)">
        <!-- Vertical Grid Reference Lines (Beats 1, 2, 3, 4) -->
        <line x1="0" y1="0" x2="0" y2="46" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" />
        <text x="0" y="56" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Beat 1</text>

        <line x1="140" y1="0" x2="140" y2="46" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" />
        <text x="140" y="56" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Beat 2</text>

        <line x1="280" y1="0" x2="280" y2="46" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" />
        <text x="280" y="56" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Beat 3</text>

        <line x1="420" y1="0" x2="420" y2="46" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" />
        <text x="420" y="56" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Beat 4</text>

        <line x1="560" y1="0" x2="560" y2="46" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" />
        <text x="560" y="56" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Bar 2</text>

        <!-- Human Hits (Slightly early or late - organic human groove) -->
        <!-- Beat 1: exactly on -->
        <circle cx="2" cy="18" r="8" fill="url(#human-hit-grad)" stroke="#fde68a" stroke-width="1.5" />
        <!-- Beat 2: slightly dragged (+6px / +15ms) -->
        <circle cx="148" cy="18" r="8" fill="url(#human-hit-grad)" stroke="#fde68a" stroke-width="1.5" />
        <line x1="140" y1="18" x2="148" y2="18" stroke="#f59e0b" stroke-width="1.5" />
        <text x="156" y="10" fill="#f59e0b" font-family="monospace" font-size="8">+15ms</text>

        <!-- Beat 3: slightly rushed (-5px / -12ms) -->
        <circle cx="273" cy="18" r="8" fill="url(#human-hit-grad)" stroke="#fde68a" stroke-width="1.5" />
        <line x1="280" y1="18" x2="273" y2="18" stroke="#f59e0b" stroke-width="1.5" />
        <text x="260" y="10" fill="#f59e0b" font-family="monospace" font-size="8">-12ms</text>

        <!-- Beat 4: slightly dragged (+7px / +18ms) -->
        <circle cx="429" cy="18" r="8" fill="url(#human-hit-grad)" stroke="#fde68a" stroke-width="1.5" />
        <line x1="420" y1="18" x2="429" y2="18" stroke="#f59e0b" stroke-width="1.5" />
        <text x="438" y="10" fill="#f59e0b" font-family="monospace" font-size="8">+18ms</text>
      </g>
    </g>

    <!-- BOTTOM: QUANTIZED MACHINE TIMING (SOFT CELL 1981 - CORRECT ANSWER) -->
    <g transform="translate(18, 124)">
      <rect x="0" y="0" width="636" height="110" rx="8" fill="#081d2f" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="12" y="8" width="310" height="20" rx="4" fill="#0369a1" />
      <text x="167" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle">&#x2713; SOFT CELL: QUANTIZED TO 16TH GRID (100% LOCK)</text>
      <text x="350" y="22" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="9.5">Zero timing fluctuation • Rigid electronic clock</text>

      <!-- Grid Line Markings -->
      <g transform="translate(40, 36)">
        <!-- Vertical Rigid Solid Grid Lines -->
        <line x1="0" y1="0" x2="0" y2="48" stroke="#38bdf8" stroke-width="2" />
        <line x1="35" y1="0" x2="35" y2="48" stroke="#1e3a5f" stroke-width="1" />
        <line x1="70" y1="0" x2="70" y2="48" stroke="#1e3a5f" stroke-width="1" />
        <line x1="105" y1="0" x2="105" y2="48" stroke="#1e3a5f" stroke-width="1" />

        <line x1="140" y1="0" x2="140" y2="48" stroke="#38bdf8" stroke-width="2" />
        <line x1="175" y1="0" x2="175" y2="48" stroke="#1e3a5f" stroke-width="1" />
        <line x1="210" y1="0" x2="210" y2="48" stroke="#1e3a5f" stroke-width="1" />
        <line x1="245" y1="0" x2="245" y2="48" stroke="#1e3a5f" stroke-width="1" />

        <line x1="280" y1="0" x2="280" y2="48" stroke="#38bdf8" stroke-width="2" />
        <line x1="315" y1="0" x2="315" y2="48" stroke="#1e3a5f" stroke-width="1" />
        <line x1="350" y1="0" x2="350" y2="48" stroke="#1e3a5f" stroke-width="1" />
        <line x1="385" y1="0" x2="385" y2="48" stroke="#1e3a5f" stroke-width="1" />

        <line x1="420" y1="0" x2="420" y2="48" stroke="#38bdf8" stroke-width="2" />
        <line x1="455" y1="0" x2="455" y2="48" stroke="#1e3a5f" stroke-width="1" />
        <line x1="490" y1="0" x2="490" y2="48" stroke="#1e3a5f" stroke-width="1" />
        <line x1="525" y1="0" x2="525" y2="48" stroke="#1e3a5f" stroke-width="1" />

        <line x1="560" y1="0" x2="560" y2="48" stroke="#38bdf8" stroke-width="2" />

        <!-- Machine Hits: Dead center on grid points with zero error -->
        <rect x="-8" y="10" width="16" height="24" rx="3" fill="url(#quant-hit-grad)" stroke="#7dd3fc" stroke-width="1.5" filter="url(#glow-cyan-sync)" />
        <rect x="132" y="10" width="16" height="24" rx="3" fill="url(#quant-hit-grad)" stroke="#7dd3fc" stroke-width="1.5" filter="url(#glow-cyan-sync)" />
        <rect x="272" y="10" width="16" height="24" rx="3" fill="url(#quant-hit-grad)" stroke="#7dd3fc" stroke-width="1.5" filter="url(#glow-cyan-sync)" />
        <rect x="412" y="10" width="16" height="24" rx="3" fill="url(#quant-hit-grad)" stroke="#7dd3fc" stroke-width="1.5" filter="url(#glow-cyan-sync)" />
        <rect x="552" y="10" width="16" height="24" rx="3" fill="url(#quant-hit-grad)" stroke="#7dd3fc" stroke-width="1.5" filter="url(#glow-cyan-sync)" />

        <text x="0" y="58" fill="#38bdf8" font-family="monospace" font-size="8.5" text-anchor="middle">1.1.1 (0ms)</text>
        <text x="140" y="58" fill="#38bdf8" font-family="monospace" font-size="8.5" text-anchor="middle">1.2.1 (0ms)</text>
        <text x="280" y="58" fill="#38bdf8" font-family="monospace" font-size="8.5" text-anchor="middle">1.3.1 (0ms)</text>
        <text x="420" y="58" fill="#38bdf8" font-family="monospace" font-size="8.5" text-anchor="middle">1.4.1 (0ms)</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM SPECIFICATION CARDS ==================== -->
  <g transform="translate(24, 320)">
    <!-- Card 1: Correct Answer -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.2" />
      <rect x="12" y="10" width="104" height="18" rx="4" fill="#0369a1" />
      <text x="64" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x2713; CORRECT ANSWER</text>
      <text x="12" y="44" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Version B (Soft Cell)</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Quantized drum machine clock</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Eliminated human tempo drift</text>
    </g>

    <!-- Card 2: Aesthetic Shift -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="112" height="18" rx="4" fill="#1f2937" />
      <text x="68" y="22" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">MECHANICAL AESTHETIC</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Cold, Hypnotic Precision</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Gave Synth-Pop its distinctive</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">robotic, post-punk disco pulse</text>
    </g>

    <!-- Card 3: Northern Soul Push-Pull -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.2" />
      <rect x="12" y="10" width="116" height="18" rx="4" fill="#78350f" />
      <text x="70" y="22" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">ORGANIC PUSH &amp; PULL</text>
      <text x="12" y="44" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Gloria Jones (1964)</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Live drummer's subtle timing variations</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">breathes emotional bounce into the track</text>
    </g>
  </g>
</svg>
