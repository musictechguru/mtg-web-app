<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="960" height="620" fill="#0b1120"/>

  <!-- Title Header -->
  <text x="480" y="44" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="1.5">SAWTOOTH WAVE VS SQUARE WAVE</text>
  <text x="480" y="70" fill="#94a3b8" font-size="13.5" text-anchor="middle">Comparing harmonic richness and subtractive filtering potential</text>

  <!-- Left Card: Sawtooth Wave (All Harmonics) -->
  <g transform="translate(45, 95)">
    <rect width="420" height="400" rx="10" fill="#131e36" stroke="#3b82f6" stroke-width="1.8"/>
    <rect width="420" height="38" rx="10" fill="#1d4ed8"/>
    <text x="210" y="25" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">SAWTOOTH WAVE — ALL HARMONICS</text>

    <!-- Waveform Visual -->
    <rect x="20" y="55" width="380" height="100" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <path d="M 40 135 L 120 75 L 120 135 L 200 75 L 200 135 L 280 75 L 280 135 L 360 75 L 360 135" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>

    <!-- Harmonic Series Bars -->
    <text x="25" y="180" fill="#38bdf8" font-size="12" font-weight="bold">Harmonic Spectrum (1/n Amplitude):</text>
    <g transform="translate(30, 195)">
      <!-- 1st (f0) -->
      <rect x="0" y="0" width="18" height="90" fill="#38bdf8" rx="2"/>
      <text x="9" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">1st</text>

      <!-- 2nd (even) -->
      <rect x="35" y="45" width="18" height="45" fill="#38bdf8" rx="2"/>
      <text x="44" y="105" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">2nd</text>

      <!-- 3rd (odd) -->
      <rect x="70" y="60" width="18" height="30" fill="#38bdf8" rx="2"/>
      <text x="79" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">3rd</text>

      <!-- 4th (even) -->
      <rect x="105" y="68" width="18" height="22" fill="#38bdf8" rx="2"/>
      <text x="114" y="105" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">4th</text>

      <!-- 5th (odd) -->
      <rect x="140" y="72" width="18" height="18" fill="#38bdf8" rx="2"/>
      <text x="149" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">5th</text>

      <!-- 6th (even) -->
      <rect x="175" y="75" width="18" height="15" fill="#38bdf8" rx="2"/>
      <text x="184" y="105" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">6th</text>

      <!-- 7th (odd) -->
      <rect x="210" y="77" width="18" height="13" fill="#38bdf8" rx="2"/>
      <text x="219" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">7th</text>

      <!-- 8th (even) -->
      <rect x="245" y="79" width="18" height="11" fill="#38bdf8" rx="2"/>
      <text x="254" y="105" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">8th</text>
    </g>

    <text x="25" y="335" fill="#cbd5e1" font-size="12" font-weight="bold">Sonic Character: Bright, brassy, buzzy</text>
    <text x="25" y="355" fill="#94a3b8" font-size="11">Contains <tspan fill="#38bdf8" font-weight="bold">EVERY harmonic</tspan> (both odd and even).</text>
    <text x="25" y="375" fill="#94a3b8" font-size="11">Ideal for strings, brass leads, and rich filter sweeps.</text>
  </g>

  <!-- Right Card: Square Wave (Odd Harmonics Only) -->
  <g transform="translate(495, 95)">
    <rect width="420" height="400" rx="10" fill="#131e36" stroke="#10b981" stroke-width="1.8"/>
    <rect width="420" height="38" rx="10" fill="#047857"/>
    <text x="210" y="25" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">SQUARE WAVE — ODD HARMONICS ONLY</text>

    <!-- Waveform Visual -->
    <rect x="20" y="55" width="380" height="100" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <path d="M 40 135 L 40 75 L 120 75 L 120 135 L 200 135 L 200 75 L 280 75 L 280 135 L 360 135 L 360 75" fill="none" stroke="#34d399" stroke-width="3" stroke-linejoin="round"/>

    <!-- Harmonic Series Bars (Missing Evens) -->
    <text x="25" y="180" fill="#34d399" font-size="12" font-weight="bold">Harmonic Spectrum (Missing Even Harmonics):</text>
    <g transform="translate(30, 195)">
      <!-- 1st (f0) -->
      <rect x="0" y="0" width="18" height="90" fill="#34d399" rx="2"/>
      <text x="9" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">1st</text>

      <!-- 2nd (MISSING) -->
      <line x1="35" y1="90" x2="53" y2="90" stroke="#ef4444" stroke-width="2"/>
      <text x="44" y="105" fill="#ef4444" font-size="10" text-anchor="middle">✕</text>

      <!-- 3rd (odd) -->
      <rect x="70" y="60" width="18" height="30" fill="#34d399" rx="2"/>
      <text x="79" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">3rd</text>

      <!-- 4th (MISSING) -->
      <line x1="105" y1="90" x2="123" y2="90" stroke="#ef4444" stroke-width="2"/>
      <text x="114" y="105" fill="#ef4444" font-size="10" text-anchor="middle">✕</text>

      <!-- 5th (odd) -->
      <rect x="140" y="72" width="18" height="18" fill="#34d399" rx="2"/>
      <text x="149" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">5th</text>

      <!-- 6th (MISSING) -->
      <line x1="175" y1="90" x2="193" y2="90" stroke="#ef4444" stroke-width="2"/>
      <text x="184" y="105" fill="#ef4444" font-size="10" text-anchor="middle">✕</text>

      <!-- 7th (odd) -->
      <rect x="210" y="77" width="18" height="13" fill="#34d399" rx="2"/>
      <text x="219" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">7th</text>

      <!-- 8th (MISSING) -->
      <line x1="245" y1="90" x2="263" y2="90" stroke="#ef4444" stroke-width="2"/>
      <text x="254" y="105" fill="#ef4444" font-size="10" text-anchor="middle">✕</text>
    </g>

    <text x="25" y="335" fill="#cbd5e1" font-size="12" font-weight="bold">Sonic Character: Hollow, woody, clarinet-like</text>
    <text x="25" y="355" fill="#94a3b8" font-size="11">Contains <tspan fill="#34d399" font-weight="bold">ONLY ODD harmonics</tspan> (1, 3, 5, 7...).</text>
    <text x="25" y="375" fill="#94a3b8" font-size="11">Ideal for square bass, chiptune leads, and clarinet patches.</text>
  </g>

  <!-- Bottom Key Comparison -->
  <g transform="translate(45, 515)">
    <rect width="870" height="75" rx="8" fill="#172339" stroke="#334155" stroke-width="1.2"/>
    <text x="25" y="27" fill="#38bdf8" font-size="13" font-weight="bold">Why Sawtooth is the Foundation of Subtractive Synthesis:</text>
    <text x="25" y="47" fill="#cbd5e1" font-size="12">Because a sawtooth wave possesses <tspan fill="#38bdf8" font-weight="bold">every integer multiple harmonic</tspan>, a low-pass filter has the maximum possible harmonic content</text>
    <text x="25" y="63" fill="#cbd5e1" font-size="12">to sculpt, carve, and shape into virtually any acoustic instrument or synthetic lead sound.</text>
  </g>
</svg>
