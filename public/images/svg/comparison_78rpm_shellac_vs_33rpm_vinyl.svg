<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-shl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-shl-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad-shl)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#f59e0b" filter="url(#glow-shl-amber)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">RECORDING MEDIA: 78 RPM SHELLAC DISC (1936) VS 33⅓ RPM VINYL LP (1968)</text>
    <rect x="520" y="6" width="140" height="22" rx="4" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-width="0.8" />
    <text x="590" y="21" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">COMPARISON 5: CROSSROADS</text>
  </g>

  <!-- Left: 78 RPM Shellac -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="324" height="270" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <rect x="12" y="12" width="300" height="28" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="162" y="30" fill="#fcd34d" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">ROBERT JOHNSON (1936) — 78 RPM SHELLAC</text>

    <!-- Disc Visual -->
    <g transform="translate(20, 52)">
      <circle cx="50" cy="50" r="46" fill="#1c1917" stroke="#78350f" stroke-width="3" />
      <circle cx="50" cy="50" r="16" fill="#78350f" />
      <circle cx="50" cy="50" r="5" fill="#090d16" />
      <text x="110" y="30" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">10-Inch Shellac Disc</text>
      <text x="110" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Rotation Speed: <tspan fill="#f8fafc" font-weight="700">78 RPM</tspan></text>
      <text x="110" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Capacity: <tspan fill="#f8fafc" font-weight="700">~3 mins per side</tspan></text>
      <text x="110" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Groove: <tspan fill="#f8fafc" font-weight="700">Coarse (3.0 mil stylus)</tspan></text>
      <text x="110" y="88" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Material: Slate / Resin composite</text>
    </g>

    <!-- Technical Specs Box -->
    <g transform="translate(14, 160)">
      <rect x="0" y="0" width="296" height="96" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="20" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800">ACOUSTIC &amp; FREQUENCY CONSTRAINTS:</text>
      <text x="10" y="38" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Bandwidth limited: ~200 Hz to 4.5 kHz</text>
      <text x="10" y="54" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Heavy surface noise &amp; shellac friction hiss</text>
      <text x="10" y="70" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Direct-to-disc cut in hotel room (no multitrack/tape)</text>
      <text x="10" y="86" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Song paced specifically to beat the 3-min physical limit</text>
    </g>
  </g>

  <!-- Right: 33 1/3 RPM Vinyl -->
  <g transform="translate(372, 62)">
    <rect x="0" y="0" width="324" height="270" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <rect x="12" y="12" width="300" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="162" y="30" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">CREAM (1968) — 33⅓ RPM MICROGROOVE LP</text>

    <!-- Disc Visual -->
    <g transform="translate(20, 52)">
      <circle cx="50" cy="50" r="46" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
      <circle cx="50" cy="50" r="16" fill="#0284c7" />
      <circle cx="50" cy="50" r="5" fill="#090d16" />
      <text x="110" y="30" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">12-Inch Vinyl LP</text>
      <text x="110" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Rotation Speed: <tspan fill="#f8fafc" font-weight="700">33⅓ RPM</tspan></text>
      <text x="110" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Capacity: <tspan fill="#f8fafc" font-weight="700">22+ mins per side</tspan></text>
      <text x="110" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Groove: <tspan fill="#f8fafc" font-weight="700">Microgroove (0.7 mil stylus)</tspan></text>
      <text x="110" y="88" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Material: Pure PVC (Polyvinyl Chloride)</text>
    </g>

    <!-- Technical Specs Box -->
    <g transform="translate(14, 160)">
      <rect x="0" y="0" width="296" height="96" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800">HI-FI MULTITRACK LIVE ADVANTAGES:</text>
      <text x="10" y="38" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Full 30 Hz to 18 kHz dynamic frequency range</text>
      <text x="10" y="54" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Low surface noise floor via RIAA EQ pre-emphasis</text>
      <text x="10" y="70" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• 8-track live recording at Winterland Ballroom</text>
      <text x="10" y="86" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Extended 4:15 live jam with improvised solos</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 342)">
    <rect x="0" y="0" width="672" height="60" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1.2" />
    <text x="16" y="22" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800">EDEXCEL MT EXAM TAKEAWAY:</text>
    <text x="16" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">The technological shift from 78 RPM direct-to-disc shellac to 33⅓ RPM microgroove vinyl directly enabled extended musical improvisations, wider frequency response, and the birth of album-oriented rock.</text>
  </g>
</svg>