<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#22c55e" />
    </marker>
    <marker id="arrow-gold" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#facc15" />
    </marker>
    <marker id="arrow-cyan" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#22c55e" filter="url(#glow-green)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">AUX SENDS: PRE-FADER vs POST-FADER SIGNAL ROUTING</text>
    <rect x="522" y="6" width="138" height="22" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#22c55e" stroke-width="0.8" />
    <text x="591" y="21" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">HEADPHONE CUE ROUTING</text>
  </g>

  <!-- ==================== MAIN SIGNAL ROUTING DIAGRAM ==================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="672" height="206" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- ==================== CHANNEL STRIP VERTICAL SPINE (x = 180) ==================== -->
    <!-- Signal Input Top -->
    <g transform="translate(180, 20)">
      <rect x="-60" y="0" width="120" height="24" rx="4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2" />
      <text x="0" y="16" fill="#f0f9ff" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">CHANNEL INPUT</text>
    </g>

    <!-- Main Signal Flow Line (Thick Bus) -->
    <line x1="180" y1="44" x2="180" y2="188" stroke="#64748b" stroke-width="4" stroke-linecap="round" />

    <!-- ==================== 1. PRE-FADER TAP POINT (y = 66) ==================== -->
    <circle cx="180" cy="66" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-green)" />
    <!-- Pre-Fader Branch Line to Right -->
    <line x1="186" y1="66" x2="340" y2="66" stroke="#22c55e" stroke-width="2.5" marker-end="url(#arrow-green)" />

    <!-- PRE-FADER DESTINATION CARD (HEADPHONES) -->
    <g transform="translate(346, 38)">
      <rect x="0" y="0" width="300" height="56" rx="7" fill="#052e16" stroke="#22c55e" stroke-width="1.8" filter="url(#glow-green)" />
      <!-- Left Tag -->
      <rect x="10" y="8" width="95" height="18" rx="3" fill="#166534" />
      <text x="57" y="21" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">PRE-FADER AUX</text>
      <!-- Title -->
      <text x="115" y="22" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="800">&#x1F3A7; Musician Headphone Mix</text>
      
      <!-- Key behavior label -->
      <text x="12" y="44" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">INDEPENDENT OF FADER: <tspan fill="#86efac" font-weight="500">Control room fader changes do not alter cue volume.</tspan></text>
    </g>

    <!-- ==================== 2. CHANNEL FADER (y = 96 to 154) ==================== -->
    <g transform="translate(180, 125)">
      <!-- Fader Track Slot -->
      <rect x="-18" y="-30" width="36" height="60" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#000000" stroke-width="3" />
      <!-- dB marks -->
      <line x1="-12" y1="-15" x2="-6" y2="-15" stroke="#94a3b8" stroke-width="1" />
      <line x1="-12" y1="0" x2="-4" y2="0" stroke="#facc15" stroke-width="1.5" />
      <line x1="-12" y1="15" x2="-6" y2="15" stroke="#94a3b8" stroke-width="1" />
      <!-- Fader Handle Knob (At 0dB) -->
      <rect x="-16" y="-8" width="32" height="16" rx="2" fill="#cbd5e1" stroke="#ffffff" stroke-width="1" />
      <line x1="-16" y1="0" x2="16" y2="0" stroke="#ef4444" stroke-width="1.5" />
      <!-- Fader Label -->
      <text x="-24" y="4" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="end">CHANNEL FADER</text>
    </g>

    <!-- ==================== 3. POST-FADER TAP POINT (y = 166) ==================== -->
    <circle cx="180" cy="166" r="6" fill="#facc15" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-gold)" />
    <!-- Post-Fader Branch Line to Right -->
    <line x1="186" y1="166" x2="340" y2="166" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrow-gold)" />

    <!-- POST-FADER DESTINATION CARD (REVERB / DELAY) -->
    <g transform="translate(346, 138)">
      <rect x="0" y="0" width="300" height="56" rx="7" fill="#1c1917" stroke="#facc15" stroke-width="1.2" />
      <!-- Left Tag -->
      <rect x="10" y="8" width="105" height="18" rx="3" fill="#854d0e" />
      <text x="62" y="21" fill="#fef08a" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">POST-FADER AUX</text>
      <!-- Title -->
      <text x="125" y="22" fill="#facc15" font-family="system-ui, sans-serif" font-size="12" font-weight="800">&#x2728; Reverb &amp; Delay Effects</text>
      
      <!-- Key behavior label -->
      <text x="12" y="44" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">AFFECTED BY FADER: <tspan fill="#fde047" font-weight="500">Send level scales with fader to preserve wet/dry ratio.</tspan></text>
    </g>

    <!-- Channel Output Bottom -->
    <g transform="translate(180, 196)">
      <line x1="180" y1="188" x2="180" y2="198" stroke="#64748b" stroke-width="4" />
      <circle cx="0" cy="0" r="3" fill="#38bdf8" />
      <text x="0" y="-3" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">&#x2193; MAIN BUS (CONTROL ROOM MONITORS)</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: 3 EXPLANATION CARDS ==================== -->
  <g transform="translate(24, 280)">
    <!-- CARD 1: PRE-FADER HEADPHONE MIX (CORRECT ANSWER) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.8" />
      <rect x="10" y="10" width="95" height="18" rx="4" fill="#166534" />
      <text x="57" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CORRECT ANSWER</text>
      
      <text x="12" y="46" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Pre-Fader for Cue Mix</text>
      <text x="12" y="64" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Pre-fader taps before the fader.</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Moving the control room fader</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">or muting channels has</text>
      <text x="12" y="106" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">zero effect on musician cue.</text>
    </g>

    <!-- CARD 2: POST-FADER FOR EFFECTS -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="112" height="18" rx="4" fill="#854d0e" />
      <text x="66" y="23" fill="#fef08a" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">POST-FADER FOR FX</text>
      
      <text x="12" y="46" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Preserves Wet/Dry Ratio</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Post-fader taps after the fader.</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">When you pull down a vocal,</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">its reverb send drops too,</text>
      <text x="12" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">avoiding a muddy reverb wash.</text>
    </g>

    <!-- CARD 3: STUDIO PROTOCOL -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="105" height="18" rx="4" fill="#0369a1" />
      <text x="62" y="23" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SESSION PROTOCOL</text>
      
      <text x="12" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Performer Comfort</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Never use post-fader sends</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">for monitor mixes. Tweaking</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">the control room balance must</text>
      <text x="12" y="106" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">never distract the performer.</text>
    </g>
  </g>
</svg>