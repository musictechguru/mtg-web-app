<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="960" height="620" fill="#0b1120"/>

  <!-- Title Header -->
  <text x="480" y="44" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="1.5">FILTER RESONANCE (Q) &amp; CUTOFF SWEEP</text>
  <text x="480" y="72" fill="#94a3b8" font-size="13.5" text-anchor="middle">How feedback at the cutoff frequency creates sharp resonant peaks and self-oscillation</text>

  <!-- Main Frequency Response Graph -->
  <g transform="translate(60, 100)">
    <rect width="840" height="340" rx="10" fill="#131e36" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Graph Grid Lines -->
    <line x1="80" y1="280" x2="790" y2="280" stroke="#334155" stroke-width="1.5"/>
    <line x1="80" y1="40" x2="80" y2="280" stroke="#334155" stroke-width="1.5"/>

    <!-- Axis Labels -->
    <text x="80" y="32" fill="#94a3b8" font-size="12" font-weight="bold">Gain (dB)</text>
    <text x="790" y="300" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="end">Frequency (Hz) →</text>

    <!-- 0 dB reference line -->
    <line x1="80" y1="180" x2="790" y2="180" stroke="#1e293b" stroke-dasharray="4,4"/>
    <text x="70" y="184" fill="#64748b" font-size="11" text-anchor="end">0 dB</text>
    <text x="70" y="70" fill="#f59e0b" font-size="11" text-anchor="end">+18 dB</text>

    <!-- Curve 1: Low / No Resonance (Q=0.7) - Grey dashed line -->
    <path d="M 80 180 L 380 180 C 440 180, 480 200, 560 280" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="320" y="205" fill="#94a3b8" font-size="11">No Resonance (Flat passband)</text>

    <!-- Curve 2: High Resonance (Q) - Golden glowing peak -->
    <!-- Cutoff fc at x=450 -->
    <path d="M 80 180 L 360 180 C 400 180, 425 120, 450 65 C 475 120, 490 220, 560 280" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

    <!-- Peak Indicator -->
    <circle cx="450" cy="65" r="6" fill="#ef4444"/>
    <line x1="450" y1="65" x2="450" y2="280" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="450" y="298" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">Cutoff Frequency (fc)</text>

    <!-- Resonance Callout Box -->
    <g transform="translate(470, 70)">
      <rect width="260" height="75" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="15" y="24" fill="#f59e0b" font-size="13" font-weight="bold">RESONANT PEAK (Q)</text>
      <text x="15" y="44" fill="#cbd5e1" font-size="11.5">Amplifies harmonics lying right at the cutoff.</text>
      <text x="15" y="62" fill="#94a3b8" font-size="11">Sweeping fc creates the iconic 'wah / squelch'.</text>
    </g>

    <!-- Sweep Motion Arrow -->
    <g transform="translate(350, 235)">
      <path d="M 0 0 L 200 0" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4"/>
      <polygon points="205,0 195,-5 195,5" fill="#38bdf8"/>
      <polygon points="-5,0 5,-5 5,5" fill="#38bdf8"/>
      <text x="100" y="-10" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Cutoff Swept Across Spectrum</text>
    </g>
  </g>

  <!-- Bottom Explanatory Card -->
  <g transform="translate(60, 465)">
    <rect width="840" height="125" rx="10" fill="#131e36" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="32" fill="#38bdf8" font-size="14" font-weight="bold">What Happens During a Cutoff Sweep with High Resonance?</text>
    <text x="25" y="58" fill="#cbd5e1" font-size="12.5">1. As the cutoff frequency moves, the <tspan fill="#f59e0b" font-weight="bold">boosted resonant peak</tspan> passes through different harmonics of the raw oscillator waveform.</text>
    <text x="25" y="82" fill="#cbd5e1" font-size="12.5">2. Each harmonic is dramatically emphasized in turn, producing the biting, whistling, vocal-like sweep (classic in Acid House 303 basslines).</text>
    <text x="25" y="106" fill="#94a3b8" font-size="11.5">3. At extreme settings, the filter enters <tspan fill="#ef4444" font-weight="bold">self-oscillation</tspan>, generating a pure sine wave even with no input signal.</text>
  </g>
</svg>
