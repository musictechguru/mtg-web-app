<svg width="720" height="400" viewBox="0 0 720 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" rx="14" fill="#0f172a" />
  <rect x="1" y="1" width="718" height="398" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Header Badge -->
  <rect x="195" y="16" width="330" height="30" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
  <text x="360" y="36" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">CHORUS EFFECT ARCHITECTURE &amp; DOUBLING</text>

  <!-- TOP SECTION: BLOCK DIAGRAM -->
  <rect x="24" y="60" width="672" height="186" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />

  <!-- Input Node -->
  <circle cx="60" cy="135" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="60" y="139" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">IN</text>
  <text x="60" y="166" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Mono Signal</text>

  <!-- Direct Path (Top) -->
  <path d="M 78 135 L 115 135 L 115 95 L 530 95 L 530 125" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />
  <rect x="270" y="82" width="140" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="340" y="98" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DIRECT DRY SIGNAL</text>

  <!-- Modulated Delay Path (Bottom) -->
  <path d="M 115 135 L 115 170 L 160 170" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple)" />

  <!-- Delay Line Box (15-35 ms) -->
  <rect x="165" y="145" width="170" height="50" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.8" />
  <text x="250" y="166" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SHORT DELAY LINE</text>
  <text x="250" y="183" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">15 ms – 35 ms Range</text>

  <!-- LFO Box -->
  <rect x="375" y="145" width="140" height="50" rx="8" fill="#0f172a" stroke="#facc15" stroke-width="1.5" />
  <path d="M 390 170 Q 400 158 410 170 T 430 170" stroke="#facc15" stroke-width="2" fill="none" />
  <text x="465" y="166" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">LFO (0.5 - 3Hz)</text>
  <text x="465" y="183" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Cyclical Detuning</text>

  <!-- Modulation Arrow from LFO to Delay line -->
  <path d="M 375 170 L 340 170" stroke="#facc15" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#arrow-amber)" />

  <!-- Output from Delay Line to Summing Amp -->
  <path d="M 335 170 L 350 170 L 350 210 L 530 210 L 530 145" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple)" />
  <text x="440" y="224" fill="#c084fc" font-family="monospace" font-size="9">Pitch-Modulated Copy</text>

  <!-- Summing Mixer Node -->
  <circle cx="530" cy="135" r="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
  <text x="530" y="141" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Σ</text>

  <!-- Output Node -->
  <line x1="546" y1="135" x2="615" y2="135" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)" />
  <circle cx="635" cy="135" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="635" y="139" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">OUT</text>
  <text x="635" y="166" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Lush Chorus</text>

  <!-- BOTTOM SECTION: WAVEFORM COMPARISON -->
  <rect x="24" y="254" width="672" height="132" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />
  <text x="44" y="276" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">ACOUSTIC EFFECT: ENSEMBLE DOUBLING &amp; MICRO-DETUNING</text>

  <!-- Left: Dry Tone -->
  <rect x="44" y="286" width="280" height="86" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="56" y="304" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Dry Signal: Single Point Source</text>
  <path d="M 56 340 Q 80 310 104 340 T 152 340 T 200 340 T 248 340 T 296 340" stroke="#38bdf8" stroke-width="2" fill="none" />

  <!-- Right: Chorus Ensemble -->
  <rect x="348" y="286" width="330" height="86" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="360" y="304" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Chorus: Dry + Micro-Detuned Vibrato (Shimmer &amp; Width)</text>
  <!-- Overlapping detuned waves -->
  <path d="M 360 340 Q 384 312 408 340 T 456 340 T 504 340 T 552 340 T 600 340 T 648 340" stroke="#38bdf8" stroke-width="1.8" fill="none" opacity="0.6" stroke-dasharray="3 3" />
  <path d="M 360 342 Q 382 316 405 342 T 452 342 T 498 342 T 546 342 T 594 342 T 642 342" stroke="#c084fc" stroke-width="2" fill="none" filter="url(#glow-purple)" />
  <path d="M 360 338 Q 386 308 411 338 T 460 338 T 509 338 T 558 338 T 606 338 T 655 338" stroke="#facc15" stroke-width="1.5" fill="none" opacity="0.8" />
</svg>
