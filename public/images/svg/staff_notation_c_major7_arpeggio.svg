<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="staffBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="240" rx="12" fill="url(#staffBg)" stroke="#334155" stroke-width="2" />

  <!-- Score Title -->
  <text x="300" y="32" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="800" text-anchor="middle">
    TREBLE CLEF MELODY: C MAJOR 7 ARPEGGIO (C4 - E4 - G4 - B4)
  </text>
  <text x="300" y="52" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">
    Four Quarter Notes • 4/4 Time Signature
  </text>

  <!-- Musical Staff Lines (5 lines, y = 90, 105, 120, 135, 150) -->
  <g stroke="#cbd5e1" stroke-width="1.5">
    <line x1="50" y1="90" x2="550" y2="90" />
    <line x1="50" y1="105" x2="550" y2="105" />
    <line x1="50" y1="120" x2="550" y2="120" />
    <line x1="50" y1="135" x2="550" y2="135" />
    <line x1="50" y1="150" x2="550" y2="150" />
  </g>

  <!-- Bar line at start and end -->
  <line x1="50" y1="90" x2="50" y2="150" stroke="#cbd5e1" stroke-width="2.5" />
  <line x1="550" y1="90" x2="550" y2="150" stroke="#cbd5e1" stroke-width="2.5" />
  <line x1="544" y1="90" x2="544" y2="150" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Treble Clef Graphic (Stylized & Elegant) -->
  <path d="M 80 162 C 85 158 92 148 90 135 C 88 122 75 118 73 105 C 70 85 92 65 92 65 C 92 65 98 90 92 120 C 86 148 76 160 84 175 C 90 185 80 190 75 185 C 70 180 73 170 80 162 Z" fill="#38bdf8" />
  <circle cx="85" cy="180" r="4" fill="#38bdf8" />

  <!-- Time Signature: 4/4 -->
  <text x="125" y="118" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="28" font-weight="bold" text-anchor="middle">4</text>
  <text x="125" y="148" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="28" font-weight="bold" text-anchor="middle">4</text>

  <!-- NOTE 1: C4 (Middle C, ledger line below staff at y=165) -->
  <g transform="translate(190, 165)">
    <!-- Ledger line -->
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#cbd5e1" stroke-width="2" />
    <!-- Notehead -->
    <ellipse cx="0" cy="0" rx="9" ry="6.5" fill="#f8fafc" transform="rotate(-20)" />
    <!-- Stem pointing UP -->
    <line x1="8" y1="-2" x2="8" y2="-45" stroke="#f8fafc" stroke-width="2" />
    <text x="0" y="30" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">C4</text>
    <text x="0" y="44" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">(Beat 1)</text>
  </g>

  <!-- NOTE 2: E4 (Bottom line of staff at y=150) -->
  <g transform="translate(280, 150)">
    <ellipse cx="0" cy="0" rx="9" ry="6.5" fill="#f8fafc" transform="rotate(-20)" />
    <line x1="8" y1="-2" x2="8" y2="-45" stroke="#f8fafc" stroke-width="2" />
    <text x="0" y="45" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">E4</text>
    <text x="0" y="59" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">(Beat 2)</text>
  </g>

  <!-- NOTE 3: G4 (Second line from bottom at y=135) -->
  <g transform="translate(370, 135)">
    <ellipse cx="0" cy="0" rx="9" ry="6.5" fill="#f8fafc" transform="rotate(-20)" />
    <line x1="8" y1="-2" x2="8" y2="-45" stroke="#f8fafc" stroke-width="2" />
    <text x="0" y="60" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">G4</text>
    <text x="0" y="74" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">(Beat 3)</text>
  </g>

  <!-- NOTE 4: B4 (Third line / center of staff at y=120) -->
  <g transform="translate(460, 120)">
    <ellipse cx="0" cy="0" rx="9" ry="6.5" fill="#f8fafc" transform="rotate(-20)" />
    <!-- Stem pointing DOWN -->
    <line x1="-8" y1="2" x2="-8" y2="45" stroke="#f8fafc" stroke-width="2" />
    <text x="0" y="75" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">B4</text>
    <text x="0" y="89" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">(Beat 4)</text>
  </g>
</svg>
