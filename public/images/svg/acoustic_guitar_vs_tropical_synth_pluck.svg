<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-inst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-inst-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad-inst)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#14b8a6" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#14b8a6" filter="url(#glow-inst-teal)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">INSTRUMENTATION: ACOUSTIC FINGERPICKED GUITAR VS TROPICAL SYNTH PLUCK</text>
    <rect x="520" y="6" width="140" height="22" rx="4" fill="#134e4a" fill-opacity="0.4" stroke="#14b8a6" stroke-width="0.8" />
    <text x="590" y="21" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">COMPARISON 2: Q14</text>
  </g>

  <!-- Left: Acoustic Steel-String Guitar (Tracy Chapman) -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="324" height="270" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <rect x="12" y="12" width="300" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="162" y="30" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">VERSION A: ACOUSTIC GUITAR &amp; VOCAL FOCUS</text>

    <!-- Guitar Graphic -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="80" height="84" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="40" cy="50" r="22" fill="#78350f" />
      <circle cx="40" cy="50" r="8" fill="#090d16" />
      <line x1="40" y1="8" x2="40" y2="42" stroke="#bae6fd" stroke-width="4" stroke-linecap="round" />
      <text x="40" y="80" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Acoustic Body</text>

      <text x="96" y="24" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">Natural Steel-String Riff</text>
      <text x="96" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Fingerpicked 4-chord pattern</text>
      <text x="96" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Natural spruce/rosewood resonance</text>
      <text x="96" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Dynamic finger attack nuance</text>
      <text x="96" y="84" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Anchors the narrative storytelling</text>
    </g>

    <!-- Sonic Profile Box -->
    <g transform="translate(14, 150)">
      <rect x="0" y="0" width="296" height="108" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800">ORGANIC PRODUCTION TRAITS:</text>
      <text x="10" y="38" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Captured with small/large diaphragm condenser mics</text>
      <text x="10" y="54" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Mic placed at 12th fret for balanced string sheen &amp; body</text>
      <text x="10" y="70" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Vocal and guitar blend organically without synthetic layers</text>
      <text x="10" y="86" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700">• Primary musical engine of the entire song</text>
    </g>
  </g>

  <!-- Right: Tropical Synth Pluck (Jonas Blue) -->
  <g transform="translate(372, 62)">
    <rect x="0" y="0" width="324" height="270" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <rect x="12" y="12" width="300" height="28" rx="6" fill="#1e293b" stroke="#14b8a6" stroke-width="1" />
    <text x="162" y="30" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">VERSION B: TROPICAL SYNTH MARIMBA / PLUCK</text>

    <!-- Synth Visual -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="80" height="84" rx="8" fill="#1e293b" stroke="#14b8a6" stroke-width="1.5" />
      <!-- Wave / envelope icon -->
      <path d="M 12 70 L 16 20 L 40 70 L 70 70" stroke="#14b8a6" stroke-width="2.5" fill="none" />
      <text x="40" y="80" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">0% Sustain</text>

      <text x="96" y="24" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">Synthesized Marimba Pluck</text>
      <text x="96" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Instant attack, fast decay to zero</text>
      <text x="96" y="56" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• FM synthesis / marimba sample</text>
      <text x="96" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Dotted-8th stereo ping-pong delay</text>
      <text x="96" y="84" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Layered with vocal chops on drop</text>
    </g>

    <!-- Synthetic Profile Box -->
    <g transform="translate(14, 150)">
      <rect x="0" y="0" width="296" height="108" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="20" fill="#14b8a6" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800">ELECTRONIC PRODUCTION TRAITS:</text>
      <text x="10" y="38" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Replaces acoustic guitar riff with bright percussive mallet tone</text>
      <text x="10" y="54" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Filter cutoff modulated to open gradually during verse</text>
      <text x="10" y="70" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Sidechained to the kick drum for rhythmic ducking</text>
      <text x="10" y="86" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700">• Defines the modern tropical house aesthetic</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 342)">
    <rect x="0" y="0" width="672" height="60" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1.2" />
    <text x="16" y="22" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800">CORE INSTRUMENTATION CONTRAST:</text>
    <text x="16" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Tracy Chapman centers her production entirely around real acoustic guitar and vocals. Jonas Blue replaces this with a synthetic marimba/kalimba pluck lead backed by heavy electronic drums and synths.</text>
  </g>
</svg>