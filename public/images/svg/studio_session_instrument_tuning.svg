<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Tuner Display Gradient -->
    <linearGradient id="tuner-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051e15" />
      <stop offset="100%" stop-color="#020f0a" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#22c55e" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#22c55e" filter="url(#glow-green)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">RECORDING WORKFLOW: INSTRUMENT TUNING &amp; PITCH INTEGRITY</text>
    <rect x="522" y="6" width="138" height="22" rx="4" fill="#064e3b" fill-opacity="0.5" stroke="#22c55e" stroke-width="0.8" />
    <text x="591" y="21" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">A4 = 440 Hz MASTER</text>
  </g>

  <!-- ==================== MAIN GRAPHICS AREA (STAGE SETUP) ==================== -->
  <g transform="translate(24, 60)">
    <!-- Main sub-plate -->
    <rect x="0" y="0" width="672" height="206" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- ==================== LEFT: PITCH DRIFT CAUSES ==================== -->
    <g transform="translate(14, 14)">
      <rect x="0" y="0" width="190" height="178" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <rect x="8" y="8" width="145" height="18" rx="4" fill="#1e293b" />
      <text x="80" y="21" fill="#f87171" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">WHY PITCH DRIFTS</text>

      <!-- Cause 1: Studio Lighting / Heat -->
      <g transform="translate(12, 38)">
        <circle cx="12" cy="12" r="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
        <text x="12" y="16" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">T°</text>
        <text x="30" y="12" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Studio Heat &amp; Lights</text>
        <text x="30" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Expands metal strings (goes flat)</text>
      </g>

      <!-- Cause 2: Humidity Shifts -->
      <g transform="translate(12, 74)">
        <circle cx="12" cy="12" r="10" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
        <text x="12" y="16" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">H%</text>
        <text x="30" y="12" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Room Humidity</text>
        <text x="30" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Expands guitar neck wood</text>
      </g>

      <!-- Cause 3: Aggressive Playing Tension -->
      <g transform="translate(12, 110)">
        <circle cx="12" cy="12" r="10" fill="#78350f" stroke="#f59e0b" stroke-width="1" />
        <text x="12" y="16" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">F</text>
        <text x="30" y="12" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Hard Plectrum Attack</text>
        <text x="30" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Bends &amp; stretches string tension</text>
      </g>

      <rect x="8" y="148" width="174" height="22" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" />
      <text x="95" y="163" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Continuous drift occurs every take</text>
    </g>

    <!-- ==================== CENTER: CHROMATIC RACK TUNER DISPLAY ==================== -->
    <g transform="translate(216, 14)">
      <!-- Rack Tuner Enclosure -->
      <rect x="0" y="0" width="240" height="178" rx="8" fill="#030712" stroke="#334155" stroke-width="1.5" />
      <!-- Top rack ear screws -->
      <circle cx="10" cy="10" r="3" fill="#475569" />
      <circle cx="230" cy="10" r="3" fill="#475569" />
      <circle cx="10" cy="168" r="3" fill="#475569" />
      <circle cx="230" cy="168" r="3" fill="#475569" />

      <!-- Tuner Display Screen Glass -->
      <rect x="16" y="18" width="208" height="116" rx="6" fill="url(#tuner-glass)" stroke="#065f46" stroke-width="1.5" />

      <!-- Note Name (Large Center) -->
      <text x="120" y="66" fill="#4ade80" font-family="system-ui, monospace" font-size="34" font-weight="900" text-anchor="middle" filter="url(#glow-green)">A</text>
      <text x="148" y="52" fill="#22c55e" font-family="system-ui, monospace" font-size="14" font-weight="700">2</text>
      <text x="120" y="82" fill="#86efac" font-family="system-ui, monospace" font-size="10" font-weight="700" text-anchor="middle">440.0 Hz</text>

      <!-- Tuning Arc Meter (Center Needle & Cent Indicators) -->
      <!-- Flat Scale Line (Left - Red) -->
      <line x1="36" y1="98" x2="108" y2="98" stroke="#ef4444" stroke-width="2" />
      <text x="36" y="112" fill="#f87171" font-family="system-ui, sans-serif" font-size="8" font-weight="700">♭ FLAT</text>

      <!-- Center Perfect Pitch (Green Pill & Needle) -->
      <rect x="114" y="90" width="12" height="16" rx="2" fill="#22c55e" filter="url(#glow-green)" />
      <line x1="120" y1="84" x2="120" y2="106" stroke="#ffffff" stroke-width="2.5" />

      <!-- Sharp Scale Line (Right - Blue) -->
      <line x1="132" y1="98" x2="204" y2="98" stroke="#38bdf8" stroke-width="2" />
      <text x="204" y="112" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="end">SHARP ♯</text>

      <!-- Centered In-Tune Status Badge -->
      <rect x="24" y="142" width="192" height="26" rx="5" fill="#064e3b" stroke="#22c55e" stroke-width="1.2" />
      <circle cx="36" cy="155" r="4" fill="#22c55e" filter="url(#glow-green)" />
      <text x="120" y="159" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">IN TUNE (±0.1 CENT LOCKED)</text>
    </g>

    <!-- ==================== RIGHT: TAKE-BY-TAKE RECORDING WORKFLOW ==================== -->
    <g transform="translate(468, 14)">
      <rect x="0" y="0" width="190" height="178" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <rect x="8" y="8" width="160" height="18" rx="4" fill="#064e3b" />
      <text x="88" y="21" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SESSION PROCEDURE</text>

      <!-- Step 1: Tune -->
      <g transform="translate(10, 36)">
        <rect x="0" y="0" width="170" height="22" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="1" />
        <text x="85" y="15" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">1. TUNE ALL INSTRUMENTS</text>
      </g>
      <line x1="95" y1="58" x2="95" y2="65" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)" />

      <!-- Step 2: Record Take 1 -->
      <g transform="translate(10, 68)">
        <rect x="0" y="0" width="170" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
        <text x="85" y="15" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">2. RECORD TAKE 1</text>
      </g>
      <line x1="95" y1="90" x2="95" y2="97" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)" />

      <!-- Step 3: Mandatory Re-Tune -->
      <g transform="translate(10, 100)">
        <rect x="0" y="0" width="170" height="22" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="1.2" filter="url(#glow-badge)" />
        <text x="85" y="15" fill="#facc15" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x26A0; RE-CHECK TUNING</text>
      </g>
      <line x1="95" y1="122" x2="95" y2="129" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)" />

      <!-- Step 4: Record Take 2 -->
      <g transform="translate(10, 132)">
        <rect x="0" y="0" width="170" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
        <text x="85" y="15" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">3. RECORD TAKE 2</text>
      </g>

      <text x="95" y="168" fill="#22c55e" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">↵ REPEAT BEFORE EVERY TAKE</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: 3 EXPLANATION CARDS ==================== -->
  <g transform="translate(24, 280)">
    <!-- CARD 1: BEFORE EVERY TAKE (CORRECT ANSWER) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.8" />
      <rect x="10" y="10" width="95" height="18" rx="4" fill="#166534" />
      <text x="57" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CORRECT ANSWER</text>
      
      <text x="12" y="46" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Before Every Take</text>
      <text x="12" y="64" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Tune early &amp; tune often.</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Guitars and acoustic instruments</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">drift constantly. Tuning before</text>
      <text x="12" y="106" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">each take is studio protocol.</text>
    </g>

    <!-- CARD 2: CHORDS CANNOT BE TUNED IN POST -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="112" height="18" rx="4" fill="#881337" />
      <text x="66" y="23" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">FATAL MIX FLAW</text>
      
      <text x="12" y="46" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Chords Can't Be Fixed</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Auto-Tune and Melodyne work</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">great on monophonic vocals,</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">but out-of-tune guitar chords</text>
      <text x="12" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">create permanent dissonance.</text>
    </g>

    <!-- CARD 3: MULTI-TRACK COMPING HARMONY -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="105" height="18" rx="4" fill="#0369a1" />
      <text x="62" y="23" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">OVERDUB HARMONY</text>
      
      <text x="12" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Flawless Layering</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">When double-tracking guitars</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">or adding bass overdubs, strict</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">tuning ensures wide, powerful</text>
      <text x="12" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">tones without chorusing beating.</text>
    </g>
  </g>
</svg>