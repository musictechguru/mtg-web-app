<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <rect width="720" height="400" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">BINSON ECHOREC: MAGNETIC DRUM DELAY (1973)</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Pink Floyd's Secret Weapon: Rotating Steel Wheel with 4 Playback Heads</text>

  <!-- Left: Mechanical Diagram -->
  <g transform="translate(40, 75)">
    <rect width="310" height="225" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="155" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ROTATING MAGNETIC DRUM (NO TAPE TANGLES)</text>

    <!-- Large Rotating Drum Circle -->
    <g transform="translate(155, 125)">
      <circle cx="0" cy="0" r="70" fill="#334155" stroke="#94a3b8" stroke-width="4" />
      <circle cx="0" cy="0" r="62" fill="#0f172a" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="16" fill="#64748b" />
      <text x="0" y="4" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">MOTOR</text>

      <!-- Record Head (Top) -->
      <rect x="-14" y="-84" width="28" height="14" rx="2" fill="#ef4444" />
      <text x="0" y="-88" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">RECORD HEAD</text>

      <!-- 4 Playback Heads Around Drum -->
      <rect x="68" y="-20" width="14" height="24" rx="2" fill="#22c55e" />
      <text x="88" y="-5" fill="#86efac" font-family="system-ui, sans-serif" font-size="7" font-weight="700">HEAD 1</text>

      <rect x="42" y="52" width="14" height="24" rx="2" fill="#22c55e" transform="rotate(45 42 52)" />
      <text x="66" y="70" fill="#86efac" font-family="system-ui, sans-serif" font-size="7" font-weight="700">HEAD 2</text>

      <rect x="-14" y="70" width="28" height="14" rx="2" fill="#22c55e" />
      <text x="0" y="96" fill="#86efac" font-family="system-ui, sans-serif" font-size="7" font-weight="700" text-anchor="middle">HEAD 3</text>

      <rect x="-82" y="-20" width="14" height="24" rx="2" fill="#22c55e" />
      <text x="-98" y="-5" fill="#86efac" font-family="system-ui, sans-serif" font-size="7" font-weight="700">HEAD 4</text>

      <!-- Erase Head -->
      <rect x="-60" y="-70" width="14" height="20" rx="2" fill="#eab308" transform="rotate(-40 -60 -70)" />
      <text x="-75" y="-75" fill="#fde047" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700">ERASE</text>
    </g>
  </g>

  <!-- Right: Technical Characteristics -->
  <g transform="translate(370, 75)">
    <rect width="310" height="225" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="155" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">WHY THE ECHOREC SOUNDS UNIQUE</text>

    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="270" height="46" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="12" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">1. STEEL WIRE RECORDING SURFACE:</text>
      <text x="12" y="34" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">Avoids tape wear, stretching, or tangling. Delivers unique</text>
    </g>

    <g transform="translate(20, 100)">
      <rect x="0" y="0" width="270" height="46" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1" />
      <text x="12" y="18" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">2. MULTI-TAP RHYTHMIC DELAYS:</text>
      <text x="12" y="34" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">Selecting head combinations created syncopated echoes</text>
    </g>

    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="270" height="56" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="12" y="18" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">3. WARM TUBE PREAMP SATURATION:</text>
      <text x="12" y="34" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">Repeats darken and gently saturate with each feedback cycle,</text>
      <text x="12" y="47" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">sitting perfectly behind David Gilmour's Stratocaster solo.</text>
    </g>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 315)">
    <rect width="640" height="65" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EDEXCEL EXAM CONTRAST: MECHANICAL DELAY VS DIGITAL PEDALS</text>
    <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Questions often ask how vintage delay was achieved prior to 1980s digital chips. In 1973, Pink Floyd relied on the Italian Binson Echorec magnetic drum and tape loops—not Boss DD digital pedals.</text>
  </g>
</svg>