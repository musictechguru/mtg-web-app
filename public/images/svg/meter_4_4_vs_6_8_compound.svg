<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-mtr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-mtr-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad-mtr)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#10b981" filter="url(#glow-mtr-emerald)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">METER &amp; RHYTHMIC GROOVE: 4/4 COMMON TIME VS 6/8 COMPOUND DUPLE SOUL</text>
    <rect x="520" y="6" width="140" height="22" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="0.8" />
    <text x="590" y="21" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">COMPARISON 6</text>
  </g>

  <!-- Top: 4/4 Common Time (The Beatles) -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="672" height="136" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800">THE BEATLES (1967) — 4/4 SIMPLE QUADRUPLE (112 BPM POP MARCH)</text>

    <!-- Grid Beats -->
    <g transform="translate(16, 38)">
      <!-- Beat 1 -->
      <rect x="0" y="0" width="145" height="52" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="72" y="22" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BEAT 1 (STRONG)</text>
      <text x="72" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Kick + Bass Root (1 &amp;)</text>

      <!-- Beat 2 -->
      <rect x="160" y="0" width="145" height="52" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
      <text x="232" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BEAT 2 (BACKBEAT)</text>
      <text x="232" y="38" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Snare hit (2 &amp;)</text>

      <!-- Beat 3 -->
      <rect x="320" y="0" width="145" height="52" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="392" y="22" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BEAT 3 (MEDIUM)</text>
      <text x="392" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Kick / Bass pulse (3 &amp;)</text>

      <!-- Beat 4 -->
      <rect x="480" y="0" width="145" height="52" rx="6" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" />
      <text x="552" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BEAT 4 (BACKBEAT)</text>
      <text x="552" y="38" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Snare hit (4 &amp;)</text>
    </g>

    <text x="16" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Straight eighth-note subdivisions • Light, steady, brisk singalong pop groove.</text>
  </g>

  <!-- Bottom: 6/8 Compound Duple (Joe Cocker) -->
  <g transform="translate(24, 210)">
    <rect x="0" y="0" width="672" height="136" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="24" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800">JOE COCKER (1968) — 6/8 COMPOUND DUPLE (~56 BPM SLOW SOUL / GOSPEL WALTZ)</text>

    <!-- Grid Beats: 2 main dotted-quarter pulses, 3 eighth notes each -->
    <g transform="translate(16, 38)">
      <!-- Pulse 1: 1-2-3 -->
      <rect x="0" y="0" width="305" height="52" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5" />
      <text x="152" y="22" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">PULSE 1: (Eighth notes 1 - 2 - 3)</text>
      <text x="152" y="38" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Heavy Downbeat accent • Rolling triplet feel</text>

      <!-- Pulse 2: 4-5-6 -->
      <rect x="320" y="0" width="305" height="52" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5" />
      <text x="472" y="22" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">PULSE 2: (Eighth notes 4 - 5 - 6)</text>
      <text x="472" y="38" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Massive snare &amp; cymbal crash on count 4</text>
    </g>

    <text x="16" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Swung triplet sway • Dramatic tempo elasticity (rubato) allowing massive vocal screams and organ swells.</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 356)">
    <rect x="0" y="0" width="672" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="14" y="18" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800">EDEXCEL MT EXAM QUESTION HIGHLIGHT:</text>
    <text x="14" y="34" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">Joe Cocker completely transforms the rhythmic identity of the Beatles classic by changing the meter from a brisk 4/4 pop march to a rolling, emotional 6/8 slow soul ballad.</text>
  </g>
</svg>