<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-ccbytes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Byte Header Gradients -->
    <linearGradient id="status-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="data1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="data2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <filter id="glow-badge-ccbytes" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad-ccbytes)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#f97316" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#f97316" filter="url(#glow-badge-ccbytes)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">MIDI PROTOCOL: CONTROL CHANGE (CC) 3-BYTE MESSAGE STRUCTURE</text>
    <rect x="526" y="6" width="134" height="22" rx="4" fill="#7c2d12" fill-opacity="0.4" stroke="#f97316" stroke-width="0.8" />
    <text x="593" y="21" fill="#fed7aa" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">TOTAL: 3 BYTES (24 BITS)</text>
  </g>

  <!-- ==================== MAIN 3-BYTE CARDS DISPLAY ==================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="672" height="248" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- 1. BYTE 1: STATUS BYTE -->
    <g transform="translate(18, 16)">
      <rect x="0" y="0" width="202" height="216" rx="8" fill="#181119" stroke="#ef4444" stroke-width="1.5" />
      <rect x="0" y="0" width="202" height="32" rx="8" fill="url(#status-grad)" />
      <text x="101" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">BYTE 1: STATUS BYTE</text>

      <!-- Binary Layout -->
      <g transform="translate(12, 42)">
        <rect x="0" y="0" width="178" height="42" rx="5" fill="#09060b" stroke="#334155" />
        <text x="12" y="26" fill="#fca5a5" font-family="monospace" font-size="16" font-weight="900">1011</text>
        <text x="74" y="26" fill="#fb923c" font-family="monospace" font-size="16" font-weight="900">nnnn</text>
        <text x="134" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">(Hex: B_)</text>
      </g>

      <!-- Field Explanations -->
      <g transform="translate(12, 94)">
        <!-- Bit 7 = 1 -->
        <rect x="0" y="0" width="178" height="34" rx="4" fill="#2d1215" stroke="#7f1d1d" stroke-width="0.8" />
        <text x="8" y="15" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">Bit 7 = 1 (Status Indicator)</text>
        <text x="8" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Flags this byte as a MIDI Command</text>

        <!-- Command Code -->
        <rect x="0" y="40" width="178" height="34" rx="4" fill="#2d1215" stroke="#7f1d1d" stroke-width="0.8" />
        <text x="8" y="55" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">'011' = Control Change (CC)</text>
        <text x="8" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Message type identifier (CC command)</text>

        <!-- Channel -->
        <rect x="0" y="80" width="178" height="34" rx="4" fill="#2d1215" stroke="#7f1d1d" stroke-width="0.8" />
        <text x="8" y="95" fill="#fb923c" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">'nnnn' = MIDI Channel</text>
        <text x="8" y="108" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">4 bits = Channels 1 through 16</text>
      </g>
    </g>

    <!-- 2. BYTE 2: DATA BYTE 1 (CC NUMBER) -->
    <g transform="translate(235, 16)">
      <rect x="0" y="0" width="202" height="216" rx="8" fill="#0d1929" stroke="#3b82f6" stroke-width="1.5" />
      <rect x="0" y="0" width="202" height="32" rx="8" fill="url(#data1-grad)" />
      <text x="101" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">BYTE 2: DATA 1 (CC #)</text>

      <!-- Binary Layout -->
      <g transform="translate(12, 42)">
        <rect x="0" y="0" width="178" height="42" rx="5" fill="#060c18" stroke="#334155" />
        <text x="12" y="26" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="900">0</text>
        <text x="32" y="26" fill="#93c5fd" font-family="monospace" font-size="16" font-weight="900">ccccccc</text>
        <text x="132" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">(0–127)</text>
      </g>

      <!-- Field Explanations -->
      <g transform="translate(12, 94)">
        <!-- Bit 7 = 0 -->
        <rect x="0" y="0" width="178" height="34" rx="4" fill="#0f213a" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="8" y="15" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">Bit 7 = 0 (Data Indicator)</text>
        <text x="8" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Flags this byte as numeric data</text>

        <!-- Controller ID -->
        <rect x="0" y="40" width="178" height="74" rx="4" fill="#0f213a" stroke="#1d4ed8" stroke-width="0.8" />
        <text x="8" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">Controller Number (0–127)</text>
        <text x="8" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">Specifies WHICH knob / parameter:</text>
        <text x="8" y="84" fill="#93c5fd" font-family="monospace" font-size="8.5">&#x2022; CC1 = Modulation Wheel</text>
        <text x="8" y="97" fill="#93c5fd" font-family="monospace" font-size="8.5">&#x2022; CC7 = Volume • CC10 = Pan</text>
        <text x="8" y="109" fill="#93c5fd" font-family="monospace" font-size="8.5">&#x2022; CC64 = Sustain Pedal</text>
      </g>
    </g>

    <!-- 3. BYTE 3: DATA BYTE 2 (CC VALUE) -->
    <g transform="translate(452, 16)">
      <rect x="0" y="0" width="202" height="216" rx="8" fill="#190e29" stroke="#8b5cf6" stroke-width="1.5" />
      <rect x="0" y="0" width="202" height="32" rx="8" fill="url(#data2-grad)" />
      <text x="101" y="21" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">BYTE 3: DATA 2 (VALUE)</text>

      <!-- Binary Layout -->
      <g transform="translate(12, 42)">
        <rect x="0" y="0" width="178" height="42" rx="5" fill="#0c0618" stroke="#334155" />
        <text x="12" y="26" fill="#c084fc" font-family="monospace" font-size="16" font-weight="900">0</text>
        <text x="32" y="26" fill="#e9d5ff" font-family="monospace" font-size="16" font-weight="900">vvvvvvv</text>
        <text x="132" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">(0–127)</text>
      </g>

      <!-- Field Explanations -->
      <g transform="translate(12, 94)">
        <!-- Bit 7 = 0 -->
        <rect x="0" y="0" width="178" height="34" rx="4" fill="#26133f" stroke="#6d28d9" stroke-width="0.8" />
        <text x="8" y="15" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">Bit 7 = 0 (Data Indicator)</text>
        <text x="8" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Flags byte as payload value</text>

        <!-- Setting Value -->
        <rect x="0" y="40" width="178" height="74" rx="4" fill="#26133f" stroke="#6d28d9" stroke-width="0.8" />
        <text x="8" y="55" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">Controller Value (0–127)</text>
        <text x="8" y="70" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">Specifies THE LEVEL / SETTING:</text>
        <text x="8" y="84" fill="#e9d5ff" font-family="monospace" font-size="8.5">&#x2022; 0 = Minimum / Off</text>
        <text x="8" y="97" fill="#e9d5ff" font-family="monospace" font-size="8.5">&#x2022; 64 = Midpoint / Center</text>
        <text x="8" y="109" fill="#e9d5ff" font-family="monospace" font-size="8.5">&#x2022; 127 = Maximum / 100%</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM REAL-WORLD EXAMPLE ==================== -->
  <g transform="translate(24, 320)">
    <!-- Practical Working Example Card -->
    <rect x="0" y="0" width="672" height="84" rx="8" fill="#111827" stroke="#22c55e" stroke-width="1.2" />
    <g transform="translate(16, 12)">
      <rect x="0" y="0" width="138" height="20" rx="4" fill="#14532d" />
      <text x="69" y="14" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">&#x2713; CONCRETE EXAMPLE</text>
      <text x="150" y="15" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Setting Volume to 100 on MIDI Channel 1:</text>
      
      <!-- 3 Bytes displayed together -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="160" height="28" rx="4" fill="#2d1215" stroke="#ef4444" stroke-width="1" />
        <text x="80" y="18" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">Byte 1: 1011 0000 (Ch 1)</text>

        <text x="175" y="19" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="900">→</text>

        <rect x="200" y="0" width="160" height="28" rx="4" fill="#0f213a" stroke="#3b82f6" stroke-width="1" />
        <text x="280" y="18" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">Byte 2: 0000 0111 (CC 7)</text>

        <text x="375" y="19" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="900">→</text>

        <rect x="400" y="0" width="170" height="28" rx="4" fill="#26133f" stroke="#8b5cf6" stroke-width="1" />
        <text x="485" y="18" fill="#e9d5ff" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">Byte 3: 0110 0100 (Val 100)</text>
      </g>
    </g>
  </g>
</svg>
