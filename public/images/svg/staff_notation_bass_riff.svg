<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="staffBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="240" rx="12" fill="url(#staffBg2)" stroke="#334155" stroke-width="2" />

  <!-- Score Title -->
  <text x="300" y="32" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="800" text-anchor="middle">
    BASS CLEF SYNCOPATED FUNK RIFF (E1 - E2 - G1)
  </text>
  <text x="300" y="52" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">
    Syncopated Octave Jump on the &quot;and&quot; of Beat 2 • 4/4 Time Signature
  </text>

  <!-- Musical Staff Lines (5 lines, y = 90, 105, 120, 135, 150) -->
  <g stroke="#cbd5e1" stroke-width="1.5">
    <line x1="50" y1="90" x2="550" y2="90" />
    <line x1="50" y1="105" x2="550" y2="105" />
    <line x1="50" y1="120" x2="550" y2="120" />
    <line x1="50" y1="135" x2="550" y2="135" />
    <line x1="50" y1="150" x2="550" y2="150" />
  </g>

  <!-- Bar line at start and end -->
  <line x1="50" y1="90" x2="50" y2="150" stroke="#cbd5e1" stroke-width="2.5" />
  <line x1="550" y1="90" x2="550" y2="150" stroke="#cbd5e1" stroke-width="2.5" />
  <line x1="544" y1="90" x2="544" y2="150" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Bass Clef Graphic (F Clef: curl starting on line 4 at y=105) -->
  <circle cx="82" cy="105" r="5" fill="#38bdf8" />
  <path d="M 82 105 C 82 92 100 85 106 95 C 112 105 104 125 90 145" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <!-- Two F-Clef Dots surrounding line 4 (y=105) -->
  <circle cx="116" cy="98" r="3.5" fill="#38bdf8" />
  <circle cx="116" cy="112" r="3.5" fill="#38bdf8" />

  <!-- Time Signature: 4/4 -->
  <text x="145" y="118" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="28" font-weight="bold" text-anchor="middle">4</text>
  <text x="145" y="148" fill="#f8fafc" font-family="'Times New Roman', serif" font-size="28" font-weight="bold" text-anchor="middle">4</text>

  <!-- NOTE 1: E1 (Root note, low bass below staff on ledger space at y=170) -->
  <g transform="translate(210, 165)">
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#cbd5e1" stroke-width="1.5" />
    <ellipse cx="0" cy="8" rx="9" ry="6.5" fill="#f8fafc" transform="rotate(-20)" />
    <!-- Stem pointing UP -->
    <line x1="8" y1="6" x2="8" y2="-40" stroke="#f8fafc" stroke-width="2" />
    <!-- Dot for dotted eighth -->
    <circle cx="18" cy="8" r="2.5" fill="#f8fafc" />
    <text x="0" y="32" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">E1 (Root)</text>
    <text x="0" y="46" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Beat 1</text>
  </g>

  <!-- NOTE 2: E2 (Octave jump, top space of bass staff at y=98) -->
  <g transform="translate(330, 98)">
    <ellipse cx="0" cy="0" rx="9" ry="6.5" fill="#f8fafc" transform="rotate(-20)" />
    <!-- Stem pointing DOWN with flag -->
    <line x1="-8" y1="2" x2="-8" y2="45" stroke="#f8fafc" stroke-width="2" />
    <path d="M -8 45 Q 2 40 4 30" fill="none" stroke="#f8fafc" stroke-width="2" />
    <text x="0" y="70" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">E2 (Octave)</text>
    <text x="0" y="84" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">&quot;And&quot; of Beat 2</text>
  </g>

  <!-- NOTE 3: G1 (First line of staff at y=150) -->
  <g transform="translate(450, 150)">
    <!-- Half Note (open notehead) -->
    <ellipse cx="0" cy="0" rx="9" ry="6.5" fill="none" stroke="#f8fafc" stroke-width="2.5" transform="rotate(-20)" />
    <line x1="8" y1="-2" x2="8" y2="-45" stroke="#f8fafc" stroke-width="2" />
    <text x="0" y="35" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">G1 (Minor 3rd)</text>
    <text x="0" y="49" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Beat 3 (Half Note)</text>
  </g>
</svg>
