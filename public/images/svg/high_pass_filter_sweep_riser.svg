<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-hpf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-hpf-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad-hpf)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#f43f5e" filter="url(#glow-hpf-rose)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">EDM TRANSITIONS: HIGH-PASS FILTER (HPF) SWEEPS &amp; WHITE NOISE RISERS</text>
    <rect x="520" y="6" width="140" height="22" rx="4" fill="#881337" fill-opacity="0.4" stroke="#f43f5e" stroke-width="0.8" />
    <text x="590" y="21" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">COMPARISON 2: Q11</text>
  </g>

  <!-- Graphic Content: Build-up Automation vs The Drop -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="672" height="264" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- Top: The 8-Bar Riser & HPF Automation Curve -->
    <g transform="translate(24, 16)">
      <rect x="0" y="0" width="450" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="20" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800">AUTOMATION: HIGH-PASS CUTOFF FREQUENCY RISING (BUILD-UP)</text>

      <!-- Grid lines -->
      <line x1="20" y1="120" x2="430" y2="120" stroke="#1e293b" stroke-width="1" />
      <line x1="20" y1="40" x2="430" y2="40" stroke="#1e293b" stroke-width="1" />

      <!-- HPF rising curve -->
      <path d="M 30 115 C 150 110 250 80 390 35 L 390 120 Z" fill="#e11d48" fill-opacity="0.15" />
      <path d="M 30 115 C 150 110 250 80 390 35" stroke="#f43f5e" stroke-width="3" fill="none" />

      <circle cx="30" cy="115" r="4" fill="#38bdf8" />
      <text x="30" y="134" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8">20 Hz (Sub On)</text>

      <circle cx="210" cy="92" r="4" fill="#f43f5e" />
      <text x="210" y="134" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8">200 Hz (Bass Cut)</text>

      <circle cx="390" cy="35" r="5" fill="#f43f5e" />
      <text x="390" y="26" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">800 Hz (Peak Tension!)</text>

      <!-- Instant Drop cliff down -->
      <line x1="390" y1="35" x2="395" y2="115" stroke="#10b981" stroke-width="3" stroke-dasharray="2 2" />
      <circle cx="395" cy="115" r="5" fill="#10b981" />
      <text x="415" y="134" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800">DROP: 20 Hz</text>
    </g>

    <!-- Right Side: White Noise Generator Box -->
    <g transform="translate(488, 16)">
      <rect x="0" y="0" width="164" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="12" y="20" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800">WHITE NOISE RISER</text>
      
      <!-- Noise graphic -->
      <g transform="translate(10, 30)">
        <rect x="0" y="0" width="144" height="46" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
        <path d="M 5 25 L 12 10 L 20 35 L 28 8 L 36 30 L 45 12 L 55 38 L 65 5 L 75 35 L 85 15 L 95 32 L 105 10 L 115 36 L 125 14 L 138 25" stroke="#f59e0b" stroke-width="1.2" fill="none" />
      </g>

      <text x="10" y="94" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8">• Equal energy per Hz</text>
      <text x="10" y="108" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8">• Swept with bandpass filter</text>
      <text x="10" y="122" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8">• Pitch bend &amp; reverb wash</text>
      <text x="10" y="138" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700">CREATES UPWARD RUSH</text>
    </g>

    <!-- Bottom: Psychoacoustic Principle Explanation -->
    <g transform="translate(24, 180)">
      <rect x="0" y="0" width="628" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800">PSYCHOACOUSTIC MECHANISM (TENSION &amp; RELEASE):</text>
      <text x="14" y="38" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">1. <tspan fill="#f43f5e" font-weight="700">Bass Starvation:</tspan> Sweeping the high-pass filter cuts all low frequencies, leaving the listener craving sub-bass.</text>
      <text x="14" y="54" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">2. <tspan fill="#10b981" font-weight="700">The Drop Explosion:</tspan> When the HPF snaps off at bar 17, the sudden return of sub-bass (&lt;50 Hz) feels exponentially more powerful.</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 334)">
    <rect x="0" y="0" width="672" height="70" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1.2" />
    <text x="16" y="22" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800">EXAM FOCUS: FILTER TRANSITIONS IN DANCE MUSIC</text>
    <text x="16" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">High-pass filters and white noise uplifters are the standard production devices used in EDM and modern dance-pop to signal song transitions and build energy into a chorus or drop.</text>
  </g>
</svg>