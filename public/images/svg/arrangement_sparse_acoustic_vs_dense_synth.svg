<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-mad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-mad-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad-mad)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#06b6d4" filter="url(#glow-mad-cyan)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">ARRANGEMENT CONTRAST: 80s NEW WAVE SYNTH-POP VS MINIMALIST ACOUSTIC</text>
    <rect x="520" y="6" width="140" height="22" rx="4" fill="#155e75" fill-opacity="0.4" stroke="#06b6d4" stroke-width="0.8" />
    <text x="590" y="21" fill="#cffafe" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">COMPARISON 4: MAD WORLD</text>
  </g>

  <!-- Top Half: Tears for Fears (1982) -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="672" height="136" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800">TEARS FOR FEARS (1982) — DENSE MULTI-TRACK SYNTH-POP ARRANGEMENT (174 BPM / 87 BPM 2-STEP)</text>

    <!-- Layers -->
    <g transform="translate(16, 38)">
      <rect x="0" y="0" width="120" height="42" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="60" y="18" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ROLAND CR-78</text>
      <text x="60" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">Step-quantized beat</text>

      <rect x="128" y="0" width="126" height="42" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="191" y="18" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">SYNTH BASS (MINIMOOG)</text>
      <text x="191" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">Punchy 16th ostinato</text>

      <rect x="262" y="0" width="120" height="42" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="322" y="18" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">SYNTH LEADS / PADS</text>
      <text x="322" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">Propulsive poly-chords</text>

      <rect x="390" y="0" width="120" height="42" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="450" y="18" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ELECTRIC GUITAR</text>
      <text x="450" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">Clean rhythmic chops</text>

      <rect x="518" y="0" width="122" height="42" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="579" y="18" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DUAL VOCALS</text>
      <text x="579" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">Lead + Falsetto harmonies</text>
    </g>

    <text x="16" y="104" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Irony: Dark, existential lyrics set against an energetic, danceable synth-pop rhythm.</text>
    <text x="16" y="120" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Sonic Profile: Bright, forward EQ, gated room reverb, steady 16th-note movement.</text>
  </g>

  <!-- Bottom Half: Gary Jules (2001) -->
  <g transform="translate(24, 210)">
    <rect x="0" y="0" width="672" height="136" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <text x="16" y="24" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800">GARY JULES &amp; MICHAEL ANDREWS (2001) — STRIPPED ACOUSTIC MINIMALISM (~80 BPM)</text>

    <!-- Layers -->
    <g transform="translate(16, 38)">
      <rect x="0" y="0" width="200" height="42" rx="5" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5" />
      <text x="100" y="18" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">SOLO UPRIGHT PIANO</text>
      <text x="100" y="32" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">Sparse, melancholy arpeggio pattern</text>

      <rect x="215" y="0" width="200" height="42" rx="5" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5" />
      <text x="315" y="18" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">WEEPING CELLO</text>
      <text x="315" y="32" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">Expressive legato lines &amp; natural vibrato</text>

      <rect x="430" y="0" width="210" height="42" rx="5" fill="#064e3b" fill-opacity="0.3" stroke="#10b981" stroke-width="1.5" />
      <text x="535" y="18" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">INTIMATE LEAD VOCAL</text>
      <text x="535" y="32" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">Vulnerable, close-mic dry delivery</text>
    </g>

    <text x="16" y="104" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Emotional Alignment: Tempo cut in half; drums eliminated entirely; music mirrors the despair of the lyric.</text>
    <text x="16" y="120" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Sonic Profile: Warm acoustic mid-range, deep wood resonance, delicate room decay.</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 356)">
    <rect x="0" y="0" width="672" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="14" y="18" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800">KEY MT EXAM COMPARISON FOCUS:</text>
    <text x="14" y="34" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">How arrangement and timbre alter emotional tone: synthetic dance optimism in Tears for Fears vs raw acoustic grief in Gary Jules.</text>
  </g>
</svg>