<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-syn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-syn-purp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad-syn)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#a855f7" filter="url(#glow-syn-purp)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">TIMBRE &amp; ARRANGEMENT: SYNTH BRASS / SAMPLER STABS VS ACOUSTIC STRINGS</text>
    <rect x="520" y="6" width="140" height="22" rx="4" fill="#581c87" fill-opacity="0.4" stroke="#a855f7" stroke-width="0.8" />
    <text x="590" y="21" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">COMPARISON 3</text>
  </g>

  <!-- Left: Acoustic Strings (Elvis Presley 1972) -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="324" height="270" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <rect x="12" y="12" width="300" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="162" y="30" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">VERSION A: ELVIS (1972) — NASHVILLE STRINGS</text>

    <text x="18" y="64" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Orchestral Acoustic Section</text>
    <text x="18" y="80" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• Violins, violas, cellos tracked live in room</text>
    <text x="18" y="96" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• Rich micro-detuning &amp; expressive bow vibrato</text>
    <text x="18" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• Natural acoustic room air &amp; dynamic swelling</text>

    <!-- Harmonic spectrum representation -->
    <g transform="translate(18, 130)">
      <rect x="0" y="0" width="288" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">ACOUSTIC STRING OVERTONE PROFILE</text>
      <!-- Continuous organic curves -->
      <path d="M 15 55 Q 40 25 80 40 T 150 35 T 220 50 T 275 62" stroke="#38bdf8" stroke-width="2" fill="none" />
      <text x="10" y="68" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="8">Continuous harmonic series • Gentle high-frequency air</text>
    </g>

    <rect x="18" y="214" width="288" height="42" rx="6" fill="#0369a1" fill-opacity="0.15" stroke="#0284c7" stroke-width="0.8" />
    <text x="26" y="230" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800">ROLE IN ARRANGEMENT:</text>
    <text x="26" y="244" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Sweeping, lush emotional countermelody behind vocal ballad.</text>
  </g>

  <!-- Right: Synth Brass (Pet Shop Boys 1987) -->
  <g transform="translate(372, 62)">
    <rect x="0" y="0" width="324" height="270" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <rect x="12" y="12" width="300" height="28" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="162" y="30" fill="#d8b4fe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">VERSION B: PET SHOP BOYS (1987) — SYNTH BRASS</text>

    <text x="18" y="64" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">Digital Sampler &amp; Dual Saw Stabs</text>
    <text x="18" y="80" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• Fairlight CMI &amp; Roland/Oberheim Synth Brass</text>
    <text x="18" y="96" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• Sharp filter attack with resonant cutoff snap</text>
    <text x="18" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• Rigid MIDI velocity trigger • Gated reverb burst</text>

    <!-- Harmonic spectrum representation -->
    <g transform="translate(18, 130)">
      <rect x="0" y="0" width="288" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="18" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">DETUNED SAWTOOTH SPECTRAL BARS</text>
      <!-- Discrete rigid harmonic spikes -->
      <line x1="30" y1="60" x2="30" y2="25" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
      <line x1="60" y1="60" x2="60" y2="32" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
      <line x1="90" y1="60" x2="90" y2="38" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
      <line x1="120" y1="60" x2="120" y2="44" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
      <line x1="150" y1="60" x2="150" y2="49" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
      <line x1="180" y1="60" x2="180" y2="54" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
      <text x="10" y="68" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="8">High-energy odd &amp; even harmonics • Punchy dance impact</text>
    </g>

    <rect x="18" y="214" width="288" height="42" rx="6" fill="#581c87" fill-opacity="0.2" stroke="#a855f7" stroke-width="0.8" />
    <text x="26" y="230" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800">ROLE IN ARRANGEMENT:</text>
    <text x="26" y="244" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Propulsive rhythmic hook driving the 126 BPM High-NRG dance beat.</text>
  </g>

  <!-- Bottom Global Summary -->
  <g transform="translate(24, 342)">
    <rect x="0" y="0" width="672" height="60" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1.2" />
    <text x="16" y="22" fill="#eab308" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800">EXPERT EXPLANATION TAKEAWAY:</text>
    <text x="16" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Pet Shop Boys completely subvert the solemn Nashville country ballad by transforming acoustic piano and orchestral strings into machine-tight synthesized brass stabs and sequencer arpeggios designed for 1980s dance clubs.</text>
  </g>
</svg>