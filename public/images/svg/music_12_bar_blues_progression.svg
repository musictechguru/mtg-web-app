<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <rect width="720" height="400" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="32" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">12-BAR BLUES HARMONIC STRUCTURE (1956)</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Elvis Presley's 'Heartbreak Hotel': Classic I - IV - V Harmonic Blueprint</text>

  <!-- 3 Rows of 4 Bars -->
  <g transform="translate(40, 75)">
    <rect width="640" height="225" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />

    <!-- Row 1: Bars 1-4 (Tonic I) -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="140" height="50" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="70" y="24" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BAR 1: I (E)</text>
      <text x="70" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Tonic Chord</text>

      <rect x="150" y="0" width="140" height="50" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="220" y="24" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BAR 2: I (E)</text>
      <text x="220" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Tonic Chord</text>

      <rect x="300" y="0" width="140" height="50" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="370" y="24" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BAR 3: I (E)</text>
      <text x="370" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Tonic Chord</text>

      <rect x="450" y="0" width="140" height="50" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="520" y="24" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BAR 4: I (E7)</text>
      <text x="520" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Dominant 7th prep</text>
    </g>

    <!-- Row 2: Bars 5-8 (Subdominant IV to Tonic I) -->
    <g transform="translate(20, 85)">
      <rect x="0" y="0" width="140" height="50" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="70" y="24" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BAR 5: IV (A)</text>
      <text x="70" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Subdominant Shift</text>

      <rect x="150" y="0" width="140" height="50" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="220" y="24" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BAR 6: IV (A)</text>
      <text x="220" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Subdominant Shift</text>

      <rect x="300" y="0" width="140" height="50" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="370" y="24" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BAR 7: I (E)</text>
      <text x="370" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Tonic Return</text>

      <rect x="450" y="0" width="140" height="50" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="520" y="24" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BAR 8: I (E)</text>
      <text x="520" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Tonic Chord</text>
    </g>

    <!-- Row 3: Bars 9-12 (Dominant V to Turnaround) -->
    <g transform="translate(20, 150)">
      <rect x="0" y="0" width="140" height="50" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
      <text x="70" y="24" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BAR 9: V (B7)</text>
      <text x="70" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Dominant Peak</text>

      <rect x="150" y="0" width="140" height="50" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="220" y="24" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BAR 10: IV (A)</text>
      <text x="220" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Subdominant Resolution</text>

      <rect x="300" y="0" width="140" height="50" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="370" y="24" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BAR 11: I (E)</text>
      <text x="370" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Tonic Resolution</text>

      <rect x="450" y="0" width="140" height="50" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
      <text x="520" y="24" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BAR 12: V (B7)</text>
      <text x="520" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Turnaround Chord</text>
    </g>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 315)">
    <rect width="640" height="65" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EDEXCEL EXAM CONTEXT: 12-BAR BLUES FORM</text>
    <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">'Heartbreak Hotel' utilizes the classic 12-bar blues harmonic progression in E minor/major. The 8-bar verses and instrumental solos adhere to this strict repeating cycle, accompanied by Bill Black's walking slap bass and Scotty Moore's biting blues guitar licks.</text>
  </g>
</svg>