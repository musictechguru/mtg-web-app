<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <rect width="720" height="400" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="32" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">AUTOTUNE HARD-TUNING: 0ms RETUNE SPEED</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">How Daft Punk Created the 'One More Time' Robotic Vocal Texture in 2000</text>

  <!-- Graph Comparison: Natural vs Hard Tune -->
  <g transform="translate(40, 75)">
    <rect width="640" height="225" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />

    <!-- Left: Natural Human Transition -->
    <g transform="translate(25, 25)">
      <rect width="275" height="175" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="137" y="22" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">NATURAL PITCH (SLUR &amp; VIBRATO)</text>
      
      <!-- Musical Grid Lines (C, D, E) -->
      <line x1="30" y1="50" x2="250" y2="50" stroke="#334155" stroke-dasharray="2 2" />
      <text x="20" y="53" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">E</text>
      <line x1="30" y1="90" x2="250" y2="90" stroke="#334155" stroke-dasharray="2 2" />
      <text x="20" y="93" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">D</text>
      <line x1="30" y1="130" x2="250" y2="130" stroke="#334155" stroke-dasharray="2 2" />
      <text x="20" y="133" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">C</text>

      <!-- Smooth gliding human pitch curve -->
      <path d="M 35 130 C 60 128, 70 120, 95 90 C 120 70, 150 92, 175 90 C 200 88, 220 54, 245 50" fill="none" stroke="#f87171" stroke-width="2.5" />
      <text x="137" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Gradual portamento, micro-pitch drifting</text>
    </g>

    <!-- Right: Hard Tuned (Retune Speed = 0) -->
    <g transform="translate(340, 25)">
      <rect width="275" height="175" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
      <text x="137" y="22" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">RETUNE SPEED = 0 (INSTANT STEPPING)</text>

      <line x1="30" y1="50" x2="250" y2="50" stroke="#334155" stroke-dasharray="2 2" />
      <text x="20" y="53" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">E</text>
      <line x1="30" y1="90" x2="250" y2="90" stroke="#334155" stroke-dasharray="2 2" />
      <text x="20" y="93" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">D</text>
      <line x1="30" y1="130" x2="250" y2="130" stroke="#334155" stroke-dasharray="2 2" />
      <text x="20" y="133" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">C</text>

      <!-- Instant staircase jumping curve -->
      <path d="M 35 130 L 80 130 L 80 90 L 190 90 L 190 50 L 245 50" fill="none" stroke="#06b6d4" stroke-width="3" />
      <circle cx="80" cy="90" r="3" fill="#fbbf24" />
      <circle cx="190" cy="50" r="3" fill="#fbbf24" />
      <text x="137" y="160" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Zero glide time = signature robotic glitched steps</text>
    </g>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 315)">
    <rect width="640" height="65" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EDEXCEL EXAM CONCEPT: ARTISTIC AUTOTUNE VS MELODYNE DNA</text>
    <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Daft Punk and Romanthony set Antares Auto-Tune's 'Retune Speed' to zero, forcing the pitch to instantly snap to the nearest chromatic or scale note with zero human glide. Melodyne DNA was not invented until 2009.</text>
  </g>
</svg>