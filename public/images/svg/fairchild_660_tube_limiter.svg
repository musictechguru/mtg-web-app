<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <rect width="720" height="400" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="32" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">FAIRCHILD 660 VARIABLE-MU TUBE LIMITER (1966)</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Legendary Abbey Road Drum Punch: Ultra-Fast 0.2ms Attack &amp; Program-Dependent Release</text>

  <!-- Left: Unit Schematic Faceplate -->
  <g transform="translate(40, 75)">
    <rect width="300" height="225" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <!-- Meter -->
    <rect x="90" y="20" width="120" height="70" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <path d="M 120 75 A 50 50 0 0 1 180 75" fill="none" stroke="#78350f" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="150" y1="75" x2="168" y2="35" stroke="#dc2626" stroke-width="2" stroke-linecap="round" />
    <text x="150" y="85" fill="#78350f" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">GAIN REDUCTION (dB)</text>

    <!-- Controls -->
    <circle cx="70" cy="140" r="24" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <line x1="70" y1="140" x2="85" y2="125" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <text x="70" y="180" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">INPUT GAIN</text>

    <circle cx="150" cy="140" r="24" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <line x1="150" y1="140" x2="165" y2="155" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <text x="150" y="180" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">THRESHOLD</text>

    <circle cx="230" cy="140" r="24" fill="#334155" stroke="#f59e0b" stroke-width="2" />
    <line x1="230" y1="140" x2="215" y2="125" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <text x="230" y="180" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">TIME CONSTANT</text>

    <rect x="20" y="200" width="260" height="16" rx="3" fill="#0f172a" />
    <text x="150" y="212" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">600Ω BALANCED TUBE CIRCUITRY (8x 6386 TUBES)</text>
  </g>

  <!-- Right: Compression Curve Graph -->
  <g transform="translate(370, 75)">
    <rect width="310" height="225" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="155" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">VARIABLE-MU SOFT-KNEE ACTION</text>
    
    <!-- Grid -->
    <line x1="45" y1="180" x2="280" y2="180" stroke="#334155" stroke-width="1" />
    <line x1="45" y1="40" x2="45" y2="180" stroke="#334155" stroke-width="1" />
    <text x="35" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle" transform="rotate(-90 35 110)">OUTPUT (dB)</text>
    <text x="160" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">INPUT (dB)</text>

    <!-- Linear Uncompressed (1:1) -->
    <line x1="45" y1="180" x2="250" y2="50" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="215" y="65" fill="#64748b" font-family="system-ui, sans-serif" font-size="8.5">1:1 LINEAR</text>

    <!-- Fairchild Variable Mu curve -->
    <path d="M 45 180 L 120 130 Q 150 110 200 98 Q 240 92 275 88" fill="none" stroke="#f59e0b" stroke-width="3" />
    <circle cx="150" cy="110" r="4" fill="#ef4444" />
    <text x="165" y="125" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Soft Knee</text>
    <text x="235" y="82" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Up to 20:1 Limiting</text>

    <rect x="25" y="198" width="260" height="20" rx="4" fill="#1e293b" />
    <text x="155" y="212" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Ringo's Drums: Explosive transients &amp; pumping room sound</text>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 315)">
    <rect width="640" height="65" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EDEXCEL EXAM APPLICATION: COMPRESSING REVOLUTIONARY DRUMS</text>
    <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Geoff Emerick fed Ringo Starr's close-miked drums directly into the Fairchild 660 tube limiter. The combination of intense gain reduction and swift tube recovery squashed dynamic peaks, raised the quiet cymbal ring, and created the iconic 'sucking' drum sound.</text>
  </g>
</svg>