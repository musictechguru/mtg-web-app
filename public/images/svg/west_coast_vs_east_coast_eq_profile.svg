<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <rect width="720" height="400" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">EQ PROFILES: WEST COAST (LA) vs EAST COAST (NYC) 90s</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Dr. Dre Smooth Warm Roll-off vs Wu-Tang / RZA Gritty Upper-Mid Punch</text>

  <!-- Spectrum Comparison Graph -->
  <g transform="translate(40, 75)">
    <rect width="640" height="225" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />

    <!-- Grid -->
    <line x1="50" y1="180" x2="600" y2="180" stroke="#334155" stroke-width="1" />
    <text x="80" y="198" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">40 Hz</text>
    <text x="200" y="198" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">250 Hz</text>
    <text x="350" y="198" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">1 kHz</text>
    <text x="470" y="198" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">4 kHz</text>
    <text x="560" y="198" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">12 kHz</text>

    <!-- Curve 1: West Coast (Green) - Sub Bass Boost & Warm HF Roll-off -->
    <path d="M 50 110 Q 100 80 180 120 Q 300 135 440 140 Q 520 155 590 175" fill="none" stroke="#22c55e" stroke-width="3" />
    <circle cx="100" cy="80" r="4" fill="#22c55e" />
    <text x="110" y="70" fill="#86efac" font-family="system-ui, sans-serif" font-size="9" font-weight="700">+6dB Sub Bump (Car Audio)</text>
    <text x="520" y="140" fill="#86efac" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Gentle HF Roll-off (Warm)</text>

    <!-- Curve 2: East Coast (Amber) - Mid Punch, Lo-Fi Roll-off, Piercing Snare -->
    <path d="M 50 155 Q 120 150 220 145 Q 360 110 460 100 Q 530 135 590 170" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3" />
    <circle cx="460" cy="100" r="4" fill="#f59e0b" />
    <text x="400" y="85" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Biting Mid Snare (2-4kHz)</text>

    <!-- Legend -->
    <g transform="translate(60, 20)">
      <line x1="0" y1="10" x2="30" y2="10" stroke="#22c55e" stroke-width="3" />
      <text x="40" y="14" fill="#86efac" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">WEST COAST G-FUNK: Massive 40-60Hz sub, silky rolled-off treble</text>

      <line x1="0" y1="30" x2="30" y2="30" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 3" />
      <text x="40" y="34" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800">EAST COAST BOOM BAP: Raw SP1200 grit, aggressive upper mids, dusty highs</text>
    </g>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 315)">
    <rect width="640" height="65" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EDEXCEL EXAM CONTRAST: REGIONAL PRODUCTION AESTHETICS</text>
    <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Dr. Dre deliberately tailored his mix for cruising in lowrider cars with heavy boot subwoofers. High-frequency roll-off kept the hi-hats smooth and non-fatiguing, unlike the gritty, vinyl-saturated, mid-heavy aesthetic of New York hip-hop.</text>
  </g>
</svg>