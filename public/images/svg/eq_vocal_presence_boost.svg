<svg width="720" height="400" viewBox="0 0 720 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow filter for EQ curve -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Shading under the 5kHz boost curve -->
    <linearGradient id="boost-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="presence-band-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#facc15" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="720" height="400" rx="14" fill="#0f172a" />
  <rect x="1" y="1" width="718" height="398" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Header Badge -->
  <rect x="180" y="16" width="360" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <text x="360" y="36" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">VOCAL PRESENCE BOOST (5 kHz PARAMETRIC EQ)</text>

  <!-- Spectrum Frequency Ranges Bar (Top) -->
  <g transform="translate(40, 58)">
    <!-- Lows: 20Hz - 250Hz -->
    <rect x="0" y="0" width="130" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="65" y="15" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">BASS (20-250Hz)</text>

    <!-- Low Mids: 250Hz - 1kHz -->
    <rect x="135" y="0" width="145" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="207" y="15" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">LOW-MIDS (250-1kHz)</text>

    <!-- High Mids: 1kHz - 4kHz -->
    <rect x="285" y="0" width="135" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="352" y="15" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">MIDRANGE (1-4kHz)</text>

    <!-- Presence Band: 4kHz - 6kHz (HIGHLIGHTED) -->
    <rect x="425" y="0" width="105" height="22" rx="4" fill="rgba(250, 204, 21, 0.2)" stroke="#facc15" stroke-width="1.5" />
    <text x="477" y="15" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">PRESENCE (4-6kHz)</text>

    <!-- Air: 6kHz - 20kHz -->
    <rect x="535" y="0" width="105" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="587" y="15" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">AIR / SHEEN (6-20kHz)</text>
  </g>

  <!-- MAIN GRAPH AREA -->
  <g transform="translate(40, 92)">
    <!-- Analyzer Frame -->
    <rect width="640" height="200" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />

    <!-- Presence Target Highlight Zone (x: 465 to 570) -->
    <rect x="465" y="0" width="105" height="200" fill="url(#presence-band-grad)" stroke="#facc15" stroke-width="0.8" stroke-dasharray="3 3" />
    <text x="517" y="24" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PRESENCE ZONE</text>
    <text x="517" y="38" fill="#ca8a04" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">4 kHz – 6 kHz</text>

    <!-- Horizontal dB Grid Lines -->
    <!-- +12dB -->
    <line x1="0" y1="35" x2="640" y2="35" stroke="#1e293b" stroke-width="0.8" />
    <text x="8" y="38" fill="#475569" font-family="monospace" font-size="8">+12 dB</text>

    <!-- +6dB -->
    <line x1="0" y1="75" x2="640" y2="75" stroke="#1e293b" stroke-width="0.8" />
    <text x="8" y="78" fill="#475569" font-family="monospace" font-size="8">+6 dB</text>

    <!-- 0dB (Unity Gain reference line) -->
    <line x1="0" y1="120" x2="640" y2="120" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4" />
    <text x="8" y="123" fill="#64748b" font-family="monospace" font-size="9" font-weight="600">0 dB (Flat)</text>

    <!-- -6dB -->
    <line x1="0" y1="160" x2="640" y2="160" stroke="#1e293b" stroke-width="0.8" />
    <text x="8" y="163" fill="#475569" font-family="monospace" font-size="8">-6 dB</text>

    <!-- Vertical Frequency Grid Lines (Log Scale Approximated) -->
    <!-- 100 Hz -->
    <line x1="75" y1="0" x2="75" y2="200" stroke="#1e293b" stroke-width="0.8" />
    <!-- 250 Hz -->
    <line x1="135" y1="0" x2="135" y2="200" stroke="#1e293b" stroke-width="0.8" />
    <!-- 500 Hz -->
    <line x1="205" y1="0" x2="205" y2="200" stroke="#1e293b" stroke-width="0.8" />
    <!-- 1 kHz -->
    <line x1="285" y1="0" x2="285" y2="200" stroke="#1e293b" stroke-width="0.8" />
    <!-- 2 kHz -->
    <line x1="365" y1="0" x2="365" y2="200" stroke="#1e293b" stroke-width="0.8" />
    <!-- 5 kHz (Center Target line) -->
    <line x1="517" y1="0" x2="517" y2="200" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 2" />
    <!-- 10 kHz -->
    <line x1="590" y1="0" x2="590" y2="200" stroke="#1e293b" stroke-width="0.8" />

    <!-- Shaded Bell Area under Curve -->
    <path d="M 0 120 L 380 120 C 440 120, 485 58, 517 58 C 549 58, 594 120, 640 120 L 640 120 Z" 
          fill="url(#boost-fill)" />

    <!-- Parametric Bell Boost Curve (Centered at 5kHz / x: 517, Peak: +5.5dB / y: 58) -->
    <path d="M 0 120 L 380 120 C 440 120, 485 58, 517 58 C 549 58, 594 120, 640 120" 
          stroke="#38bdf8" stroke-width="3" fill="none" filter="url(#glow-cyan)" />

    <!-- Center Peak Node -->
    <circle cx="517" cy="58" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="url(#glow-gold)" />

    <!-- Parameter Callout Box -->
    <g transform="translate(425, 68)">
      <rect width="185" height="46" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="10" y="18" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">TARGET FREQ: 5,000 Hz</text>
      <text x="10" y="35" fill="#38bdf8" font-family="monospace" font-size="10">Gain: +5.0 dB  |  Q: 1.4</text>
    </g>

    <!-- Frequency Axis Labels below graph -->
    <text x="15" y="218" fill="#64748b" font-family="monospace" font-size="9">20Hz</text>
    <text x="75" y="218" fill="#64748b" font-family="monospace" font-size="9">100Hz</text>
    <text x="205" y="218" fill="#64748b" font-family="monospace" font-size="9">500Hz</text>
    <text x="285" y="218" fill="#64748b" font-family="monospace" font-size="9">1kHz</text>
    <text x="365" y="218" fill="#64748b" font-family="monospace" font-size="9">2kHz</text>
    <text x="517" y="218" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">5kHz ★</text>
    <text x="590" y="218" fill="#64748b" font-family="monospace" font-size="9">10kHz</text>
    <text x="635" y="218" fill="#64748b" font-family="monospace" font-size="9" text-anchor="end">20kHz</text>
  </g>

  <!-- BOTTOM EDUCATIONAL BREAKDOWN BOX -->
  <g transform="translate(40, 324)">
    <rect width="640" height="60" rx="8" fill="#182234" stroke="#334155" stroke-width="1" />
    <circle cx="24" cy="30" r="12" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
    <text x="24" y="34" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">i</text>
    
    <text x="46" y="24" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">Why 5 kHz?</text>
    <text x="46" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">The 4kHz–6kHz band controls vocal consonant articulation ('t', 'k', 'p'). Boosting here brings the vocal forward without the sibilant harshness found higher up at 7kHz–8kHz.</text>
  </g>
</svg>
