<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-drop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-drop-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad-drop)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow-drop-blue)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">ARRANGEMENT DYNAMICS: EDM BUILD &amp; DROP VS FOLK VERSE-CHORUS</text>
    <rect x="520" y="6" width="140" height="22" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="0.8" />
    <text x="590" y="21" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">COMPARISON 2: FAST CAR</text>
  </g>

  <!-- Content -->
  <g transform="translate(24, 62)">
    <!-- Version A: Tracy Chapman -->
    <rect x="0" y="0" width="672" height="150" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">VERSION A: TRACY CHAPMAN (1988) — ORGANIC NARRATIVE FOLK STRUCTURE</text>
    <text x="18" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Continuous linear acoustic momentum • Steady storytelling dynamics • Fingerpicked acoustic guitar anchor</text>

    <!-- Timeline Blocks A -->
    <g transform="translate(18, 60)">
      <rect x="0" y="0" width="80" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="40" y="22" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">INTRO</text>
      <text x="40" y="34" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Acoustic Riff</text>

      <rect x="90" y="0" width="130" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="155" y="22" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">VERSE 1 &amp; 2</text>
      <text x="155" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Storytelling vocal</text>

      <rect x="230" y="0" width="120" height="42" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
      <text x="290" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">CHORUS</text>
      <text x="290" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Drums &amp; Bass enter</text>

      <rect x="360" y="0" width="130" height="42" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="425" y="22" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">VERSE 3 &amp; 4</text>
      <text x="425" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Intimate groove</text>

      <rect x="500" y="0" width="136" height="42" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
      <text x="568" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">CHORUS &amp; OUTRO</text>
      <text x="568" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Gentle guitar fade</text>
    </g>

    <!-- Version B: Jonas Blue -->
    <g transform="translate(0, 162)">
      <rect x="0" y="0" width="672" height="176" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
      <text x="18" y="26" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">VERSION B: JONAS BLUE (2015) — MODERN EDM / TROPICAL HOUSE ARCHITECTURE</text>
      <text x="18" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Tension-and-release cycle • 16-bar accelerating snare build-up • Energy explosive Drop with sidechained synth lead</text>

      <!-- Timeline Blocks B -->
      <g transform="translate(18, 58)">
        <rect x="0" y="0" width="90" height="52" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1" />
        <text x="45" y="22" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">INTRO</text>
        <text x="45" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">Muted Pluck Synth</text>
        <text x="45" y="46" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">4-bar filter opening</text>

        <rect x="100" y="0" width="110" height="52" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1" />
        <text x="155" y="22" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">BREAKDOWN</text>
        <text x="155" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">Vocal + Claps</text>
        <text x="155" y="46" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">Drums stripped</text>

        <rect x="220" y="0" width="125" height="52" rx="6" fill="#881337" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1.5" />
        <text x="282" y="20" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">BUILD-UP / RISER</text>
        <text x="282" y="34" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">Snare Roll 1/4 to 1/16</text>
        <text x="282" y="46" fill="#fb7185" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">Pitch Riser + High-Pass</text>

        <rect x="355" y="0" width="150" height="52" rx="6" fill="#e11d48" fill-opacity="0.25" stroke="#f43f5e" stroke-width="2" />
        <text x="430" y="20" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">THE DROP (CHORUS)</text>
        <text x="430" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">4-on-the-Floor Kick</text>
        <text x="430" y="46" fill="#fecdd3" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">Pumping Sidechained Lead</text>

        <rect x="515" y="0" width="121" height="52" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
        <text x="575" y="22" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CYCLE 2</text>
        <text x="575" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">Breakdown 2 &amp; Drop 2</text>
        <text x="575" y="46" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">Extended Outro Beat</text>
      </g>

      <!-- Key Engineering Contrast Callout -->
      <g transform="translate(18, 122)">
        <rect x="0" y="0" width="636" height="38" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="14" y="16" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800">EDM PRODUCTION DIFFERENCE:</text>
        <text x="14" y="30" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">Rather than relying on vocal melody alone to carry the chorus, modern dance tracks build tension using white noise sweeps, high-pass filter cuts, and acceleration before exploding into an instrumental synthesizer drop.</text>
      </g>
    </g>
  </g>
</svg>