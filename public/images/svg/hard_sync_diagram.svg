<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" style="background-color: #0d1322; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="960" height="600" fill="#0d1322"/>
  
  <!-- Header Title -->
  <text x="480" y="48" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="1.5">OSCILLATOR HARD SYNC</text>
  <text x="480" y="76" fill="#94a3b8" font-size="14" text-anchor="middle">The Master oscillator forces the Slave oscillator's waveform to reset to zero at every cycle start</text>

  <!-- Sync Boundaries (Master cycle periods at X = 220, 450, 680, 910; Period = 230px) -->
  <line x1="220" y1="95" x2="220" y2="495" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="450" y1="95" x2="450" y2="495" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.75"/>
  <line x1="680" y1="95" x2="680" y2="495" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.75"/>
  <line x1="910" y1="95" x2="910" y2="495" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6"/>

  <!-- ROW 1: Master Oscillator -->
  <g transform="translate(0, 35)">
    <rect x="35" y="80" width="160" height="70" rx="8" fill="#172339" stroke="#334155" stroke-width="1.2"/>
    <text x="50" y="106" fill="#38bdf8" font-size="14" font-weight="bold">Master Oscillator</text>
    <text x="50" y="125" fill="#94a3b8" font-size="12">Frequency: f₀</text>
    <text x="50" y="140" fill="#64748b" font-size="11">Locks Fundamental Pitch</text>

    <!-- Center guide line -->
    <line x1="220" y1="120" x2="910" y2="120" stroke="#1e293b" stroke-width="1"/>

    <!-- Master Sawtooth: (220,150) -> (450,90) -> (450,150) -> (680,90) -> (680,150) -> (910,90) -->
    <path d="M 220 150 L 450 90 L 450 150 L 680 90 L 680 150 L 910 90 L 910 150" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>

    <text x="455" y="105" fill="#ef4444" font-size="11" font-weight="bold">Reset Pulse</text>
    <text x="685" y="105" fill="#ef4444" font-size="11" font-weight="bold">Reset Pulse</text>
  </g>

  <!-- ROW 2: Free-Running Slave Oscillator -->
  <g transform="translate(0, 170)">
    <rect x="35" y="80" width="160" height="70" rx="8" fill="#172339" stroke="#334155" stroke-width="1.2"/>
    <text x="50" y="106" fill="#c084fc" font-size="14" font-weight="bold">Slave Oscillator</text>
    <text x="50" y="125" fill="#94a3b8" font-size="12">Free-Running (Higher Pitch)</text>
    <text x="50" y="140" fill="#64748b" font-size="11">Modulated for Sync Sweep</text>

    <!-- Center guide line -->
    <line x1="220" y1="120" x2="910" y2="120" stroke="#1e293b" stroke-width="1"/>

    <!-- Slave Sawtooth period = 88.46px (~2.6x master) -->
    <path d="M 220 150 L 308.5 90 L 308.5 150 L 397 90 L 397 150 L 485.5 90 L 485.5 150 L 574 90 L 574 150 L 662.5 90 L 662.5 150 L 751 90 L 751 150 L 839.5 90 L 839.5 150 L 910 102" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="5,4" opacity="0.65"/>
  </g>

  <!-- ROW 3: Resulting Hard Synced Output -->
  <g transform="translate(0, 305)">
    <rect x="35" y="75" width="160" height="85" rx="8" fill="#172339" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="50" y="101" fill="#f59e0b" font-size="14" font-weight="bold">Hard Synced Output</text>
    <text x="50" y="120" fill="#e2e8f0" font-size="12">Sharp Tearing Waveform</text>
    <text x="50" y="137" fill="#38bdf8" font-size="11">Pitch = Master f₀</text>
    <text x="50" y="152" fill="#f59e0b" font-size="11">Harmonics = Slave Freq</text>

    <!-- Center guide line -->
    <line x1="220" y1="120" x2="910" y2="120" stroke="#1e293b" stroke-width="1"/>

    <!-- Synced Waveform:
         Period 1: 220 -> 308.5 -> 397 -> 450 (at 450 y=114, instantly resets to 150)
         Period 2: 450 -> 538.5 -> 627 -> 680 (at 680 y=114, instantly resets to 150)
         Period 3: 680 -> 768.5 -> 857 -> 910
    -->
    <path d="M 220 150 L 308.5 90 L 308.5 150 L 397 90 L 397 150 L 450 114 L 450 150 L 538.5 90 L 538.5 150 L 627 90 L 627 150 L 680 114 L 680 150 L 768.5 90 L 768.5 150 L 857 90 L 857 150 L 910 114" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Reset Dots and Indicator Lines -->
    <line x1="450" y1="114" x2="450" y2="150" stroke="#ef4444" stroke-width="3.5"/>
    <circle cx="450" cy="114" r="4.5" fill="#ef4444"/>
    <circle cx="450" cy="150" r="4" fill="#ef4444"/>

    <line x1="680" y1="114" x2="680" y2="150" stroke="#ef4444" stroke-width="3.5"/>
    <circle cx="680" cy="114" r="4.5" fill="#ef4444"/>
    <circle cx="680" cy="150" r="4" fill="#ef4444"/>

    <!-- Reset Callout Tag -->
    <g transform="translate(465, 125)">
      <rect x="0" y="0" width="180" height="38" rx="5" fill="#0b1120" stroke="#ef4444" stroke-width="1.2"/>
      <text x="10" y="16" fill="#ef4444" font-size="10.5" font-weight="bold">FORCED MID-CYCLE RESET</text>
      <text x="10" y="30" fill="#cbd5e1" font-size="10">Produces rich, abrasive harmonics</text>
    </g>
  </g>

  <!-- Explanatory Footer Box -->
  <g transform="translate(35, 505)">
    <rect width="890" height="65" rx="8" fill="#172339" stroke="#334155" stroke-width="1.2"/>
    <text x="25" y="27" fill="#38bdf8" font-size="13" font-weight="bold">The "Sync Sweep" Sound:</text>
    <text x="25" y="47" fill="#cbd5e1" font-size="12">Sweeping the slave oscillator's pitch (via an envelope or mod wheel) moves the forced-reset harmonic formant across the spectrum,</text>
    <text x="25" y="59" fill="#94a3b8" font-size="11.5">while the note's perceived pitch stays locked to the master oscillator — creating the classic aggressive, ripping synth lead.</text>
  </g>
</svg>
