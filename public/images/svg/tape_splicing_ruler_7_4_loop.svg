<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <rect width="720" height="400" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">PHYSICAL TAPE SPLICING: 7/4 SOUND EFFECT LOOP</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Creating Pink Floyd's 'Money' Intro: Ruler-Measured 1/4" Tape &amp; Razor Blade Edits</text>

  <!-- Physical Tape Loop Timeline -->
  <g transform="translate(40, 80)">
    <rect width="640" height="135" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <text x="320" y="22" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PHYSICAL TAPE MEASUREMENT (15 INCHES PER SECOND = 1 SECOND)</text>

    <!-- 7 Equal Tape Slices -->
    <g transform="translate(15, 38)">
      <!-- Beat 1 -->
      <rect x="0" y="0" width="84" height="45" rx="3" fill="#047857" stroke="#10b981" stroke-width="1" />
      <text x="42" y="20" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">BEAT 1</text>
      <text x="42" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Cash Register</text>

      <!-- Beat 2 -->
      <rect x="87" y="0" width="84" height="45" rx="3" fill="#065f46" stroke="#10b981" stroke-width="1" />
      <text x="129" y="20" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">BEAT 2</text>
      <text x="129" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Coins in Bowl</text>

      <!-- Beat 3 -->
      <rect x="174" y="0" width="84" height="45" rx="3" fill="#047857" stroke="#10b981" stroke-width="1" />
      <text x="216" y="20" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">BEAT 3</text>
      <text x="216" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Tearing Paper</text>

      <!-- Beat 4 -->
      <rect x="261" y="0" width="84" height="45" rx="3" fill="#065f46" stroke="#10b981" stroke-width="1" />
      <text x="303" y="20" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">BEAT 4</text>
      <text x="303" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Cash Drawer</text>

      <!-- Beat 5 -->
      <rect x="348" y="0" width="84" height="45" rx="3" fill="#047857" stroke="#10b981" stroke-width="1" />
      <text x="390" y="20" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">BEAT 5</text>
      <text x="390" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Coin Drop</text>

      <!-- Beat 6 -->
      <rect x="435" y="0" width="84" height="45" rx="3" fill="#065f46" stroke="#10b981" stroke-width="1" />
      <text x="477" y="20" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">BEAT 6</text>
      <text x="477" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Adding Machine</text>

      <!-- Beat 7 -->
      <rect x="522" y="0" width="84" height="45" rx="3" fill="#047857" stroke="#10b981" stroke-width="1" />
      <text x="564" y="20" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">BEAT 7</text>
      <text x="564" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Register Ding</text>
    </g>

    <!-- 45-degree angle slice markers -->
    <g transform="translate(15, 92)">
      <line x1="84" y1="0" x2="88" y2="15" stroke="#ef4444" stroke-width="2" />
      <line x1="171" y1="0" x2="175" y2="15" stroke="#ef4444" stroke-width="2" />
      <line x1="258" y1="0" x2="262" y2="15" stroke="#ef4444" stroke-width="2" />
      <line x1="345" y1="0" x2="349" y2="15" stroke="#ef4444" stroke-width="2" />
      <line x1="432" y1="0" x2="436" y2="15" stroke="#ef4444" stroke-width="2" />
      <line x1="519" y1="0" x2="523" y2="15" stroke="#ef4444" stroke-width="2" />
      <text x="305" y="28" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">✂ 45° DIAGONAL CUTS JOINED WITH SPLICING TAPE</text>
    </g>
  </g>

  <!-- 3 Detail Boxes -->
  <g transform="translate(40, 230)">
    <rect x="0" y="0" width="200" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="15" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="800">1. TAPE SPEED &amp; TIME</text>
    <text x="15" y="38" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">Each beat measured ~10 inches</text>
    <text x="15" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">of magnetic tape using a ruler.</text>

    <rect x="220" y="0" width="200" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="235" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="800">2. CONTINUOUS LOOP</text>
    <text x="235" y="38" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">Joined head-to-tail and looped</text>
    <text x="235" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">around mic stands across room.</text>

    <rect x="440" y="0" width="200" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="455" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="800">3. NO DIGITAL SAMPLERS</text>
    <text x="455" y="38" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">Pre-dates Akai MPC &amp; samplers.</text>
    <text x="455" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">100% Musique Concrète Foley.</text>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 318)">
    <rect width="640" height="65" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EDEXCEL EXAM FACT: CREATING TAPE LOOPS IN 7/4 TIME</text>
    <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Roger Waters and Nick Mason physically recorded real objects, then cut equal measured lengths of tape with razor blades. They looped the splice around tape guides to play continuously in odd meter (7/4 time).</text>
  </g>
</svg>