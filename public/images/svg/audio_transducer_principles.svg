<svg width="720" height="400" viewBox="0 0 720 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" rx="14" fill="#0f172a" />
  <rect x="1" y="1" width="718" height="398" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Header Badge -->
  <rect x="180" y="16" width="360" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <text x="360" y="36" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">AUDIO TRANSDUCERS: CONVERTING ENERGY FORMS</text>

  <!-- Left Column: INPUT TRANSDUCER (MICROPHONE) -->
  <g transform="translate(24, 62)">
    <rect width="320" height="240" rx="10" fill="#182234" stroke="#38bdf8" stroke-width="1.2" />
    <text x="160" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">INPUT TRANSDUCER: MICROPHONE</text>
    <text x="160" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Acoustic Energy → Electrical Energy</text>

    <!-- Visual Conversion Diagram -->
    <rect x="15" y="55" width="290" height="120" rx="6" fill="#0b1120" stroke="#1e293b" />
    
    <!-- Sound Waves (Acoustic Pressure) -->
    <path d="M 30 95 C 40 80, 40 130, 30 115" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 2" fill="none" />
    <path d="M 45 90 C 60 70, 60 140, 45 120" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 2" fill="none" />
    <text x="45" y="150" fill="#94a3b8" font-family="monospace" font-size="8.5" text-anchor="middle">Sound Waves</text>

    <!-- Transducer Diaphragm Block -->
    <g transform="translate(115, 75)">
      <rect width="60" height="65" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="20" y1="12" x2="20" y2="53" stroke="#facc15" stroke-width="3" stroke-linecap="round" />
      <circle cx="38" cy="32" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="30" y="77" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Diaphragm</text>
    </g>

    <!-- Electrical Wave Output -->
    <path d="M 195 107 Q 215 80 235 107 T 275 107" stroke="#38bdf8" stroke-width="2.5" fill="none" filter="url(#glow-cyan)" />
    <text x="235" y="145" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">Mic-Level Voltage</text>

    <!-- Description -->
    <rect x="15" y="184" width="290" height="44" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="25" y="202" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">• Converts air pressure vibrations</text>
    <text x="25" y="218" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">• Outputs tiny alternating electrical voltages (mV)</text>
  </g>

  <!-- Right Column: OUTPUT TRANSDUCER (LOUDSPEAKER) -->
  <g transform="translate(376, 62)">
    <rect width="320" height="240" rx="10" fill="#182234" stroke="#f59e0b" stroke-width="1.2" />
    <text x="160" y="26" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">OUTPUT TRANSDUCER: LOUDSPEAKER</text>
    <text x="160" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Electrical Energy → Acoustic Energy</text>

    <!-- Visual Conversion Diagram -->
    <rect x="15" y="55" width="290" height="120" rx="6" fill="#0b1120" stroke="#1e293b" />

    <!-- Electrical Wave Input -->
    <path d="M 35 107 Q 55 80 75 107 T 115 107" stroke="#f59e0b" stroke-width="2.5" fill="none" filter="url(#glow-amber)" />
    <text x="75" y="145" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">Line/Amp Voltage</text>

    <!-- Speaker Cone Transducer Block -->
    <g transform="translate(135, 75)">
      <polygon points="10,20 30,5 30,60 10,45" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="30" y="15" width="20" height="35" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="25" y="77" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Voice Coil / Cone</text>
    </g>

    <!-- Radiated Sound Waves -->
    <path d="M 230 90 C 245 70, 245 140, 230 120" stroke="#f8fafc" stroke-width="2" stroke-dasharray="3 2" fill="none" />
    <path d="M 255 85 C 275 60, 275 150, 255 125" stroke="#f8fafc" stroke-width="2" stroke-dasharray="3 2" fill="none" />
    <text x="250" y="150" fill="#f8fafc" font-family="monospace" font-size="8.5" text-anchor="middle">Acoustic Sound</text>

    <!-- Description -->
    <rect x="15" y="184" width="290" height="44" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="25" y="202" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">• Voice coil moves within a magnetic field</text>
    <text x="25" y="218" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">• Pushes physical air molecules to recreate sound</text>
  </g>

  <!-- Bottom Educational Summary Box -->
  <g transform="translate(24, 316)">
    <rect width="672" height="68" rx="8" fill="#182234" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="34" r="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="28" y="39" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">⚡</text>
    <text x="54" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Definition of a Transducer:</text>
    <text x="54" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Any device that converts one form of energy into another. Microphones and guitar pickups are input transducers (acoustic/kinetic to electrical), while loudspeakers and headphones are output transducers (electrical to acoustic).</text>
  </g>
</svg>
