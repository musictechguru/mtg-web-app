<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="envGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="796" height="476" rx="12" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="400" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    The Four Phases of an ADSR Envelope
  </text>
  <text x="400" y="62" fill="#94a3b8" font-size="13" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    Attack (Time) • Decay (Time) • Sustain (Level) • Release (Time)
  </text>

  <!-- Main Graph Area -->
  <g id="envelope-graph">
    <!-- Grid frame -->
    <rect x="70" y="90" width="670" height="235" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Y-Axis (Level) & X-Axis (Time) -->
    <line x1="70" y1="285" x2="740" y2="285" stroke="#475569" stroke-width="1.5"/>
    <text x="735" y="302" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="end">Time →</text>

    <!-- Horizontal Level Gridlines -->
    <line x1="70" y1="125" x2="740" y2="125" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="62" y="129" fill="#f59e0b" font-size="10" font-family="monospace" text-anchor="end">Peak Level (100%)</text>

    <line x1="70" y1="190" x2="740" y2="190" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="62" y="194" fill="#10b981" font-size="10" font-family="monospace" text-anchor="end">Sustain Level</text>

    <text x="62" y="289" fill="#64748b" font-size="10" font-family="monospace" text-anchor="end">Zero (0%)</text>

    <!-- Key Gate Markers -->
    <line x1="110" y1="90" x2="110" y2="325" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="72" y="96" width="76" height="20" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <text x="110" y="110" fill="#f0f9ff" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">GATE ON</text>
    <text x="110" y="125" fill="#38bdf8" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">(Key Pressed)</text>

    <line x1="510" y1="90" x2="510" y2="325" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="472" y="96" width="76" height="20" rx="4" fill="#9f1239" stroke="#f43f5e" stroke-width="1"/>
    <text x="510" y="110" fill="#fff1f2" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">GATE OFF</text>
    <text x="510" y="125" fill="#f43f5e" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">(Key Released)</text>

    <!-- Shaded Envelope Area -->
    <path d="M 110 285 L 210 125 L 320 190 L 510 190 L 680 285 Z" fill="url(#envGlow)"/>

    <!-- Envelope Curve -->
    <path d="M 70 285 L 110 285 L 210 125 L 320 190 L 510 190 L 680 285 L 740 285" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Phase 1: ATTACK -->
    <circle cx="210" cy="125" r="5" fill="#f59e0b"/>
    <line x1="110" y1="305" x2="210" y2="305" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="112,305 117,302 117,308" fill="#f59e0b"/>
    <polygon points="208,305 203,302 203,308" fill="#f59e0b"/>
    <text x="160" y="322" fill="#fbbf24" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">ATTACK</text>
    <text x="150" y="180" fill="#f59e0b" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Time to Peak</text>

    <!-- Phase 2: DECAY -->
    <circle cx="320" cy="190" r="5" fill="#60a5fa"/>
    <line x1="210" y1="305" x2="320" y2="305" stroke="#60a5fa" stroke-width="2"/>
    <polygon points="212,305 217,302 217,308" fill="#60a5fa"/>
    <polygon points="318,305 313,302 313,308" fill="#60a5fa"/>
    <text x="265" y="322" fill="#60a5fa" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">DECAY</text>
    <text x="280" y="150" fill="#93c5fd" font-size="10" font-weight="500" font-family="system-ui, sans-serif" text-anchor="middle">Falls to Sustain</text>

    <!-- Phase 3: SUSTAIN -->
    <line x1="320" y1="305" x2="510" y2="305" stroke="#10b981" stroke-width="2"/>
    <polygon points="322,305 327,302 327,308" fill="#10b981"/>
    <polygon points="508,305 503,302 503,308" fill="#10b981"/>
    <text x="415" y="322" fill="#34d399" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">SUSTAIN</text>
    <text x="415" y="172" fill="#34d399" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Held LEVEL (Not Time)</text>
    <text x="415" y="215" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Remains until key released</text>

    <!-- Phase 4: RELEASE -->
    <circle cx="510" cy="190" r="5" fill="#f43f5e"/>
    <circle cx="680" cy="285" r="5" fill="#f43f5e"/>
    <line x1="510" y1="305" x2="680" y2="305" stroke="#f43f5e" stroke-width="2"/>
    <polygon points="512,305 517,302 517,308" fill="#f43f5e"/>
    <polygon points="678,305 673,302 673,308" fill="#f43f5e"/>
    <text x="595" y="322" fill="#fb7185" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">RELEASE</text>
    <text x="615" y="225" fill="#fb7185" font-size="10" font-weight="500" font-family="system-ui, sans-serif" text-anchor="middle">Time to Fade</text>
  </g>

  <!-- Bottom Explanatory Panels -->
  <g id="bottom-cards">
    <!-- Card 1: Time vs Level Exam Distinction -->
    <rect x="70" y="348" width="325" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="85" y="372" fill="#f59e0b" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">
      Time Parameters vs Level Parameter
    </text>
    <text x="85" y="393" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">
      • <tspan fill="#fbbf24" font-weight="600">Attack, Decay, Release:</tspan> Measured in <tspan fill="#38bdf8" font-weight="600">TIME (ms / s)</tspan>.
    </text>
    <text x="85" y="413" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">
      • <tspan fill="#34d399" font-weight="600">Sustain:</tspan> Measured in <tspan fill="#34d399" font-weight="600">LEVEL / AMPLITUDE (dB or %)</tspan>.
    </text>
    <text x="85" y="433" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">
      • Sustain lasts as long as the key is physically held down.
    </text>

    <!-- Card 2: Musical Timbre Applications -->
    <rect x="415" y="348" width="325" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="430" y="372" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">
      Musical Instrument Emulations
    </text>
    <text x="430" y="393" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">
      • <tspan fill="#fbbf24" font-weight="600">Plucks / Stabs:</tspan> Fast Attack, short Decay, zero Sustain.
    </text>
    <text x="430" y="413" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">
      • <tspan fill="#34d399" font-weight="600">Organs:</tspan> Instant Attack, full Sustain (100%), 0 Release.
    </text>
    <text x="430" y="433" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">
      • <tspan fill="#fb7185" font-weight="600">Pads / Strings:</tspan> Slow Attack swell, high Sustain, long Release.
    </text>
  </g>
</svg>
