<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Capsule Gold Gradient -->
    <radialGradient id="gold-capsule" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </radialGradient>
    <radialGradient id="silver-capsule" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </radialGradient>
  </defs>

  <!-- Container Box -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow-badge)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">MICROPHONE TRANSIENT RESPONSE: SDC vs LDC CAPSULE MECHANICS</text>
    <rect x="522" y="6" width="138" height="22" rx="4" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="0.8" />
    <text x="591" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">MASS &amp; INERTIA</text>
  </g>

  <!-- ==================== LEFT COLUMN: SMALL DIAPHRAGM (SDC) ==================== -->
  <g transform="translate(24, 60)">
    <!-- Sub-container plate (Highlighted Border) -->
    <rect x="0" y="0" width="330" height="216" rx="10" fill="#0b1329" stroke="#38bdf8" stroke-width="1.8" />

    <!-- SDC Header Badge -->
    <rect x="10" y="10" width="220" height="22" rx="4" fill="#0284c7" />
    <text x="120" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">SMALL DIAPHRAGM (SDC) — 1/2" (≤13mm)</text>

    <!-- Capsule Visual & Specs (Left) -->
    <g transform="translate(48, 80)">
      <!-- Capsule Ring Mount -->
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#64748b" stroke-width="2.5" />
      <!-- SDC Diaphragm (Small) -->
      <circle cx="0" cy="0" r="18" fill="url(#silver-capsule)" stroke="#38bdf8" stroke-width="2" filter="url(#glow-cyan)" />
      <!-- Center dot -->
      <circle cx="0" cy="0" r="2" fill="#0284c7" />
      <!-- Label below capsule -->
      <text x="0" y="44" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">LOW MASS</text>
      <text x="0" y="57" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Tiny Inertia</text>
    </g>

    <!-- Transient Waveform Scope (Right) -->
    <g transform="translate(108, 42)">
      <!-- Scope background -->
      <rect x="0" y="0" width="210" height="96" rx="6" fill="#070c18" stroke="#1e293b" stroke-width="1" />
      <!-- Baseline -->
      <line x1="10" y1="52" x2="200" y2="52" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Original Input Spike (Faint Grey Dotted) -->
      <path d="M 15 52 L 40 52 L 44 14 L 52 52 L 200 52" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" fill="none" />
      <text x="50" y="12" fill="#64748b" font-family="system-ui, sans-serif" font-size="7.5">Acoustic Transient</text>

      <!-- SDC Captured Waveform (Cyan: Instant rise, zero overshoot, stops instantly) -->
      <path d="M 15 52 L 40 52 L 45 16 L 50 48 L 56 53 L 64 52 L 200 52" stroke="#38bdf8" stroke-width="2.5" fill="none" filter="url(#glow-cyan)" />

      <!-- Callout annotations -->
      <text x="80" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800">ULTRA-FAST RISE TIME</text>
      <text x="80" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Starts moving instantly</text>
      <text x="80" y="70" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">NO OVERHANG / RINGING</text>
      <text x="80" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Stops moving immediately</text>
    </g>

    <!-- Bottom summary pill -->
    <rect x="10" y="148" width="310" height="58" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <text x="18" y="168" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EXAM KEY: LOWER DIAPHRAGM MASS</text>
    <text x="18" y="184" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Less physical mass = less inertia. Capsule reacts</text>
    <text x="18" y="197" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">instantaneously to rapid acoustic attack transients.</text>
  </g>

  <!-- ==================== RIGHT COLUMN: LARGE DIAPHRAGM (LDC) ==================== -->
  <g transform="translate(366, 60)">
    <!-- Sub-container plate -->
    <rect x="0" y="0" width="330" height="216" rx="10" fill="#0b1329" stroke="#334155" stroke-width="1.2" />

    <!-- LDC Header Badge -->
    <rect x="10" y="10" width="220" height="22" rx="4" fill="#713f12" stroke="#facc15" stroke-width="0.8" />
    <text x="120" y="25" fill="#fef08a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">LARGE DIAPHRAGM (LDC) — 1" (≥25mm)</text>

    <!-- Capsule Visual & Specs (Left) -->
    <g transform="translate(54, 80)">
      <!-- Capsule Ring Mount -->
      <circle cx="0" cy="0" r="42" fill="#1e293b" stroke="#713f12" stroke-width="2.5" />
      <!-- LDC Diaphragm (Large) -->
      <circle cx="0" cy="0" r="34" fill="url(#gold-capsule)" stroke="#facc15" stroke-width="2" filter="url(#glow-gold)" />
      <!-- Center electrode dot -->
      <circle cx="0" cy="0" r="4" fill="#854d0e" />
      <!-- Label below capsule -->
      <text x="0" y="56" fill="#facc15" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">HIGHER MASS</text>
      <text x="0" y="69" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Greater Inertia</text>
    </g>

    <!-- Transient Waveform Scope (Right) -->
    <g transform="translate(112, 42)">
      <!-- Scope background -->
      <rect x="0" y="0" width="206" height="96" rx="6" fill="#070c18" stroke="#1e293b" stroke-width="1" />
      <!-- Baseline -->
      <line x1="10" y1="52" x2="196" y2="52" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />

      <!-- Original Input Spike (Faint Grey Dotted) -->
      <path d="M 15 52 L 40 52 L 44 14 L 52 52 L 196 52" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" fill="none" />

      <!-- LDC Captured Waveform (Gold: Slower rounded peak, overshoot and settling ring) -->
      <path d="M 15 52 L 40 52 L 48 24 L 56 60 L 66 46 L 76 56 L 86 52 L 196 52" stroke="#facc15" stroke-width="2.5" fill="none" filter="url(#glow-gold)" />

      <!-- Callout annotations -->
      <text x="76" y="28" fill="#facc15" font-family="system-ui, sans-serif" font-size="9" font-weight="800">SLIGHT ATTACK LAG</text>
      <text x="76" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Inertia rounds sharp peaks</text>
      <text x="96" y="70" fill="#fde047" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">RINGING / OVERSHOOT</text>
      <text x="96" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8">Takes longer to settle (Warmth)</text>
    </g>

    <!-- Bottom summary pill -->
    <rect x="10" y="148" width="310" height="58" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="18" y="168" fill="#facc15" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">HEAVIER MASS = SLOWER RESPONSE</text>
    <text x="18" y="184" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Higher mass creates mechanical inertia. Smears</text>
    <text x="18" y="197" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">ultra-fast spikes, imparting pleasing vocal warmth.</text>
  </g>

  <!-- ==================== BOTTOM: COMPARISON & APPLICATION CARDS ==================== -->
  <g transform="translate(24, 286)">
    <!-- CARD 1: NEWTONIAN INERTIA (CORRECT ANSWER HIGHLIGHT) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="118" rx="8" fill="#0c2340" stroke="#38bdf8" stroke-width="1.8" />
      <rect x="10" y="10" width="85" height="18" rx="4" fill="#0284c7" />
      <text x="52" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">PHYSICS RULE</text>
      
      <text x="12" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Inertia &amp; Acceleration</text>
      <text x="12" y="64" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Force = Mass × Acceleration.</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Because SDC diaphragms have</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">tiny mass, air waves accelerate</text>
      <text x="12" y="106" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">and stop them faster.</text>
    </g>

    <!-- CARD 2: SDC STUDIO USE -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="118" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="90" height="18" rx="4" fill="#0369a1" />
      <text x="55" y="23" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SDC STRENGTHS</text>
      
      <text x="12" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Percussive Transients</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Captures clinical detail on:</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Acoustic guitar pick attack</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Drum cymbals &amp; snare snap</text>
      <text x="12" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Grand piano hammers</text>
    </g>

    <!-- CARD 3: LDC STUDIO USE -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="118" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="90" height="18" rx="4" fill="#854d0e" />
      <text x="55" y="23" fill="#fef08a" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">LDC STRENGTHS</text>
      
      <text x="12" y="46" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Vocals &amp; Warmth</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Prized for artistic reasons:</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Extremely low self-noise</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Flattering vocal presence</text>
      <text x="12" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Smooth low-end response</text>
    </g>
  </g>
</svg>