<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-bin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="bit-active-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="bit-inactive-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad-bin)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#a855f7" filter="url(#glow-badge)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">7-BIT MIDI BINARY PROTOCOL &amp; DATA CONVERSION</text>
    <rect x="526" y="6" width="134" height="22" rx="4" fill="#6b21a8" fill-opacity="0.4" stroke="#a855f7" stroke-width="0.8" />
    <text x="593" y="21" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">RANGE: 0 TO 127</text>
  </g>

  <!-- ==================== MAIN GRAPHIC ==================== -->
  <g transform="translate(24, 60)">
    <!-- Main Card Container -->
    <rect x="0" y="0" width="672" height="250" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- SECTION 1: BIT WEIGHT TABLE HEADER -->
    <text x="24" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">7-BIT MIDI DATA BYTE STRUCTURE (BIT POSITIONS &amp; POWERS OF 2)</text>
    
    <!-- Bit columns: 64, 32, 16, 8, 4, 2, 1 -->
    <!-- Grid of 7 Columns -->
    <g transform="translate(24, 38)">
      <!-- Col 0: 64 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="80" height="26" rx="5" fill="#1e293b" stroke="#334155" />
        <text x="40" y="17" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="800" text-anchor="middle">64</text>
        <text x="40" y="38" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">2^6</text>
      </g>
      <!-- Col 1: 32 -->
      <g transform="translate(90, 0)">
        <rect x="0" y="0" width="80" height="26" rx="5" fill="#1e293b" stroke="#334155" />
        <text x="40" y="17" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="800" text-anchor="middle">32</text>
        <text x="40" y="38" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">2^5</text>
      </g>
      <!-- Col 2: 16 -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="80" height="26" rx="5" fill="#1e293b" stroke="#334155" />
        <text x="40" y="17" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="800" text-anchor="middle">16</text>
        <text x="40" y="38" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">2^4</text>
      </g>
      <!-- Col 3: 8 -->
      <g transform="translate(270, 0)">
        <rect x="0" y="0" width="80" height="26" rx="5" fill="#1e293b" stroke="#334155" />
        <text x="40" y="17" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="800" text-anchor="middle">8</text>
        <text x="40" y="38" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">2^3</text>
      </g>
      <!-- Col 4: 4 -->
      <g transform="translate(360, 0)">
        <rect x="0" y="0" width="80" height="26" rx="5" fill="#1e293b" stroke="#334155" />
        <text x="40" y="17" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="800" text-anchor="middle">4</text>
        <text x="40" y="38" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">2^2</text>
      </g>
      <!-- Col 5: 2 -->
      <g transform="translate(450, 0)">
        <rect x="0" y="0" width="80" height="26" rx="5" fill="#1e293b" stroke="#334155" />
        <text x="40" y="17" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="800" text-anchor="middle">2</text>
        <text x="40" y="38" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">2^1</text>
      </g>
      <!-- Col 6: 1 -->
      <g transform="translate(540, 0)">
        <rect x="0" y="0" width="80" height="26" rx="5" fill="#1e293b" stroke="#334155" />
        <text x="40" y="17" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="800" text-anchor="middle">1</text>
        <text x="40" y="38" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">2^0</text>
      </g>
    </g>

    <line x1="24" y1="88" x2="648" y2="88" stroke="#1e293b" stroke-width="1.5" />

    <!-- EXAMPLE 1: 115 IN BINARY (The Quiz Question!) -->
    <g transform="translate(24, 98)">
      <rect x="0" y="0" width="624" height="66" rx="8" fill="#151b2e" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="14" y="20" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="800">EXAMPLE A: MAKE 115 IN BINARY (1110011)</text>
      
      <!-- 7 Bits for 115: 1, 1, 1, 0, 0, 1, 1 -->
      <g transform="translate(14, 28)">
        <!-- 64: ON -->
        <rect x="0" y="0" width="50" height="30" rx="4" fill="url(#bit-active-grad)" stroke="#c084fc" filter="url(#glow-purple)" />
        <text x="25" y="21" fill="#ffffff" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">1</text>
        <!-- 32: ON -->
        <rect x="58" y="0" width="50" height="30" rx="4" fill="url(#bit-active-grad)" stroke="#c084fc" filter="url(#glow-purple)" />
        <text x="83" y="21" fill="#ffffff" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">1</text>
        <!-- 16: ON -->
        <rect x="116" y="0" width="50" height="30" rx="4" fill="url(#bit-active-grad)" stroke="#c084fc" filter="url(#glow-purple)" />
        <text x="141" y="21" fill="#ffffff" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">1</text>
        <!-- 8: OFF -->
        <rect x="174" y="0" width="50" height="30" rx="4" fill="url(#bit-inactive-grad)" stroke="#334155" />
        <text x="199" y="21" fill="#475569" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">0</text>
        <!-- 4: OFF -->
        <rect x="232" y="0" width="50" height="30" rx="4" fill="url(#bit-inactive-grad)" stroke="#334155" />
        <text x="257" y="21" fill="#475569" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">0</text>
        <!-- 2: ON -->
        <rect x="290" y="0" width="50" height="30" rx="4" fill="url(#bit-active-grad)" stroke="#c084fc" filter="url(#glow-purple)" />
        <text x="315" y="21" fill="#ffffff" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">1</text>
        <!-- 1: ON -->
        <rect x="348" y="0" width="50" height="30" rx="4" fill="url(#bit-active-grad)" stroke="#c084fc" filter="url(#glow-purple)" />
        <text x="373" y="21" fill="#ffffff" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">1</text>

        <!-- Calculation callout on right -->
        <g transform="translate(415, 2)">
          <text x="0" y="14" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">64 + 32 + 16 + 2 + 1</text>
          <text x="0" y="27" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="800">= 115 (Fortissimo Velocity)</text>
        </g>
      </g>
    </g>

    <!-- EXAMPLE 2: 60 (MIDDLE C) -->
    <g transform="translate(24, 172)">
      <rect x="0" y="0" width="624" height="66" rx="8" fill="#151b2e" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="14" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">EXAMPLE B: MAKE 60 IN BINARY (0111100 - MIDDLE C)</text>
      
      <!-- 7 Bits for 60: 0, 1, 1, 1, 1, 0, 0 -->
      <g transform="translate(14, 28)">
        <!-- 64: OFF -->
        <rect x="0" y="0" width="50" height="30" rx="4" fill="url(#bit-inactive-grad)" stroke="#334155" />
        <text x="25" y="21" fill="#475569" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">0</text>
        <!-- 32: ON -->
        <rect x="58" y="0" width="50" height="30" rx="4" fill="#0284c7" stroke="#38bdf8" />
        <text x="83" y="21" fill="#ffffff" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">1</text>
        <!-- 16: ON -->
        <rect x="116" y="0" width="50" height="30" rx="4" fill="#0284c7" stroke="#38bdf8" />
        <text x="141" y="21" fill="#ffffff" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">1</text>
        <!-- 8: ON -->
        <rect x="174" y="0" width="50" height="30" rx="4" fill="#0284c7" stroke="#38bdf8" />
        <text x="199" y="21" fill="#ffffff" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">1</text>
        <!-- 4: ON -->
        <rect x="232" y="0" width="50" height="30" rx="4" fill="#0284c7" stroke="#38bdf8" />
        <text x="257" y="21" fill="#ffffff" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">1</text>
        <!-- 2: OFF -->
        <rect x="290" y="0" width="50" height="30" rx="4" fill="url(#bit-inactive-grad)" stroke="#334155" />
        <text x="315" y="21" fill="#475569" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">0</text>
        <!-- 1: OFF -->
        <rect x="348" y="0" width="50" height="30" rx="4" fill="url(#bit-inactive-grad)" stroke="#334155" />
        <text x="373" y="21" fill="#475569" font-family="monospace" font-size="16" font-weight="900" text-anchor="middle">0</text>

        <!-- Calculation callout on right -->
        <g transform="translate(415, 2)">
          <text x="0" y="14" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">32 + 16 + 8 + 4</text>
          <text x="0" y="27" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">= 60 (MIDI Middle C / C3)</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM SPECIFICATION CARDS ==================== -->
  <g transform="translate(24, 322)">
    <!-- Card 1: Why 7-bit? -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="82" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="70" height="18" rx="4" fill="#1f2937" />
      <text x="47" y="22" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">WHY 7 BITS?</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">MSB Bit 7 is Reserved</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">1 = Status Byte (commands)</text>
      <text x="12" y="71" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">0 = Data Byte (notes/velocities)</text>
    </g>

    <!-- Card 2: Value Range -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="82" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="80" height="18" rx="4" fill="#1f2937" />
      <text x="52" y="22" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">VALUE RANGE</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">0 to 127 (128 Total Values)</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Min = 0000000 (0 = Note Off)</text>
      <text x="12" y="71" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Max = 1111111 (127 = Peak)</text>
    </g>

    <!-- Card 3: Exam Essential -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="82" rx="8" fill="#111827" stroke="#22c55e" stroke-width="1.2" />
      <rect x="12" y="10" width="90" height="18" rx="4" fill="#14532d" />
      <text x="57" y="22" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x2713; EXAM ANCHORS</text>
      <text x="12" y="44" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Middle C = Note 60</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Center Pan / Rest = CC 64</text>
      <text x="12" y="71" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Powers sum directly: 64+32+16+8+4+2+1</text>
    </g>
  </g>
</svg>
