<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-cc1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Wheel 3D Gradient -->
    <linearGradient id="wheel-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="35%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="65%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="flow-arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="glow-badge-cc1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan-cc1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad-cc1)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow-badge-cc1)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">MIDI CC1: MODULATION WHEEL CONTROL &amp; SYNTHESIZER ROUTING</text>
    <rect x="526" y="6" width="134" height="22" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="0.8" />
    <text x="593" y="21" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">CC 1 • VALUES 0–127</text>
  </g>

  <!-- ==================== MAIN GRAPHIC ROUTING ARCHITECTURE ==================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="672" height="248" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- 1. LEFT BOX: PHYSICAL MOD WHEEL -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="140" height="208" rx="8" fill="#141c2e" stroke="#38bdf8" stroke-width="1.5" />
      <text x="70" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">PHYSICAL WHEEL</text>
      
      <!-- Mod Wheel Graphic with Knurling -->
      <g transform="translate(45, 34)">
        <rect x="0" y="0" width="50" height="110" rx="6" fill="url(#wheel-grad)" stroke="#1e293b" stroke-width="1.5" />
        <!-- Knurling ridges -->
        <line x1="0" y1="18" x2="50" y2="18" stroke="#0f172a" stroke-width="2" />
        <line x1="0" y1="36" x2="50" y2="36" stroke="#0f172a" stroke-width="2" />
        <line x1="0" y1="54" x2="50" y2="54" stroke="#0f172a" stroke-width="2.5" />
        <line x1="0" y1="72" x2="50" y2="72" stroke="#0f172a" stroke-width="2" />
        <line x1="0" y1="90" x2="50" y2="90" stroke="#0f172a" stroke-width="2" />
      </g>

      <!-- Wheel Position Readouts -->
      <rect x="14" y="152" width="112" height="20" rx="4" fill="#0369a1" />
      <text x="70" y="166" fill="#ffffff" font-family="monospace" font-size="10" font-weight="800" text-anchor="middle">CC# 1 = 0–127</text>
      <text x="70" y="186" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Non-spring returning</text>
      <text x="70" y="197" fill="#64748b" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Stays where placed</text>
    </g>

    <!-- Arrow 1: Physical to Protocol -->
    <path d="M 166 124 L 194 124" stroke="url(#flow-arrow-grad)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" />

    <!-- 2. MIDDLE BOX: MIDI TRANSMISSION (CC1 VALUE) -->
    <g transform="translate(200, 20)">
      <rect x="0" y="0" width="170" height="208" rx="8" fill="#151b2e" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="85" y="22" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">MODULATION DEPTH</text>

      <!-- Depth dial / fader visual -->
      <g transform="translate(18, 36)">
        <rect x="0" y="0" width="134" height="66" rx="6" fill="#0b1021" stroke="#334155" />
        <text x="67" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">LFO AMT (VCA GATE)</text>
        <text x="67" y="44" fill="#a855f7" font-family="monospace" font-size="20" font-weight="900" text-anchor="middle">100%</text>
        <text x="67" y="58" fill="#64748b" font-family="monospace" font-size="8.5" text-anchor="middle">MIDI VALUE: 127</text>
      </g>

      <!-- Sine Wave LFO (Low Frequency Oscillator) Graphic -->
      <g transform="translate(18, 112)">
        <rect x="0" y="0" width="134" height="42" rx="4" fill="#0f172a" stroke="#1e293b" />
        <path d="M 12 21 Q 26 5, 42 21 T 72 21 T 102 21 T 122 21" fill="none" stroke="#38bdf8" stroke-width="2" />
        <text x="67" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">5Hz Low-Freq Wave</text>
      </g>

      <text x="85" y="174" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Controls LFO Amplitude</text>
      <text x="85" y="188" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Wheel @ 0 = 0% Depth (Off)</text>
      <text x="85" y="199" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Wheel @ 127 = Max Depth</text>
    </g>

    <!-- Arrow 2: To Target Destinations -->
    <path d="M 376 124 L 404 124" stroke="url(#flow-arrow-grad)" stroke-width="3" stroke-linecap="round" />

    <!-- 3. RIGHT BOX: SYNTH ROUTING DESTINATIONS -->
    <g transform="translate(410, 20)">
      <rect x="0" y="0" width="242" height="208" rx="8" fill="#141c2e" stroke="#22c55e" stroke-width="1.5" />
      <text x="121" y="22" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">TARGET DESTINATIONS (AUDIO EFFECT)</text>

      <!-- Destination 1: Pitch (Vibrato) -->
      <g transform="translate(14, 34)">
        <rect x="0" y="0" width="214" height="46" rx="6" fill="#1b2e23" stroke="#22c55e" stroke-width="1" />
        <text x="12" y="18" fill="#86efac" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">&#x25B6; 1. OSCILLATOR PITCH (VIBRATO)</text>
        <text x="12" y="34" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Cyclic pitch wobble mimicking violin/vocal vibrato</text>
      </g>

      <!-- Destination 2: Filter Cutoff (Wah / Tremolo) -->
      <g transform="translate(14, 88)">
        <rect x="0" y="0" width="214" height="46" rx="6" fill="#162738" stroke="#38bdf8" stroke-width="1" />
        <text x="12" y="18" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">&#x25B6; 2. FILTER CUTOFF (WAH / TREMOLO)</text>
        <text x="12" y="34" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Rhythmic sweep of low-pass filter frequency</text>
      </g>

      <!-- Destination 3: Amplifier (Tremolo) -->
      <g transform="translate(14, 142)">
        <rect x="0" y="0" width="214" height="52" rx="6" fill="#25162b" stroke="#a855f7" stroke-width="1" />
        <text x="12" y="18" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">&#x25B6; 3. AMPLITUDE / VCA (TREMOLO)</text>
        <text x="12" y="34" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Cyclic volume modulation pulsing in sync</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM SPECIFICATION CARDS ==================== -->
  <g transform="translate(24, 320)">
    <!-- Card 1: Standard Assignment -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="96" height="18" rx="4" fill="#1f2937" />
      <text x="60" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">MIDI SPEC CC#1</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Universal Standard</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Universally hardwired to Mod Wheel</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Found beside the Pitch Bend wheel</text>
    </g>

    <!-- Card 2: Functional Difference vs Pitch Bend -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="112" height="18" rx="4" fill="#1f2937" />
      <text x="68" y="22" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">NO SPRING RETURN</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Continuous Static Hold</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Unlike pitch bend, stays where left</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Allows hands-free sustained modulation</text>
    </g>

    <!-- Card 3: Exam Essential -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#22c55e" stroke-width="1.2" />
      <rect x="12" y="10" width="90" height="18" rx="4" fill="#14532d" />
      <text x="57" y="22" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x2713; EXAM ANSWER</text>
      <text x="12" y="44" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">LFO Depth / Filter Cutoff</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Does NOT trigger notes or set tempo</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Attenuates modulation depth to VCF/VCO</text>
    </g>
  </g>
</svg>
