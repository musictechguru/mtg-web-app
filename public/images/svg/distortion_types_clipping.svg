<svg width="720" height="400" viewBox="0 0 720 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glow filters -->
    <filter id="glow-clean" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-hard" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" rx="14" fill="#0f172a" />

  <!-- Outer border -->
  <rect x="1" y="1" width="718" height="398" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Header Badge -->
  <rect x="200" y="16" width="320" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <text x="360" y="36" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">HARMONIC DISTORTION &amp; WAVEFORM CLIPPING</text>

  <!-- Column 1: CLEAN SINE WAVE -->
  <g transform="translate(24, 62)">
    <rect width="210" height="314" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />
    <!-- Title -->
    <text x="105" y="28" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">CLEAN SIGNAL</text>
    <text x="105" y="44" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Linear Headroom</text>

    <!-- Scope Frame -->
    <rect x="15" y="58" width="180" height="150" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <!-- Center 0V line -->
    <line x1="20" y1="133" x2="190" y2="133" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <text x="25" y="130" fill="#64748b" font-family="monospace" font-size="8">0V</text>

    <!-- Headroom Ceiling Lines -->
    <line x1="20" y1="83" x2="190" y2="83" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" />
    <text x="185" y="80" fill="#64748b" font-family="monospace" font-size="7" text-anchor="end">+Vmax</text>
    <line x1="20" y1="183" x2="190" y2="183" stroke="#475569" stroke-width="1" stroke-dasharray="2 2" />
    <text x="185" y="193" fill="#64748b" font-family="monospace" font-size="7" text-anchor="end">-Vmax</text>

    <!-- Clean Sine Wave Path -->
    <path d="M 25 133 C 45 65, 75 65, 95 133 C 115 201, 145 201, 165 133 C 175 99, 185 99, 188 116" 
          stroke="#38bdf8" stroke-width="2.5" fill="none" filter="url(#glow-clean)" />

    <!-- Details Box -->
    <rect x="15" y="218" width="180" height="86" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="25" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">• Pure fundamental</text>
    <text x="25" y="254" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• Zero harmonic clipping</text>
    <text x="25" y="270" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• Peak stays within limits</text>
    <rect x="25" y="278" width="80" height="18" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="0.8" />
    <text x="65" y="290" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">THD ≈ 0%</text>
  </g>

  <!-- Column 2: SOFT CLIPPING (OVERDRIVE) -->
  <g transform="translate(255, 62)">
    <rect width="210" height="314" rx="10" fill="#182234" stroke="#eab308" stroke-width="1" />
    <!-- Title -->
    <text x="105" y="28" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SOFT CLIPPING</text>
    <text x="105" y="44" fill="#ca8a04" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Overdrive &amp; Tube Saturation</text>

    <!-- Scope Frame -->
    <rect x="15" y="58" width="180" height="150" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <!-- Center 0V line -->
    <line x1="20" y1="133" x2="190" y2="133" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Soft Threshold Lines -->
    <line x1="20" y1="83" x2="190" y2="83" stroke="#eab308" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    <text x="185" y="80" fill="#eab308" font-family="monospace" font-size="7" text-anchor="end">Soft Threshold</text>
    <line x1="20" y1="183" x2="190" y2="183" stroke="#eab308" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
    <text x="185" y="193" fill="#eab308" font-family="monospace" font-size="7" text-anchor="end">Soft Threshold</text>

    <!-- Rounded Soft Clipped Wave Path -->
    <path d="M 25 133 C 40 75, 52 82, 60 83 C 68 84, 80 84, 95 133 C 110 182, 122 184, 130 184 C 138 184, 150 182, 165 133 C 173 105, 181 90, 188 95" 
          stroke="#facc15" stroke-width="2.5" fill="none" filter="url(#glow-soft)" />

    <!-- Details Box -->
    <rect x="15" y="218" width="180" height="86" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="25" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">• Rounded wave peaks</text>
    <text x="25" y="254" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• Smooth compression onset</text>
    <text x="25" y="270" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• Warm 2nd &amp; 3rd harmonics</text>
    <rect x="25" y="278" width="125" height="18" rx="4" fill="rgba(250, 204, 21, 0.15)" stroke="#facc15" stroke-width="0.8" />
    <text x="87" y="290" fill="#facc15" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">MUSICAL WARMTH</text>
  </g>

  <!-- Column 3: HARD CLIPPING (DISTORTION / FUZZ) -->
  <g transform="translate(486, 62)">
    <rect width="210" height="314" rx="10" fill="#182234" stroke="#ef4444" stroke-width="1.2" />
    <!-- Title -->
    <text x="105" y="28" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">HARD CLIPPING</text>
    <text x="105" y="44" fill="#dc2626" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Distortion &amp; Fuzz Pedals</text>

    <!-- Scope Frame -->
    <rect x="15" y="58" width="180" height="150" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
    <!-- Center 0V line -->
    <line x1="20" y1="133" x2="190" y2="133" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Hard Brickwall Ceiling Line -->
    <line x1="20" y1="83" x2="190" y2="83" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 2" />
    <text x="185" y="80" fill="#f87171" font-family="monospace" font-size="7" font-weight="700" text-anchor="end">Hard Limit (+V)</text>
    <line x1="20" y1="183" x2="190" y2="183" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 2" />
    <text x="185" y="193" fill="#f87171" font-family="monospace" font-size="7" text-anchor="end">Hard Limit (-V)</text>

    <!-- Hard Clipped Wave Path -->
    <path d="M 25 133 L 42 83 L 78 83 L 112 183 L 148 183 L 175 110 L 188 83" 
          stroke="#f87171" stroke-width="2.5" fill="none" stroke-linejoin="round" filter="url(#glow-hard)" />

    <!-- Details Box -->
    <rect x="15" y="218" width="180" height="86" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="25" y="238" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600">• Severely flattened peaks</text>
    <text x="25" y="254" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• Wave approaches square</text>
    <text x="25" y="270" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• Dense, aggressive odd harmonics</text>
    <rect x="25" y="278" width="130" height="18" rx="4" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="0.8" />
    <text x="90" y="290" fill="#f87171" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">AGGRESSIVE BITE</text>
  </g>
</svg>
