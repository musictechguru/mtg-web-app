<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <rect width="720" height="400" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="32" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">TALK BOX vs VOCODER: THE TWO 'ROBOT' TECHNIQUES</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Physical Acoustic Mouth Resonator (G-Funk) vs Electronic Bandpass Filter Bank (Electro)</text>

  <!-- Left: Talk Box (Heil Sound) -->
  <g transform="translate(40, 75)">
    <rect width="310" height="225" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <rect width="310" height="28" rx="8" fill="#78350f" />
    <text x="155" y="19" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">HEIL TALK BOX (ACOUSTIC / PHYSICAL)</text>

    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="120" height="30" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
      <text x="60" y="19" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Synth / Guitar Out</text>

      <path d="M 120 15 L 150 15" stroke="#f59e0b" stroke-width="2" />

      <rect x="150" y="0" width="120" height="30" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="210" y="19" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Compression Driver</text>

      <!-- Tube path -->
      <path d="M 210 30 C 210 60, 90 70, 90 95" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <text x="150" y="70" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="8.5">Clear Plastic Mouth Tube</text>

      <rect x="40" y="95" width="100" height="28" rx="4" fill="#047857" stroke="#10b981" stroke-width="1" />
      <text x="90" y="112" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Performer's Mouth</text>

      <path d="M 140 109 L 165 109" stroke="#38bdf8" stroke-width="2" />

      <rect x="165" y="95" width="105" height="28" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
      <text x="217" y="112" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Vocal Mic (SM58)</text>

      <rect x="0" y="138" width="270" height="30" rx="4" fill="#0b1329" />
      <text x="135" y="156" fill="#fde68a" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Vocal cords make NO sound; mouth shapes synth sound!</text>
    </g>
  </g>

  <!-- Right: Vocoder (Electronic) -->
  <g transform="translate(370, 75)">
    <rect width="310" height="225" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="310" height="28" rx="8" fill="#0369a1" />
    <text x="155" y="19" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">VOCODER (ELECTRONIC FILTER BANK)</text>

    <g transform="translate(20, 45)">
      <!-- Modulator -->
      <rect x="0" y="0" width="120" height="30" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
      <text x="60" y="19" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Vocal Mic (Modulator)</text>

      <!-- Carrier -->
      <rect x="0" y="45" width="120" height="30" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
      <text x="60" y="64" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Synth (Carrier Signal)</text>

      <!-- Filter bank -->
      <path d="M 120 15 L 160 38 M 120 60 L 160 38" stroke="#38bdf8" stroke-width="2" />
      <rect x="160" y="20" width="110" height="40" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="215" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">ANALYSIS / SYNTHESIS</text>
      <text x="215" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Multi-band Filters</text>

      <!-- Output -->
      <rect x="40" y="95" width="200" height="28" rx="4" fill="#047857" stroke="#10b981" stroke-width="1" />
      <text x="140" y="112" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ELECTRONIC ROBOT VOICE</text>

      <rect x="0" y="138" width="270" height="30" rx="4" fill="#0b1329" />
      <text x="135" y="156" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Entirely electronic; voice envelope modulates synth filter bank</text>
    </g>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 315)">
    <rect width="640" height="65" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EDEXCEL EXAM DISTINCTION: G-FUNK TALK BOX</text>
    <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">In 'Nuthin\' but a G Thang', Dr. Dre used a physical Heil Talk Box (made famous by Roger Troutman). Sound is sent via a plastic tube into the musician\'s mouth, where the mouth acts as a physical acoustic acoustic filter before being picked up by a mic.</text>
  </g>
</svg>