<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="960" height="620" fill="#0b1120"/>

  <!-- Title & Header -->
  <text x="480" y="44" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="1.5">SYNTHESIZER FILTER TYPES (VCF)</text>
  <text x="480" y="70" fill="#94a3b8" font-size="13.5" text-anchor="middle">How different filter topologies sculpt the frequency spectrum</text>

  <!-- 4 Grid Cards -->

  <!-- Card 1: Low-Pass Filter (LPF) - Highlighted as the standard synth filter -->
  <g transform="translate(45, 95)">
    <rect width="415" height="235" rx="10" fill="#131e36" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="415" height="38" rx="10" fill="#1d4ed8"/>
    <text x="207" y="24" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">LOW-PASS FILTER (LPF) — SYNTH STANDARD</text>

    <!-- Graph Axes -->
    <line x1="40" y1="175" x2="375" y2="175" stroke="#334155" stroke-width="1.5"/>
    <line x1="40" y1="60" x2="40" y2="175" stroke="#334155" stroke-width="1.5"/>
    <text x="40" y="55" fill="#64748b" font-size="10">Gain</text>
    <text x="375" y="190" fill="#64748b" font-size="10" text-anchor="end">Freq (Hz)</text>

    <!-- LPF Curve: Flat then rolls off -->
    <path d="M 40 85 L 200 85 C 240 85, 260 110, 310 175" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Cutoff marker line -->
    <line x1="220" y1="75" x2="220" y2="175" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="220" y="70" fill="#ef4444" font-size="10.5" font-weight="bold" text-anchor="middle">Cutoff (fc)</text>

    <!-- Pass/Stopband labels -->
    <rect x="70" y="105" width="90" height="24" rx="4" fill="#0369a1" opacity="0.4"/>
    <text x="115" y="121" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">PASSBAND</text>

    <text x="280" y="130" fill="#ef4444" font-size="11" font-weight="bold">STOPBAND (Attenuated)</text>

    <!-- Caption -->
    <text x="207" y="215" fill="#cbd5e1" font-size="12" text-anchor="middle">Passes low frequencies below cutoff; removes high frequencies.</text>
  </g>

  <!-- Card 2: High-Pass Filter (HPF) -->
  <g transform="translate(500, 95)">
    <rect width="415" height="235" rx="10" fill="#131e36" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="415" height="38" rx="10" fill="#1e293b"/>
    <text x="207" y="24" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">HIGH-PASS FILTER (HPF)</text>

    <!-- Graph Axes -->
    <line x1="40" y1="175" x2="375" y2="175" stroke="#334155" stroke-width="1.5"/>
    <line x1="40" y1="60" x2="40" y2="175" stroke="#334155" stroke-width="1.5"/>
    <text x="40" y="55" fill="#64748b" font-size="10">Gain</text>
    <text x="375" y="190" fill="#64748b" font-size="10" text-anchor="end">Freq (Hz)</text>

    <!-- HPF Curve: Starts at bottom, rolls up to flat -->
    <path d="M 90 175 C 140 110, 160 85, 200 85 L 375 85" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

    <!-- Cutoff line -->
    <line x1="180" y1="75" x2="180" y2="175" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="180" y="70" fill="#ef4444" font-size="10.5" font-weight="bold" text-anchor="middle">Cutoff (fc)</text>

    <text x="55" y="130" fill="#ef4444" font-size="11" font-weight="bold">STOPBAND</text>
    <rect x="240" y="105" width="90" height="24" rx="4" fill="#047857" opacity="0.4"/>
    <text x="285" y="121" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">PASSBAND</text>

    <!-- Caption -->
    <text x="207" y="215" fill="#cbd5e1" font-size="12" text-anchor="middle">Passes high frequencies above cutoff; removes rumble &amp; lows.</text>
  </g>

  <!-- Card 3: Band-Pass Filter (BPF) -->
  <g transform="translate(45, 355)">
    <rect width="415" height="235" rx="10" fill="#131e36" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="415" height="38" rx="10" fill="#1e293b"/>
    <text x="207" y="24" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">BAND-PASS FILTER (BPF)</text>

    <!-- Graph Axes -->
    <line x1="40" y1="175" x2="375" y2="175" stroke="#334155" stroke-width="1.5"/>
    <line x1="40" y1="60" x2="40" y2="175" stroke="#334155" stroke-width="1.5"/>
    <text x="40" y="55" fill="#64748b" font-size="10">Gain</text>
    <text x="375" y="190" fill="#64748b" font-size="10" text-anchor="end">Freq (Hz)</text>

    <!-- BPF Curve: Bell pass in middle -->
    <path d="M 70 175 C 130 175, 170 85, 207 85 C 244 85, 284 175, 344 175" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

    <!-- Center frequency -->
    <line x1="207" y1="75" x2="207" y2="175" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="207" y="70" fill="#f59e0b" font-size="10.5" font-weight="bold" text-anchor="middle">Center Freq</text>

    <text x="207" y="125" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">PASSBAND</text>

    <!-- Caption -->
    <text x="207" y="215" fill="#cbd5e1" font-size="12" text-anchor="middle">Passes a selected middle band; rejects both lows and highs.</text>
  </g>

  <!-- Card 4: Band-Reject / Notch Filter -->
  <g transform="translate(500, 355)">
    <rect width="415" height="235" rx="10" fill="#131e36" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="415" height="38" rx="10" fill="#1e293b"/>
    <text x="207" y="24" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">BAND-REJECT / NOTCH FILTER</text>

    <!-- Graph Axes -->
    <line x1="40" y1="175" x2="375" y2="175" stroke="#334155" stroke-width="1.5"/>
    <line x1="40" y1="60" x2="40" y2="175" stroke="#334155" stroke-width="1.5"/>
    <text x="40" y="55" fill="#64748b" font-size="10">Gain</text>
    <text x="375" y="190" fill="#64748b" font-size="10" text-anchor="end">Freq (Hz)</text>

    <!-- Notch Curve: Flat with sharp dip -->
    <path d="M 40 85 L 160 85 C 185 85, 195 170, 207 170 C 219 170, 229 85, 254 85 L 375 85" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>

    <!-- Notch frequency -->
    <line x1="207" y1="75" x2="207" y2="175" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="207" y="70" fill="#c084fc" font-size="10.5" font-weight="bold" text-anchor="middle">Notch Center</text>

    <!-- Caption -->
    <text x="207" y="215" fill="#cbd5e1" font-size="12" text-anchor="middle">Cuts a narrow frequency band (notch); leaves lows and highs intact.</text>
  </g>
</svg>
