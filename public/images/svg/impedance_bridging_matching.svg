<svg width="720" height="400" viewBox="0 0 720 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" rx="14" fill="#0f172a" />
  <rect x="1" y="1" width="718" height="398" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Header Badge -->
  <rect x="170" y="16" width="380" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <text x="360" y="36" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">IMPEDANCE BRIDGING (VOLTAGE TRANSFER PRINCIPLE)</text>

  <!-- Main Comparison Container -->
  <rect x="24" y="60" width="672" height="236" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />

  <!-- Source Output Box (Low Output Impedance Z_out) -->
  <g transform="translate(50, 90)">
    <rect width="210" height="120" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="105" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SOURCE DEVICE</text>
    <text x="105" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Preamp / Synth / Interface Out</text>

    <!-- Resistor symbol -->
    <rect x="35" y="65" width="140" height="34" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="105" y="86" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Z_out: LOW (&lt; 100 Ω)</text>
  </g>

  <!-- Connecting Cable with Voltage Flow Arrow -->
  <g transform="translate(262, 140)">
    <line x1="0" y1="10" x2="190" y2="10" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-cyan)" />
    <rect x="35" y="-12" width="120" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
    <text x="95" y="3" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="700" text-anchor="middle">MAX VOLTAGE TRANSFER</text>
  </g>

  <!-- Destination Load Box (High Input Impedance Z_in) -->
  <g transform="translate(455, 90)">
    <rect width="210" height="120" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="105" y="30" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">DESTINATION LOAD</text>
    <text x="105" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Interface Line In / Monitor In</text>

    <!-- Resistor symbol -->
    <rect x="35" y="65" width="140" height="34" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="105" y="86" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Z_in: HIGH (&gt; 10 kΩ)</text>
  </g>

  <!-- Golden Rule Badge in Center -->
  <g transform="translate(180, 225)">
    <rect width="360" height="50" rx="6" fill="#0b1120" stroke="#facc15" stroke-width="1.2" />
    <text x="180" y="24" fill="#facc15" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">THE BRIDGING RULE: Z_in ≥ 10 × Z_out</text>
    <text x="180" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Prevents signal loading, frequency loss, and preserves full dynamic voltage.</text>
  </g>

  <!-- Bottom Educational Summary Box -->
  <g transform="translate(24, 310)">
    <rect width="672" height="72" rx="8" fill="#182234" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="36" r="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="28" y="41" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Ω</text>
    <text x="54" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Why Modern Audio Uses Voltage Bridging (Not Power Matching):</text>
    <text x="54" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Unlike vintage telecommunications where input and output impedances were matched (600Ω:600Ω), modern line-level audio connects a low-impedance source to an input with at least 10 times higher impedance. This guarantees minimal voltage drop and flat frequency response.</text>
  </g>
</svg>
