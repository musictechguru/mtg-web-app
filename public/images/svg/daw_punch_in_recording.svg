<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="punch-zone-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#ef4444" filter="url(#glow-red)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">DAW PUNCH-IN RECORDING: SEAMLESS TIMELINE OVERWRITING</text>
    <rect x="522" y="6" width="138" height="22" rx="4" fill="#991b1b" fill-opacity="0.4" stroke="#ef4444" stroke-width="0.8" />
    <text x="591" y="21" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">&#x25CF; RECORD ON-THE-FLY</text>
  </g>

  <!-- ==================== MAIN TIMELINE GRAPHIC ==================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="672" height="206" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- Left Track Header (Width: 130px) -->
    <rect x="0" y="0" width="130" height="206" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <rect x="129" y="0" width="1" height="206" fill="#334155" />

    <text x="16" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">LEAD VOCAL</text>
    <text x="16" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Track 01 • Take 1</text>
    <rect x="16" y="62" width="22" height="18" rx="3" fill="#ef4444" />
    <text x="27" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">R</text>
    <rect x="42" y="62" width="22" height="18" rx="3" fill="#334155" />
    <text x="53" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">M</text>
    <rect x="68" y="62" width="22" height="18" rx="3" fill="#334155" />
    <text x="79" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">S</text>

    <!-- Transport Mode Info -->
    <rect x="12" y="145" width="106" height="46" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="65" y="162" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">AUTO-PUNCH</text>
    <text x="65" y="178" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x2714; ENABLED</text>

    <!-- Timeline Ruler -->
    <rect x="130" y="0" width="542" height="26" fill="#1e293b" />
    <line x1="130" y1="26" x2="672" y2="26" stroke="#334155" stroke-width="1.2" />

    <!-- Bar markers -->
    <text x="145" y="18" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">BAR 1</text>
    <line x1="140" y1="20" x2="140" y2="26" stroke="#475569" stroke-width="1.5" />
    <text x="245" y="18" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">BAR 2</text>
    <line x1="240" y1="20" x2="240" y2="26" stroke="#475569" stroke-width="1.5" />

    <text x="345" y="18" fill="#ef4444" font-family="system-ui, monospace" font-size="10.5" font-weight="800">BAR 3</text>
    <line x1="340" y1="0" x2="340" y2="26" stroke="#ef4444" stroke-width="2" />

    <text x="445" y="18" fill="#ef4444" font-family="system-ui, monospace" font-size="10.5" font-weight="800">BAR 4</text>
    <line x1="440" y1="20" x2="440" y2="26" stroke="#475569" stroke-width="1.5" />

    <text x="545" y="18" fill="#94a3b8" font-family="system-ui, monospace" font-size="10">BAR 5</text>
    <line x1="540" y1="0" x2="540" y2="26" stroke="#ef4444" stroke-width="2" />

    <!-- ==================== ZONE 1: PRE-ROLL (BAR 1 - 2) ==================== -->
    <rect x="130" y="26" width="210" height="180" fill="#071529" fill-opacity="0.4" />
    <!-- Header tag -->
    <rect x="150" y="32" width="170" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
    <text x="235" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">&#x25B6; PRE-ROLL: PLAYBACK MODE</text>
    <text x="235" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">(Musician listens to context &amp; pitch)</text>

    <!-- Original Good Waveform (Pre-roll) -->
    <path d="M 140 115 Q 160 85 175 115 Q 190 145 205 115 Q 220 90 235 115 Q 255 140 270 115 Q 290 80 305 115 Q 325 130 338 115" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />

    <!-- ==================== ZONE 2: PUNCH-IN ACTIVE RECORD (BAR 3 - 4) ==================== -->
    <rect x="340" y="26" width="200" height="180" fill="url(#punch-zone-grad)" />

    <!-- Punch-In Locator Line (Left boundary) -->
    <line x1="340" y1="26" x2="340" y2="206" stroke="#ef4444" stroke-width="2.5" />
    <g transform="translate(340, 32)">
      <rect x="-4" y="0" width="70" height="22" rx="3" fill="#dc2626" filter="url(#glow-red)" />
      <text x="31" y="15" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">&#x25CF; PUNCH IN</text>
    </g>

    <!-- Crossfade Left -->
    <path d="M 334 105 L 346 125 M 334 125 L 346 105" stroke="#facc15" stroke-width="1.2" />
    <text x="340" y="142" fill="#fef08a" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">X-FADE</text>

    <!-- Active Re-recorded New Waveform (Red/Orange) -->
    <path d="M 342 115 Q 355 70 370 115 Q 385 160 405 115 Q 425 60 445 115 Q 465 155 485 115 Q 505 75 525 115 L 538 115" stroke="#f87171" stroke-width="2.8" fill="none" filter="url(#glow-red)" />

    <!-- Punch-Out Locator Line (Right boundary) -->
    <line x1="540" y1="26" x2="540" y2="206" stroke="#ef4444" stroke-width="2.5" />
    <g transform="translate(540, 32)">
      <rect x="-66" y="0" width="70" height="22" rx="3" fill="#dc2626" filter="url(#glow-red)" />
      <text x="-31" y="15" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">&#x23F9; PUNCH OUT</text>
    </g>

    <!-- Crossfade Right -->
    <path d="M 534 105 L 546 125 M 534 125 L 546 105" stroke="#facc15" stroke-width="1.2" />
    <text x="540" y="142" fill="#fef08a" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">X-FADE</text>

    <!-- Center active label -->
    <rect x="360" y="172" width="160" height="22" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
    <text x="440" y="187" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">OVERWRITES FLUBBED PHRASE</text>

    <!-- ==================== ZONE 3: POST-ROLL (BAR 5+) ==================== -->
    <rect x="540" y="26" width="132" height="180" fill="#071529" fill-opacity="0.4" />
    <!-- Header tag -->
    <rect x="550" y="32" width="112" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
    <text x="606" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">&#x25B6; POST-ROLL</text>

    <!-- Original Waveform continues -->
    <path d="M 542 115 Q 560 90 575 115 Q 590 140 605 115 Q 625 80 645 115 L 665 115" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />
  </g>

  <!-- ==================== BOTTOM: 3 EXPLANATION CARDS ==================== -->
  <g transform="translate(24, 280)">
    <!-- CARD 1: PUNCHING IN DEFINITION (CORRECT ANSWER) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#0c2340" stroke="#38bdf8" stroke-width="1.8" />
      <rect x="10" y="10" width="95" height="18" rx="4" fill="#0284c7" />
      <text x="57" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CORRECT ANSWER</text>
      
      <text x="12" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Surgical Overwriting</text>
      <text x="12" y="64" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Overwriting a specific section</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">of a track while monitoring the</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">full musical playback context,</text>
      <text x="12" y="106" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">fixing mistakes without re-tracking.</text>
    </g>

    <!-- CARD 2: PRE-ROLL & POST-ROLL -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="112" height="18" rx="4" fill="#0369a1" />
      <text x="66" y="23" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">PRE-ROLL ROLE</text>
      
      <text x="12" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Performer Momentum</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Pre-roll plays 2-4 bars ahead:</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Musician locks to tempo &amp; pitch</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Sings/plays along seamlessly</text>
      <text x="12" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Natural energy at punch point</text>
    </g>

    <!-- CARD 3: CROSSFADES PREVENT CLICKS -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="115" height="18" rx="4" fill="#854d0e" />
      <text x="67" y="23" fill="#fef08a" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CROSSFADE EDITS</text>
      
      <text x="12" y="46" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Zero-Crossing Clean</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Punch boundaries require:</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• 5-10ms micro-crossfades</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Eliminates audio clicks and pops</text>
      <text x="12" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Indistinguishable from one take</text>
    </g>
  </g>
</svg>