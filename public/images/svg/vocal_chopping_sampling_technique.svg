<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-vc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-vc-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad-vc)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#f59e0b" filter="url(#glow-vc-amber)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">SAMPLING TECHNIQUE: VOCAL CHOPPING &amp; FORMANT-SHIFTED LEAD HOOKS</text>
    <rect x="520" y="6" width="140" height="22" rx="4" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-width="0.8" />
    <text x="590" y="21" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">COMPARISON 2: Q4</text>
  </g>

  <!-- 3-Step Process Flow -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="672" height="264" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- Step 1: Raw Vocal Phrase -->
    <g transform="translate(18, 16)">
      <rect x="0" y="0" width="196" height="232" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="10" y="10" width="176" height="26" rx="4" fill="#0369a1" fill-opacity="0.4" />
      <text x="98" y="27" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">1. RAW VOCAL TAKE</text>
      
      <!-- Audio Waveform with slice markers -->
      <g transform="translate(10, 46)">
        <rect x="0" y="0" width="176" height="70" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <path d="M 10 35 Q 25 10 40 35 T 70 35 T 100 20 T 130 50 T 165 35" stroke="#38bdf8" stroke-width="2" fill="none" />
        
        <!-- Slices -->
        <line x1="45" y1="5" x2="45" y2="65" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 2" />
        <line x1="95" y1="5" x2="95" y2="65" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 2" />
        <line x1="135" y1="5" x2="135" y2="65" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 2" />
        
        <text x="25" y="60" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800">"Fast"</text>
        <text x="68" y="60" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800">"Car"</text>
        <text x="110" y="60" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800">"Fly"</text>
      </g>

      <text x="12" y="132" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Transient Detection</text>
      <text x="12" y="148" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Sliced into micro-syllables</text>
      <text x="12" y="164" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Isolated transient vowel bursts</text>
      <text x="12" y="180" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Truncated to remove consonants</text>
      <text x="12" y="210" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700">RED LINES = SLICE CUTS</text>
    </g>

    <!-- Step 2: Digital Sampler Key Mapping -->
    <g transform="translate(230, 16)">
      <rect x="0" y="0" width="206" height="232" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="10" y="10" width="186" height="26" rx="4" fill="#78350f" fill-opacity="0.4" />
      <text x="103" y="27" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">2. SAMPLER KEY MAPPING</text>

      <!-- Keyboard keys graphic -->
      <g transform="translate(10, 46)">
        <rect x="0" y="0" width="186" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <!-- White keys -->
        <rect x="8" y="6" width="24" height="48" fill="#f8fafc" stroke="#334155" rx="2" />
        <rect x="36" y="6" width="24" height="48" fill="#f8fafc" stroke="#334155" rx="2" />
        <rect x="64" y="6" width="24" height="48" fill="#f59e0b" stroke="#334155" rx="2" />
        <rect x="92" y="6" width="24" height="48" fill="#f8fafc" stroke="#334155" rx="2" />
        <rect x="120" y="6" width="24" height="48" fill="#f59e0b" stroke="#334155" rx="2" />
        <rect x="148" y="6" width="24" height="48" fill="#f8fafc" stroke="#334155" rx="2" />
        <!-- Black keys -->
        <rect x="24" y="6" width="16" height="30" fill="#090d16" rx="1" />
        <rect x="80" y="6" width="16" height="30" fill="#090d16" rx="1" />
        <rect x="108" y="6" width="16" height="30" fill="#090d16" rx="1" />
      </g>

      <text x="12" y="126" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">Formant &amp; Pitch Shifting:</text>
      <text x="12" y="142" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">• Pitch tuned to scale notes (C, E, G)</text>
      <text x="12" y="158" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">• Formant raised +2 to +4 semitones</text>
      <text x="12" y="174" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">• Transforms human voice into synth tone</text>
      <text x="12" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">• ADSR: Instant attack, no release</text>
      <text x="12" y="212" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800">PLAYED VIA MIDI KEYBOARD</text>
    </g>

    <!-- Step 3: The Melodic EDM Hook -->
    <g transform="translate(452, 16)">
      <rect x="0" y="0" width="202" height="232" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <rect x="10" y="10" width="182" height="26" rx="4" fill="#064e3b" fill-opacity="0.4" />
      <text x="101" y="27" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">3. INSTRUMENTAL HOOK</text>

      <!-- Melodic sequence box -->
      <g transform="translate(10, 46)">
        <rect x="0" y="0" width="182" height="60" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <rect x="10" y="12" width="25" height="16" fill="#10b981" rx="3" />
        <rect x="42" y="28" width="25" height="16" fill="#10b981" rx="3" />
        <rect x="74" y="8" width="30" height="16" fill="#10b981" rx="3" />
        <rect x="112" y="32" width="22" height="16" fill="#10b981" rx="3" />
        <rect x="140" y="18" width="32" height="16" fill="#10b981" rx="3" />
        <text x="91" y="54" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Rhythmic Syncopated Pattern</text>
      </g>

      <text x="12" y="126" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">Effects Chain on Chops:</text>
      <text x="12" y="142" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">• Dotted-8th Ping-Pong Delay</text>
      <text x="12" y="158" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">• Huge Shimmering Digital Reverb</text>
      <text x="12" y="174" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">• Sidechain ducked to the Kick</text>
      <text x="12" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">• Replaces traditional guitar solo</text>
      <text x="12" y="212" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800">DEFINING TROPICAL HOUSE HOOK</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 334)">
    <rect x="0" y="0" width="672" height="70" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1.2" />
    <text x="16" y="22" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800">HOW VOCAL CHOPPING WORKS IN 'FAST CAR' (2015):</text>
    <text x="16" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Instead of playing a guitar riff, Jonas Blue sampled Dakota's vocal syllables, repitched and formant-shifted them, and played them on a MIDI keyboard to create the catchy, synthetic instrumental lead hook during the drop.</text>
  </g>
</svg>