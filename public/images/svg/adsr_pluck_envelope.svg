<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-adsr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="pluck-fill-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pad-fill-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-badge-adsr" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad-adsr)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow-badge-adsr)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">SYNTH SOUND DESIGN: PLUCK SOUND ADSR ENVELOPE</text>
    <rect x="506" y="6" width="154" height="22" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="0.8" />
    <text x="583" y="21" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">SUSTAIN = 0% (ZERO LEVEL)</text>
  </g>

  <!-- ==================== MAIN GRAPH AREA ==================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="672" height="248" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- Y-Axis Labels (Amplitude) -->
    <text x="14" y="32" fill="#64748b" font-family="monospace" font-size="10" font-weight="700">100% (Peak)</text>
    <text x="24" y="115" fill="#64748b" font-family="monospace" font-size="10">50%</text>
    <text x="30" y="200" fill="#ef4444" font-family="monospace" font-size="10" font-weight="800">0% (Sustain)</text>

    <!-- Grid Horizontal Lines -->
    <line x1="88" y1="28" x2="648" y2="28" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="88" y1="112" x2="648" y2="112" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="88" y1="196" x2="648" y2="196" stroke="#334155" stroke-width="1.5" />

    <!-- Graph Axis Borders -->
    <line x1="88" y1="20" x2="88" y2="204" stroke="#475569" stroke-width="1.5" />
    <line x1="88" y1="196" x2="650" y2="196" stroke="#475569" stroke-width="1.5" />

    <!-- GHOST CURVE: Standard Pad/Lead Envelope with High Sustain for Comparison -->
    <path d="M 88 196 L 160 28 L 260 90 L 460 90 L 560 196" fill="url(#pad-fill-grad)" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
    <text x="340" y="82" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" font-style="italic">Standard Sustained Sound (Sustain > 0%)</text>

    <!-- KEY ON / KEY OFF TIMELINE MARKERS -->
    <rect x="88" y="204" width="372" height="18" fill="#1e293b" rx="3" />
    <text x="274" y="217" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">KEY DEPRESSED (GATE OPEN)</text>

    <rect x="466" y="204" width="180" height="18" fill="#14080a" stroke="#7f1d1d" stroke-width="0.8" rx="3" />
    <text x="556" y="217" fill="#f87171" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">KEY RELEASED (GATE CLOSED)</text>

    <line x1="464" y1="24" x2="464" y2="204" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />

    <!-- ==================== PLUCK CURVE (THE CORRECT ANSWER) ==================== -->
    <!-- 
      Start: (88, 196) = 0 amplitude
      Fast Attack: Sharp transient straight up to (106, 28) = ~5-10ms instantaneous rise to 100%
      Fast Decay: Exponential curve from (106, 28) down to baseline (230, 196) = 0% level!
      Sustain: Flat on baseline from (230, 196) to (464, 196) = 0% level!
      Release: Remains at 0% from (464, 196) to (520, 196)
    -->
    <path d="M 88 196 L 104 28 C 120 70, 160 180, 230 196 L 464 196 L 520 196 Z" fill="url(#pluck-fill-grad)" />
    
    <path d="M 88 196 L 104 28 C 120 70, 160 180, 230 196 L 464 196 L 520 196" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-cyan)" />

    <!-- Attack Peak Marker -->
    <circle cx="104" cy="28" r="5" fill="#ffffff" stroke="#0284c7" stroke-width="2" />

    <!-- Decay End Marker at Zero Sustain -->
    <circle cx="230" cy="196" r="4.5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />

    <!-- ANNOTATIONS -->
    <!-- A: Fast Attack -->
    <g transform="translate(90, 8)">
      <rect x="0" y="0" width="84" height="18" rx="3" fill="#0284c7" />
      <text x="42" y="13" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">FAST ATTACK (0ms)</text>
    </g>

    <!-- D: Fast Decay -->
    <g transform="translate(170, 72)">
      <rect x="0" y="0" width="80" height="18" rx="3" fill="#0284c7" />
      <text x="40" y="13" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">FAST DECAY</text>
      <path d="M 40 18 L 30 42" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arrow)" />
    </g>

    <!-- S: ZERO SUSTAIN CALLOUT BOX -->
    <g transform="translate(260, 130)">
      <rect x="0" y="0" width="180" height="54" rx="6" fill="#14080a" stroke="#ef4444" stroke-width="1.2" />
      <text x="12" y="18" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="800">&#x26A0; 0% SUSTAIN (ZERO LEVEL)</text>
      <text x="12" y="33" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9">Even while key is held down,</text>
      <text x="12" y="46" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9">signal decays completely to silence!</text>
    </g>

    <!-- R: Fast Release -->
    <g transform="translate(480, 150)">
      <rect x="0" y="0" width="86" height="18" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="0.8" />
      <text x="43" y="13" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">FAST RELEASE</text>
    </g>
  </g>

  <!-- ==================== BOTTOM TAKEAWAY CARDS ==================== -->
  <g transform="translate(24, 320)">
    <!-- Card 1: Pluck Characteristics -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="90" height="18" rx="4" fill="#1f2937" />
      <text x="57" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">PLUCK PROFILE</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Transient-Only Sound</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">&#x2022; Attack = Instantaneous (sharp strike)</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">&#x2022; Decay = Fast drop to 0%</text>
    </g>

    <!-- Card 2: 0% Sustain Rule -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.2" />
      <rect x="12" y="10" width="96" height="18" rx="4" fill="#450a0a" />
      <text x="60" y="22" fill="#f87171" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x2713; ZERO SUSTAIN</text>
      <text x="12" y="44" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Sustain Level = 0%</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Holding the key produces no drone</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Models acoustic strings, harp, marimba</text>
    </g>

    <!-- Card 3: Filter Envelope Link -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="104" height="18" rx="4" fill="#1f2937" />
      <text x="64" y="22" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">FILTER LINKAGE</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Low-Pass Filter Decay</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Filter cutoff follows same curve:</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Bright initial click decaying to dull tail</text>
    </g>
  </g>
</svg>
