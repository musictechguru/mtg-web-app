<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-fr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-fr-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad-fr)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#14b8a6" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#14b8a6" filter="url(#glow-fr-teal)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">FREQUENCY BANDWIDTH: 1930s SHELLAC (200Hz–4.5kHz) VS 1960s VINYL LP</text>
    <rect x="520" y="6" width="140" height="22" rx="4" fill="#134e4a" fill-opacity="0.4" stroke="#14b8a6" stroke-width="0.8" />
    <text x="590" y="21" fill="#99f6e4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">EQ &amp; BANDWIDTH</text>
  </g>

  <!-- Frequency Response Graph -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="672" height="260" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- Grid lines -->
    <g stroke="#1e293b" stroke-width="1">
      <line x1="40" y1="50" x2="630" y2="50" />
      <line x1="40" y1="100" x2="630" y2="100" />
      <line x1="40" y1="150" x2="630" y2="150" />
      <line x1="40" y1="200" x2="630" y2="200" />

      <!-- Vertical freq markers -->
      <line x1="50" y1="30" x2="50" y2="220" />
      <line x1="140" y1="30" x2="140" y2="220" />
      <line x1="250" y1="30" x2="250" y2="220" />
      <line x1="380" y1="30" x2="380" y2="220" />
      <line x1="500" y1="30" x2="500" y2="220" />
      <line x1="610" y1="30" x2="610" y2="220" />
    </g>

    <!-- Labels on X Axis -->
    <text x="50" y="235" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">20 Hz</text>
    <text x="140" y="235" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">200 Hz</text>
    <text x="250" y="235" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">1 kHz</text>
    <text x="380" y="235" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">4.5 kHz</text>
    <text x="500" y="235" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">10 kHz</text>
    <text x="610" y="235" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">20 kHz</text>

    <!-- Curve A: 1936 Shellac Disc (Robert Johnson) -->
    <!-- Narrow bandpass 200 Hz to 4.5 kHz -->
    <path d="M 50 210 Q 110 205 140 90 Q 250 80 380 90 Q 420 180 500 210" stroke="#f59e0b" stroke-width="3" fill="none" />
    <rect x="220" y="55" width="160" height="22" rx="4" fill="#78350f" fill-opacity="0.8" stroke="#f59e0b" stroke-width="0.8" />
    <text x="300" y="70" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">SHELLAC (200 Hz – 4.5 kHz)</text>

    <!-- Curve B: 1968 Vinyl LP (Cream) -->
    <!-- Wide full range 30 Hz to 18 kHz -->
    <path d="M 50 115 Q 70 85 140 80 T 300 80 T 480 82 Q 560 90 610 120" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 3" fill="none" />
    <rect x="440" y="55" width="160" height="22" rx="4" fill="#0369a1" fill-opacity="0.8" stroke="#38bdf8" stroke-width="0.8" />
    <text x="520" y="70" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">VINYL LP (30 Hz – 18 kHz)</text>
  </g>

  <!-- Bottom Description Box -->
  <g transform="translate(24, 332)">
    <rect x="0" y="0" width="672" height="74" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1.2" />
    <text x="16" y="22" fill="#14b8a6" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800">ACOUSTIC CONSEQUENCES OF BANDWIDTH LIMITATIONS:</text>
    <text x="16" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• <tspan fill="#f59e0b" font-weight="700">Robert Johnson 1936:</tspan> Lack of low end below 200 Hz strips acoustic guitar body resonance; lack of treble above 4.5 kHz removes string sheen, leaving a telephone-like mid-range voice focus.</text>
    <text x="16" y="58" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">• <tspan fill="#38bdf8" font-weight="700">Cream 1968:</tspan> Full-bandwidth capture renders Jack Bruce’s deep bass fundamentals (41 Hz) and Ginger Baker’s crisp cymbal sizzle (10 kHz+).</text>
  </g>
</svg>