<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-pb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Wheel Gradient -->
    <linearGradient id="p-wheel-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="35%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="65%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="glow-badge-pb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple-pb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad-pb)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#a855f7" filter="url(#glow-badge-pb)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">SYNTH PARAMETER: PITCH BEND RANGE = 12 SEMITONES (FULL OCTAVE)</text>
    <rect x="526" y="6" width="134" height="22" rx="4" fill="#6b21a8" fill-opacity="0.4" stroke="#a855f7" stroke-width="0.8" />
    <text x="593" y="21" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">RANGE: ±12 ST (OCTAVE)</text>
  </g>

  <!-- ==================== MAIN GRAPHIC: WHEEL AND RANGE GLIDE ==================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="672" height="248" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- 1. LEFT: THE PITCH BEND WHEEL (SPRING-CENTERED) -->
    <g transform="translate(24, 20)">
      <rect x="0" y="0" width="170" height="208" rx="8" fill="#141829" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="85" y="22" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">PITCH BEND WHEEL</text>

      <!-- Center Spring-Loaded Indicator -->
      <rect x="16" y="32" width="138" height="20" rx="3" fill="#1e293b" />
      <text x="85" y="46" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x21C5; SPRING-CENTERED TO 0</text>

      <!-- Wheel Graphic -->
      <g transform="translate(60, 60)">
        <rect x="0" y="0" width="50" height="100" rx="6" fill="url(#p-wheel-grad)" stroke="#1e293b" stroke-width="1.5" />
        <!-- Ridges -->
        <line x1="0" y1="20" x2="50" y2="20" stroke="#0f172a" stroke-width="2" />
        <line x1="0" y1="36" x2="50" y2="36" stroke="#0f172a" stroke-width="2" />
        <!-- Spring Center Indent / Notch (Dead Center) -->
        <rect x="0" y="47" width="50" height="6" fill="#8b5cf6" />
        <line x1="0" y1="64" x2="50" y2="64" stroke="#0f172a" stroke-width="2" />
        <line x1="0" y1="80" x2="50" y2="80" stroke="#0f172a" stroke-width="2" />
      </g>

      <!-- Wheel Position Labels -->
      <text x="135" y="74" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="800">MAX UP</text>
      <text x="135" y="112" fill="#8b5cf6" font-family="monospace" font-size="10" font-weight="800">REST (0)</text>
      <text x="135" y="152" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="800">MAX DN</text>

      <rect x="16" y="174" width="138" height="22" rx="4" fill="#0f172a" stroke="#334155" />
      <text x="85" y="189" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">14-Bit Resolution (16,384 Steps)</text>
    </g>

    <!-- 2. RIGHT: THE SEMITONE GLIDE SPAN (±12 ST = FULL OCTAVE) -->
    <g transform="translate(210, 20)">
      <rect x="0" y="0" width="438" height="208" rx="8" fill="#111a33" stroke="#334155" stroke-width="1.2" />
      <text x="219" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">SYNTHESIZER PITCH BEND RESPONSE (12 SEMITONES = 1 OCTAVE)</text>

      <!-- 3-Tier Pitch Glide Diagram -->
      <!-- Tier 1: Max Push UP (+12 Semitones / +1 Octave) -->
      <g transform="translate(20, 36)">
        <rect x="0" y="0" width="398" height="46" rx="6" fill="#0c1f38" stroke="#0284c7" stroke-width="1" />
        <rect x="8" y="8" width="80" height="30" rx="4" fill="#0284c7" />
        <text x="48" y="27" fill="#ffffff" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle">+12 ST</text>

        <text x="100" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Pushed Fully Forward: +1 Full Octave Glide</text>
        <text x="100" y="34" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9.5">Playing Middle C (C3) glides up smoothly to High C (C4)</text>
      </g>

      <!-- Tier 2: Center Position (Rest / 0 Semitones) -->
      <g transform="translate(20, 90)">
        <rect x="0" y="0" width="398" height="42" rx="6" fill="#1b1733" stroke="#8b5cf6" stroke-width="1" />
        <rect x="8" y="7" width="80" height="28" rx="4" fill="#6d28d9" />
        <text x="48" y="25" fill="#ffffff" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle">0 ST</text>

        <text x="100" y="20" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Rest Position: Natural Unbent Pitch</text>
        <text x="100" y="33" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Spring automatically snaps back to 0 semitone offset</text>
      </g>

      <!-- Tier 3: Max Pull DOWN (-12 Semitones / -1 Octave) -->
      <g transform="translate(20, 140)">
        <rect x="0" y="0" width="398" height="46" rx="6" fill="#2d101a" stroke="#e11d48" stroke-width="1" />
        <rect x="8" y="8" width="80" height="30" rx="4" fill="#be123c" />
        <text x="48" y="27" fill="#ffffff" font-family="monospace" font-size="13" font-weight="900" text-anchor="middle">-12 ST</text>

        <text x="100" y="20" fill="#fb7185" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Pulled Fully Back: -1 Full Octave Glide</text>
        <text x="100" y="34" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9.5">Playing Middle C (C3) glides down to Low C (C2) - Dive bomb!</text>
      </g>

      <text x="219" y="200" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">&#x2713; Total Available Sweep = 24 Semitones (2 Full Octaves from Lowest to Highest)</text>
    </g>
  </g>

  <!-- ==================== BOTTOM TAKEAWAY CARDS ==================== -->
  <g transform="translate(24, 320)">
    <!-- Card 1: 12 Semitones Definition -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="100" height="18" rx="4" fill="#1f2937" />
      <text x="62" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">OCTAVE THEORY</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">12 ST = 1 Octave</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">In western equal temperament,</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">an octave comprises exactly 12 semitones</text>
    </g>

    <!-- Card 2: 14-Bit Precision -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="112" height="18" rx="4" fill="#1f2937" />
      <text x="68" y="22" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">14-BIT PROTOCOL</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">16,384 Smooth Steps</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Standard 7-bit (128) creates zipper noise</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">14-bit yields perfectly continuous sweeps</text>
    </g>

    <!-- Card 3: Exam Target -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#22c55e" stroke-width="1.2" />
      <rect x="12" y="10" width="90" height="18" rx="4" fill="#14532d" />
      <text x="57" y="22" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x2713; TARGET VALUE</text>
      <text x="12" y="44" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Set Range = 12 ST</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Allows full octave dive-bombs</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">and guitar-style expressive solo bends</text>
    </g>
  </g>
</svg>
