<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-fever" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="glow-red-lamp" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-badge-fever" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="red-lamp-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fca5a5" />
      <stop offset="70%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad-fever)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#ef4444" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#ef4444" filter="url(#glow-badge-fever)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">STUDIO PSYCHOLOGY: "RED LIGHT FEVER" (RECORDING ANXIETY)</text>
    <rect x="522" y="6" width="138" height="22" rx="4" fill="#991b1b" fill-opacity="0.4" stroke="#ef4444" stroke-width="0.8" />
    <text x="591" y="21" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">PERFORMANCE STATE</text>
  </g>

  <!-- ==================== MAIN GRAPHIC ==================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="672" height="206" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- LEFT: THE GLOWING STUDIO TALLY LIGHT -->
    <g transform="translate(40, 20)">
      <rect x="0" y="0" width="220" height="166" rx="8" fill="#14080a" stroke="#7f1d1d" stroke-width="1.5" />
      
      <!-- Studio Lamp Housing Box -->
      <rect x="25" y="25" width="170" height="74" rx="6" fill="#1e1b1d" stroke="#450a0a" stroke-width="2" />
      <!-- Glowing Red Lens -->
      <rect x="33" y="33" width="154" height="58" rx="4" fill="url(#red-lamp-grad)" filter="url(#glow-red-lamp)" />
      <!-- Glowing Text Inside Lamp -->
      <text x="110" y="69" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="3" text-anchor="middle">RECORDING</text>

      <rect x="25" y="116" width="170" height="34" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
      <text x="110" y="132" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">&#x26A0; TALLY LIGHT ENGAGED</text>
      <text x="110" y="143" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Triggers performer anxiety</text>
    </g>

    <!-- RIGHT: PSYCHOLOGICAL IMPACT & PRODUCER REMEDIES -->
    <g transform="translate(280, 20)">
      <rect x="0" y="0" width="365" height="166" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />

      <!-- Impact Header -->
      <rect x="14" y="12" width="155" height="20" rx="3" fill="#7f1d1d" />
      <text x="91" y="26" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">THE PSYCHOLOGICAL TOLL</text>

      <g transform="translate(14, 40)">
        <text x="0" y="12" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="700">• Muscle Tension &amp; Stiff Hands:</text>
        <text x="14" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Guitarists rushing tempo, drummers tightening wrists.</text>

        <text x="0" y="42" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="700">• Vocal Pitch Hesitation:</text>
        <text x="14" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Singers second-guessing breathing and pitch support.</text>
      </g>

      <!-- Producer Remedies -->
      <rect x="14" y="104" width="165" height="20" rx="3" fill="#065f46" />
      <text x="96" y="118" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">PRODUCER DISARMING METHODS</text>

      <g transform="translate(14, 132)">
        <text x="0" y="10" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">&#x2714; "Just Rehearsing":</text>
        <text x="110" y="10" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">Hit record silently without telling performer.</text>

        <text x="0" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">&#x2714; Loop Recording:</text>
        <text x="110" y="22" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">Run continuous passes until fear dissolves.</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM: 3 EXPLANATION CARDS ==================== -->
  <g transform="translate(24, 280)">
    <!-- CARD 1: DEFINITION (CORRECT ANSWER) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#3a0b12" stroke="#ef4444" stroke-width="1.8" />
      <rect x="10" y="10" width="95" height="18" rx="4" fill="#991b1b" />
      <text x="57" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CORRECT ANSWER</text>
      
      <text x="12" y="46" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Performance Anxiety</text>
      <text x="12" y="64" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">The psychological nervousness</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">and self-conscious inhibition</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">a performer feels the moment</text>
      <text x="12" y="106" fill="#f87171" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">active recording begins.</text>
    </g>

    <!-- CARD 2: PHYSIOLOGICAL SYMPTOMS -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="105" height="18" rx="4" fill="#854d0e" />
      <text x="62" y="23" fill="#fef08a" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SYMPTOMS</text>
      
      <text x="12" y="46" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Stiffened Delivery</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Adrenaline rush causes:</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Rushing ahead of the click</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Clammy hands &amp; vocal tension</text>
      <text x="12" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Loss of natural groove</text>
    </g>

    <!-- CARD 3: PRODUCER PSYCHOLOGY -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="112" height="18" rx="4" fill="#065f46" />
      <text x="66" y="23" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">STUDIO REMEDY</text>
      
      <text x="12" y="46" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Producer Empathy</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Producers overcome it by:</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Dimming red tally lights</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Recording warm-up passes</text>
      <text x="12" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Creating a relaxed vibe</text>
    </g>
  </g>
</svg>