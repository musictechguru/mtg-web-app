<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <rect width="720" height="400" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">BRUCE SWEDIEN: ACUSONIC RECORDING PROCESS (1982)</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">The Legendary 'Billie Jean' Drum Sound: Custom Plywood Platform &amp; Kick Blanket Tunnel</text>

  <!-- Diagram -->
  <g transform="translate(40, 75)">
    <rect width="640" height="225" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />

    <!-- Drum Platform Isolation -->
    <g transform="translate(30, 25)">
      <rect width="270" height="175" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="135" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">CUSTOM UNCOUPLED DRUM RISER</text>

      <!-- Plywood platform drawing -->
      <rect x="25" y="115" width="220" height="16" rx="2" fill="#b45309" stroke="#d97706" stroke-width="1.5" />
      <text x="135" y="127" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="8" font-weight="800" text-anchor="middle">8 x 8 ft UNCOUPLED PLYWOOD RISER</text>

      <!-- Kick drum with blanket tunnel -->
      <circle cx="75" cy="80" r="28" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
      <rect x="100" y="65" width="65" height="30" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1" />
      <text x="132" y="83" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="7" font-weight="700" text-anchor="middle">BLANKET TUNNEL</text>

      <!-- Inside mic -->
      <circle cx="170" cy="80" r="5" fill="#ef4444" />
      <text x="170" y="102" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">RE20 Mic</text>

      <rect x="15" y="145" width="240" height="22" rx="3" fill="#0b1329" />
      <text x="135" y="159" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Prevents kick bleed into snare &amp; decouples floor vibration</text>
    </g>

    <!-- Stereo Dimension / Acusonic philosophy -->
    <g transform="translate(330, 25)">
      <rect width="280" height="175" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
      <text x="140" y="22" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">SONIC LAYERING (ACUSONIC)</text>

      <rect x="15" y="38" width="250" height="36" rx="3" fill="#1e293b" />
      <text x="25" y="53" fill="#fde68a" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">1. LIVE DRUMS (Ndugu Chancler):</text>
      <text x="25" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7.5">Acoustic kit, not a Roland TR-808! Tight human groove.</text>

      <rect x="15" y="82" width="250" height="36" rx="3" fill="#1e293b" />
      <text x="25" y="97" fill="#fde68a" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">2. DIRECT INJECTION (Louis Johnson):</text>
      <text x="25" y="110" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7.5">Electric bass plugged direct to desk; no muddy room reverb.</text>

      <rect x="15" y="126" width="250" height="38" rx="3" fill="#1e293b" />
      <text x="25" y="141" fill="#fde68a" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">3. VOCAL PURITY (Shure SM7):</text>
      <text x="25" y="154" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="7.5">Michael sang live in booth with pop filter; no samples used.</text>
    </g>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 315)">
    <rect width="640" height="65" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EDEXCEL EXAM RELEVANCE: BRUCE SWEDIEN'S TECHNIQUES</text>
    <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Bruce Swedien rejected standard studio approaches: he raised the drum kit onto a custom plywood platform to prevent floor reflections, miked the bass directly via DI, and relied on acoustic stereo pairs rather than heavy electronic processing.</text>
  </g>
</svg>