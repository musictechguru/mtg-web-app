<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <rect width="720" height="400" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="32" fill="#818cf8" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">QUADRAPHONIC 4-CHANNEL SURROUND (1973)</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Pink Floyd &amp; Alan Parsons: The 360-Degree Immersive Soundscape of 'Dark Side of the Moon'</text>

  <!-- Soundstage 4 Speakers -->
  <g transform="translate(40, 75)">
    <rect width="640" height="225" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />

    <!-- Speaker Front Left -->
    <rect x="40" y="20" width="80" height="45" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
    <text x="80" y="42" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">FRONT LEFT</text>
    <text x="80" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Channel 1</text>

    <!-- Speaker Front Right -->
    <rect x="520" y="20" width="80" height="45" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
    <text x="560" y="42" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">FRONT RIGHT</text>
    <text x="560" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Channel 2</text>

    <!-- Speaker Back Left -->
    <rect x="40" y="155" width="80" height="45" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
    <text x="80" y="177" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">REAR LEFT</text>
    <text x="80" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Channel 3</text>

    <!-- Speaker Back Right -->
    <rect x="520" y="155" width="80" height="45" rx="4" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" />
    <text x="560" y="177" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">REAR RIGHT</text>
    <text x="560" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Channel 4</text>

    <!-- Center Listener & Rotating Sound Panner -->
    <circle cx="320" cy="110" r="50" fill="#0f172a" stroke="#6366f1" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="320" cy="110" r="14" fill="#4f46e5" />
    <text x="320" y="114" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="800" text-anchor="middle">LISTENER</text>

    <!-- Circular Motion of Cash Register SFX -->
    <path d="M 280 80 A 60 60 0 1 1 360 80" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="4 4" />
    <polygon points="365,75 365,88 355,82" fill="#22c55e" />
    <text x="320" y="45" fill="#86efac" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Sound Effects Swirling Around Room</text>

    <rect x="220" y="170" width="200" height="35" rx="4" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="320" y="185" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">EMI TG12345 JOYSTICK PANNER</text>
    <text x="320" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">4 independent channels discrete mixdown</text>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 315)">
    <rect width="640" height="65" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#818cf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EDEXCEL EXAM RELEVANCE: QUADRAPHONIC FORMAT</text>
    <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">By 1973, Mono was obsolete for major rock releases. Pink Floyd fully embraced cutting-edge spatial audio, releasing 'Dark Side of the Moon' in both dedicated stereo and discrete 4-channel Quadraphonic surround sound.</text>
  </g>
</svg>