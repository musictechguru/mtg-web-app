<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-dyn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Velocity Bar Gradients -->
    <linearGradient id="human-vel-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="machine-vel-bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="glow-badge-dyn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad-dyn)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#f59e0b" filter="url(#glow-badge-dyn)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">PERFORMANCE DYNAMICS: HUMAN MICRO-VELOCITIES vs FLAT MACHINE TRIGGERS</text>
    <rect x="526" y="6" width="134" height="22" rx="4" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-width="0.8" />
    <text x="593" y="21" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">VERSION A: DYNAMIC</text>
  </g>

  <!-- ==================== MAIN VELOCITY COMPARISON ==================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="672" height="248" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- 1. TOP: GLORIA JONES 1964 (LIVE DRUMMER MICRO-DYNAMICS) -->
    <g transform="translate(18, 14)">
      <rect x="0" y="0" width="636" height="100" rx="8" fill="#171216" stroke="#f59e0b" stroke-width="1.2" />
      <rect x="12" y="8" width="280" height="20" rx="4" fill="#78350f" />
      <text x="152" y="22" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">GLORIA JONES (1964): HUMAN MICRO-DYNAMICS</text>
      <text x="306" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Dynamic variance between accents &amp; ghost notes</text>

      <!-- 8-Hit Velocity Lane -->
      <g transform="translate(12, 34)">
        <!-- Velocity lane box -->
        <rect x="0" y="0" width="612" height="52" rx="4" fill="#08070d" stroke="#1e293b" />
        
        <!-- Y-Axis lines -->
        <line x1="30" y1="6" x2="600" y2="6" stroke="#1e293b" stroke-dasharray="2 2" />
        <text x="24" y="10" fill="#64748b" font-family="monospace" font-size="8" text-anchor="end">127</text>
        <line x1="30" y1="28" x2="600" y2="28" stroke="#1e293b" stroke-dasharray="2 2" />
        <text x="24" y="32" fill="#64748b" font-family="monospace" font-size="8" text-anchor="end">64</text>

        <!-- Dynamic contour line connecting tops of hits -->
        <path d="M 60 12 L 125 24 L 190 8 L 255 30 L 320 14 L 385 26 L 450 10 L 515 22" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2" />

        <!-- 8 Hit Bars (Varying heights = realistic drumming) -->
        <!-- Hit 1: 95 -->
        <rect x="52" y="12" width="16" height="38" rx="2" fill="url(#human-vel-bar)" />
        <text x="60" y="8" fill="#fde68a" font-family="monospace" font-size="7.5" text-anchor="middle">98</text>

        <!-- Hit 2: 70 (softer backbeat) -->
        <rect x="117" y="24" width="16" height="26" rx="2" fill="url(#human-vel-bar)" />
        <text x="125" y="20" fill="#fde68a" font-family="monospace" font-size="7.5" text-anchor="middle">70</text>

        <!-- Hit 3: 110 (accent) -->
        <rect x="182" y="8" width="16" height="42" rx="2" fill="url(#human-vel-bar)" />
        <text x="190" y="4" fill="#fde68a" font-family="monospace" font-size="7.5" font-weight="700" text-anchor="middle">112</text>

        <!-- Hit 4: 55 (ghost note) -->
        <rect x="247" y="30" width="16" height="20" rx="2" fill="url(#human-vel-bar)" />
        <text x="255" y="26" fill="#fde68a" font-family="monospace" font-size="7.5" text-anchor="middle">55</text>

        <!-- Hit 5: 92 -->
        <rect x="312" y="14" width="16" height="36" rx="2" fill="url(#human-vel-bar)" />
        <text x="320" y="10" fill="#fde68a" font-family="monospace" font-size="7.5" text-anchor="middle">92</text>

        <!-- Hit 6: 65 -->
        <rect x="377" y="26" width="16" height="24" rx="2" fill="url(#human-vel-bar)" />
        <text x="385" y="22" fill="#fde68a" font-family="monospace" font-size="7.5" text-anchor="middle">65</text>

        <!-- Hit 7: 105 (accent) -->
        <rect x="442" y="10" width="16" height="40" rx="2" fill="url(#human-vel-bar)" />
        <text x="450" y="6" fill="#fde68a" font-family="monospace" font-size="7.5" font-weight="700" text-anchor="middle">108</text>

        <!-- Hit 8: 75 -->
        <rect x="507" y="22" width="16" height="28" rx="2" fill="url(#human-vel-bar)" />
        <text x="515" y="18" fill="#fde68a" font-family="monospace" font-size="7.5" text-anchor="middle">75</text>

        <text x="550" y="32" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9" font-weight="800">&#x2713; Expressive Groove</text>
      </g>
    </g>

    <!-- 2. BOTTOM: SOFT CELL 1981 (UNIFORM STEP MACHINE TRIGGERS) -->
    <g transform="translate(18, 124)">
      <rect x="0" y="0" width="636" height="110" rx="8" fill="#0c1729" stroke="#38bdf8" stroke-width="1.2" />
      <rect x="12" y="8" width="310" height="20" rx="4" fill="#0369a1" />
      <text x="167" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">SOFT CELL (1981): RIGID MACHINE VELOCITY</text>
      <text x="330" y="22" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="9">Uniform fixed velocity (100% flat ceiling)</text>

      <!-- 8-Hit Velocity Lane -->
      <g transform="translate(12, 34)">
        <rect x="0" y="0" width="612" height="52" rx="4" fill="#060d19" stroke="#1e293b" />
        
        <!-- Y-Axis lines -->
        <line x1="30" y1="6" x2="600" y2="6" stroke="#1e293b" stroke-dasharray="2 2" />
        <text x="24" y="10" fill="#64748b" font-family="monospace" font-size="8" text-anchor="end">127</text>

        <!-- Flat horizontal dynamic line -->
        <line x1="45" y1="8" x2="530" y2="8" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2" />

        <!-- 8 Hit Bars (All exactly identical height = 127/120) -->
        <rect x="52" y="8" width="16" height="42" rx="2" fill="url(#machine-vel-bar)" />
        <text x="60" y="4" fill="#38bdf8" font-family="monospace" font-size="7.5" font-weight="700" text-anchor="middle">127</text>

        <rect x="117" y="8" width="16" height="42" rx="2" fill="url(#machine-vel-bar)" />
        <text x="125" y="4" fill="#38bdf8" font-family="monospace" font-size="7.5" font-weight="700" text-anchor="middle">127</text>

        <rect x="182" y="8" width="16" height="42" rx="2" fill="url(#machine-vel-bar)" />
        <text x="190" y="4" fill="#38bdf8" font-family="monospace" font-size="7.5" font-weight="700" text-anchor="middle">127</text>

        <rect x="247" y="8" width="16" height="42" rx="2" fill="url(#machine-vel-bar)" />
        <text x="255" y="4" fill="#38bdf8" font-family="monospace" font-size="7.5" font-weight="700" text-anchor="middle">127</text>

        <rect x="312" y="8" width="16" height="42" rx="2" fill="url(#machine-vel-bar)" />
        <text x="320" y="4" fill="#38bdf8" font-family="monospace" font-size="7.5" font-weight="700" text-anchor="middle">127</text>

        <rect x="377" y="8" width="16" height="42" rx="2" fill="url(#machine-vel-bar)" />
        <text x="385" y="4" fill="#38bdf8" font-family="monospace" font-size="7.5" font-weight="700" text-anchor="middle">127</text>

        <rect x="442" y="8" width="16" height="42" rx="2" fill="url(#machine-vel-bar)" />
        <text x="450" y="4" fill="#38bdf8" font-family="monospace" font-size="7.5" font-weight="700" text-anchor="middle">127</text>

        <rect x="507" y="8" width="16" height="42" rx="2" fill="url(#machine-vel-bar)" />
        <text x="515" y="4" fill="#38bdf8" font-family="monospace" font-size="7.5" font-weight="700" text-anchor="middle">127</text>

        <text x="550" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800">&#x26A1; Relentless Pulse</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM SPECIFICATION CARDS ==================== -->
  <g transform="translate(24, 320)">
    <!-- Card 1: Correct Answer -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.2" />
      <rect x="12" y="10" width="104" height="18" rx="4" fill="#78350f" />
      <text x="64" y="22" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x2713; CORRECT ANSWER</text>
      <text x="12" y="44" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Version A (Gloria Jones)</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Retains natural micro-dynamics</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Human volume touch on acoustic kit</text>
    </g>

    <!-- Card 2: 1980s Machine Striking -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="112" height="18" rx="4" fill="#1f2937" />
      <text x="68" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">STEP SEQUENCING</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Flat Dynamic Range</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Drum machine triggers at fixed volume;</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">creates robotic dancefloor hypnosis</text>
    </g>

    <!-- Card 3: Mix Compression Impact -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="112" height="18" rx="4" fill="#1f2937" />
      <text x="68" y="22" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">DYNAMIC GLUE</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Tape vs Brickwall</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Tape gently compressed live peaks;</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">80s mixes clamped dynamics flat</text>
    </g>
  </g>
</svg>
