<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <marker id="arrow-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#22c55e" />
    </marker>
    <marker id="arrow-cyan" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#22c55e" filter="url(#glow-green)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">SESSION MANAGEMENT: DAW DISK CACHE &amp; SYSTEM RAM PLAYBACK</text>
    <rect x="522" y="6" width="138" height="22" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#22c55e" stroke-width="0.8" />
    <text x="591" y="21" fill="#4ade80" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">100+ AUDIO TRACKS</text>
  </g>

  <!-- ==================== MAIN GRAPHIC: DISK vs RAM CACHE ==================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="672" height="206" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- LEFT: STORAGE DRIVE (HDD / SSD) -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="160" height="166" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="140" height="20" rx="3" fill="#1e293b" />
      <text x="80" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">HARD DRIVE / SSD</text>

      <!-- Drive Icon (Stack of Platters / Flash) -->
      <g transform="translate(30, 42)">
        <rect x="0" y="0" width="100" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="15" cy="11" r="3" fill="#38bdf8" />
        <line x1="30" y1="11" x2="85" y2="11" stroke="#334155" stroke-width="2" />

        <rect x="0" y="26" width="100" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="15" cy="37" r="3" fill="#38bdf8" />
        <line x1="30" y1="37" x2="85" y2="37" stroke="#334155" stroke-width="2" />

        <rect x="0" y="52" width="100" height="22" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <circle cx="15" cy="63" r="3" fill="#38bdf8" />
        <line x1="30" y1="63" x2="85" y2="63" stroke="#334155" stroke-width="2" />
      </g>

      <rect x="10" y="128" width="140" height="26" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
      <text x="80" y="141" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">DRIVE SEEK BOTTLENECK</text>
      <text x="80" y="150" fill="#f87171" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">100+ simultaneous read heads</text>
    </g>

    <!-- TRANSFER ARROW: PRE-LOADING TIMELINE INTO RAM -->
    <g transform="translate(186, 75)">
      <line x1="0" y1="28" x2="48" y2="28" stroke="#22c55e" stroke-width="3" stroke-dasharray="4 2" marker-end="url(#arrow-green)" />
      <rect x="-10" y="4" width="70" height="16" rx="3" fill="#052e16" stroke="#22c55e" stroke-width="0.8" />
      <text x="25" y="15" fill="#4ade80" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">PRE-LOADS</text>
    </g>

    <!-- CENTER: SYSTEM RAM (DISK CACHE BUFFER) -->
    <g transform="translate(244, 20)">
      <rect x="0" y="0" width="220" height="166" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="2" filter="url(#glow-green)" />
      
      <!-- RAM Badge -->
      <rect x="10" y="10" width="200" height="22" rx="4" fill="#166534" />
      <text x="110" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">&#x1F4BE; SYSTEM RAM DISK CACHE</text>

      <!-- RAM Module Chips Graphic -->
      <g transform="translate(18, 42)">
        <rect x="0" y="0" width="184" height="34" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" />
        <!-- Gold memory pins bottom -->
        <line x1="10" y1="30" x2="10" y2="34" stroke="#facc15" stroke-width="2" /><line x1="25" y1="30" x2="25" y2="34" stroke="#facc15" stroke-width="2" /><line x1="40" y1="30" x2="40" y2="34" stroke="#facc15" stroke-width="2" /><line x1="55" y1="30" x2="55" y2="34" stroke="#facc15" stroke-width="2" /><line x1="70" y1="30" x2="70" y2="34" stroke="#facc15" stroke-width="2" /><line x1="85" y1="30" x2="85" y2="34" stroke="#facc15" stroke-width="2" /><line x1="100" y1="30" x2="100" y2="34" stroke="#facc15" stroke-width="2" /><line x1="115" y1="30" x2="115" y2="34" stroke="#facc15" stroke-width="2" /><line x1="130" y1="30" x2="130" y2="34" stroke="#facc15" stroke-width="2" /><line x1="145" y1="30" x2="145" y2="34" stroke="#facc15" stroke-width="2" /><line x1="160" y1="30" x2="160" y2="34" stroke="#facc15" stroke-width="2" />
        <!-- Memory IC chips -->
        <rect x="10" y="6" width="30" height="18" rx="2" fill="#1e293b" stroke="#4ade80" stroke-width="0.8" />
        <rect x="52" y="6" width="30" height="18" rx="2" fill="#1e293b" stroke="#4ade80" stroke-width="0.8" />
        <rect x="94" y="6" width="30" height="18" rx="2" fill="#1e293b" stroke="#4ade80" stroke-width="0.8" />
        <rect x="136" y="6" width="30" height="18" rx="2" fill="#1e293b" stroke="#4ade80" stroke-width="0.8" />
      </g>

      <!-- Memory Speed Specs -->
      <text x="110" y="98" fill="#4ade80" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">&gt; 50,000 MB/s SPEED</text>
      <text x="110" y="112" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Nanosecond Seek Latency</text>

      <!-- Entire Timeline Cached -->
      <rect x="14" y="124" width="192" height="30" rx="4" fill="#14532d" stroke="#4ade80" stroke-width="1" />
      <text x="110" y="138" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">ENTIRE TIMELINE LOADED</text>
      <text x="110" y="149" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">100% of Audio Cached in RAM</text>
    </g>

    <!-- RIGHT: DAW 100+ TRACK ENGINE -->
    <g transform="translate(474, 20)">
      <rect x="0" y="0" width="178" height="166" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
      <rect x="10" y="10" width="158" height="20" rx="3" fill="#0369a1" />
      <text x="89" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">DAW AUDIO ENGINE</text>

      <!-- 100+ Tracks visual stack -->
      <g transform="translate(14, 40)">
        <rect x="0" y="0" width="150" height="18" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
        <text x="8" y="13" fill="#38bdf8" font-family="system-ui, monospace" font-size="8">Trk 001: Kick In</text>

        <rect x="0" y="22" width="150" height="18" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
        <text x="8" y="35" fill="#38bdf8" font-family="system-ui, monospace" font-size="8">Trk 048: Strings Ens</text>

        <rect x="0" y="44" width="150" height="18" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
        <text x="8" y="57" fill="#38bdf8" font-family="system-ui, monospace" font-size="8">Trk 112: Lead Vocal</text>

        <text x="75" y="76" fill="#facc15" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">+ 100 More Tracks</text>
      </g>

      <rect x="10" y="128" width="158" height="26" rx="4" fill="#064e3b" stroke="#22c55e" stroke-width="0.8" />
      <text x="89" y="141" fill="#4ade80" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">&#x2714; ZERO DISK OVERLOADS</text>
      <text x="89" y="150" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Stutter-free multitrack streaming</text>
    </g>
  </g>

  <!-- ==================== BOTTOM: 3 EXPLANATION CARDS ==================== -->
  <g transform="translate(24, 280)">
    <!-- CARD 1: DISK CACHE PURPOSE (CORRECT ANSWER) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#052e16" stroke="#22c55e" stroke-width="1.8" />
      <rect x="10" y="10" width="95" height="18" rx="4" fill="#166534" />
      <text x="57" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CORRECT ANSWER</text>
      
      <text x="12" y="46" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Timeline Loaded in RAM</text>
      <text x="12" y="64" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Disk Cache pre-loads all session</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">audio into high-speed RAM,</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">eliminating slow hard drive seeks</text>
      <text x="12" y="106" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">during 100+ track playback.</text>
    </g>

    <!-- CARD 2: BANDWIDTH & SEEK TIMES -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="112" height="18" rx="4" fill="#0369a1" />
      <text x="66" y="23" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">HARDWARE SPEED</text>
      
      <text x="12" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">RAM vs Disk Storage</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Even fast NVMe SSDs face limits</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">when seeking hundreds of audio</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">regions. System RAM delivers</text>
      <text x="12" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">50+ GB/s instant throughput.</text>
    </g>

    <!-- CARD 3: SESSION STABILITY -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="105" height="18" rx="4" fill="#854d0e" />
      <text x="62" y="23" fill="#fef08a" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">ERROR PREVENTION</text>
      
      <text x="12" y="46" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Eliminates Stutters</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Prevents fatal DAW errors:</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• No "Disk Too Slow" crashes</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Instant scrubbing &amp; looping</text>
      <text x="12" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Vital for film scoring &amp; pop</text>
    </g>
  </g>
</svg>