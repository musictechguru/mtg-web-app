<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Main Container -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#facc15" filter="url(#glow-gold)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">CLICK TRACK / METRONOME: TEMPO GRID &amp; RECORDING CONSISTENCY</text>
    <rect x="522" y="6" width="138" height="22" rx="4" fill="#0284c7" fill-opacity="0.35" stroke="#38bdf8" stroke-width="0.8" />
    <text x="591" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">120 BPM • 4/4 TIME</text>
  </g>

  <!-- ==================== MAIN DAW TIMELINE CONTAINER ==================== -->
  <g transform="translate(24, 60)">
    <!-- Outer DAW arrange plate -->
    <rect x="0" y="0" width="672" height="206" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- Left Track Header Panel (Width: 140px) -->
    <rect x="0" y="0" width="140" height="206" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <rect x="139" y="0" width="1" height="206" fill="#334155" />

    <!-- Timeline Timeline Header (Bars & Beats Ruler) -->
    <rect x="140" y="0" width="532" height="28" fill="#1e293b" />
    <line x1="140" y1="28" x2="672" y2="28" stroke="#334155" stroke-width="1.2" />

    <!-- Bar Markers on Ruler -->
    <!-- Bar 1: x = 150 -->
    <text x="155" y="18" fill="#facc15" font-family="system-ui, monospace" font-size="10.5" font-weight="800">BAR 1</text>
    <line x1="150" y1="20" x2="150" y2="28" stroke="#facc15" stroke-width="2" />
    <text x="210" y="18" fill="#64748b" font-family="system-ui, monospace" font-size="9">1.2</text>
    <text x="260" y="18" fill="#64748b" font-family="system-ui, monospace" font-size="9">1.3</text>
    <text x="310" y="18" fill="#64748b" font-family="system-ui, monospace" font-size="9">1.4</text>

    <!-- Bar 2: x = 360 -->
    <line x1="360" y1="0" x2="360" y2="28" stroke="#facc15" stroke-width="1.5" />
    <text x="365" y="18" fill="#facc15" font-family="system-ui, monospace" font-size="10.5" font-weight="800">BAR 2</text>
    <text x="420" y="18" fill="#64748b" font-family="system-ui, monospace" font-size="9">2.2</text>
    <text x="470" y="18" fill="#64748b" font-family="system-ui, monospace" font-size="9">2.3</text>
    <text x="520" y="18" fill="#64748b" font-family="system-ui, monospace" font-size="9">2.4</text>

    <!-- Bar 3: x = 570 -->
    <line x1="570" y1="0" x2="570" y2="28" stroke="#facc15" stroke-width="1.5" />
    <text x="575" y="18" fill="#facc15" font-family="system-ui, monospace" font-size="10.5" font-weight="800">BAR 3</text>
    <text x="630" y="18" fill="#64748b" font-family="system-ui, monospace" font-size="9">3.2</text>

    <!-- Vertical Bar Grid Lines Down Across Tracks -->
    <!-- Bar 1 Downbeat (150) -->
    <line x1="150" y1="28" x2="150" y2="206" stroke="#facc15" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="210" y1="28" x2="210" y2="206" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.5" />
    <line x1="260" y1="28" x2="260" y2="206" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.5" />
    <line x1="310" y1="28" x2="310" y2="206" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.5" />

    <!-- Bar 2 Downbeat (360) -->
    <line x1="360" y1="28" x2="360" y2="206" stroke="#facc15" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="420" y1="28" x2="420" y2="206" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.5" />
    <line x1="470" y1="28" x2="470" y2="206" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.5" />
    <line x1="520" y1="28" x2="520" y2="206" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.5" />

    <!-- Bar 3 Downbeat (570) -->
    <line x1="570" y1="28" x2="570" y2="206" stroke="#facc15" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="630" y1="28" x2="630" y2="206" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.5" />

    <!-- ==================== TRACK 1: CLICK TRACK (METRONOME) ==================== -->
    <!-- Track 1 Header (y = 28 to 86) -->
    <rect x="0" y="28" width="140" height="58" fill="#131c31" />
    <line x1="0" y1="86" x2="672" y2="86" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="57" r="6" fill="#facc15" />
    <text x="30" y="53" fill="#facc15" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">CLICK TRACK</text>
    <text x="30" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Metronome Pulse</text>

    <!-- Click Track Pulses (Accented Downbeat 1 in Gold, Beats 2,3,4 in Cyan) -->
    <!-- Bar 1: 150 (Downbeat), 210, 260, 310 -->
    <!-- Bar 1.1 (High Pitch Accent) -->
    <line x1="150" y1="78" x2="150" y2="40" stroke="#facc15" stroke-width="4" stroke-linecap="round" filter="url(#glow-gold)" />
    <circle cx="150" cy="38" r="3" fill="#fef08a" />
    <text x="150" y="34" fill="#facc15" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">ACCENT</text>

    <!-- Bar 1.2, 1.3, 1.4 (Regular click) -->
    <line x1="210" y1="78" x2="210" y2="48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="260" y1="78" x2="260" y2="48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="310" y1="78" x2="310" y2="48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Bar 2: 360 (Accent), 420, 470, 520 -->
    <line x1="360" y1="78" x2="360" y2="40" stroke="#facc15" stroke-width="4" stroke-linecap="round" filter="url(#glow-gold)" />
    <circle cx="360" cy="38" r="3" fill="#fef08a" />
    <text x="360" y="34" fill="#facc15" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">ACCENT</text>

    <line x1="420" y1="78" x2="420" y2="48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="470" y1="78" x2="470" y2="48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="520" y1="78" x2="520" y2="48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Bar 3: 570 (Accent), 630 -->
    <line x1="570" y1="78" x2="570" y2="40" stroke="#facc15" stroke-width="4" stroke-linecap="round" filter="url(#glow-gold)" />
    <circle cx="570" cy="38" r="3" fill="#fef08a" />
    <line x1="630" y1="78" x2="630" y2="48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Constant BPM Indicator -->
    <rect x="420" y="34" width="130" height="18" rx="4" fill="#0f172a" stroke="#facc15" stroke-width="0.8" />
    <text x="485" y="47" fill="#facc15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">CONSTANT INTERVAL (500 ms)</text>

    <!-- ==================== TRACK 2: DRUM TRACK (TAKE 1) ==================== -->
    <rect x="0" y="86" width="140" height="58" fill="#0f172a" />
    <line x1="0" y1="144" x2="672" y2="144" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="115" r="6" fill="#38bdf8" />
    <text x="30" y="111" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">DRUMS (TAKE 1)</text>
    <text x="30" y="124" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Locked to Grid</text>

    <!-- Drum Waveform Elements perfectly aligning with grid -->
    <!-- Kick on 1 (150) -->
    <path d="M 148 115 Q 150 94 152 115 Q 154 136 156 115 L 180 115" stroke="#38bdf8" stroke-width="2" fill="none" />
    <!-- Snare on 2 (210) -->
    <path d="M 207 115 Q 210 90 213 115 Q 216 138 220 115 L 245 115" stroke="#38bdf8" stroke-width="2.5" fill="none" />
    <!-- Kick on 3 (260) -->
    <path d="M 258 115 Q 260 94 262 115 Q 264 136 266 115 L 295 115" stroke="#38bdf8" stroke-width="2" fill="none" />
    <!-- Snare on 4 (310) -->
    <path d="M 307 115 Q 310 90 313 115 Q 316 138 320 115 L 345 115" stroke="#38bdf8" stroke-width="2.5" fill="none" />

    <!-- Bar 2 Drums -->
    <path d="M 358 115 Q 360 94 362 115 Q 364 136 366 115 L 405 115" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M 417 115 Q 420 90 423 115 Q 426 138 430 115 L 455 115" stroke="#38bdf8" stroke-width="2.5" fill="none" />
    <path d="M 468 115 Q 470 94 472 115 Q 474 136 476 115 L 505 115" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M 517 115 Q 520 90 523 115 Q 526 138 530 115 L 555 115" stroke="#38bdf8" stroke-width="2.5" fill="none" />

    <!-- Bar 3 Drums -->
    <path d="M 568 115 Q 570 94 572 115 Q 574 136 576 115 L 615 115" stroke="#38bdf8" stroke-width="2" fill="none" />
    <path d="M 627 115 Q 630 90 633 115 Q 636 138 640 115 L 665 115" stroke="#38bdf8" stroke-width="2.5" fill="none" />

    <!-- ==================== TRACK 3: OVERDUB TAKE 2 (GUITAR / VOCAL) ==================== -->
    <rect x="0" y="144" width="140" height="62" fill="#131c31" />
    <circle cx="16" cy="175" r="6" fill="#34d399" />
    <text x="30" y="171" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">VOCALS (TAKE 2)</text>
    <text x="30" y="184" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Overdub Synced</text>

    <!-- Seamless comping slice lines -->
    <rect x="150" y="152" width="206" height="46" rx="4" fill="#065f46" fill-opacity="0.3" stroke="#34d399" stroke-width="1.2" />
    <text x="253" y="178" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Verse (Take 2 Comp) — Perfectly In Time</text>

    <rect x="360" y="152" width="206" height="46" rx="4" fill="#065f46" fill-opacity="0.45" stroke="#34d399" stroke-width="1.5" />
    <text x="463" y="178" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Chorus (Take 4 Comp) — Zero Tempo Drift</text>

    <!-- Splice Marker between bars -->
    <line x1="360" y1="148" x2="360" y2="202" stroke="#facc15" stroke-width="2" />
    <rect x="345" y="190" width="30" height="14" rx="2" fill="#854d0e" />
    <text x="360" y="200" fill="#fef08a" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">SPLICE</text>
  </g>

  <!-- ==================== BOTTOM: 3 EDUCATIONAL EXPLANATION CARDS ==================== -->
  <g transform="translate(24, 280)">
    <!-- CARD 1: CONSISTENT TEMPO (CORRECT ANSWER HIGHLIGHT) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#0c2340" stroke="#38bdf8" stroke-width="1.8" />
      <rect x="10" y="10" width="95" height="18" rx="4" fill="#0284c7" />
      <text x="57" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CORRECT ANSWER</text>
      
      <text x="12" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Consistent Tempo</text>
      <text x="12" y="64" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">The primary goal of a click track:</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Prevents musicians from rushing</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">or dragging, maintaining an</text>
      <text x="12" y="106" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">unwavering, steady BPM speed.</text>
    </g>

    <!-- CARD 2: MULTI-TAKE COMPING & EDITING -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="105" height="18" rx="4" fill="#065f46" stroke="#34d399" stroke-width="0.8" />
      <text x="62" y="23" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">EDITING EFFICIENCY</text>
      
      <text x="12" y="46" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Flawless Comping</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Because all takes lock to the grid:</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Splice parts across different takes</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Copy/paste Chorus 1 into Chorus 2</text>
      <text x="12" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Zero tempo clashes or drifting</text>
    </g>

    <!-- CARD 3: MIDI & FX SYNC -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="124" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <rect x="10" y="10" width="105" height="18" rx="4" fill="#854d0e" stroke="#facc15" stroke-width="0.8" />
      <text x="62" y="23" fill="#fef08a" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">PRODUCTION SYNC</text>
      
      <text x="12" y="46" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Tempo-Locked Effects</text>
      <text x="12" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Aligns with DAW automation:</text>
      <text x="12" y="78" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• 1/4 and 1/8 note rhythmic delays</text>
      <text x="12" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• LFO modulation &amp; arpeggiators</text>
      <text x="12" y="106" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">• Audio quantize &amp; drum loops</text>
    </g>
  </g>
</svg>