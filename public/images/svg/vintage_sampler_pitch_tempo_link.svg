<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <rect width="720" height="400" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="32" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">HARDWARE SAMPLERS: PITCH &amp; SPEED COUPLING</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Akai S950 &amp; E-mu SP-1200: Why Pitching Down Slows Playback Speed</text>

  <!-- Comparison Blocks -->
  <g transform="translate(40, 75)">
    <rect width="640" height="225" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />

    <!-- 1. Original 100% Speed -->
    <g transform="translate(30, 25)">
      <rect width="260" height="25" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1" />
      <text x="130" y="17" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">ORIGINAL SAMPLE: 120 BPM (1.0 sec)</text>
      <!-- Waveform -->
      <path d="M 0 50 Q 30 30 60 50 T 120 50 T 180 50 T 240 50" fill="none" stroke="#38bdf8" stroke-width="2.5" />
      <line x1="0" y1="50" x2="260" y2="50" stroke="#334155" stroke-width="1" />
    </g>

    <!-- 2. Pitched Down -3 Semitones (Lengthens) -->
    <g transform="translate(30, 105)">
      <rect width="360" height="25" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="180" y="17" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">PITCHED DOWN (-3 ST): 101 BPM (1.19 sec) — SLOWER &amp; DEEPER</text>
      <!-- Stretched Waveform -->
      <path d="M 0 50 Q 45 25 90 50 T 180 50 T 270 50 T 360 50" fill="none" stroke="#f59e0b" stroke-width="2.5" />
      <line x1="0" y1="50" x2="360" y2="50" stroke="#334155" stroke-width="1" />
    </g>

    <!-- Detail Box -->
    <rect x="420" y="30" width="190" height="150" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="515" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">TAPE &amp; RAM SAMPLE RULE</text>
    <text x="435" y="75" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">• Pitching Down = Slows Tempo</text>
    <text x="435" y="95" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">• Pitching Up = Fast Tempo</text>
    <text x="435" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">• High-frequency loss occurs</text>
    <text x="435" y="135" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">• Distinctive 12-bit grit</text>
    <text x="435" y="155" fill="#f87171" font-family="system-ui, sans-serif" font-size="8" font-weight="700">No VP-9000 VariPhrase in 1990s</text>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 315)">
    <rect width="640" height="65" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EDEXCEL EXAM PRINCIPLE: TIMESTRETCH VS SAMPLE PITCH</text>
    <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Modern DAWs allow elastic audio time-stretching independently of pitch. Vintage hardware samplers (Akai, E-mu) directly tied playback speed to pitch—slowing down the sample when triggered lower on the keyboard.</text>
  </g>
</svg>