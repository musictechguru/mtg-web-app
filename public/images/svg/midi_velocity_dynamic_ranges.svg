<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-vel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Velocity Spectrum Bar -->
    <linearGradient id="vel-spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="88%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <filter id="glow-badge-vel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-target-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad-vel)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow-badge-vel)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">MIDI VELOCITY DYNAMICS &amp; MUSICAL PERFORMANCE TIERS</text>
    <rect x="526" y="6" width="134" height="22" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="0.8" />
    <text x="593" y="21" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">RANGE: 1 TO 127</text>
  </g>

  <!-- ==================== MAIN GRAPHIC: DYNAMIC TIERS & TARGET RANGE ==================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="672" height="248" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- CONTINUOUS VELOCITY SPECTRUM BAR -->
    <g transform="translate(20, 16)">
      <text x="0" y="12" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">VELOCITY CONTINUUM (0 TO 127)</text>
      
      <!-- Spectrum Bar -->
      <rect x="0" y="22" width="632" height="14" rx="4" fill="url(#vel-spectrum)" />
      
      <!-- Scale Tick Labels -->
      <g transform="translate(0, 48)">
        <text x="4" y="0" fill="#64748b" font-family="monospace" font-size="9.5">1 (Min)</text>
        <text x="140" y="0" fill="#38bdf8" font-family="monospace" font-size="9.5" font-weight="700">30 (pp)</text>
        <text x="316" y="0" fill="#10b981" font-family="monospace" font-size="9.5" font-weight="700">64 (mf)</text>
        <text x="474" y="0" fill="#f59e0b" font-family="monospace" font-size="9.5">96 (ff)</text>
        <text x="612" y="0" fill="#ef4444" font-family="monospace" font-size="9.5" font-weight="800" text-anchor="end">127 (Max)</text>
      </g>
    </g>

    <!-- DYNAMIC TIERS TABLE / CARDS -->
    <g transform="translate(20, 78)">
      <!-- TIER 1: DELICATE / VERY SOFT (THE QUIZ TARGET: 15–45) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="230" height="154" rx="8" fill="#082238" stroke="#38bdf8" stroke-width="2" filter="url(#glow-target-soft)" />
        
        <!-- Target Badge -->
        <rect x="10" y="10" width="210" height="24" rx="4" fill="#0284c7" />
        <text x="115" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">&#x2605; QUIZ TARGET: SOFT / DELICATE</text>

        <!-- Velocity Values -->
        <text x="16" y="56" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="900">Pianissimo (pp): 1 – 31</text>
        <text x="16" y="72" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Piano (p): 32 – 47</text>

        <rect x="12" y="82" width="206" height="60" rx="5" fill="#0c1729" stroke="#1e3a5f" />
        <text x="20" y="98" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">Musical Character:</text>
        <text x="20" y="113" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9">&#x2022; Delicate, gentle key strike</text>
        <text x="20" y="126" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9">&#x2022; Low acoustic volume</text>
        <text x="20" y="138" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="9">&#x2022; Darker timbre (low filter cutoff)</text>
      </g>

      <!-- TIER 2: MEDIUM / MODERATE (48–79) -->
      <g transform="translate(242, 0)">
        <rect x="0" y="0" width="190" height="154" rx="8" fill="#13241b" stroke="#10b981" stroke-width="1.2" />
        
        <rect x="10" y="10" width="170" height="24" rx="4" fill="#065f46" />
        <text x="95" y="26" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">MEDIUM / MODERATE</text>

        <text x="16" y="56" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">Mezzo-Piano: 48 – 63</text>
        <text x="16" y="72" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">Mezzo-Forte: 64 – 79</text>

        <rect x="10" y="82" width="170" height="60" rx="5" fill="#071a13" stroke="#047857" />
        <text x="18" y="98" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">Musical Character:</text>
        <text x="18" y="113" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9">&#x2022; Natural, relaxed playing</text>
        <text x="18" y="126" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9">&#x2022; Baseline rhythmic groove</text>
        <text x="18" y="138" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9">&#x2022; Standard tonal brightness</text>
      </g>

      <!-- TIER 3: FORTE / AGGRESSIVE (80–127) -->
      <g transform="translate(442, 0)">
        <rect x="0" y="0" width="190" height="154" rx="8" fill="#241113" stroke="#ef4444" stroke-width="1.2" />
        
        <rect x="10" y="10" width="170" height="24" rx="4" fill="#7f1d1d" />
        <text x="95" y="26" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">LOUD / HARD STRIKE</text>

        <text x="16" y="56" fill="#f87171" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">Forte (f): 80 – 95</text>
        <text x="16" y="72" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">Fortissimo (ff): 96 – 127</text>

        <rect x="10" y="82" width="170" height="60" rx="5" fill="#1b0a0d" stroke="#991b1b" />
        <text x="18" y="98" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">Musical Character:</text>
        <text x="18" y="113" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9">&#x2022; Aggressive key strike</text>
        <text x="18" y="126" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9">&#x2022; Peak acoustic energy</text>
        <text x="18" y="138" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="9">&#x2022; Maximum filter brightness</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM SPECIFICATION CARDS ==================== -->
  <g transform="translate(24, 320)">
    <!-- Card 1: What Velocity Measures -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="102" height="18" rx="4" fill="#1f2937" />
      <text x="63" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">PHYSICAL ACTION</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Speed of Key Press</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Measures HOW FAST key is struck,</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">NOT continuous finger pressure (aftertouch)</text>
    </g>

    <!-- Card 2: Dual Synth Parameter Impact -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="112" height="18" rx="4" fill="#1f2937" />
      <text x="68" y="22" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">VOLUME + TIMBRE</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">VCA Level + Filter Cutoff</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Hard strikes open the filter (brighter)</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Soft strikes keep the tone mellow and warm</text>
    </g>

    <!-- Card 3: Exam Target Range -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#22c55e" stroke-width="1.2" />
      <rect x="12" y="10" width="104" height="18" rx="4" fill="#14532d" />
      <text x="64" y="22" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x2713; ACCEPTED RANGE</text>
      <text x="12" y="44" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Target ~30 (Range: 15–45)</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Pianissimo / piano delicate touch</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Allows expressive nuance without clipping</text>
    </g>
  </g>
</svg>
