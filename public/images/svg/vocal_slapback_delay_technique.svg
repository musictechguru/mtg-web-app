<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-slap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="glow-badge-slap" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-slap-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad-slap)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#eab308" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#eab308" filter="url(#glow-badge-slap)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">VOCAL PROCESSING: SLAPBACK DELAY ARCHITECTURE (70–120ms SINGLE ECHO)</text>
    <rect x="526" y="6" width="134" height="22" rx="4" fill="#713f12" fill-opacity="0.4" stroke="#eab308" stroke-width="0.8" />
    <text x="593" y="21" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">VERSION B: SOFT CELL</text>
  </g>

  <!-- ==================== MAIN GRAPHIC: SIGNAL FLOW & TIMELINE ==================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="672" height="248" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- 1. SIGNAL FLOW DIAGRAM (TOP) -->
    <g transform="translate(20, 16)">
      <!-- Dry Vocal Source -->
      <rect x="0" y="0" width="130" height="48" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="65" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">LEAD VOCAL</text>
      <text x="65" y="36" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Marc Almond</text>

      <!-- Dry Path Direct Arrow -->
      <path d="M 130 16 L 460 16" stroke="#38bdf8" stroke-width="2" />
      <text x="280" y="10" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">DIRECT DRY SIGNAL (0 ms - Upfront)</text>

      <!-- Split to Delay Line -->
      <path d="M 170 16 L 170 56 L 210 56" stroke="#eab308" stroke-width="2" />

      <!-- Slapback Delay Processor Unit -->
      <g transform="translate(210, 36)">
        <rect x="0" y="0" width="180" height="42" rx="6" fill="#1e1b10" stroke="#eab308" stroke-width="1.5" />
        <text x="90" y="18" fill="#fde047" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">SLAPBACK DELAY UNIT</text>
        <text x="90" y="32" fill="#fef08a" font-family="monospace" font-size="8.5" text-anchor="middle">TIME: 90ms • FEEDBACK: 0%</text>
      </g>

      <!-- Delay output arrow -->
      <path d="M 390 56 L 430 56 L 460 32" stroke="#eab308" stroke-width="2" />

      <!-- Summer / Mix Bus -->
      <g transform="translate(460, 6)">
        <rect x="0" y="0" width="170" height="48" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
        <text x="85" y="20" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">STEREO VOCAL BUS</text>
        <text x="85" y="36" fill="#86efac" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Wide, upfront &amp; rhythmic</text>
      </g>
    </g>

    <line x1="20" y1="104" x2="652" y2="104" stroke="#1e293b" stroke-width="1.5" />

    <!-- 2. TIME-DOMAIN IMPULSE RESPONSE (BOTTOM) -->
    <g transform="translate(20, 114)">
      <text x="0" y="14" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">TIME-DOMAIN RESPONSE: DIRECT TRANSIENT vs SINGLE DISCRETE SLAP</text>

      <!-- Waveform box -->
      <g transform="translate(0, 24)">
        <rect x="0" y="0" width="632" height="88" rx="6" fill="#070c18" stroke="#1e293b" />
        
        <!-- Timeline axis zero line -->
        <line x1="20" y1="56" x2="612" y2="56" stroke="#1e293b" stroke-width="1.5" />

        <!-- 1. Direct Vocal Spike at t = 0ms -->
        <path d="M 60 56 L 68 14 L 76 56" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
        <circle cx="68" cy="14" r="4" fill="#ffffff" />
        <text x="68" y="74" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">DIRECT VOCAL</text>
        <text x="68" y="85" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">0 ms (100% Vol)</text>

        <!-- Time gap indicator -->
        <line x1="76" y1="36" x2="210" y2="36" stroke="#eab308" stroke-width="1.2" stroke-dasharray="3 3" />
        <text x="143" y="30" fill="#fde047" font-family="monospace" font-size="9" font-weight="800" text-anchor="middle">Δt = 90 ms Gap</text>

        <!-- 2. Slapback Repeat Spike at t = 90ms -->
        <path d="M 210 56 L 217 28 L 224 56" fill="none" stroke="#eab308" stroke-width="3" stroke-linecap="round" filter="url(#glow-slap-yellow)" />
        <circle cx="217" cy="28" r="4" fill="#fef08a" />
        <text x="217" y="74" fill="#fde047" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">SINGLE SLAP</text>
        <text x="217" y="85" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">90 ms (~60% Vol)</text>

        <!-- Silence following (Zero Feedback) -->
        <line x1="230" y1="56" x2="600" y2="56" stroke="#22c55e" stroke-width="2" />
        <rect x="290" y="24" width="280" height="26" rx="4" fill="#0e1f16" stroke="#22c55e" stroke-width="0.8" />
        <text x="430" y="41" fill="#4ade80" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x2713; ZERO FEEDBACK = NO WASH / NO CLUTTER</text>
      </g>
    </g>
  </g>

  <!-- ==================== BOTTOM SPECIFICATION CARDS ==================== -->
  <g transform="translate(24, 320)">
    <!-- Card 1: Correct Answer -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#eab308" stroke-width="1.2" />
      <rect x="12" y="10" width="104" height="18" rx="4" fill="#713f12" />
      <text x="64" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x2713; CORRECT ANSWER</text>
      <text x="12" y="44" fill="#fde047" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Version B (Soft Cell)</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Marc Almond's vocals feature</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">prominent slapback echo effect</text>
    </g>

    <!-- Card 2: Technical Function -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="100" height="18" rx="4" fill="#1f2937" />
      <text x="62" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">DELAY SPECS</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">70 – 120ms Single Echo</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Feedback is kept at 0% (single repeat)</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Avoids rhythmic mush on busy dance beats</text>
    </g>

    <!-- Card 3: Why Slapback? -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="112" height="18" rx="4" fill="#1f2937" />
      <text x="68" y="22" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">MIX ADVANTAGE</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Depth Without Wash</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Reverb pushes vocals into background;</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">slapback keeps vocals direct &amp; upfront</text>
    </g>
  </g>
</svg>
