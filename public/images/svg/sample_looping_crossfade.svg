<svg width="720" height="400" viewBox="0 0 720 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loop-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02" />
    </linearGradient>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" rx="14" fill="#0f172a" />
  <rect x="1" y="1" width="718" height="398" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Header Badge -->
  <rect x="180" y="16" width="360" height="30" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
  <text x="360" y="36" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">SAMPLER LOOP POINTS &amp; CROSSFADE SMOOTHING</text>

  <!-- MAIN WAVEFORM DISPLAY -->
  <g transform="translate(40, 62)">
    <rect width="640" height="230" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />

    <!-- Center 0-crossing axis line -->
    <line x1="20" y1="115" x2="620" y2="115" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
    <text x="25" y="112" fill="#64748b" font-family="monospace" font-size="9">0 Amplitude (Zero Crossing)</text>

    <!-- Sustain Loop Region Shading (x: 220 to 520) -->
    <rect x="220" y="20" width="300" height="190" fill="url(#loop-grad)" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" />
    <text x="370" y="42" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SUSTAIN LOOP REGION (CYCLES CONTINUOUSLY)</text>

    <!-- Waveform Representation -->
    <!-- Attack transient (0 to 220) -->
    <path d="M 30 115 Q 50 20 70 115 T 110 115 T 150 115 T 190 115 T 220 115" stroke="#38bdf8" stroke-width="2" fill="none" />
    <text x="120" y="65" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">One-Shot Attack</text>

    <!-- Looping body wave (220 to 520) -->
    <path d="M 220 115 Q 245 60 270 115 T 320 115 T 370 115 T 420 115 T 470 115 T 520 115" stroke="#10b981" stroke-width="2.5" fill="none" filter="url(#glow-green)" />

    <!-- Loop Start Marker (x: 220) -->
    <line x1="220" y1="15" x2="220" y2="215" stroke="#10b981" stroke-width="3" />
    <polygon points="214,15 226,15 220,25" fill="#10b981" />
    <rect x="160" y="25" width="110" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="215" y="40" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">LOOP START</text>

    <!-- Loop End Marker (x: 520) -->
    <line x1="520" y1="15" x2="520" y2="215" stroke="#ef4444" stroke-width="3" />
    <polygon points="514,15 526,15 520,25" fill="#ef4444" />
    <rect x="470" y="25" width="100" height="22" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="520" y="40" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">LOOP END</text>

    <!-- Cycle Back Arrow from Loop End to Loop Start -->
    <path d="M 520 185 C 470 215, 270 215, 225 185" stroke="#facc15" stroke-width="2.5" stroke-dasharray="4 3" fill="none" />
    <polygon points="225,185 233,193 235,181" fill="#facc15" />
    <text x="370" y="202" fill="#facc15" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Seamless Cycle Loop (Sustain)</text>

    <!-- Release Tail (520 to 610) -->
    <path d="M 520 115 Q 545 80 570 115 T 610 115" stroke="#94a3b8" stroke-width="1.8" fill="none" stroke-dasharray="3 3" />
    <text x="575" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Release Tail</text>
  </g>

  <!-- Bottom Educational Summary Box -->
  <g transform="translate(40, 308)">
    <rect width="640" height="74" rx="8" fill="#182234" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="37" r="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2" />
    <text x="28" y="42" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">⇄</text>
    <text x="54" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Sampler Loop Points &amp; Zero-Crossing Crossfade:</text>
    <text x="54" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Setting Loop Start and Loop End allows a short recorded sample (like strings or flute) to sustain indefinitely as long as a key is held. Placing markers at zero-amplitude points with a short crossfade prevents audible clicks and pops at the loop boundary.</text>
  </g>
</svg>
