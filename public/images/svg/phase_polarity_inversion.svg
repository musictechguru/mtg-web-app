<svg width="720" height="400" viewBox="0 0 720 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" rx="14" fill="#0f172a" />
  <rect x="1" y="1" width="718" height="398" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Header Badge -->
  <rect x="180" y="16" width="360" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
  <text x="360" y="36" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">MIXER POLARITY INVERSION (PHASE REVERSE Ø)</text>

  <!-- Left Column: IN PHASE (0° Offset) -->
  <g transform="translate(24, 62)">
    <rect width="320" height="240" rx="10" fill="#182234" stroke="#10b981" stroke-width="1" />
    <text x="160" y="26" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">IN PHASE (NORMAL POLARITY)</text>
    <text x="160" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Microphones in Acoustic Alignment</text>

    <!-- Scope Box -->
    <rect x="15" y="55" width="290" height="115" rx="6" fill="#0b1120" stroke="#1e293b" />
    <line x1="20" y1="112" x2="300" y2="112" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Wave 1 (Top Mic, Blue) -->
    <path d="M 25 112 Q 60 70 95 112 T 165 112 T 235 112 T 295 112" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />
    <!-- Wave 2 (Bottom Mic In-Phase, Cyan) -->
    <path d="M 25 112 Q 60 72 95 112 T 165 112 T 235 112 T 295 112" stroke="#34d399" stroke-width="2" fill="none" opacity="0.8" stroke-dasharray="3 2" />

    <!-- Result: Constructive Sum (+6dB) -->
    <text x="25" y="75" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Mic 1</text>
    <text x="25" y="88" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Mic 2</text>
    <rect x="190" y="65" width="105" height="20" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
    <text x="242" y="79" fill="#10b981" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">SUM: +6 dB BOOST</text>

    <!-- Description -->
    <rect x="15" y="180" width="290" height="48" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="25" y="198" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">• Peaks and troughs reinforce each other</text>
    <text x="25" y="214" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">• Full bottom end, punch, and clarity preserved</text>
  </g>

  <!-- Right Column: OUT OF PHASE (180° Inverted) -->
  <g transform="translate(376, 62)">
    <rect width="320" height="240" rx="10" fill="#182234" stroke="#ef4444" stroke-width="1" />
    <text x="160" y="26" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">180° OUT OF PHASE (CANCELLATION)</text>
    <text x="160" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Top vs Bottom Snare Mics (Opposing Diaphragms)</text>

    <!-- Scope Box -->
    <rect x="15" y="55" width="290" height="115" rx="6" fill="#0b1120" stroke="#1e293b" />
    <line x1="20" y1="112" x2="300" y2="112" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Wave 1 (Top Mic, Blue) -->
    <path d="M 25 112 Q 60 70 95 112 T 165 112 T 235 112 T 295 112" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />
    <!-- Wave 2 Inverted (Bottom Mic, Red) -->
    <path d="M 25 112 Q 60 154 95 112 T 165 112 T 235 112 T 295 112" stroke="#f43f5e" stroke-width="2" fill="none" opacity="0.8" />

    <!-- Result: Flat Line (Silence) -->
    <line x1="25" y1="112" x2="295" y2="112" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 4" />
    <rect x="180" y="65" width="115" height="20" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="0.8" />
    <text x="237" y="79" fill="#f87171" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">SUM: COMPLETE NULL</text>

    <!-- Description -->
    <rect x="15" y="180" width="290" height="48" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="25" y="198" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">• Positive peak cancels exactly with negative trough</text>
    <text x="25" y="214" fill="#f87171" font-family="system-ui, sans-serif" font-size="9.5">• Pressing Ø inverts polarity, restoring low end!</text>
  </g>

  <!-- Bottom Educational Summary Box -->
  <g transform="translate(24, 316)">
    <rect width="672" height="68" rx="8" fill="#182234" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="34" r="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="28" y="39" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Ø</text>
    <text x="54" y="28" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">The Console Phase Reverse Switch (Polarity Flip):</text>
    <text x="54" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Essential when multi-miking a single source from opposite sides (e.g. Snare Top &amp; Snare Bottom, or Bass DI &amp; Amp Mic). Inverting the bottom mic by 180° prevents destructive bass cancellation.</text>
  </g>
</svg>
