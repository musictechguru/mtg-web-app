<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="960" height="620" fill="#0b1120"/>

  <!-- Title Header -->
  <text x="480" y="44" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="1.5">GRANULAR SYNTHESIS</text>
  <text x="480" y="70" fill="#94a3b8" font-size="13.5" text-anchor="middle">Splitting recorded audio into micro-acoustic 'grains' to decouple time and pitch</text>

  <!-- Step 1: Original Audio Sample -->
  <g transform="translate(60, 95)">
    <rect width="840" height="110" rx="10" fill="#131e36" stroke="#334155" stroke-width="1.2"/>
    <text x="30" y="32" fill="#38bdf8" font-size="13" font-weight="bold">1. SOURCE AUDIO SAMPLE (Continuous Recording)</text>

    <!-- Waveform block -->
    <rect x="30" y="45" width="780" height="48" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <!-- Audio Waveform lines -->
    <path d="M 40 69 Q 60 48 80 69 T 120 69 T 160 69 T 200 69 T 240 69 T 280 69 T 320 69 T 360 69 T 400 69 T 440 69 T 480 69 T 520 69 T 560 69 T 600 69 T 640 69 T 680 69 T 720 69 T 760 69 T 800 69" fill="none" stroke="#64748b" stroke-width="2"/>

    <!-- Micro-Grain Slices Highlighted -->
    <g transform="translate(340, 45)">
      <rect width="18" height="48" fill="#38bdf8" opacity="0.3"/>
      <rect x="22" width="18" height="48" fill="#a855f7" opacity="0.3"/>
      <rect x="44" width="18" height="48" fill="#10b981" opacity="0.3"/>
      <rect x="66" width="18" height="48" fill="#f59e0b" opacity="0.3"/>
      <rect x="88" width="18" height="48" fill="#ef4444" opacity="0.3"/>
      <text x="53" y="30" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">10–50 ms Grains</text>
    </g>
  </g>

  <!-- Step 2: Micro-Grain Extraction -->
  <g transform="translate(60, 220)">
    <rect width="840" height="110" rx="10" fill="#131e36" stroke="#334155" stroke-width="1.2"/>
    <text x="30" y="30" fill="#a855f7" font-size="13" font-weight="bold">2. MICRO-ACOUSTIC GRAINS (Enveloped Tiny Fragments)</text>

    <!-- Individual Grains with Bell/Hanning Envelopes -->
    <!-- Grain 1 -->
    <g transform="translate(50, 42)">
      <rect width="120" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <path d="M 10 38 C 30 10, 90 10, 110 38" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="60" y="46" fill="#94a3b8" font-size="9.5" text-anchor="middle">Grain 1 (20ms)</text>
    </g>

    <!-- Grain 2 -->
    <g transform="translate(205, 42)">
      <rect width="120" height="52" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
      <path d="M 10 38 C 30 10, 90 10, 110 38" fill="none" stroke="#a855f7" stroke-width="2.5"/>
      <text x="60" y="46" fill="#94a3b8" font-size="9.5" text-anchor="middle">Grain 2 (30ms)</text>
    </g>

    <!-- Grain 3 -->
    <g transform="translate(360, 42)">
      <rect width="120" height="52" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
      <path d="M 10 38 C 30 10, 90 10, 110 38" fill="none" stroke="#10b981" stroke-width="2.5"/>
      <text x="60" y="46" fill="#94a3b8" font-size="9.5" text-anchor="middle">Grain 3 (15ms)</text>
    </g>

    <!-- Grain 4 -->
    <g transform="translate(515, 42)">
      <rect width="120" height="52" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
      <path d="M 10 38 C 30 10, 90 10, 110 38" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
      <text x="60" y="46" fill="#94a3b8" font-size="9.5" text-anchor="middle">Grain 4 (25ms)</text>
    </g>

    <!-- Grain 5 -->
    <g transform="translate(670, 42)">
      <rect width="120" height="52" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
      <path d="M 10 38 C 30 10, 90 10, 110 38" fill="none" stroke="#ef4444" stroke-width="2.5"/>
      <text x="60" y="46" fill="#94a3b8" font-size="9.5" text-anchor="middle">Grain 5 (20ms)</text>
    </g>
  </g>

  <!-- Step 3: Reorganized Granular Cloud / Time-Stretching -->
  <g transform="translate(60, 345)">
    <rect width="840" height="120" rx="10" fill="#131e36" stroke="#10b981" stroke-width="1.5"/>
    <text x="30" y="32" fill="#34d399" font-size="13" font-weight="bold">3. REORGANIZED GRANULAR CLOUD (Playback Manipulation)</text>

    <!-- Overlapping Cloud Representation -->
    <g transform="translate(30, 45)">
      <!-- Cloud cluster -->
      <path d="M 0 35 C 20 5, 50 5, 70 35" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
      <path d="M 25 35 C 45 5, 75 5, 95 35" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.8"/>
      <path d="M 50 35 C 70 5, 100 5, 120 35" fill="none" stroke="#10b981" stroke-width="2" opacity="0.8"/>
      <path d="M 75 35 C 95 5, 125 5, 145 35" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
      <path d="M 100 35 C 120 5, 150 5, 170 35" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
      <path d="M 125 35 C 145 5, 175 5, 195 35" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
      <path d="M 150 35 C 170 5, 200 5, 220 35" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.8"/>

      <text x="110" y="55" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Infinite Overlapping Density</text>
    </g>

    <!-- Capabilities callout box -->
    <g transform="translate(300, 38)">
      <rect width="510" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" fill="#34d399" font-size="12" font-weight="bold">Key Musical Capability: Extreme Time-Stretching Without Pitch Change</text>
      <text x="15" y="44" fill="#cbd5e1" font-size="11">Grains can be frozen or played slowly across time while maintaining original pitch,</text>
      <text x="15" y="58" fill="#94a3b8" font-size="10.5">turning a 1-second vocal syllable into a 10-minute ambient texture or evolving pad.</text>
    </g>
  </g>

  <!-- Bottom Core Takeaway -->
  <g transform="translate(60, 480)">
    <rect width="840" height="110" rx="10" fill="#131e36" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="30" fill="#38bdf8" font-size="14" font-weight="bold">Core Specification Rule: Independence of Time and Pitch</text>
    <text x="25" y="56" fill="#cbd5e1" font-size="12.5">Traditional tape or sampler playback links pitch to speed (playing slower lowers pitch; faster raises pitch).</text>
    <text x="25" y="80" fill="#cbd5e1" font-size="12.5"><tspan fill="#f59e0b" font-weight="bold">Granular synthesis divorces time from pitch</tspan> by repeating or pitch-shifting individual micro-grains independently.</text>
  </g>
</svg>
