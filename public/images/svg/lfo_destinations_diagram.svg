<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Background -->
  <rect width="960" height="640" fill="#0b1120"/>

  <!-- Title & Header -->
  <text x="480" y="44" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="1.5">LOW FREQUENCY OSCILLATOR (LFO)</text>
  <text x="480" y="70" fill="#94a3b8" font-size="13.5" text-anchor="middle">A sub-audio control signal used to cyclically modulate synth parameters</text>

  <!-- Left Card: Sub-Audio Frequency Range & Controls -->
  <g transform="translate(40, 95)">
    <rect width="425" height="240" rx="10" fill="#131e36" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="18" y="16" width="389" height="32" rx="6" fill="#1e293b"/>
    <text x="212" y="37" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">SUB-AUDIO FREQUENCY RANGE (0.1 Hz – 20 Hz)</text>

    <!-- Sub-audio Waveform (Slow Sine) -->
    <line x1="30" y1="115" x2="395" y2="115" stroke="#334155" stroke-width="1"/>
    <path d="M 30 115 C 75 45, 120 45, 165 115 C 210 185, 255 185, 300 115 C 345 45, 365 75, 395 115" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Rate / Depth Annotations with clean spacing -->
    <text x="28" y="180" fill="#f8fafc" font-size="12.5" font-weight="bold">Rate (Speed):</text>
    <text x="125" y="180" fill="#94a3b8" font-size="12">Frequency in Hz or tempo-synced subdivisions</text>

    <text x="28" y="210" fill="#f8fafc" font-size="12.5" font-weight="bold">Depth (Amount):</text>
    <text x="140" y="210" fill="#94a3b8" font-size="12">Intensity of modulation applied to target</text>
  </g>

  <!-- Right Card: Waveform Shapes -->
  <g transform="translate(495, 95)">
    <rect width="425" height="240" rx="10" fill="#131e36" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="18" y="16" width="389" height="32" rx="6" fill="#1e293b"/>
    <text x="212" y="37" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle">COMMON LFO WAVEFORMS</text>

    <!-- Sine Wave -->
    <g transform="translate(30, 65)">
      <path d="M 0 35 C 18 10, 36 10, 54 35 C 72 60, 90 60, 108 35" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="54" y="80" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Sine</text>
      <text x="54" y="96" fill="#64748b" font-size="10.5" text-anchor="middle">Smooth / Vibrato</text>
    </g>

    <!-- Triangle Wave -->
    <g transform="translate(160, 65)">
      <path d="M 0 35 L 27 10 L 81 60 L 108 35" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="54" y="80" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Triangle</text>
      <text x="54" y="96" fill="#64748b" font-size="10.5" text-anchor="middle">Linear Sweeps</text>
    </g>

    <!-- Square Wave -->
    <g transform="translate(290, 65)">
      <path d="M 0 60 L 0 10 L 54 10 L 54 60 L 108 60 L 108 10" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="54" y="80" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">Square</text>
      <text x="54" y="96" fill="#64748b" font-size="10.5" text-anchor="middle">Trill / Gating</text>
    </g>

    <!-- Waveform Note -->
    <rect x="18" y="180" width="389" height="42" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="212" y="206" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Includes <tspan fill="#f59e0b" font-weight="bold">Sawtooth</tspan> (ramps) &amp; <tspan fill="#ec4899" font-weight="bold">Sample &amp; Hold</tspan> (stepped random)</text>
  </g>

  <!-- Bottom Section: 3 Primary Modulation Destinations (Core Edexcel Syllabus) -->
  <g transform="translate(40, 355)">
    <rect width="880" height="255" rx="10" fill="#131e36" stroke="#334155" stroke-width="1.5"/>
    <text x="440" y="34" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="1">COMMON LFO MODULATION DESTINATIONS &amp; AUDIBLE EFFECTS</text>

    <!-- Col 1: Pitch (VCO) -> Vibrato -->
    <g transform="translate(25, 55)">
      <rect width="255" height="175" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="0" y="0" width="255" height="34" rx="8" fill="#1d4ed8"/>
      <text x="127" y="22" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">LFO → PITCH (VCO)</text>

      <text x="127" y="72" fill="#38bdf8" font-size="19" font-weight="bold" text-anchor="middle">VIBRATO</text>
      <text x="127" y="100" fill="#cbd5e1" font-size="12" text-anchor="middle">Periodic pitch fluctuation</text>
      <text x="127" y="122" fill="#94a3b8" font-size="11" text-anchor="middle">Typically 4–7 Hz Sine/Triangle</text>
      <text x="127" y="145" fill="#64748b" font-size="11" text-anchor="middle">Simulates natural vocal/string vibrato</text>
    </g>

    <!-- Col 2: Cutoff (VCF) -> Wah / Wobble -->
    <g transform="translate(312, 55)">
      <rect width="255" height="175" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <rect x="0" y="0" width="255" height="34" rx="8" fill="#047857"/>
      <text x="127" y="22" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">LFO → FILTER CUTOFF (VCF)</text>

      <text x="127" y="72" fill="#34d399" font-size="19" font-weight="bold" text-anchor="middle">WAH-WAH / WOBBLE</text>
      <text x="127" y="100" fill="#cbd5e1" font-size="12" text-anchor="middle">Periodic brightness sweep</text>
      <text x="127" y="122" fill="#94a3b8" font-size="11" text-anchor="middle">Rhythmic tone &amp; resonance movement</text>
      <text x="127" y="145" fill="#64748b" font-size="11" text-anchor="middle">Auto-wah &amp; dubstep wobble bass</text>
    </g>

    <!-- Col 3: Volume (VCA) -> Tremolo -->
    <g transform="translate(600, 55)">
      <rect width="255" height="175" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="0" y="0" width="255" height="34" rx="8" fill="#b45309"/>
      <text x="127" y="22" fill="#ffffff" font-size="12.5" font-weight="bold" text-anchor="middle">LFO → AMPLITUDE (VCA)</text>

      <text x="127" y="72" fill="#fbbf24" font-size="19" font-weight="bold" text-anchor="middle">TREMOLO</text>
      <text x="127" y="100" fill="#cbd5e1" font-size="12" text-anchor="middle">Periodic volume fluctuation</text>
      <text x="127" y="122" fill="#94a3b8" font-size="11" text-anchor="middle">Rhythmic volume pulsing / dipping</text>
      <text x="127" y="145" fill="#64748b" font-size="11" text-anchor="middle">Amp tremolo or rhythmic audio gating</text>
    </g>
  </g>
</svg>
