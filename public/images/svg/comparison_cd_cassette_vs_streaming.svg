<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-media" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-media-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad-media)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow-media-blue)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">RELEASE MEDIA: 1988 CD &amp; CASSETTE TAPE VS 2015 DIGITAL STREAMING</text>
    <rect x="520" y="6" width="140" height="22" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="0.8" />
    <text x="590" y="21" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">COMPARISON 2: Q1</text>
  </g>

  <!-- Left: 1988 CD & Cassette (Tracy Chapman) -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="324" height="270" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <rect x="12" y="12" width="300" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="162" y="30" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">VERSION A: TRACY CHAPMAN (1988)</text>

    <!-- Visuals: Compact Disc & Cassette -->
    <g transform="translate(20, 52)">
      <!-- CD graphic -->
      <circle cx="45" cy="45" r="42" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle cx="45" cy="45" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="45" cy="45" r="6" fill="#090d16" />
      <path d="M 20 25 Q 45 35 70 25" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <text x="100" y="32" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">Compact Disc (CD)</text>
      <text x="100" y="48" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• 16-bit / 44.1 kHz Red Book</text>
      <text x="100" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• 96 dB theoretical dynamic range</text>
      <text x="100" y="76" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Optical digital laser playback</text>

      <!-- Cassette Tape block below -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="80" height="50" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1" />
        <circle cx="24" cy="25" r="10" fill="#090d16" stroke="#94a3b8" stroke-width="1" />
        <circle cx="56" cy="25" r="10" fill="#090d16" stroke="#94a3b8" stroke-width="1" />
        <rect x="18" y="16" width="44" height="18" fill="#0f172a" rx="2" />
        <text x="100" y="24" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Cassette Tape</text>
        <text x="100" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Magnetic analog tape</text>
        <text x="100" y="50" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Dolby B/C noise reduction</text>
      </g>
    </g>

    <!-- Key Concept Box -->
    <g transform="translate(14, 214)">
      <rect x="0" y="0" width="296" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800">1988 CD BOOM IMPACT:</text>
      <text x="10" y="32" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Producers mixed with wide dynamic range, taking advantage of CD's zero surface hiss.</text>
    </g>
  </g>

  <!-- Right: 2015 Streaming (Jonas Blue) -->
  <g transform="translate(372, 62)">
    <rect x="0" y="0" width="324" height="270" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />
    <rect x="12" y="12" width="300" height="28" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
    <text x="162" y="30" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">VERSION B: JONAS BLUE (2015)</text>

    <!-- Cloud / Streaming Visual -->
    <g transform="translate(20, 52)">
      <!-- Cloud & Wave graphic -->
      <rect x="0" y="0" width="80" height="74" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
      <path d="M 25 45 A 15 15 0 0 1 55 45 A 12 12 0 0 1 65 52 A 10 10 0 0 1 55 62 L 25 62 A 10 10 0 0 1 15 52 A 12 12 0 0 1 25 45 Z" fill="#831843" stroke="#f43f5e" stroke-width="1.2" />
      <text x="40" y="24" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CLOUD</text>
      <text x="40" y="34" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" text-anchor="middle">STREAMING</text>

      <text x="96" y="24" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">Digital Streaming Services</text>
      <text x="96" y="40" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Spotify, Apple Music, YouTube</text>
      <text x="96" y="54" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Lossy data compression (AAC / Ogg)</text>
      <text x="96" y="68" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Loudness normalization (-14 LUFS)</text>
      <text x="96" y="82" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Instant global mobile access</text>
    </g>

    <!-- Technical Specs Box -->
    <g transform="translate(14, 150)">
      <rect x="0" y="0" width="296" height="108" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="20" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="800">STREAMING PRODUCTION REQUIREMENTS:</text>
      <text x="10" y="38" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Mixed to compete on headphone earbuds and smart speakers</text>
      <text x="10" y="54" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Instant musical hook within first 15 seconds to prevent skipping</text>
      <text x="10" y="70" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Heavy limiting and pumped sidechain for club playback</text>
      <text x="10" y="86" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• True Peak inter-sample clipping prevention (-1.0 dBFS ceiling)</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 342)">
    <rect x="0" y="0" width="672" height="60" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1.2" />
    <text x="16" y="22" fill="#eab308" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800">EXPERT EXPLANATION TAKEAWAY:</text>
    <text x="16" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Tracy Chapman's 1988 original took advantage of the emerging CD format's dynamic range. Jonas Blue's 2015 version was produced specifically for global streaming algorithms and club DJ playlists.</text>
  </g>
</svg>