<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-vinyl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Vinyl Disc Radial Gradient -->
    <radialGradient id="vinyl-disc-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="28%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="53%" stop-color="#0f172a" />
      <stop offset="75%" stop-color="#1e293b" />
      <stop offset="78%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>

    <filter id="glow-badge-vinyl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad-vinyl)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#f59e0b" filter="url(#glow-badge-vinyl)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">RECORDING MEDIUM: 7-INCH MONO SINGLE vs 12-INCH EXTENDED DANCE SINGLE</text>
    <rect x="526" y="6" width="134" height="22" rx="4" fill="#78350f" fill-opacity="0.4" stroke="#f59e0b" stroke-width="0.8" />
    <text x="593" y="21" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">VINYL FORMAT EVOLUTION</text>
  </g>

  <!-- ==================== MAIN COMPARISON CARDS ==================== -->
  <g transform="translate(24, 60)">
    <!-- Main Card Container -->
    <rect x="0" y="0" width="672" height="248" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- LEFT: 7-INCH VINYL SINGLE (GLORIA JONES 1964) -->
    <g transform="translate(18, 16)">
      <rect x="0" y="0" width="310" height="216" rx="8" fill="#17141f" stroke="#eab308" stroke-width="1.5" />
      <rect x="12" y="10" width="286" height="24" rx="4" fill="#854d0e" />
      <text x="155" y="26" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">VERSION A: 7-INCH VINYL SINGLE (1964)</text>

      <!-- 7" Vinyl Graphic -->
      <g transform="translate(20, 44)">
        <circle cx="55" cy="55" r="50" fill="url(#vinyl-disc-grad)" stroke="#475569" stroke-width="1" />
        <circle cx="55" cy="55" r="22" fill="#dc2626" />
        <circle cx="55" cy="55" r="18" fill="#eab308" />
        <circle cx="55" cy="55" r="4" fill="#0b1329" />
        <text x="55" y="58" fill="#000000" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle">45 RPM</text>
      </g>

      <!-- Specifications Text -->
      <g transform="translate(138, 44)">
        <rect x="0" y="0" width="160" height="22" rx="3" fill="#291e0a" stroke="#ca8a04" stroke-width="0.8" />
        <text x="80" y="15" fill="#fde047" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">B-Side Release (Champion 14003)</text>
        
        <text x="4" y="36" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">&#x2022; Mono Audio (Centered AM radio)</text>
        <text x="4" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">&#x2022; 7" Diameter (Tight groove spacing)</text>
        <text x="4" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">&#x2022; Shorter duration (~2:40 running time)</text>
        <text x="4" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">&#x2022; Lower bass excursion (prevents needle jump)</text>
        <text x="4" y="92" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">&#x2022; Standard pop consumer format</text>
      </g>

      <rect x="12" y="156" width="286" height="48" rx="5" fill="#0e0a17" stroke="#334155" />
      <text x="20" y="174" fill="#fde047" font-family="system-ui, sans-serif" font-size="9" font-weight="800">Production Limitation:</text>
      <text x="20" y="188" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">7-inch singles restricted bass level and length;</text>
      <text x="20" y="198" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">mono was required for mono jukeboxes &amp; AM radio.</text>
    </g>

    <!-- RIGHT: 12-INCH EXTENDED DANCE SINGLE (SOFT CELL 1981) -->
    <g transform="translate(344, 16)">
      <rect x="0" y="0" width="310" height="216" rx="8" fill="#121a29" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="12" y="10" width="286" height="24" rx="4" fill="#0369a1" />
      <text x="155" y="26" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">VERSION B: 12-INCH CLUB SINGLE (1981)</text>

      <!-- 12" Vinyl Graphic -->
      <g transform="translate(20, 44)">
        <circle cx="55" cy="55" r="50" fill="url(#vinyl-disc-grad)" stroke="#38bdf8" stroke-width="1.2" />
        <circle cx="55" cy="55" r="16" fill="#0284c7" />
        <circle cx="55" cy="55" r="3" fill="#0b1329" />
        <text x="55" y="57" fill="#ffffff" font-family="system-ui, sans-serif" font-size="6.5" font-weight="900" text-anchor="middle">12" MAXI</text>
      </g>

      <!-- Specifications Text -->
      <g transform="translate(138, 44)">
        <rect x="0" y="0" width="160" height="22" rx="3" fill="#082f49" stroke="#0284c7" stroke-width="0.8" />
        <text x="80" y="15" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">Club Extended (Some Bizzare / Sire)</text>
        
        <text x="4" y="36" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">&#x2022; Full Stereo (Wide synth imaging)</text>
        <text x="4" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">&#x2022; 12" Diameter (Wide, deep grooves)</text>
        <text x="4" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">&#x2022; Extended 8:58 medley with 'Where Did Our Love Go'</text>
        <text x="4" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">&#x2022; Massive sub-bass headroom for club PAs</text>
        <text x="4" y="92" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">&#x2022; Designed for DJ mixing &amp; beatmatching</text>
      </g>

      <rect x="12" y="156" width="286" height="48" rx="5" fill="#0a1526" stroke="#334155" />
      <text x="20" y="174" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800">Club Advantage:</text>
      <text x="20" y="188" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">Deeper, wider cut allowed heavier bass without skipping;</text>
      <text x="20" y="198" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">longer run-out grooves allowed DJs to blend tracks.</text>
    </g>
  </g>

  <!-- ==================== BOTTOM SPECIFICATION CARDS ==================== -->
  <g transform="translate(24, 320)">
    <!-- Card 1: Question Focus -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#eab308" stroke-width="1.2" />
      <rect x="12" y="10" width="104" height="18" rx="4" fill="#713f12" />
      <text x="64" y="22" fill="#fde047" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x2713; CORRECT ANSWER</text>
      <text x="12" y="44" fill="#fef08a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Version A (Gloria Jones)</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Released 1964 on 7" vinyl single</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Mixed in Mono for AM radio format</text>
    </g>

    <!-- Card 2: 12-inch Revolution -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="112" height="18" rx="4" fill="#1f2937" />
      <text x="68" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">12-INCH REVOLUTION</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Born for Dancefloors</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Soft Cell's 12" maxi-single allowed</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">greater bass dynamics &amp; extended mixes</text>
    </g>

    <!-- Card 3: Exam Anchor -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="100" height="18" rx="4" fill="#1f2937" />
      <text x="62" y="22" fill="#a855f7" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">KEY CONTRAST</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Mono 7" vs Stereo 12"</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">60s: Jukeboxes, transistor AM radios</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">80s: Nightclub sound systems &amp; FM stereo</text>
    </g>
  </g>
</svg>
