<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="960" height="640" fill="#0b1120"/>

  <!-- Header -->
  <text x="480" y="44" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="1.5">SYNTHESIZER FILTER SLOPES &amp; ROLL-OFF</text>
  <text x="480" y="70" fill="#94a3b8" font-size="13.5" text-anchor="middle">Comparing attenuation steepness: 1-Pole (6dB), 2-Pole (12dB), and 4-Pole (24dB) per Octave</text>

  <!-- Main Graph Area -->
  <g transform="translate(60, 95)">
    <rect width="840" height="370" rx="10" fill="#131e36" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Axes -->
    <line x1="80" y1="330" x2="800" y2="330" stroke="#334155" stroke-width="1.5"/>
    <line x1="80" y1="50" x2="80" y2="330" stroke="#334155" stroke-width="1.5"/>

    <!-- Horizontal Grid & Labels -->
    <line x1="80" y1="70" x2="800" y2="70" stroke="#1e293b" stroke-dasharray="4,4"/>
    <text x="70" y="74" fill="#94a3b8" font-size="11" text-anchor="end">0 dB</text>

    <line x1="80" y1="160" x2="800" y2="160" stroke="#1e293b" stroke-dasharray="4,4"/>
    <text x="70" y="164" fill="#64748b" font-size="11" text-anchor="end">-12 dB</text>

    <line x1="80" y1="230" x2="800" y2="230" stroke="#1e293b" stroke-dasharray="4,4"/>
    <text x="70" y="234" fill="#64748b" font-size="11" text-anchor="end">-24 dB</text>

    <!-- Vertical Octave Grid & Labels -->
    <line x1="280" y1="50" x2="280" y2="330" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="280" y="350" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle">Cutoff (fc)</text>

    <line x1="440" y1="50" x2="440" y2="330" stroke="#334155" stroke-dasharray="3,3"/>
    <text x="440" y="350" fill="#94a3b8" font-size="11" text-anchor="middle">+1 Octave (2fc)</text>

    <line x1="600" y1="50" x2="600" y2="330" stroke="#334155" stroke-dasharray="3,3"/>
    <text x="600" y="350" fill="#94a3b8" font-size="11" text-anchor="middle">+2 Octaves (4fc)</text>

    <line x1="760" y1="50" x2="760" y2="330" stroke="#334155" stroke-dasharray="3,3"/>
    <text x="760" y="350" fill="#94a3b8" font-size="11" text-anchor="middle">+3 Octaves (8fc)</text>

    <!-- Passband flat line -->
    <line x1="80" y1="70" x2="280" y2="70" stroke="#f8fafc" stroke-width="3"/>
    <text x="170" y="95" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">PASSBAND</text>

    <!-- Slope 1: 6 dB/Octave (1-Pole) - Cyan/Teal -->
    <path d="M 280 70 C 300 70, 360 85, 440 115 L 760 210" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="5,4"/>
    <circle cx="440" cy="115" r="4" fill="#2dd4bf"/>
    <text x="765" y="210" fill="#2dd4bf" font-size="12" font-weight="bold"> -6 dB/oct (1-Pole)</text>

    <!-- Slope 2: 12 dB/Octave (2-Pole) - Amber/Yellow -->
    <path d="M 280 70 C 310 70, 380 110, 440 160 L 680 325" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="440" cy="160" r="4.5" fill="#f59e0b"/>
    <g transform="translate(620, 240)">
      <rect width="180" height="36" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="16" fill="#f59e0b" font-size="11.5" font-weight="bold">-12 dB/oct (2-Pole)</text>
      <text x="10" y="29" fill="#cbd5e1" font-size="9.5">Oberheim SEM, Juno HPF</text>
    </g>

    <!-- Slope 3: 24 dB/Octave (4-Pole Ladder) - Red/Pink -->
    <path d="M 280 70 C 320 70, 390 140, 440 230 L 490 325" fill="none" stroke="#ef4444" stroke-width="3.5"/>
    <circle cx="440" cy="230" r="5" fill="#ef4444"/>
    <g transform="translate(420, 275)">
      <rect width="180" height="36" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <text x="10" y="16" fill="#ef4444" font-size="11.5" font-weight="bold">-24 dB/oct (4-Pole)</text>
      <text x="10" y="29" fill="#cbd5e1" font-size="9.5">Moog Transistor Ladder</text>
    </g>
  </g>

  <!-- Bottom Explanatory Card -->
  <g transform="translate(60, 485)">
    <rect width="840" height="130" rx="10" fill="#131e36" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="28" fill="#38bdf8" font-size="13.5" font-weight="bold">Audible Musical Differences:</text>
    <text x="25" y="52" fill="#cbd5e1" font-size="12"><tspan fill="#f59e0b" font-weight="bold">12 dB/Octave (2-Pole):</tspan> Gentle, gradual slope. Retains subtle upper harmonics, giving an open, bright, and buzzy character.</text>
    <text x="25" y="74" fill="#cbd5e1" font-size="12"><tspan fill="#ef4444" font-weight="bold">24 dB/Octave (4-Pole):</tspan> Steep, aggressive slope. Rapidly cuts high frequencies, creating a fat, dark, and focused low-end punch (the classic Moog sound).</text>
    <text x="25" y="98" fill="#94a3b8" font-size="11.5">Each "pole" of an analog filter contributes exactly -6 dB per octave of attenuation slope.</text>
  </g>
</svg>
