<svg width="720" height="400" viewBox="0 0 720 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2dd4bf" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" rx="14" fill="#0f172a" />
  <rect x="1" y="1" width="718" height="398" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Header Badge -->
  <rect x="200" y="16" width="320" height="30" rx="6" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.2" />
  <text x="360" y="36" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">PHASER SIGNAL ARCHITECTURE &amp; NOTCH SWEEP</text>

  <!-- TOP SECTION: BLOCK DIAGRAM -->
  <rect x="24" y="60" width="672" height="180" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />

  <!-- Input Node -->
  <circle cx="60" cy="135" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="60" y="139" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">IN</text>
  <text x="60" y="166" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Dry Audio</text>

  <!-- Split lines -->
  <!-- Direct Path (Top) -->
  <path d="M 78 135 L 110 135 L 110 95 L 530 95 L 530 125" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-blue)" />
  <rect x="270" y="82" width="130" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="335" y="98" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DIRECT DRY SIGNAL</text>

  <!-- Phase Shift Path (Bottom through 4 APF stages) -->
  <path d="M 110 135 L 110 170 L 135 170" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arrow-teal)" />

  <!-- 4 All-Pass Filter Stages -->
  <!-- Stage 1 -->
  <rect x="140" y="150" width="75" height="42" rx="6" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5" />
  <text x="177" y="167" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">APF 1</text>
  <text x="177" y="182" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">90° shift</text>

  <line x1="215" y1="171" x2="235" y2="171" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow-teal)" />

  <!-- Stage 2 -->
  <rect x="240" y="150" width="75" height="42" rx="6" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5" />
  <text x="277" y="167" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">APF 2</text>
  <text x="277" y="182" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">180° (Null)</text>

  <line x1="315" y1="171" x2="335" y2="171" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow-teal)" />

  <!-- Stage 3 -->
  <rect x="340" y="150" width="75" height="42" rx="6" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5" />
  <text x="377" y="167" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">APF 3</text>
  <text x="377" y="182" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">270° shift</text>

  <line x1="415" y1="171" x2="435" y2="171" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow-teal)" />

  <!-- Stage 4 -->
  <rect x="440" y="150" width="75" height="42" rx="6" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5" />
  <text x="477" y="167" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">APF 4</text>
  <text x="477" y="182" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">360° (Null)</text>

  <path d="M 515 171 L 530 171 L 530 145" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arrow-teal)" />

  <!-- LFO Modulation Indicator -->
  <rect x="250" y="208" width="160" height="24" rx="4" fill="#1e293b" stroke="#facc15" stroke-width="1" />
  <path d="M 260 220 Q 270 212 280 220 T 300 220" stroke="#facc15" stroke-width="1.5" fill="none" />
  <text x="350" y="224" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">LFO Sweeps Notch Frequencies</text>

  <!-- Summing Mixer Node -->
  <circle cx="530" cy="135" r="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
  <text x="530" y="141" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Σ</text>

  <!-- Output Node -->
  <line x1="546" y1="135" x2="615" y2="135" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)" />
  <circle cx="635" cy="135" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
  <text x="635" y="139" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">OUT</text>
  <text x="635" y="166" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Phased Wet</text>

  <!-- BOTTOM SECTION: SPECTRAL NOTCHES -->
  <rect x="24" y="250" width="672" height="136" rx="10" fill="#182234" stroke="#334155" stroke-width="1" />

  <!-- Spectrum Title -->
  <text x="44" y="272" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">FREQUENCY RESPONSE &amp; PHASE CANCELLATION NOTCHES</text>
  <text x="670" y="272" fill="#2dd4bf" font-family="monospace" font-size="10" text-anchor="end">4-Stage = 2 Sweeping Notches</text>

  <!-- Graph Axes -->
  <line x1="60" y1="355" x2="660" y2="355" stroke="#475569" stroke-width="1" />
  <text x="60" y="370" fill="#64748b" font-family="monospace" font-size="9">20 Hz</text>
  <text x="210" y="370" fill="#64748b" font-family="monospace" font-size="9">200 Hz</text>
  <text x="360" y="370" fill="#64748b" font-family="monospace" font-size="9">1 kHz</text>
  <text x="510" y="370" fill="#64748b" font-family="monospace" font-size="9">5 kHz</text>
  <text x="660" y="370" fill="#64748b" font-family="monospace" font-size="9" text-anchor="end">20 kHz</text>

  <!-- 0 dB Reference line -->
  <line x1="60" y1="295" x2="660" y2="295" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
  <text x="55" y="298" fill="#64748b" font-family="monospace" font-size="8" text-anchor="end">0dB</text>
  <text x="55" y="345" fill="#ef4444" font-family="monospace" font-size="8" text-anchor="end">-∞dB</text>

  <!-- Sweeping Notches Curve -->
  <!-- Notch 1 around 800Hz, Notch 2 around 3.5kHz -->
  <path d="M 60 295 L 180 295 C 210 295, 230 350, 245 350 C 260 350, 280 295, 330 295 L 430 295 C 460 295, 480 350, 495 350 C 510 350, 530 295, 580 295 L 660 295" 
        stroke="#2dd4bf" stroke-width="2.5" fill="none" filter="url(#glow-teal)" />

  <!-- Notch Labels -->
  <line x1="245" y1="350" x2="245" y2="330" stroke="#facc15" stroke-width="1" stroke-dasharray="2 2" />
  <rect x="200" y="306" width="90" height="18" rx="3" fill="#0f172a" stroke="#facc15" stroke-width="0.8" />
  <text x="245" y="319" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Notch 1 (Null)</text>

  <line x1="495" y1="350" x2="495" y2="330" stroke="#facc15" stroke-width="1" stroke-dasharray="2 2" />
  <rect x="450" y="306" width="90" height="18" rx="3" fill="#0f172a" stroke="#facc15" stroke-width="0.8" />
  <text x="495" y="319" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Notch 2 (Null)</text>
</svg>
