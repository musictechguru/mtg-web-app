<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <rect width="720" height="400" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="32" fill="#ec4899" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">TANPURA &amp; INDIAN MODAL DRONE HARMONY</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">'Tomorrow Never Knows' Single-Chord C Mixolydian Harmonic Foundation</text>

  <!-- Left: Tanpura Instrument & Drone Strings -->
  <g transform="translate(40, 75)">
    <rect width="310" height="225" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="155" y="24" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">4 UNFRETTED RESONANT STRINGS</text>

    <!-- 4 String Lines -->
    <g transform="translate(30, 40)">
      <!-- String 1: Pa (5th / G) -->
      <line x1="0" y1="20" x2="250" y2="20" stroke="#f472b6" stroke-width="2.5" />
      <text x="0" y="12" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">String 1 (Pa): G (5th)</text>

      <!-- String 2: Sa (Root / C) -->
      <line x1="0" y1="55" x2="250" y2="55" stroke="#ec4899" stroke-width="2" />
      <text x="0" y="47" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">String 2 (Sa): C (Root - Middle)</text>

      <!-- String 3: Sa (Root / C) -->
      <line x1="0" y1="90" x2="250" y2="90" stroke="#ec4899" stroke-width="2" />
      <text x="0" y="82" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">String 3 (Sa): C (Root - Middle)</text>

      <!-- String 4: Sa (Low C) -->
      <line x1="0" y1="125" x2="250" y2="125" stroke="#db2777" stroke-width="3.5" />
      <text x="0" y="117" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">String 4 (Sa): C (Root - Bass)</text>
    </g>

    <!-- Jawari Bridge Note -->
    <rect x="20" y="175" width="270" height="36" rx="4" fill="#0f172a" />
    <text x="155" y="190" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">JAWARI (COTTON THREAD BRIDGE ADJUSTMENT)</text>
    <text x="155" y="203" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Produces rich overtone buzz &amp; acoustic shimmering</text>
  </g>

  <!-- Right: Modal Harmony Explanation -->
  <g transform="translate(370, 75)">
    <rect width="310" height="225" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="155" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STATIC MODAL FRAMEWORK (NO CHORD CHANGES)</text>

    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="270" height="42" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
      <text x="15" y="18" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10" font-weight="800">C MIXOLYDIAN SCALE:</text>
      <text x="15" y="33" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">C  –  D  –  E  –  F  –  G  –  A  –  <tspan fill="#f43f5e" font-weight="800">B♭</tspan></text>
    </g>

    <g transform="translate(20, 95)">
      <rect x="0" y="0" width="270" height="42" rx="4" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
      <text x="15" y="18" fill="#f472b6" font-family="system-ui, sans-serif" font-size="10" font-weight="800">DRONE PURPOSE IN PSYCHEDELIA:</text>
      <text x="15" y="33" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Replaces Western functional harmony with hypnotic stasis.</text>
    </g>

    <g transform="translate(20, 145)">
      <rect x="0" y="0" width="270" height="65" rx="4" fill="#1e293b" stroke="#22c55e" stroke-width="1" />
      <text x="15" y="18" fill="#4ade80" font-family="system-ui, sans-serif" font-size="10" font-weight="800">RELATION TO TAPE LOOPS:</text>
      <text x="15" y="34" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">Because the underlying drone is always C, Beatles engineers</text>
      <text x="15" y="47" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">could fade arbitrary tape loops (laughing, sitars, brass) in</text>
      <text x="15" y="60" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="8.5">and out without creating harmonic clashing!</text>
    </g>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 315)">
    <rect width="640" height="65" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#ec4899" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EDEXCEL EXAM RELEVANCE: MODAL STRUCTURE</text>
    <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Unlike typical pop songs with Verse/Chorus chord progressions (I-IV-V), 'Tomorrow Never Knows' remains entirely on a C major/mixolydian chord anchored by George Harrison's tanpura drone and Paul McCartney's repeating bass ostinato.</text>
  </g>
</svg>