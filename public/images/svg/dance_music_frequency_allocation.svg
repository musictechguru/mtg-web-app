<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <rect width="720" height="400" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="32" fill="#a855f7" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">DANCE MUSIC FREQUENCY ALLOCATION &amp; SLOTTING</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Preventing Mix Mud: Giving Every Track Its Own Dedicated Frequency Pocket</text>

  <!-- Frequency Spectrum Chart -->
  <g transform="translate(40, 75)">
    <rect width="640" height="225" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />

    <!-- 4 Spectrum Bands -->
    <!-- Band 1: SUB / LOWS (20 - 120 Hz) -->
    <rect x="20" y="30" width="140" height="155" rx="6" fill="#581c87" stroke="#9333ea" stroke-width="1.2" />
    <text x="90" y="52" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">SUB &amp; BASS</text>
    <text x="90" y="70" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">20 Hz – 120 Hz</text>
    <rect x="30" y="85" width="120" height="26" rx="3" fill="#3b0764" />
    <text x="90" y="102" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">TR-909 Kick (50Hz)</text>
    <rect x="30" y="120" width="120" height="26" rx="3" fill="#3b0764" />
    <text x="90" y="137" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Synth Sub Bass</text>

    <!-- Band 2: LOW MIDS (120 - 500 Hz) -->
    <rect x="175" y="30" width="140" height="155" rx="6" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.2" />
    <text x="245" y="52" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">WARMTH &amp; BODY</text>
    <text x="245" y="70" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">120 Hz – 500 Hz</text>
    <rect x="185" y="85" width="120" height="26" rx="3" fill="#172554" />
    <text x="245" y="102" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Sampled Disco Guitars</text>
    <rect x="185" y="120" width="120" height="26" rx="3" fill="#172554" />
    <text x="245" y="137" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Low Vocal Fundam.</text>

    <!-- Band 3: MIDS / PRESENCE (500 - 4 kHz) -->
    <rect x="330" y="30" width="140" height="155" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.2" />
    <text x="400" y="52" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">PRESENCE &amp; LEAD</text>
    <text x="400" y="70" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">500 Hz – 4 kHz</text>
    <rect x="340" y="85" width="120" height="26" rx="3" fill="#022c22" />
    <text x="400" y="102" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Vocoder Vocal Lead</text>
    <rect x="340" y="120" width="120" height="26" rx="3" fill="#022c22" />
    <text x="400" y="137" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Disco Brass Chops</text>

    <!-- Band 4: HIGHS / AIR (4k - 20 kHz) -->
    <rect x="485" y="30" width="135" height="155" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1.2" />
    <text x="552" y="52" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">AIR &amp; SPARKLE</text>
    <text x="552" y="70" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">4 kHz – 20 kHz</text>
    <rect x="495" y="85" width="115" height="26" rx="3" fill="#451a03" />
    <text x="552" y="102" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">909 Open Hi-Hats</text>
    <rect x="495" y="120" width="115" height="26" rx="3" fill="#451a03" />
    <text x="552" y="137" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Crash Cymbals</text>

    <!-- High-pass cut note -->
    <text x="320" y="205" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">High-pass filters (HPF) on non-bass instruments clear low-end room for kick and sub bass</text>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 315)">
    <rect width="640" height="65" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#a855f7" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EDEXCEL EXAM PRINCIPLE: FREQUENCY SEPARATION &amp; EQ</text>
    <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">In club productions, clashing low-end frequencies create destructive phase cancellation and muddy speaker distortion. Carving out individual 'zip codes' with parametric EQ ensures maximum perceived volume and punch.</text>
  </g>
</svg>