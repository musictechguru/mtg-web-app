<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-arr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Timeline block gradients -->
    <linearGradient id="intro-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="verse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="chorus-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>

    <linearGradient id="break-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="medley-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="outro-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="glow-badge-arr" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="720" height="420" rx="14" fill="url(#bg-grad-arr)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#ec4899" filter="url(#glow-badge-arr)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.8">SONG ARRANGEMENT: 3-MIN RADIO POP vs 12-INCH EXTENDED DANCE SUITE</text>
    <rect x="526" y="6" width="134" height="22" rx="4" fill="#831843" fill-opacity="0.4" stroke="#ec4899" stroke-width="0.8" />
    <text x="593" y="21" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">VERSION B: EXTENDED</text>
  </g>

  <!-- ==================== MAIN COMPARISON TIMELINES ==================== -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="672" height="248" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- 1. TOP TIMELINE: GLORIA JONES 1964 (STANDARD 2:40 RADIO POP) -->
    <g transform="translate(18, 14)">
      <rect x="0" y="0" width="636" height="88" rx="8" fill="#171118" stroke="#ca8a04" stroke-width="1.2" />
      <rect x="12" y="8" width="280" height="20" rx="4" fill="#713f12" />
      <text x="152" y="22" fill="#fef08a" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">GLORIA JONES 1964: COMPACT RADIO SINGLE (2:40)</text>

      <!-- Blocks -->
      <g transform="translate(12, 34)">
        <!-- Intro -->
        <rect x="0" y="0" width="35" height="28" rx="4" fill="url(#intro-grad)" />
        <text x="17" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">Intro</text>
        
        <!-- Verse 1 -->
        <rect x="39" y="0" width="55" height="28" rx="4" fill="url(#verse-grad)" />
        <text x="66" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">Verse 1</text>
        
        <!-- Chorus 1 -->
        <rect x="98" y="0" width="45" height="28" rx="4" fill="url(#chorus-grad)" />
        <text x="120" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">Chorus</text>

        <!-- Verse 2 -->
        <rect x="147" y="0" width="55" height="28" rx="4" fill="url(#verse-grad)" />
        <text x="174" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">Verse 2</text>

        <!-- Chorus 2 -->
        <rect x="206" y="0" width="45" height="28" rx="4" fill="url(#chorus-grad)" />
        <text x="228" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">Chorus</text>

        <!-- Short Outro Fade -->
        <rect x="255" y="0" width="45" height="28" rx="4" fill="url(#outro-grad)" />
        <text x="277" y="18" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">Fade</text>

        <!-- Time marker -->
        <line x1="0" y1="34" x2="300" y2="34" stroke="#64748b" stroke-width="1.5" />
        <text x="0" y="44" fill="#64748b" font-family="monospace" font-size="8.5">0:00</text>
        <text x="300" y="44" fill="#fde047" font-family="monospace" font-size="8.5" font-weight="800" text-anchor="middle">2:40 (Song Ends)</text>
      </g>

      <text x="470" y="48" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">Tight, concise radio structure;</text>
      <text x="470" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">designed to fit 3-minute AM broadcast slots.</text>
    </g>

    <!-- 2. BOTTOM TIMELINE: SOFT CELL 1981 (EXTENDED 8:58 12-INCH CLUB DANCE SUITE) -->
    <g transform="translate(18, 114)">
      <rect x="0" y="0" width="636" height="120" rx="8" fill="#0c1829" stroke="#ec4899" stroke-width="1.5" />
      <rect x="12" y="8" width="340" height="20" rx="4" fill="#831843" />
      <text x="182" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle">&#x2713; SOFT CELL 1981: EXTENDED 12" DANCE MEDLEY (8:58)</text>

      <!-- Blocks spanning the full width -->
      <g transform="translate(12, 34)">
        <!-- DJ Intro Beat -->
        <rect x="0" y="0" width="55" height="32" rx="4" fill="url(#intro-grad)" />
        <text x="27" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="800" text-anchor="middle">DJ Beat</text>
        <text x="27" y="26" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">Intro</text>
        
        <!-- Part 1: Tainted Love -->
        <rect x="58" y="0" width="155" height="32" rx="4" fill="url(#chorus-grad)" />
        <text x="135" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">TAINTED LOVE</text>
        <text x="135" y="26" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Full Song Structure</text>

        <!-- Extended Synth Breakdown -->
        <rect x="216" y="0" width="95" height="32" rx="4" fill="url(#break-grad)" />
        <text x="263" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="800" text-anchor="middle">SYNTH BREAK</text>
        <text x="263" y="26" fill="#cffafe" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">Club Trance Groove</text>

        <!-- Part 2: Where Did Our Love Go Medley -->
        <rect x="314" y="0" width="165" height="32" rx="4" fill="url(#medley-grad)" />
        <text x="396" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8.5" font-weight="900" text-anchor="middle">WHERE DID OUR LOVE GO</text>
        <text x="396" y="26" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Motown Medley Segue</text>

        <!-- Extended Dub & Percussion Outro Fade -->
        <rect x="482" y="0" width="128" height="32" rx="4" fill="url(#outro-grad)" />
        <text x="546" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-size="8" font-weight="800" text-anchor="middle">EXTENDED DUB OUTRO</text>
        <text x="546" y="26" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">DJ Beatmixing Outro</text>

        <!-- Timeline axis line -->
        <line x1="0" y1="42" x2="610" y2="42" stroke="#64748b" stroke-width="1.5" />
        <text x="0" y="54" fill="#64748b" font-family="monospace" font-size="8.5">0:00</text>
        <text x="216" y="54" fill="#ec4899" font-family="monospace" font-size="8.5">3:05</text>
        <text x="314" y="54" fill="#f59e0b" font-family="monospace" font-size="8.5">4:25</text>
        <text x="610" y="54" fill="#34d399" font-family="monospace" font-size="8.5" font-weight="800" text-anchor="end">8:58 Total</text>
      </g>

      <text x="318" y="108" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">&#x2605; Extended DJ intro/outro allowed seamless beatmatching on club turntables</text>
    </g>
  </g>

  <!-- ==================== BOTTOM SPECIFICATION CARDS ==================== -->
  <g transform="translate(24, 320)">
    <!-- Card 1: Correct Answer -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#ec4899" stroke-width="1.2" />
      <rect x="12" y="10" width="104" height="18" rx="4" fill="#831843" />
      <text x="64" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&#x2713; CORRECT ANSWER</text>
      <text x="12" y="44" fill="#f472b6" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Version B (Soft Cell)</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Features extended outro &amp; segue</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Mashed with 'Where Did Our Love Go'</text>
    </g>

    <!-- Card 2: 12-inch Dance Form -->
    <g transform="translate(228, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <rect x="12" y="10" width="108" height="18" rx="4" fill="#1f2937" />
      <text x="66" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CLUB DANCE FORM</text>
      <text x="12" y="44" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Extended Mixes for DJs</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Instrumental breaks and long fades</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">allowed continuous dancefloor mixing</text>
    </g>

    <!-- Card 3: 1960s Radio Format -->
    <g transform="translate(456, 0)">
      <rect x="0" y="0" width="216" height="84" rx="8" fill="#111827" stroke="#ca8a04" stroke-width="1.2" />
      <rect x="12" y="10" width="94" height="18" rx="4" fill="#713f12" />
      <text x="59" y="22" fill="#fde047" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">1964 7-INCH POP</text>
      <text x="12" y="44" fill="#fef08a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Gloria Jones Original</text>
      <text x="12" y="58" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Concise 2:40 pop progression</text>
      <text x="12" y="72" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9.5">Immediate verse/chorus hook delivery</text>
    </g>
  </g>
</svg>
