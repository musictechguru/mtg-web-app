<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="30" y="24" width="220" height="32" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
  <text x="140" y="45" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">ALIASING DISTORTION</text>
  <text x="270" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Inharmonic foldback noise created when sampling frequencies above the Nyquist limit</text>

  <!-- WAVEFORM TIME-DOMAIN DEMONSTRATION -->
  <g transform="translate(50, 75)">
    <rect x="0" y="0" width="700" height="130" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="22" fill="#38bdf8" font-size="11" font-weight="700">INPUT SIGNAL (High Frequency) vs RECONSTRUCTED ALIAS (False Low Frequency)</text>
    <line x1="0" y1="70" x2="700" y2="70" stroke="#1e293b" stroke-width="1" />

    <!-- Fast High-Frequency Input Wave (Light Cyan, faint) -->
    <path d="M 20,70 Q 30,25 40,70 T 60,70 T 80,70 T 100,70 T 120,70 T 140,70 T 160,70 
             T 180,70 T 200,70 T 220,70 T 240,70 T 260,70 T 280,70 T 300,70 T 320,70 
             T 340,70 T 360,70 T 380,70 T 400,70 T 420,70 T 440,70 T 460,70 T 480,70 
             T 500,70 T 520,70 T 540,70 T 560,70 T 580,70 T 600,70 T 620,70 T 640,70 T 660,70 T 680,70" 
          fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" />

    <!-- Inadequate Sample Points (Green dots, spaced too far apart) -->
    <g fill="#22c55e" stroke="#ffffff" stroke-width="1.5">
      <circle cx="35" cy="30" r="4.5" />
      <circle cx="105" cy="50" r="4.5" />
      <circle cx="175" cy="100" r="4.5" />
      <circle cx="245" cy="110" r="4.5" />
      <circle cx="315" cy="70" r="4.5" />
      <circle cx="385" cy="30" r="4.5" />
      <circle cx="455" cy="50" r="4.5" />
      <circle cx="525" cy="100" r="4.5" />
      <circle cx="595" cy="110" r="4.5" />
      <circle cx="665" cy="70" r="4.5" />
    </g>

    <!-- The Reconstructed "False" Alias Wave (Red, slow sinusoidal) -->
    <path d="M 35,30 C 105,30 140,110 210,110 C 280,110 315,30 385,30 C 455,30 490,110 560,110 C 630,110 665,70 690,70" 
          fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" />

    <text x="60" y="115" fill="#38bdf8" font-size="10">Original Input (f_in)</text>
    <text x="500" y="45" fill="#ef4444" font-size="11" font-weight="700">False Alias Tone Generated (f_alias)</text>
  </g>

  <!-- SPECTRAL FOLDBACK DEMONSTRATION -->
  <g transform="translate(50, 215)">
    <rect x="0" y="0" width="700" height="100" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="20" fill="#f59e0b" font-size="11" font-weight="700">FREQUENCY SPECTRUM: SPECTRAL FOLDBACK AT NYQUIST LIMIT</text>
    <line x1="30" y1="75" x2="670" y2="75" stroke="#334155" stroke-width="1.5" />

    <!-- Nyquist Limit Line -->
    <line x1="350" y1="28" x2="350" y2="85" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3,3" />
    <text x="350" y="25" fill="#f59e0b" font-size="10" font-weight="700" text-anchor="middle">NYQUIST FREQUENCY (fs / 2)</text>

    <!-- Audition Spectrum Labels -->
    <text x="40" y="90" fill="#64748b" font-size="10">0 Hz (Audible)</text>
    <text x="650" y="90" fill="#64748b" font-size="10">Sample Rate (fs)</text>

    <!-- Input spike above Nyquist -->
    <line x1="480" y1="75" x2="480" y2="38" stroke="#38bdf8" stroke-width="3" />
    <circle cx="480" cy="38" r="4" fill="#38bdf8" />
    <text x="480" y="32" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">f_input (e.g. 26 kHz)</text>

    <!-- Foldback Arrow -->
    <path d="M 470,45 Q 350,15 230,45" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />
    <polygon points="225,48 235,42 235,52" fill="#ef4444" />

    <!-- Folded Alias spike below Nyquist -->
    <line x1="220" y1="75" x2="220" y2="38" stroke="#ef4444" stroke-width="3" />
    <circle cx="220" cy="38" r="4" fill="#ef4444" />
    <text x="220" y="32" fill="#ef4444" font-size="9" font-weight="700" text-anchor="middle">f_alias (18 kHz Mirror Tone)</text>
  </g>

  <!-- Footer Information Strip -->
  <rect x="50" y="330" width="700" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="70" y="354" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">WHAT IS ALIASING NOISE?</text>
  <text x="70" y="374" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Occurs when downsampling or recording without an <strong style="fill:#38bdf8;">anti-aliasing low-pass filter</strong>.</text>
  <text x="70" y="390" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Frequencies exceeding half the sample rate reflect backwards into the audible range, creating inharmonic metallic ring tones.</text>
</svg>
