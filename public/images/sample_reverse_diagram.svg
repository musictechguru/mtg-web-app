<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="forwardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="reverseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="30" y="24" width="220" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="140" y="45" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">SAMPLE REVERSAL</text>
  <text x="270" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Inverting temporal playback from end to start for dramatic swelling effects</text>

  <!-- FORWARD PANEL -->
  <g transform="translate(50, 75)">
    <rect x="0" y="0" width="700" height="110" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">ORIGINAL PLAYBACK (FORWARD): Instant Attack → Gradual Decay Tail</text>
    <line x1="0" y1="65" x2="700" y2="65" stroke="#1e293b" stroke-width="1" />
    
    <!-- Forward Cymbal/Transient Waveform -->
    <path d="M 30,65 
             L 45,15 L 60,115 L 75,25 L 90,105 L 110,35 L 135,95 L 165,45 L 200,85 
             L 245,52 L 295,78 L 355,58 L 420,72 L 490,62 L 570,68 L 650,65 L 680,65" 
          fill="none" stroke="url(#forwardGrad)" stroke-width="2.5" stroke-linejoin="round" />

    <circle cx="45" cy="15" r="5" fill="#38bdf8" />
    <text x="45" y="10" fill="#38bdf8" font-size="10" font-weight="700">Sharp Transient Attack</text>
    <text x="600" y="85" fill="#94a3b8" font-size="10" font-style="italic">Natural decaying tail →</text>
  </g>

  <!-- REVERSED PANEL -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="700" height="115" rx="6" fill="#0b1120" stroke="#f59e0b" stroke-width="1" />
    <text x="15" y="22" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">REVERSED PLAYBACK (BACKWARD): Gradual Swell / Crescendo → Abrupt Cutoff</text>
    <line x1="0" y1="65" x2="700" y2="65" stroke="#1e293b" stroke-width="1" />

    <!-- Reversed Waveform (Mirrored) -->
    <path d="M 20,65 L 50,65 L 130,68 L 210,62 L 280,72 L 345,58 L 405,78 L 455,52 
             L 500,85 L 535,45 L 565,95 L 590,35 L 610,105 L 625,25 L 640,115 L 655,15 L 670,65" 
          fill="none" stroke="url(#reverseGrad)" stroke-width="2.5" stroke-linejoin="round" />

    <text x="70" y="85" fill="#94a3b8" font-size="10" font-style="italic">← Rising ambient swell (Crescendo)</text>
    <circle cx="655" cy="15" r="5" fill="#f59e0b" />
    <line x1="660" y1="10" x2="660" y2="105" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />
    <text x="665" y="40" fill="#ef4444" font-size="10" font-weight="700">Abrupt Cutoff!</text>
  </g>

  <!-- Footer Information Strip -->
  <rect x="50" y="330" width="700" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="70" y="354" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">PRODUCTION ROLES OF REVERSED SAMPLES:</text>
  <text x="70" y="374" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">1. <strong style="fill:#38bdf8;">Transition Risers:</strong> Reversed crash cymbals or snare reverb tails build anticipation into a chorus or beat drop.</text>
  <text x="70" y="390" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">2. <strong style="fill:#38bdf8;">Ghost Vocals &amp; Textures:</strong> Pre-reverb and reversed vocal phrases produce eerie, psychedelic, or atmospheric swells.</text>
</svg>
