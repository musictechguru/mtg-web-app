<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="30" y="24" width="240" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="150" y="45" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">FILTERING A SAMPLE</text>
  <text x="290" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Sculpting timbre, removing noise, and creating dynamic filter sweeps</text>

  <!-- Filter Frequency Response Canvas -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="680" height="235" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.5" />

    <!-- Grid lines -->
    <line x1="50" y1="30" x2="50" y2="205" stroke="#1e293b" stroke-width="1" />
    <line x1="180" y1="30" x2="180" y2="205" stroke="#1e293b" stroke-width="1" />
    <line x1="330" y1="30" x2="330" y2="205" stroke="#1e293b" stroke-width="1" />
    <line x1="480" y1="30" x2="480" y2="205" stroke="#1e293b" stroke-width="1" />
    <line x1="630" y1="30" x2="630" y2="205" stroke="#1e293b" stroke-width="1" />

    <line x1="30" y1="55" x2="650" y2="55" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="30" y1="120" x2="650" y2="120" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="30" y1="185" x2="650" y2="185" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Frequency labels -->
    <text x="50" y="222" fill="#64748b" font-size="10" text-anchor="middle">50 Hz</text>
    <text x="180" y="222" fill="#64748b" font-size="10" text-anchor="middle">200 Hz</text>
    <text x="330" y="222" fill="#64748b" font-size="10" text-anchor="middle">1 kHz (Cutoff)</text>
    <text x="480" y="222" fill="#64748b" font-size="10" text-anchor="middle">5 kHz</text>
    <text x="630" y="222" fill="#64748b" font-size="10" text-anchor="middle">20 kHz</text>

    <!-- Passband Fill Area -->
    <path d="M 30,55 L 300,55 Q 330,55 350,85 L 480,185 L 650,195 L 650,205 L 30,205 Z" fill="url(#passGrad)" />

    <!-- Low Pass Filter Curve (Green to Red slope) -->
    <path d="M 30,55 L 300,55 Q 330,55 340,70 L 450,165 L 650,195" fill="none" stroke="#22c55e" stroke-width="3" />
    
    <!-- Cutoff Point Marker -->
    <circle cx="330" cy="58" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
    <line x1="330" y1="20" x2="330" y2="205" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Cutoff Callout Badge -->
    <rect x="260" y="15" width="140" height="24" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1" />
    <text x="330" y="31" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle">LPF CUTOFF POINT (fc)</text>

    <!-- Passband Label -->
    <rect x="80" y="90" width="130" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="145" y="107" fill="#a7f3d0" font-size="10" font-weight="700" text-anchor="middle">PASSBAND (Retained)</text>
    <text x="145" y="135" fill="#cbd5e1" font-size="10" text-anchor="middle">Bass warmth &amp; groove</text>

    <!-- Attenuation Slope / Stopband Label -->
    <rect x="470" y="90" width="150" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
    <text x="545" y="107" fill="#fca5a5" font-size="10" font-weight="700" text-anchor="middle">STOPBAND (Attenuated)</text>
    <text x="545" y="135" fill="#f87171" font-size="10" text-anchor="middle">Vinyl crackle &amp; hiss cut</text>
  </g>

  <!-- Footer Information Strip -->
  <rect x="60" y="330" width="680" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="80" y="354" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">SAMPLING USE CASES FOR LOW-PASS FILTERING:</text>
  <text x="80" y="374" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">1. <strong style="fill:#38bdf8;">Daft Punk / French House Effect:</strong> Sweeping the LPF cutoff creates the iconic muffled "underwater" intro build.</text>
  <text x="80" y="390" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">2. <strong style="fill:#38bdf8;">Taming Harshness:</strong> Rolling off top-end removes mechanical hiss from vintage vinyl and noisy tape transfers.</text>
</svg>
