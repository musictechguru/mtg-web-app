<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">DELAY PROCESSOR TYPES</text>
    <rect x="262" y="0" width="310" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="417" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tape vs Analog BBD vs Digital DSP</text>
  </g>

  <!-- 3 Pillars -->
  <g transform="translate(30, 60)">
    <!-- Pillar 1: TAPE DELAY -->
    <g transform="translate(0, 0)">
      <rect width="230" height="315" rx="8" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.4" filter="url(#shadow)" />
      <g transform="translate(15, 14)">
        <rect width="200" height="26" rx="4" fill="#d97706" fill-opacity="0.25" stroke="#fbbf24" stroke-width="1" />
        <text x="100" y="18" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">TAPE DELAY (ECHOPLEX)</text>
      </g>
      <!-- Tape Reels Graphic -->
      <g transform="translate(115, 80)">
        <circle cx="-40" cy="0" r="24" fill="#0b1120" stroke="#fbbf24" stroke-width="2" />
        <circle cx="40" cy="0" r="24" fill="#0b1120" stroke="#fbbf24" stroke-width="2" />
        <line x1="-40" y1="-24" x2="40" y2="-24" stroke="#fbbf24" stroke-width="2" />
      </g>
      <!-- Characteristics -->
      <g transform="translate(15, 130)">
        <rect x="0" y="0" width="200" height="26" rx="3" fill="#0b1120" stroke="#fbbf24" stroke-width="0.8" />
        <text x="100" y="17" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Warm Tape Saturation</text>

        <rect x="0" y="34" width="200" height="26" rx="3" fill="#0b1120" stroke="#fbbf24" stroke-width="0.8" />
        <text x="100" y="51" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Wow &amp; Flutter Modulation</text>

        <rect x="0" y="68" width="200" height="26" rx="3" fill="#0b1120" stroke="#fbbf24" stroke-width="0.8" />
        <text x="100" y="85" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Darkening Repeat Tails</text>
      </g>
      <g transform="translate(15, 255)">
        <rect width="200" height="40" rx="4" fill="#0b1120" stroke="#fbbf24" stroke-width="1" />
        <text x="100" y="24" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">VINTAGE CHARM</text>
      </g>
    </g>

    <!-- Pillar 2: ANALOG BBD DELAY -->
    <g transform="translate(255, 0)">
      <rect width="230" height="315" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.4" filter="url(#shadow)" />
      <g transform="translate(15, 14)">
        <rect width="200" height="26" rx="4" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1" />
        <text x="100" y="18" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">ANALOG BBD (MEMORY MAN)</text>
      </g>
      <!-- Bucket Brigade Chip Graphic -->
      <g transform="translate(115, 80)">
        <rect x="-45" y="-18" width="90" height="36" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="2" />
        <text x="0" y="4" fill="#34d399" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">MN3005 IC</text>
      </g>
      <!-- Characteristics -->
      <g transform="translate(15, 130)">
        <rect x="0" y="0" width="200" height="26" rx="3" fill="#0b1120" stroke="#10b981" stroke-width="0.8" />
        <text x="100" y="17" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Solid-State Capacitors</text>

        <rect x="0" y="34" width="200" height="26" rx="3" fill="#0b1120" stroke="#10b981" stroke-width="0.8" />
        <text x="100" y="51" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Gritty Dark Low-Pass Filter</text>

        <rect x="0" y="68" width="200" height="26" rx="3" fill="#0b1120" stroke="#10b981" stroke-width="0.8" />
        <text x="100" y="85" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Lo-Fi Companding Noise</text>
      </g>
      <g transform="translate(15, 255)">
        <rect width="200" height="40" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="1" />
        <text x="100" y="24" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">WARM ANALOG</text>
      </g>
    </g>

    <!-- Pillar 3: DIGITAL DELAY -->
    <g transform="translate(510, 0)">
      <rect width="230" height="315" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#shadow)" />
      <g transform="translate(15, 14)">
        <rect width="200" height="26" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1" />
        <text x="100" y="18" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">DIGITAL DSP DELAY</text>
      </g>
      <!-- Binary / RAM Chip Graphic -->
      <g transform="translate(115, 80)">
        <rect x="-45" y="-18" width="90" height="36" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="2" />
        <text x="0" y="4" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">24-bit / 96k</text>
      </g>
      <!-- Characteristics -->
      <g transform="translate(15, 130)">
        <rect x="0" y="0" width="200" height="26" rx="3" fill="#0b1120" stroke="#38bdf8" stroke-width="0.8" />
        <text x="100" y="17" fill="#bae6fd" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Pristine 1:1 Cloning</text>

        <rect x="0" y="34" width="200" height="26" rx="3" fill="#0b1120" stroke="#38bdf8" stroke-width="0.8" />
        <text x="100" y="51" fill="#bae6fd" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Full 20 Hz – 20 kHz Range</text>

        <rect x="0" y="68" width="200" height="26" rx="3" fill="#0b1120" stroke="#38bdf8" stroke-width="0.8" />
        <text x="100" y="85" fill="#bae6fd" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Exact BPM Grid Sync</text>
      </g>
      <g transform="translate(15, 255)">
        <rect width="200" height="40" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1" />
        <text x="100" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">PRISTINE FIDELITY</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="24" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="44" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Comparison: Tape offers organic saturation &amp; flutter; BBD provides dark analog grit; Digital clones audio cleanly.</text>
  </g>
</svg>