<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOct" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Node Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" rx="14" fill="url(#bgOct)" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="90" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ACOUSTICS &amp; EQ MATH</text>
    
    <text x="195" y="18" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">Musical Octaves &amp; Frequency Doubling</text>
    <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Every musical octave higher exactly doubles frequency: f × 2. If A4 = 440 Hz, then A5 (one octave higher) = 880 Hz.
    </text>
  </g>

  <!-- Octave Progression Ladder Viewport (X: 50 to 830, Y: 80 to 400, Height: 320) -->
  <rect x="50" y="80" width="780" height="320" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Logarithmic Frequency Horizon Axis -->
  <line x1="80" y1="280" x2="780" y2="280" stroke="#475569" stroke-width="2" />

  <!-- Six Octave Pillars (A1 to A6) -->
  <!-- 1. A1 = 55 Hz -->
  <g transform="translate(100, 110)">
    <rect width="90" height="155" rx="6" fill="#1e1b4b" fill-opacity="0.6" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="45" y="24" fill="#c4b5fd" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">A1</text>
    <text x="45" y="44" fill="#a78bfa" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">55 Hz</text>
    <text x="45" y="70" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9.5" text-anchor="middle">Sub-Bass</text>
    <line x1="45" y1="155" x2="45" y2="170" stroke="#8b5cf6" stroke-width="2" />
    <circle cx="45" cy="170" r="5" fill="#8b5cf6" />
  </g>

  <!-- Multiply x2 Badge 1 -->
  <text x="215" y="210" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">&#215; 2</text>
  <path d="M 195,215 Q 215,200 235,215" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- 2. A2 = 110 Hz -->
  <g transform="translate(240, 110)">
    <rect width="90" height="155" rx="6" fill="#082f49" fill-opacity="0.6" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="45" y="24" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">A2</text>
    <text x="45" y="44" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">110 Hz</text>
    <text x="45" y="70" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9.5" text-anchor="middle">Bass Guitar</text>
    <line x1="45" y1="155" x2="45" y2="170" stroke="#0ea5e9" stroke-width="2" />
    <circle cx="45" cy="170" r="5" fill="#0ea5e9" />
  </g>

  <!-- Multiply x2 Badge 2 -->
  <text x="355" y="210" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">&#215; 2</text>

  <!-- 3. A3 = 220 Hz -->
  <g transform="translate(380, 110)">
    <rect width="90" height="155" rx="6" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.2" />
    <text x="45" y="24" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">A3</text>
    <text x="45" y="44" fill="#34d399" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">220 Hz</text>
    <text x="45" y="70" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9.5" text-anchor="middle">Warmth Body</text>
    <line x1="45" y1="155" x2="45" y2="170" stroke="#10b981" stroke-width="2" />
    <circle cx="45" cy="170" r="5" fill="#10b981" />
  </g>

  <!-- Multiply x2 Badge 3 -->
  <text x="495" y="210" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">&#215; 2</text>

  <!-- 4. A4 = 440 Hz (Highlighted Standard) -->
  <g transform="translate(520, 95)">
    <rect width="105" height="170" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowCyan)" />
    <rect x="15" y="10" width="75" height="20" rx="4" fill="#0284c7" />
    <text x="52" y="24" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">GIVEN NOTE</text>
    <text x="52" y="48" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">A4</text>
    <text x="52" y="70" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="800" text-anchor="middle">440 Hz</text>
    <text x="52" y="94" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">Concert Pitch</text>
    <line x1="52" y1="170" x2="52" y2="185" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="52" cy="185" r="6" fill="#38bdf8" />
  </g>

  <!-- TARGET JUMP ARROW (+1 Octave) -->
  <g transform="translate(628, 140)">
    <path d="M 0,0 Q 25,-40 50,0" fill="none" stroke="#f59e0b" stroke-width="3" />
    <polygon points="53,-2 52,8 43,4" fill="#f59e0b" />
    <rect x="0" y="-45" width="55" height="22" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1" />
    <text x="27" y="-30" fill="#fde68a" font-family="monospace" font-size="12" font-weight="800" text-anchor="middle">&#215; 2</text>
  </g>

  <!-- 5. A5 = 880 Hz (CORRECT ANSWER) -->
  <g transform="translate(685, 95)">
    <rect width="115" height="170" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2.5" />
    <rect x="15" y="10" width="85" height="20" rx="4" fill="#059669" />
    <text x="57" y="24" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">+1 OCTAVE HIGHER</text>
    <text x="57" y="48" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle">A5</text>
    <text x="57" y="70" fill="#34d399" font-family="monospace" font-size="18" font-weight="800" text-anchor="middle">880 Hz</text>
    <text x="57" y="94" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">440 Hz &#215; 2 = 880 Hz</text>
    <line x1="57" y1="170" x2="57" y2="185" stroke="#10b981" stroke-width="2.5" />
    <circle cx="57" cy="185" r="6" fill="#10b981" />
  </g>

  <!-- Formula Callout Box -->
  <g transform="translate(70, 310)">
    <rect width="740" height="70" rx="6" fill="#020617" stroke="#1e293b" />
    <rect x="15" y="17" width="220" height="36" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="40" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">fn = f0 &#215; 2^n (Octaves)</text>

    <text x="255" y="32" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">Musical Octave Rule:</text>
    <text x="390" y="32" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Double frequency (&#215;2) per octave up; halve (&#247;2) per octave down.</text>

    <text x="255" y="52" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">Equalizer Relevance:</text>
    <text x="390" y="52" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">Harmonic overtones occur at octave multiples; notch filters track these intervals.</text>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(50, 424)">
    <rect width="780" height="80" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.2" />

    <text x="20" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Acoustic Math Summary:</text>
    <text x="20" y="44" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      • A4 (Concert pitch standard) vibrates at 440 cycles per second (440 Hz).
    </text>
    <text x="20" y="64" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      • Moving one octave higher to A5 produces twice as many cycles: <tspan fill="#34d399" font-weight="700">440 Hz × 2 = 880 Hz</tspan>.
    </text>
  </g>
</svg>
