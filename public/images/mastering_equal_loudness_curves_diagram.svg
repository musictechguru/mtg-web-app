<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(30, 16)">
    <rect width="270" height="32" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1.2" />
    <text x="135" y="21" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">EQUAL-LOUDNESS CONTOURS</text>
    <rect x="282" y="0" width="370" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="467" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Fletcher-Munson Curves: Low-End Insensitivity at Low Volumes</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left: Equal Loudness Curve Plot -->
    <g transform="translate(20, 20)">
      <rect width="400" height="275" rx="6" fill="#0b1120" stroke="#1e293b" />
      <g transform="translate(15, 12)">
        <rect width="180" height="22" rx="3" fill="#3b0764" />
        <text x="90" y="15" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">FLETCHER-MUNSON CONTOURS</text>
      </g>

      <!-- Curves Plot -->
      <g transform="translate(20, 48)">
        <rect width="360" height="150" rx="4" fill="#0f172a" stroke="#1e293b" />

        <!-- 30 Phon Curve (Quiet Listening) - Extreme low rise -->
        <path d="M 25,25 C 60,35 110,80 180,105 C 230,120 260,135 280,125 C 310,110 330,85 345,70" fill="none" stroke="#ef4444" stroke-width="2.5" />
        <g transform="translate(35, 15)">
          <rect width="75" height="16" rx="2" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
          <text x="37" y="11" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">30 dB (QUIET)</text>
        </g>

        <!-- 60 Phon Curve (Moderate) -->
        <path d="M 25,65 C 60,75 110,105 180,120 C 230,130 260,140 280,133 C 310,125 330,110 345,100" fill="none" stroke="#fbbf24" stroke-width="2" />
        <g transform="translate(35, 60)">
          <rect width="85" height="16" rx="2" fill="#451a03" stroke="#f59e0b" stroke-width="0.8" />
          <text x="42" y="11" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">60 dB (MODERATE)</text>
        </g>

        <!-- 90 Phon Curve (Loud / Flat response) -->
        <path d="M 25,105 C 60,110 110,125 180,132 C 230,138 260,145 280,140 C 310,135 330,125 345,120" fill="none" stroke="#10b981" stroke-width="2.2" />
        <g transform="translate(35, 105)">
          <rect width="80" height="16" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
          <text x="40" y="11" fill="#34d399" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">90 dB (FLATTER)</text>
        </g>

        <!-- Sensitive Ear Notch at 3-4 kHz -->
        <g transform="translate(225, 20)">
          <rect width="120" height="20" rx="3" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8" />
          <text x="60" y="14" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">EAR SENSITIVITY DIP</text>
        </g>
      </g>

      <!-- Freq markers in boxes -->
      <g transform="translate(30, 210)">
        <g transform="translate(10, 0)">
          <rect width="45" height="18" rx="2" fill="#0f172a" stroke="#334155" />
          <text x="22" y="13" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">20 Hz</text>
        </g>
        <g transform="translate(90, 0)">
          <rect width="45" height="18" rx="2" fill="#0f172a" stroke="#334155" />
          <text x="22" y="13" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">200 Hz</text>
        </g>
        <g transform="translate(170, 0)">
          <rect width="45" height="18" rx="2" fill="#0f172a" stroke="#334155" />
          <text x="22" y="13" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">1 kHz</text>
        </g>
        <g transform="translate(250, 0)">
          <rect width="50" height="18" rx="2" fill="#0f172a" stroke="#38bdf8" />
          <text x="25" y="13" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">3.5 kHz</text>
        </g>
      </g>

      <g transform="translate(25, 238)">
        <rect width="350" height="24" rx="3" fill="#0f172a" stroke="#a855f7" stroke-width="0.8" />
        <text x="175" y="16" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Low-end requires huge physical energy to sound equally loud</text>
      </g>
    </g>

    <!-- Right: Mastering SPL Best Practices -->
    <g transform="translate(440, 20)">
      <rect width="280" height="275" rx="6" fill="#0b1120" stroke="#1e293b" />
      <g transform="translate(15, 12)">
        <rect width="220" height="22" rx="3" fill="#0c4a6e" />
        <text x="110" y="15" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CALIBRATED MONITORING LEVEL</text>
      </g>

      <!-- 3 Key Rules Cards -->
      <g transform="translate(15, 45)">
        <g transform="translate(0, 0)">
          <rect width="250" height="66" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
          <g transform="translate(10, 8)">
            <rect width="110" height="18" rx="2" fill="#064e3b" />
            <text x="55" y="13" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">75 - 83 dB SPL</text>
          </g>
          <text x="12" y="44" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600">The Sweet Spot Reference</text>
          <text x="12" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8">Flattest human frequency response</text>
        </g>

        <g transform="translate(0, 74)">
          <rect width="250" height="66" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="0.8" />
          <g transform="translate(10, 8)">
            <rect width="135" height="18" rx="2" fill="#450a0a" />
            <text x="67" y="13" fill="#f87171" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">DANGER OF QUIET MIX</text>
          </g>
          <text x="12" y="44" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600">Engineer over-boosts bass</text>
          <text x="12" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8">Ears can't hear lows; track distorts</text>
        </g>

        <g transform="translate(0, 148)">
          <rect width="250" height="66" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8" />
          <g transform="translate(10, 8)">
            <rect width="120" height="18" rx="2" fill="#451a03" />
            <text x="60" y="13" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">DANGER OF LOUD MIX</text>
          </g>
          <text x="12" y="44" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600">Ear fatigue and harshness</text>
          <text x="12" y="58" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8">Leads to dull, scooped master</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 12)">
      <rect width="75" height="20" rx="3" fill="#0284c7" />
      <text x="37" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="98" y="27" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Human ears perceive less bass at lower volumes; mastering at calibrated SPL ensures balanced translation.</text>
  </g>
</svg>
