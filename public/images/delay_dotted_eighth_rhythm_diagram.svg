<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">DOTTED-EIGHTH DELAY (3/16)</text>
    <rect x="262" y="0" width="310" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="417" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Syncopated Counter-Rhythm Against 1/4 Notes</text>
  </g>

  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#shadow)" />
    
    <!-- 16th Note Grid -->
    <g transform="translate(45, 25)">
      <rect width="650" height="215" rx="6" fill="#0b1120" stroke="#1e293b" />

      <!-- Row 1: Straight Quarter Notes Played by Musician (1, 2, 3, 4) -->
      <g transform="translate(15, 30)">
        <rect width="180" height="26" rx="3" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
        <text x="90" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">DRY GUITAR (1/4 NOTES)</text>
      </g>
      <!-- Beat 1 -->
      <rect x="230" y="23" width="26" height="40" rx="3" fill="#38bdf8" />
      <text x="243" y="48" fill="#0f172a" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">1</text>
      <!-- Beat 2 -->
      <rect x="340" y="23" width="26" height="40" rx="3" fill="#38bdf8" />
      <text x="353" y="48" fill="#0f172a" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">2</text>
      <!-- Beat 3 -->
      <rect x="450" y="23" width="26" height="40" rx="3" fill="#38bdf8" />
      <text x="463" y="48" fill="#0f172a" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">3</text>
      <!-- Beat 4 -->
      <rect x="560" y="23" width="26" height="40" rx="3" fill="#38bdf8" />
      <text x="573" y="48" fill="#0f172a" font-family="monospace" font-size="11" font-weight="900" text-anchor="middle">4</text>

      <!-- Row 2: Dotted-Eighth Delay Repeats (Offset by 3 sixteenths = 3/16) -->
      <g transform="translate(15, 95)">
        <rect width="180" height="26" rx="3" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
        <text x="90" y="17" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">DELAY (DOTTED 1/8 = 3/16)</text>
      </g>
      <!-- Repeat 1: on beat 1-e-and-A (16th note 4) -->
      <rect x="312" y="88" width="26" height="40" rx="3" fill="#fbbf24" />
      <text x="325" y="113" fill="#0f172a" font-family="monospace" font-size="10" font-weight="900" text-anchor="middle">e</text>
      <!-- Repeat 2 -->
      <rect x="422" y="88" width="26" height="40" rx="3" fill="#fbbf24" />
      <text x="435" y="113" fill="#0f172a" font-family="monospace" font-size="10" font-weight="900" text-anchor="middle">e</text>
      <!-- Repeat 3 -->
      <rect x="532" y="88" width="26" height="40" rx="3" fill="#fbbf24" />
      <text x="545" y="113" fill="#0f172a" font-family="monospace" font-size="10" font-weight="900" text-anchor="middle">e</text>

      <!-- Combined Interlocking Gallop Row -->
      <line x1="15" y1="150" x2="635" y2="150" stroke="#1e293b" stroke-width="1" />
      <g transform="translate(15, 165)">
        <rect width="180" height="26" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1" />
        <text x="90" y="17" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">COMPOSITE GROOVE</text>
      </g>
      <g transform="translate(205, 165)">
        <rect width="430" height="26" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="215" y="17" fill="#e2e8f0" font-family="monospace" font-size="10.5" font-weight="700" text-anchor="middle">1 . . e 2 . . e 3 . . e 4 (The Edge Gallop Pattern)</text>
      </g>
    </g>

    <!-- Bottom summary tag -->
    <g transform="translate(180, 255)">
      <rect width="380" height="36" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1" />
      <text x="190" y="22" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Dotted 1/8 = 3 Sixteenth Notes (3/16)</text>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 12)">
      <rect width="75" height="20" rx="3" fill="#0284c7" />
      <text x="37" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="98" y="27" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Dotted-eighth delay lands on the 16th-note offbeat, creating an interlocking gallop.</text>
  </g>
</svg>
