<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Meter Gradient -->
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" rx="14" fill="url(#bgMono)" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="180" height="24" rx="6" fill="#7f1d1d" fill-opacity="0.4" stroke="#f43f5e" stroke-width="1.2" />
    <text x="90" y="16" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">STEREO &amp; MONO ANALYSIS</text>
    
    <text x="195" y="18" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">Mono Compatibility &amp; Phase Correlation</text>
    <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Checking phase correlation (+1 to -1) prevents destructive cancellation when stereo audio collapses to a single speaker.
    </text>
  </g>

  <!-- Top Display: Phase Correlation Meter (X: 50 to 830, Y: 80 to 200) -->
  <g transform="translate(50, 80)">
    <rect width="780" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <text x="25" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Phase Correlation Meter</text>
    <text x="755" y="28" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">Target Zone: +0.4 to +1.0</text>

    <!-- Meter Track -->
    <rect x="25" y="42" width="730" height="24" rx="12" fill="#020617" stroke="#1e293b" />
    <rect x="27" y="44" width="726" height="20" rx="10" fill="url(#meterGrad)" />

    <!-- Center Zero Divider line -->
    <line x1="390" y1="36" x2="390" y2="72" stroke="#ffffff" stroke-width="2.5" />

    <!-- Scale Legend Numbers -->
    <text x="35" y="85" fill="#f87171" font-family="monospace" font-size="14" font-weight="800">-1.0</text>
    <text x="35" y="98" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700">180° Out of Phase (Cancellation)</text>

    <text x="390" y="85" fill="#fde68a" font-family="monospace" font-size="14" font-weight="800" text-anchor="middle">0.0</text>
    <text x="390" y="98" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Wide Stereo Decorrelation</text>

    <text x="745" y="85" fill="#67e8f9" font-family="monospace" font-size="14" font-weight="800" text-anchor="end">+1.0</text>
    <text x="745" y="98" fill="#06b6d4" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="end">100% In-Phase (Mono Sum)</text>
  </g>

  <!-- Bottom Display: Waveform Cancellation Scope (X: 50 to 830, Y: 215 to 415) -->
  <g transform="translate(50, 215)">
    <rect width="780" height="195" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <!-- Left Channel Waveform (Cyan) -->
    <g transform="translate(20, 20)">
      <rect width="230" height="75" rx="6" fill="#020617" stroke="#0ea5e9" stroke-width="1" />
      <line x1="0" y1="37" x2="230" y2="37" stroke="#1e293b" stroke-dasharray="2 2" />
      <text x="10" y="18" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700">Left Channel (+ Phase)</text>
      <!-- Sine wave positive first -->
      <path d="M 10,37 Q 35,5 60,37 T 110,37 T 160,37 T 210,37" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    </g>

    <!-- Plus Sign -->
    <text x="270" y="65" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle">+</text>

    <!-- Right Channel Inverted Waveform (Rose / Red) -->
    <g transform="translate(290, 20)">
      <rect width="230" height="75" rx="6" fill="#020617" stroke="#f43f5e" stroke-width="1" />
      <line x1="0" y1="37" x2="230" y2="37" stroke="#1e293b" stroke-dasharray="2 2" />
      <text x="10" y="18" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700">Right Channel (-180° Inverted)</text>
      <!-- Sine wave inverted negative first -->
      <path d="M 10,37 Q 35,69 60,37 T 110,37 T 160,37 T 210,37" fill="none" stroke="#f43f5e" stroke-width="2.5" />
    </g>

    <!-- Equals Sign -->
    <text x="540" y="65" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle">=</text>

    <!-- Mono Summed Result: Complete Silence / Cancellation Flatline -->
    <g transform="translate(560, 20)">
      <rect width="200" height="75" rx="6" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.8" />
      <line x1="0" y1="37" x2="200" y2="37" stroke="#ef4444" stroke-width="3" filter="url(#glowRed)" />
      <text x="10" y="18" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800">Mono Sum (Fold-Down)</text>
      <text x="100" y="55" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TOTAL SILENCE (0 dB)</text>
      <text x="100" y="68" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Complete Destructive Phase Null</text>
    </g>

    <!-- Explanatory Bullets inside bottom box -->
    <g transform="translate(25, 115)">
      <rect width="730" height="65" rx="6" fill="#020617" stroke="#1e293b" />
      <text x="15" y="24" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">Real-World Consequence:</text>
      <text x="180" y="24" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Artificial stereo wideners delay or invert one channel to fake width.</text>

      <text x="15" y="48" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">Mobile &amp; Club Problem:</text>
      <text x="180" y="48" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">Smartphones, bluetooth speakers, and club subwoofers sum to mono—the instrument vanishes entirely!</text>
    </g>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(50, 424)">
    <rect width="780" height="80" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.2" />

    <text x="20" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">How to Protect Your Mix:</text>
    <text x="20" y="44" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      • Keep the correlation meter between <tspan fill="#38bdf8" font-weight="700">+0.3 and +1.0</tspan>; readings dipping into negative values indicate severe phase cancellation.
    </text>
    <text x="20" y="64" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      • Regularly press the <tspan fill="#34d399" font-weight="700">Mono Button</tspan> on your master bus during mixdown to ensure vocals, kick, and lead guitars retain full punch.
    </text>
  </g>
</svg>
