<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ACOUSTIC ECHO CHAMBER</text>
    <rect x="262" y="0" width="310" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="417" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Dedicated Reflective Physical Room</text>
  </g>

  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#shadow)" />
    
    <!-- Chamber Room Boundary (Tiled/Concrete Room) -->
    <g transform="translate(50, 20)">
      <polygon points="50,20 590,20 620,205 20,205" fill="#0b1120" stroke="#64748b" stroke-width="2" />
      
      <!-- Concrete tile grid markings on back wall -->
      <line x1="50" y1="80" x2="590" y2="80" stroke="#1e293b" stroke-width="1" />
      <line x1="35" y1="140" x2="605" y2="140" stroke="#1e293b" stroke-width="1" />
      <line x1="200" y1="20" x2="180" y2="205" stroke="#1e293b" stroke-width="1" />
      <line x1="440" y1="20" x2="460" y2="205" stroke="#1e293b" stroke-width="1" />

      <!-- Speaker Playing Dry Audio -->
      <g transform="translate(100, 110)">
        <polygon points="0,0 25,-15 25,45 0,30" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <rect x="-20" y="5" width="20" height="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <!-- Soundwaves -->
        <path d="M 35,0 A 25,25 0 0,1 35,30" fill="none" stroke="#38bdf8" stroke-width="2" />
        <path d="M 45,-10 A 40,40 0 0,1 45,40" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2" />
        <rect x="-40" y="55" width="100" height="22" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="10" y="69" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">LOUDSPEAKER</text>
      </g>

      <!-- Acoustic Reflections bouncing around -->
      <path d="M 170,100 L 320,30 L 480,180 L 520,70" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="4 3" />

      <!-- Microphones Picking up Wet Ambience -->
      <g transform="translate(500, 95)">
        <rect x="-8" y="-20" width="16" height="36" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="2" />
        <line x1="0" y1="16" x2="0" y2="40" stroke="#10b981" stroke-width="2" />
        <rect x="-45" y="48" width="90" height="22" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1" />
        <text x="0" y="62" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">MICROPHONES</text>
      </g>
    </g>

    <!-- Characteristics Strip -->
    <g transform="translate(130, 255)">
      <rect x="0" y="0" width="150" height="26" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="0.8" />
      <text x="75" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Tiled / Concrete Walls</text>

      <rect x="165" y="0" width="150" height="26" rx="4" fill="#0b1120" stroke="#fbbf24" stroke-width="0.8" />
      <text x="240" y="17" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Authentic 3D Air Physics</text>

      <rect x="330" y="0" width="150" height="26" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="0.8" />
      <text x="405" y="17" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Historic Studios (Capitol/Abbey)</text>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="24" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="44" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Definition: An acoustic chamber is a physical reflective room with a speaker and microphones capturing real room reverberation.</text>
  </g>
</svg>