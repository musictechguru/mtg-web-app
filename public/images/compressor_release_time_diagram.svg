<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="440" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Header Badge -->
  <rect x="30" y="22" width="240" height="32" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="150" y="43" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">COMPRESSOR RELEASE TIME</text>
  <text x="290" y="43" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">How quickly gain returns to normal after audio drops below the threshold</text>

  <!-- Panel 1: Fast Release -->
  <g transform="translate(30, 74)">
    <rect width="355" height="270" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Title Badge -->
    <rect x="16" y="16" width="155" height="26" rx="5" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="93" y="33" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FAST RELEASE (&lt; 50ms)</text>
    <text x="185" y="33" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Snappy Gain Recovery</text>

    <!-- Threshold Reference Line -->
    <line x1="20" y1="120" x2="335" y2="120" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4" />
    <text x="330" y="113" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="end">THRESHOLD LEVEL</text>

    <!-- Signal envelope: Peak hits, drops below threshold, rapid release restores gain -->
    <path d="M 30,185 Q 55,185 65,70 Q 75,130 95,150 L 140,150 L 160,185 L 330,185" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3" />

    <!-- Gain Reduction recovery curve (Red to Green) -->
    <!-- Attenuation dip at peak (x:65-95), then rapid rise back to unity (x:95-150) -->
    <path d="M 30,185 L 60,185 L 65,110 L 95,130 Q 120,135 140,185 L 330,185" fill="none" stroke="#38bdf8" stroke-width="3" />

    <!-- Gain Recovery Phase Shading -->
    <path d="M 95,130 Q 120,135 140,185 L 95,185 Z" fill="#10b981" fill-opacity="0.25" />

    <!-- Fast Release Indicator -->
    <line x1="95" y1="195" x2="140" y2="195" stroke="#10b981" stroke-width="2" />
    <line x1="95" y1="190" x2="95" y2="200" stroke="#10b981" stroke-width="2" />
    <line x1="140" y1="190" x2="140" y2="200" stroke="#10b981" stroke-width="2" />
    <text x="117" y="209" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Fast Recovery</text>

    <text x="190" y="165" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Full Gain Restored</text>

    <!-- Explanatory Box -->
    <rect x="16" y="218" width="323" height="42" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="26" y="234" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">• Promptly brings track volume back up between hits</text>
    <text x="26" y="249" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• High energy, but risk of pumping or low-frequency bass fuzz</text>
  </g>

  <!-- Panel 2: Slow Release -->
  <g transform="translate(415, 74)">
    <rect width="355" height="270" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Title Badge -->
    <rect x="16" y="16" width="165" height="26" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.2" />
    <text x="98" y="33" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SLOW RELEASE (500ms+)</text>
    <text x="195" y="33" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Smooth &amp; Transparent</text>

    <!-- Threshold Reference Line -->
    <line x1="20" y1="120" x2="335" y2="120" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4" />
    <text x="330" y="113" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="end">THRESHOLD LEVEL</text>

    <!-- Ghost Base -->
    <path d="M 30,185 Q 55,185 65,70 Q 75,130 95,150 L 140,150 L 160,185 L 330,185" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3" />

    <!-- Real Output (Blue: delayed recovery stretching far to the right) -->
    <path d="M 30,185 L 60,185 L 65,110 L 95,130 Q 180,140 280,185 L 330,185" fill="none" stroke="#38bdf8" stroke-width="3" />

    <!-- Slow Gain Recovery Phase Shading -->
    <path d="M 95,130 Q 180,140 280,185 L 95,185 Z" fill="#f59e0b" fill-opacity="0.2" />

    <!-- Slow Release Indicator Bracket -->
    <line x1="95" y1="195" x2="280" y2="195" stroke="#f59e0b" stroke-width="2" />
    <line x1="95" y1="190" x2="95" y2="200" stroke="#f59e0b" stroke-width="2" />
    <line x1="280" y1="190" x2="280" y2="200" stroke="#f59e0b" stroke-width="2" />
    <text x="187" y="209" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Long Gradual Recovery Zone</text>

    <text x="215" y="152" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Still Compressing!</text>

    <!-- Explanatory Box -->
    <rect x="16" y="218" width="323" height="42" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="26" y="234" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">• Very gradual, musical recovery without abrupt volume jumps</text>
    <text x="26" y="249" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• If too slow, swallows next transient before gain resets</text>
  </g>

  <!-- Bottom Key Rule Callout -->
  <g transform="translate(30, 358)">
    <rect width="740" height="64" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="36" cy="32" r="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <text x="36" y="37" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">i</text>
    
    <text x="64" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Edexcel Exam Tip: Release Time &amp; Tempo Sync</text>
    <text x="64" y="47" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Setting release time to breathe in time with track tempo (e.g. recovering right before the next snare hit) creates a musical bounce.</text>
  </g>
</svg>