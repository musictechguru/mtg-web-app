<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="30" y="24" width="270" height="32" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
  <text x="165" y="45" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">STUCK NOTES &amp; PANIC COMMAND</text>
  <text x="320" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Resolving hanging synthesizer notes caused by missed Note-Off messages</text>

  <!-- LEFT PANEL: The Problem (Missing Note-Off) -->
  <g transform="translate(50, 75)">
    <rect x="0" y="0" width="335" height="240" rx="8" fill="#0b1120" stroke="#ef4444" stroke-width="1.5" />
    <rect x="15" y="15" width="305" height="26" rx="4" fill="#7f1d1d" />
    <text x="167" y="32" fill="#fecaca" font-size="11" font-weight="700" text-anchor="middle">THE PROBLEM: HANGING NOTE</text>

    <!-- Sequence steps -->
    <rect x="20" y="55" width="295" height="40" rx="4" fill="#1e293b" stroke="#38bdf8" />
    <text x="35" y="78" fill="#38bdf8" font-size="11" font-weight="700">1. Note-On Received</text>
    <text x="180" y="78" fill="#cbd5e1" font-size="11">(0x90 • Key 60 • Vel 100)</text>

    <!-- Broken cable / dropped data icon -->
    <path d="M 167,100 L 167,115" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />
    <text x="167" y="130" fill="#ef4444" font-size="10" font-weight="800" text-anchor="middle">✖ NOTE-OFF MESSAGE DROPPED!</text>

    <rect x="20" y="145" width="295" height="75" rx="4" fill="#450a0a" stroke="#ef4444" />
    <text x="167" y="170" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle">SYNTH OSCILLATOR RUNAWAY</text>
    <text x="167" y="190" fill="#fecaca" font-size="10" text-anchor="middle">Without Note-Off, VCA envelope stays open</text>
    <text x="167" y="205" fill="#f87171" font-size="10" font-weight="700" text-anchor="middle">→ Sound sustains endlessly at full volume</text>
  </g>

  <!-- RIGHT PANEL: The Solution (Note-Off / CC 123 All Notes Off) -->
  <g transform="translate(415, 75)">
    <rect x="0" y="0" width="335" height="240" rx="8" fill="#0b1120" stroke="#22c55e" stroke-width="1.5" />
    <rect x="15" y="15" width="305" height="26" rx="4" fill="#14532d" />
    <text x="167" y="32" fill="#bbf7d0" font-size="11" font-weight="700" text-anchor="middle">THE SOLUTION: NOTE-OFF / PANIC</text>

    <!-- Fix Step 1 -->
    <rect x="20" y="55" width="295" height="50" rx="4" fill="#1e293b" stroke="#22c55e" />
    <text x="35" y="75" fill="#4ade80" font-size="11" font-weight="700">Option A: Send Specific Note-Off</text>
    <text x="35" y="93" fill="#cbd5e1" font-size="10">Sends 0x80 (or Note-On with Velocity 0)</text>

    <!-- Fix Step 2 -->
    <rect x="20" y="115" width="295" height="50" rx="4" fill="#1e293b" stroke="#22c55e" />
    <text x="35" y="135" fill="#4ade80" font-size="11" font-weight="700">Option B: MIDI Panic (CC 123)</text>
    <text x="35" y="153" fill="#cbd5e1" font-size="10">Sends "All Notes Off" broadcast to all voices</text>

    <!-- Result Banner -->
    <rect x="20" y="175" width="295" height="45" rx="4" fill="#052e16" stroke="#22c55e" />
    <text x="167" y="195" fill="#86efac" font-size="11" font-weight="700" text-anchor="middle">✓ VCA ENVELOPE CLOSES</text>
    <text x="167" y="210" fill="#cbd5e1" font-size="10" text-anchor="middle">All audio voices immediately release to silence</text>
  </g>

  <!-- Footer Information Strip -->
  <rect x="50" y="330" width="700" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="70" y="354" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">HOW MIDI NOTE-OFF OPERATES:</text>
  <text x="70" y="374" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">In MIDI specification 1.0, a Note-Off can be transmitted as status byte <strong style="fill:#38bdf8;">0x80</strong>, or as a <strong style="fill:#38bdf8;">Note-On (0x90) with Velocity 0</strong>.</text>
  <text x="70" y="390" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">If data is interrupted (unplugging cable while playing), hitting the DAW <strong style="fill:#ef4444;">MIDI Panic Button (CC 123)</strong> flushes all stuck voices.</text>
</svg>
