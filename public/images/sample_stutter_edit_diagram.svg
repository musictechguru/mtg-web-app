<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="sliceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="30" y="24" width="220" height="32" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
  <text x="140" y="45" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">SAMPLE STUTTER EDIT</text>
  <text x="270" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Rapidly retriggering micro-slices on rhythmic grid subdivisions</text>

  <!-- ORIGINAL PHRASE PANEL -->
  <g transform="translate(50, 75)">
    <rect x="0" y="0" width="700" height="95" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1" />
    <text x="15" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">ORIGINAL VOCAL PHRASE ("YEAH!")</text>
    <line x1="0" y1="55" x2="700" y2="55" stroke="#1e293b" stroke-width="1" />

    <!-- Continuous vocal wave -->
    <path d="M 20,55 L 45,20 L 70,85 L 100,28 L 130,80 L 170,35 L 220,70 L 280,45 L 350,62 L 420,55 L 500,55" 
          fill="none" stroke="#38bdf8" stroke-width="2" />

    <!-- Highlighted Micro-Slice -->
    <rect x="30" y="5" width="55" height="85" fill="#ec4899" fill-opacity="0.25" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="57" y="22" fill="#f472b6" font-size="9" font-weight="700" text-anchor="middle">MICRO-SLICE</text>
    <text x="100" y="58" fill="#e2e8f0" font-size="12" font-style="italic">"Y-..."</text>
    <text x="200" y="58" fill="#64748b" font-size="12" font-style="italic">"...eah!"</text>
  </g>

  <!-- STUTTER RETRIGGERING SEQUENCE -->
  <g transform="translate(50, 185)">
    <rect x="0" y="0" width="700" height="130" rx="6" fill="#0b1120" stroke="#ec4899" stroke-width="1.5" />
    <text x="15" y="20" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">STUTTER SEQUENCE (1/16th &amp; 1/32nd NOTE RETRIGGERS)</text>
    
    <!-- Timeline Grid lines (16th notes) -->
    <g stroke="#1e293b" stroke-width="1" stroke-dasharray="2,2">
      <line x1="80" y1="30" x2="80" y2="120" />
      <line x1="150" y1="30" x2="150" y2="120" />
      <line x1="220" y1="30" x2="220" y2="120" />
      <line x1="290" y1="30" x2="290" y2="120" />
      <line x1="360" y1="30" x2="360" y2="120" />
      <line x1="410" y1="30" x2="410" y2="120" />
      <line x1="460" y1="30" x2="460" y2="120" />
      <line x1="510" y1="30" x2="510" y2="120" />
      <line x1="560" y1="30" x2="560" y2="120" />
    </g>

    <!-- 1/16th Note Repeated Slices (Beats 1, 2, 3) -->
    <!-- Slice 1 -->
    <rect x="20" y="45" width="50" height="65" rx="4" fill="url(#sliceGrad)" stroke="#f472b6" stroke-width="1" />
    <text x="45" y="82" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">"Y-"</text>
    <text x="45" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">1/16</text>

    <!-- Slice 2 -->
    <rect x="90" y="45" width="50" height="65" rx="4" fill="url(#sliceGrad)" stroke="#f472b6" stroke-width="1" />
    <text x="115" y="82" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">"Y-"</text>
    <text x="115" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">1/16</text>

    <!-- Slice 3 -->
    <rect x="160" y="45" width="50" height="65" rx="4" fill="url(#sliceGrad)" stroke="#f472b6" stroke-width="1" />
    <text x="185" y="82" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">"Y-"</text>
    <text x="185" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">1/16</text>

    <!-- Slice 4 -->
    <rect x="230" y="45" width="50" height="65" rx="4" fill="url(#sliceGrad)" stroke="#f472b6" stroke-width="1" />
    <text x="255" y="82" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">"Y-"</text>
    <text x="255" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">1/16</text>

    <!-- Acceleration into 1/32nd note rapid fire roll -->
    <rect x="300" y="45" width="30" height="65" rx="3" fill="#be185d" stroke="#f472b6" stroke-width="1" />
    <text x="315" y="82" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Y-</text>
    <rect x="340" y="45" width="30" height="65" rx="3" fill="#be185d" stroke="#f472b6" stroke-width="1" />
    <text x="355" y="82" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Y-</text>
    <rect x="380" y="45" width="30" height="65" rx="3" fill="#be185d" stroke="#f472b6" stroke-width="1" />
    <text x="395" y="82" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Y-</text>
    <rect x="420" y="45" width="30" height="65" rx="3" fill="#be185d" stroke="#f472b6" stroke-width="1" />
    <text x="435" y="82" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Y-</text>
    <text x="375" y="122" fill="#ec4899" font-size="10" font-weight="700" text-anchor="middle">1/32 Roll</text>

    <!-- Final Resolved Full Sample -->
    <rect x="470" y="45" width="210" height="65" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
    <text x="575" y="82" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">"YEAH!" (Full Release)</text>
    <text x="575" y="122" fill="#38bdf8" font-size="10" text-anchor="middle">Full playback at Beat Drop</text>
  </g>

  <!-- Footer Information Strip -->
  <rect x="50" y="330" width="700" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="70" y="354" fill="#ec4899" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">THE STUTTER EDIT IN ELECTRONIC PRODUCTION:</text>
  <text x="70" y="374" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Created by slicing a tiny rhythmic fraction of audio (1/16, 1/32, or 1/64) and rapidly looping/retriggering it.</text>
  <text x="70" y="390" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Popularized by BT and modern glitch plugins (e.g. Stutter Edit, dBlue Glitch) to build energy before drops.</text>
</svg>
