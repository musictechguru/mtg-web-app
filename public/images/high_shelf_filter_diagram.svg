<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="boostShelfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cutShelfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.3" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Outer Header -->
  <g transform="translate(30, 20)">
    <rect width="290" height="30" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="145" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">HIGH-SHELF EQUALIZER FILTER</text>
    <text x="305" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Uniform broad boost or cut across all frequencies above a set point</text>
  </g>

  <!-- Main Frequency Response Display Card -->
  <g transform="translate(30, 62)">
    <rect width="740" height="304" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

    <!-- Graph Screen -->
    <rect x="50" y="30" width="670" height="190" rx="4" fill="#0b1120" stroke="#1e293b" />

    <!-- Horizontal Gain Grid Lines -->
    <!-- +9 dB -->
    <line x1="50" y1="50" x2="720" y2="50" stroke="#1e293b" stroke-width="1" stroke-dasharray="2" />
    <text x="44" y="53" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="end">+9 dB</text>

    <!-- +6 dB (Boost Shelf Level) -->
    <line x1="50" y1="70" x2="720" y2="70" stroke="#0284c7" stroke-width="1" stroke-dasharray="3" />
    <text x="44" y="73" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="end">+6 dB</text>

    <!-- 0 dB (Unity Line) -->
    <line x1="50" y1="125" x2="720" y2="125" stroke="#475569" stroke-width="1.5" />
    <text x="44" y="128" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="end">0 dB</text>

    <!-- -6 dB (Cut Shelf Level) -->
    <line x1="50" y1="180" x2="720" y2="180" stroke="#e11d48" stroke-width="1" stroke-dasharray="3" />
    <text x="44" y="183" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="end">-6 dB</text>

    <!-- -9 dB -->
    <line x1="50" y1="200" x2="720" y2="200" stroke="#1e293b" stroke-width="1" stroke-dasharray="2" />
    <text x="44" y="203" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="end">-9 dB</text>

    <!-- Vertical Grid Lines (Log Frequency) -->
    <!-- 100 Hz -->
    <line x1="140" y1="30" x2="140" y2="220" stroke="#1e293b" stroke-width="1" />
    <text x="140" y="235" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">100 Hz</text>

    <!-- 500 Hz -->
    <line x1="280" y1="30" x2="280" y2="220" stroke="#1e293b" stroke-width="1" />
    <text x="280" y="235" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">500 Hz</text>

    <!-- 1 kHz -->
    <line x1="380" y1="30" x2="380" y2="220" stroke="#1e293b" stroke-width="1" />
    <text x="380" y="235" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">1 kHz</text>

    <!-- 5 kHz (Corner/Transition Frequency) -->
    <line x1="510" y1="30" x2="510" y2="220" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3" />
    <text x="510" y="235" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">5 kHz</text>

    <!-- 10 kHz -->
    <line x1="620" y1="30" x2="620" y2="220" stroke="#1e293b" stroke-width="1" />
    <text x="620" y="235" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">10 kHz</text>

    <!-- 20 kHz -->
    <line x1="720" y1="30" x2="720" y2="220" stroke="#1e293b" stroke-width="1" />
    <text x="720" y="235" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">20 kHz</text>

    <!-- SHADING UNDER BOOST SHELF (+6 dB) -->
    <path d="M 50,125 L 430,125 Q 480,125 510,97 Q 540,70 590,70 L 720,70 L 720,125 Z" fill="url(#boostShelfGrad)" />

    <!-- SHADING UNDER CUT SHELF (-6 dB) -->
    <path d="M 50,125 L 430,125 Q 480,125 510,153 Q 540,180 590,180 L 720,180 L 720,125 Z" fill="url(#cutShelfGrad)" />

    <!-- SHELF BOOST CURVE (+6 dB Shelf) -->
    <path d="M 50,125 L 430,125 Q 480,125 510,97 Q 540,70 590,70 L 720,70" fill="none" stroke="#38bdf8" stroke-width="3" />

    <!-- SHELF CUT CURVE (-6 dB Shelf) -->
    <path d="M 50,125 L 430,125 Q 480,125 510,153 Q 540,180 590,180 L 720,180" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4" />

    <!-- CORNER FREQUENCY DOTS (at 5 kHz) -->
    <circle cx="510" cy="97" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="510" cy="153" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.2" />

    <!-- Boost Shelf Callout Badge -->
    <rect x="580" y="44" width="130" height="22" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="645" y="58" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">+6 dB HIGH SHELF BOOST</text>

    <!-- Cut Shelf Callout Badge -->
    <rect x="580" y="186" width="130" height="22" rx="3" fill="#0f172a" stroke="#f43f5e" stroke-width="1" />
    <text x="645" y="200" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">-6 dB HIGH SHELF CUT</text>

    <!-- Transition / Corner Annotation -->
    <rect x="250" y="78" width="190" height="38" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="345" y="93" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CORNER FREQUENCY (5 kHz)</text>
    <text x="345" y="106" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Midpoint transition into the flat shelf</text>

    <!-- Bottom 3 Explanatory Feature Cards -->
    <g transform="translate(50, 250)">
      <!-- Card 1: Operating Principle -->
      <rect width="210" height="44" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="105" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">BROAD FREQUENCY ACTION</text>
      <text x="105" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">Affects ALL frequencies above the corner</text>

      <!-- Card 2: Plateau vs Filter -->
      <g transform="translate(230, 0)">
        <rect width="210" height="44" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
        <text x="105" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">FLAT SHELF PLATEAU</text>
        <text x="105" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">Levels off flat (does NOT continuously cut)</text>
      </g>

      <!-- Card 3: Common Mixing Application -->
      <g transform="translate(460, 0)">
        <rect width="210" height="44" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
        <text x="105" y="16" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">MIXING APPLICATION</text>
        <text x="105" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">Adds vocal 'air' / acoustic guitar brilliance</text>
      </g>
    </g>
  </g>

  <!-- Bottom Key Exam Takeaway -->
  <g transform="translate(30, 380)">
    <rect width="740" height="82" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="36" cy="41" r="14" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <text x="36" y="46" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">i</text>
    
    <text x="64" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Edexcel Exam Concept: High-Shelf Filter Mechanics</text>
    <text x="64" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• A <tspan fill="#38bdf8" font-weight="bold">High-Shelf Filter</tspan> applies a uniform boost or cut to <tspan fill="#38bdf8" font-weight="bold">all frequencies above its corner frequency</tspan>.</text>
    <text x="64" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Unlike a Low-Pass / High-Cut filter (which rolls off infinitely into silence), a shelf reaches a <tspan fill="#fbbf24" font-weight="bold">flat horizontal plateau</tspan> (e.g. +6 dB).</text>
    <text x="64" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Widely used for broad tone shaping—such as adding top-end sparkle and "air" to vocals or darkening a bright acoustic instrument.</text>
  </g>
</svg>
