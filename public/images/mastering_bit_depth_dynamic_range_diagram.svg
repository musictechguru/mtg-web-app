<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Header Badges -->
  <g transform="translate(30, 16)">
    <rect width="180" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="90" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">DIGITAL BIT DEPTH</text>
    <rect x="192" y="0" width="460" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="422" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Amplitude Quantization, Dynamic Range &amp; Theoretical Noise Floor</text>
  </g>

  <!-- Main Comparison Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="340" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left Column: What is Bit Depth? (Quantization Grid) -->
    <g transform="translate(20, 18)">
      <rect width="345" height="304" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2" />
      
      <!-- Title Badge -->
      <g transform="translate(15, 12)">
        <rect width="315" height="26" rx="4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8" />
        <text x="157" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">WHAT IS BIT DEPTH? (AMPLITUDE)</text>
      </g>

      <!-- Quantization Grid Graphic -->
      <g transform="translate(15, 46)">
        <rect width="315" height="110" rx="4" fill="#030712" stroke="#1e293b" />
        
        <!-- Y-Axis and X-Axis lines -->
        <line x1="35" y1="10" x2="35" y2="95" stroke="#334155" stroke-width="1.5" />
        <line x1="35" y1="95" x2="300" y2="95" stroke="#334155" stroke-width="1.5" />

        <!-- Quantization Grid Lines -->
        <line x1="35" y1="25" x2="300" y2="25" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" />
        <line x1="35" y1="45" x2="300" y2="45" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" />
        <line x1="35" y1="65" x2="300" y2="65" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" />
        <line x1="35" y1="80" x2="300" y2="80" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" />

        <!-- Stepped Quantized Waveform -->
        <path d="M 40,95 L 65,65 L 90,65 L 90,45 L 115,45 L 115,25 L 155,25 L 155,45 L 180,45 L 180,65 L 205,65 L 205,80 L 230,80 L 230,95 L 255,95 L 255,80 L 280,80 L 295,95" fill="none" stroke="#38bdf8" stroke-width="2.5" />

        <!-- Axis Labels in Badges -->
        <g transform="translate(5, 20)">
          <rect width="25" height="14" rx="2" fill="#0f172a" />
          <text x="12" y="10" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" text-anchor="middle">+V</text>
        </g>
        <g transform="translate(5, 80)">
          <rect width="25" height="14" rx="2" fill="#0f172a" />
          <text x="12" y="10" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" text-anchor="middle">-V</text>
        </g>
        <g transform="translate(200, 10)">
          <rect width="105" height="15" rx="2" fill="#0c4a6e" />
          <text x="52" y="11" fill="#7dd3fc" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">VOLTAGE STEPS</text>
        </g>
      </g>

      <!-- Resolution Comparison Cards -->
      <g transform="translate(15, 164)">
        <!-- 16-bit card -->
        <g transform="translate(0, 0)">
          <rect width="315" height="38" rx="3" fill="#0f172a" stroke="#1e293b" />
          <g transform="translate(8, 8)">
            <rect width="80" height="22" rx="2" fill="#1e293b" />
            <text x="40" y="15" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">16-BIT (CD)</text>
          </g>
          <g transform="translate(95, 8)">
            <rect width="212" height="22" rx="2" fill="#0b1120" />
            <text x="106" y="15" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" text-anchor="middle">65,536 Discrete Amplitude Steps</text>
          </g>
        </g>

        <!-- 24-bit card -->
        <g transform="translate(0, 44)">
          <rect width="315" height="38" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
          <g transform="translate(8, 8)">
            <rect width="80" height="22" rx="2" fill="#064e3b" />
            <text x="40" y="15" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">24-BIT (PRO)</text>
          </g>
          <g transform="translate(95, 8)">
            <rect width="212" height="22" rx="2" fill="#0b1120" />
            <text x="106" y="15" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">16,777,216 Steps (256x More Precision)</text>
          </g>
        </g>

        <!-- 32-bit float card -->
        <g transform="translate(0, 88)">
          <rect width="315" height="38" rx="3" fill="#0f172a" stroke="#a855f7" stroke-width="0.8" />
          <g transform="translate(8, 8)">
            <rect width="80" height="22" rx="2" fill="#3b0764" />
            <text x="40" y="15" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">32-BIT FLOAT</text>
          </g>
          <g transform="translate(95, 8)">
            <rect width="212" height="22" rx="2" fill="#0b1120" />
            <text x="106" y="15" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" text-anchor="middle">&gt;1500 dB (Clipping Impossible in DAW)</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Right Column: Why is it Important? (Dynamic Range & Noise Floor) -->
    <g transform="translate(380, 18)">
      <rect width="340" height="304" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />

      <!-- Title Badge -->
      <g transform="translate(15, 12)">
        <rect width="310" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
        <text x="155" y="17" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">WHY IS IT IMPORTANT? (DYNAMIC RANGE)</text>
      </g>

      <!-- Golden Rule Chip -->
      <g transform="translate(15, 46)">
        <rect width="310" height="32" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
        <text x="155" y="21" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">GOLDEN RULE: 1 BIT = 6 dB DYNAMIC RANGE</text>
      </g>

      <!-- Range Comparison Bars -->
      <g transform="translate(15, 86)">
        <!-- 16-bit visual bar -->
        <g transform="translate(0, 0)">
          <rect width="310" height="42" rx="3" fill="#0f172a" stroke="#1e293b" />
          <g transform="translate(8, 10)">
            <rect width="90" height="22" rx="2" fill="#1e293b" />
            <text x="45" y="15" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">16-BIT NOISE</text>
          </g>
          <g transform="translate(105, 10)">
            <rect width="197" height="22" rx="2" fill="#0b1120" />
            <text x="98" y="15" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">96 dB Dynamic Range (-96 dBFS)</text>
          </g>
        </g>

        <!-- 24-bit visual bar -->
        <g transform="translate(0, 48)">
          <rect width="310" height="42" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
          <g transform="translate(8, 10)">
            <rect width="90" height="22" rx="2" fill="#064e3b" />
            <text x="45" y="15" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">24-BIT NOISE</text>
          </g>
          <g transform="translate(105, 10)">
            <rect width="197" height="22" rx="2" fill="#0b1120" />
            <text x="98" y="15" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">144 dB Dynamic Range (-144 dBFS)</text>
          </g>
        </g>
      </g>

      <!-- 3 Key Takeaways in Chips -->
      <g transform="translate(15, 184)">
        <g transform="translate(0, 0)">
          <rect width="310" height="24" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="155" y="16" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" text-anchor="middle">1. Eliminates digital quantization distortion on quiet fades</text>
        </g>
        <g transform="translate(0, 28)">
          <rect width="310" height="24" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="155" y="16" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" text-anchor="middle">2. Provides massive recording headroom to prevent clipping</text>
        </g>
        <g transform="translate(0, 56)">
          <rect width="310" height="24" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
          <text x="155" y="16" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">3. Preserves micro-dynamics, reverb tails &amp; punch</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar with Enclosed Badge -->
  <g transform="translate(30, 412)">
    <rect width="740" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 14)">
      <rect width="80" height="20" rx="3" fill="#0284c7" />
      <text x="40" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <g transform="translate(100, 12)">
      <rect width="628" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="314" y="16" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Bit depth determines amplitude precision, giving 6 dB of dynamic range per bit and lowering the digital noise floor.</text>
    </g>
  </g>
</svg>
