<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Boost Gradient Fill -->
    <linearGradient id="boostFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <!-- Cut Gradient Fill -->
    <linearGradient id="cutFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Header Section -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="140" height="24" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="70" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">EQ PARAMETERS</text>
    
    <text x="155" y="18" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">Cut vs. Boost (Subtractive vs. Additive EQ)</text>
    <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Adjusting gain: Boosting increases frequency amplitude while cutting attenuates frequency amplitude.
    </text>
  </g>

  <!-- Analyzer Grid Viewport (X: 70 to 810, Y: 85 to 395, Height: 310) -->
  <rect x="70" y="85" width="740" height="310" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Grid Lines (Horizontal Gain) -->
  <!-- +12 dB -->
  <line x1="70" y1="120" x2="810" y2="120" stroke="#1e293b" stroke-width="1" />
  <text x="62" y="124" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">+12 dB</text>

  <!-- +6 dB -->
  <line x1="70" y1="180" x2="810" y2="180" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />
  <text x="62" y="184" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">+6 dB</text>

  <!-- 0 dB Center Reference Line -->
  <line x1="70" y1="240" x2="810" y2="240" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 4" />
  <text x="62" y="244" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">0 dB</text>
  <text x="816" y="244" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Unity / Flat</text>

  <!-- -6 dB -->
  <line x1="70" y1="300" x2="810" y2="300" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />
  <text x="62" y="304" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">-6 dB</text>

  <!-- -12 dB -->
  <line x1="70" y1="360" x2="810" y2="360" stroke="#1e293b" stroke-width="1" />
  <text x="62" y="364" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">-12 dB</text>

  <!-- Grid Lines (Vertical Frequencies) -->
  <!-- 50 Hz -->
  <line x1="150" y1="85" x2="150" y2="395" stroke="#1e293b" stroke-width="1" />
  <text x="150" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">50 Hz</text>

  <!-- 200 Hz -->
  <line x1="260" y1="85" x2="260" y2="395" stroke="#1e293b" stroke-width="1" />
  <text x="260" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">200 Hz</text>

  <!-- 500 Hz -->
  <line x1="370" y1="85" x2="370" y2="395" stroke="#1e293b" stroke-width="1" />
  <text x="370" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">500 Hz</text>

  <!-- 1 kHz -->
  <line x1="470" y1="85" x2="470" y2="395" stroke="#1e293b" stroke-width="1" />
  <text x="470" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">1 kHz</text>

  <!-- 4 kHz -->
  <line x1="610" y1="85" x2="610" y2="395" stroke="#1e293b" stroke-width="1" />
  <text x="610" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">4 kHz</text>

  <!-- 10 kHz -->
  <line x1="720" y1="85" x2="720" y2="395" stroke="#1e293b" stroke-width="1" />
  <text x="720" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">10 kHz</text>

  <!-- SUBTRACTIVE CUT CURVE (Centered at ~350 Hz, X=310, Y=325 -> -8.5 dB) -->
  <path d="M 180,240 
           C 250,240 280,325 310,325 
           C 340,325 370,240 440,240 
           Z" 
        fill="url(#cutFill)" />

  <path d="M 70,240 
           L 180,240 
           C 250,240 280,325 310,325 
           C 340,325 370,240 440,240 
           L 490,240" 
        fill="none" stroke="#f43f5e" stroke-width="3.5" filter="url(#glowRose)" />

  <!-- Cut Node point -->
  <circle cx="310" cy="325" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />

  <!-- Cut Callout Card -->
  <g transform="translate(195, 345)">
    <rect width="230" height="42" rx="6" fill="#1e1b4b" fill-opacity="0.85" stroke="#f43f5e" stroke-width="1.2" />
    <text x="12" y="18" fill="#fda4af" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">CUT (Subtractive EQ: -8 dB)</text>
    <text x="12" y="32" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">Attenuates / decreases amplitude</text>
  </g>

  <!-- ADDITIVE BOOST CURVE (Centered at ~3.5 kHz, X=590, Y=155 -> +8.5 dB) -->
  <path d="M 460,240 
           C 520,240 555,155 590,155 
           C 625,155 660,240 720,240 
           Z" 
        fill="url(#boostFill)" />

  <path d="M 450,240 
           L 460,240 
           C 520,240 555,155 590,155 
           C 625,155 660,240 720,240 
           L 810,240" 
        fill="none" stroke="#06b6d4" stroke-width="3.5" filter="url(#glowCyan)" />

  <!-- Boost Node point -->
  <circle cx="590" cy="155" r="6" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />

  <!-- Boost Callout Card -->
  <g transform="translate(540, 95)">
    <rect width="230" height="42" rx="6" fill="#0c4a6e" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1.2" />
    <text x="12" y="18" fill="#67e8f9" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">BOOST (Additive EQ: +8 dB)</text>
    <text x="12" y="32" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">Amplifies / increases amplitude</text>
  </g>

  <!-- Bottom Comparison Summary Card -->
  <g transform="translate(70, 435)">
    <rect width="740" height="68" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.2" />

    <!-- Subtractive Bullet -->
    <circle cx="26" cy="24" r="5" fill="#f43f5e" />
    <text x="40" y="28" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Subtractive Cutting:</text>
    <text x="175" y="28" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Removes harsh resonances or mud; creates space and preserves dynamic headroom.</text>

    <!-- Additive Bullet -->
    <circle cx="26" cy="48" r="5" fill="#06b6d4" />
    <text x="40" y="52" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Additive Boosting:</text>
    <text x="175" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Accentuates character (presence, air, thump); excessive boosting risks clipping.</text>
  </g>
</svg>
