<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Low Q Gradient -->
    <linearGradient id="lowQGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <!-- High Q Gradient -->
    <linearGradient id="highQGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" rx="14" fill="url(#bgGrad2)" stroke="#1e293b" stroke-width="2" />

  <!-- Header Section -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="160" height="24" rx="6" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="1.2" />
    <text x="80" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">EQ PARAMETERS</text>
    
    <text x="175" y="18" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">What is "Q"? (Quality Factor &amp; Bandwidth)</text>
    <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      The Q parameter controls the bandwidth (width) of the frequency bell curve around the center frequency.
    </text>
  </g>

  <!-- Analyzer Display (X: 70 to 810, Y: 85 to 395, Width: 740, Height: 310) -->
  <rect x="70" y="85" width="740" height="310" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Gain Grid Lines -->
  <!-- +12 dB -->
  <line x1="70" y1="120" x2="810" y2="120" stroke="#1e293b" stroke-width="1" />
  <text x="62" y="124" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">+12 dB</text>

  <!-- +6 dB -->
  <line x1="70" y1="180" x2="810" y2="180" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />
  <text x="62" y="184" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">+6 dB</text>

  <!-- 0 dB Reference Center Line -->
  <line x1="70" y1="240" x2="810" y2="240" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 4" />
  <text x="62" y="244" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">0 dB</text>
  <text x="816" y="244" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Unity</text>

  <!-- -6 dB -->
  <line x1="70" y1="300" x2="810" y2="300" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />
  <text x="62" y="304" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">-6 dB</text>

  <!-- Frequency Grid Lines -->
  <!-- 100 Hz -->
  <line x1="160" y1="85" x2="160" y2="395" stroke="#1e293b" stroke-width="1" />
  <text x="160" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">100 Hz</text>

  <!-- 300 Hz -->
  <line x1="280" y1="85" x2="280" y2="395" stroke="#1e293b" stroke-width="1" />
  <text x="280" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">300 Hz</text>

  <!-- 1 kHz (Center Frequency fc) -->
  <line x1="440" y1="85" x2="440" y2="395" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 3" stroke-opacity="0.7" />
  <text x="440" y="415" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">fc = 1 kHz</text>

  <!-- 3 kHz -->
  <line x1="600" y1="85" x2="600" y2="395" stroke="#1e293b" stroke-width="1" />
  <text x="600" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">3 kHz</text>

  <!-- 10 kHz -->
  <line x1="720" y1="85" x2="720" y2="395" stroke="#1e293b" stroke-width="1" />
  <text x="720" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">10 kHz</text>

  <!-- 1. LOW Q CURVE (Wide, Q = 0.7, spans 200 Hz to 5 kHz) -->
  <path d="M 120,240 
           C 250,240 340,150 440,150 
           C 540,150 630,240 760,240 
           Z" 
        fill="url(#lowQGrad)" />
  <path d="M 70,240 
           L 120,240 
           C 250,240 340,150 440,150 
           C 540,150 630,240 760,240 
           L 810,240" 
        fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="7 4" filter="url(#glowGreen)" />

  <!-- Low Q Bandwidth Indicator Arrow -->
  <line x1="280" y1="185" x2="600" y2="185" stroke="#34d399" stroke-width="1.8" />
  <text x="440" y="177" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Wide Bandwidth (Low Q ≈ 0.7)</text>

  <!-- 2. HIGH Q CURVE (Narrow / Surgical, Q = 8.0, spans 900 Hz to 1100 Hz) -->
  <path d="M 395,240 
           C 425,240 435,150 440,150 
           C 445,150 455,240 485,240 
           Z" 
        fill="url(#highQGrad)" />
  <path d="M 70,240 
           L 395,240 
           C 425,240 435,150 440,150 
           C 445,150 455,240 485,240 
           L 810,240" 
        fill="none" stroke="#f59e0b" stroke-width="3.5" filter="url(#glowAmber)" />

  <!-- High Q Bandwidth Indicator Arrow -->
  <line x1="422" y1="215" x2="458" y2="215" stroke="#fcd34d" stroke-width="2" />
  <text x="510" y="219" fill="#fcd34d" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700">Narrow Bandwidth (High Q ≈ 8.0)</text>

  <!-- Peak Center Node Point (Common fc = 1 kHz, +9 dB) -->
  <circle cx="440" cy="150" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />

  <!-- Left Callout Box: Low Q info (shifted to avoid overlap) -->
  <g transform="translate(80, 95)">
    <rect width="180" height="58" rx="6" fill="#064e3b" fill-opacity="0.9" stroke="#10b981" stroke-width="1.2" />
    <text x="12" y="20" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">LOW Q (Wide Curve)</text>
    <text x="12" y="36" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Affects broad range</text>
    <text x="12" y="50" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Gentle, musical tone shaping</text>
  </g>

  <!-- Right Callout Box: High Q info -->
  <g transform="translate(615, 95)">
    <rect width="180" height="58" rx="6" fill="#78350f" fill-opacity="0.9" stroke="#f59e0b" stroke-width="1.2" />
    <text x="12" y="20" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">HIGH Q (Narrow Notch)</text>
    <text x="12" y="36" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Affects tight band</text>
    <text x="12" y="50" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5">• Surgical notch precision</text>
  </g>

  <!-- Bottom Formula & Takeaway Bar -->
  <g transform="translate(70, 435)">
    <rect width="740" height="68" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.2" />

    <!-- Math Badge -->
    <rect x="15" y="16" width="220" height="36" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="39" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Q = Center Freq / Bandwidth</text>

    <!-- Key Takeaways -->
    <text x="250" y="30" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Inverse Rule:</text>
    <text x="335" y="30" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Higher Q number = Narrower curve. Lower Q number = Wider curve.</text>

    <text x="250" y="50" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Mixing Rule:</text>
    <text x="335" y="50" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">"Boost wide (low Q) for musical tone; cut narrow (high Q) to fix problems."</text>
  </g>
</svg>
