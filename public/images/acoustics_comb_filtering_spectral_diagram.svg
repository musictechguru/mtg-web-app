<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="50%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17223b" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- Outer Header -->
  <g transform="translate(30, 16)">
    <rect width="250" height="34" rx="7" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1.3" />
    <text x="125" y="22" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">COMB FILTERING</text>

    <rect x="262" y="0" width="668" height="34" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1.3" />
    <text x="596" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Acoustic Phase Interference: Direct Sound Summed with Delayed Boundary Reflection</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <rect width="900" height="396" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- LEFT COLUMN: Physical Acoustic Reflection Mechanism -->
    <g transform="translate(24, 18)">
      <rect width="420" height="360" rx="8" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.3" />

      <!-- Left Header Badge -->
      <g transform="translate(18, 12)">
        <rect width="384" height="28" rx="6" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.1" />
        <text x="192" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.8">ACOUSTIC CAUSE: DIRECT VS REFLECTED PATHS</text>
      </g>

      <!-- Diagram Area -->
      <g transform="translate(18, 48)">
        <rect width="384" height="150" rx="7" fill="#090f1d" stroke="#1e293b" stroke-width="1.2" />

        <!-- Sound Source Badge -->
        <g transform="translate(14, 20)">
          <rect width="90" height="28" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
          <text x="45" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SOURCE</text>
        </g>

        <!-- Hard Wall / Desk Boundary -->
        <g transform="translate(135, 6)">
          <rect width="114" height="18" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.1" />
          <text x="57" y="13" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">HARD BOUNDARY</text>
        </g>

        <!-- Receiver / Mic Badge -->
        <g transform="translate(280, 20)">
          <rect width="90" height="28" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
          <text x="45" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">MIC / EAR</text>
        </g>

        <!-- Reflected Path Line (Rose dashed) bouncing off boundary bottom -->
        <path d="M 104 34 L 192 24 L 280 34" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3" />

        <!-- Direct Path Line (Cyan) -->
        <line x1="104" y1="34" x2="280" y2="34" stroke="#38bdf8" stroke-width="2.5" />

        <!-- Direct Sound Pill -->
        <rect x="135" y="44" width="114" height="20" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
        <text x="192" y="57" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" text-anchor="middle">Direct Sound (t = 0 ms)</text>

        <!-- Reflected Sound Pill -->
        <rect x="135" y="70" width="114" height="20" rx="4" fill="#be123c" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1" />
        <text x="192" y="83" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" text-anchor="middle">Delayed Bounce (Δt = 1 ms)</text>

        <!-- Summing Summation Badge -->
        <g transform="translate(14, 102)">
          <rect width="356" height="36" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="178" y="16" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.8" font-weight="700" text-anchor="middle">Summing Node: Direct Wave + Reflected Wave = Phase Collisions</text>
          <text x="178" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Path difference creates 180° out-of-phase cancellation at specific frequencies</text>
        </g>
      </g>

      <!-- 2 Detail Boxes for Acoustic Mechanism -->
      <g transform="translate(18, 208)">
        <!-- Box A: Time Delay Range -->
        <g transform="translate(0, 0)">
          <rect width="384" height="66" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="8" y="8" width="144" height="20" rx="3" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
          <text x="80" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">DELAY WINDOW</text>

          <rect x="158" y="8" width="218" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="267" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Critical Range: 1 ms to 15 ms</text>

          <rect x="8" y="34" width="368" height="24" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.2" font-weight="500" text-anchor="middle">Delays &lt;15 ms fuse perceptually into tone coloration rather than distinct echo</text>
        </g>

        <!-- Box B: First Cancellation Formula -->
        <g transform="translate(0, 74)">
          <rect width="384" height="66" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="8" y="8" width="144" height="20" rx="3" fill="#be123c" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1" />
          <text x="80" y="21" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">CANCELLATION MATH</text>

          <rect x="158" y="8" width="218" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="267" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">First Null = 1 / (2 × Delay)</text>

          <rect x="8" y="34" width="368" height="24" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.2" font-weight="500" text-anchor="middle">A 1 ms delay produces notches at 500 Hz, 1500 Hz, 2500 Hz, 3500 Hz, etc.</text>
        </g>
      </g>
    </g>

    <!-- RIGHT COLUMN: Comb Filter Frequency Response & Sonic Damage -->
    <g transform="translate(460, 18)">
      <rect width="416" height="360" rx="8" fill="url(#panelGrad)" stroke="#f43f5e" stroke-width="1.3" />

      <!-- Right Header Badge -->
      <g transform="translate(16, 12)">
        <rect width="384" height="28" rx="6" fill="#be123c" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1.1" />
        <text x="192" y="19" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.8">SPECTRAL COMB RESPONSE &amp; CONSEQUENCES</text>
      </g>

      <!-- Spectral Comb Graph Display -->
      <g transform="translate(16, 48)">
        <rect width="384" height="150" rx="7" fill="#090f1d" stroke="#1e293b" stroke-width="1.2" />

        <!-- Peak & Null Labels -->
        <rect x="12" y="8" width="108" height="18" rx="3" fill="#065f46" stroke="#10b981" stroke-width="1" />
        <text x="66" y="20" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" text-anchor="middle">+6 dB Peaks (In-Phase)</text>

        <rect x="254" y="8" width="118" height="18" rx="3" fill="#881337" stroke="#f43f5e" stroke-width="1" />
        <text x="313" y="20" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" text-anchor="middle">-∞ dB Nulls (Cancellation)</text>

        <!-- Center 0 dB Reference Line -->
        <line x1="16" y1="65" x2="368" y2="65" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />

        <!-- Comb Filter Teeth Curve -->
        <!-- Alternating peaks at 1k, 2k, 3k, 4k and nulls at 500, 1.5k, 2.5k, 3.5k -->
        <path d="M 20 65 Q 40 105 60 120 Q 80 105 100 35 Q 120 105 140 120 Q 160 105 180 35 Q 200 105 220 120 Q 240 105 260 35 Q 280 105 300 120 Q 320 105 340 35 Q 355 90 368 120" fill="none" stroke="#f43f5e" stroke-width="2.2" />

        <!-- Tooth Indicators -->
        <rect x="42" y="124" width="36" height="16" rx="3" fill="#1e293b" />
        <text x="60" y="135" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">500 Hz</text>

        <rect x="122" y="124" width="36" height="16" rx="3" fill="#1e293b" />
        <text x="140" y="135" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">1.5 kHz</text>

        <rect x="202" y="124" width="36" height="16" rx="3" fill="#1e293b" />
        <text x="220" y="135" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">2.5 kHz</text>

        <rect x="282" y="124" width="36" height="16" rx="3" fill="#1e293b" />
        <text x="300" y="135" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">3.5 kHz</text>
      </g>

      <!-- 2 Detail Boxes for Sonic Impact -->
      <g transform="translate(16, 208)">
        <!-- Box 1: Hollow Nasal Tone -->
        <g transform="translate(0, 0)">
          <rect width="384" height="66" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="8" y="8" width="144" height="20" rx="3" fill="#be123c" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1" />
          <text x="80" y="21" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">HOLLOW &amp; NASAL TONE</text>

          <rect x="158" y="8" width="218" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="267" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Severe Timbral Discoloration</text>

          <rect x="8" y="34" width="368" height="24" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.2" font-weight="500" text-anchor="middle">Vocals sound hollow, phasey, and thin, as if speaking through a cardboard tube</text>
        </g>

        <!-- Box 2: Irreversible by EQ -->
        <g transform="translate(0, 74)">
          <rect width="384" height="66" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="8" y="8" width="144" height="20" rx="3" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1" />
          <text x="80" y="21" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">CANNOT BE FIXED BY EQ</text>

          <rect x="158" y="8" width="218" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="267" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Physical Acoustic Problem</text>

          <rect x="8" y="34" width="368" height="24" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.2" font-weight="500" text-anchor="middle">Boosting the notched frequency boosts both direct and reflected wave equally</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Container -->
  <g transform="translate(30, 466)">
    <rect width="900" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.3" />

    <!-- Takeaway Tag Badge -->
    <rect x="14" y="11" width="106" height="36" rx="6" fill="#f43f5e" />
    <text x="67" y="33" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.8">TAKEAWAY</text>

    <!-- Takeaway Content Box -->
    <rect x="128" y="9" width="758" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="507" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Comb filtering occurs when direct sound sums with a delayed reflection (1–15 ms).</text>
    <text x="507" y="39" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">This creates repeating nulls that hollow out tone and vocal clarity, and cannot be corrected with EQ.</text>
  </g>
</svg>
