<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="50%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17223b" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- Outer Header -->
  <g transform="translate(30, 16)">
    <rect width="250" height="34" rx="7" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.3" />
    <text x="125" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">HIGH SAMPLE RATES</text>

    <rect x="262" y="0" width="668" height="34" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1.3" />
    <text x="596" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Eliminating Inharmonic Aliasing &amp; Preserving Phase Linearity</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <rect width="900" height="396" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- LEFT COLUMN: Aliasing Mechanism Spectrum (44.1k vs 96k) -->
    <g transform="translate(24, 18)">
      <rect width="420" height="360" rx="8" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.3" />

      <!-- Left Header Badge -->
      <g transform="translate(18, 12)">
        <rect width="384" height="28" rx="6" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.1" />
        <text x="192" y="19" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.8">SPECTRUM COMPARISON: NYQUIST &amp; ALIASING</text>
      </g>

      <!-- Case 1: Standard 44.1 kHz (Aliasing Risk) -->
      <g transform="translate(18, 48)">
        <rect width="384" height="142" rx="7" fill="#090f1d" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.6" />

        <g transform="translate(10, 8)">
          <rect width="144" height="22" rx="4" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1" />
          <text x="72" y="15" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">44.1 kHz SAMPLE RATE</text>

          <rect x="154" y="0" width="210" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="259" y="15" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Nyquist Limit = 22.05 kHz (Narrow)</text>
        </g>

        <!-- Frequency visual bar -->
        <g transform="translate(10, 36)">
          <!-- Base axis -->
          <line x1="10" y1="56" x2="354" y2="56" stroke="#475569" stroke-width="1.5" />

          <!-- Audible Band (0 - 20 kHz) -->
          <rect x="10" y="24" width="180" height="32" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
          <text x="100" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Audible Band (0 - 20 kHz)</text>

          <!-- Nyquist Barrier line at 22.05 kHz -->
          <line x1="200" y1="8" x2="200" y2="60" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3,3" />
          <rect x="175" y="4" width="50" height="14" rx="3" fill="#f59e0b" />
          <text x="200" y="14" fill="#0b1326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">22.05 kHz</text>

          <!-- Harmonic spike at 28 kHz -->
          <line x1="250" y1="20" x2="250" y2="56" stroke="#f43f5e" stroke-width="2" />
          <!-- Aliased Foldback arrow into audible band -->
          <path d="M 250 20 Q 200 -4 150 24" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="3,2" />
          <polygon points="150,24 156,18 158,26" fill="#f43f5e" />

          <!-- Aliased Foldback Spike inside audible band at 16.1 kHz -->
          <line x1="150" y1="24" x2="150" y2="56" stroke="#f43f5e" stroke-width="2" />
        </g>

        <!-- Descriptor row with clean padding -->
        <g transform="translate(10, 104)">
          <rect width="364" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="182" y="17" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.8" font-weight="700" text-anchor="middle">Harmonics &gt;22 kHz fold back as audible inharmonic distortion</text>
        </g>
      </g>

      <!-- Case 2: High Sample Rate 96 kHz (Clean Overhead) -->
      <g transform="translate(18, 198)">
        <rect width="384" height="148" rx="7" fill="#090f1d" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" />

        <g transform="translate(10, 8)">
          <rect width="144" height="22" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
          <text x="72" y="15" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">96 kHz MASTERING RATE</text>

          <rect x="154" y="0" width="210" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="259" y="15" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Nyquist Limit = 48.0 kHz (Massive Margin)</text>
        </g>

        <!-- Frequency visual bar -->
        <g transform="translate(10, 36)">
          <!-- Base axis -->
          <line x1="10" y1="56" x2="354" y2="56" stroke="#475569" stroke-width="1.5" />

          <!-- Audible Band (0 - 20 kHz) -->
          <rect x="10" y="24" width="110" height="32" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
          <text x="65" y="44" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Audible (0-20k)</text>

          <!-- Extended Margin Zone (20k - 48k) -->
          <rect x="124" y="24" width="180" height="32" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
          <text x="214" y="44" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Ultrasonic Safe Buffer (20 - 48 kHz)</text>

          <!-- Safe Harmonic spike at 28 kHz staying harmlessly in ultrasonic buffer -->
          <line x1="170" y1="18" x2="170" y2="56" stroke="#10b981" stroke-width="2" />
          <rect x="145" y="4" width="50" height="14" rx="3" fill="#10b981" />
          <text x="170" y="14" fill="#0b1326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">Safe 28 kHz</text>

          <!-- Nyquist Barrier line at 48 kHz -->
          <line x1="308" y1="8" x2="308" y2="60" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3,3" />
          <rect x="286" y="4" width="44" height="14" rx="3" fill="#f59e0b" />
          <text x="308" y="14" fill="#0b1326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">48 kHz</text>
        </g>

        <!-- Descriptor row with clean padding -->
        <g transform="translate(10, 110)">
          <rect width="364" height="26" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="182" y="17" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.8" font-weight="700" text-anchor="middle">Harmonics &gt;20 kHz decay cleanly with zero foldback aliasing</text>
        </g>
      </g>
    </g>

    <!-- RIGHT COLUMN: 4 Core Advantages in Mastering -->
    <g transform="translate(460, 18)">
      <rect width="416" height="360" rx="8" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1.3" />

      <!-- Right Header Badge -->
      <g transform="translate(16, 12)">
        <rect width="384" height="28" rx="6" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1.1" />
        <text x="192" y="19" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.8">WHY HIGH SAMPLE RATES MATTER IN MASTERING</text>
      </g>

      <!-- Reasons Stack -->
      <g transform="translate(16, 48)">
        <!-- Reason 1: Aliasing Suppression -->
        <g transform="translate(0, 0)">
          <rect width="384" height="68" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="10" y="8" width="164" height="22" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
          <text x="92" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">1. ELIMINATES ALIASING</text>

          <rect x="182" y="8" width="192" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="278" y="22" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Nyquist Limit Extended to 48 kHz</text>

          <rect x="10" y="36" width="364" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" text-anchor="middle">Stops limiter and saturation harmonics reflecting into audible mids</text>
        </g>

        <!-- Reason 2: Gentle Anti-Aliasing Filters -->
        <g transform="translate(0, 76)">
          <rect width="384" height="68" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="10" y="8" width="164" height="22" rx="4" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1" />
          <text x="92" y="22" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">2. GENTLE FILTER SLOPES</text>

          <rect x="182" y="8" width="192" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="278" y="22" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Zero Pre-Ringing / Phase Smear</text>

          <rect x="10" y="36" width="364" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" text-anchor="middle">Avoids steep 44.1 kHz brickwall filters that smear high-end phase</text>
        </g>

        <!-- Reason 3: True Peak Limiting Precision -->
        <g transform="translate(0, 152)">
          <rect width="384" height="68" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="10" y="8" width="164" height="22" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
          <text x="92" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">3. INTER-SAMPLE ACCURACY</text>

          <rect x="182" y="8" width="192" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="278" y="22" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">True-Peak Inter-Sample Catch</text>

          <rect x="10" y="36" width="364" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" text-anchor="middle">Limiters detect analog waveform peaks between digital sample points</text>
        </g>

        <!-- Reason 4: Pristine DSP Calculations -->
        <g transform="translate(0, 228)">
          <rect width="384" height="68" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="10" y="8" width="164" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
          <text x="92" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">4. SMOOTHER DSP MATH</text>

          <rect x="182" y="8" width="192" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="278" y="22" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">High Resolution Equalization</text>

          <rect x="10" y="36" width="364" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" text-anchor="middle">Digital EQ curves near 20 kHz retain symmetry without cramping</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Container -->
  <g transform="translate(30, 466)">
    <rect width="900" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.3" />

    <!-- Takeaway Tag Badge -->
    <rect x="14" y="11" width="106" height="36" rx="6" fill="#38bdf8" />
    <text x="67" y="33" fill="#0b1326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.8">TAKEAWAY</text>

    <!-- Takeaway Content Box -->
    <rect x="128" y="9" width="758" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="507" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Mastering at 96 kHz moves the Nyquist limit to 48 kHz, stopping non-linear processing harmonics from aliasing.</text>
    <text x="507" y="39" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">It also permits gentle reconstruction filters, preventing audible phase smear and preserving transient clarity.</text>
  </g>
</svg>
