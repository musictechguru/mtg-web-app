<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080b11" />
    </linearGradient>

    <linearGradient id="speakerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#272e3f" />
      <stop offset="100%" stop-color="#151922" />
    </linearGradient>

    <radialGradient id="coneGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <radialGradient id="tweeterGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <radialGradient id="soundwaveLeft" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="soundwaveRight" cx="100%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="900" height="560" rx="16" fill="url(#bgGrad)" stroke="#1f293d" stroke-width="2" />

  <!-- Grid / Acoustic Floor Lines -->
  <g opacity="0.15" stroke="#64748b" stroke-width="1">
    <line x1="150" y1="180" x2="450" y2="480" />
    <line x1="750" y1="180" x2="450" y2="480" />
    <line x1="300" y1="180" x2="450" y2="480" />
    <line x1="600" y1="180" x2="450" y2="480" />
    <line x1="450" y1="120" x2="450" y2="480" stroke-dasharray="4 4" stroke="#38bdf8" />
  </g>

  <!-- Title Header -->
  <text x="450" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">STEREO SOUNDSTAGE &amp; PANNING</text>
  <text x="450" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">The Pan Pot positions mono signals across the Left-to-Right stereo field</text>

  <!-- Stereo Soundstage Arc -->
  <path d="M 160 210 Q 450 110 740 210" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6 6" />
  <path d="M 200 235 Q 450 145 700 235" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" filter="url(#glow)" />

  <!-- Panning Degree Markers on Arc -->
  <g font-family="system-ui, sans-serif" font-size="10" fill="#64748b" font-weight="600" text-anchor="middle">
    <text x="165" y="190">100% L</text>
    <text x="285" y="155">50% L</text>
    <text x="450" y="135">CENTER (0)</text>
    <text x="615" y="155">50% R</text>
    <text x="735" y="190">100% R</text>
  </g>

  <!-- Sound Dispersion Waves -->
  <path d="M 180 200 Q 300 260 410 430" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.35" stroke-dasharray="3 3" />
  <path d="M 720 200 Q 600 260 490 430" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.35" stroke-dasharray="3 3" />

  <!-- ==================== LEFT MONITOR SPEAKER ==================== -->
  <g transform="translate(80, 150) rotate(18, 40, 75)" filter="url(#softShadow)">
    <!-- Cabinet -->
    <rect x="0" y="0" width="80" height="140" rx="8" fill="url(#speakerBody)" stroke="#475569" stroke-width="2" />
    <rect x="6" y="6" width="68" height="128" rx="6" fill="#121620" stroke="#1e293b" stroke-width="1" />
    <!-- Tweeter -->
    <circle cx="40" cy="35" r="16" fill="#1e2536" stroke="#334155" stroke-width="1.5" />
    <circle cx="40" cy="35" r="9" fill="url(#tweeterGrad)" />
    <circle cx="37" cy="32" r="3" fill="#ffffff" opacity="0.6" />
    <!-- Woofer -->
    <circle cx="40" cy="90" r="28" fill="#1a202c" stroke="#334155" stroke-width="2" />
    <circle cx="40" cy="90" r="23" fill="url(#coneGrad)" />
    <circle cx="40" cy="90" r="8" fill="#451a03" stroke="#78350f" stroke-width="1" />
    <!-- Power LED -->
    <circle cx="40" cy="126" r="2" fill="#38bdf8" filter="url(#glow)" />
    <!-- Label -->
    <rect x="22" y="145" width="36" height="20" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="40" y="159" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LEFT</text>
  </g>

  <!-- ==================== RIGHT MONITOR SPEAKER ==================== -->
  <g transform="translate(740, 150) rotate(-18, 40, 75)" filter="url(#softShadow)">
    <!-- Cabinet -->
    <rect x="0" y="0" width="80" height="140" rx="8" fill="url(#speakerBody)" stroke="#475569" stroke-width="2" />
    <rect x="6" y="6" width="68" height="128" rx="6" fill="#121620" stroke="#1e293b" stroke-width="1" />
    <!-- Tweeter -->
    <circle cx="40" cy="35" r="16" fill="#1e2536" stroke="#334155" stroke-width="1.5" />
    <circle cx="40" cy="35" r="9" fill="url(#tweeterGrad)" />
    <circle cx="37" cy="32" r="3" fill="#ffffff" opacity="0.6" />
    <!-- Woofer -->
    <circle cx="40" cy="90" r="28" fill="#1a202c" stroke="#334155" stroke-width="2" />
    <circle cx="40" cy="90" r="23" fill="url(#coneGrad)" />
    <circle cx="40" cy="90" r="8" fill="#451a03" stroke="#78350f" stroke-width="1" />
    <!-- Power LED -->
    <circle cx="40" cy="126" r="2" fill="#a855f7" filter="url(#glow)" />
    <!-- Label -->
    <rect x="20" y="145" width="40" height="20" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <text x="40" y="159" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RIGHT</text>
  </g>

  <!-- ==================== SOUNDSTAGE INSTRUMENT ICONS ==================== -->

  <!-- 1. GUITAR (Hard / Mid Left) -->
  <g transform="translate(250, 160)" filter="url(#softShadow)">
    <!-- Card Container -->
    <rect x="-55" y="-10" width="110" height="110" rx="12" fill="#182234" stroke="#3b82f6" stroke-width="1.5" />
    <!-- Guitar Icon -->
    <g transform="translate(-24, 0)">
      <!-- Body -->
      <path d="M24 24 C14 24 10 32 14 42 C10 48 10 58 18 64 C26 70 34 68 38 60 C42 54 38 46 34 42 C38 34 34 24 24 24 Z" fill="#2563eb" stroke="#93c5fd" stroke-width="1.5" />
      <!-- Soundhole -->
      <circle cx="24" cy="44" r="5" fill="#0f172a" stroke="#93c5fd" stroke-width="1" />
      <!-- Neck & Headstock -->
      <rect x="22" y="8" width="4" height="16" fill="#d97706" />
      <polygon points="20,4 28,4 27,9 21,9" fill="#b45309" />
      <!-- Tuning Pegs -->
      <circle cx="19" cy="6" r="1.5" fill="#f8fafc" />
      <circle cx="29" cy="6" r="1.5" fill="#f8fafc" />
    </g>
    <!-- Label Text -->
    <text x="0" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">GUITAR</text>
    <text x="0" y="93" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Panned Left</text>
  </g>

  <!-- 2. CENTER: KICK & VOCALS (Center 0) -->
  <g transform="translate(450, 115)" filter="url(#softShadow)">
    <!-- Card Container -->
    <rect x="-75" y="-10" width="150" height="135" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glow)" />
    
    <!-- VOCAL MICROPHONE ICON (Top Half) -->
    <g transform="translate(-35, 10)">
      <!-- Mic Capsule -->
      <rect x="6" y="0" width="14" height="20" rx="7" fill="#4f46e5" stroke="#c7d2fe" stroke-width="1.5" />
      <!-- Grille Lines -->
      <line x1="8" y1="7" x2="18" y2="7" stroke="#a5b4fc" stroke-width="1" />
      <line x1="8" y1="12" x2="18" y2="12" stroke="#a5b4fc" stroke-width="1" />
      <!-- Body & Stand -->
      <rect x="10" y="20" width="6" height="10" fill="#312e81" stroke="#818cf8" stroke-width="1" />
      <path d="M2 14 C2 24 24 24 24 14" fill="none" stroke="#c7d2fe" stroke-width="1.5" />
      <line x1="13" y1="24" x2="13" y2="32" stroke="#c7d2fe" stroke-width="1.5" />
    </g>

    <!-- KICK DRUM ICON (Top Right) -->
    <g transform="translate(10, 8)">
      <!-- Drum Shell -->
      <circle cx="18" cy="18" r="16" fill="#312e81" stroke="#f59e0b" stroke-width="2" />
      <circle cx="18" cy="18" r="11" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 2" />
      <!-- Kick Port -->
      <circle cx="24" cy="22" r="4" fill="#0f172a" stroke="#d97706" stroke-width="1" />
      <!-- Beater Impact -->
      <circle cx="15" cy="15" r="2" fill="#ef4444" />
    </g>

    <!-- Center Labels -->
    <text x="0" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">KICK &amp; VOCALS</text>
    <text x="0" y="96" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Dead Center (Mono)</text>
    <text x="0" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Anchor of the mix</text>
  </g>

  <!-- 3. STRINGS (Hard / Mid Right) -->
  <g transform="translate(650, 160)" filter="url(#softShadow)">
    <!-- Card Container -->
    <rect x="-55" y="-10" width="110" height="110" rx="12" fill="#261933" stroke="#c084fc" stroke-width="1.5" />
    <!-- Violin / Strings Icon -->
    <g transform="translate(-24, 2)">
      <!-- Violin Body (Waisted C-bouts) -->
      <path d="M24 20 C18 20 14 26 18 34 C12 36 12 44 16 48 C12 56 16 66 24 66 C32 66 36 56 32 48 C36 44 36 36 30 34 C34 26 30 20 24 20 Z" fill="#9333ea" stroke="#e9d5ff" stroke-width="1.5" />
      <!-- F-Holes -->
      <path d="M19 38 Q17 44 20 48" fill="none" stroke="#f3e8ff" stroke-width="1" />
      <path d="M29 38 Q31 44 28 48" fill="none" stroke="#f3e8ff" stroke-width="1" />
      <!-- Fingerboard & Neck -->
      <rect x="22" y="8" width="4" height="20" fill="#1e1b4b" stroke="#e9d5ff" stroke-width="0.8" />
      <polygon points="21,4 27,4 26,8 22,8" fill="#581c87" />
      <!-- Bow diagonal line -->
      <line x1="8" y1="56" x2="40" y2="32" stroke="#fef08a" stroke-width="1.5" opacity="0.8" />
    </g>
    <!-- Label Text -->
    <text x="0" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">STRINGS</text>
    <text x="0" y="93" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Panned Right</text>
  </g>

  <!-- ==================== LISTENER & SWEET SPOT (Bottom) ==================== -->
  <g transform="translate(450, 440)">
    <!-- Sweet Spot Acoustic Circle -->
    <ellipse cx="0" cy="30" rx="55" ry="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <text x="0" y="68" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">MIXING SWEET SPOT</text>

    <!-- Listener Top-Down Head -->
    <circle cx="0" cy="15" r="26" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <!-- Nose Indicator -->
    <polygon points="-5,-10 5,-10 0,-18" fill="#94a3b8" />
    <!-- Studio Headphones Band -->
    <path d="M-28,15 A28,28 0 0,1 28,15" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
    <!-- Left Earcup -->
    <rect x="-33" y="6" width="9" height="18" rx="4" fill="#0284c7" stroke="#bae6fd" stroke-width="1.5" />
    <!-- Right Earcup -->
    <rect x="24" y="6" width="9" height="18" rx="4" fill="#a855f7" stroke="#f3e8ff" stroke-width="1.5" />
  </g>

  <!-- ==================== PAN POT CONTROLLER INSET (Bottom Left/Center) ==================== -->
  <g transform="translate(450, 310)" filter="url(#softShadow)">
    <!-- Pan Pot Backplate -->
    <rect x="-160" y="-28" width="320" height="56" rx="28" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Rotary Knob in Center of Bar -->
    <circle cx="0" cy="0" r="20" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <circle cx="0" cy="0" r="16" fill="#0f172a" />
    <!-- Knob Pointer -->
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

    <!-- Left / Right Track Arc -->
    <path d="M -120 0 L -30 0" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
    <path d="M 30 0 L 120 0" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />

    <text x="-135" y="5" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">L</text>
    <text x="135" y="5" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">R</text>
    
    <text x="0" y="-34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PAN POT (PANORAMIC POTENTIOMETER)</text>
  </g>

</svg>