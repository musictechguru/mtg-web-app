<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Header Badge -->
  <rect x="30" y="24" width="220" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="140" y="45" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">AUDIO SAMPLING CONCEPT</text>
  <text x="270" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">From real-world acoustic sound to playable digital instrument</text>

  <!-- Flow Arrows connecting the 3 main stages -->
  <!-- Arrow 1 -> 2 -->
  <path d="M 255,190 L 290,190" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <polygon points="295,190 285,184 285,196" fill="#38bdf8" />

  <!-- Arrow 2 -> 3 -->
  <path d="M 525,190 L 560,190" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <polygon points="565,190 555,184 555,196" fill="#38bdf8" />

  <!-- STAGE 1 CARD: Audio Source -->
  <rect x="40" y="85" width="210" height="225" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="55" y="100" width="180" height="24" rx="4" fill="#0284c7" />
  <text x="145" y="116" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">1. AUDIO SOURCE</text>

  <!-- Stage 1 Graphic: Acoustic Sound Wave / Mic -->
  <g transform="translate(145, 175)">
    <circle cx="0" cy="0" r="32" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Microphone icon representation -->
    <rect x="-8" y="-18" width="16" height="24" rx="8" fill="#38bdf8" />
    <path d="M -12,-6 C -12,10 12,10 12,-6" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round" />
    <line x1="0" y1="10" x2="0" y2="20" stroke="#e0f2fe" stroke-width="2.5" />
    <line x1="-8" y1="20" x2="8" y2="20" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="145" y="240" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Acoustic Sound</text>
  <text x="145" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Drum Hit, Vocal, Real Piano,</text>
  <text x="145" y="275" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">or Vinyl Record segment</text>

  <!-- STAGE 2 CARD: Sampling & Digitization -->
  <rect x="300" y="85" width="220" height="225" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.5" />
  <rect x="315" y="100" width="190" height="24" rx="4" fill="#d97706" />
  <text x="410" y="116" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">2. DIGITIZATION &amp; STORAGE</text>

  <!-- Stage 2 Graphic: Sampling Waveform with Slice / Start-End -->
  <g transform="translate(325, 145)">
    <rect x="0" y="0" width="170" height="65" rx="6" fill="#0b1120" stroke="#475569" stroke-width="1" />
    <!-- Waveform shape -->
    <path d="M 10,32 L 25,12 L 40,50 L 55,20 L 70,42 L 85,15 L 100,48 L 115,25 L 130,38 L 145,28 L 160,32" fill="none" stroke="#f59e0b" stroke-width="2" />
    <!-- Start & End Markers -->
    <line x1="20" y1="5" x2="20" y2="60" stroke="#22c55e" stroke-width="2" stroke-dasharray="3,3" />
    <text x="24" y="16" fill="#22c55e" font-size="9" font-weight="700">START</text>
    <line x1="135" y1="5" x2="135" y2="60" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />
    <text x="115" y="58" fill="#ef4444" font-size="9" font-weight="700">END</text>
  </g>
  <text x="410" y="240" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Stored in Digital RAM</text>
  <text x="410" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Audio converted via ADC</text>
  <text x="410" y="275" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Trimmed, normalized &amp; looped</text>

  <!-- STAGE 3 CARD: Musical Playback -->
  <rect x="570" y="85" width="200" height="225" rx="10" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" />
  <rect x="585" y="100" width="170" height="24" rx="4" fill="#16a34a" />
  <text x="670" y="116" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">3. MUSICAL INSTRUMENT</text>

  <!-- Stage 3 Graphic: Mini Keyboard & MPC Pad representation -->
  <g transform="translate(605, 145)">
    <!-- Keyboard Keys -->
    <rect x="0" y="0" width="130" height="60" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <!-- White keys -->
    <rect x="5" y="5" width="18" height="50" rx="2" fill="#f8fafc" />
    <rect x="25" y="5" width="18" height="50" rx="2" fill="#f8fafc" />
    <rect x="45" y="5" width="18" height="50" rx="2" fill="#f8fafc" />
    <rect x="65" y="5" width="18" height="50" rx="2" fill="#f8fafc" />
    <rect x="85" y="5" width="18" height="50" rx="2" fill="#f8fafc" />
    <rect x="105" y="5" width="18" height="50" rx="2" fill="#f8fafc" />
    <!-- Black keys -->
    <rect x="17" y="5" width="12" height="30" rx="1.5" fill="#1e293b" />
    <rect x="37" y="5" width="12" height="30" rx="1.5" fill="#1e293b" />
    <rect x="77" y="5" width="12" height="30" rx="1.5" fill="#1e293b" />
    <rect x="97" y="5" width="12" height="30" rx="1.5" fill="#1e293b" />
  </g>
  <text x="670" y="240" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Triggered via MIDI</text>
  <text x="670" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Pitched across keys or</text>
  <text x="670" y="275" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">triggered by velocity pads</text>

  <!-- Footer Information Strip -->
  <rect x="40" y="332" width="720" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="60" y="356" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">CORE PRINCIPLE</text>
  <text x="60" y="378" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Unlike synthesizers that generate sound from raw oscillators, a sampler uses real recorded audio as its sound source.</text>
</svg>
