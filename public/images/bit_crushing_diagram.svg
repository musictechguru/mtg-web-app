<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="30" y="24" width="220" height="32" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
  <text x="140" y="45" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">BIT CRUSHING EFFECT</text>
  <text x="270" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Reducing bit depth resolution to introduce coarse quantization distortion</text>

  <!-- LEFT PANEL: High Resolution (24-bit / 16-bit) -->
  <g transform="translate(50, 75)">
    <rect x="0" y="0" width="335" height="240" rx="8" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="15" y="15" width="305" height="26" rx="4" fill="#0369a1" />
    <text x="167" y="32" fill="#e0f2fe" font-size="11" font-weight="700" text-anchor="middle">ORIGINAL AUDIO (16-BIT / 24-BIT)</text>

    <!-- Center Line -->
    <line x1="15" y1="135" x2="320" y2="135" stroke="#1e293b" stroke-width="1" />

    <!-- Smooth high-res sine waveform -->
    <path d="M 25,135 C 60,65 100,65 135,135 C 170,205 210,205 245,135 C 275,75 295,85 315,135" 
          fill="none" stroke="#38bdf8" stroke-width="3" />

    <text x="167" y="195" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Smooth Continuous Dynamic Curve</text>
    <text x="167" y="215" fill="#94a3b8" font-size="10" text-anchor="middle">65,536+ voltage steps • Negligible noise floor (-96 dB)</text>
  </g>

  <!-- RIGHT PANEL: Bit Crushed (4-bit / 8-bit) -->
  <g transform="translate(415, 75)">
    <rect x="0" y="0" width="335" height="240" rx="8" fill="#0b1120" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="15" y="15" width="305" height="26" rx="4" fill="#78350f" />
    <text x="167" y="32" fill="#fef3c7" font-size="11" font-weight="700" text-anchor="middle">BIT CRUSHED (COARSE 4-BIT STEPS)</text>

    <!-- Center Line -->
    <line x1="15" y1="135" x2="320" y2="135" stroke="#1e293b" stroke-width="1" />

    <!-- Coarse staircase waveform -->
    <path d="M 25,135 L 45,135 L 45,95 L 85,95 L 85,65 L 115,65 L 115,95 L 135,95 
             L 135,135 L 155,135 L 155,175 L 195,175 L 195,205 L 225,205 L 225,175 L 245,175 
             L 245,135 L 265,135 L 265,85 L 295,85 L 295,135 L 315,135" 
          fill="none" stroke="#f59e0b" stroke-width="3.5" />

    <!-- Quantization error highlight dots -->
    <circle cx="85" cy="80" r="4" fill="#ef4444" />
    <circle cx="195" cy="190" r="4" fill="#ef4444" />

    <text x="167" y="195" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">Coarse Quantization Stair-Steps</text>
    <text x="167" y="215" fill="#cbd5e1" font-size="10" text-anchor="middle">Only 16 discrete voltage levels • Gritty digital distortion</text>
  </g>

  <!-- Footer Information Strip -->
  <rect x="50" y="330" width="700" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="70" y="354" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">HOW BIT CRUSHING WORKS:</text>
  <text x="70" y="374" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Reduces the number of binary bits available to measure signal amplitude (e.g. down to 8, 10, or 12 bits).</text>
  <text x="70" y="390" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Introduces <strong style="fill:#f59e0b;">harmonic quantization noise</strong> and crunchy grit, replicating classic 1980s samplers (SP-1200 / S950).</text>
</svg>
