<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Header Badges -->
  <g transform="translate(30, 16)">
    <rect width="220" height="32" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2" />
    <text x="110" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">MULTIBAND COMPRESSION</text>
    <rect x="232" y="0" width="430" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="447" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Crossover Frequency Bands with Independent Dynamic Control</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="340" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- 4 Crossover Frequency Band Columns -->
    <g transform="translate(20, 18)">
      
      <!-- Band 1: Low (Sub / Kick) -->
      <g transform="translate(0, 0)">
        <rect width="168" height="304" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1.2" />
        
        <!-- Band Title -->
        <g transform="translate(10, 10)">
          <rect width="148" height="24" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
          <text x="74" y="16" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">LOW (20 – 150 Hz)</text>
        </g>
        
        <!-- GR Meter Box -->
        <g transform="translate(10, 42)">
          <rect width="148" height="110" rx="4" fill="#0f172a" stroke="#1e293b" />
          <g transform="translate(14, 10)">
            <rect width="120" height="20" rx="2" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.6" />
            <text x="60" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">ACTIVE: -3.0 dB GR</text>
          </g>
          <!-- Compressed low wave -->
          <path d="M 15,65 Q 35,45 55,65 T 95,65 T 135,65" fill="none" stroke="#ef4444" stroke-width="2.5" />
          <g transform="translate(14, 80)">
            <rect width="120" height="18" rx="2" fill="#0b1120" />
            <text x="60" y="13" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Clamps Boomy Bass</text>
          </g>
        </g>

        <!-- Band Action Badges -->
        <g transform="translate(10, 162)">
          <g transform="translate(0, 0)">
            <rect width="148" height="38" rx="3" fill="#0f172a" stroke="#1e293b" />
            <text x="74" y="15" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">KICK &amp; SUB CONTROL</text>
            <text x="74" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Tames rogue 808 spikes</text>
          </g>
          <g transform="translate(0, 46)">
            <rect width="148" height="38" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.6" />
            <text x="74" y="15" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">REST OF MIX CLEAN</text>
            <text x="74" y="28" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Zero pumping on vocals</text>
          </g>
        </g>
      </g>

      <!-- Band 2: Low-Mid (150 – 1k) -->
      <g transform="translate(178, 0)">
        <rect width="168" height="304" rx="6" fill="#0b1120" stroke="#f59e0b" stroke-width="1.2" />
        
        <!-- Band Title -->
        <g transform="translate(10, 10)">
          <rect width="148" height="24" rx="3" fill="#451a03" stroke="#f59e0b" stroke-width="0.8" />
          <text x="74" y="16" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">LOW-MID (150 – 1k)</text>
        </g>
        
        <!-- GR Meter Box -->
        <g transform="translate(10, 42)">
          <rect width="148" height="110" rx="4" fill="#0f172a" stroke="#1e293b" />
          <g transform="translate(14, 10)">
            <rect width="120" height="20" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="0.6" />
            <text x="60" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">0.0 dB (NO GR)</text>
          </g>
          <!-- Natural wave -->
          <path d="M 15,65 Q 25,48 35,65 T 55,65 T 75,65 T 95,65 T 115,65 T 135,65" fill="none" stroke="#f59e0b" stroke-width="2" />
          <g transform="translate(14, 80)">
            <rect width="120" height="18" rx="2" fill="#0b1120" />
            <text x="60" y="13" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Full Body Untouched</text>
          </g>
        </g>

        <!-- Band Action Badges -->
        <g transform="translate(10, 162)">
          <g transform="translate(0, 0)">
            <rect width="148" height="38" rx="3" fill="#0f172a" stroke="#1e293b" />
            <text x="74" y="15" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">SNARE &amp; GUITAR BODY</text>
            <text x="74" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Preserves acoustic warmth</text>
          </g>
          <g transform="translate(0, 46)">
            <rect width="148" height="38" rx="3" fill="#0b1120" stroke="#334155" />
            <text x="74" y="15" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">PASS-THROUGH</text>
            <text x="74" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Threshold untouched</text>
          </g>
        </g>
      </g>

      <!-- Band 3: High-Mid (1k – 6k) -->
      <g transform="translate(356, 0)">
        <rect width="168" height="304" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2" />
        
        <!-- Band Title -->
        <g transform="translate(10, 10)">
          <rect width="148" height="24" rx="3" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8" />
          <text x="74" y="16" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">HIGH-MID (1k – 6k)</text>
        </g>
        
        <!-- GR Meter Box -->
        <g transform="translate(10, 42)">
          <rect width="148" height="110" rx="4" fill="#0f172a" stroke="#1e293b" />
          <g transform="translate(14, 10)">
            <rect width="120" height="20" rx="2" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.6" />
            <text x="60" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">ACTIVE: -2.0 dB GR</text>
          </g>
          <!-- Compressed mid wave -->
          <path d="M 15,65 Q 20,52 25,65 T 35,65 T 45,65 T 55,65 T 65,65 T 75,65 T 85,65 T 95,65 T 105,65 T 115,65 T 125,65 T 135,65" fill="none" stroke="#38bdf8" stroke-width="1.8" />
          <g transform="translate(14, 80)">
            <rect width="120" height="18" rx="2" fill="#0b1120" />
            <text x="60" y="13" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">De-Esses Harsh Vocals</text>
          </g>
        </g>

        <!-- Band Action Badges -->
        <g transform="translate(10, 162)">
          <g transform="translate(0, 0)">
            <rect width="148" height="38" rx="3" fill="#0f172a" stroke="#1e293b" />
            <text x="74" y="15" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">HARSHNESS TAMED</text>
            <text x="74" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Controls vocal sibilance</text>
          </g>
          <g transform="translate(0, 46)">
            <rect width="148" height="38" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.6" />
            <text x="74" y="15" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">NO TOP-END DULLING</text>
            <text x="74" y="28" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Air remains open</text>
          </g>
        </g>
      </g>

      <!-- Band 4: High / Air (> 6k) -->
      <g transform="translate(534, 0)">
        <rect width="168" height="304" rx="6" fill="#0b1120" stroke="#a855f7" stroke-width="1.2" />
        
        <!-- Band Title -->
        <g transform="translate(10, 10)">
          <rect width="148" height="24" rx="3" fill="#3b0764" stroke="#a855f7" stroke-width="0.8" />
          <text x="74" y="16" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">HIGH AIR (&gt; 6 kHz)</text>
        </g>
        
        <!-- GR Meter Box -->
        <g transform="translate(10, 42)">
          <rect width="148" height="110" rx="4" fill="#0f172a" stroke="#1e293b" />
          <g transform="translate(14, 10)">
            <rect width="120" height="20" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="0.6" />
            <text x="60" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">0.0 dB (NO GR)</text>
          </g>
          <!-- Shimmer wave -->
          <path d="M 15,65 Q 18,55 21,65 T 27,65 T 33,65 T 39,65 T 45,65 T 51,65 T 57,65 T 63,65 T 69,65 T 75,65 T 81,65 T 87,65 T 93,65 T 99,65 T 105,65 T 111,65 T 117,65 T 123,65 T 129,65 T 135,65" fill="none" stroke="#c084fc" stroke-width="1.5" />
          <g transform="translate(14, 80)">
            <rect width="120" height="18" rx="2" fill="#0b1120" />
            <text x="60" y="13" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Sparkle Untouched</text>
          </g>
        </g>

        <!-- Band Action Badges -->
        <g transform="translate(10, 162)">
          <g transform="translate(0, 0)">
            <rect width="148" height="38" rx="3" fill="#0f172a" stroke="#1e293b" />
            <text x="74" y="15" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">CYMBAL SHIMMER</text>
            <text x="74" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Retains pristine air</text>
          </g>
          <g transform="translate(0, 46)">
            <rect width="148" height="38" rx="3" fill="#0b1120" stroke="#334155" />
            <text x="74" y="15" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">INDEPENDENT PATH</text>
            <text x="74" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Zero cross-band ducking</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar with Enclosed Badge -->
  <g transform="translate(30, 412)">
    <rect width="740" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 14)">
      <rect width="80" height="20" rx="3" fill="#0284c7" />
      <text x="40" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <g transform="translate(100, 12)">
      <rect width="628" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="314" y="16" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Multiband compressors split audio into distinct frequency bands to control dynamics independently.</text>
    </g>
  </g>
</svg>
