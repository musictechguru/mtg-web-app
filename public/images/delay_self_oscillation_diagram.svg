<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.2" />
    <text x="125" y="21" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">DELAY SELF-OSCILLATION</text>
    <rect x="262" y="0" width="310" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="417" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Feedback >= 100% Runaway Oscillation</text>
  </g>

  <!-- Side by side comparison: Normal Feedback vs Runaway Self-Oscillation -->
  <g transform="translate(30, 60)">
    <!-- Normal (Decaying) -->
    <g transform="translate(0, 0)">
      <rect width="355" height="315" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#shadow)" />
      <g transform="translate(16, 14)">
        <rect width="190" height="26" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1" />
        <text x="95" y="18" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">NORMAL FEEDBACK (&lt; 100%)</text>
      </g>
      <!-- Decaying repeats waveform -->
      <g transform="translate(25, 55)">
        <rect width="305" height="160" rx="6" fill="#0b1120" stroke="#1e293b" />
        <line x1="15" y1="80" x2="290" y2="80" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
        <!-- Exponentially decaying peaks -->
        <line x1="50" y1="80" x2="50" y2="20" stroke="#38bdf8" stroke-width="3.5" />
        <line x1="100" y1="80" x2="100" y2="35" stroke="#38bdf8" stroke-width="3" />
        <line x1="150" y1="80" x2="150" y2="50" stroke="#38bdf8" stroke-width="2.5" />
        <line x1="200" y1="80" x2="200" y2="65" stroke="#38bdf8" stroke-width="2" />
        <line x1="250" y1="80" x2="250" y2="73" stroke="#38bdf8" stroke-width="1.5" />
        <!-- Decay envelope curve -->
        <path d="M 50,20 Q 120,45 270,75" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 2" />
      </g>
      <g transform="translate(16, 235)">
        <rect width="323" height="60" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1" />
        <text x="161" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">NATURAL ENERGY DISSIPATION</text>
        <text x="161" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5" text-anchor="middle">Signal attenuates each cycle until silent</text>
      </g>
    </g>

    <!-- Self-Oscillation (Runaway) -->
    <g transform="translate(385, 0)">
      <rect width="355" height="315" rx="8" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.4" filter="url(#shadow)" />
      <g transform="translate(16, 14)">
        <rect width="210" height="26" rx="4" fill="#991b1b" fill-opacity="0.25" stroke="#ef4444" stroke-width="1" />
        <text x="105" y="18" fill="#f87171" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">SELF-OSCILLATION (>= 100%)</text>
      </g>
      <!-- Saturated growing waveform -->
      <g transform="translate(25, 55)">
        <rect width="305" height="160" rx="6" fill="#0b1120" stroke="#1e293b" />
        <!-- Clip thresholds -->
        <line x1="15" y1="25" x2="290" y2="25" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2" />
        <line x1="15" y1="135" x2="290" y2="135" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2" />
        <!-- Growing saturated square-ish wave -->
        <path d="M 20,80 Q 35,50 50,80 T 80,80 Q 95,25 110,25 L 125,25 Q 140,135 155,135 L 170,135 Q 185,25 200,25 L 215,25 Q 230,135 245,135 L 260,135 Q 275,25 290,25" fill="none" stroke="#ef4444" stroke-width="3" />
        <rect x="75" y="5" width="155" height="20" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="0.8" />
        <text x="152" y="19" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">ANALOG TAPE SATURATION</text>
      </g>
      <g transform="translate(16, 235)">
        <rect width="323" height="60" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1" />
        <text x="161" y="24" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">INFINITE REGENERATIVE RUNAWAY</text>
        <text x="161" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5" text-anchor="middle">Circuit builds energy and distorts into a synth tone</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="24" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="44" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Definition: At 100%+ feedback, delay energy loops infinitely, generating saturated runaway analog oscillation.</text>
  </g>
</svg>