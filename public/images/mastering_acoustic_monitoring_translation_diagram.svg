<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Header Badges -->
  <g transform="translate(30, 16)">
    <rect width="210" height="32" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2" />
    <text x="105" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ACOUSTIC MONITORING</text>
    <rect x="222" y="0" width="440" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="442" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Why Mastering Requires an Acoustically Treated Environment</text>
  </g>

  <!-- Main Comparison Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="340" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left Column: Treated Mastering Room (Accurate) -->
    <g transform="translate(20, 18)">
      <rect width="345" height="304" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
      
      <!-- Title Badge -->
      <g transform="translate(15, 12)">
        <rect width="315" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
        <text x="157" y="17" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">TREATED MASTERING ENVIRONMENT</text>
      </g>

      <!-- Ruler-Flat Curve Graphic -->
      <g transform="translate(15, 46)">
        <rect width="315" height="95" rx="4" fill="#030712" stroke="#1e293b" />
        
        <!-- Grid lines -->
        <line x1="15" y1="20" x2="300" y2="20" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" />
        <line x1="15" y1="48" x2="300" y2="48" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="15" y1="76" x2="300" y2="76" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" />

        <!-- Ruler-Flat response curve -->
        <path d="M 15,48 L 50,47 L 90,49 L 140,48 L 190,47 L 240,48 L 270,49 L 300,48" fill="none" stroke="#10b981" stroke-width="3" />

        <!-- Flat Indicator Badge -->
        <g transform="translate(15, 8)">
          <rect width="130" height="18" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="0.6" />
          <text x="65" y="13" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">RULER-FLAT (+/- 1.5 dB)</text>
        </g>
        <g transform="translate(195, 8)">
          <rect width="105" height="18" rx="2" fill="#0b1120" stroke="#334155" />
          <text x="52" y="13" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">20 Hz – 20 kHz TRUE</text>
        </g>
      </g>

      <!-- Key Benefits in Badges -->
      <g transform="translate(15, 150)">
        <g transform="translate(0, 0)">
          <rect width="315" height="32" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="157" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">1. BASS TRAPS REMOVE ROOM MODES</text>
          <text x="157" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Stops artificial bass buildup and frequency cancellations</text>
        </g>
        <g transform="translate(0, 36)">
          <rect width="315" height="32" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="157" y="14" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">2. REFLECTION-FREE ZONE (RFZ)</text>
          <text x="157" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Side panels absorb early reflections, clarifying stereo imaging</text>
        </g>
        <g transform="translate(0, 72)">
          <rect width="315" height="36" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
          <text x="157" y="15" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">CONFIDENT, ACCURATE EQ DECISIONS</text>
          <text x="157" y="28" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" text-anchor="middle">What you hear is the actual recording—masters translate everywhere</text>
        </g>
      </g>
    </g>

    <!-- Right Column: Untreated Room Dangers (False Acoustics) -->
    <g transform="translate(380, 18)">
      <rect width="340" height="304" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1.2" />

      <!-- Title Badge -->
      <g transform="translate(15, 12)">
        <rect width="310" height="26" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
        <text x="155" y="17" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">UNTREATED ROOM DANGERS (FALSE TRUTH)</text>
      </g>

      <!-- Jagged Distorted Curve Graphic -->
      <g transform="translate(15, 46)">
        <rect width="310" height="95" rx="4" fill="#030712" stroke="#1e293b" />
        
        <!-- Grid lines -->
        <line x1="15" y1="20" x2="295" y2="20" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" />
        <line x1="15" y1="48" x2="295" y2="48" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
        <line x1="15" y1="76" x2="295" y2="76" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 2" />

        <!-- Jagged curve showing room mode peak & deep null -->
        <path d="M 15,48 Q 30,12 50,14 Q 70,16 85,82 Q 105,85 125,46 Q 145,28 165,34 Q 185,60 205,48 Q 225,32 245,55 Q 265,40 285,48" fill="none" stroke="#ef4444" stroke-width="2.5" />

        <!-- Peak and Null Badges -->
        <g transform="translate(15, 8)">
          <rect width="115" height="18" rx="2" fill="#7f1d1d" stroke="#ef4444" stroke-width="0.6" />
          <text x="57" y="13" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">+15 dB BASS BOOM</text>
        </g>
        <g transform="translate(180, 8)">
          <rect width="115" height="18" rx="2" fill="#450a0a" stroke="#ef4444" stroke-width="0.6" />
          <text x="57" y="13" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">-18 dB SUB NULL</text>
        </g>
      </g>

      <!-- Key Dangers in Badges -->
      <g transform="translate(15, 150)">
        <g transform="translate(0, 0)">
          <rect width="310" height="32" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="155" y="14" fill="#f87171" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">FALSE PEAKS TRICK YOU TO CUT BASS</text>
          <text x="155" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">You cut 80 Hz EQ; master sounds thin and empty on earbuds</text>
        </g>
        <g transform="translate(0, 36)">
          <rect width="310" height="32" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="155" y="14" fill="#f87171" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">FALSE NULLS TRICK YOU TO BOOST SUB</text>
          <text x="155" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">You boost sub-bass; master horribly distorts on car PAs</text>
        </g>
        <g transform="translate(0, 72)">
          <rect width="310" height="36" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
          <text x="155" y="15" fill="#f87171" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">DISASTROUS COMPENSATORY EQ</text>
          <text x="155" y="28" fill="#fee2e2" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" text-anchor="middle">You end up EQing the room's acoustic flaws into the record</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar with Enclosed Badge -->
  <g transform="translate(30, 412)">
    <rect width="740" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 14)">
      <rect width="80" height="20" rx="3" fill="#0284c7" />
      <text x="40" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <g transform="translate(100, 12)">
      <rect width="628" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="314" y="16" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">A treated room delivers an uncolored acoustic truth, preventing false compensatory EQ decisions that ruin translation.</text>
    </g>
  </g>
</svg>
