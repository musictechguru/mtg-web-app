<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">PHASER ARCHITECTURE</text>
    <rect x="262" y="0" width="310" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="417" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">All-Pass Filter Phase Shift Notches</text>
  </g>

  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#shadow)" />
    
    <!-- All-Pass Filter Stages Signal Chain -->
    <g transform="translate(50, 40)">
      <rect width="90" height="36" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5" />
      <text x="45" y="22" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">AUDIO IN</text>

      <!-- 4 Cascaded All-Pass Filter Stages -->
      <line x1="90" y1="18" x2="130" y2="18" stroke="#38bdf8" stroke-width="2" />
      
      <!-- Stage 1 -->
      <g transform="translate(130, 0)">
        <rect width="80" height="36" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
        <text x="40" y="22" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">ALL-PASS 1</text>
      </g>
      <line x1="210" y1="18" x2="230" y2="18" stroke="#a855f7" stroke-width="2" />

      <!-- Stage 2 -->
      <g transform="translate(230, 0)">
        <rect width="80" height="36" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
        <text x="40" y="22" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">ALL-PASS 2</text>
      </g>
      <line x1="310" y1="18" x2="330" y2="18" stroke="#a855f7" stroke-width="2" />

      <!-- Stage 3 -->
      <g transform="translate(330, 0)">
        <rect width="80" height="36" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
        <text x="40" y="22" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">ALL-PASS 3</text>
      </g>
      <line x1="410" y1="18" x2="430" y2="18" stroke="#a855f7" stroke-width="2" />

      <!-- Stage 4 -->
      <g transform="translate(430, 0)">
        <rect width="80" height="36" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
        <text x="40" y="22" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">ALL-PASS 4</text>
      </g>
      <line x1="510" y1="18" x2="550" y2="18" stroke="#38bdf8" stroke-width="2" />

      <!-- Output Mixer Node -->
      <g transform="translate(550, 0)">
        <circle cx="18" cy="18" r="18" fill="#0f172a" stroke="#10b981" stroke-width="2" />
        <text x="18" y="23" fill="#10b981" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="middle">+</text>
      </g>
    </g>

    <!-- Phase Cancellation Notches Graph Screen -->
    <g transform="translate(50, 110)">
      <rect width="640" height="135" rx="6" fill="#0b1120" stroke="#1e293b" />
      <line x1="0" y1="25" x2="640" y2="25" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
      
      <!-- Phase Cancellation Notches Curve -->
      <path d="M 20,25 Q 70,25 90,110 Q 110,25 180,25 Q 230,25 250,110 Q 270,25 360,25 Q 410,25 430,110 Q 450,25 540,25 Q 580,25 600,110 Q 610,25 630,25" fill="none" stroke="#38bdf8" stroke-width="2.8" />
      
      <!-- LFO Sweep Arrow -->
      <g transform="translate(260, 45)">
        <rect width="120" height="24" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />
        <text x="60" y="16" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">&lt; LFO SWEEP &gt;</text>
      </g>
    </g>

    <!-- Contrast Pill -->
    <g transform="translate(160, 260)">
      <rect width="420" height="34" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1" />
      <text x="210" y="21" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">NO DELAY LINE: Uses all-pass filters to invert phase at notches</text>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="24" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="44" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Distinction: Unlike delay-based chorus/flanger, a phaser uses all-pass filters to sweep phase cancellation notches.</text>
  </g>
</svg>