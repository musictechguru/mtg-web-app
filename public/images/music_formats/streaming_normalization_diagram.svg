<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(30, 16)">
    <rect width="280" height="32" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2" />
    <text x="140" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">STREAMING NORMALIZATION</text>
    <rect x="292" y="0" width="370" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="477" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Playback Level Matching to -14 LUFS Streaming Target</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left: Hyper-Compressed Master (-8 LUFS) -->
    <g transform="translate(20, 20)">
      <rect width="335" height="275" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1.2" />
      <g transform="translate(15, 12)">
        <rect width="210" height="24" rx="4" fill="#450a0a" />
        <text x="105" y="16" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">CRUSHED MASTER (-8 LUFS)</text>
      </g>

      <!-- Waveform graphic before & after normalisation -->
      <g transform="translate(15, 48)">
        <rect width="305" height="120" rx="4" fill="#0f172a" stroke="#1e293b" />
        <!-- Sausage brick waveform -->
        <rect x="25" y="25" width="255" height="30" rx="2" fill="#ef4444" fill-opacity="0.8" />
        <g transform="translate(30, 30)">
          <text x="120" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="900" text-anchor="middle">SQUASHED WAVEFORM (-8 LUFS)</text>
        </g>

        <!-- Downward arrow -->
        <g transform="translate(130, 60)">
          <rect width="90" height="18" rx="2" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
          <text x="45" y="13" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">ATTENUATED -6 dB</text>
        </g>

        <!-- Attenuated result waveform -->
        <rect x="25" y="84" width="255" height="16" rx="2" fill="#ef4444" fill-opacity="0.4" />
        <g transform="translate(30, 84)">
          <text x="120" y="12" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">NORMALIZED TO -14 LUFS</text>
        </g>
      </g>

      <g transform="translate(15, 180)">
        <rect width="305" height="80" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="0.8" />
        <text x="12" y="22" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">The Loudness War Penalty</text>
        <text x="12" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Gained zero extra volume on Spotify</text>
        <text x="12" y="56" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Sacrificed punch, impact, and clarity</text>
        <text x="12" y="70" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="8.5">• Sounds small and flat next to dynamic songs</text>
      </g>
    </g>

    <!-- Right: Dynamic Master (-14 LUFS) -->
    <g transform="translate(385, 20)">
      <rect width="335" height="275" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
      <g transform="translate(15, 12)">
        <rect width="210" height="24" rx="4" fill="#064e3b" />
        <text x="105" y="16" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">DYNAMIC MASTER (-14 LUFS)</text>
      </g>

      <!-- Waveform graphic before & after normalisation -->
      <g transform="translate(15, 48)">
        <rect width="305" height="120" rx="4" fill="#0f172a" stroke="#1e293b" />
        <!-- Dynamic peaky waveform -->
        <path d="M 25,40 L 40,20 L 55,40 L 70,55 L 85,40 L 100,18 L 120,40 L 140,58 L 160,40 L 180,22 L 200,40 L 220,55 L 240,40 L 260,18 L 280,40" fill="none" stroke="#10b981" stroke-width="2.2" />
        <g transform="translate(30, 22)">
          <rect width="130" height="16" rx="2" fill="#064e3b" />
          <text x="65" y="12" fill="#34d399" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">DYNAMIC TRANSIENTS</text>
        </g>

        <!-- Zero attenuation badge -->
        <g transform="translate(130, 60)">
          <rect width="90" height="18" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
          <text x="45" y="13" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">0 dB ATTENUATION</text>
        </g>

        <!-- Unaltered dynamic waveform -->
        <path d="M 25,95 L 40,80 L 55,95 L 70,110 L 85,95 L 100,78 L 120,95 L 140,112 L 160,95 L 180,82 L 200,95 L 220,110 L 240,95 L 260,78 L 280,95" fill="none" stroke="#10b981" stroke-width="2.2" />
      </g>

      <g transform="translate(15, 180)">
        <rect width="305" height="80" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
        <text x="12" y="22" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Competitive &amp; Open Dynamics</text>
        <text x="12" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Played at original master level (0 dB change)</text>
        <text x="12" y="56" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Drum transients remain punchy and crisp</text>
        <text x="12" y="70" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8.5">• Sounds louder, wider, and more impactful</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 12)">
      <rect width="75" height="20" rx="3" fill="#0284c7" />
      <text x="37" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="98" y="27" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Streaming normalization lowers loud tracks to -14 LUFS, rewarding dynamic masters with greater punch.</text>
  </g>
</svg>
