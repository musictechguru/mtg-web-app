<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Header Badges -->
  <g transform="translate(30, 16)">
    <rect width="180" height="32" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2" />
    <text x="90" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">AUDIO FORMATS</text>
    <rect x="192" y="0" width="460" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="422" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Uncompressed Lossless (WAV) vs Lossy Perceptual Coding (MP3)</text>
  </g>

  <!-- Main Comparison Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="340" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left Column: WAV Card -->
    <g transform="translate(20, 18)">
      <rect width="340" height="304" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
      
      <!-- Title Badge -->
      <g transform="translate(15, 12)">
        <rect width="310" height="26" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
        <text x="155" y="17" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">WAV (WAVEFORM AUDIO)</text>
      </g>

      <!-- Category Chip -->
      <g transform="translate(15, 46)">
        <rect width="310" height="26" rx="3" fill="#0f172a" stroke="#1e293b" />
        <text x="155" y="17" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">TYPE: UNCOMPRESSED LINEAR PCM</text>
      </g>

      <!-- Visual Spec Blocks -->
      <g transform="translate(15, 80)">
        <g transform="translate(0, 0)">
          <rect width="150" height="42" rx="4" fill="#0f172a" stroke="#1e293b" />
          <text x="75" y="16" fill="#10b981" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">BITRATE / FIDELITY</text>
          <text x="75" y="30" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">1411 kbps (16-bit / 44.1k)</text>
        </g>
        <g transform="translate(160, 0)">
          <rect width="150" height="42" rx="4" fill="#0f172a" stroke="#1e293b" />
          <text x="75" y="16" fill="#10b981" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">FILE SIZE</text>
          <text x="75" y="30" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">~10 MB per minute (Large)</text>
        </g>
      </g>

      <!-- Waveform graphic representation -->
      <g transform="translate(15, 130)">
        <rect width="310" height="52" rx="4" fill="#030712" stroke="#1e293b" />
        <path d="M 10,26 L 30,8 L 50,44 L 70,12 L 90,40 L 110,16 L 130,36 L 150,6 L 170,46 L 190,14 L 210,38 L 230,10 L 250,42 L 270,18 L 290,34 L 300,26" fill="none" stroke="#10b981" stroke-width="2" />
        <g transform="translate(180, 6)">
          <rect width="120" height="16" rx="2" fill="#064e3b" />
          <text x="60" y="11" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" text-anchor="middle">100% UNTOUCHED SAMPLES</text>
        </g>
      </g>

      <!-- Key Details Badges -->
      <g transform="translate(15, 190)">
        <g transform="translate(0, 0)">
          <rect width="310" height="24" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="155" y="16" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Full dynamic range &amp; complete frequency spectrum</text>
        </g>
        <g transform="translate(0, 28)">
          <rect width="310" height="24" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="155" y="16" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Zero generation loss across multiple DAW exports</text>
        </g>
        <g transform="translate(0, 56)">
          <rect width="310" height="24" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
          <text x="155" y="16" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">BEST FOR: Studio Recording, Mixing &amp; Mastering</text>
        </g>
      </g>
    </g>

    <!-- Right Column: MP3 Card -->
    <g transform="translate(380, 18)">
      <rect width="340" height="304" rx="6" fill="#0b1120" stroke="#f59e0b" stroke-width="1.2" />

      <!-- Title Badge -->
      <g transform="translate(15, 12)">
        <rect width="310" height="26" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="0.8" />
        <text x="155" y="17" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">MP3 (MPEG-1 LAYER III)</text>
      </g>

      <!-- Category Chip -->
      <g transform="translate(15, 46)">
        <rect width="310" height="26" rx="3" fill="#0f172a" stroke="#1e293b" />
        <text x="155" y="17" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">TYPE: LOSSY PERCEPTUAL CODING</text>
      </g>

      <!-- Visual Spec Blocks -->
      <g transform="translate(15, 80)">
        <g transform="translate(0, 0)">
          <rect width="150" height="42" rx="4" fill="#0f172a" stroke="#1e293b" />
          <text x="75" y="16" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">BITRATE / FIDELITY</text>
          <text x="75" y="30" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">128 kbps – 320 kbps (Lossy)</text>
        </g>
        <g transform="translate(160, 0)">
          <rect width="150" height="42" rx="4" fill="#0f172a" stroke="#1e293b" />
          <text x="75" y="16" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">FILE SIZE</text>
          <text x="75" y="30" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">~1 MB per minute (~90% smaller)</text>
        </g>
      </g>

      <!-- Waveform graphic representation -->
      <g transform="translate(15, 130)">
        <rect width="310" height="52" rx="4" fill="#030712" stroke="#1e293b" />
        <path d="M 10,26 L 30,12 L 50,40 L 70,16 L 90,36 L 110,20 L 130,32 L 150,10 L 170,42 L 190,18 L 210,34 L 230,14 L 250,38 L 270,22 L 290,30 L 300,26" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2" />
        <g transform="translate(150, 6)">
          <rect width="150" height="16" rx="2" fill="#451a03" />
          <text x="75" y="11" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="7" font-weight="800" text-anchor="middle">MASKED DATA PERMANENTLY CUT</text>
        </g>
      </g>

      <!-- Key Details Badges -->
      <g transform="translate(15, 190)">
        <g transform="translate(0, 0)">
          <rect width="310" height="24" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="155" y="16" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Discards inaudible frequencies (perceptual masking)</text>
        </g>
        <g transform="translate(0, 28)">
          <rect width="310" height="24" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="155" y="16" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Re-encoding degrades quality (compression artifacts)</text>
        </g>
        <g transform="translate(0, 56)">
          <rect width="310" height="24" rx="3" fill="#451a03" stroke="#f59e0b" stroke-width="0.8" />
          <text x="155" y="16" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">BEST FOR: Consumer Streaming, Web &amp; Mobile</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar with Enclosed Badge -->
  <g transform="translate(30, 412)">
    <rect width="740" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 14)">
      <rect width="80" height="20" rx="3" fill="#0284c7" />
      <text x="40" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <g transform="translate(98, 12)">
      <rect width="630" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="315" y="16" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">WAV stores uncompressed lossless linear PCM; MP3 uses lossy perceptual compression to discard masked data.</text>
    </g>
  </g>
</svg>
