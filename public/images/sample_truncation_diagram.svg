<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="30" y="24" width="230" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="145" y="45" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">SAMPLE TRUNCATION</text>
  <text x="280" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Trimming unused audio data to optimize memory and transient response</text>

  <!-- Main Waveform Canvas -->
  <rect x="50" y="80" width="700" height="230" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.5" />

  <!-- Center zero line -->
  <line x1="50" y1="195" x2="750" y2="195" stroke="#1e293b" stroke-width="1.5" />

  <!-- Pre-roll Truncated Section (Dead Air / Noise) -->
  <rect x="50" y="80" width="130" height="230" fill="#ef4444" fill-opacity="0.1" />
  <!-- Low noise wave in pre-roll -->
  <path d="M 50,195 Q 70,198 90,195 T 130,196 T 170,194 L 180,195" fill="none" stroke="#64748b" stroke-width="1.5" />

  <!-- Active Sample Section (Highlighted) -->
  <rect x="180" y="80" width="370" height="230" fill="#0284c7" fill-opacity="0.12" />

  <!-- The Active Drum Transient Waveform -->
  <path d="M 180,195 
           L 186,105 L 194,280 L 204,120 L 216,260 L 230,145 L 246,235 L 265,165 
           L 290,220 L 320,175 L 360,210 L 410,185 L 460,202 L 510,192 L 550,195" 
        fill="none" stroke="#38bdf8" stroke-width="2.8" stroke-linejoin="round" />

  <!-- Post-decay Truncated Section (Tail Room Noise) -->
  <rect x="550" y="80" width="200" height="230" fill="#ef4444" fill-opacity="0.1" />
  <path d="M 550,195 Q 590,197 630,195 T 700,196 T 750,195" fill="none" stroke="#64748b" stroke-width="1.5" />

  <!-- START MARKER -->
  <line x1="180" y1="80" x2="180" y2="310" stroke="#22c55e" stroke-width="2.5" />
  <rect x="135" y="88" width="90" height="26" rx="4" fill="#15803d" stroke="#22c55e" stroke-width="1" />
  <text x="180" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">START POINT</text>
  <text x="180" y="130" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Tight on transient</text>

  <!-- END MARKER -->
  <line x1="550" y1="80" x2="550" y2="310" stroke="#ef4444" stroke-width="2.5" />
  <rect x="510" y="88" width="80" height="26" rx="4" fill="#b91c1c" stroke="#ef4444" stroke-width="1" />
  <text x="550" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">END POINT</text>
  <text x="550" y="130" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Cut after decay</text>

  <!-- Cut / Deleted Callouts -->
  <text x="115" y="235" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TRUNCATED</text>
  <text x="115" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">(Dead air removed)</text>

  <text x="650" y="235" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TRUNCATED</text>
  <text x="650" y="252" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" text-anchor="middle">(Silence discarded)</text>

  <!-- Active Retained Area Label -->
  <rect x="290" y="270" width="150" height="26" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
  <text x="365" y="287" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ACTIVE SAMPLE IN RAM</text>

  <!-- Footer Information Strip -->
  <rect x="50" y="330" width="700" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="70" y="354" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">TWO CRITICAL ADVANTAGES OF TRUNCATION:</text>
  <text x="70" y="374" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">1. <strong style="fill:#38bdf8;">Zero Playback Latency:</strong> Sound fires the exact millisecond a MIDI note is pressed without pre-roll lag.</text>
  <text x="70" y="390" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">2. <strong style="fill:#38bdf8;">Memory Efficiency:</strong> Permanently discards unused audio samples to preserve limited hardware / software RAM.</text>
</svg>
