<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Header Badges -->
  <g transform="translate(30, 16)">
    <rect width="180" height="32" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2" />
    <text x="90" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">AUDIO HEADROOM</text>
    <rect x="192" y="0" width="420" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="402" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">What is Headroom? &amp; Why Maintaining it is Essential</text>
  </g>

  <!-- Main Card Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="340" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left: Dedicated Headroom Level Meter -->
    <g transform="translate(25, 20)">
      <rect width="270" height="300" rx="6" fill="#0b1120" stroke="#1e293b" />
      
      <!-- Title Chip -->
      <g transform="translate(15, 12)">
        <rect width="240" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text x="120" y="16" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">HEADROOM ANATOMY</text>
      </g>

      <!-- Meter Visual -->
      <g transform="translate(25, 48)">
        <!-- Scale Bar Outer -->
        <rect x="0" y="0" width="42" height="236" rx="4" fill="#0f172a" stroke="#334155" />

        <!-- 1. Hard Red Clip Zone: 0 dBFS and above -->
        <rect x="3" y="3" width="36" height="28" fill="#ef4444" fill-opacity="0.9" />
        <!-- 2. Amber Headroom Zone: -6 dBFS to 0 dBFS -->
        <rect x="3" y="31" width="36" height="52" fill="#f59e0b" fill-opacity="0.35" />
        <!-- 3. Green Signal Level Zone: Peak to -18 dBFS -->
        <rect x="3" y="83" width="36" height="70" fill="#10b981" />
        <!-- 4. Quiet / Noise floor lower zone -->
        <rect x="3" y="153" width="36" height="80" fill="#065f46" />

        <!-- Peak Line Indicator -->
        <line x1="0" y1="83" x2="48" y2="83" stroke="#fca5a5" stroke-width="2.5" />

        <!-- Right Side Scale Labels in Badges -->
        <g transform="translate(54, 0)">
          <!-- 0 dBFS Ceiling Badge -->
          <g transform="translate(0, 8)">
            <rect width="70" height="20" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
            <text x="35" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">0 dBFS CEIL</text>
          </g>

          <!-- Headroom Bracket Badge -->
          <g transform="translate(0, 42)">
            <rect width="135" height="34" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
            <text x="67" y="15" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">HEADROOM ZONE</text>
            <text x="67" y="27" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">Buffer Before Clipping</text>
          </g>

          <!-- Peak Level Badge -->
          <g transform="translate(0, 90)">
            <rect width="80" height="20" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1" />
            <text x="40" y="14" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">PEAK SIGNAL</text>
          </g>

          <!-- RMS / Average Badge -->
          <g transform="translate(0, 142)">
            <rect width="80" height="20" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1" />
            <text x="40" y="14" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">AVERAGE (RMS)</text>
          </g>

          <!-- Noise Floor Badge -->
          <g transform="translate(0, 202)">
            <rect width="80" height="20" rx="3" fill="#020617" stroke="#1e293b" stroke-width="1" />
            <text x="40" y="14" fill="#64748b" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">NOISE FLOOR</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Right: Explanatory Breakdown: What It Is & Why It Is Important -->
    <g transform="translate(315, 20)">
      
      <!-- Top Box: What is Headroom? -->
      <g transform="translate(0, 0)">
        <rect width="400" height="85" rx="6" fill="#0b1120" stroke="#1e293b" />
        <g transform="translate(14, 10)">
          <rect width="165" height="22" rx="3" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.8" />
          <text x="82" y="15" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">WHAT IS HEADROOM?</text>
        </g>
        <g transform="translate(14, 38)">
          <rect width="372" height="36" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
          <text x="186" y="16" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">The safety distance between highest musical peak</text>
          <text x="186" y="28" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">and the maximum clipping ceiling (0 dBFS digital)</text>
        </g>
      </g>

      <!-- Bottom Split: Why It's Important (With vs Without Headroom) -->
      <g transform="translate(0, 95)">
        
        <!-- Left Sub-card: Why It's Important (Benefits) -->
        <g transform="translate(0, 0)">
          <rect width="195" height="205" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
          <g transform="translate(10, 10)">
            <rect width="175" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
            <text x="87" y="16" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">WHY IT IS IMPORTANT</text>
          </g>
          
          <!-- Benefit Badges -->
          <g transform="translate(10, 42)">
            <rect width="175" height="32" rx="3" fill="#0f172a" stroke="#1e293b" />
            <text x="87" y="14" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">1. PREVENTS CLIPPING</text>
            <text x="87" y="25" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Stops harsh 0 dBFS distortion</text>
          </g>
          <g transform="translate(10, 80)">
            <rect width="175" height="32" rx="3" fill="#0f172a" stroke="#1e293b" />
            <text x="87" y="14" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">2. PROCESSING SPACE</text>
            <text x="87" y="25" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Allows EQ boosts &amp; compression</text>
          </g>
          <g transform="translate(10, 118)">
            <rect width="175" height="32" rx="3" fill="#0f172a" stroke="#1e293b" />
            <text x="87" y="14" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">3. PRESERVES TRANSIENTS</text>
            <text x="87" y="25" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Snare &amp; kick punch intact</text>
          </g>
          <g transform="translate(10, 156)">
            <rect width="175" height="36" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
            <text x="87" y="16" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">MASTERING READY</text>
            <text x="87" y="28" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Clean signal for final stage</text>
          </g>
        </g>

        <!-- Right Sub-card: Danger of No Headroom -->
        <g transform="translate(205, 0)">
          <rect width="195" height="205" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1.2" />
          <g transform="translate(10, 10)">
            <rect width="175" height="24" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
            <text x="87" y="16" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">NO HEADROOM RISKS</text>
          </g>

          <!-- Danger Badges -->
          <g transform="translate(10, 42)">
            <rect width="175" height="32" rx="3" fill="#0f172a" stroke="#1e293b" />
            <text x="87" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">1. HARD CLIPPING</text>
            <text x="87" y="25" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Square-wave digital distortion</text>
          </g>
          <g transform="translate(10, 80)">
            <rect width="175" height="32" rx="3" fill="#0f172a" stroke="#1e293b" />
            <text x="87" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">2. INTER-SAMPLE PEAKS</text>
            <text x="87" y="25" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">D/A converters distort</text>
          </g>
          <g transform="translate(10, 118)">
            <rect width="175" height="32" rx="3" fill="#0f172a" stroke="#1e293b" />
            <text x="87" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">3. LOSS OF DYNAMICS</text>
            <text x="87" y="25" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Transients crushed flat</text>
          </g>
          <g transform="translate(10, 156)">
            <rect width="175" height="36" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
            <text x="87" y="16" fill="#f87171" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">PROCESSING CHOKE</text>
            <text x="87" y="28" fill="#fee2e2" font-family="-apple-system, sans-serif" font-size="7.5" text-anchor="middle">Zero room for EQ or limiting</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar with Enclosed Badge -->
  <g transform="translate(30, 412)">
    <rect width="740" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 14)">
      <rect width="80" height="20" rx="3" fill="#0284c7" />
      <text x="40" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <g transform="translate(98, 12)">
      <rect width="630" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="315" y="16" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Headroom is the safety gap below clipping; maintaining it prevents distortion and enables clean processing.</text>
    </g>
  </g>
</svg>
