<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">CHORUS EFFECT ARCHITECTURE</text>
    <rect x="262" y="0" width="310" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="417" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">LFO-Modulated Delay Causing Pitch Detuning</text>
  </g>

  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#shadow)" />
    
    <!-- Signal Flow: Input Split -->
    <g transform="translate(45, 120)">
      <rect width="100" height="36" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5" />
      <text x="50" y="22" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">AUDIO IN</text>
    </g>

    <!-- Branching lines -->
    <!-- Direct Dry Path -->
    <line x1="145" y1="138" x2="220" y2="70" stroke="#38bdf8" stroke-width="2" />
    <line x1="220" y1="70" x2="520" y2="70" stroke="#38bdf8" stroke-width="2" />
    <line x1="520" y1="70" x2="590" y2="128" stroke="#38bdf8" stroke-width="2" />
    <rect x="310" y="56" width="120" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="370" y="72" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Dry Unaltered Path</text>

    <!-- Wet Modulated Path -->
    <line x1="145" y1="138" x2="220" y2="200" stroke="#fbbf24" stroke-width="2" />
    <line x1="220" y1="200" x2="280" y2="200" stroke="#fbbf24" stroke-width="2" />

    <!-- Short Delay Buffer Box -->
    <g transform="translate(280, 165)">
      <rect width="180" height="70" rx="6" fill="#0b1120" stroke="#fbbf24" stroke-width="1.8" />
      <text x="90" y="30" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">SHORT DELAY BUFFER</text>
      <rect x="35" y="40" width="110" height="20" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8" />
      <text x="90" y="54" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">15 ms – 30 ms</text>
    </g>

    <!-- LFO (Low Frequency Oscillator) Modulating Delay Time -->
    <g transform="translate(320, 255)">
      <rect x="-50" y="0" width="100" height="34" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
      <text x="0" y="21" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">LFO (0.5 – 3 Hz)</text>
      <!-- Arrow pointing up to delay buffer -->
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#a855f7" stroke-width="2" />
      <polygon points="0,-20 -4,-12 4,-12" fill="#a855f7" />
    </g>

    <line x1="460" y1="200" x2="520" y2="200" stroke="#fbbf24" stroke-width="2" />
    <line x1="520" y1="200" x2="590" y2="148" stroke="#fbbf24" stroke-width="2" />

    <!-- Output Mixer Node -->
    <g transform="translate(590, 120)">
      <circle cx="18" cy="18" r="18" fill="#0f172a" stroke="#10b981" stroke-width="2" />
      <text x="18" y="23" fill="#10b981" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="middle">+</text>
    </g>

    <line x1="626" y1="138" x2="660" y2="138" stroke="#10b981" stroke-width="2" />
    <polygon points="665,138 655,133 655,143" fill="#10b981" />

    <!-- Output Badge -->
    <g transform="translate(545, 175)">
      <rect width="160" height="26" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="1" />
      <text x="80" y="17" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">ENSEMBLE CHORUS OUT</text>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="24" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="44" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Mechanics: Modulating a short delay time with an LFO creates subtle pitch fluctuations that emulate an ensemble.</text>
  </g>
</svg>