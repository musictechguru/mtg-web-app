<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="metalFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="10%" stop-color="#1a202c" />
      <stop offset="90%" stop-color="#171923" />
      <stop offset="100%" stop-color="#0d0e12" />
    </linearGradient>
    <linearGradient id="vuGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <radialGradient id="knobMetal" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="70%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#000" />
    </radialGradient>
  </defs>

  <!-- Background Rack Case -->
  <rect width="900" height="450" rx="14" fill="#090d16" stroke="#334155" stroke-width="2" />
  
  <!-- Rack Ears & Main 1176 Chassis (2U) -->
  <rect x="30" y="50" width="840" height="300" rx="6" fill="url(#metalFace)" stroke="#4a5568" stroke-width="3" />
  
  <!-- Rack Screws -->
  <circle cx="50" cy="70" r="7" fill="#718096" stroke="#1a202c" />
  <line x1="45" y1="70" x2="55" y2="70" stroke="#1a202c" stroke-width="2" />
  <circle cx="50" cy="330" r="7" fill="#718096" stroke="#1a202c" />
  <line x1="45" y1="330" x2="55" y2="330" stroke="#1a202c" stroke-width="2" />
  <circle cx="850" cy="70" r="7" fill="#718096" stroke="#1a202c" />
  <line x1="845" y1="70" x2="855" y2="70" stroke="#1a202c" stroke-width="2" />
  <circle cx="850" cy="330" r="7" fill="#718096" stroke="#1a202c" />
  <line x1="845" y1="330" x2="855" y2="330" stroke="#1a202c" stroke-width="2" />

  <!-- Logo and Model Text -->
  <text x="90" y="90" fill="#f7fafc" font-family="'Courier New', monospace" font-size="16" font-weight="900" letter-spacing="2">UNIVERSAL AUDIO</text>
  <text x="90" y="115" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="24" font-weight="900" letter-spacing="1">1176 LN</text>
  <text x="90" y="132" fill="#a0aec0" font-family="Inter, sans-serif" font-size="11" font-weight="700">LIMITING AMPLIFIER</text>

  <!-- 1. INPUT KNOB (Controls Compression Threshold) -->
  <g transform="translate(180, 210)">
    <circle cx="0" cy="0" r="48" fill="url(#knobMetal)" stroke="#718096" stroke-width="2" />
    <circle cx="0" cy="0" r="32" fill="#1a202c" />
    <!-- Indicator line pointing to ~2 o'clock (pushed high for heavy compression) -->
    <line x1="0" y1="0" x2="24" y2="-20" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <text x="0" y="70" fill="#f7fafc" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">INPUT</text>
    <text x="0" y="86" fill="#a0aec0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">(Prives Compression)</text>
  </g>

  <!-- 2. OUTPUT KNOB (Makeup Gain) -->
  <g transform="translate(320, 210)">
    <circle cx="0" cy="0" r="48" fill="url(#knobMetal)" stroke="#718096" stroke-width="2" />
    <circle cx="0" cy="0" r="32" fill="#1a202c" />
    <!-- Indicator line at 12 o'clock -->
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <text x="0" y="70" fill="#f7fafc" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">OUTPUT</text>
    <text x="0" y="86" fill="#a0aec0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">(Makeup Level)</text>
  </g>

  <!-- 3. ATTACK & RELEASE (Faster to the Right!) -->
  <g transform="translate(430, 165)">
    <circle cx="0" cy="0" r="24" fill="url(#knobMetal)" stroke="#718096" stroke-width="1.5" />
    <line x1="0" y1="0" x2="16" y2="4" stroke="#fff" stroke-width="2.5" />
    <text x="0" y="38" fill="#f7fafc" font-family="Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">ATTACK</text>
    <text x="0" y="52" fill="#cbd5e0" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Fastest at 7</text>
  </g>

  <g transform="translate(430, 260)">
    <circle cx="0" cy="0" r="24" fill="url(#knobMetal)" stroke="#718096" stroke-width="1.5" />
    <line x1="0" y1="0" x2="16" y2="4" stroke="#fff" stroke-width="2.5" />
    <text x="0" y="38" fill="#f7fafc" font-family="Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">RELEASE</text>
    <text x="0" y="52" fill="#cbd5e0" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Fastest at 7</text>
  </g>

  <!-- 4. RATIO BUTTONS (ALL-BUTTONS-IN / BRITISH MODE) -->
  <g transform="translate(505, 130)">
    <text x="40" y="-12" fill="#fca5a5" font-family="Inter, sans-serif" font-size="12" font-weight="800" text-anchor="middle">RATIO (ALL-IN!)</text>
    
    <!-- 4 Buttons side by side, all depressed with red glow -->
    <!-- 20:1 -->
    <rect x="0" y="0" width="18" height="40" rx="3" fill="#ef4444" stroke="#fca5a5" stroke-width="2" />
    <text x="9" y="56" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="800" text-anchor="middle">20</text>
    <!-- 12:1 -->
    <rect x="22" y="0" width="18" height="40" rx="3" fill="#ef4444" stroke="#fca5a5" stroke-width="2" />
    <text x="31" y="56" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="800" text-anchor="middle">12</text>
    <!-- 8:1 -->
    <rect x="44" y="0" width="18" height="40" rx="3" fill="#ef4444" stroke="#fca5a5" stroke-width="2" />
    <text x="53" y="56" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="800" text-anchor="middle">8</text>
    <!-- 4:1 -->
    <rect x="66" y="0" width="18" height="40" rx="3" fill="#ef4444" stroke="#fca5a5" stroke-width="2" />
    <text x="75" y="56" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="800" text-anchor="middle">4</text>

    <!-- Badge indicating British Mode -->
    <rect x="-10" y="70" width="100" height="20" rx="4" fill="#7f1d1d" stroke="#ef4444" />
    <text x="40" y="84" fill="#fecaca" font-family="Inter, sans-serif" font-size="9" font-weight="800" text-anchor="middle">BRITISH MODE</text>
  </g>

  <!-- 5. BACKLIT VU METER (DEFLECTING HARD ON GAIN REDUCTION) -->
  <g transform="translate(635, 115)">
    <!-- Meter Housing Bezel -->
    <rect width="180" height="135" rx="8" fill="#111" stroke="#4a5568" stroke-width="3" />
    <!-- Meter Glass Backlight -->
    <rect x="8" y="8" width="164" height="119" rx="6" fill="url(#vuGlass)" />
    
    <!-- Scale arc -->
    <path d="M 25 90 Q 90 40 155 90" fill="none" stroke="#222" stroke-width="2" />
    <text x="25" y="80" fill="#111" font-family="'Courier New', monospace" font-size="10" font-weight="900">-20</text>
    <text x="55" y="60" fill="#111" font-family="'Courier New', monospace" font-size="10" font-weight="900">-10</text>
    <text x="90" y="50" fill="#111" font-family="'Courier New', monospace" font-size="10" font-weight="900">-5</text>
    <text x="125" y="60" fill="#111" font-family="'Courier New', monospace" font-size="10" font-weight="900">0</text>
    <text x="150" y="80" fill="#dc2626" font-family="'Courier New', monospace" font-size="10" font-weight="900">+3</text>
    <text x="90" y="90" fill="#713f12" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">GAIN REDUCTION (dB)</text>

    <!-- Meter needle pinned hard left at -18 dB GR -->
    <line x1="90" y1="130" x2="38" y2="70" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="90" cy="130" r="5" fill="#111" />

    <text x="90" y="160" fill="#f8fafc" font-family="Inter, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Pinned at -15 dB to -20 dB GR</text>
  </g>

  <!-- BOTTOM EXPLANATION BANNER -->
  <g transform="translate(50, 375)">
    <rect width="800" height="50" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="400" y="24" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">
      The UREI 1176 Peak Limiter in "All-Buttons-In" (British) Mode
    </text>
    <text x="400" y="42" fill="#cbd5e0" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">
      Engaging all ratio buttons alters circuit bias, creating explosive overdriven harmonic distortion and hyper-aggressive parallel drum crush.
    </text>
  </g>
</svg>