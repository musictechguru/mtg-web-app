<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="dryWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="wetWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="sumWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="2" />

  <!-- Header -->
  <text x="450" y="40" fill="#f9fafb" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">PARALLEL COMPRESSION: WAVEFORM COMPARISON</text>
  <text x="450" y="62" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">How upward density is created without shaving off transient peaks</text>

  <!-- CARD 1: DRY SIGNAL -->
  <g transform="translate(50, 85)">
    <rect width="240" height="350" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="2" />
    <rect x="0" y="0" width="240" height="36" rx="12" fill="#1e3a8a" />
    <text x="120" y="24" fill="#93c5fd" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1. DRY UNPROCESSED</text>
    
    <!-- Waveform Canvas -->
    <rect x="15" y="50" width="210" height="150" rx="8" fill="#030712" stroke="#1e293b" />
    <!-- Center 0V line -->
    <line x1="15" y1="125" x2="225" y2="125" stroke="#374151" stroke-dasharray="3,3" />

    <!-- Sharp, dynamic, uncompressed transient peaks -->
    <!-- Beat 1 Kick -->
    <path d="M 25 125 L 35 125 L 42 60 L 48 180 L 54 85 L 60 155 L 68 125 L 90 125" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Beat 2 Snare -->
    <path d="M 90 125 L 100 125 L 106 50 L 112 195 L 118 75 L 124 165 L 132 125 L 155 125" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Beat 3 Kick -->
    <path d="M 155 125 L 165 125 L 172 65 L 178 175 L 184 90 L 190 150 L 198 125 L 215 125" fill="none" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Annotations -->
    <text x="120" y="225" fill="#38bdf8" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Huge Dynamic Range</text>
    <text x="120" y="250" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">• Sharp transient attack</text>
    <text x="120" y="272" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">• Deep valleys (quiet tails)</text>
    <text x="120" y="294" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• High crest factor</text>
    <rect x="25" y="310" width="190" height="26" rx="6" fill="#1e293b" />
    <text x="120" y="327" fill="#60a5fa" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Transient Attack: 100% Intact</text>
  </g>

  <!-- PLUS SIGN -->
  <text x="315" y="270" fill="#9ca3af" font-family="Inter, sans-serif" font-size="32" font-weight="900" text-anchor="middle">+</text>

  <!-- CARD 2: PARALLEL CRUSH SIGNAL -->
  <g transform="translate(330, 85)">
    <rect width="240" height="350" rx="12" fill="#0f172a" stroke="#dc2626" stroke-width="2" />
    <rect x="0" y="0" width="240" height="36" rx="12" fill="#7f1d1d" />
    <text x="120" y="24" fill="#fca5a5" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2. PARALLEL CRUSH (WET)</text>
    
    <!-- Waveform Canvas -->
    <rect x="15" y="50" width="210" height="150" rx="8" fill="#030712" stroke="#1e293b" />
    <line x1="15" y1="125" x2="225" y2="125" stroke="#374151" stroke-dasharray="3,3" />

    <!-- Smashed, dense, flattened waveform with thick body -->
    <path d="M 25 125 L 35 125 L 40 95 L 45 95 L 50 150 L 55 150 L 60 100 L 70 100 L 80 140 L 90 105 L 100 105 L 106 95 L 115 95 L 120 150 L 130 110 L 140 140 L 155 105 L 165 95 L 175 95 L 185 150 L 195 110 L 205 135 L 215 125" fill="none" stroke="#f87171" stroke-width="2.5" />
    <!-- Shaded density fill -->
    <rect x="35" y="98" width="175" height="54" fill="#ef4444" opacity="0.15" rx="4" />

    <!-- Annotations -->
    <text x="120" y="225" fill="#f87171" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Extreme Density &amp; Body</text>
    <text x="120" y="250" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">• Transients smashed flat</text>
    <text x="120" y="272" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">• Quiet room decay lifted</text>
    <text x="120" y="294" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Low crest factor</text>
    <rect x="25" y="310" width="190" height="26" rx="6" fill="#1e293b" />
    <text x="120" y="327" fill="#f87171" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Fader: Tucked Under at -12 dB</text>
  </g>

  <!-- EQUALS SIGN -->
  <text x="595" y="270" fill="#9ca3af" font-family="Inter, sans-serif" font-size="32" font-weight="900" text-anchor="middle">=</text>

  <!-- CARD 3: PARALLEL BLEND (BEST OF BOTH) -->
  <g transform="translate(610, 85)">
    <rect width="240" height="350" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <rect x="0" y="0" width="240" height="36" rx="12" fill="#065f46" />
    <text x="120" y="24" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. SUMMED OUTPUT MIX</text>
    
    <!-- Waveform Canvas -->
    <rect x="15" y="50" width="210" height="150" rx="8" fill="#030712" stroke="#1e293b" />
    <line x1="15" y1="125" x2="225" y2="125" stroke="#374151" stroke-dasharray="3,3" />

    <!-- Waveform: Has tall sharp spikes PLUS thick body filled in beneath -->
    <path d="M 25 125 L 35 125 L 42 55 L 48 190 L 54 80 L 60 160 L 68 115 L 75 110 L 85 135 L 90 115 L 100 115 L 106 45 L 112 205 L 118 70 L 124 170 L 132 110 L 140 135 L 155 110 L 165 110 L 172 60 L 178 185 L 184 85 L 190 155 L 198 115 L 215 125" fill="none" stroke="#34d399" stroke-width="2.5" />
    <!-- Subtle body reinforcement shading -->
    <rect x="35" y="105" width="175" height="40" fill="#10b981" opacity="0.2" rx="4" />

    <!-- Annotations -->
    <text x="120" y="225" fill="#34d399" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">The "Best of Both Worlds"</text>
    <text x="120" y="250" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">• 100% Transient Punch</text>
    <text x="120" y="272" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">• Fat sustain &amp; room bloom</text>
    <text x="120" y="294" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• No pumping or choking</text>
    <rect x="25" y="310" width="190" height="26" rx="6" fill="#064e3b" />
    <text x="120" y="327" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Heavy, Punchy, In-Your-Face!</text>
  </g>

  <!-- BOTTOM FOOTER -->
  <text x="450" y="475" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">
    Notice: The sharp transients in Box 3 reach the exact same height as Box 1, but the valleys between hits are filled with rich harmonic body from Box 2.
  </text>
</svg>