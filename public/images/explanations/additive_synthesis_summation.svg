<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="960" height="620" fill="#0b1120"/>

  <!-- Title Header -->
  <text x="480" y="44" fill="#f8fafc" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="1.5">ADDITIVE SYNTHESIS (FOURIER'S THEOREM)</text>
  <text x="480" y="70" fill="#94a3b8" font-size="13.5" text-anchor="middle">Building complex musical waveforms from the ground up by summing individual sine wave partials</text>

  <!-- Left Side: Individual Pure Sine Wave Partials (Inputs) -->
  <g transform="translate(50, 95)">
    <rect width="440" height="370" rx="10" fill="#131e36" stroke="#334155" stroke-width="1.2"/>
    <text x="220" y="30" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">INDIVIDUAL SINE WAVE PARTIALS</text>

    <!-- Partial 1: Fundamental (f0) -->
    <g transform="translate(20, 50)">
      <rect width="400" height="65" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="15" y="28" fill="#38bdf8" font-size="12" font-weight="bold">1st Partial (Fundamental f₀)</text>
      <text x="15" y="48" fill="#94a3b8" font-size="11">Amplitude: 1.0 • Pitch Base</text>
      <path d="M 230 32 C 260 5, 280 5, 310 32 C 340 59, 360 59, 390 32" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    </g>

    <!-- Partial 2: 2nd Harmonic (2f0) -->
    <g transform="translate(20, 125)">
      <rect width="400" height="65" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="15" y="28" fill="#a855f7" font-size="12" font-weight="bold">2nd Partial (2 × f₀)</text>
      <text x="15" y="48" fill="#94a3b8" font-size="11">Amplitude: 0.5 • Octave</text>
      <path d="M 230 32 C 245 12, 255 12, 270 32 C 285 52, 295 52, 310 32 C 325 12, 335 12, 350 32 C 365 52, 375 52, 390 32" fill="none" stroke="#a855f7" stroke-width="2.2"/>
    </g>

    <!-- Partial 3: 3rd Harmonic (3f0) -->
    <g transform="translate(20, 200)">
      <rect width="400" height="65" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="15" y="28" fill="#10b981" font-size="12" font-weight="bold">3rd Partial (3 × f₀)</text>
      <text x="15" y="48" fill="#94a3b8" font-size="11">Amplitude: 0.33 • Octave + 5th</text>
      <path d="M 230 32 C 240 18, 250 18, 260 32 C 270 46, 280 46, 290 32 C 300 18, 310 18, 320 32 C 330 46, 340 46, 350 32 C 360 18, 370 18, 380 32 C 385 39, 388 39, 390 32" fill="none" stroke="#10b981" stroke-width="2"/>
    </g>

    <!-- Higher Partials Indicator -->
    <g transform="translate(20, 275)">
      <rect width="400" height="75" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="200" y="32" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">+ 4th, 5th, 6th, 7th... Partials</text>
      <text x="200" y="52" fill="#cbd5e1" font-size="11" text-anchor="middle">Each partial has independent volume &amp; envelope control</text>
    </g>
  </g>

  <!-- Middle Summing Arrow -->
  <g transform="translate(505, 260)">
    <circle cx="20" cy="20" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="27" fill="#38bdf8" font-size="22" font-weight="bold" text-anchor="middle">Σ</text>
    <text x="20" y="52" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">SUM</text>
  </g>

  <!-- Right Side: Resulting Complex Composite Waveform -->
  <g transform="translate(560, 95)">
    <rect width="350" height="370" rx="10" fill="#131e36" stroke="#f59e0b" stroke-width="1.8"/>
    <rect width="350" height="38" rx="10" fill="#b45309"/>
    <text x="175" y="25" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">RESULTING COMPOSITE WAVEFORM</text>

    <!-- Composite Wave Display -->
    <rect x="20" y="60" width="310" height="150" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <!-- Complex synthesized wave -->
    <path d="M 30 135 C 50 45, 70 85, 95 105 C 120 125, 140 70, 165 140 C 190 205, 215 160, 240 185 C 265 210, 290 145, 320 135" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>

    <text x="175" y="240" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Any Sound Can Be Synthesized</text>
    <text x="175" y="262" fill="#cbd5e1" font-size="11.5" text-anchor="middle">Organ, bells, flute, or human voice</text>

    <g transform="translate(20, 280)">
      <rect width="310" height="70" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" fill="#38bdf8" font-size="11" font-weight="bold">Historic &amp; Modern Examples:</text>
      <text x="15" y="42" fill="#cbd5e1" font-size="11">• Hammond Drawbar Tonewheel Organ</text>
      <text x="15" y="58" fill="#cbd5e1" font-size="11">• Synclavier &amp; Kawai K5000</text>
    </g>
  </g>

  <!-- Bottom Core Principle Bar -->
  <g transform="translate(50, 485)">
    <rect width="860" height="115" rx="10" fill="#131e36" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="30" fill="#38bdf8" font-size="14" font-weight="bold">Core Physics Principle: Fourier's Theorem</text>
    <text x="25" y="56" fill="#cbd5e1" font-size="12.5">Mathematician Jean-Baptiste Fourier proved that <tspan fill="#f59e0b" font-weight="bold">any complex periodic waveform can be created by summing pure sine waves</tspan></text>
    <text x="25" y="78" fill="#cbd5e1" font-size="12.5">at specific harmonic frequencies, phase relationships, and amplitudes. Unlike subtractive synthesis (which filters down complex waves),</text>
    <text x="25" y="98" fill="#94a3b8" font-size="12">additive synthesis builds sounds upward from pure sine wave foundations.</text>
  </g>
</svg>
