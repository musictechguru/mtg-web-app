<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-sc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-sc-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad-sc)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#ec4899" filter="url(#glow-sc-pink)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">DYNAMIC DUCKING: 4-ON-THE-FLOOR SIDECHAIN COMPRESSION PUMPING</text>
    <rect x="520" y="6" width="140" height="22" rx="4" fill="#831843" fill-opacity="0.4" stroke="#ec4899" stroke-width="0.8" />
    <text x="590" y="21" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">EDM / HOUSE TECHNIQUE</text>
  </g>

  <!-- Signal Flow Diagram -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="672" height="332" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- Trigger Track: Kick Drum -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="170" height="74" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5" />
      <text x="14" y="24" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">TRIGGER: 4-ON-FLOOR KICK</text>
      <text x="14" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Heavy transient on beats 1, 2, 3, 4</text>
      <text x="14" y="58" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">Sends Key / Sidechain Signal</text>
    </g>

    <!-- Sidechain Arrow down -->
    <path d="M105 98 L105 130 L220 130" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4 4" fill="none" />
    <text x="115" y="122" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">KEY INPUT (TRIGGER)</text>

    <!-- Audio Path Track: Synth Pad / Bass -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="170" height="74" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="14" y="24" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">AUDIO PATH: SYNTH PAD</text>
      <text x="14" y="42" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Sustained chords / bass notes</text>
      <text x="14" y="58" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">Enters Compressor Input</text>
    </g>

    <!-- Arrow Audio into Compressor -->
    <path d="M194 197 L226 197" stroke="#38bdf8" stroke-width="2.5" fill="none" />

    <!-- Compressor Box -->
    <g transform="translate(230, 100)">
      <rect x="0" y="0" width="180" height="150" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2" />
      <rect x="10" y="10" width="160" height="28" rx="5" fill="#831843" fill-opacity="0.4" />
      <text x="90" y="28" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">SIDECHAIN COMPRESSOR</text>
      
      <text x="16" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Threshold: <tspan fill="#f8fafc" font-weight="700">-18 dB</tspan></text>
      <text x="16" y="76" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Ratio: <tspan fill="#f8fafc" font-weight="700">6:1 (Aggressive)</tspan></text>
      <text x="16" y="94" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Attack: <tspan fill="#f8fafc" font-weight="700">0.5 ms (Instant)</tspan></text>
      <text x="16" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Release: <tspan fill="#f8fafc" font-weight="700">120 ms (Tempo-sync)</tspan></text>
      <text x="16" y="132" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800">Gain Reduction: -12 dB</text>
    </g>

    <!-- Arrow out of Compressor -->
    <path d="M414 197 L444 197" stroke="#ec4899" stroke-width="2.5" fill="none" />

    <!-- Waveform Visualisation: The Pumping Effect -->
    <g transform="translate(448, 20)">
      <rect x="0" y="0" width="204" height="230" rx="8" fill="#131e36" stroke="#334155" stroke-width="1.2" />
      <text x="14" y="24" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">OUTPUT WAVEFORM</text>
      <text x="14" y="40" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Rhythmic Ducking ("Pumping")</text>

      <!-- Draw 4 pump envelopes -->
      <g transform="translate(14, 50)">
        <!-- Beat 1 -->
        <rect x="0" y="0" width="40" height="120" fill="#0f172a" rx="4" />
        <path d="M 5 20 Q 8 100 20 100 Q 35 100 38 20" stroke="#f43f5e" stroke-width="2" fill="none" />
        <text x="20" y="134" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">BEAT 1</text>
        <text x="20" y="146" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">DUCK</text>

        <!-- Beat 2 -->
        <g transform="translate(45, 0)">
          <rect x="0" y="0" width="40" height="120" fill="#0f172a" rx="4" />
          <path d="M 5 20 Q 8 100 20 100 Q 35 100 38 20" stroke="#f43f5e" stroke-width="2" fill="none" />
          <text x="20" y="134" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">BEAT 2</text>
          <text x="20" y="146" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">DUCK</text>
        </g>

        <!-- Beat 3 -->
        <g transform="translate(90, 0)">
          <rect x="0" y="0" width="40" height="120" fill="#0f172a" rx="4" />
          <path d="M 5 20 Q 8 100 20 100 Q 35 100 38 20" stroke="#f43f5e" stroke-width="2" fill="none" />
          <text x="20" y="134" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">BEAT 3</text>
          <text x="20" y="146" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">DUCK</text>
        </g>

        <!-- Beat 4 -->
        <g transform="translate(135, 0)">
          <rect x="0" y="0" width="40" height="120" fill="#0f172a" rx="4" />
          <path d="M 5 20 Q 8 100 20 100 Q 35 100 38 20" stroke="#f43f5e" stroke-width="2" fill="none" />
          <text x="20" y="134" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">BEAT 4</text>
          <text x="20" y="146" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">DUCK</text>
        </g>
      </g>
    </g>

    <!-- Bottom summary banner -->
    <g transform="translate(20, 266)">
      <rect x="0" y="0" width="632" height="50" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800">WHY THIS MATTERS IN FAST CAR (JONAS BLUE 2015):</text>
      <text x="14" y="36" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Sidechain compression ducks the chords every time the 4-on-the-floor kick hits, leaving clean low-end headroom for the kick punch while creating the signature undulating dancefloor groove.</text>
    </g>
  </g>
</svg>