<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <rect width="720" height="400" rx="12" fill="#090d16" stroke="#334155" stroke-width="1.5" />
  <text x="360" y="32" fill="#22c55e" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">1992 G-FUNK RECORDING SETUP: ANALOG TAPE &amp; SSL DESK</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Dr. Dre's 'The Chronic' Workflow: Otari 24-Track 2-Inch Tape &amp; Solid State Logic 4000E</text>

  <!-- Flow Chain -->
  <g transform="translate(40, 75)">
    <rect width="640" height="225" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />

    <!-- 1. Source Gear -->
    <g transform="translate(20, 25)">
      <rect width="170" height="175" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
      <text x="85" y="22" fill="#86efac" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">TRACKING SOURCES</text>

      <rect x="15" y="40" width="140" height="28" rx="3" fill="#1e293b" />
      <text x="85" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Akai MPC60 &amp; S950</text>

      <rect x="15" y="75" width="140" height="28" rx="3" fill="#1e293b" />
      <text x="85" y="93" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Minimoog Analog Lead</text>

      <rect x="15" y="110" width="140" height="28" rx="3" fill="#1e293b" />
      <text x="85" y="128" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Sony C800G Vocal Mic</text>

      <rect x="15" y="145" width="140" height="24" rx="3" fill="#1e293b" />
      <text x="85" y="161" fill="#fde68a" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Leon Haywood Vinyl Sample</text>
    </g>

    <!-- Arrow -->
    <path d="M 200 112 L 230 112" stroke="#22c55e" stroke-width="2.5" />

    <!-- 2. Console -->
    <g transform="translate(240, 25)">
      <rect width="170" height="175" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
      <text x="85" y="22" fill="#86efac" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">SSL 4000E CONSOLE</text>

      <rect x="15" y="40" width="140" height="35" rx="3" fill="#1e293b" />
      <text x="85" y="56" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Total Recall VCA Faders</text>
      <text x="85" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Parametric Channel EQs</text>

      <rect x="15" y="85" width="140" height="35" rx="3" fill="#1e293b" />
      <text x="85" y="101" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Channel Gates &amp; Comps</text>
      <text x="85" y="113" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Tight percussive snap</text>

      <rect x="15" y="130" width="140" height="35" rx="3" fill="#1e293b" />
      <text x="85" y="146" fill="#fde68a" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Master Bus Compressor</text>
      <text x="85" y="158" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Legendary 'Mix Glue'</text>
    </g>

    <!-- Arrow -->
    <path d="M 420 112 L 450 112" stroke="#22c55e" stroke-width="2.5" />

    <!-- 3. Multitrack Tape Destination -->
    <g transform="translate(460, 25)">
      <rect width="160" height="175" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
      <text x="80" y="22" fill="#86efac" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">24-TRACK 2" TAPE</text>

      <!-- Reels -->
      <circle cx="50" cy="70" r="24" fill="#334155" stroke="#94a3b8" stroke-width="2" />
      <circle cx="110" cy="70" r="24" fill="#334155" stroke="#94a3b8" stroke-width="2" />
      <line x1="50" y1="94" x2="110" y2="94" stroke="#cbd5e1" stroke-width="2" />

      <rect x="10" y="115" width="140" height="48" rx="3" fill="#1e293b" />
      <text x="80" y="132" fill="#fde68a" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">OTARI / STUDER 24-TRK</text>
      <text x="80" y="146" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Warm tape compression</text>
      <text x="80" y="157" fill="#f87171" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">NO Pro Tools in 1992!</text>
    </g>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 315)">
    <rect width="640" height="65" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="22" fill="#22c55e" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">EDEXCEL EXAM MYTH BUSTER: PRO TOOLS IN HIP-HOP</text>
    <text x="16" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">In 1992, Pro Tools was limited to 4 tracks of basic audio editing. 'The Chronic' was tracked completely to 2-inch analogue tape through a Solid State Logic 4000 series console, delivering the deep sub-bass and smooth high-end roll-off characteristic of early 90s West Coast hip-hop.</text>
  </g>
</svg>