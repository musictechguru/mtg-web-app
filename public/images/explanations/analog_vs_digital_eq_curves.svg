<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f172a" rx="12"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#1e293b" stroke-width="2" rx="10"/>

  <text x="400" y="55" fill="#f8fafc" font-size="20" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Analog vs Digital Equaliser Curves &amp; Behavior</text>
  <text x="400" y="80" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">Musical saturation &amp; asymmetric curves vs surgical precision &amp; linear phase</text>

  <!-- Left: Analog EQ -->
  <g transform="translate(50, 110)">
    <rect width="335" height="260" fill="#1e293b" rx="8" stroke="#334155"/>
    <text x="167" y="30" fill="#fbbf24" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Analog Hardware / Emulation (Pultec/Neve)</text>

    <!-- Curve graph -->
    <rect x="25" y="50" width="285" height="130" fill="#0f172a" rx="6" stroke="#475569"/>
    <!-- Grid -->
    <line x1="25" y1="115" x2="310" y2="115" stroke="#334155" stroke-dasharray="2 2"/>
    <line x1="167" y1="50" x2="167" y2="180" stroke="#334155" stroke-dasharray="2 2"/>

    <!-- Broad Asymmetric Bell Curve -->
    <path d="M 35 115 C 80 115, 120 70, 167 65 C 220 60, 260 125, 300 115" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <path d="M 35 115 C 80 115, 120 70, 167 65 C 220 60, 260 125, 300 115 L 300 115 Z" fill="#fbbf24" fill-opacity="0.1"/>

    <text x="167" y="198" fill="#fbbf24" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Musical Interaction &amp; Harmonics</text>
    <text x="167" y="215" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Proportional Q (Q narrows as boost increases)</text>
    <text x="167" y="230" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Transformer / tube saturation (even/odd THD)</text>
    <text x="167" y="245" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Smooth, forgiving tone coloration</text>
  </g>

  <!-- Right: Digital EQ -->
  <g transform="translate(415, 110)">
    <rect width="335" height="260" fill="#1e293b" rx="8" stroke="#334155"/>
    <text x="167" y="30" fill="#38bdf8" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Digital DAW EQ (FabFilter / Parametric)</text>

    <!-- Curve graph -->
    <rect x="25" y="50" width="285" height="130" fill="#0f172a" rx="6" stroke="#475569"/>
    <!-- Grid -->
    <line x1="25" y1="115" x2="310" y2="115" stroke="#334155" stroke-dasharray="2 2"/>
    <line x1="167" y1="50" x2="167" y2="180" stroke="#334155" stroke-dasharray="2 2"/>

    <!-- Surgical Narrow Notch & Steep Filter -->
    <path d="M 35 115 L 120 115 L 150 160 L 167 60 L 184 160 L 210 115 L 270 115 Q 285 115 295 175" fill="none" stroke="#38bdf8" stroke-width="3"/>

    <text x="167" y="198" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Surgical Precision &amp; Transparency</text>
    <text x="167" y="215" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Surgical Q factors up to 100 for notch cuts</text>
    <text x="167" y="230" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Linear Phase option (zero phase smearing)</text>
    <text x="167" y="245" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• 0.00% unwanted harmonic distortion</text>
  </g>

  <!-- Summary Box -->
  <rect x="50" y="390" width="700" height="60" fill="#1e293b" rx="6"/>
  <text x="400" y="415" fill="#f8fafc" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Rule of Thumb: Cut with surgical digital EQ (fix resonance); Boost with broad analog EQ (add color).</text>
  <text x="400" y="435" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Analog passive designs (Pultec) allow simultaneous boost and cut at the same frequency creating unique resonant dips.</text>
</svg>