<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="wetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
    <linearGradient id="sumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="compBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1215" />
      <stop offset="100%" stop-color="#180b0d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L0,7 L7,4 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L0,7 L7,4 z" fill="#f87171" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L0,7 L7,4 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Header Title & Subtitle -->
  <text x="450" y="44" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="0.5">PARALLEL (NEW YORK) COMPRESSION ROUTING</text>
  <text x="450" y="68" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Retaining Dynamic Transient Attack while Injecting Dense Harmonic Body &amp; Sustain</text>

  <!-- INPUT SOURCE BOX -->
  <g transform="translate(40, 205)">
    <rect width="140" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" filter="url(#glow)" />
    <text x="70" y="35" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">AUDIO SOURCE</text>
    <text x="70" y="58" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="15" font-weight="800" text-anchor="middle">Dry Drum Bus</text>
    <text x="70" y="76" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">or Vocal Track</text>
  </g>

  <!-- SPLIT NODES & PATHS -->
  <!-- Split dot -->
  <circle cx="215" cy="250" r="5" fill="#f8fafc" />
  <line x1="180" y1="250" x2="215" y2="250" stroke="#94a3b8" stroke-width="3" />

  <!-- Branch to Path A (Dry Path) -->
  <path d="M 215 250 L 250 150 L 310 150" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrowBlue)" />
  <text x="240" y="135" fill="#60a5fa" font-family="Inter, sans-serif" font-size="11" font-weight="700">PATH A (DIRECT)</text>

  <!-- Branch to Path B (Aux Parallel Path) -->
  <path d="M 215 250 L 250 350 L 310 350" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#arrowRed)" />
  <text x="235" y="375" fill="#f87171" font-family="Inter, sans-serif" font-size="11" font-weight="700">PATH B (AUX SEND)</text>

  <!-- PATH A: DRY CHANNEL STRIP -->
  <g transform="translate(320, 105)">
    <rect width="260" height="90" rx="10" fill="#172554" stroke="#2563eb" stroke-width="2" />
    <text x="20" y="30" fill="#93c5fd" font-family="Inter, sans-serif" font-size="12" font-weight="800">DRY (UNPROCESSED) PATH</text>
    <text x="20" y="52" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="700">Preserves Transients &amp; Punch</text>
    <text x="20" y="72" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Natural dynamics, 0 dB nominal fader</text>

    <!-- Mini transient waveform icon -->
    <path d="M 200 65 L 205 65 L 210 25 L 215 70 L 220 50 L 225 65 L 245 65" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- PATH B: HEAVILY COMPRESSED AUX BUS -->
  <g transform="translate(320, 300)">
    <rect width="260" height="105" rx="10" fill="url(#compBoxGrad)" stroke="#dc2626" stroke-width="2" />
    <text x="20" y="28" fill="#fca5a5" font-family="Inter, sans-serif" font-size="12" font-weight="800">PARALLEL AUX CRUSH BUS</text>
    <text x="20" y="48" fill="#f8fafc" font-family="Inter, sans-serif" font-size="14" font-weight="700">Extreme Downward Compression</text>
    <text x="20" y="68" fill="#fda4af" font-family="Inter, sans-serif" font-size="11">Fast Attack (0.1ms) • Fast Release (50ms)</text>
    <text x="20" y="86" fill="#f87171" font-family="Inter, sans-serif" font-size="11" font-weight="700">Ratio: 10:1 to 20:1 • 15–20 dB Gain Reduction</text>

    <!-- Mini smashed waveform icon -->
    <rect x="205" y="40" width="40" height="28" rx="3" fill="#450a0a" stroke="#ef4444" />
    <path d="M 210 54 L 215 54 L 220 44 L 225 44 L 230 44 L 235 54 L 240 54" fill="none" stroke="#ef4444" stroke-width="2" />
  </g>

  <!-- SUMMING MIXER JUNCTION -->
  <!-- Dry path to mixer -->
  <path d="M 580 150 L 640 150 L 660 230" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrowBlue)" />
  <!-- Wet path to mixer -->
  <path d="M 580 350 L 640 350 L 660 270" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#arrowRed)" />

  <!-- BLEND / SUMMING BOX -->
  <g transform="translate(670, 195)">
    <rect width="190" height="110" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#glow)" />
    <text x="95" y="30" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="12" font-weight="800" text-anchor="middle">SUMMING BUS (OUTPUT)</text>
    <text x="95" y="52" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="800" text-anchor="middle">Parallel Blend</text>
    <text x="95" y="74" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Dry at 0 dB (Dominant)</text>
    <text x="95" y="92" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">+ Wet Fader tucked at -12 dB</text>
  </g>

  <!-- BOTTOM PEDAGOGICAL BANNER -->
  <g transform="translate(40, 440)">
    <rect width="820" height="52" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="410" y="24" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      💡 The Core Principle: Preserves 100% of Natural Transient Attack while Raising Low-Level Nuance
    </text>
    <text x="410" y="42" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">
      Unlike serial downward compression, the drum hits remain spiky and punchy without suffocating or ducking.
    </text>
  </g>
</svg>