<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f172a" rx="12"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#1e293b" stroke-width="2" rx="10"/>
  
  <text x="400" y="55" fill="#f8fafc" font-size="20" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">High SPL Handling, Diaphragm Limits &amp; Pad Switches</text>
  <text x="400" y="80" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">Preventing acoustic diaphragm distortion vs preamp input clipping</text>

  <!-- Left: Dynamic Mic -->
  <g transform="translate(60, 110)">
    <rect width="320" height="330" fill="#1e293b" rx="8" stroke="#334155"/>
    <text x="160" y="32" fill="#38bdf8" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Moving-Coil Dynamic</text>
    <text x="160" y="52" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Shure SM57 / Beta 52A (Passive)</text>

    <!-- Diaphragm illustration -->
    <rect x="50" y="70" width="220" height="110" fill="#0f172a" rx="6" stroke="#475569"/>
    <line x1="160" y1="80" x2="160" y2="170" stroke="#38bdf8" stroke-width="4" stroke-dasharray="4 4"/>
    <path d="M 140 100 Q 160 80 180 100 Q 200 120 180 140 Q 160 160 140 140 Z" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="160" cy="125" r="14" fill="#0284c7"/>
    <text x="160" y="129" fill="#ffffff" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">COIL</text>

    <text x="160" y="210" fill="#34d399" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Max SPL: 150+ dB SPL</text>
    <text x="160" y="235" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">• Robust mechanical design</text>
    <text x="160" y="255" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">• No internal active preamp to clip</text>
    <text x="160" y="275" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">• Ideal for snare close-mic, brass &amp; kick</text>
    <rect x="40" y="292" width="240" height="24" fill="#065f46" rx="4"/>
    <text x="160" y="308" fill="#a7f3d0" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Virtually Unclippable Acoustically</text>
  </g>

  <!-- Right: Condenser with Pad Switch -->
  <g transform="translate(420, 110)">
    <rect width="320" height="330" fill="#1e293b" rx="8" stroke="#334155"/>
    <text x="160" y="32" fill="#fbbf24" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Condenser + Pad Switch</text>
    <text x="160" y="52" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">AKG C414 / Neumann U87 (Active)</text>

    <!-- Preamp & Pad Switch Illustration -->
    <rect x="50" y="70" width="220" height="110" fill="#0f172a" rx="6" stroke="#475569"/>
    <!-- Capsule -->
    <circle cx="85" cy="125" r="22" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="85" y="129" fill="#fbbf24" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">CAPSULE</text>
    <!-- Line to Pad -->
    <line x1="107" y1="125" x2="135" y2="125" stroke="#94a3b8" stroke-width="2"/>
    <!-- Pad Box -->
    <rect x="135" y="105" width="55" height="40" fill="#b45309" rx="4"/>
    <text x="162" y="123" fill="#ffffff" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">-20 dB</text>
    <text x="162" y="137" fill="#fef3c7" font-size="8" font-family="system-ui, sans-serif" text-anchor="middle">PAD</text>
    <!-- Line to FET -->
    <line x1="190" y1="125" x2="215" y2="125" stroke="#94a3b8" stroke-width="2"/>
    <!-- FET box -->
    <rect x="215" y="105" width="45" height="40" fill="#1e293b" rx="4" stroke="#64748b"/>
    <text x="237" y="129" fill="#e2e8f0" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">FET</text>

    <text x="160" y="210" fill="#f87171" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Max SPL: 130 dB (150 dB w/ Pad)</text>
    <text x="160" y="235" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">• Internal FET/tube amp can overload</text>
    <text x="160" y="255" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">• Pad attenuates BEFORE active circuitry</text>
    <text x="160" y="275" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">• Protects preamp from square-wave clipping</text>
    <rect x="40" y="292" width="240" height="24" fill="#991b1b" rx="4"/>
    <text x="160" y="308" fill="#fecaca" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Pad Required for High Sound Pressure</text>
  </g>
</svg>