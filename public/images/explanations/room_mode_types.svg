<svg width="600" height="380" viewBox="0 0 600 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Studio Background -->
  <rect width="600" height="380" rx="12" fill="#0f172a" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="60" y1="80" x2="540" y2="80" />
    <line x1="60" y1="140" x2="540" y2="140" />
    <line x1="60" y1="200" x2="540" y2="200" stroke="#334155" stroke-dasharray="4 4" />
    <line x1="60" y1="260" x2="540" y2="260" />
    <line x1="180" y1="60" x2="180" y2="300" />
    <line x1="300" y1="60" x2="300" y2="300" />
    <line x1="420" y1="60" x2="420" y2="300" />
  </g>

  <!-- Title Badge -->
  <rect x="150" y="18" width="300" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="300" y="38" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">AXIAL STANDING WAVE (ROOM MODE)</text>

  <!-- Left Wall (Front Wall) -->
  <rect x="50" y="60" width="16" height="240" rx="3" fill="#334155" stroke="#475569" stroke-width="1" />
  <rect x="66" y="80" width="6" height="200" rx="2" fill="#64748b" opacity="0.5" />
  <text x="58" y="325" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FRONT WALL</text>
  <text x="58" y="340" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">(Speaker Boundary)</text>

  <!-- Right Wall (Back Wall) -->
  <rect x="534" y="60" width="16" height="240" rx="3" fill="#334155" stroke="#475569" stroke-width="1" />
  <rect x="528" y="80" width="6" height="200" rx="2" fill="#64748b" opacity="0.5" />
  <text x="542" y="325" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">BACK WALL</text>
  <text x="542" y="340" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">(Parallel Reflection)</text>

  <!-- Distance Indicator -->
  <line x1="72" y1="362" x2="528" y2="362" stroke="#475569" stroke-width="1" />
  <polygon points="72,359 64,362 72,365" fill="#475569" />
  <polygon points="528,359 536,362 528,365" fill="#475569" />
  <text x="300" y="366" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Room Length L = λ / 2</text>

  <!-- Glowing Filter & Gradient -->
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-rose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Incident Wave (Forward) -->
  <path d="M 72 100 Q 186 200 300 200 T 528 300" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow-cyan)" />
  
  <!-- Reflected Wave (Counter-phase envelope) -->
  <path d="M 72 300 Q 186 200 300 200 T 528 100" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.85" filter="url(#glow-rose)" />

  <!-- Envelope Area Fill -->
  <path d="M 72 100 Q 186 200 300 200 T 528 300 L 528 100 Q 414 200 300 200 T 72 300 Z" fill="url(#wave-grad)" />

  <!-- Pressure Anti-Node at Left Wall -->
  <circle cx="72" cy="100" r="6" fill="#facc15" stroke="#0f172a" stroke-width="2" />
  <rect x="85" y="80" width="115" height="38" rx="6" fill="#1e293b" stroke="#facc15" stroke-width="1" />
  <text x="142" y="96" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ANTI-NODE</text>
  <text x="142" y="111" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">+15 dB Bass Peak</text>

  <!-- Node in Room Center -->
  <circle cx="300" cy="200" r="7" fill="#10b981" stroke="#0f172a" stroke-width="2" />
  <rect x="230" y="215" width="140" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
  <text x="300" y="232" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PRESSURE NODE</text>
  <text x="300" y="247" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Bass Cancellation / Null</text>

  <!-- Pressure Anti-Node at Right Wall -->
  <circle cx="528" cy="100" r="6" fill="#facc15" stroke="#0f172a" stroke-width="2" />
  <rect x="400" y="80" width="115" height="38" rx="6" fill="#facc15" stroke="#facc15" stroke-width="1" />
  <text x="457" y="96" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ANTI-NODE</text>
  <text x="457" y="111" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">+15 dB Bass Peak</text>
</svg>
