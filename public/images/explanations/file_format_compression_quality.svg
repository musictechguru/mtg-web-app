<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f172a" rx="12"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#1e293b" stroke-width="2" rx="10"/>

  <text x="400" y="55" fill="#f8fafc" font-size="20" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Audio File Formats: Uncompressed vs Lossless vs Lossy</text>
  <text x="400" y="80" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">Bitrate comparison, spectral cutoffs and perceptual psychoacoustic encoding</text>

  <!-- 4 Columns -->
  <!-- 1. WAV / AIFF -->
  <g transform="translate(45, 110)">
    <rect width="160" height="260" fill="#1e293b" rx="8" stroke="#38bdf8" stroke-width="2"/>
    <rect x="20" y="20" width="120" height="26" fill="#0284c7" rx="4"/>
    <text x="80" y="38" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">WAV / AIFF</text>
    <text x="80" y="65" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Uncompressed LPCM</text>
    <!-- Bar representation -->
    <rect x="25" y="80" width="110" height="90" fill="#0369a1" rx="4"/>
    <text x="80" y="125" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">100% Data</text>
    <text x="80" y="142" fill="#bae6fd" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">No artifacts</text>
    <text x="80" y="195" fill="#f8fafc" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">1411 kbps (16/44)</text>
    <text x="80" y="215" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Bandwidth: 0 - 22.05kHz</text>
    <text x="80" y="235" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">~10 MB / minute</text>
    <text x="80" y="255" fill="#38bdf8" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Studio Master Standard</text>
  </g>

  <!-- 2. FLAC / ALAC -->
  <g transform="translate(225, 110)">
    <rect width="160" height="260" fill="#1e293b" rx="8" stroke="#34d399" stroke-width="2"/>
    <rect x="20" y="20" width="120" height="26" fill="#059669" rx="4"/>
    <text x="80" y="38" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">FLAC / ALAC</text>
    <text x="80" y="65" fill="#34d399" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Lossless Compressed</text>
    <!-- Bar representation -->
    <rect x="25" y="80" width="110" height="55" fill="#047857" rx="4"/>
    <text x="80" y="110" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Bit-Identical</text>
    <text x="80" y="125" fill="#a7f3d0" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">ZIP-like compression</text>
    <text x="80" y="195" fill="#f8fafc" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">~700-900 kbps</text>
    <text x="80" y="215" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Bandwidth: 0 - 22.05kHz</text>
    <text x="80" y="235" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">50-60% size saving</text>
    <text x="80" y="255" fill="#34d399" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Audiophile Archival</text>
  </g>

  <!-- 3. MP3 320 kbps / AAC 256 -->
  <g transform="translate(405, 110)">
    <rect width="160" height="260" fill="#1e293b" rx="8" stroke="#f59e0b" stroke-width="2"/>
    <rect x="20" y="20" width="120" height="26" fill="#d97706" rx="4"/>
    <text x="80" y="38" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">MP3 320 / AAC</text>
    <text x="80" y="65" fill="#f59e0b" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">High-Bitrate Lossy</text>
    <!-- Bar representation -->
    <rect x="25" y="80" width="110" height="25" fill="#b45309" rx="4"/>
    <text x="80" y="97" fill="#ffffff" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">~22% Size</text>
    <text x="80" y="195" fill="#f8fafc" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">256 - 320 kbps</text>
    <text x="80" y="215" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Bandwidth: 0 - 20 kHz</text>
    <text x="80" y="235" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Psychoacoustic masking</text>
    <text x="80" y="255" fill="#f59e0b" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Commercial Streaming</text>
  </g>

  <!-- 4. MP3 128 kbps -->
  <g transform="translate(585, 110)">
    <rect width="160" height="260" fill="#1e293b" rx="8" stroke="#ef4444" stroke-width="2"/>
    <rect x="20" y="20" width="120" height="26" fill="#b91c1c" rx="4"/>
    <text x="80" y="38" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">MP3 128 kbps</text>
    <text x="80" y="65" fill="#ef4444" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Low-Bitrate Lossy</text>
    <!-- Bar representation -->
    <rect x="25" y="80" width="110" height="12" fill="#7f1d1d" rx="2"/>
    <text x="80" y="90" fill="#ffffff" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">~9% Size</text>
    <text x="80" y="195" fill="#f8fafc" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">128 kbps</text>
    <text x="80" y="215" fill="#ef4444" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Cutoff at 16 kHz</text>
    <text x="80" y="235" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Swishy cymbals &amp; smear</text>
    <text x="80" y="255" fill="#ef4444" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Audible Loss of Detail</text>
  </g>

  <!-- Bottom rule -->
  <rect x="45" y="390" width="700" height="60" fill="#1e293b" rx="6"/>
  <text x="400" y="415" fill="#f1f5f9" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Perceptual Coding: Discards sounds masked by louder adjacent frequencies (frequency &amp; temporal masking).</text>
  <text x="400" y="435" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Never encode lossy to lossy (e.g. MP3 to AAC) - causes cumulative artifact generation.</text>
</svg>