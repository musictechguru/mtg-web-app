<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f172a" rx="12"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#1e293b" stroke-width="2" rx="10"/>

  <text x="400" y="55" fill="#f8fafc" font-size="20" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Reverb Impulse Response &amp; Time Domain Anatomy</text>
  <text x="400" y="80" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">Direct Sound, Pre-Delay, Early Reflections, and Diffuse Reverberant Tail (RT60)</text>

  <g transform="translate(60, 110)">
    <!-- Axes -->
    <line x1="50" y1="240" x2="650" y2="240" stroke="#475569" stroke-width="2"/>
    <line x1="50" y1="30" x2="50" y2="240" stroke="#475569" stroke-width="2"/>

    <text x="650" y="260" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="end">Time (ms / seconds) →</text>
    <text x="40" y="35" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="end">0 dB</text>
    <text x="40" y="240" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="end">-60 dB</text>

    <!-- Direct Sound Spike at t=60 -->
    <line x1="60" y1="240" x2="60" y2="40" stroke="#f43f5e" stroke-width="4"/>
    <circle cx="60" cy="40" r="5" fill="#f43f5e"/>
    <text x="60" y="28" fill="#f43f5e" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Direct Sound</text>

    <!-- Pre-Delay Bracket (between 60 and 140) -->
    <rect x="63" y="170" width="74" height="26" fill="#1e293b" rx="4" stroke="#64748b"/>
    <text x="100" y="187" fill="#fbbf24" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Pre-Delay</text>
    <line x1="65" y1="205" x2="135" y2="205" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="100" y="222" fill="#fbbf24" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">20-50 ms gap</text>

    <!-- Early Reflections (140 to 260) -->
    <line x1="140" y1="240" x2="140" y2="90" stroke="#38bdf8" stroke-width="3"/>
    <line x1="165" y1="240" x2="165" y2="120" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="185" y1="240" x2="185" y2="105" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="210" y1="240" x2="210" y2="140" stroke="#38bdf8" stroke-width="2"/>
    <line x1="230" y1="240" x2="230" y2="130" stroke="#38bdf8" stroke-width="2"/>
    <line x1="250" y1="240" x2="250" y2="155" stroke="#38bdf8" stroke-width="2"/>
    <text x="195" y="80" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Early Reflections</text>
    <text x="195" y="96" fill="#94a3b8" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">(Room boundaries &amp; size)</text>

    <!-- Diffuse Tail Envelope (250 to 620) -->
    <path d="M 250 155 Q 350 180 450 215 T 620 240" fill="none" stroke="#34d399" stroke-width="3"/>
    <!-- Fill tail with density hatching / noise lines -->
    <path d="M 250 155 Q 350 180 450 215 T 620 240 L 250 240 Z" fill="#34d399" fill-opacity="0.15"/>
    <text x="430" y="160" fill="#34d399" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Late Diffuse Reverberation Tail</text>
    <text x="430" y="178" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">High echo density, exponential decay</text>

    <!-- RT60 measurement indicator -->
    <line x1="620" y1="130" x2="620" y2="240" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="620" y="120" fill="#a78bfa" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">RT60 Limit</text>
    <text x="620" y="134" fill="#cbd5e1" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">(-60 dB Decay)</text>
  </g>

  <!-- Summary Box -->
  <rect x="50" y="380" width="700" height="70" fill="#1e293b" rx="6"/>
  <text x="400" y="405" fill="#f8fafc" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Pre-delay separates the direct vocal/instrument from the reverb, preserving upfront clarity.</text>
  <text x="400" y="425" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">RT60 is the time in seconds required for sound pressure level to attenuate by 60 decibels.</text>
</svg>