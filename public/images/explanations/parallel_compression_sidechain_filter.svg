<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="scGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <text x="400" y="42" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="800" text-anchor="middle">
    PARALLEL DRUM BUS: SIDECHAIN HIGH-PASS FILTER
  </text>
  <text x="400" y="66" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">
    Preventing Massive Kick Sub-Bass from Choking the Parallel Compressor
  </text>

  <!-- GRAPH CONTAINER -->
  <g transform="translate(80, 95)">
    <rect width="640" height="260" rx="10" fill="url(#scGrad)" stroke="#475569" stroke-width="2" />

    <!-- Frequency Axis (Logarithmic grid) -->
    <!-- 20Hz, 50Hz, 80Hz, 200Hz, 1kHz, 5kHz, 20kHz -->
    <line x1="80" y1="210" x2="600" y2="210" stroke="#334155" stroke-width="2" />
    <text x="80" y="230" fill="#64748b" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">20 Hz</text>
    <text x="160" y="230" fill="#f87171" font-family="'Courier New', monospace" font-size="11" font-weight="bold" text-anchor="middle">80 Hz (HPF Cutoff)</text>
    <text x="260" y="230" fill="#64748b" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">250 Hz</text>
    <text x="380" y="230" fill="#64748b" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">1 kHz</text>
    <text x="490" y="230" fill="#64748b" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">5 kHz</text>
    <text x="590" y="230" fill="#64748b" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">20 kHz</text>

    <!-- Subsonic energy block that causes pumping -->
    <rect x="80" y="70" width="80" height="140" fill="#ef4444" opacity="0.25" rx="4" />
    <text x="120" y="100" fill="#fca5a5" font-family="Inter, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Massive Kick Energy</text>
    <text x="120" y="118" fill="#f87171" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">(30 - 70 Hz Sub)</text>

    <!-- HPF Filter Slope Curve (Rolling off below 80 Hz) -->
    <path d="M 80 200 Q 120 190 160 80 L 590 80" fill="none" stroke="#38bdf8" stroke-width="3" />

    <!-- Red X over the filtered sub-energy -->
    <line x1="100" y1="130" x2="140" y2="170" stroke="#ef4444" stroke-width="3" />
    <line x1="140" y1="130" x2="100" y2="170" stroke="#ef4444" stroke-width="3" />
    <text x="120" y="190" fill="#f87171" font-family="Inter, sans-serif" font-size="10" font-weight="800" text-anchor="middle">BLOCKED</text>

    <!-- Passing mid-range energy -->
    <text x="360" y="115" fill="#34d399" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">
      Snare Crack &amp; Room Shell Resonance (150 Hz - 5 kHz)
    </text>
    <text x="360" y="135" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">
      Triggers smooth, transparent, punchy parallel compression!
    </text>
  </g>

  <!-- BOTTOM EXPLANATION -->
  <text x="400" y="390" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    Why do we high-pass the sidechain at 60–100 Hz on a parallel drum bus?
  </text>
  <text x="400" y="410" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    Low sub-frequencies carry enormous physical voltage that would trigger -20 dB of gain reduction on every kick hit, choking the snare and cymbals.
  </text>
</svg>
