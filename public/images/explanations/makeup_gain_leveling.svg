<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="meterGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="464" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Header Badge -->
  <rect x="30" y="20" width="280" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="170" y="41" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">MAKE-UP GAIN &amp; LOUDNESS</text>
  <text x="325" y="41" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Why compression makes tracks sound louder without digital clipping</text>

  <!-- Stage 1 Card: Uncompressed Audio -->
  <g transform="translate(30, 68)">
    <rect width="230" height="295" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Stage Pill -->
    <rect x="14" y="14" width="70" height="22" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
    <text x="49" y="29" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STAGE 1</text>
    <text x="92" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Original Audio</text>

    <!-- Waveform Box -->
    <rect x="14" y="44" width="202" height="120" rx="6" fill="#0b1120" stroke="#1e293b" />
    
    <!-- 0 dB Ceiling Line -->
    <line x1="14" y1="56" x2="216" y2="56" stroke="#ef4444" stroke-width="1" stroke-dasharray="3" />
    <text x="210" y="52" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="end">0 dBFS (Max Peak)</text>

    <!-- Center Zero Line -->
    <line x1="14" y1="104" x2="216" y2="104" stroke="#334155" stroke-width="1" />

    <!-- Waveform: Tall spiky peaks reaching 0 dB, but thin low-level body -->
    <path d="M 20,104 L 35,100 L 45,56 L 55,152 L 65,102 L 85,98 L 95,60 L 105,148 L 115,104 L 140,101 L 150,56 L 160,152 L 170,103 L 205,104" fill="none" stroke="#60a5fa" stroke-width="2" />

    <!-- Average Level RMS Area Box -->
    <rect x="14" y="88" width="202" height="32" fill="#38bdf8" fill-opacity="0.12" />
    <text x="20" y="99" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700">RMS Area (Average)</text>

    <!-- Stats Box -->
    <rect x="14" y="172" width="202" height="66" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="24" y="191" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Peak Level: <tspan fill="#f87171" font-weight="700">0 dBFS (Hot)</tspan></text>
    <text x="24" y="209" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Average RMS: <tspan fill="#94a3b8" font-weight="700">-18 dB (Quiet)</tspan></text>
    <text x="24" y="227" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Perceived Loudness: <tspan fill="#f59e0b" font-weight="700">Low / Thin</tspan></text>

    <!-- Status description -->
    <text x="115" y="258" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Large dynamic range.</text>
    <text x="115" y="274" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="middle">Cannot turn up fader without clipping peaks.</text>
  </g>

  <!-- Stage 2 Card: Compressed Peaks -->
  <g transform="translate(285, 68)">
    <rect width="230" height="295" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Stage Pill -->
    <rect x="14" y="14" width="70" height="22" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
    <text x="49" y="29" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STAGE 2</text>
    <text x="92" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Compression</text>

    <!-- Waveform Box -->
    <rect x="14" y="44" width="202" height="120" rx="6" fill="#0b1120" stroke="#1e293b" />
    
    <!-- 0 dB Ceiling Line (Ghost) -->
    <line x1="14" y1="56" x2="216" y2="56" stroke="#ef4444" stroke-width="1" stroke-dasharray="3" opacity="0.4" />

    <!-- Threshold Line (-6 dB) -->
    <line x1="14" y1="74" x2="216" y2="74" stroke="#facc15" stroke-width="1.5" stroke-dasharray="3" />
    <text x="210" y="85" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="end">Threshold (-6 dB)</text>

    <!-- Center Zero Line -->
    <line x1="14" y1="104" x2="216" y2="104" stroke="#334155" stroke-width="1" />

    <!-- Clamped Waveform: Peaks squashed down to -6 dB -->
    <path d="M 20,104 L 35,100 L 45,74 L 55,134 L 65,102 L 85,98 L 95,76 L 105,132 L 115,104 L 140,101 L 150,74 L 160,134 L 170,103 L 205,104" fill="none" stroke="#ef4444" stroke-width="2" />

    <!-- Gain Reduction Arrow / Label -->
    <rect x="75" y="52" width="80" height="18" rx="3" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="0.8" />
    <text x="115" y="64" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Peaks Cut -6 dB</text>

    <!-- Stats Box -->
    <rect x="14" y="172" width="202" height="66" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="24" y="191" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">New Peak: <tspan fill="#facc15" font-weight="700">-6 dBFS (Lower!)</tspan></text>
    <text x="24" y="209" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Average RMS: <tspan fill="#94a3b8" font-weight="700">-20 dB (Quieter)</tspan></text>
    <text x="24" y="227" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Perceived Loudness: <tspan fill="#ef4444" font-weight="700">Quieter</tspan></text>

    <!-- Status description -->
    <text x="115" y="258" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Peaks are pulled down.</text>
    <text x="115" y="274" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="middle">Creates +6 dB of empty headroom!</text>
  </g>

  <!-- Stage 3 Card: Make-up Gain Applied -->
  <g transform="translate(540, 68)">
    <rect width="230" height="295" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.8" />
    
    <!-- Stage Pill -->
    <rect x="14" y="14" width="70" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="49" y="29" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">STAGE 3</text>
    <text x="92" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Make-Up Gain</text>

    <!-- Waveform Box -->
    <rect x="14" y="44" width="202" height="120" rx="6" fill="#0b1120" stroke="#1e293b" />
    
    <!-- 0 dB Ceiling Line -->
    <line x1="14" y1="56" x2="216" y2="56" stroke="#ef4444" stroke-width="1" stroke-dasharray="3" />
    <text x="210" y="52" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="end">0 dBFS (Ceiling)</text>

    <!-- Center Zero Line -->
    <line x1="14" y1="104" x2="216" y2="104" stroke="#334155" stroke-width="1" />

    <!-- Amplified Waveform: Boosted by +6 dB, peaks reach ceiling, but body is HUGE -->
    <path d="M 20,104 L 35,94 L 45,56 L 55,152 L 65,98 L 85,92 L 95,58 L 105,150 L 115,104 L 140,96 L 150,56 L 160,152 L 170,100 L 205,104" fill="none" stroke="#10b981" stroke-width="2.5" />

    <!-- Big Dense RMS Area Box -->
    <rect x="14" y="80" width="202" height="48" fill="#10b981" fill-opacity="0.22" />
    <text x="20" y="93" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700">DENSE RMS AREA (+6 dB!)</text>

    <!-- Stats Box -->
    <rect x="14" y="172" width="202" height="66" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="24" y="191" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Peak Level: <tspan fill="#34d399" font-weight="700">0 dBFS (Protected)</tspan></text>
    <text x="24" y="209" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Average RMS: <tspan fill="#34d399" font-weight="700">-12 dB (+6 dB Louder!)</tspan></text>
    <text x="24" y="227" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Perceived Loudness: <tspan fill="#34d399" font-weight="900">MUCH LOUDER</tspan></text>

    <!-- Status description -->
    <text x="115" y="258" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">+6 dB Make-up Gain added.</text>
    <text x="115" y="274" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="middle">Average energy is boosted dramatically!</text>
  </g>

  <!-- Bottom Summary Callout -->
  <g transform="translate(30, 376)">
    <rect width="740" height="70" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="36" cy="35" r="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <text x="36" y="40" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">i</text>
    
    <text x="64" y="25" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Edexcel Exam Concept: Why Compressed Tracks Sound Louder</text>
    <text x="64" y="43" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Compressors do not boost sound on their own—they attenuate loud peaks to create headroom.</text>
    <text x="64" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Make-up gain then raises the entire compressed signal, boosting average RMS/LUFS energy without digital clipping.</text>
  </g>
</svg>