<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(30, 16)">
    <rect width="270" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="135" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">MASTERING SIGNAL CHAIN</text>
    <rect x="282" y="0" width="370" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="467" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Stereo Mixdown to Final Distribution Delivery Formats</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Signal Flow Steps -->
    <g transform="translate(20, 20)">
      <!-- Step 1: Stereo Mix Input -->
      <g transform="translate(0, 0)">
        <rect width="130" height="130" rx="6" fill="#0b1120" stroke="#64748b" stroke-width="1.2" />
        <g transform="translate(10, 10)">
          <rect width="110" height="22" rx="3" fill="#1e293b" />
          <text x="55" y="15" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">1. MIX FILE</text>
        </g>
        <g transform="translate(10, 42)">
          <rect width="110" height="76" rx="4" fill="#0f172a" stroke="#334155" />
          <text x="55" y="24" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Stereo 24-bit</text>
          <text x="55" y="44" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">-6 dBFS Peak</text>
          <text x="55" y="62" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">Unprocessed</text>
        </g>
      </g>

      <!-- Arrow 1 -->
      <line x1="135" y1="65" x2="147" y2="65" stroke="#38bdf8" stroke-width="2" />

      <!-- Step 2: Surgical EQ -->
      <g transform="translate(152, 0)">
        <rect width="130" height="130" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2" />
        <g transform="translate(10, 10)">
          <rect width="110" height="22" rx="3" fill="#0c4a6e" />
          <text x="55" y="15" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">2. MASTER EQ</text>
        </g>
        <g transform="translate(10, 42)">
          <rect width="110" height="76" rx="4" fill="#0f172a" stroke="#334155" />
          <text x="55" y="24" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Linear Phase</text>
          <text x="55" y="44" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">HPF @ 30 Hz</text>
          <text x="55" y="62" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">Tonal Balance</text>
        </g>
      </g>

      <!-- Arrow 2 -->
      <line x1="287" y1="65" x2="299" y2="65" stroke="#38bdf8" stroke-width="2" />

      <!-- Step 3: Bus Compressor -->
      <g transform="translate(304, 0)">
        <rect width="130" height="130" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
        <g transform="translate(10, 10)">
          <rect width="110" height="22" rx="3" fill="#064e3b" />
          <text x="55" y="15" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">3. GLUE COMP</text>
        </g>
        <g transform="translate(10, 42)">
          <rect width="110" height="76" rx="4" fill="#0f172a" stroke="#334155" />
          <text x="55" y="24" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Master Bus</text>
          <text x="55" y="44" fill="#10b981" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">1-2 dB Reduct</text>
          <text x="55" y="62" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">Slow Atk / Auto</text>
        </g>
      </g>

      <!-- Arrow 3 -->
      <line x1="439" y1="65" x2="451" y2="65" stroke="#10b981" stroke-width="2" />

      <!-- Step 4: True Peak Limiter -->
      <g transform="translate(456, 0)">
        <rect width="130" height="130" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1.2" />
        <g transform="translate(10, 10)">
          <rect width="110" height="22" rx="3" fill="#450a0a" />
          <text x="55" y="15" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">4. TP LIMITER</text>
        </g>
        <g transform="translate(10, 42)">
          <rect width="110" height="76" rx="4" fill="#0f172a" stroke="#334155" />
          <text x="55" y="24" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Brickwall Peak</text>
          <text x="55" y="44" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">-1.0 dBTP Ceil</text>
          <text x="55" y="62" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">Commercial Vol</text>
        </g>
      </g>

      <!-- Arrow 4 -->
      <line x1="591" y1="65" x2="603" y2="65" stroke="#ef4444" stroke-width="2" />

      <!-- Step 5: Dither & Delivery -->
      <g transform="translate(608, 0)">
        <rect width="92" height="130" rx="6" fill="#0b1120" stroke="#a855f7" stroke-width="1.2" />
        <g transform="translate(8, 10)">
          <rect width="76" height="22" rx="3" fill="#3b0764" />
          <text x="38" y="15" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">5. EXPORT</text>
        </g>
        <g transform="translate(8, 42)">
          <rect width="76" height="76" rx="4" fill="#0f172a" stroke="#334155" />
          <text x="38" y="24" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">TPDF Dither</text>
          <text x="38" y="44" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">16/24-bit</text>
          <text x="38" y="62" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">Streaming/CD</text>
        </g>
      </g>
    </g>

    <!-- Lower Overview Panels (3 Pillars of Mastering) -->
    <g transform="translate(20, 170)">
      <!-- Col 1 -->
      <g transform="translate(0, 0)">
        <rect width="220" height="115" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1" />
        <g transform="translate(12, 10)">
          <rect width="130" height="20" rx="3" fill="#0c4a6e" />
          <text x="65" y="14" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SPECTRAL BALANCE</text>
        </g>
        <g transform="translate(12, 38)">
          <rect width="196" height="65" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="10" y="20" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">• Tonal cohesion across all tracks</text>
          <text x="10" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Cleans sub-mud &amp; harsh sibilance</text>
          <text x="10" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Musical shelving &amp; dynamic EQ</text>
        </g>
      </g>

      <!-- Col 2 -->
      <g transform="translate(240, 0)">
        <rect width="220" height="115" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1" />
        <g transform="translate(12, 10)">
          <rect width="130" height="20" rx="3" fill="#064e3b" />
          <text x="65" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">DYNAMIC CONTROL</text>
        </g>
        <g transform="translate(12, 38)">
          <rect width="196" height="65" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="10" y="20" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">• Glues disparate mix stems</text>
          <text x="10" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Competitive, controlled loudness</text>
          <text x="10" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Retains vital punch &amp; transients</text>
        </g>
      </g>

      <!-- Col 3 -->
      <g transform="translate(480, 0)">
        <rect width="220" height="115" rx="6" fill="#0b1120" stroke="#a855f7" stroke-width="1" />
        <g transform="translate(12, 10)">
          <rect width="140" height="20" rx="3" fill="#3b0764" />
          <text x="70" y="14" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SYSTEM TRANSLATION</text>
        </g>
        <g transform="translate(12, 38)">
          <rect width="196" height="65" rx="3" fill="#0f172a" stroke="#1e293b" />
          <text x="10" y="20" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">• Ensures flawless translation</text>
          <text x="10" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Earbuds, cars, phones, club PAs</text>
          <text x="10" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Metadata, ISRC, DDP compliance</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 12)">
      <rect width="75" height="20" rx="3" fill="#0284c7" />
      <text x="37" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="98" y="27" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Mastering optimizes tonal balance, dynamics, and format specs for universal playback translation.</text>
  </g>
</svg>
