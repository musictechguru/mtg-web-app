<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f172a" rx="12"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#1e293b" stroke-width="2" rx="10"/>

  <text x="400" y="55" fill="#f8fafc" font-size="20" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Crossfade Curves: Linear vs Equal Power</text>
  <text x="400" y="80" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">Preventing perceived loudness drops when transitioning between audio clips</text>

  <!-- Left: Linear Crossfade -->
  <g transform="translate(50, 110)">
    <rect width="335" height="260" fill="#1e293b" rx="8" stroke="#ef4444" stroke-width="2"/>
    <text x="167" y="30" fill="#ef4444" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Linear Crossfade (Straight Slopes)</text>

    <rect x="25" y="50" width="285" height="130" fill="#0f172a" rx="6" stroke="#475569"/>
    <!-- Fade Out -->
    <line x1="45" y1="65" x2="290" y2="165" stroke="#38bdf8" stroke-width="3"/>
    <!-- Fade In -->
    <line x1="45" y1="165" x2="290" y2="65" stroke="#34d399" stroke-width="3"/>
    <!-- Center Drop Indicator -->
    <circle cx="167" cy="115" r="5" fill="#ef4444"/>
    <line x1="167" y1="65" x2="167" y2="115" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="167" y="135" fill="#ef4444" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">-3 dB Volume Dip!</text>

    <text x="167" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">• Summed acoustic power drops at midpoint</text>
    <text x="167" y="218" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">• Audible "hollow" dip between songs / clips</text>
    <text x="167" y="238" fill="#ef4444" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Only suitable for phase-correlated audio</text>
  </g>

  <!-- Right: Equal Power Crossfade -->
  <g transform="translate(415, 110)">
    <rect width="335" height="260" fill="#1e293b" rx="8" stroke="#34d399" stroke-width="2"/>
    <text x="167" y="30" fill="#34d399" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Equal Power Crossfade (Curved / Sine)</text>

    <rect x="25" y="50" width="285" height="130" fill="#0f172a" rx="6" stroke="#475569"/>
    <!-- Sine/Root Fade Out -->
    <path d="M 45 65 Q 167 75 290 165" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <!-- Sine/Root Fade In -->
    <path d="M 45 165 Q 167 75 290 65" fill="none" stroke="#34d399" stroke-width="3"/>
    <!-- Center Point: +0dB total power -->
    <circle cx="167" cy="88" r="5" fill="#34d399"/>
    <text x="167" y="112" fill="#34d399" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Constant 0 dB Power</text>

    <text x="167" y="200" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">• Midpoint maintains equal sound intensity</text>
    <text x="167" y="218" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">• Smooth, seamless perceived loudness</text>
    <text x="167" y="238" fill="#34d399" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Standard for music mixing &amp; mastering edits</text>
  </g>

  <!-- Summary Box -->
  <rect x="50" y="390" width="700" height="60" fill="#1e293b" rx="6"/>
  <text x="400" y="415" fill="#f8fafc" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Mathematical Basis: For uncorrelated signals (different songs/takes), power sums as A² + B² = 1.</text>
  <text x="400" y="435" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">Equal Power fade uses cosine/sine or square root curve (each at -3dB at 50%, summing to 0dB acoustic power).</text>
</svg>