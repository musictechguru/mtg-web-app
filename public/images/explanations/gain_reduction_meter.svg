<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="meterFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2" />

  <!-- Main Panel -->
  <rect x="50" y="40" width="700" height="320" rx="12" fill="url(#meterFaceGrad)" stroke="#334155" stroke-width="2" />
  
  <text x="400" y="75" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="800" text-anchor="middle">
    COMPRESSOR GAIN REDUCTION (GR) METERING
  </text>
  <text x="400" y="98" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">
    Reading Gain Reduction: Downward Deflection from 0 dB
  </text>

  <!-- DUAL METER COMPARISON: Standard Insert vs Parallel Crush -->
  
  <!-- LEFT: Standard Insert Compression (-3 dB to -5 dB) -->
  <g transform="translate(90, 125)">
    <rect width="280" height="180" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="140" y="28" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">STANDARD INSERT COMPRESSION</text>
    <text x="140" y="46" fill="#38bdf8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Subtle Dynamics Taming (Transparent)</text>

    <!-- Meter Scale Bar -->
    <!-- Scale marks: 0, -2, -4, -6, -8, -10, -15, -20 -->
    <rect x="30" y="70" width="220" height="24" rx="4" fill="#1e293b" />
    <!-- Active GR (3-4 dB) from Right (0) toward Left -->
    <rect x="210" y="72" width="38" height="20" rx="3" fill="#f59e0b" />

    <!-- Scale ticks -->
    <text x="248" y="112" fill="#10b981" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="middle">0</text>
    <text x="210" y="112" fill="#f59e0b" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="middle">-4</text>
    <text x="160" y="112" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">-8</text>
    <text x="100" y="112" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">-14</text>
    <text x="35" y="112" fill="#ef4444" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">-20</text>

    <text x="140" y="145" fill="#f59e0b" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Peak GR: -3 dB to -4 dB</text>
    <text x="140" y="165" fill="#64748b" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Gentle glue, natural crest factor</text>
  </g>

  <!-- RIGHT: Parallel Crush Bus (-15 dB to -20 dB) -->
  <g transform="translate(430, 125)">
    <rect width="280" height="180" rx="8" fill="#020617" stroke="#ef4444" stroke-width="2" />
    <rect x="0" y="0" width="280" height="22" rx="8" fill="#7f1d1d" />
    <text x="140" y="16" fill="#fecaca" font-family="Inter, sans-serif" font-size="12" font-weight="800" text-anchor="middle">PARALLEL AUX CRUSH BUS</text>
    <text x="140" y="46" fill="#f87171" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Aggressive Heavy Smash (All-In)</text>

    <!-- Meter Scale Bar -->
    <rect x="30" y="70" width="220" height="24" rx="4" fill="#1e293b" />
    <!-- Active GR (heavy 16 dB of reduction!) -->
    <rect x="75" y="72" width="173" height="20" rx="3" fill="#ef4444" />

    <!-- Scale ticks -->
    <text x="248" y="112" fill="#10b981" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="middle">0</text>
    <text x="210" y="112" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">-4</text>
    <text x="160" y="112" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11" text-anchor="middle">-8</text>
    <text x="100" y="112" fill="#f87171" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="middle">-14</text>
    <text x="35" y="112" fill="#ef4444" font-family="'Courier New', monospace" font-size="11" font-weight="800" text-anchor="middle">-20</text>

    <text x="140" y="145" fill="#ef4444" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Heavy GR: -15 dB to -20 dB Pinned</text>
    <text x="140" y="165" fill="#fca5a5" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Massive harmonic distortion &amp; room sustain</text>
  </g>

  <!-- BOTTOM CAPTION -->
  <text x="400" y="395" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">
    Notice: If you saw -18 dB of Gain Reduction on your primary drum track, it would sound lifeless and muffled.
  </text>
  <text x="400" y="415" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    In Parallel, this heavy -18 dB crush is tucked beneath the uncompressed dry drums, giving power without killing transients!
  </text>
</svg>