<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <text x="400" y="40" fill="#f8fafc" font-family="Inter, sans-serif" font-size="20" font-weight="800" text-anchor="middle">
    PARALLEL COMPRESSION: LATENCY &amp; PHASE ALIGNMENT
  </text>
  <text x="400" y="62" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">
    Why Automatic Plugin Delay Compensation (PDC) is Essential
  </text>

  <!-- LEFT: WHAT HAPPENS WITHOUT PDC (PHASE CANCEL / COMB FILTER) -->
  <g transform="translate(60, 95)">
    <rect width="320" height="275" rx="10" fill="#450a0a" stroke="#dc2626" stroke-width="2" />
    <text x="160" y="28" fill="#fca5a5" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">❌ WITHOUT DELAY COMPENSATION</text>

    <!-- Waveform mismatch illustration -->
    <rect x="20" y="48" width="280" height="120" rx="6" fill="#020617" />
    <!-- Dry Waveform (Blue) -->
    <path d="M 30 100 Q 50 60 70 100 Q 90 140 110 100 Q 130 60 150 100 Q 170 140 190 100 Q 210 60 230 100 Q 250 140 270 100" fill="none" stroke="#60a5fa" stroke-width="2.5" />
    <!-- Delayed Wet Waveform (Red, shifted right by 10ms!) -->
    <path d="M 45 100 Q 65 60 85 100 Q 105 140 125 100 Q 145 60 165 100 Q 185 140 205 100 Q 225 60 245 100 Q 265 140 285 100" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3,3" />

    <!-- Latency gap indicator -->
    <line x1="70" y1="50" x2="85" y2="50" stroke="#f87171" stroke-width="2" />
    <text x="78" y="44" fill="#fca5a5" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle">Δt Latency</text>

    <text x="160" y="195" fill="#f87171" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Disastrous Comb Filtering!</text>
    <text x="160" y="218" fill="#fecaca" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Plugin buffer delays Wet path by 128 samples</text>
    <text x="160" y="236" fill="#fecaca" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Hollow, flanged, thin acoustic result</text>
    <text x="160" y="254" fill="#f87171" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">• Severe bass cancellation</text>
  </g>

  <!-- RIGHT: WITH AUTOMATIC DELAY COMPENSATION (SAMPLE-ACCURATE) -->
  <g transform="translate(420, 95)">
    <rect width="320" height="275" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <text x="160" y="28" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">✅ WITH DELAY COMPENSATION (PDC)</text>

    <!-- Waveform in-phase illustration -->
    <rect x="20" y="48" width="280" height="120" rx="6" fill="#020617" />
    <!-- Waveforms locked in phase! -->
    <path d="M 30 100 Q 50 60 70 100 Q 90 140 110 100 Q 130 60 150 100 Q 170 140 190 100 Q 210 60 230 100 Q 250 140 270 100" fill="none" stroke="#60a5fa" stroke-width="3" />
    <path d="M 30 100 Q 50 75 70 100 Q 90 125 110 100 Q 130 75 150 100 Q 170 125 190 100 Q 210 75 230 100 Q 250 125 270 100" fill="none" stroke="#34d399" stroke-width="2" />

    <text x="160" y="195" fill="#34d399" font-family="Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Perfect Phase Coherence!</text>
    <text x="160" y="218" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• DAW delays Dry track by exact plugin latency</text>
    <text x="160" y="236" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">• Both signals align to the single sample</text>
    <text x="160" y="254" fill="#34d399" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">• Massive, solid low-end punch</text>
  </g>

  <!-- BOTTOM FOOTER -->
  <text x="400" y="405" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">
    Always ensure "Plugin Latency Compensation: All" is enabled in your DAW preferences when utilizing parallel busses.
  </text>
</svg>
