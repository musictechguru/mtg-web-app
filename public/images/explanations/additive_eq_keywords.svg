<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#0f172a" rx="12"/>
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#1e293b" stroke-width="2" rx="10"/>

  <text x="400" y="55" fill="#f8fafc" font-size="20" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Descriptive EQ Frequency Spectrum Guide</text>
  <text x="400" y="80" fill="#94a3b8" font-size="13" font-family="system-ui, sans-serif" text-anchor="middle">Auditory descriptors, problem resonances and additive enhancement bands (20 Hz - 20 kHz)</text>

  <!-- 6 Frequency Bands -->
  <g transform="translate(45, 110)">
    <!-- Band 1: Sub Bass -->
    <g transform="translate(0, 0)">
      <rect width="115" height="250" fill="#1e293b" rx="6" stroke="#3b82f6"/>
      <rect x="0" y="0" width="115" height="30" fill="#1d4ed8" rx="6"/>
      <text x="57" y="20" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Sub Bass</text>
      <text x="57" y="50" fill="#60a5fa" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">20 - 60 Hz</text>
      <text x="57" y="80" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">FEEL / RUMBLE</text>
      <text x="57" y="110" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• 808 subs</text>
      <text x="57" y="128" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Kick bottom</text>
      <text x="57" y="146" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Wind/foot rumble</text>
      <rect x="10" y="180" width="95" height="45" fill="#0f172a" rx="4"/>
      <text x="57" y="200" fill="#ef4444" font-size="9" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">RISK: Headroom</text>
      <text x="57" y="215" fill="#fca5a5" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">waste on monitors</text>
    </g>

    <!-- Band 2: Bass -->
    <g transform="translate(120, 0)">
      <rect width="115" height="250" fill="#1e293b" rx="6" stroke="#06b6d4"/>
      <rect x="0" y="0" width="115" height="30" fill="#0e7490" rx="6"/>
      <text x="57" y="20" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Bass</text>
      <text x="57" y="50" fill="#22d3ee" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">60 - 250 Hz</text>
      <text x="57" y="80" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">PUNCH / BOOM</text>
      <text x="57" y="110" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Bass guitar root</text>
      <text x="57" y="128" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Snare body (200)</text>
      <text x="57" y="146" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Chest resonance</text>
      <rect x="10" y="180" width="95" height="45" fill="#0f172a" rx="4"/>
      <text x="57" y="200" fill="#f59e0b" font-size="9" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">RISK: Muddy mix</text>
      <text x="57" y="215" fill="#fcd34d" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">masking low-end</text>
    </g>

    <!-- Band 3: Low-Mids -->
    <g transform="translate(240, 0)">
      <rect width="115" height="250" fill="#1e293b" rx="6" stroke="#10b981"/>
      <rect x="0" y="0" width="115" height="30" fill="#047857" rx="6"/>
      <text x="57" y="20" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Low Mids</text>
      <text x="57" y="50" fill="#34d399" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">250 - 500 Hz</text>
      <text x="57" y="80" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">WARMTH / BODY</text>
      <text x="57" y="110" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Acoustic guitars</text>
      <text x="57" y="128" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Piano fundamentals</text>
      <text x="57" y="146" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Male vocal core</text>
      <rect x="10" y="180" width="95" height="45" fill="#0f172a" rx="4"/>
      <text x="57" y="200" fill="#f59e0b" font-size="9" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">RISK: "Boxiness"</text>
      <text x="57" y="215" fill="#fcd34d" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">cardboard timbre</text>
    </g>

    <!-- Band 4: Midrange -->
    <g transform="translate(360, 0)">
      <rect width="115" height="250" fill="#1e293b" rx="6" stroke="#f59e0b"/>
      <rect x="0" y="0" width="115" height="30" fill="#b45309" rx="6"/>
      <text x="57" y="20" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Midrange</text>
      <text x="57" y="50" fill="#fbbf24" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">500 Hz - 2 kHz</text>
      <text x="57" y="80" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">CORE / SPEECH</text>
      <text x="57" y="110" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Lead vocal speech</text>
      <text x="57" y="128" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Electric guitar crunch</text>
      <text x="57" y="146" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Snare ring (1kHz)</text>
      <rect x="10" y="180" width="95" height="45" fill="#0f172a" rx="4"/>
      <text x="57" y="200" fill="#ef4444" font-size="9" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">RISK: "Honky"</text>
      <text x="57" y="215" fill="#fca5a5" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">nasal &amp; telephone</text>
    </g>

    <!-- Band 5: High Mids -->
    <g transform="translate(480, 0)">
      <rect width="115" height="250" fill="#1e293b" rx="6" stroke="#8b5cf6"/>
      <rect x="0" y="0" width="115" height="30" fill="#6d28d9" rx="6"/>
      <text x="57" y="20" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">High Mids</text>
      <text x="57" y="50" fill="#a78bfa" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">2 - 6 kHz</text>
      <text x="57" y="80" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">PRESENCE / BITE</text>
      <text x="57" y="110" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Vocal articulation</text>
      <text x="57" y="128" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Kick beater click</text>
      <text x="57" y="146" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Pick attack (3kHz)</text>
      <rect x="10" y="180" width="95" height="45" fill="#0f172a" rx="4"/>
      <text x="57" y="200" fill="#ef4444" font-size="9" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">RISK: Ear fatigue</text>
      <text x="57" y="215" fill="#fca5a5" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">harshness (Fletcher)</text>
    </g>

    <!-- Band 6: Highs / Brilliance -->
    <g transform="translate(600, 0)">
      <rect width="110" height="250" fill="#1e293b" rx="6" stroke="#ec4899"/>
      <rect x="0" y="0" width="110" height="30" fill="#be185d" rx="6"/>
      <text x="55" y="20" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Brilliance</text>
      <text x="55" y="50" fill="#f472b6" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">6 - 20 kHz</text>
      <text x="55" y="80" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">AIR / SPARKLE</text>
      <text x="55" y="110" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Cymbal sizzle</text>
      <text x="55" y="128" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Vocal breath/sheen</text>
      <text x="55" y="146" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">• Acoustic shimmer</text>
      <rect x="8" y="180" width="94" height="45" fill="#0f172a" rx="4"/>
      <text x="55" y="200" fill="#f59e0b" font-size="9" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">RISK: Sibilance</text>
      <text x="55" y="215" fill="#fcd34d" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">S/T piercing (7k)</text>
    </g>
  </g>

  <!-- Summary Box -->
  <rect x="45" y="380" width="710" height="70" fill="#1e293b" rx="6"/>
  <text x="400" y="405" fill="#f8fafc" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Frequency Masking: When two sounds occupy the same band (e.g. Bass guitar and Kick drum),</text>
  <text x="400" y="425" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle">complementary EQ carving (boosting one at 60Hz and cutting at 100Hz while boosting the other at 100Hz) creates separation.</text>
</svg>