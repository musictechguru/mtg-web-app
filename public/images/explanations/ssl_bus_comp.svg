<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(30, 16)">
    <rect width="270" height="32" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.2" />
    <text x="135" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">MASTER BUS GLUE COMPRESSION</text>
    <rect x="282" y="0" width="370" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="467" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Gentle 1-2 dB Gain Reduction for Mix Cohesion</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left: Compressor VU Gain Reduction Meter -->
    <g transform="translate(20, 20)">
      <rect width="320" height="275" rx="6" fill="#0b1120" stroke="#1e293b" />
      <g transform="translate(15, 12)">
        <rect width="180" height="22" rx="3" fill="#064e3b" />
        <text x="90" y="15" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">GAIN REDUCTION VU METER</text>
      </g>

      <!-- Vintage VU Dial graphic -->
      <g transform="translate(25, 45)">
        <rect width="270" height="135" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
        <!-- Meter Arc -->
        <path d="M 35,115 A 110,110 0 0,1 235,115" fill="none" stroke="#78350f" stroke-width="2" />
        <!-- Needle pivoted at bottom center (135, 130) pointing to -1.5 dB (approx 115, 45) -->
        <line x1="135" y1="130" x2="110" y2="42" stroke="#dc2626" stroke-width="2.5" />
        <circle cx="135" cy="130" r="8" fill="#78350f" />

        <!-- Scale Labels inside Dial -->
        <g transform="translate(180, 85)">
          <rect width="45" height="16" rx="2" fill="#78350f" />
          <text x="22" y="12" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">0 dB</text>
        </g>
        <g transform="translate(90, 30)">
          <rect width="55" height="18" rx="2" fill="#dc2626" />
          <text x="27" y="13" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">-1.5 dB GR</text>
        </g>
        <g transform="translate(35, 85)">
          <rect width="45" height="16" rx="2" fill="#78350f" />
          <text x="22" y="12" fill="#fef3c7" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">-10 dB</text>
        </g>
      </g>

      <g transform="translate(15, 195)">
        <rect width="290" height="65" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
        <text x="145" y="24" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">TRANSPARENT GLUE REDUCTION</text>
        <text x="145" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">Needle barely moves (1-2 dB max on peaks)</text>
      </g>
    </g>

    <!-- Right: 4 Golden Rules of Mastering Compression -->
    <g transform="translate(360, 20)">
      <rect width="360" height="275" rx="6" fill="#0b1120" stroke="#1e293b" />
      <g transform="translate(15, 12)">
        <rect width="220" height="22" rx="3" fill="#0c4a6e" />
        <text x="110" y="15" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">MASTERING COMPRESSOR SETTINGS</text>
      </g>

      <!-- 4 Parameter Cards -->
      <g transform="translate(15, 45)">
        <!-- Param 1: Ratio -->
        <g transform="translate(0, 0)">
          <rect width="330" height="46" rx="4" fill="#0f172a" stroke="#334155" />
          <g transform="translate(10, 11)">
            <rect width="85" height="22" rx="2" fill="#1e293b" />
            <text x="42" y="15" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">RATIO</text>
          </g>
          <g transform="translate(105, 11)">
            <rect width="90" height="22" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
            <text x="45" y="15" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">1.2:1 to 2:1</text>
          </g>
          <text x="210" y="27" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">Ultra-gentle slope</text>
        </g>

        <!-- Param 2: Attack -->
        <g transform="translate(0, 54)">
          <rect width="330" height="46" rx="4" fill="#0f172a" stroke="#334155" />
          <g transform="translate(10, 11)">
            <rect width="85" height="22" rx="2" fill="#1e293b" />
            <text x="42" y="15" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">ATTACK</text>
          </g>
          <g transform="translate(105, 11)">
            <rect width="90" height="22" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
            <text x="45" y="15" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">Slow (30 ms)</text>
          </g>
          <text x="210" y="27" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">Preserves drum snap</text>
        </g>

        <!-- Param 3: Release -->
        <g transform="translate(0, 108)">
          <rect width="330" height="46" rx="4" fill="#0f172a" stroke="#334155" />
          <g transform="translate(10, 11)">
            <rect width="85" height="22" rx="2" fill="#1e293b" />
            <text x="42" y="15" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">RELEASE</text>
          </g>
          <g transform="translate(105, 11)">
            <rect width="90" height="22" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
            <text x="45" y="15" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">Auto / Sync</text>
          </g>
          <text x="210" y="27" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">Breathes with tempo</text>
        </g>

        <!-- Param 4: Sidechain HPF -->
        <g transform="translate(0, 162)">
          <rect width="330" height="46" rx="4" fill="#0f172a" stroke="#334155" />
          <g transform="translate(10, 11)">
            <rect width="85" height="22" rx="2" fill="#1e293b" />
            <text x="42" y="15" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SC FILTER</text>
          </g>
          <g transform="translate(105, 11)">
            <rect width="90" height="22" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
            <text x="45" y="15" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">HPF @ 80 Hz</text>
          </g>
          <text x="210" y="27" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">Stops kick pumping</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 12)">
      <rect width="75" height="20" rx="3" fill="#0284c7" />
      <text x="37" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="98" y="27" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Mastering bus compression applies 1-2 dB gentle gain reduction to glue elements without choking punch.</text>
  </g>
</svg>
