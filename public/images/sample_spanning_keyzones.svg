<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="30" y="24" width="260" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="160" y="45" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">SAMPLE SPANNING (KEY MAPPING)</text>
  <text x="310" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Stretching a single root sample across multiple keyboard semitones</text>

  <!-- Keyboard Graphic spanning C1 to C5 -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="680" height="90" rx="6" fill="#0b1120" stroke="#475569" stroke-width="1.5" />
    
    <!-- White Keys (representing a broad keyboard) -->
    <!-- Draw white key blocks -->
    <g fill="#f8fafc" stroke="#334155" stroke-width="1">
      <rect x="10" y="5" width="22" height="80" rx="2" />
      <rect x="32" y="5" width="22" height="80" rx="2" />
      <rect x="54" y="5" width="22" height="80" rx="2" />
      <rect x="76" y="5" width="22" height="80" rx="2" />
      <rect x="98" y="5" width="22" height="80" rx="2" />
      <rect x="120" y="5" width="22" height="80" rx="2" />
      <rect x="142" y="5" width="22" height="80" rx="2" />
      <rect x="164" y="5" width="22" height="80" rx="2" />
      <rect x="186" y="5" width="22" height="80" rx="2" />
      <rect x="208" y="5" width="22" height="80" rx="2" />
      <rect x="230" y="5" width="22" height="80" rx="2" />
      <rect x="252" y="5" width="22" height="80" rx="2" />
      <rect x="274" y="5" width="22" height="80" rx="2" />
      <rect x="296" y="5" width="22" height="80" rx="2" />
      <rect x="318" y="5" width="22" height="80" rx="2" />
      <rect x="340" y="5" width="22" height="80" rx="2" fill="#bae6fd" stroke="#0284c7" stroke-width="2" /> <!-- ROOT KEY C3 -->
      <rect x="362" y="5" width="22" height="80" rx="2" />
      <rect x="384" y="5" width="22" height="80" rx="2" />
      <rect x="406" y="5" width="22" height="80" rx="2" />
      <rect x="428" y="5" width="22" height="80" rx="2" />
      <rect x="450" y="5" width="22" height="80" rx="2" />
      <rect x="472" y="5" width="22" height="80" rx="2" />
      <rect x="494" y="5" width="22" height="80" rx="2" />
      <rect x="516" y="5" width="22" height="80" rx="2" />
      <rect x="538" y="5" width="22" height="80" rx="2" />
      <rect x="560" y="5" width="22" height="80" rx="2" />
      <rect x="582" y="5" width="22" height="80" rx="2" />
      <rect x="604" y="5" width="22" height="80" rx="2" />
      <rect x="626" y="5" width="22" height="80" rx="2" />
      <rect x="648" y="5" width="22" height="80" rx="2" />
    </g>

    <!-- Black keys overlay -->
    <g fill="#1e293b" stroke="#0f172a" stroke-width="1">
      <rect x="24" y="5" width="14" height="48" rx="1.5" />
      <rect x="46" y="5" width="14" height="48" rx="1.5" />
      <rect x="90" y="5" width="14" height="48" rx="1.5" />
      <rect x="112" y="5" width="14" height="48" rx="1.5" />
      <rect x="134" y="5" width="14" height="48" rx="1.5" />
      <rect x="178" y="5" width="14" height="48" rx="1.5" />
      <rect x="200" y="5" width="14" height="48" rx="1.5" />
      <rect x="244" y="5" width="14" height="48" rx="1.5" />
      <rect x="266" y="5" width="14" height="48" rx="1.5" />
      <rect x="288" y="5" width="14" height="48" rx="1.5" />
      <rect x="332" y="5" width="14" height="48" rx="1.5" />
      <rect x="376" y="5" width="14" height="48" rx="1.5" />
      <rect x="398" y="5" width="14" height="48" rx="1.5" />
      <rect x="442" y="5" width="14" height="48" rx="1.5" />
      <rect x="464" y="5" width="14" height="48" rx="1.5" />
      <rect x="486" y="5" width="14" height="48" rx="1.5" />
      <rect x="530" y="5" width="14" height="48" rx="1.5" />
      <rect x="552" y="5" width="14" height="48" rx="1.5" />
      <rect x="596" y="5" width="14" height="48" rx="1.5" />
      <rect x="618" y="5" width="14" height="48" rx="1.5" />
      <rect x="640" y="5" width="14" height="48" rx="1.5" />
    </g>

    <!-- Spanning Range Indicator Bracket -->
    <line x1="10" y1="95" x2="670" y2="95" stroke="#f59e0b" stroke-width="2" />
    <line x1="10" y1="90" x2="10" y2="100" stroke="#f59e0b" stroke-width="2" />
    <line x1="670" y1="90" x2="670" y2="100" stroke="#f59e0b" stroke-width="2" />
    <text x="351" y="110" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle">← SPANNED ACROSS 4 OCTAVES FROM SINGLE ROOT SAMPLE →</text>
  </g>

  <!-- 3 COMPARISON CARDS (Low Pitch, Root Pitch, High Pitch) -->
  <g transform="translate(60, 205)">
    <!-- Low Zone (Left) -->
    <rect x="0" y="0" width="210" height="110" rx="8" fill="#0b1120" stroke="#818cf8" stroke-width="1.5" />
    <rect x="10" y="10" width="190" height="22" rx="4" fill="#312e81" />
    <text x="105" y="25" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle">TRANSPOSED DOWN (C1)</text>
    <text x="15" y="52" fill="#e2e8f0" font-size="11">• Playback: <strong style="fill:#818cf8;">Slowed Down (0.25x)</strong></text>
    <text x="15" y="70" fill="#e2e8f0" font-size="11">• Duration: <strong style="fill:#818cf8;">4x Longer</strong></text>
    <text x="15" y="88" fill="#f87171" font-size="11">• Timbre: <strong style="fill:#f87171;">Sluggish / "Giant" Voice</strong></text>

    <!-- Root Zone (Center) -->
    <rect x="235" y="0" width="210" height="110" rx="8" fill="#0b1120" stroke="#0284c7" stroke-width="2" />
    <rect x="245" y="10" width="190" height="22" rx="4" fill="#0369a1" />
    <text x="340" y="25" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">ROOT KEY (C3 - ORIGINAL)</text>
    <text x="250" y="52" fill="#e2e8f0" font-size="11">• Playback: <strong style="fill:#38bdf8;">1.0x (Original Speed)</strong></text>
    <text x="250" y="70" fill="#e2e8f0" font-size="11">• Duration: <strong style="fill:#38bdf8;">Natural Original Length</strong></text>
    <text x="250" y="88" fill="#4ade80" font-size="11">• Timbre: <strong style="fill:#4ade80;">100% Authentic Capture</strong></text>

    <!-- High Zone (Right) -->
    <rect x="470" y="0" width="210" height="110" rx="8" fill="#0b1120" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="480" y="10" width="190" height="22" rx="4" fill="#78350f" />
    <text x="575" y="25" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle">TRANSPOSED UP (C5)</text>
    <text x="485" y="52" fill="#e2e8f0" font-size="11">• Playback: <strong style="fill:#f59e0b;">Sped Up (4.0x)</strong></text>
    <text x="485" y="70" fill="#e2e8f0" font-size="11">• Duration: <strong style="fill:#f59e0b;">4x Shorter</strong></text>
    <text x="485" y="88" fill="#f87171" font-size="11">• Timbre: <strong style="fill:#f87171;">"Chipmunk Effect"</strong></text>
  </g>

  <!-- Footer Information Strip -->
  <rect x="60" y="330" width="680" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="80" y="354" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">CORE LESSON ON SAMPLE SPANNING:</text>
  <text x="80" y="374" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Spanning a single sample more than 3-4 semitones produces severe formant warping and speed distortion.</text>
  <text x="80" y="390" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">To achieve realistic acoustic instruments across the full 88-key piano, <strong style="fill:#4ade80;">MULTISAMPLING</strong> is mandatory.</text>
</svg>
