<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="passZoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cutZoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Outer Header -->
  <g transform="translate(30, 20)">
    <rect width="320" height="30" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.2" />
    <text x="160" y="20" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">HIGH-PASS FILTER (LOW-CUT)</text>
    <text x="335" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Removes low rumble &amp; plosives; lets high frequencies pass</text>
  </g>

  <!-- Main Frequency Response Card -->
  <g transform="translate(30, 62)">
    <rect width="740" height="304" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

    <!-- Graph Window -->
    <!-- X-axis: Logarithmic frequency scale from 20 Hz to 20 kHz -->
    <!-- X=50 is 20Hz, X=130 is 50Hz, X=200 is 100Hz, X=280 is 250Hz, X=360 is 500Hz, X=440 is 1kHz, X=520 is 2.5kHz, X=600 is 5kHz, X=680 is 10kHz, X=720 is 20kHz -->
    <rect x="50" y="30" width="670" height="190" rx="4" fill="#0b1120" stroke="#1e293b" />

    <!-- Horizontal Grid Lines (Gain dB) -->
    <!-- +6 dB -->
    <line x1="50" y1="55" x2="720" y2="55" stroke="#1e293b" stroke-width="1" stroke-dasharray="2" />
    <text x="44" y="58" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="end">+6 dB</text>

    <!-- 0 dB (Unity) -->
    <line x1="50" y1="85" x2="720" y2="85" stroke="#334155" stroke-width="1.2" />
    <text x="44" y="88" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="end">0 dB</text>

    <!-- -3 dB (Cutoff Reference Line) -->
    <line x1="50" y1="102" x2="720" y2="102" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3" />
    <text x="44" y="105" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="end">-3 dB</text>

    <!-- -12 dB -->
    <line x1="50" y1="140" x2="720" y2="140" stroke="#1e293b" stroke-width="1" stroke-dasharray="2" />
    <text x="44" y="143" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="end">-12 dB</text>

    <!-- -24 dB -->
    <line x1="50" y1="180" x2="720" y2="180" stroke="#1e293b" stroke-width="1" stroke-dasharray="2" />
    <text x="44" y="183" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="end">-24 dB</text>

    <!-- Vertical Grid Lines (Frequencies) -->
    <!-- 20 Hz -->
    <line x1="50" y1="30" x2="50" y2="220" stroke="#1e293b" stroke-width="1" />
    <text x="50" y="235" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">20 Hz</text>

    <!-- 50 Hz -->
    <line x1="130" y1="30" x2="130" y2="220" stroke="#1e293b" stroke-width="1" />
    <text x="130" y="235" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">50 Hz</text>

    <!-- 100 Hz (Cutoff point) -->
    <line x1="200" y1="30" x2="200" y2="220" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3" />
    <text x="200" y="235" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">100 Hz</text>

    <!-- 250 Hz -->
    <line x1="280" y1="30" x2="280" y2="220" stroke="#1e293b" stroke-width="1" />
    <text x="280" y="235" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">250 Hz</text>

    <!-- 1 kHz -->
    <line x1="440" y1="30" x2="440" y2="220" stroke="#1e293b" stroke-width="1" />
    <text x="440" y="235" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">1 kHz</text>

    <!-- 5 kHz -->
    <line x1="600" y1="30" x2="600" y2="220" stroke="#1e293b" stroke-width="1" />
    <text x="600" y="235" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">5 kHz</text>

    <!-- 20 kHz -->
    <line x1="720" y1="30" x2="720" y2="220" stroke="#1e293b" stroke-width="1" />
    <text x="720" y="235" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">20 kHz</text>

    <!-- STOPBAND / ATTENUATION ZONE SHADING (Under curve left of 100 Hz) -->
    <path d="M 50,220 L 50,210 Q 110,200 160,140 Q 185,110 200,102 L 200,220 Z" fill="url(#cutZoneGrad)" />
    
    <!-- PASSBAND ZONE SHADING (Under curve right of 100 Hz) -->
    <path d="M 200,220 L 200,102 Q 225,86 260,85 L 720,85 L 720,220 Z" fill="url(#passZoneGrad)" />

    <!-- STOPBAND CALLOUT TAG -->
    <rect x="62" y="145" width="100" height="42" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="112" y="161" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">STOPBAND (CUT)</text>
    <text x="112" y="176" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Rumble, plosives, AC hum</text>

    <!-- PASSBAND CALLOUT TAG -->
    <rect x="420" y="145" width="135" height="42" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="487" y="161" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">PASSBAND (UNTOUCHED)</text>
    <text x="487" y="176" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">Warmth, clarity, harmonics &amp; air</text>

    <!-- THE HPF CURVE (Steep 18 dB/octave roll-off) -->
    <!-- 20kHz down to 260Hz flat at y=85 (0dB), knee at 220Hz, passes through (200, 102) [-3dB cutoff], rolls down steeply -->
    <path d="M 720,85 L 260,85 Q 225,85 200,102 Q 170,125 140,165 Q 115,200 50,215" fill="none" stroke="#38bdf8" stroke-width="3" />

    <!-- CUTOFF POINT DOT & CALLOUT -->
    <circle cx="200" cy="102" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    
    <rect x="145" y="42" width="165" height="42" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
    <text x="227" y="56" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">CUTOFF FREQUENCY: 100 Hz</text>
    <text x="227" y="68" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle">-3 dB point where attenuation begins</text>
    <text x="227" y="78" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">Slope: 18 dB / octave roll-off</text>

    <!-- Bottom 3 Explanatory Pill Columns -->
    <g transform="translate(50, 250)">
      <!-- Pill 1: What It Does -->
      <rect width="210" height="44" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="105" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">WHAT PASSES vs WHAT CUTS</text>
      <text x="105" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">HIGHS PASS through; LOWS are CUT</text>

      <!-- Pill 2: Vocal Application -->
      <g transform="translate(230, 0)">
        <rect width="210" height="44" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
        <text x="105" y="16" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">VOCAL CLEANUP (80–120 Hz)</text>
        <text x="105" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">Clears mic stand thumps, plosives &amp; mud</text>
      </g>

      <!-- Pill 3: Synonym -->
      <g transform="translate(460, 0)">
        <rect width="210" height="44" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
        <text x="105" y="16" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">KEY TERMINOLOGY</text>
        <text x="105" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">High-Pass Filter (HPF) = Low-Cut Filter</text>
      </g>
    </g>
  </g>

  <!-- Bottom Key Exam Takeaway -->
  <g transform="translate(30, 380)">
    <rect width="740" height="82" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <circle cx="36" cy="41" r="14" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5" />
    <text x="36" y="46" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">i</text>
    
    <text x="64" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Edexcel Exam Essentials: High-Pass vs Low-Pass</text>
    <text x="64" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• A <tspan fill="#60a5fa" font-weight="bold">High-Pass Filter (Low-Cut)</tspan> allows high frequencies to pass unimpeded while progressively attenuating low frequencies.</text>
    <text x="64" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Essential on vocals (80–120 Hz) and non-bass instruments to eliminate handling rumble, stage vibrations, and headroom-wasting mud.</text>
    <text x="64" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• The <tspan fill="#fbbf24" font-weight="bold">cutoff frequency</tspan> is defined where output power drops by <tspan fill="#fbbf24" font-weight="bold">-3 dB</tspan>; the slope determines how steeply lows drop per octave.</text>
  </g>
</svg>
