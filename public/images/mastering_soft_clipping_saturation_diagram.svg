<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(30, 16)">
    <rect width="270" height="32" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.2" />
    <text x="135" y="21" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">SOFT CLIPPING BEFORE LIMITING</text>
    <rect x="282" y="0" width="370" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="467" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Shaving Micro-Peaks to Eliminate Limiter Pumping</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left: Limiter Alone (Pumping) -->
    <g transform="translate(20, 20)">
      <rect width="335" height="275" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1.2" />
      <g transform="translate(15, 12)">
        <rect width="210" height="24" rx="4" fill="#450a0a" />
        <text x="105" y="16" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">LIMITER ONLY (OVERBURDENED)</text>
      </g>

      <!-- Waveform graphic showing heavy pumping dips -->
      <g transform="translate(15, 48)">
        <rect width="305" height="120" rx="4" fill="#0f172a" stroke="#1e293b" />
        <!-- Baseline -->
        <line x1="15" y1="95" x2="290" y2="95" stroke="#334155" stroke-width="1" />
        <!-- Sharp transient hitting limiter hard -->
        <path d="M 20,95 L 45,95 L 55,20 L 65,95 L 90,95" fill="none" stroke="#ef4444" stroke-width="2.5" />
        <!-- Pumping recovery dip in background audio -->
        <path d="M 90,95 Q 120,115 160,95 L 285,95" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="3 2" />

        <g transform="translate(70, 25)">
          <rect width="135" height="20" rx="2" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
          <text x="67" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8" font-weight="900" text-anchor="middle">HEAVY -5 dB LIMITER GR</text>
        </g>
        <g transform="translate(120, 70)">
          <rect width="115" height="18" rx="2" fill="#0b1120" stroke="#ef4444" stroke-width="0.8" />
          <text x="57" y="13" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Audible Volume Dip</text>
        </g>
      </g>

      <g transform="translate(15, 180)">
        <rect width="305" height="80" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="0.8" />
        <text x="12" y="22" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Transient Clamping Penalties</text>
        <text x="12" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Drum transients force limiter into deep reduction</text>
        <text x="12" y="56" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Creates audible breathing and ducking on kick hits</text>
        <text x="12" y="70" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="8.5">• Smears snare attack transients and dulls punch</text>
      </g>
    </g>

    <!-- Right: Soft Clipper + Gentle Limiter -->
    <g transform="translate(385, 20)">
      <rect width="335" height="275" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
      <g transform="translate(15, 12)">
        <rect width="210" height="24" rx="4" fill="#064e3b" />
        <text x="105" y="16" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">CLIPPER + LIMITER (TRANSPARENT)</text>
      </g>

      <!-- Waveform graphic showing rounded peak & steady audio -->
      <g transform="translate(15, 48)">
        <rect width="305" height="120" rx="4" fill="#0f172a" stroke="#1e293b" />
        <!-- Baseline -->
        <line x1="15" y1="95" x2="290" y2="95" stroke="#334155" stroke-width="1" />
        <!-- Rounded soft clipped peak -->
        <path d="M 20,95 L 45,95 C 50,95 52,40 55,40 C 58,40 60,95 65,95 L 285,95" fill="none" stroke="#10b981" stroke-width="2.5" />
        <line x1="45" y1="40" x2="65" y2="40" stroke="#fbbf24" stroke-width="2" />

        <g transform="translate(70, 25)">
          <rect width="145" height="20" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
          <text x="72" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="900" text-anchor="middle">CLIPPER ABSORBS 1.5 dB</text>
        </g>
        <g transform="translate(120, 70)">
          <rect width="135" height="18" rx="2" fill="#0b1120" stroke="#10b981" stroke-width="0.8" />
          <text x="67" y="13" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">Steady Sustain (Zero Dip)</text>
        </g>
      </g>

      <g transform="translate(15, 180)">
        <rect width="305" height="80" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
        <text x="12" y="22" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Divided Workload Dynamics</text>
        <text x="12" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Clipper shaves the sharpest 1-2 dB instantaneously</text>
        <text x="12" y="56" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Final limiter only needs gentle 1 dB reduction</text>
        <text x="12" y="70" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="8.5">• Delivers loud, clean master with zero audible pumping</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 12)">
      <rect width="75" height="20" rx="3" fill="#0284c7" />
      <text x="37" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="98" y="27" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Soft clipping transparently shaves micro-peaks, allowing the final limiter to operate cleanly without pumping.</text>
  </g>
</svg>
