<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Subtle Studio Grid -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="260" x2="800" y2="260" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="460" />
    <line x1="400" y1="0" x2="400" y2="460" />
    <line x1="600" y1="0" x2="600" y2="460" />
  </g>

  <!-- Header Section with Padded Badges -->
  <g transform="translate(30, 16)">
    <!-- Main Title Pill -->
    <rect x="0" y="0" width="260" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="130" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">LCR PANNING</text>

    <!-- Subtitle Pill -->
    <rect x="270" y="0" width="310" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="425" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Only 3 Positions: Left, Center, or Right</text>
  </g>

  <!-- 1. LEFT CARD (Hard Left) -->
  <g transform="translate(30, 60)">
    <rect width="230" height="315" rx="8" fill="url(#cardGrad)" stroke="#0ea5e9" stroke-width="1.4" filter="url(#shadow)" />
    
    <!-- Header Badge -->
    <g transform="translate(15, 14)">
      <rect width="200" height="26" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1" />
      <text x="100" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">HARD LEFT</text>
    </g>

    <!-- Pan Knob Display -->
    <g transform="translate(115, 82)">
      <circle cx="0" cy="0" r="28" fill="#0b1120" stroke="#0ea5e9" stroke-width="2.5" />
      <line x1="0" y1="0" x2="-20" y2="12" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    </g>
    <!-- Value badge -->
    <rect x="55" y="122" width="120" height="20" rx="3" fill="#0b1120" stroke="#0ea5e9" stroke-width="0.8" />
    <text x="115" y="136" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Pan: 100% Left</text>

    <!-- Item Pills -->
    <g transform="translate(20, 154)">
      <rect x="0" y="0" width="190" height="24" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="95" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Rhythm Guitars (L)</text>

      <rect x="0" y="32" width="190" height="24" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="95" y="48" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Synth Pads (L)</text>

      <rect x="0" y="64" width="190" height="24" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="95" y="80" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Stereo Reverb (L)</text>

      <rect x="0" y="96" width="190" height="24" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="95" y="112" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Drum Overheads (L)</text>
    </g>
  </g>

  <!-- 2. CENTER CARD (Dead Center) -->
  <g transform="translate(285, 60)">
    <rect width="230" height="315" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)" />
    
    <!-- Header Badge -->
    <g transform="translate(15, 14)">
      <rect width="200" height="26" rx="4" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1" />
      <text x="100" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">DEAD CENTER</text>
    </g>

    <!-- Pan Knob Display -->
    <g transform="translate(115, 82)">
      <circle cx="0" cy="0" r="28" fill="#0b1120" stroke="#10b981" stroke-width="2.5" />
      <line x1="0" y1="0" x2="0" y2="-24" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="4" fill="#34d399" />
    </g>
    <!-- Value badge -->
    <rect x="55" y="122" width="120" height="20" rx="3" fill="#0b1120" stroke="#10b981" stroke-width="0.8" />
    <text x="115" y="136" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Pan: Center (0%)</text>

    <!-- Item Pills -->
    <g transform="translate(20, 154)">
      <rect x="0" y="0" width="190" height="24" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="0.8" />
      <text x="95" y="16" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Lead Vocal</text>

      <rect x="0" y="32" width="190" height="24" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="0.8" />
      <text x="95" y="48" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Kick Drum</text>

      <rect x="0" y="64" width="190" height="24" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="0.8" />
      <text x="95" y="80" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Snare Drum</text>

      <rect x="0" y="96" width="190" height="24" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="0.8" />
      <text x="95" y="112" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Bass Guitar</text>
    </g>
  </g>

  <!-- 3. RIGHT CARD (Hard Right) -->
  <g transform="translate(540, 60)">
    <rect width="230" height="315" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1.4" filter="url(#shadow)" />
    
    <!-- Header Badge -->
    <g transform="translate(15, 14)">
      <rect width="200" height="26" rx="4" fill="#d97706" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1" />
      <text x="100" y="18" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">HARD RIGHT</text>
    </g>

    <!-- Pan Knob Display -->
    <g transform="translate(115, 82)">
      <circle cx="0" cy="0" r="28" fill="#0b1120" stroke="#f59e0b" stroke-width="2.5" />
      <line x1="0" y1="0" x2="20" y2="12" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />
      <circle cx="0" cy="0" r="4" fill="#fbbf24" />
    </g>
    <!-- Value badge -->
    <rect x="55" y="122" width="120" height="20" rx="3" fill="#0b1120" stroke="#f59e0b" stroke-width="0.8" />
    <text x="115" y="136" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Pan: 100% Right</text>

    <!-- Item Pills -->
    <g transform="translate(20, 154)">
      <rect x="0" y="0" width="190" height="24" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="95" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Rhythm Guitars (R)</text>

      <rect x="0" y="32" width="190" height="24" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="95" y="48" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Synth Pads (R)</text>

      <rect x="0" y="64" width="190" height="24" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="95" y="80" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Stereo Delay (R)</text>

      <rect x="0" y="96" width="190" height="24" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="95" y="112" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Percussion (R)</text>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 392)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="26" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="26" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="46" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Principle: LCR panning avoids muddy intermediate positions to maximize width and clarity.</text>
  </g>
</svg>