<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Header Badge -->
  <rect x="30" y="20" width="280" height="32" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
  <text x="170" y="41" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">GATE CHATTERING &amp; FLUTTER</text>
  <text x="325" y="41" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Why noise gates rapidly stutter on decaying instruments and how to fix it</text>

  <!-- Left Panel: The Cause (Single Threshold Flutter) -->
  <g transform="translate(30, 68)">
    <rect width="355" height="288" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Title Badge -->
    <rect x="16" y="16" width="145" height="24" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
    <text x="88" y="32" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">THE ISSUE: CHATTERING</text>
    <text x="175" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Single Threshold</text>

    <!-- Waveform Box -->
    <rect x="16" y="48" width="323" height="136" rx="6" fill="#0b1120" stroke="#1e293b" />

    <!-- Threshold Reference Line (Centered at y=112) -->
    <line x1="16" y1="112" x2="339" y2="112" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4" />
    <text x="333" y="106" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="end">THRESHOLD (-24 dB)</text>

    <!-- Center Line -->
    <line x1="16" y1="145" x2="339" y2="145" stroke="#334155" stroke-width="1" />

    <!-- Waveform: Decaying tom rings, oscillating up and down across threshold -->
    <path d="M 25,145 L 40,145 L 48,70 L 58,145 L 68,95 L 78,145 L 88,105 L 98,122 L 108,108 L 118,120 L 128,110 L 138,122 L 148,111 L 158,120 L 175,145 L 320,145" fill="none" stroke="#38bdf8" stroke-width="2.2" />

    <!-- Chattering Crossing Points highlighted -->
    <circle cx="88" cy="105" r="3" fill="#ef4444" />
    <circle cx="98" cy="122" r="3" fill="#ef4444" />
    <circle cx="108" cy="108" r="3" fill="#ef4444" />
    <circle cx="118" cy="120" r="3" fill="#ef4444" />
    <circle cx="128" cy="110" r="3" fill="#ef4444" />
    <circle cx="138" cy="122" r="3" fill="#ef4444" />

    <!-- Flutter Callout Box -->
    <rect x="180" y="60" width="145" height="34" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <text x="252" y="74" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">RAPID CHATTERING!</text>
    <text x="252" y="86" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Oscillates above &amp; below threshold</text>

    <!-- Rapid Chattering Gate State Bar -->
    <g transform="translate(16, 158)">
      <rect width="323" height="20" rx="3" fill="#0b1120" stroke="#1e293b" />
      <!-- Open -->
      <rect x="0" y="0" width="60" height="20" fill="#10b981" fill-opacity="0.3" />
      <text x="30" y="14" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">OPEN</text>
      <!-- Stutter pattern: Red/Green rapid stripes -->
      <rect x="60" y="0" width="16" height="20" fill="#ef4444" fill-opacity="0.3" />
      <rect x="76" y="0" width="16" height="20" fill="#10b981" fill-opacity="0.3" />
      <rect x="92" y="0" width="16" height="20" fill="#ef4444" fill-opacity="0.3" />
      <rect x="108" y="0" width="16" height="20" fill="#10b981" fill-opacity="0.3" />
      <rect x="124" y="0" width="16" height="20" fill="#ef4444" fill-opacity="0.3" />
      <rect x="140" y="0" width="16" height="20" fill="#10b981" fill-opacity="0.3" />
      <text x="108" y="14" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" text-anchor="middle">SHUT | OPEN | SHUT | OPEN | SHUT</text>
      <!-- Closed -->
      <rect x="156" y="0" width="167" height="20" fill="#ef4444" fill-opacity="0.2" />
      <text x="235" y="14" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">CLOSED</text>
    </g>

    <!-- Result Banner -->
    <rect x="16" y="194" width="323" height="42" rx="4" fill="#0f172a" stroke="#1e293b" />
    <text x="26" y="211" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">• Decaying wave repeatedly crosses threshold back &amp; forth</text>
    <text x="26" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">• Produces rapid machine-gun fluttering and harsh clicking distortion</text>

    <!-- Cause Tag -->
    <text x="177" y="258" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Primary Cause: <tspan fill="#f87171" font-weight="700">Audio fluctuates directly around threshold</tspan></text>
    <text x="177" y="272" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Occurs commonly on resonant floor toms, snares, and bass guitar</text>
  </g>

  <!-- Right Panel: The Fix (Hysteresis & Hold) -->
  <g transform="translate(415, 68)">
    <rect width="355" height="288" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    
    <!-- Title Badge -->
    <rect x="16" y="16" width="165" height="24" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="98" y="32" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">THE FIX: HYSTERESIS &amp; HOLD</text>
    <text x="195" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Dual Thresholds</text>

    <!-- Waveform Box -->
    <rect x="16" y="48" width="323" height="136" rx="6" fill="#0b1120" stroke="#1e293b" />

    <!-- Open Threshold (Higher line: -20 dB) -->
    <line x1="16" y1="100" x2="339" y2="100" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3" />
    <text x="22" y="94" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700">OPEN THRESHOLD (-20 dB)</text>

    <!-- Close Threshold (Lower line: -28 dB) -->
    <line x1="16" y1="126" x2="339" y2="126" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3" />
    <text x="333" y="122" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="end">CLOSE THRESHOLD (-28 dB)</text>

    <!-- Hysteresis Zone Shading between thresholds -->
    <rect x="16" y="100" width="323" height="26" fill="#f59e0b" fill-opacity="0.08" />
    <text x="22" y="117" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700">Hysteresis Buffer Zone (8 dB)</text>

    <!-- Center Line -->
    <line x1="16" y1="145" x2="339" y2="145" stroke="#334155" stroke-width="1" />

    <!-- Waveform: Identical decaying tom, smoothly sustains inside buffer zone -->
    <path d="M 25,145 L 40,145 L 48,70 L 58,145 L 68,95 L 78,145 L 88,105 L 98,122 L 108,108 L 118,120 L 128,110 L 138,122 L 148,111 L 158,120 L 175,138 L 195,145 L 320,145" fill="none" stroke="#38bdf8" stroke-width="2.2" />

    <!-- Success Callout Box -->
    <rect x="186" y="54" width="145" height="34" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="258" y="68" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">SMOOTH SUSTAIN!</text>
    <text x="258" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" text-anchor="middle">Decay stays inside hysteresis zone</text>

    <!-- Clean Gate State Bar -->
    <g transform="translate(16, 158)">
      <rect width="323" height="20" rx="3" fill="#0b1120" stroke="#1e293b" />
      <!-- Open -->
      <rect x="0" y="0" width="150" height="20" fill="#10b981" fill-opacity="0.3" />
      <text x="75" y="14" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">GATE STAYS 100% OPEN (NO FLUTTER)</text>
      <!-- Release -->
      <rect x="150" y="0" width="35" height="20" fill="#38bdf8" fill-opacity="0.3" />
      <text x="167" y="14" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">REL</text>
      <!-- Closed -->
      <rect x="185" y="0" width="138" height="20" fill="#475569" fill-opacity="0.2" />
      <text x="254" y="14" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">CLOSED</text>
    </g>

    <!-- Result Banner -->
    <rect x="16" y="194" width="323" height="42" rx="4" fill="#0f172a" stroke="#1e293b" />
    <text x="26" y="211" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">• Opens at -20 dB; only shuts after dropping below -28 dB</text>
    <text x="26" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">• Hold timer keeps gate open through minor dips, stopping stutter</text>

    <!-- Fix Tag -->
    <text x="177" y="258" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Solution: <tspan fill="#34d399" font-weight="700">Add Hysteresis or lengthen Hold time</tspan></text>
    <text x="177" y="272" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Allows the drum to ring naturally to silence without chatter</text>
  </g>

  <!-- Bottom Exam Summary Bar -->
  <g transform="translate(30, 374)">
    <rect width="740" height="66" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="36" cy="33" r="14" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" />
    <text x="36" y="38" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">i</text>
    
    <text x="64" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Edexcel Troubleshooting: How to Fix Gate Chattering</text>
    <text x="64" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Chattering happens when a decaying signal hovers at the threshold, causing the gate to rapidly open and close.</text>
    <text x="64" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Fix by: (1) Increasing Hysteresis to create a dual open/close window, (2) Extending Hold time, or (3) Lowering Threshold.</text>
  </g>
</svg>