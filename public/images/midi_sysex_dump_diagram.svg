<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="30" y="24" width="280" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="170" y="45" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">MIDI SYSEX vs STANDARD MIDI</text>
  <text x="330" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Why System Exclusive bulk patch dumps are substantially larger</text>

  <!-- LEFT CARD: Standard MIDI File -->
  <g transform="translate(50, 75)">
    <rect x="0" y="0" width="335" height="240" rx="8" fill="#0b1120" stroke="#0284c7" stroke-width="1.5" />
    <rect x="15" y="15" width="305" height="26" rx="4" fill="#0369a1" />
    <text x="167" y="32" fill="#e0f2fe" font-size="11" font-weight="700" text-anchor="middle">STANDARD MIDI (PERFORMANCE DATA)</text>

    <!-- File Size Pill -->
    <rect x="100" y="52" width="135" height="24" rx="12" fill="#0c4a6e" stroke="#38bdf8" />
    <text x="167" y="68" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle">SIZE: ~2 KB - 20 KB</text>

    <!-- What it contains -->
    <text x="25" y="102" fill="#f8fafc" font-size="11" font-weight="600">TRANSMITS PLAYBACK INSTRUCTIONS:</text>
    <text x="25" y="125" fill="#94a3b8" font-size="11">• Note-On / Note-Off (Pitches played)</text>
    <text x="25" y="145" fill="#94a3b8" font-size="11">• Note Velocity (Key strike intensity)</text>
    <text x="25" y="165" fill="#94a3b8" font-size="11">• Pitch Bend &amp; Mod Wheel (CC 1)</text>
    <text x="25" y="185" fill="#94a3b8" font-size="11">• Tempo &amp; Time Signature clock</text>

    <rect x="20" y="200" width="295" height="28" rx="4" fill="#1e293b" />
    <text x="167" y="218" fill="#cbd5e1" font-size="10" text-anchor="middle">Tiny text-like control codes (2-3 bytes each)</text>
  </g>

  <!-- RIGHT CARD: SysEx Dump File -->
  <g transform="translate(415, 75)">
    <rect x="0" y="0" width="335" height="240" rx="8" fill="#0b1120" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="15" y="15" width="305" height="26" rx="4" fill="#78350f" />
    <text x="167" y="32" fill="#fef3c7" font-size="11" font-weight="700" text-anchor="middle">SYSTEM EXCLUSIVE (SYSEX DUMP)</text>

    <!-- File Size Pill -->
    <rect x="90" y="52" width="155" height="24" rx="12" fill="#451a03" stroke="#f59e0b" />
    <text x="167" y="68" fill="#f59e0b" font-size="11" font-weight="800" text-anchor="middle">SIZE: 100 KB - 500+ KB</text>

    <!-- What it contains -->
    <text x="25" y="102" fill="#f8fafc" font-size="11" font-weight="600">TRANSMITS SYNTH ARCHITECTURE:</text>
    <text x="25" y="125" fill="#cbd5e1" font-size="11">• Full Patch Banks (128 presets)</text>
    <text x="25" y="145" fill="#cbd5e1" font-size="11">• Complete Filter Cutoff &amp; ADSR parameters</text>
    <text x="25" y="165" fill="#cbd5e1" font-size="11">• Custom Wavetables &amp; FM Operator routing</text>
    <text x="25" y="185" fill="#cbd5e1" font-size="11">• Manufacturer &amp; Hardware model hex IDs</text>

    <rect x="20" y="200" width="295" height="28" rx="4" fill="#1e293b" />
    <text x="167" y="218" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">Complete device memory backup image</text>
  </g>

  <!-- Footer Information Strip -->
  <rect x="50" y="330" width="700" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="70" y="354" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">UNDERSTANDING SYSEX IN MUSIC TECH:</text>
  <text x="70" y="374" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Standard MIDI only tells an instrument <strong style="fill:#38bdf8;">WHAT notes to play</strong> and how hard.</text>
  <text x="70" y="390" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">SysEx (System Exclusive) defines <strong style="fill:#f59e0b;">HOW the hardware synth generates the sound</strong>, holding entire patch libraries in RAM.</text>
</svg>
