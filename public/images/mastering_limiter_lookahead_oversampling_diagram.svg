<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(30, 16)">
    <rect width="270" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="135" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">LIMITER LOOKAHEAD &amp; OVERSAMPLING</text>
    <rect x="282" y="0" width="370" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="467" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DSP Transient Anticipation &amp; 4x Inter-Sample Detection</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left: Lookahead Buffer -->
    <g transform="translate(20, 20)">
      <rect width="335" height="275" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2" />
      <g transform="translate(15, 12)">
        <rect width="210" height="24" rx="4" fill="#0c4a6e" />
        <text x="105" y="16" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">1. LOOKAHEAD BUFFER (2 - 5 ms)</text>
      </g>

      <!-- Lookahead Delay Buffer Diagram -->
      <g transform="translate(15, 48)">
        <rect width="305" height="120" rx="4" fill="#0f172a" stroke="#1e293b" />
        <!-- Audio delayed path -->
        <line x1="20" y1="40" x2="160" y2="40" stroke="#38bdf8" stroke-width="2" />
        <g transform="translate(60, 28)">
          <rect width="80" height="24" rx="3" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
          <text x="40" y="16" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">DELAY BUFFER</text>
        </g>
        <line x1="160" y1="40" x2="280" y2="40" stroke="#38bdf8" stroke-width="2" />

        <!-- Sidechain detector anticipating peak -->
        <path d="M 40,40 L 40,85 L 220,85 L 220,45" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3 2" />
        <g transform="translate(80, 75)">
          <rect width="120" height="20" rx="2" fill="#451a03" stroke="#f59e0b" stroke-width="0.8" />
          <text x="60" y="14" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">PEAK DETECTOR ADVANCE</text>
        </g>
      </g>

      <g transform="translate(15, 180)">
        <rect width="305" height="80" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
        <text x="12" y="22" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Zero Distortion Attack Curves</text>
        <text x="12" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Delays audio signal by a few milliseconds</text>
        <text x="12" y="56" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Detector ramps down gain smoothly before peak arrives</text>
        <text x="12" y="70" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="8.5">• Eliminates clicks, pops, and brickwall edge buzz</text>
      </g>
    </g>

    <!-- Right: 4x / 8x Oversampling -->
    <g transform="translate(385, 20)">
      <rect width="335" height="275" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
      <g transform="translate(15, 12)">
        <rect width="210" height="24" rx="4" fill="#064e3b" />
        <text x="105" y="16" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">2. 4x / 8x OVERSAMPLING</text>
      </g>

      <!-- Oversampling Visual Dots -->
      <g transform="translate(15, 48)">
        <rect width="305" height="120" rx="4" fill="#0f172a" stroke="#1e293b" />
        <!-- Baseline & Ceiling -->
        <line x1="15" y1="35" x2="290" y2="35" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2 2" />
        <g transform="translate(15, 15)">
          <rect width="90" height="16" rx="2" fill="#450a0a" />
          <text x="45" y="11" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">TRUE CEILING</text>
        </g>

        <!-- Interpolated 4x dense samples catching peak -->
        <path d="M 25,85 Q 150,30 280,85" fill="none" stroke="#10b981" stroke-width="2.2" />
        <!-- Standard 1x sample dots -->
        <circle cx="50" cy="75" r="3.5" fill="#38bdf8" />
        <circle cx="250" cy="75" r="3.5" fill="#38bdf8" />
        <!-- 4x oversampled extra dots exposing the peak! -->
        <circle cx="100" cy="50" r="3" fill="#10b981" />
        <circle cx="150" cy="35" r="4.5" fill="#10b981" />
        <circle cx="200" cy="50" r="3" fill="#10b981" />

        <g transform="translate(130, 80)">
          <rect width="150" height="22" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
          <text x="75" y="15" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="900" text-anchor="middle">4x SAMPLES CATCH PEAK</text>
        </g>
      </g>

      <g transform="translate(15, 180)">
        <rect width="305" height="80" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
        <text x="12" y="22" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">True Peak Clamping Precision</text>
        <text x="12" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Upsamples internal audio stream by 4x to 8x</text>
        <text x="12" y="56" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Calculates inter-sample curve between audio dots</text>
        <text x="12" y="70" fill="#a7f3d0" font-family="-apple-system, sans-serif" font-size="8.5">• Clamps overshoots before they reach D/A converter</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 12)">
      <rect width="75" height="20" rx="3" fill="#0284c7" />
      <text x="37" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="98" y="27" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Lookahead allows smooth transient reduction; oversampling catches inter-sample peaks before D/A export.</text>
  </g>
</svg>
