<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(30, 16)">
    <rect width="260" height="32" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.2" />
    <text x="130" y="21" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">BAXANDALL SHELVING EQ</text>
    <rect x="272" y="0" width="370" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="457" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ultra-Wide Musical Slope with Zero Resonant Overshoot</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Frequency Response Graph Comparison -->
    <g transform="translate(20, 20)">
      <rect width="700" height="185" rx="6" fill="#0b1120" stroke="#1e293b" />
      <!-- Baseline 0 dB -->
      <line x1="30" y1="120" x2="670" y2="120" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3" />
      <g transform="translate(30, 110)">
        <rect width="45" height="18" rx="2" fill="#0f172a" stroke="#334155" />
        <text x="22" y="13" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">0 dB</text>
      </g>

      <!-- Standard Digital Resonant Shelf (Red dotted curve with overshoot dip and peak) -->
      <path d="M 80,120 L 350,120 C 420,125 460,135 500,75 C 520,40 550,55 640,55" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 2" />
      <g transform="translate(480, 25)">
        <rect width="170" height="20" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
        <text x="85" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">STANDARD SHELF (RESONANT DIP)</text>
      </g>

      <!-- Baxandall Curve: Ultra-gentle natural S-curve arching gracefully over octaves -->
      <path d="M 80,120 C 220,120 380,110 460,85 C 540,60 600,45 640,45" fill="none" stroke="#fbbf24" stroke-width="3.5" />
      <g transform="translate(260, 60)">
        <rect width="180" height="22" rx="3" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
        <text x="90" y="15" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">BAXANDALL GENTLE 'AIR' CURVE</text>
      </g>

      <!-- Frequency markers -->
      <g transform="translate(40, 155)">
        <g transform="translate(40, 0)">
          <rect width="45" height="18" rx="2" fill="#0f172a" stroke="#334155" />
          <text x="22" y="13" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">100 Hz</text>
        </g>
        <g transform="translate(180, 0)">
          <rect width="45" height="18" rx="2" fill="#0f172a" stroke="#334155" />
          <text x="22" y="13" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">1 kHz</text>
        </g>
        <g transform="translate(360, 0)">
          <rect width="45" height="18" rx="2" fill="#0f172a" stroke="#334155" />
          <text x="22" y="13" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5" text-anchor="middle">5 kHz</text>
        </g>
        <g transform="translate(540, 0)">
          <rect width="50" height="18" rx="2" fill="#0f172a" stroke="#f59e0b" />
          <text x="25" y="13" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">12 kHz</text>
        </g>
      </g>
    </g>

    <!-- Bottom 2 Explanatory Cards -->
    <g transform="translate(20, 215)">
      <!-- Standard Shelf Card -->
      <g transform="translate(0, 0)">
        <rect width="340" height="80" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1" />
        <g transform="translate(12, 10)">
          <rect width="170" height="20" rx="3" fill="#450a0a" />
          <text x="85" y="14" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">STANDARD PARAMETRIC SHELF</text>
        </g>
        <text x="12" y="48" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">Steep slope creates phase shift near cutoff</text>
        <text x="12" y="66" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9">Can sound harsh, pinched, or metallic on top end</text>
      </g>

      <!-- Baxandall Card -->
      <g transform="translate(360, 0)">
        <rect width="340" height="80" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.2" />
        <g transform="translate(12, 10)">
          <rect width="180" height="20" rx="3" fill="#064e3b" />
          <text x="90" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">BAXANDALL MASTERING POLISH</text>
        </g>
        <text x="12" y="48" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">Ultra-broad slope extends across entire octaves</text>
        <text x="12" y="66" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9">Adds silky smooth sheen and warm weight naturally</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 12)">
      <rect width="75" height="20" rx="3" fill="#0284c7" />
      <text x="37" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="98" y="27" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Baxandall shelving uses a wide, non-resonant slope to add natural top-end air without phase harshness.</text>
  </g>
</svg>
