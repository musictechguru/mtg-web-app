<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Title Badge -->
  <rect x="30" y="24" width="230" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="145" y="45" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">SAMPLE RATE (Hz / kHz)</text>

  <text x="280" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Number of discrete amplitude snapshots captured per second</text>

  <!-- Main Chart Canvas Area -->
  <rect x="70" y="75" width="680" height="250" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid Lines -->
  <line x1="70" y1="137" x2="750" y2="137" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
  <line x1="70" y1="200" x2="750" y2="200" stroke="#334155" stroke-width="1.5" />
  <line x1="70" y1="262" x2="750" y2="262" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Axis Labels -->
  <text x="60" y="85" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">+1.0V</text>
  <text x="60" y="204" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">0.0V</text>
  <text x="60" y="323" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">-1.0V</text>
  <text x="25" y="200" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" transform="rotate(-90 25 200)">AMPLITUDE (VOLTAGE)</text>

  <!-- Sampling Vertical Lines (Regular Sampling Interval Ts) -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="2,2">
    <line x1="110" y1="75" x2="110" y2="325" />
    <line x1="150" y1="75" x2="150" y2="325" />
    <line x1="190" y1="75" x2="190" y2="325" />
    <line x1="230" y1="75" x2="230" y2="325" />
    <line x1="270" y1="75" x2="270" y2="325" />
    <line x1="310" y1="75" x2="310" y2="325" />
    <line x1="350" y1="75" x2="350" y2="325" />
    <line x1="390" y1="75" x2="390" y2="325" />
    <line x1="430" y1="75" x2="430" y2="325" />
    <line x1="470" y1="75" x2="470" y2="325" />
    <line x1="510" y1="75" x2="510" y2="325" />
    <line x1="550" y1="75" x2="550" y2="325" />
    <line x1="590" y1="75" x2="590" y2="325" />
    <line x1="630" y1="75" x2="630" y2="325" />
    <line x1="670" y1="75" x2="670" y2="325" />
    <line x1="710" y1="75" x2="710" y2="325" />
  </g>

  <!-- Smooth Continuous Analog Waveform -->
  <path d="M 70,200 C 120,80 180,80 230,200 C 280,320 340,320 390,200 C 440,80 500,80 550,200 C 600,320 660,320 710,200 C 730,150 740,170 750,200" 
        fill="none" stroke="url(#waveGrad)" stroke-width="3.5" filter="url(#glow)" />

  <!-- Sample Points (Intersection of vertical sampling time and wave) -->
  <g fill="#22c55e" stroke="#ffffff" stroke-width="2">
    <circle cx="110" cy="130" r="5" />
    <circle cx="150" cy="95" r="5" />
    <circle cx="190" cy="130" r="5" />
    <circle cx="230" cy="200" r="5" />
    <circle cx="270" cy="270" r="5" />
    <circle cx="310" cy="305" r="5" />
    <circle cx="350" cy="270" r="5" />
    <circle cx="390" cy="200" r="5" />
    <circle cx="430" cy="130" r="5" />
    <circle cx="470" cy="95" r="5" />
    <circle cx="510" cy="130" r="5" />
    <circle cx="550" cy="200" r="5" />
    <circle cx="590" cy="270" r="5" />
    <circle cx="630" cy="305" r="5" />
    <circle cx="670" cy="270" r="5" />
    <circle cx="710" cy="200" r="5" />
  </g>

  <!-- Sampling Interval Indicator (Ts) at top with clear pill background -->
  <g transform="translate(0, 0)">
    <rect x="238" y="86" width="180" height="24" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <line x1="270" y1="120" x2="310" y2="120" stroke="#f59e0b" stroke-width="2" />
    <line x1="270" y1="115" x2="270" y2="125" stroke="#f59e0b" stroke-width="2" />
    <line x1="310" y1="115" x2="310" y2="125" stroke="#f59e0b" stroke-width="2" />
    <text x="328" y="102" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Sample Interval (Ts = 1/fs)</text>
  </g>

  <!-- Legend & Information Bar -->
  <rect x="70" y="342" width="680" height="58" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />

  <!-- Legend Item 1: Analog Wave -->
  <line x1="90" y1="362" x2="120" y2="362" stroke="#38bdf8" stroke-width="3" />
  <text x="130" y="366" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Continuous Analog Wave</text>
  <text x="130" y="382" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Infinite temporal resolution</text>

  <!-- Legend Item 2: Sample Point -->
  <circle cx="345" cy="362" r="5" fill="#22c55e" stroke="#ffffff" stroke-width="1.5" />
  <text x="360" y="366" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Discrete Sample Point</text>
  <text x="360" y="382" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Amplitude frozen at exact time</text>

  <!-- Legend Item 3: Formula / Standard -->
  <rect x="545" y="350" width="190" height="42" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" />
  <text x="640" y="366" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STANDARD RATES</text>
  <text x="640" y="383" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">44.1 kHz (CD) • 48 kHz (Video)</text>
</svg>
