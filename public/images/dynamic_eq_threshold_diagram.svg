<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDyn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Dynamic Cut Fill -->
    <linearGradient id="dynCutFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" rx="14" fill="url(#bgDyn)" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="160" height="24" rx="6" fill="#831843" fill-opacity="0.4" stroke="#ec4899" stroke-width="1.2" />
    <text x="80" y="16" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ADVANCED PROCESSING</text>
    
    <text x="175" y="18" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">Dynamic EQ (Threshold-Dependent Processing)</text>
    <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Unlike static EQ which applies fixed gain, Dynamic EQ only cuts or boosts when audio energy crosses a set threshold.
    </text>
  </g>

  <!-- Analyzer Viewport (X: 70 to 810, Y: 80 to 395, Width: 740, Height: 315) -->
  <rect x="70" y="80" width="740" height="315" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Gain Grid -->
  <!-- 0 dB Flat line -->
  <line x1="70" y1="160" x2="810" y2="160" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" />
  <text x="62" y="164" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">0 dB</text>
  <text x="795" y="152" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="end">Resting Response (Below Threshold)</text>

  <!-- -6 dB Cut Target -->
  <line x1="70" y1="245" x2="810" y2="245" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />
  <text x="62" y="249" fill="#ec4899" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">-6 dB</text>
  <text x="795" y="240" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="10" text-anchor="end">Active Cut Depth (Signal Over Threshold)</text>

  <!-- -12 dB -->
  <line x1="70" y1="330" x2="810" y2="330" stroke="#1e293b" stroke-width="1" />
  <text x="62" y="334" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">-12 dB</text>

  <!-- Frequency Grid -->
  <line x1="200" y1="80" x2="200" y2="395" stroke="#1e293b" stroke-width="1" />
  <text x="200" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">200 Hz</text>

  <line x1="380" y1="80" x2="380" y2="395" stroke="#1e293b" stroke-width="1" />
  <text x="380" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">1 kHz</text>

  <line x1="580" y1="80" x2="580" y2="395" stroke="#ec4899" stroke-width="1.8" stroke-dasharray="4 3" stroke-opacity="0.7" />
  <text x="580" y="415" fill="#f472b6" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">fc = 4 kHz (Harsh Sibilance)</text>

  <line x1="740" y1="80" x2="740" y2="395" stroke="#1e293b" stroke-width="1" />
  <text x="740" y="415" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">10 kHz</text>

  <!-- Resting Flat Response Line -->
  <path d="M 70,160 L 810,160" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" stroke-opacity="0.6" />

  <!-- DYNAMIC CUT CURVE (Triggered at 4 kHz) -->
  <path d="M 480,160 
           C 530,160 560,245 580,245 
           C 600,245 630,160 680,160 
           Z" 
        fill="url(#dynCutFill)" />

  <path d="M 70,160 
           L 480,160 
           C 530,160 560,245 580,245 
           C 600,245 630,160 680,160 
           L 810,160" 
        fill="none" stroke="#ec4899" stroke-width="3.5" filter="url(#glowPink)" />

  <circle cx="580" cy="245" r="6" fill="#ec4899" stroke="#ffffff" stroke-width="2" />

  <!-- Animated Dynamic Arrow indicating motion -->
  <line x1="580" y1="168" x2="580" y2="232" stroke="#fbcfe8" stroke-width="2.5" stroke-dasharray="3 2" />
  <polygon points="575,232 580,242 585,232" fill="#fbcfe8" />

  <!-- Threshold Detector Box (Left) -->
  <g transform="translate(100, 100)">
    <rect width="220" height="95" rx="6" fill="#1e1e2e" fill-opacity="0.9" stroke="#64748b" stroke-width="1.2" />
    <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">STATIC PARAMETRIC EQ</text>
    <text x="14" y="42" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">• Constant, permanent gain cut</text>
    <text x="14" y="60" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">• Cuts frequencies 100% of the time</text>
    <text x="14" y="78" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="10.5">• Con: Thins vocal even on quiet words</text>
  </g>

  <!-- Dynamic Threshold Box (Right) -->
  <g transform="translate(560, 265)">
    <rect width="230" height="95" rx="6" fill="#500724" fill-opacity="0.9" stroke="#ec4899" stroke-width="1.5" />
    <text x="14" y="22" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">DYNAMIC EQ PROCESSING</text>
    <text x="14" y="42" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">• Threshold-dependent attenuation</text>
    <text x="14" y="60" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">• Only cuts when singer sings harsh 'S'</text>
    <text x="14" y="78" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10.5">• Pro: Leaves vocal natural and full</text>
  </g>

  <!-- Bottom Panel -->
  <g transform="translate(50, 424)">
    <rect width="780" height="80" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.2" />

    <text x="20" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">The Power of Dynamic EQ in Audio Mixing:</text>
    <text x="20" y="44" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      • Combines the frequency selectivity of a parametric equalizer with the threshold-dependent responsiveness of an audio compressor.
    </text>
    <text x="20" y="64" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      • Ideal for taming intermittent vocal sibilance, acoustic guitar string squeaks, and acoustic kick/bass masking without gutting natural tone.
    </text>
  </g>
</svg>
