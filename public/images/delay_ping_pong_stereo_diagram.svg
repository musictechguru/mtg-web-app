<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">PING-PONG STEREO DELAY</text>
    <rect x="262" y="0" width="310" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="417" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Alternating Stereo Repeat Bounces</text>
  </g>

  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#shadow)" />
    
    <!-- Stereo Soundstage Bouncing Trajectory -->
    <!-- Left Speaker Column -->
    <g transform="translate(60, 40)">
      <rect width="160" height="230" rx="6" fill="#0b1120" stroke="#0ea5e9" stroke-width="1.5" />
      <g transform="translate(15, 12)">
        <rect width="130" height="24" rx="4" fill="#0284c7" />
        <text x="65" y="16" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">LEFT CHANNEL</text>
      </g>
      <!-- Left Repeats -->
      <g transform="translate(20, 60)">
        <rect width="120" height="32" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="60" y="20" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Repeat 1 (250 ms)</text>
      </g>
      <g transform="translate(20, 140)">
        <rect width="120" height="32" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="60" y="20" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Repeat 3 (750 ms)</text>
      </g>
    </g>

    <!-- Center Cross-Feedback Bounce Arrows -->
    <path d="M 230,115 C 370,115 370,165 510,165" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5 3" />
    <polygon points="510,165 500,160 500,170" fill="#fbbf24" />

    <path d="M 510,185 C 370,185 370,215 230,215" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5 3" />
    <polygon points="230,215 240,210 240,220" fill="#fbbf24" />

    <!-- Center Icon / Indicator -->
    <g transform="translate(310, 120)">
      <rect width="120" height="45" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
      <text x="60" y="22" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle">CROSS FEEDBACK</text>
      <text x="60" y="37" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">L -> R -> L -> R</text>
    </g>

    <!-- Right Speaker Column -->
    <g transform="translate(520, 40)">
      <rect width="160" height="230" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1.5" />
      <g transform="translate(15, 12)">
        <rect width="130" height="24" rx="4" fill="#059669" />
        <text x="65" y="16" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">RIGHT CHANNEL</text>
      </g>
      <!-- Right Repeats -->
      <g transform="translate(20, 100)">
        <rect width="120" height="32" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
        <text x="60" y="20" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Repeat 2 (500 ms)</text>
      </g>
      <g transform="translate(20, 180)">
        <rect width="120" height="32" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
        <text x="60" y="20" fill="#34d399" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Repeat 4 (1000 ms)</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="24" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="44" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Spatial Routing: Ping-pong delay alternates successive echo repeats between the Left and Right channels.</text>
  </g>
</svg>