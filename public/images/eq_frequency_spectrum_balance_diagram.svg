<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Zone Gradients -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="bassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="lowMidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="highMidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="presenceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="airGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" rx="14" fill="url(#bgGrad3)" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <text x="65" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">AUDIO THEORY</text>
    
    <text x="145" y="18" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">Equalization (EQ) &amp; The Audible Frequency Spectrum</text>
    <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Human hearing spans 20 Hz to 20,000 Hz (20 kHz). EQ balances relative amplitude across these frequency bands.
    </text>
  </g>

  <!-- Spectrum Display (X: 50 to 830, Width: 780, Y: 85 to 395, Height: 310) -->
  <rect x="50" y="85" width="780" height="310" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Frequency Bands Columns -->
  <!-- 1. Sub Bass (20 - 60 Hz) X: 50 to 160 (110px) -->
  <rect x="50" y="85" width="110" height="265" fill="url(#subGrad)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4" />
  <text x="105" y="115" fill="#c4b5fd" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SUB-BASS</text>
  <text x="105" y="135" fill="#a78bfa" font-family="monospace" font-size="11" text-anchor="middle">20 - 60 Hz</text>
  <text x="105" y="170" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Felt rather</text>
  <text x="105" y="186" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">than heard</text>
  <text x="105" y="220" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">• Kick weight</text>
  <text x="105" y="236" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">• Sub synths</text>

  <!-- 2. Bass (60 - 250 Hz) X: 160 to 290 (130px) -->
  <rect x="160" y="85" width="130" height="265" fill="url(#bassGrad)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4" />
  <text x="225" y="115" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">BASS</text>
  <text x="225" y="135" fill="#60a5fa" font-family="monospace" font-size="11" text-anchor="middle">60 - 250 Hz</text>
  <text x="225" y="170" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Warmth &amp;</text>
  <text x="225" y="186" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Fullness</text>
  <text x="225" y="220" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">• Bass guitar</text>
  <text x="225" y="236" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">• Kick punch</text>

  <!-- 3. Low Mids (250 Hz - 1 kHz) X: 290 to 440 (150px) -->
  <rect x="290" y="85" width="150" height="265" fill="url(#lowMidGrad)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
  <text x="365" y="115" fill="#67e8f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">LOW MIDS</text>
  <text x="365" y="135" fill="#22d3ee" font-family="monospace" font-size="11" text-anchor="middle">250 - 1000 Hz</text>
  <text x="365" y="170" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Body &amp; Clarity</text>
  <text x="365" y="186" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Risk: Boxy / Mud</text>
  <text x="365" y="220" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">• Vocal body</text>
  <text x="365" y="236" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">• Snare body</text>

  <!-- 4. High Mids (1 kHz - 4 kHz) X: 440 to 570 (130px) -->
  <rect x="440" y="85" width="130" height="265" fill="url(#highMidGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
  <text x="505" y="115" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">HIGH MIDS</text>
  <text x="505" y="135" fill="#34d399" font-family="monospace" font-size="11" text-anchor="middle">1 - 4 kHz</text>
  <text x="505" y="170" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Speech Clarity</text>
  <text x="505" y="186" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">&amp; Intelligibility</text>
  <text x="505" y="220" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">• Vocal presence</text>
  <text x="505" y="236" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">• Guitar bite</text>

  <!-- 5. Presence (4 kHz - 10 kHz) X: 570 to 700 (130px) -->
  <rect x="570" y="85" width="130" height="265" fill="url(#presenceGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
  <text x="635" y="115" fill="#fde68a" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PRESENCE</text>
  <text x="635" y="135" fill="#fbbf24" font-family="monospace" font-size="11" text-anchor="middle">4 - 10 kHz</text>
  <text x="635" y="170" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Definition &amp;</text>
  <text x="635" y="186" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Sibilance ('S', 'T')</text>
  <text x="635" y="220" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">• Cymbal crash</text>
  <text x="635" y="236" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">• Acoustic string</text>

  <!-- 6. Air (10 kHz - 20 kHz) X: 700 to 830 (130px) -->
  <rect x="700" y="85" width="130" height="265" fill="url(#airGrad)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4" />
  <text x="765" y="115" fill="#fbcfe8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">AIR</text>
  <text x="765" y="135" fill="#f472b6" font-family="monospace" font-size="11" text-anchor="middle">10 - 20 kHz</text>
  <text x="765" y="170" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">Breath, Sheen,</text>
  <text x="765" y="186" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">&amp; Dimension</text>
  <text x="765" y="220" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">• Vocal breath</text>
  <text x="765" y="236" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">• Hi-hat sizzle</text>

  <!-- Horizontal Curve Line showing EQ adjusting bands -->
  <path d="M 50,300 
           C 120,300 180,270 240,270 
           C 300,270 340,325 380,325 
           C 420,325 480,260 520,260 
           C 570,260 620,290 680,290 
           C 740,290 780,240 830,240" 
        fill="none" stroke="#38bdf8" stroke-width="3" />

  <!-- Bottom Frequency Axis Strip -->
  <rect x="50" y="350" width="780" height="45" fill="#1e293b" />
  <text x="60" y="378" fill="#94a3b8" font-family="monospace" font-size="11">20 Hz</text>
  <text x="160" y="378" fill="#94a3b8" font-family="monospace" font-size="11">60 Hz</text>
  <text x="290" y="378" fill="#94a3b8" font-family="monospace" font-size="11">250 Hz</text>
  <text x="440" y="378" fill="#94a3b8" font-family="monospace" font-size="11">1 kHz</text>
  <text x="570" y="378" fill="#94a3b8" font-family="monospace" font-size="11">4 kHz</text>
  <text x="700" y="378" fill="#94a3b8" font-family="monospace" font-size="11">10 kHz</text>
  <text x="820" y="378" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">20 kHz</text>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(50, 420)">
    <rect width="780" height="75" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1.2" />
    <text x="20" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">What does an Equalizer (EQ) do?</text>
    <text x="20" y="48" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      An equalizer acts as frequency-specific volume controls. By boosting (amplifying) or cutting (attenuating) chosen bands,
    </text>
    <text x="20" y="66" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      the engineer balances warmth, eliminates unwanted boxiness, highlights clarity, and creates space for all instruments in the mix.
    </text>
  </g>
</svg>
