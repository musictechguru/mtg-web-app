<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(30, 16)">
    <rect width="260" height="32" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.2" />
    <text x="130" y="21" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">INTER-SAMPLE TRUE PEAKS</text>
    <rect x="272" y="0" width="380" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="462" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Discrete Sample Points vs Continuous D/A Analog Overshoot</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Waveform & Reconstruction Plot -->
    <g transform="translate(20, 20)">
      <rect width="700" height="185" rx="6" fill="#0b1120" stroke="#1e293b" />

      <!-- 0 dBFS Digital Ceiling Line -->
      <line x1="30" y1="80" x2="670" y2="80" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2" />
      <g transform="translate(30, 60)">
        <rect width="130" height="18" rx="2" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
        <text x="65" y="13" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">0 dBFS DIGITAL CEILING</text>
      </g>

      <!-- Center baseline -->
      <line x1="30" y1="140" x2="670" y2="140" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />

      <!-- Discrete Sample Stems & Dots (Staying just below 0 dBFS at y=85) -->
      <!-- Sample 1 -->
      <line x1="160" y1="140" x2="160" y2="105" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="160" cy="105" r="4" fill="#38bdf8" />
      <!-- Sample 2 -->
      <line x1="260" y1="140" x2="260" y2="86" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="260" cy="86" r="5" fill="#38bdf8" />
      <!-- Sample 3 -->
      <line x1="360" y1="140" x2="360" y2="85" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="360" cy="85" r="5" fill="#38bdf8" />
      <!-- Sample 4 -->
      <line x1="460" y1="140" x2="460" y2="110" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="460" cy="110" r="4" fill="#38bdf8" />
      <!-- Sample 5 -->
      <line x1="560" y1="140" x2="560" y2="135" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="560" cy="135" r="4" fill="#38bdf8" />

      <!-- Continuous D/A Reconstructed Analog Wave (Interpolated curve arching above ceiling to y=45) -->
      <path d="M 60,140 C 120,140 180,110 260,86 C 310,40 310,40 360,85 C 420,105 480,125 560,135 C 600,140 640,140 670,140" fill="none" stroke="#f43f5e" stroke-width="3.5" />

      <!-- Shaded Intersample Clipping Zone -->
      <path d="M 270,80 Q 310,40 350,80 Z" fill="#ef4444" fill-opacity="0.35" />

      <!-- Sample Dot Badge -->
      <g transform="translate(195, 105)">
        <rect width="130" height="22" rx="3" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
        <text x="65" y="15" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">Sample Points: -0.1 dBFS</text>
      </g>

      <!-- True Peak Overshoot Badge -->
      <g transform="translate(370, 30)">
        <rect width="180" height="26" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="1.2" />
        <text x="90" y="17" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="9" font-weight="900" text-anchor="middle">ANALOG CLIPPING (+1.5 dBTP)</text>
      </g>

      <!-- D/A Arrow -->
      <line x1="330" y1="45" x2="365" y2="43" stroke="#f87171" stroke-width="1.5" />
    </g>

    <!-- Bottom 2 Meter Comparisons -->
    <g transform="translate(20, 215)">
      <!-- Meter 1: Sample Peak Meter -->
      <g transform="translate(0, 0)">
        <rect width="340" height="80" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1" />
        <g transform="translate(12, 10)">
          <rect width="160" height="20" rx="3" fill="#0c4a6e" />
          <text x="80" y="14" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">STANDARD SAMPLE METER</text>
        </g>
        <g transform="translate(180, 10)">
          <rect width="70" height="20" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
          <text x="35" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">-0.1 dBFS</text>
        </g>
        <g transform="translate(258, 10)">
          <rect width="70" height="20" rx="3" fill="#064e3b" />
          <text x="35" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">NO CLIP</text>
        </g>
        <text x="12" y="48" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">Only measures discrete digital numbers</text>
        <text x="12" y="66" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9">Blind to curved inter-sample overshoots</text>
      </g>

      <!-- Meter 2: True Peak Meter -->
      <g transform="translate(360, 0)">
        <rect width="340" height="80" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1.2" />
        <g transform="translate(12, 10)">
          <rect width="160" height="20" rx="3" fill="#450a0a" />
          <text x="80" y="14" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">TRUE PEAK (4x OVERSAMPLED)</text>
        </g>
        <g transform="translate(180, 10)">
          <rect width="70" height="20" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
          <text x="35" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">+1.5 dBTP</text>
        </g>
        <g transform="translate(258, 10)">
          <rect width="70" height="20" rx="3" fill="#450a0a" />
          <text x="35" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CLIPPING!</text>
        </g>
        <text x="12" y="48" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600">Reconstructs analog waveform in DSP</text>
        <text x="12" y="66" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9">Exposes converter clipping before export</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 12)">
      <rect width="75" height="20" rx="3" fill="#0284c7" />
      <text x="37" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="98" y="27" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">D/A reconstruction creates inter-sample peaks; true peak limiters prevent resulting analog clipping.</text>
  </g>
</svg>
