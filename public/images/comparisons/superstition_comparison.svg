<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.95)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
    <linearGradient id="cardBGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.95)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" fill="url(#bgGrad)" rx="14" />
  <rect x="1" y="1" width="898" height="358" fill="none" stroke="#334155" stroke-width="1.5" rx="13" />

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">SUPERSTITION: STEVIE WONDER VS STEVIE RAY VAUGHAN</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Edexcel Component 3 Question 5 Comparative Analysis</text>

  <!-- Version A Card -->
  <g transform="translate(30, 75)">
    <rect width="400" height="255" fill="url(#cardAGrad)" rx="10" stroke="#eab308" stroke-width="2" />
    <rect x="15" y="15" width="80" height="24" rx="4" fill="#eab308" />
    <text x="55" y="31" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="800">VERSION A</text>
    <text x="385" y="32" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">1972</text>

    <text x="20" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Stevie Wonder</text>
    <text x="20" y="88" fill="#eab308" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CLASSIC FUNK / PROGRESSIVE SOUL</text>

    <line x1="20" y1="102" x2="380" y2="102" stroke="#334155" stroke-width="1" />

    <!-- Tech specs -->
    <text x="20" y="125" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Key Production Signatures:</text>
    <text x="32" y="148" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Multi-tracked Hohner Clavinet D6 (8 layers)</text>
    <text x="32" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• TONTO modular synthesizer bassline</text>
    <text x="32" y="192" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Syncopated live funk drum groove played by Stevie</text>
    <text x="32" y="214" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Tape saturation with open, warm midrange</text>
  </g>

  <!-- VS Badge -->
  <circle cx="450" cy="202" r="22" fill="#0f172a" stroke="#64748b" stroke-width="2" />
  <text x="450" y="208" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="900">VS</text>

  <!-- Version B Card -->
  <g transform="translate(470, 75)">
    <rect width="400" height="255" fill="url(#cardBGrad)" rx="10" stroke="#6366f1" stroke-width="2" />
    <rect x="15" y="15" width="80" height="24" rx="4" fill="#6366f1" />
    <text x="55" y="31" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="800">VERSION B</text>
    <text x="385" y="32" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">1986</text>

    <text x="20" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Stevie Ray Vaughan</text>
    <text x="20" y="88" fill="#6366f1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TEXAS BLUES / BLUES ROCK</text>

    <line x1="20" y1="102" x2="380" y2="102" stroke="#334155" stroke-width="1" />

    <!-- Tech specs -->
    <text x="20" y="125" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Key Production Signatures:</text>
    <text x="32" y="148" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Overdriven Fender Stratocaster through tube amps</text>
    <text x="32" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Electric bass guitar playing doubled blues riff</text>
    <text x="32" y="192" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Live power trio capture with room mics</text>
    <text x="32" y="214" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Aggressive guitar transient attack & tube clipping</text>
  </g>
</svg>