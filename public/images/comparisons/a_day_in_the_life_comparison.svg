<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.95)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
    <linearGradient id="cardBGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.95)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" fill="url(#bgGrad)" rx="14" />
  <rect x="1" y="1" width="898" height="358" fill="none" stroke="#334155" stroke-width="1.5" rx="13" />

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">A DAY IN THE LIFE: THE BEATLES VS JEFF BECK</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Edexcel Component 3 Question 5 Comparative Analysis</text>

  <!-- Version A Card -->
  <g transform="translate(30, 75)">
    <rect width="400" height="255" fill="url(#cardAGrad)" rx="10" stroke="#3b82f6" stroke-width="2" />
    <rect x="15" y="15" width="80" height="24" rx="4" fill="#3b82f6" />
    <text x="55" y="31" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="800">VERSION A</text>
    <text x="385" y="32" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">1967</text>

    <text x="20" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">The Beatles</text>
    <text x="20" y="88" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PSYCHEDELIC ROCK / STUDIO ART</text>

    <line x1="20" y1="102" x2="380" y2="102" stroke="#334155" stroke-width="1" />

    <!-- Tech specs -->
    <text x="20" y="125" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Key Production Signatures:</text>
    <text x="32" y="148" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• 4-track tape recording at Abbey Road Studio 2</text>
    <text x="32" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Extreme hard L/R panning for mono compatibility</text>
    <text x="32" y="192" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Artificial Double Tracking (ADT) on vocals</text>
    <text x="32" y="214" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• 24-bar orchestral crescendo with manual faders</text>
  </g>

  <!-- VS Badge -->
  <circle cx="450" cy="202" r="22" fill="#0f172a" stroke="#64748b" stroke-width="2" />
  <text x="450" y="208" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="900">VS</text>

  <!-- Version B Card -->
  <g transform="translate(470, 75)">
    <rect width="400" height="255" fill="url(#cardBGrad)" rx="10" stroke="#ec4899" stroke-width="2" />
    <rect x="15" y="15" width="80" height="24" rx="4" fill="#ec4899" />
    <text x="55" y="31" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="800">VERSION B</text>
    <text x="385" y="32" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">2009</text>

    <text x="20" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Jeff Beck</text>
    <text x="20" y="88" fill="#ec4899" font-family="system-ui, sans-serif" font-size="12" font-weight="600">INSTRUMENTAL ROCK / MODERN STUDIO</text>

    <line x1="20" y1="102" x2="380" y2="102" stroke="#334155" stroke-width="1" />

    <!-- Tech specs -->
    <text x="20" y="125" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Key Production Signatures:</text>
    <text x="32" y="148" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• 96kHz/24-bit digital multitrack (48+ channels)</text>
    <text x="32" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Phantom center imaging & Haas effect widening</text>
    <text x="32" y="192" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Convolution reverb recreating Studio 2 acoustic</text>
    <text x="32" y="214" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Mid-side processing (+3 dB side width enhancement)</text>
  </g>
</svg>