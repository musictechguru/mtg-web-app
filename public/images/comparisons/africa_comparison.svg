<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.95)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
    <linearGradient id="cardBGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.95)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" fill="url(#bgGrad)" rx="14" />
  <rect x="1" y="1" width="898" height="358" fill="none" stroke="#334155" stroke-width="1.5" rx="13" />

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">AFRICA: TOTO VS BACALL & MALO</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Edexcel Component 3 Question 5 Comparative Analysis</text>

  <!-- Version A Card -->
  <g transform="translate(30, 75)">
    <rect width="400" height="255" fill="url(#cardAGrad)" rx="10" stroke="#a855f7" stroke-width="2" />
    <rect x="15" y="15" width="80" height="24" rx="4" fill="#a855f7" />
    <text x="55" y="31" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="800">VERSION A</text>
    <text x="385" y="32" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">1982</text>

    <text x="20" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Toto</text>
    <text x="20" y="88" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12" font-weight="600">YACHT ROCK / STUDIO POP</text>

    <line x1="20" y1="102" x2="380" y2="102" stroke="#334155" stroke-width="1" />

    <!-- Tech specs -->
    <text x="20" y="125" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Key Production Signatures:</text>
    <text x="32" y="148" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Jeff Porcaro iconic live half-time shuffle</text>
    <text x="32" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Yamaha CS-80 & GS-1 FM synthesizers</text>
    <text x="32" y="192" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Acoustic piano, percussion & vocal layers</text>
    <text x="32" y="214" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Dynamic mixing with analogue tape saturation</text>
  </g>

  <!-- VS Badge -->
  <circle cx="450" cy="202" r="22" fill="#0f172a" stroke="#64748b" stroke-width="2" />
  <text x="450" y="208" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="900">VS</text>

  <!-- Version B Card -->
  <g transform="translate(470, 75)">
    <rect width="400" height="255" fill="url(#cardBGrad)" rx="10" stroke="#06b6d4" stroke-width="2" />
    <rect x="15" y="15" width="80" height="24" rx="4" fill="#06b6d4" />
    <text x="55" y="31" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11" font-weight="800">VERSION B</text>
    <text x="385" y="32" text-anchor="end" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">2016</text>

    <text x="20" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Bacall & Malo ft. Prince Osito</text>
    <text x="20" y="88" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TROPICAL HOUSE / EDM</text>

    <line x1="20" y1="102" x2="380" y2="102" stroke="#334155" stroke-width="1" />

    <!-- Tech specs -->
    <text x="20" y="125" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Key Production Signatures:</text>
    <text x="32" y="148" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• 4-on-the-floor EDM kick with sidechain ducking</text>
    <text x="32" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Sampled vocal chops with pitch/formant shifting</text>
    <text x="32" y="192" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• EDM builds, white noise risers & sudden drops</text>
    <text x="32" y="214" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Brickwall digital limiting (-7 LUFS target)</text>
  </g>
</svg>