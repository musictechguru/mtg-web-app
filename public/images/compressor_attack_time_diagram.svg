<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="460" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Header Badge -->
  <rect x="30" y="20" width="260" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="160" y="41" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">COMPRESSOR ATTACK TIME</text>
  <text x="305" y="41" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">How reaction speed shapes the punch and transients of drum hits</text>

  <!-- Left Panel: Fast Attack -->
  <g transform="translate(30, 68)">
    <rect width="355" height="288" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Title Badge -->
    <rect x="16" y="16" width="145" height="24" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
    <text x="88" y="32" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FAST ATTACK (&lt; 1ms)</text>
    <text x="175" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Clamps Transient Spike</text>

    <!-- Waveform Canvas Box -->
    <rect x="16" y="48" width="323" height="136" rx="6" fill="#0b1120" stroke="#1e293b" />

    <!-- Threshold Reference Line -->
    <line x1="16" y1="116" x2="339" y2="116" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4" />
    <text x="333" y="110" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="end">THRESHOLD LEVEL</text>

    <!-- Center Line -->
    <line x1="16" y1="145" x2="339" y2="145" stroke="#334155" stroke-width="1" />

    <!-- Ghost Uncompressed Transient (Original tall peak reaching up to y=68) -->
    <path d="M 25,145 L 45,145 L 54,68 L 63,145 L 75,128 L 88,155 L 102,138 L 118,148 L 135,142 L 320,145" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3" />
    <text x="54" y="60" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" text-anchor="middle">Original Spike</text>

    <!-- Clamped Fast Attack Output Waveform (Blue: peak chopped off instantly at threshold) -->
    <path d="M 25,145 L 45,145 L 50,116 L 58,116 L 63,145 L 75,133 L 88,152 L 102,140 L 118,147 L 135,143 L 320,145" fill="none" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Gain Reduction Arrow & Clamp Shading -->
    <rect x="47" y="68" width="14" height="48" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="0.8" stroke-dasharray="2" />
    <text x="68" y="86" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700">CLAMPED!</text>
    <text x="68" y="97" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5">Instant GR</text>

    <!-- Result Banner -->
    <rect x="16" y="194" width="323" height="42" rx="4" fill="#0f172a" stroke="#1e293b" />
    <text x="26" y="211" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">• Instant reaction squashes the stick impact / transient</text>
    <text x="26" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">• Great for catching peaks &amp; smoothing vocals; kills drum punch</text>

    <!-- Sonic Characteristic Tag -->
    <text x="177" y="258" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Sonic Result: <tspan fill="#f87171" font-weight="700">Smooth, flat, softer drum crack</tspan></text>
    <text x="177" y="272" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Pushes the instrument further back in the stereo mix</text>
  </g>

  <!-- Right Panel: Slow Attack -->
  <g transform="translate(415, 68)">
    <rect width="355" height="288" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    
    <!-- Title Badge -->
    <rect x="16" y="16" width="155" height="24" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="93" y="32" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SLOW ATTACK (30ms+)</text>
    <text x="182" y="32" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Preserves Transient Snap</text>

    <!-- Waveform Canvas Box -->
    <rect x="16" y="48" width="323" height="136" rx="6" fill="#0b1120" stroke="#1e293b" />

    <!-- Threshold Reference Line -->
    <line x1="16" y1="116" x2="339" y2="116" stroke="#facc15" stroke-width="1.5" stroke-dasharray="4" />
    <text x="333" y="110" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="end">THRESHOLD LEVEL</text>

    <!-- Center Line -->
    <line x1="16" y1="145" x2="339" y2="145" stroke="#334155" stroke-width="1" />

    <!-- Waveform: Full transient spike slips through untouched, then clamps body -->
    <path d="M 25,145 L 45,145 L 54,68 L 63,145 L 75,134 L 88,153 L 102,141 L 118,147 L 135,143 L 320,145" fill="none" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Full Transient Punch Circle -->
    <circle cx="54" cy="68" r="7" fill="#34d399" fill-opacity="0.3" stroke="#34d399" stroke-width="2" />
    <text x="54" y="58" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">FULL SNAP!</text>

    <!-- Attack Time Delay Bracket -->
    <line x1="45" y1="130" x2="95" y2="130" stroke="#fbbf24" stroke-width="1.8" />
    <line x1="45" y1="126" x2="45" y2="134" stroke="#fbbf24" stroke-width="1.8" />
    <line x1="95" y1="126" x2="95" y2="134" stroke="#fbbf24" stroke-width="1.8" />
    <text x="70" y="125" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">Attack Time Window</text>

    <!-- Delayed Clamp Label on Body -->
    <text x="145" y="132" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700">GR Clamps Body</text>

    <!-- Result Banner -->
    <rect x="16" y="194" width="323" height="42" rx="4" fill="#0f172a" stroke="#1e293b" />
    <text x="26" y="211" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">• Transient spike passes 100% untouched before GR activates</text>
    <text x="26" y="226" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">• Delivers explosive snare snap, kick punch, and upfront clarity</text>

    <!-- Sonic Characteristic Tag -->
    <text x="177" y="258" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Sonic Result: <tspan fill="#34d399" font-weight="700">Punchy, crisp, upfront impact</tspan></text>
    <text x="177" y="272" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">Lets drums cut directly through dense guitars and bass</text>
  </g>

  <!-- Bottom Exam Summary Bar -->
  <g transform="translate(30, 374)">
    <rect width="740" height="66" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="36" cy="33" r="14" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <text x="36" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">i</text>
    
    <text x="64" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Edexcel Exam Tip: The Attack Time Golden Rule</text>
    <text x="64" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Fast attack clamps transients immediately, softening drum impacts and controlling peak spikes.</text>
    <text x="64" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Slow attack lets the initial impact crack through at full volume before clamping down, preserving punch and presence.</text>
  </g>
</svg>