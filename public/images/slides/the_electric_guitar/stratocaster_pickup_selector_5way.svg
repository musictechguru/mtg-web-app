<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStrat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="12" fill="url(#bgStrat)" stroke="#334155" stroke-width="1.5"/>
  <text x="30" y="36" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">FENDER STRATOCASTER 5-WAY PICKUP SELECTOR (THE 'QUACK' TONE)</text>
  <text x="30" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">Positions 2 &amp; 4 parallel combination: phase notch comb-filtering for funky rhythm textures</text>

  <!-- 5 Switch Positions Table -->
  <g transform="translate(40, 85)">
    <!-- Pos 1 -->
    <rect x="0" y="0" width="115" height="150" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="57" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Position 1</text>
    <rect x="15" y="40" width="85" height="18" fill="#38bdf8" rx="3"/>
    <text x="57" y="53" fill="#0f172a" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">BRIDGE ONLY</text>
    <text x="57" y="85" fill="#e2e8f0" font-family="sans-serif" font-size="9.5" text-anchor="middle">Biting Lead</text>
    <text x="57" y="105" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Piercing highs</text>
    <text x="57" y="125" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Rock soloing</text>

    <!-- Pos 2 -->
    <rect x="125" y="0" width="115" height="150" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="182" y="24" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Position 2</text>
    <rect x="140" y="40" width="85" height="18" fill="#f59e0b" rx="3"/>
    <text x="182" y="53" fill="#0f172a" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">BRIDGE + MID</text>
    <text x="182" y="85" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">"Quack" Tone</text>
    <text x="182" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="8.5" text-anchor="middle">Mid-scooped</text>
    <text x="182" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="8.5" text-anchor="middle">Mark Knopfler</text>

    <!-- Pos 3 -->
    <rect x="250" y="0" width="115" height="150" rx="6" fill="#1e293b" stroke="#64748b"/>
    <text x="307" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Position 3</text>
    <rect x="265" y="40" width="85" height="18" fill="#475569" rx="3"/>
    <text x="307" y="53" fill="#f8fafc" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">MIDDLE ONLY</text>
    <text x="307" y="85" fill="#e2e8f0" font-family="sans-serif" font-size="9.5" text-anchor="middle">Even Balance</text>
    <text x="307" y="105" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Balanced tone</text>
    <text x="307" y="125" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Rhythm chord cuts</text>

    <!-- Pos 4 -->
    <rect x="375" y="0" width="115" height="150" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="432" y="24" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Position 4</text>
    <rect x="390" y="40" width="85" height="18" fill="#f59e0b" rx="3"/>
    <text x="432" y="53" fill="#0f172a" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">NECK + MID</text>
    <text x="432" y="85" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Hollow Funk</text>
    <text x="432" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="8.5" text-anchor="middle">Liquid blues chime</text>
    <text x="432" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="8.5" text-anchor="middle">Jimi Hendrix</text>

    <!-- Pos 5 -->
    <rect x="500" y="0" width="115" height="150" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="557" y="24" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Position 5</text>
    <rect x="515" y="40" width="85" height="18" fill="#10b981" rx="3"/>
    <text x="557" y="53" fill="#0f172a" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">NECK ONLY</text>
    <text x="557" y="85" fill="#e2e8f0" font-family="sans-serif" font-size="9.5" text-anchor="middle">Warm &amp; Fluty</text>
    <text x="557" y="105" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Maximum bass</text>
    <text x="557" y="125" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Stevie Ray Vaughan</text>
  </g>

  <!-- Technical Explanation of Comb Filtering -->
  <g transform="translate(40, 255)">
    <rect width="615" height="75" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="24" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">Acoustic Physics of Positions 2 &amp; 4 (Comb Filtering Cancellation):</text>
    <text x="20" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Because two pickups are spaced several inches apart along the string, higher harmonic wave cycles arrive slightly out-of-phase.</text>
    <text x="20" y="60" fill="#94a3b8" font-family="sans-serif" font-size="9.5">This creates phase notch cancellation in the midrange (~1.5 kHz), producing the signature scooped, hollow, rubbery "quack".</text>
  </g>
</svg>