<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFaraday" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="12" fill="url(#bgFaraday)" stroke="#334155" stroke-width="1.5"/>
  <text x="30" y="36" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">PHYSICS OF ELECTROMAGNETIC INDUCTION (FARADAY'S LAW)</text>
  <text x="30" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">How vibrating permeable steel guitar strings induce an alternating electrical audio signal</text>

  <!-- Left: Diagram -->
  <g transform="translate(40, 80)">
    <!-- Steel String -->
    <line x1="20" y1="30" x2="260" y2="30" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Vibration motion arcs -->
    <path d="M 120 18 Q 140 10 160 18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <path d="M 120 42 Q 140 50 160 42" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="140" y="10" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Vibrating Nickel/Steel String (Permeable Core)</text>

    <!-- Magnetic Field Lines -->
    <path d="M 120 70 C 90 40, 90 20, 140 20 C 190 20, 190 40, 160 70" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="210" y="50" fill="#c084fc" font-family="sans-serif" font-size="8.5">Magnetic Flux (&#934;)</text>

    <!-- Magnet Pole Piece -->
    <rect x="125" y="70" width="30" height="90" rx="3" fill="#dc2626" stroke="#f8fafc"/>
    <rect x="125" y="115" width="30" height="45" rx="3" fill="#2563eb" stroke="#f8fafc"/>
    <text x="140" y="98" fill="#fff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">N</text>
    <text x="140" y="145" fill="#fff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">S</text>

    <!-- Copper Coil Wrap -->
    <path d="M 110 85 Q 140 90 170 85 M 110 95 Q 140 100 170 95 M 110 105 Q 140 110 170 105 M 110 115 Q 140 120 170 115 M 110 125 Q 140 130 170 125" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="60" y="110" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="700">7,000 Turns Copper Wire</text>

    <!-- Output Leads -->
    <path d="M 110 125 L 80 170 L 60 170" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 170 125 L 200 170 L 220 170" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="50" cy="170" r="4" fill="#f59e0b"/>
    <circle cx="230" cy="170" r="4" fill="#64748b"/>
    <text x="140" y="185" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Induced AC Voltage Signal (~100-300 mV)</text>
  </g>

  <!-- Right: Mathematical Formula & Steps -->
  <g transform="translate(360, 80)">
    <rect width="300" height="235" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="28" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">FARADAY'S LAW OF INDUCTION</text>
    
    <!-- Formula Box -->
    <rect x="20" y="42" width="260" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="150" y="68" fill="#fbbf24" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">&#949; = - N &#215; (&#916;&#934; / &#916;t)</text>

    <text x="20" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="9.5"><strong style="color:#38bdf8;">&#949;:</strong> Induced Electromotive Force (Audio Voltage)</text>
    <text x="20" y="128" fill="#cbd5e1" font-family="sans-serif" font-size="9.5"><strong style="color:#fbbf24;">N:</strong> Number of wire turns in coil (~6,000–9,000)</text>
    <text x="20" y="146" fill="#cbd5e1" font-family="sans-serif" font-size="9.5"><strong style="color:#c084fc;">&#916;&#934;/&#916;t:</strong> Rate of change of magnetic flux over time</text>

    <line x1="20" y1="162" x2="280" y2="162" stroke="#334155"/>
    <text x="20" y="182" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="700">Why Nylon Strings Cannot Work:</text>
    <text x="20" y="200" fill="#94a3b8" font-family="sans-serif" font-size="9">Nylon and gut strings are non-magnetic and cannot</text>
    <text x="20" y="215" fill="#94a3b8" font-family="sans-serif" font-size="9">alter magnetic flux lines. Only ferromagnetic steel,</text>
    <text x="20" y="230" fill="#94a3b8" font-family="sans-serif" font-size="9">nickel, or cobalt strings induce electrical audio current.</text>
  </g>
</svg>