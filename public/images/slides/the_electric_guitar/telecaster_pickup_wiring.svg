<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTele" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="12" fill="url(#bgTele)" stroke="#334155" stroke-width="1.5"/>
  <text x="30" y="36" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">FENDER TELECASTER 3-WAY PICKUP SWITCHING CIRCUIT</text>
  <text x="30" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">Lead bridge pickup on steel plate, chrome neck pickup, and classic 3-position selector wiring</text>

  <!-- Left: Schematic -->
  <g transform="translate(40, 85)">
    <rect width="320" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="160" y="25" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">TELECASTER CONTROL PLATE</text>

    <!-- 3-Way Switch representation -->
    <rect x="30" y="55" width="260" height="50" rx="4" fill="#0f172a" stroke="#64748b"/>
    <circle cx="70" cy="80" r="10" fill="#38bdf8"/>
    <text x="70" y="84" fill="#fff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">1</text>
    <circle cx="160" cy="80" r="10" fill="#f59e0b"/>
    <text x="160" y="84" fill="#fff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">2</text>
    <circle cx="250" cy="80" r="10" fill="#10b981"/>
    <text x="250" y="84" fill="#fff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">3</text>

    <text x="70" y="125" fill="#38bdf8" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Pos 1: Bridge</text>
    <text x="70" y="140" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Bright Twang</text>

    <text x="160" y="125" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Pos 2: Both</text>
    <text x="160" y="140" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">In Parallel</text>

    <text x="250" y="125" fill="#34d399" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Pos 3: Neck</text>
    <text x="250" y="140" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Warm Blues</text>

    <!-- Volume & Tone pots below -->
    <circle cx="100" cy="185" r="18" fill="#334155" stroke="#f8fafc"/>
    <text x="100" y="190" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">VOL</text>
    <circle cx="220" cy="185" r="18" fill="#334155" stroke="#f8fafc"/>
    <text x="220" y="190" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">TONE</text>
  </g>

  <!-- Right: Key Architectural Highlights -->
  <g transform="translate(380, 85)">
    <rect width="280" height="230" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="28" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700">THE TELECASTER 'TWANG' SECRET</text>
    
    <text x="20" y="58" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">1. Copper-Plated Steel Baseplate:</text>
    <text x="20" y="76" fill="#94a3b8" font-family="sans-serif" font-size="9">The bridge pickup sits directly on a steel plate,</text>
    <text x="20" y="90" fill="#94a3b8" font-family="sans-serif" font-size="9">concentrating the magnetic field and boosting bass/treble bite.</text>

    <text x="20" y="118" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">2. 3-Saddle Brass Bridge:</text>
    <text x="20" y="136" fill="#94a3b8" font-family="sans-serif" font-size="9">Strings share brass saddles in pairs (E/A, D/G, B/E),</text>
    <text x="20" y="150" fill="#94a3b8" font-family="sans-serif" font-size="9">creating acoustic coupling across strings.</text>

    <text x="20" y="178" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">3. String-Through-Body Construction:</text>
    <text x="20" y="196" fill="#94a3b8" font-family="sans-serif" font-size="9">Strings anchor through metal ferrules on body back,</text>
    <text x="20" y="210" fill="#94a3b8" font-family="sans-serif" font-size="9">maximizing string vibrational coupling to the wood.</text>
  </g>
</svg>