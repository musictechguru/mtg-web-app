<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNodes" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="12" fill="url(#bgNodes)" stroke="#334155" stroke-width="1.5"/>
  <text x="30" y="36" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">STRING VIBRATION NODES, EXCURSION &amp; PICKUP PLACEMENT</text>
  <text x="30" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">Why neck pickups sound warm &amp; bassy while bridge pickups sound bright &amp; cutting</text>

  <g transform="translate(40, 80)">
    <!-- Nut Anchor -->
    <rect x="0" y="80" width="12" height="40" fill="#e2e8f0" rx="2"/>
    <text x="6" y="70" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Nut</text>

    <!-- Bridge Saddle Anchor -->
    <rect x="600" y="80" width="12" height="40" fill="#64748b" rx="2"/>
    <text x="606" y="70" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Bridge</text>

    <!-- Fundamental Mode Wave Envelope (Wide belly at center/neck) -->
    <path d="M 12 100 Q 306 20 600 100" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M 12 100 Q 306 180 600 100" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="306" y="15" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Fundamental Mode: Maximum Displacement / String Excursion (Antinode)</text>

    <!-- 2nd Harmonic Mode (Node at center) -->
    <path d="M 12 100 Q 159 60 306 100 Q 453 140 600 100" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.6"/>

    <!-- Pickup Placement Overlay -->
    <!-- Neck Pickup Area -->
    <rect x="380" y="85" width="28" height="30" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="394" y="130" fill="#38bdf8" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Neck Pickup</text>
    <text x="394" y="145" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Large string excursion</text>
    <text x="394" y="158" fill="#34d399" font-family="sans-serif" font-size="8.5" text-anchor="middle">&#8594; Strong fundamental</text>

    <!-- Bridge Pickup Area -->
    <rect x="540" y="85" width="28" height="30" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="554" y="130" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Bridge Pickup</text>
    <text x="554" y="145" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Tiny string excursion</text>
    <text x="554" y="158" fill="#f87171" font-family="sans-serif" font-size="8.5" text-anchor="middle">&#8594; Rich high harmonics</text>
  </g>

  <!-- Technical Takeaways Bottom -->
  <g transform="translate(40, 260)">
    <rect width="615" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="24" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">Edexcel Component 3 Acoustic Principles:</text>
    <text x="20" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; Near the bridge anchor, string amplitude is mechanically restricted, exciting upper harmonic overtones.</text>
    <text x="20" y="58" fill="#94a3b8" font-family="sans-serif" font-size="9.5">&#8226; Toward the neck center, string vibration sweeps across wide physical arcs, capturing fundamental warmth.</text>
  </g>
</svg>