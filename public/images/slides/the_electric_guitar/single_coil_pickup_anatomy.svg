<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSingle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="12" fill="url(#bgSingle)" stroke="#334155" stroke-width="1.5"/>
  <text x="30" y="36" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">SINGLE-COIL PICKUP ANATOMY &amp; 50/60Hz MAINS HUM</text>
  <text x="30" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">Individual Alnico pole pieces, bobbin structure, high-frequency brightness, and EMI vulnerability</text>

  <g transform="translate(40, 80)">
    <!-- Pickup 3D / Side Cross Section -->
    <rect x="30" y="40" width="220" height="15" rx="3" fill="#475569" stroke="#94a3b8"/>
    <text x="140" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Top Flatwork (Fibreboard)</text>

    <!-- 6 Staggered Pole pieces -->
    <rect x="50" y="40" width="16" height="70" fill="#94a3b8" stroke="#f8fafc"/>
    <rect x="80" y="40" width="16" height="70" fill="#94a3b8" stroke="#f8fafc"/>
    <rect x="110" y="35" width="16" height="75" fill="#94a3b8" stroke="#f8fafc"/>
    <rect x="140" y="32" width="16" height="78" fill="#94a3b8" stroke="#f8fafc"/>
    <rect x="170" y="42" width="16" height="68" fill="#94a3b8" stroke="#f8fafc"/>
    <rect x="200" y="44" width="16" height="66" fill="#94a3b8" stroke="#f8fafc"/>
    <text x="140" y="75" fill="#fff" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Alnico V Magnet Rods</text>

    <!-- Bottom Flatwork -->
    <rect x="20" y="110" width="240" height="18" rx="3" fill="#475569" stroke="#94a3b8"/>
    <text x="140" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Bottom Flatwork with Eyelets</text>

    <!-- Copper winding coil envelope -->
    <rect x="40" y="55" width="190" height="55" rx="6" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2"/>
    <text x="140" y="98" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">42 AWG Copper Wire (8,000 Turns)</text>
  </g>

  <!-- Right: Technical Characteristics Box -->
  <g transform="translate(340, 80)">
    <rect width="320" height="235" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">SONIC QUALITIES &amp; LIMITATIONS</text>
    
    <text x="20" y="55" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">&#10003; Sonic Advantages:</text>
    <text x="20" y="73" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; Narrow magnetic aperture senses localized string section</text>
    <text x="20" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; Sparkling harmonic clarity, bell-like chime &amp; percussive bite</text>
    <text x="20" y="107" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; Exceptional dynamic sensitivity to pick attack nuance</text>

    <text x="20" y="140" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="700">&#10007; The 50/60 Hz Mains Hum Problem:</text>
    <text x="20" y="158" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; Single coil acts as an open antenna for Electromagnetic</text>
    <text x="20" y="173" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">  Interference (EMI) from lighting, mains transformers &amp; CRT monitors</text>
    <text x="20" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; High gain stages in amplifiers amplify this audible buzz</text>
    <text x="20" y="212" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="700">DC Resistance: ~5.8k&#937; to 6.5k&#937; (Low/Medium output)</text>
  </g>
</svg>