<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgComp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="12" fill="url(#bgComp)" stroke="#334155" stroke-width="1.5"/>
  <text x="30" y="36" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">PICKUP CONFIGURATIONS &amp; TONAL COMPARISON SPECTRUM</text>
  <text x="30" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">Comparative analysis of SS (Tele), SSS (Strat), HH (Les Paul), and HSS (Superstrat)</text>

  <!-- Matrix of Configurations -->
  <g transform="translate(40, 85)">
    <!-- Config 1: SS Tele -->
    <rect x="0" y="0" width="145" height="230" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="72" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">SS CONFIGURATION</text>
    <text x="72" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Fender Telecaster</text>
    <rect x="25" y="55" width="95" height="16" rx="2" fill="#334155"/>
    <rect x="25" y="80" width="95" height="16" rx="2" fill="#334155"/>
    <text x="72" y="120" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Tone: Biting &amp; Twangy</text>
    <text x="12" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">&#8226; Steel bridge plate</text>
    <text x="12" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">&#8226; Sharp treble attack</text>
    <text x="12" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">&#8226; Country, blues, punk</text>
    <text x="72" y="215" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Springsteen, Keith Richards</text>

    <!-- Config 2: SSS Strat -->
    <rect x="160" y="0" width="145" height="230" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="232" y="24" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">SSS CONFIGURATION</text>
    <text x="232" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Fender Stratocaster</text>
    <rect x="185" y="52" width="95" height="12" rx="2" fill="#334155"/>
    <rect x="185" y="70" width="95" height="12" rx="2" fill="#334155"/>
    <rect x="185" y="88" width="95" height="12" rx="2" fill="#334155"/>
    <text x="232" y="120" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Tone: Bell Chime &amp; Quack</text>
    <text x="172" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">&#8226; 5-way tonal palette</text>
    <text x="172" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">&#8226; Mid-scoop pos 2 &amp; 4</text>
    <text x="172" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">&#8226; Funk, psych, rock</text>
    <text x="232" y="215" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Hendrix, David Gilmour</text>

    <!-- Config 3: HH Les Paul -->
    <rect x="320" y="0" width="145" height="230" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="392" y="24" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">HH CONFIGURATION</text>
    <text x="392" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Gibson Les Paul / SG</text>
    <rect x="345" y="55" width="95" height="22" rx="2" fill="#475569"/>
    <rect x="345" y="85" width="95" height="22" rx="2" fill="#475569"/>
    <text x="392" y="120" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Tone: Thick &amp; Warm</text>
    <text x="332" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">&#8226; Zero 50Hz mains hum</text>
    <text x="332" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">&#8226; Heavy midrange push</text>
    <text x="332" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">&#8226; Classic rock &amp; metal</text>
    <text x="392" y="215" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Jimmy Page, Slash</text>

    <!-- Config 4: HSS Superstrat -->
    <rect x="480" y="0" width="145" height="230" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="552" y="24" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">HSS CONFIGURATION</text>
    <text x="552" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Superstrat / Ibanez / Charvel</text>
    <rect x="505" y="52" width="95" height="12" rx="2" fill="#334155"/>
    <rect x="505" y="68" width="95" height="12" rx="2" fill="#334155"/>
    <rect x="505" y="86" width="95" height="20" rx="2" fill="#475569"/>
    <text x="552" y="120" fill="#fbbf24" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Tone: High-Gain Versatility</text>
    <text x="492" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">&#8226; Bridge humbucker lead</text>
    <text x="492" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">&#8226; Neck single-coil chime</text>
    <text x="492" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">&#8226; 80s hard rock &amp; shred</text>
    <text x="552" y="215" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">Eddie Van Halen, Steve Vai</text>
  </g>
</svg>