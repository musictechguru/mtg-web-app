<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNeck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="12" fill="url(#bgNeck)" stroke="#334155" stroke-width="1.5"/>
  <text x="30" y="36" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">GUITAR NECK JOINTS: BOLT-ON vs SET-NECK vs NECK-THROUGH</text>
  <text x="30" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">Mechanical rigidity, production modularity, acoustic sustain, and upper-fret access</text>

  <!-- Joint 1: Bolt-On -->
  <g transform="translate(30, 80)">
    <rect width="195" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="97" y="24" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">BOLT-ON NECK</text>
    <text x="97" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9.5" text-anchor="middle">Fender Telecaster &amp; Stratocaster</text>

    <!-- Visual schematic -->
    <rect x="25" y="60" width="80" height="40" fill="#475569" rx="3"/>
    <rect x="85" y="70" width="85" height="70" fill="#334155" rx="3"/>
    <!-- Screws -->
    <line x1="95" y1="65" x2="95" y2="110" stroke="#f8fafc" stroke-width="3" stroke-dasharray="4,2"/>
    <line x1="115" y1="65" x2="115" y2="110" stroke="#f8fafc" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="105" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">4 Steel Wood Screws</text>

    <text x="15" y="160" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Modular assembly</text>
    <text x="15" y="178" fill="#94a3b8" font-family="sans-serif" font-size="9">Easy neck replacement &amp; repair</text>
    <text x="15" y="198" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Percussive snappy attack</text>
    <text x="15" y="216" fill="#94a3b8" font-family="sans-serif" font-size="9">Immediate transient response</text>
  </g>

  <!-- Joint 2: Set-Neck -->
  <g transform="translate(250, 80)">
    <rect width="195" height="240" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="97" y="24" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">SET-NECK (GLUED)</text>
    <text x="97" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9.5" text-anchor="middle">Gibson Les Paul &amp; SG</text>

    <!-- Visual schematic -->
    <path d="M 25 70 L 105 70 L 105 110 L 25 110 Z" fill="#475569"/>
    <path d="M 85 60 L 170 60 L 170 130 L 85 130 Z" fill="#334155" opacity="0.6"/>
    <rect x="85" y="70" width="20" height="40" fill="#f59e0b" opacity="0.4"/>
    <text x="105" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Mortise &amp; Tenon Wood Glue</text>

    <text x="15" y="160" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Enhanced acoustic sustain</text>
    <text x="15" y="178" fill="#94a3b8" font-family="sans-serif" font-size="9">Wood-to-wood resonant transfer</text>
    <text x="15" y="198" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Warmer, rounder tone</text>
    <text x="15" y="216" fill="#94a3b8" font-family="sans-serif" font-size="9">Traditional luthier craftsmanship</text>
  </g>

  <!-- Joint 3: Neck-Through -->
  <g transform="translate(470, 80)">
    <rect width="195" height="240" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="97" y="24" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">NECK-THROUGH-BODY</text>
    <text x="97" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9.5" text-anchor="middle">Rickenbacker 4001, Jackson</text>

    <!-- Visual schematic -->
    <rect x="25" y="80" width="145" height="25" fill="#10b981" opacity="0.6" rx="2"/>
    <rect x="90" y="55" width="80" height="25" fill="#334155" rx="2"/>
    <rect x="90" y="105" width="80" height="25" fill="#334155" rx="2"/>
    <text x="97" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Single Central Timber Beam</text>

    <text x="15" y="170" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Maximum sustain &amp; stability</text>
    <text x="15" y="188" fill="#94a3b8" font-family="sans-serif" font-size="9">Zero joint impedance barrier</text>
    <text x="15" y="208" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Effortless upper fret access</text>
    <text x="15" y="226" fill="#94a3b8" font-family="sans-serif" font-size="9">No bulky neck heel obstruction</text>
  </g>
</svg>