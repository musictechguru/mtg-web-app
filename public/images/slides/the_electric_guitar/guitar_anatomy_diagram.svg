<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAnat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="12" fill="url(#bgAnat)" stroke="#334155" stroke-width="1.5"/>
  <text x="30" y="36" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">ELECTRIC GUITAR ANATOMY &amp; COMPONENT ARCHITECTURE</text>
  <text x="30" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">Edexcel C3: Headstock, Nut, Frets, Magnetic Transducers, Bridge Saddles &amp; Controls</text>

  <!-- Guitar Outline Side View / Top View Representation -->
  <g transform="translate(40, 80)">
    <!-- Headstock -->
    <rect x="0" y="90" width="80" height="40" rx="4" fill="#334155" stroke="#64748b"/>
    <circle cx="20" cy="80" r="5" fill="#94a3b8"/>
    <circle cx="40" cy="80" r="5" fill="#94a3b8"/>
    <circle cx="60" cy="80" r="5" fill="#94a3b8"/>
    <text x="40" y="115" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Headstock</text>

    <!-- Nut -->
    <rect x="80" y="95" width="8" height="30" fill="#e2e8f0"/>
    <text x="84" y="80" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Nut (Bone/Synthetic)</text>
    <line x1="84" y1="83" x2="84" y2="95" stroke="#38bdf8" stroke-width="1"/>

    <!-- Neck & Frets -->
    <rect x="88" y="98" width="220" height="24" fill="#475569"/>
    <!-- Frets lines -->
    <line x1="110" y1="98" x2="110" y2="122" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="140" y1="98" x2="140" y2="122" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="175" y1="98" x2="175" y2="122" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="215" y1="98" x2="215" y2="122" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="260" y1="98" x2="260" y2="122" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="190" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Scale Length (24.75" / 25.5") &amp; Frets</text>

    <!-- Guitar Body -->
    <path d="M 308 60 C 350 40, 480 40, 520 70 C 560 100, 560 130, 520 160 C 480 180, 350 180, 308 150 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="440" y="65" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Solidbody Wood (Alder / Ash / Mahogany)</text>

    <!-- Pickups -->
    <rect x="330" y="100" width="18" height="20" rx="3" fill="#0f172a" stroke="#e2e8f0"/>
    <text x="339" y="90" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Neck Pickup</text>
    
    <rect x="365" y="100" width="18" height="20" rx="3" fill="#0f172a" stroke="#e2e8f0"/>
    <text x="374" y="135" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Middle</text>

    <rect x="400" y="100" width="18" height="20" rx="3" fill="#0f172a" stroke="#e2e8f0"/>
    <text x="409" y="90" fill="#f59e0b" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Bridge Pickup</text>

    <!-- Bridge & Saddles -->
    <rect x="440" y="98" width="28" height="24" rx="2" fill="#64748b" stroke="#cbd5e1"/>
    <text x="454" y="138" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Bridge Saddles</text>

    <!-- Controls -->
    <circle cx="490" cy="115" r="7" fill="#f59e0b" stroke="#fff"/>
    <text x="490" y="138" fill="#fbbf24" font-family="sans-serif" font-size="8.5" text-anchor="middle">Volume</text>
    <circle cx="510" cy="125" r="7" fill="#10b981" stroke="#fff"/>
    <text x="510" y="148" fill="#34d399" font-family="sans-serif" font-size="8.5" text-anchor="middle">Tone</text>
  </g>

  <!-- Key Technical Callouts Bottom -->
  <g transform="translate(40, 260)">
    <rect width="190" height="70" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="14" y="22" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">1. Mechanical String Excursion</text>
    <text x="14" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Displacement amplitude greatest near neck;</text>
    <text x="14" y="55" fill="#94a3b8" font-family="sans-serif" font-size="9.5">tightest harmonic attack near bridge.</text>

    <rect x="210" width="210" height="70" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="224" y="22" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="700">2. Transducer Conversion</text>
    <text x="224" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Coils convert magnetic disturbance to AC;</text>
    <text x="224" y="55" fill="#94a3b8" font-family="sans-serif" font-size="9.5">output sent to potentiometers and 1/4" jack.</text>

    <rect x="430" width="190" height="70" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="444" y="22" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="700">3. Scale Length &amp; Frets</text>
    <text x="444" y="40" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Fender 25.5" (snappy, high string tension);</text>
    <text x="444" y="55" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Gibson 24.75" (warmer, easier string bends).</text>
  </g>
</svg>