<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSolid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="12" fill="url(#bgSolid)" stroke="#334155" stroke-width="1.5"/>
  <text x="30" y="36" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">SOLIDBODY GUITAR ACOUSTIC PHYSICS &amp; SUSTAIN</text>
  <text x="30" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">How dense solid wood timber stops acoustic sympathetic vibration while maximizing string sustain</text>

  <!-- Left: Cross-section comparison -->
  <g transform="translate(40, 85)">
    <rect width="280" height="230" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <text x="140" y="25" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">HOLLOWBODY (ACOUSTIC CAVITY)</text>
    
    <path d="M 40 80 Q 140 60 240 80 L 240 120 Q 140 140 40 120 Z" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <rect x="130" y="65" width="20" height="15" fill="#94a3b8"/>
    <text x="140" y="105" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Air Cavity (~50-80mm)</text>

    <text x="20" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; High sympathetic resonance</text>
    <text x="20" y="173" fill="#94a3b8" font-family="sans-serif" font-size="9">Acoustic SPL drives thin wood soundboard</text>
    <text x="20" y="193" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Severe feedback above ~85 dB SPL</text>
    <text x="20" y="211" fill="#94a3b8" font-family="sans-serif" font-size="9">Cannot pair with high-gain distortion or loud drums</text>
  </g>

  <!-- Right: Solidbody -->
  <g transform="translate(360, 85)">
    <rect width="300" height="230" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="150" y="25" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">SOLIDBODY (DENSE TIMBER SLAB)</text>
    
    <rect x="40" y="70" width="220" height="50" rx="4" fill="#334155" stroke="#34d399" stroke-width="2"/>
    <rect x="120" y="65" width="25" height="15" fill="#94a3b8"/>
    <rect x="175" y="65" width="25" height="15" fill="#94a3b8"/>
    <text x="150" y="100" fill="#34d399" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Solid Ash / Alder / Mahogany (45mm)</text>

    <text x="20" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Immune to acoustic sound pressure</text>
    <text x="20" y="168" fill="#94a3b8" font-family="sans-serif" font-size="9">High mechanical inertia prevents body cavity resonance</text>
    <text x="20" y="188" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Dramatic increase in string sustain</text>
    <text x="20" y="206" fill="#94a3b8" font-family="sans-serif" font-size="9">Vibrational energy remains inside string rather than lost to wood</text>
  </g>
</svg>