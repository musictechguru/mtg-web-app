<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgActive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="12" fill="url(#bgActive)" stroke="#334155" stroke-width="1.5"/>
  <text x="30" y="36" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">ACTIVE vs PASSIVE PICKUP ELECTRONICS</text>
  <text x="30" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">Traditional high-impedance coils vs low-turn preamplified 9V active designs (EMG 81 / Fishman Fluence)</text>

  <!-- Left: Passive -->
  <g transform="translate(40, 85)">
    <rect width="290" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="145" y="25" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">PASSIVE PICKUPS (HIGH-Z)</text>
    <text x="145" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Pure Electromagnetic Induction (Zero Battery)</text>

    <text x="20" y="75" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; <strong style="color:#fff;">Coil Design:</strong> 8,000–10,000 turns of wire</text>
    <text x="20" y="95" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; <strong style="color:#fff;">Magnetic Pull:</strong> High string magnetic pull</text>
    <text x="20" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; <strong style="color:#fff;">Output Impedance:</strong> High impedance (~10k&#937;)</text>
    <text x="20" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; <strong style="color:#fff;">Dynamics:</strong> Organic, touch-sensitive nuance</text>

    <text x="20" y="175" fill="#f87171" font-family="sans-serif" font-size="9.5" font-weight="700">Limitation:</text>
    <text x="20" y="193" fill="#94a3b8" font-family="sans-serif" font-size="9">Cable capacitance rolls off treble over long runs;</text>
    <text x="20" y="208" fill="#94a3b8" font-family="sans-serif" font-size="9">strong magnets can dampen natural string vibration.</text>
  </g>

  <!-- Right: Active -->
  <g transform="translate(370, 85)">
    <rect width="290" height="230" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="145" y="25" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">ACTIVE PICKUPS (LOW-Z + 9V)</text>
    <text x="145" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Internal Op-Amp Preamplifier (EMG 81/85)</text>

    <text x="20" y="75" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; <strong style="color:#fff;">Coil Design:</strong> Fewer turns (~3,000) for wide bandwidth</text>
    <text x="20" y="95" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; <strong style="color:#fff;">Weak Magnets:</strong> Eliminates string drag for longer sustain</text>
    <text x="20" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; <strong style="color:#fff;">Output Impedance:</strong> Low impedance (~2k&#937;)</text>
    <text x="20" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">&#8226; <strong style="color:#fff;">Noise Floor:</strong> Virtually zero noise, hum, or EMI buzz</text>

    <text x="20" y="175" fill="#34d399" font-family="sans-serif" font-size="9.5" font-weight="700">Modern Advantage:</text>
    <text x="20" y="193" fill="#94a3b8" font-family="sans-serif" font-size="9">Drives long cables and pedalboards with zero treble loss;</text>
    <text x="20" y="208" fill="#94a3b8" font-family="sans-serif" font-size="9">favored by heavy metal players for tight, punchy low-end.</text>
  </g>
</svg>