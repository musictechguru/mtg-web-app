<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFloyd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="12" fill="url(#bgFloyd)" stroke="#334155" stroke-width="1.5"/>
  <text x="30" y="36" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">FLOYD ROSE DOUBLE-LOCKING TREMOLO SYSTEM (1977)</text>
  <text x="30" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">Locking nut blocks, hardened steel knife edges, recessed routing, and micro fine-tuners</text>

  <!-- Left: Locking Nut & Bridge Saddles Mechanical System -->
  <g transform="translate(40, 85)">
    <!-- Stage 1: Locking Nut -->
    <rect x="10" y="30" width="110" height="150" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="20" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">LOCK 1: HEADSTOCK NUT</text>
    <!-- Clamps -->
    <rect x="25" y="45" width="80" height="25" rx="3" fill="#475569" stroke="#94a3b8"/>
    <circle cx="45" cy="57" r="4" fill="#f8fafc"/>
    <circle cx="85" cy="57" r="4" fill="#f8fafc"/>
    <text x="65" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">3 Steel Pressure Pads</text>
    <text x="65" y="105" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Locks string over nut</text>
    <text x="65" y="130" fill="#34d399" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Zero Friction at Pegs</text>

    <!-- String Tension Line -->
    <line x1="120" y1="57" x2="190" y2="57" stroke="#e2e8f0" stroke-width="2.5"/>

    <!-- Stage 2: Locking Bridge -->
    <rect x="190" y="30" width="130" height="150" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="255" y="20" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">LOCK 2: BRIDGE SADDLE</text>
    <rect x="205" y="45" width="100" height="25" rx="3" fill="#475569" stroke="#94a3b8"/>
    <text x="255" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Saddle Insert Blocks</text>
    <text x="255" y="105" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">String ball-end cut off</text>
    <text x="255" y="130" fill="#fbbf24" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Micro Fine-Tuning Screws</text>

    <!-- Whammy Bar -->
    <path d="M 285 55 L 310 10 L 325 15" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  </g>

  <!-- Right: Why It Enabled Virtuosity -->
  <g transform="translate(400, 85)">
    <rect width="265" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">EXTREME DIVE-BOMB STABILITY</text>
    
    <text x="20" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; The Traditional Detuning Flaw:</text>
    <text x="20" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">On standard vintage tremolos (Strat), aggressive pitch bends pull strings across nut friction slots, hanging up and going out of tune.</text>

    <text x="20" y="108" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600">&#8226; The Double-Locking Fix:</text>
    <text x="20" y="125" fill="#94a3b8" font-family="sans-serif" font-size="9">By clamping the string securely at BOTH the nut and the bridge saddle, the active vibrating length has ZERO slippage.</text>

    <text x="20" y="160" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Floating Recessed Cavity:</text>
    <text x="20" y="177" fill="#94a3b8" font-family="sans-serif" font-size="9">Allows pulling UP on the tremolo arm to raise pitch by a minor third, as well as dropping pitch to complete slackness.</text>
  </g>
</svg>