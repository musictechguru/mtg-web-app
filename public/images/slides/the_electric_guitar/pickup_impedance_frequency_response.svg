<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRLC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="12" fill="url(#bgRLC)" stroke="#334155" stroke-width="1.5"/>
  <text x="30" y="36" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">PICKUP IMPEDANCE &amp; RESONANT PEAK FREQUENCY RESPONSE</text>
  <text x="30" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">How Inductance (L), Resistance (R), and Cable Capacitance (C) shape electric guitar frequency response</text>

  <!-- Left: Frequency Response Graph -->
  <g transform="translate(50, 90)">
    <!-- Grid -->
    <rect width="320" height="180" fill="#0f172a" stroke="#334155"/>
    <line x1="0" y1="45" x2="320" y2="45" stroke="#1e293b" stroke-dasharray="2,2"/>
    <line x1="0" y1="90" x2="320" y2="90" stroke="#1e293b" stroke-dasharray="2,2"/>
    <line x1="0" y1="135" x2="320" y2="135" stroke="#1e293b" stroke-dasharray="2,2"/>

    <line x1="80" y1="0" x2="80" y2="180" stroke="#1e293b" stroke-dasharray="2,2"/>
    <line x1="160" y1="0" x2="160" y2="180" stroke="#1e293b" stroke-dasharray="2,2"/>
    <line x1="240" y1="0" x2="240" y2="180" stroke="#1e293b" stroke-dasharray="2,2"/>

    <!-- Axis Labels -->
    <text x="0" y="195" fill="#64748b" font-family="sans-serif" font-size="9">100 Hz</text>
    <text x="80" y="195" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">500 Hz</text>
    <text x="160" y="195" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">2 kHz</text>
    <text x="240" y="195" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">5 kHz</text>
    <text x="320" y="195" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="end">10 kHz</text>

    <!-- Curve 1: Single Coil (High resonant peak at 4-5 kHz) -->
    <path d="M 0 110 Q 150 110 200 95 Q 230 40 245 40 Q 260 40 280 140 L 320 175" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="245" cy="40" r="4" fill="#38bdf8"/>
    <text x="245" y="28" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Single-Coil (Peak ~4.5 kHz)</text>

    <!-- Curve 2: Humbucker (Lower peak at 2.5-3 kHz, higher midrange) -->
    <path d="M 0 95 Q 120 95 160 85 Q 185 45 200 45 Q 215 45 240 140 L 320 178" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="200" cy="45" r="4" fill="#f59e0b"/>
    <text x="175" y="35" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="end">Humbucker (~2.8 kHz)</text>
  </g>

  <!-- Right: RLC Electrical Formula & Guitar Cable Physics -->
  <g transform="translate(400, 90)">
    <rect width="265" height="215" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="18" y="25" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="700">THE RLC FILTER CIRCUIT</text>
    
    <text x="18" y="52" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">&#8226; Inductance (L): 2.5 to 8.0 Henries</text>
    <text x="18" y="68" fill="#94a3b8" font-family="sans-serif" font-size="9">Created by the thousands of copper turns wrapped around iron cores.</text>

    <text x="18" y="98" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="700">&#8226; Resistance (R): 6k&#937; to 14k&#937;</text>
    <text x="18" y="114" fill="#94a3b8" font-family="sans-serif" font-size="9">Higher resistance increases midrange output but softens top-end bite.</text>

    <text x="18" y="144" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">&#8226; Capacitance (C): Cable Loading</text>
    <text x="18" y="160" fill="#94a3b8" font-family="sans-serif" font-size="9">A long 20ft guitar cable adds ~600pF capacitance, shifting the resonant peak downward and rolling off treble clarity.</text>

    <text x="18" y="196" fill="#c084fc" font-family="sans-serif" font-size="9.5" font-weight="700">Why Buffer Pedals Matter:</text>
    <text x="18" y="210" fill="#94a3b8" font-family="sans-serif" font-size="8.5">Converts high-Z pickup signal to low-Z, preventing cable capacitance treble loss.</text>
  </g>
</svg>