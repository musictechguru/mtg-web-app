<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDSP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="360" rx="12" fill="url(#bgDSP)" stroke="#334155" stroke-width="1.5"/>
  <text x="30" y="36" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">DIGITAL AMPLIFIER MODELING, CAB IRs &amp; DSP PROFILING</text>
  <text x="30" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11">From 1998 Line 6 POD to modern Kemper Profilers and Neural DSP Quad Cortex machine learning</text>

  <!-- Flow Steps -->
  <g transform="translate(40, 85)">
    <!-- Stage 1: Hi-Z Direct Input -->
    <rect x="0" y="20" width="130" height="150" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="45" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">HI-Z DIRECT IN</text>
    <text x="65" y="70" fill="#e2e8f0" font-family="sans-serif" font-size="9" text-anchor="middle">1M&#937; Instrument Input</text>
    <text x="65" y="90" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">24-bit 96 kHz A/D</text>
    <text x="65" y="110" fill="#34d399" font-family="sans-serif" font-size="8.5" text-anchor="middle">No microphone bleed</text>

    <!-- Flow Arrow 1 -->
    <line x1="130" y1="95" x2="160" y2="95" stroke="#38bdf8" stroke-width="2"/>

    <!-- Stage 2: Component Modeling / Profiling -->
    <rect x="160" y="20" width="150" height="150" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="235" y="45" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">AMP DSP ENGINE</text>
    <text x="235" y="70" fill="#e2e8f0" font-family="sans-serif" font-size="9" text-anchor="middle">Mathematical Modeling</text>
    <text x="235" y="90" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Valve grid conduction</text>
    <text x="235" y="110" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Output transformer sag</text>
    <text x="235" y="130" fill="#fbbf24" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Non-linear harmonics</text>

    <!-- Flow Arrow 2 -->
    <line x1="310" y1="95" x2="340" y2="95" stroke="#f59e0b" stroke-width="2"/>

    <!-- Stage 3: Cabinet Impulse Response (IR) -->
    <rect x="340" y="20" width="140" height="150" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="410" y="45" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">CABINET CONVOLUTION</text>
    <text x="410" y="70" fill="#e2e8f0" font-family="sans-serif" font-size="9" text-anchor="middle">Impulse Response (IR)</text>
    <text x="410" y="90" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Captures speaker cone,</text>
    <text x="410" y="105" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">wood cabinet resonance,</text>
    <text x="410" y="120" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">&amp; microphone placement</text>

    <!-- Flow Arrow 3 -->
    <line x1="480" y1="95" x2="510" y2="95" stroke="#10b981" stroke-width="2"/>

    <!-- Stage 4: DAW Print -->
    <rect x="510" y="20" width="110" height="150" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="565" y="45" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">STEREO DAW</text>
    <text x="565" y="70" fill="#e2e8f0" font-family="sans-serif" font-size="9" text-anchor="middle">Direct Recording</text>
    <text x="565" y="90" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Instant recall</text>
    <text x="565" y="110" fill="#94a3b8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Re-amping flex</text>
    <text x="565" y="130" fill="#34d399" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Zero stage noise</text>
  </g>

  <!-- Technical Summary Bottom -->
  <g transform="translate(40, 265)">
    <rect width="620" height="65" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="24" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">Modern Digital Modeling Advantages in Component 3:</text>
    <text x="20" y="44" fill="#cbd5e1" font-family="sans-serif" font-size="9.5">Enables tracking at bedroom volume levels without 100W Marshall stack blast. Dry DI track preserved for non-destructive re-amping.</text>
  </g>
</svg>