<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-itb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-itb-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="420" rx="14" fill="url(#bg-grad-itb)" />
  <rect x="1" y="1" width="718" height="418" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Title Bar -->
  <g transform="translate(24, 16)">
    <rect x="0" y="0" width="672" height="34" rx="7" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="18" cy="17" r="5" fill="#a855f7" filter="url(#glow-itb-purple)" />
    <text x="32" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">PRODUCTION METHOD: 'IN-THE-BOX' (ITB) DAW PRODUCTION VS STUDIO TRACKING</text>
    <rect x="520" y="6" width="140" height="22" rx="4" fill="#581c87" fill-opacity="0.4" stroke="#a855f7" stroke-width="0.8" />
    <text x="590" y="21" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">COMPARISON 2: Q2</text>
  </g>

  <!-- DAW Workspace Screen Graphic -->
  <g transform="translate(24, 62)">
    <rect x="0" y="0" width="672" height="264" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.2" />

    <!-- Computer Monitor Frame -->
    <g transform="translate(20, 16)">
      <rect x="0" y="0" width="380" height="232" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
      
      <!-- DAW Menu Bar -->
      <rect x="0" y="0" width="380" height="24" rx="6" fill="#1e293b" />
      <circle cx="14" cy="12" r="4" fill="#ef4444" />
      <circle cx="26" cy="12" r="4" fill="#eab308" />
      <circle cx="38" cy="12" r="4" fill="#10b981" />
      <text x="60" y="16" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">Logic Pro X / Ableton Live — "Fast Car (Remix)" [100% In-The-Box]</text>

      <!-- DAW Tracks -->
      <g transform="translate(10, 32)">
        <!-- Track 1: Kick -->
        <rect x="0" y="0" width="360" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text x="10" y="18" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">1. Sampled Kick (4/4)</text>
        <rect x="130" y="5" width="220" height="18" fill="#881337" rx="3" />
        <text x="240" y="17" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">|| || || || || || || || (Sample Library)</text>

        <!-- Track 2: Tropical Pluck -->
        <rect x="0" y="34" width="360" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text x="10" y="52" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">2. Synth Pluck (Serum)</text>
        <rect x="130" y="39" width="220" height="18" fill="#0369a1" rx="3" />
        <text x="240" y="51" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">■ ■■ ■ ■■ ■ ■■ (MIDI Clips)</text>

        <!-- Track 3: Vocal Chops -->
        <rect x="0" y="68" width="360" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text x="10" y="86" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">3. Vocal Chops (EXS24)</text>
        <rect x="130" y="73" width="220" height="18" fill="#581c87" rx="3" />
        <text x="240" y="85" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">▰ ▰▰ ▰ ▰▰ (Pitch/Formant Slices)</text>

        <!-- Track 4: Sub Bass -->
        <rect x="0" y="102" width="360" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text x="10" y="120" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">4. Sub Bass (Massive)</text>
        <rect x="130" y="107" width="220" height="18" fill="#064e3b" rx="3" />
        <text x="240" y="119" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">Sidechained to Track 1 Kick</text>

        <!-- Track 5: White Noise Sweep -->
        <rect x="0" y="136" width="360" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
        <text x="10" y="154" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">5. Noise FX Riser</text>
        <rect x="130" y="141" width="220" height="18" fill="#78350f" rx="3" />
        <text x="240" y="153" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="8" text-anchor="middle">▲▲▲ Automation High-Pass Sweep</text>

        <!-- Bottom Transport -->
        <rect x="0" y="172" width="360" height="22" rx="4" fill="#1e293b" />
        <text x="180" y="187" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" text-anchor="middle">BPM: 114.00 • 4/4 • 100% Quantized • 0 Acoustic Room Mics</text>
      </g>
    </g>

    <!-- Right Side: Comparison Breakdown -->
    <g transform="translate(420, 16)">
      <rect x="0" y="0" width="232" height="110" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" />
      <text x="12" y="22" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800">IN-THE-BOX (JONAS BLUE)</text>
      <text x="12" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Virtual Software Synths (VST/AU)</text>
      <text x="12" y="56" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Commercial Drum Sample Packs</text>
      <text x="12" y="72" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Plugin EQs, Delays, Limiters</text>
      <text x="12" y="88" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Zero live microphone bleed</text>

      <g transform="translate(0, 122)">
        <rect x="0" y="0" width="232" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="12" y="22" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800">ACOUSTIC TRACKING (CHAPMAN)</text>
        <text x="12" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Live room acoustic space</text>
        <text x="12" y="56" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Microphones on acoustic guitar</text>
        <text x="12" y="72" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Live acoustic drum kit bleed</text>
        <text x="12" y="88" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Pristine analog studio console</text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 334)">
    <rect x="0" y="0" width="672" height="70" rx="8" fill="#0b1329" stroke="#334155" stroke-width="1.2" />
    <text x="16" y="22" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800">EXAM RELEVANCE: 'IN-THE-BOX' (ITB) DEFINITION</text>
    <text x="16" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Refers to audio tracks produced, arranged, mixed, and mastered entirely within digital audio workstation software without routing audio through analog mixing desks or hardware outboard gear.</text>
  </g>
</svg>