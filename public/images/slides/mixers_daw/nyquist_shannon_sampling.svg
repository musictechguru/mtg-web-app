<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background: #080d1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgNyq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="filterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="14" fill="url(#bgNyq)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2" />

  <text x="30" y="38" fill="#f59e0b" font-size="12" font-weight="800" letter-spacing="1.5">AO3 DIGITAL AUDIO PHYSICS &#8226; SAMPLING THEOREM</text>
  <text x="30" y="66" fill="#ffffff" font-size="20" font-weight="800">The Nyquist-Shannon Sampling Theorem &amp; Aliasing</text>
  <text x="30" y="86" fill="#94a3b8" font-size="12">Sampling rate must be at least double the highest audio frequency: fs &#8805; 2 &#8226; fmax (44.1 kHz captures up to 22.05 kHz)</text>

  <!-- PANEL 1: Time Domain Sampling (Left) -->
  <g transform="translate(30, 110)">
    <rect x="0" y="0" width="360" height="280" rx="8" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="16" y="24" fill="#38bdf8" font-size="12" font-weight="800">1. Time-Domain Discrete Sampling</text>

    <!-- Center Line -->
    <line x1="20" y1="140" x2="340" y2="140" stroke="#64748b" stroke-width="1.5" />
    <line x1="20" y1="40" x2="20" y2="240" stroke="#64748b" stroke-width="1.5" />

    <!-- Analog Waveform (Dashed guide) -->
    <path d="M 20,140 Q 60,60 100,140 T 180,140 T 260,140 T 340,140" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />

    <!-- Discrete Sample Stems & Dots -->
    <!-- Cycle 1 -->
    <line x1="20" y1="140" x2="20" y2="140" stroke="#38bdf8" stroke-width="2" /><circle cx="20" cy="140" r="3.5" fill="#38bdf8" />
    <line x1="40" y1="140" x2="40" y2="85" stroke="#38bdf8" stroke-width="2" /><circle cx="40" cy="85" r="3.5" fill="#38bdf8" />
    <line x1="60" y1="140" x2="60" y2="60" stroke="#38bdf8" stroke-width="2" /><circle cx="60" cy="60" r="3.5" fill="#38bdf8" />
    <line x1="80" y1="140" x2="80" y2="85" stroke="#38bdf8" stroke-width="2" /><circle cx="80" cy="85" r="3.5" fill="#38bdf8" />
    <line x1="100" y1="140" x2="100" y2="140" stroke="#38bdf8" stroke-width="2" /><circle cx="100" cy="140" r="3.5" fill="#38bdf8" />
    <line x1="120" y1="140" x2="120" y2="195" stroke="#38bdf8" stroke-width="2" /><circle cx="120" cy="195" r="3.5" fill="#38bdf8" />
    <line x1="140" y1="140" x2="140" y2="220" stroke="#38bdf8" stroke-width="2" /><circle cx="140" cy="220" r="3.5" fill="#38bdf8" />
    <line x1="160" y1="140" x2="160" y2="195" stroke="#38bdf8" stroke-width="2" /><circle cx="160" cy="195" r="3.5" fill="#38bdf8" />
    <line x1="180" y1="140" x2="180" y2="140" stroke="#38bdf8" stroke-width="2" /><circle cx="180" cy="140" r="3.5" fill="#38bdf8" />
    <line x1="200" y1="140" x2="200" y2="85" stroke="#38bdf8" stroke-width="2" /><circle cx="200" cy="85" r="3.5" fill="#38bdf8" />
    <line x1="220" y1="140" x2="220" y2="60" stroke="#38bdf8" stroke-width="2" /><circle cx="220" cy="60" r="3.5" fill="#38bdf8" />
    <line x1="240" y1="140" x2="240" y2="85" stroke="#38bdf8" stroke-width="2" /><circle cx="240" cy="85" r="3.5" fill="#38bdf8" />
    <line x1="260" y1="140" x2="260" y2="140" stroke="#38bdf8" stroke-width="2" /><circle cx="260" cy="140" r="3.5" fill="#38bdf8" />
    <line x1="280" y1="140" x2="280" y2="195" stroke="#38bdf8" stroke-width="2" /><circle cx="280" cy="195" r="3.5" fill="#38bdf8" />
    <line x1="300" y1="140" x2="300" y2="220" stroke="#38bdf8" stroke-width="2" /><circle cx="300" cy="220" r="3.5" fill="#38bdf8" />
    <line x1="320" y1="140" x2="320" y2="195" stroke="#38bdf8" stroke-width="2" /><circle cx="320" cy="195" r="3.5" fill="#38bdf8" />
    <line x1="340" y1="140" x2="340" y2="140" stroke="#38bdf8" stroke-width="2" /><circle cx="340" cy="140" r="3.5" fill="#38bdf8" />

    <text x="25" y="260" fill="#cbd5e1" font-size="10.5">Sample Interval: Ts = 1 / 44,100 s = 22.7 &#956;s</text>
  </g>

  <!-- PANEL 2: Frequency Domain & Anti-Aliasing Filter (Right) -->
  <g transform="translate(410, 110)">
    <rect x="0" y="0" width="360" height="280" rx="8" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="16" y="24" fill="#4ade80" font-size="12" font-weight="800">2. Frequency Domain &amp; Anti-Aliasing Filter</text>

    <!-- Axes -->
    <line x1="25" y1="220" x2="335" y2="220" stroke="#64748b" stroke-width="1.5" />
    <line x1="25" y1="50" x2="25" y2="220" stroke="#64748b" stroke-width="1.5" />

    <text x="335" y="238" fill="#94a3b8" font-size="9" text-anchor="end">Frequency (kHz)</text>
    <text x="15" y="45" fill="#94a3b8" font-size="9">Amplitude</text>

    <!-- Human Hearing Band -->
    <rect x="25" y="60" width="130" height="160" fill="#22c55e" fill-opacity="0.12" />
    <text x="90" y="100" fill="#4ade80" font-size="10" font-weight="700" text-anchor="middle">Audible Band</text>
    <text x="90" y="115" fill="#86efac" font-size="9" text-anchor="middle">20 Hz – 20 kHz</text>

    <!-- Nyquist Limit Line at 22.05 kHz -->
    <line x1="165" y1="50" x2="165" y2="220" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4" />
    <text x="165" y="42" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">Nyquist (fs/2)</text>
    <text x="165" y="235" fill="#fbbf24" font-size="9" font-weight="700" text-anchor="middle">22.05 kHz</text>

    <!-- Anti-Aliasing Low-Pass Filter Curve -->
    <path d="M 25,70 L 150,70 Q 165,70 168,160 L 172,220" fill="none" stroke="#38bdf8" stroke-width="3" />
    <text x="180" y="85" fill="#38bdf8" font-size="9.5" font-weight="700">Brickwall Filter</text>

    <!-- Aliasing Foldover Zone -->
    <rect x="175" y="60" width="150" height="160" fill="#ef4444" fill-opacity="0.12" />
    <text x="250" y="100" fill="#f87171" font-size="10" font-weight="700" text-anchor="middle">ALIASING ZONE</text>
    <text x="250" y="115" fill="#fca5a5" font-size="8.5" text-anchor="middle">Frequencies &gt; fs/2 fold back</text>
    <text x="250" y="128" fill="#fca5a5" font-size="8.5" text-anchor="middle">as harsh inharmonic distortion</text>

    <!-- Foldover Arrow -->
    <path d="M 240,160 C 210,130 190,130 140,165" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />
    <text x="190" y="185" fill="#f87171" font-size="8.5" font-weight="700">Foldover</text>
  </g>

  <!-- Summary Footer -->
  <rect x="30" y="410" width="740" height="48" rx="8" fill="#0e172a" stroke="rgba(255,255,255,0.08)" />
  <text x="45" y="432" fill="#fbbf24" font-size="11" font-weight="700">Edexcel Exam Rule:</text>
  <text x="175" y="432" fill="#cbd5e1" font-size="11">If an analog signal contains frequencies above fs/2 (e.g., 25 kHz sampled at 44.1 kHz),</text>
  <text x="45" y="448" fill="#94a3b8" font-size="10.5">it creates false ghost frequencies in the audible spectrum (44.1 - 25 = 19.1 kHz). Anti-aliasing filters prevent this.</text>
</svg>
