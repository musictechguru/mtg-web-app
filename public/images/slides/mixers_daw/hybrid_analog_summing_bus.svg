<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="360" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="30" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">HYBRID ANALOG SUMMING &amp; OUTBOARD SIGNAL FLOW</text>
  <text x="30" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Edexcel C3: Multi-channel D/A conversion &#8594; Passive/Active summing bus &#8594; Analog master chain &#8594; Stereo print</text>

  <!-- Stage 1: Digital DAW Session -->
  <g transform="translate(30, 80)" filter="url(#shadow)">
    <rect width="130" height="240" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="130" height="28" rx="8" fill="#2563eb" fill-opacity="0.2"/>
    <text x="65" y="19" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">DAW STEMS</text>
    
    <!-- Stems -->
    <rect x="12" y="38" width="106" height="22" rx="4" fill="#334155"/>
    <text x="20" y="53" fill="#cbd5e1" font-family="sans-serif" font-size="10">Drums 1-2 (D/A)</text>
    <rect x="12" y="66" width="106" height="22" rx="4" fill="#334155"/>
    <text x="20" y="81" fill="#cbd5e1" font-family="sans-serif" font-size="10">Bass 3-4 (D/A)</text>
    <rect x="12" y="94" width="106" height="22" rx="4" fill="#334155"/>
    <text x="20" y="109" fill="#cbd5e1" font-family="sans-serif" font-size="10">Guitars 5-6 (D/A)</text>
    <rect x="12" y="122" width="106" height="22" rx="4" fill="#334155"/>
    <text x="20" y="137" fill="#cbd5e1" font-family="sans-serif" font-size="10">Synths 7-8 (D/A)</text>
    <rect x="12" y="150" width="106" height="22" rx="4" fill="#334155"/>
    <text x="20" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="10">Lead Vox 9-10</text>
    <rect x="12" y="178" width="106" height="22" rx="4" fill="#334155"/>
    <text x="20" y="193" fill="#cbd5e1" font-family="sans-serif" font-size="10">Back Vox 11-12</text>
    <rect x="12" y="206" width="106" height="22" rx="4" fill="#334155"/>
    <text x="20" y="221" fill="#cbd5e1" font-family="sans-serif" font-size="10">FX Reverbs 13-16</text>
  </g>

  <!-- Flow Lines (16 Ch D/A) -->
  <path d="M 160 145 L 200 145 M 160 175 L 200 175 M 160 205 L 200 205" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="180" y="130" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">16 D/A Out</text>

  <!-- Stage 2: Analog Summing Mixer -->
  <g transform="translate(200, 95)" filter="url(#shadow)">
    <rect width="140" height="210" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="140" height="28" rx="8" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="70" y="19" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">SUMMING MIXER</text>
    
    <text x="15" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Resistor Matrix</text>
    <text x="15" y="75" fill="#94a3b8" font-family="sans-serif" font-size="9">Passive voltage sum</text>
    
    <text x="15" y="105" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Makeup Gain Amp</text>
    <text x="15" y="125" fill="#94a3b8" font-family="sans-serif" font-size="9">Discrete Class-A opamps</text>

    <text x="15" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Output Transformers</text>
    <text x="15" y="175" fill="#94a3b8" font-family="sans-serif" font-size="9">Harmonic saturation &amp; warmth</text>
    <text x="15" y="195" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="700">Stereo Out (L/R)</text>
  </g>

  <!-- Flow Lines (Stereo Balanced XLR) -->
  <path d="M 340 200 L 380 200" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="360" y="188" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Stereo L/R</text>

  <!-- Stage 3: Analog Outboard Master Chain -->
  <g transform="translate(380, 95)" filter="url(#shadow)">
    <rect width="140" height="210" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="140" height="28" rx="8" fill="#10b981" fill-opacity="0.15"/>
    <text x="70" y="19" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ANALOG CHAIN</text>
    
    <!-- Outboard 1: SSL Bus Comp -->
    <rect x="12" y="42" width="116" height="42" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="58" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="700">SSL G-Bus Comp</text>
    <text x="20" y="73" fill="#94a3b8" font-family="sans-serif" font-size="8.5">Glue, VCA compression</text>

    <!-- Outboard 2: Pultec EQ -->
    <rect x="12" y="94" width="116" height="42" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="110" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="700">Pultec Tube EQ</text>
    <text x="20" y="125" fill="#94a3b8" font-family="sans-serif" font-size="8.5">Low-end punch &amp; air</text>

    <!-- Outboard 3: Tape Saturation -->
    <rect x="12" y="146" width="116" height="48" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="162" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="700">Master Tape Machine</text>
    <text x="20" y="177" fill="#94a3b8" font-family="sans-serif" font-size="8.5">1/2" 30 ips tape warmth</text>
  </g>

  <!-- Flow Lines (Stereo Master Out) -->
  <path d="M 520 200 L 560 200" stroke="#10b981" stroke-width="2.5"/>
  <text x="540" y="188" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Processed</text>

  <!-- Stage 4: High-End A/D Converter & Print Track -->
  <g transform="translate(560, 95)" filter="url(#shadow)">
    <rect width="110" height="210" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="110" height="28" rx="8" fill="#8b5cf6" fill-opacity="0.15"/>
    <text x="55" y="19" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">PRINT TO DAW</text>
    
    <text x="12" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Mastering A/D</text>
    <text x="12" y="73" fill="#94a3b8" font-family="sans-serif" font-size="9">Lavry / Burl Mothership</text>

    <text x="12" y="105" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; Resolution</text>
    <text x="12" y="123" fill="#94a3b8" font-family="sans-serif" font-size="9">24-bit / 96 kHz</text>

    <text x="12" y="155" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="600">&#8226; DAW Print</text>
    <text x="12" y="173" fill="#c084fc" font-family="sans-serif" font-size="9" font-weight="700">Stereo Master Track</text>
    <text x="12" y="193" fill="#94a3b8" font-family="sans-serif" font-size="8.5">Archived with session</text>
  </g>
</svg>
