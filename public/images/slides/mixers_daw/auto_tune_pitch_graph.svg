<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background: #080d1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgAuto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="14" fill="url(#bgAuto)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2" />

  <text x="30" y="38" fill="#f59e0b" font-size="12" font-weight="800" letter-spacing="1.5">AO3 VOCAL PRODUCTION &#8226; PITCH CORRECTION</text>
  <text x="30" y="66" fill="#ffffff" font-size="20" font-weight="800">Antares Auto-Tune Graphical Pitch Quantisation</text>
  <text x="30" y="86" fill="#94a3b8" font-size="12">Phase vocoding pitch tracking, chromatic note scale snap, and retune speed response time</text>

  <!-- Main Pitch Grid Display -->
  <g transform="translate(30, 110)">
    <rect x="0" y="0" width="740" height="280" rx="8" fill="#131c31" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Musical Note Grid Lines (Y-Axis) -->
    <!-- Note E4 -->
    <line x1="80" y1="40" x2="720" y2="40" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <text x="65" y="44" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="end">E4 (330Hz)</text>

    <!-- Note D#4 -->
    <line x1="80" y1="85" x2="720" y2="85" stroke="#1e293b" stroke-width="1" />
    <text x="65" y="89" fill="#64748b" font-size="10" text-anchor="end">D#4</text>

    <!-- Note D4 -->
    <line x1="80" y1="130" x2="720" y2="130" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <text x="65" y="134" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="end">D4 (294Hz)</text>

    <!-- Note C#4 -->
    <line x1="80" y1="175" x2="720" y2="175" stroke="#1e293b" stroke-width="1" />
    <text x="65" y="179" fill="#64748b" font-size="10" text-anchor="end">C#4</text>

    <!-- Note C4 -->
    <line x1="80" y1="220" x2="720" y2="220" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <text x="65" y="224" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="end">C4 (261Hz)</text>

    <!-- Time Grid Lines (X-Axis) -->
    <line x1="200" y1="30" x2="200" y2="245" stroke="rgba(255,255,255,0.05)" />
    <line x1="340" y1="30" x2="340" y2="245" stroke="rgba(255,255,255,0.05)" />
    <line x1="480" y1="30" x2="480" y2="245" stroke="rgba(255,255,255,0.05)" />
    <line x1="620" y1="30" x2="620" y2="245" stroke="rgba(255,255,255,0.05)" />

    <!-- CURVE 1: Raw Human Vocal Pitch (Wobbly Blue) -->
    <path d="M 90,230 
             C 120,225 150,210 180,185 
             C 210,160 230,135 270,125 
             C 310,115 340,140 370,135 
             C 400,130 430,90 470,75 
             C 510,60 540,45 580,38 
             C 620,32 660,50 710,40" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.85" />
    <text x="180" y="160" fill="#38bdf8" font-size="10" font-weight="700">Raw Vocal (Natural Vibrato &amp; Drift)</text>

    <!-- CURVE 2: Hard-Tuned Robotic Snap (Retune Speed = 0, Red/Amber Stepped) -->
    <path d="M 90,220 L 220,220 L 220,130 L 440,130 L 440,40 L 710,40" 
          fill="none" stroke="url(#robotGrad)" stroke-width="3" />
    <text x="490" y="25" fill="#f87171" font-size="10.5" font-weight="800">Hard Retune (Speed = 0 ms &#8226; The "Cher Effect")</text>

    <!-- CURVE 3: Transparent Natural Tuning (Retune Speed = 25-50ms, Green) -->
    <path d="M 90,223 C 140,221 190,218 220,180 C 240,145 280,132 370,130 C 420,128 440,90 470,55 C 500,42 620,40 710,40" 
          fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="5,4" />
    <text x="270" y="105" fill="#4ade80" font-size="10" font-weight="700">Natural Tuning (Retune Speed = 35 ms)</text>

    <!-- Parameters Callout Bar -->
    <rect x="20" y="250" width="700" height="22" rx="4" fill="#080d1a" />
    <text x="35" y="265" fill="#94a3b8" font-size="9.5">Target Scale: <tspan fill="#ffffff" font-weight="700">A Minor / C Major</tspan></text>
    <text x="230" y="265" fill="#94a3b8" font-size="9.5">Tracking Algorithm: <tspan fill="#ffffff" font-weight="700">Phase Vocoder Auto-Correlation</tspan></text>
    <text x="490" y="265" fill="#94a3b8" font-size="9.5">Formant Control: <tspan fill="#ffffff" font-weight="700">Throat Length Corrected</tspan></text>
  </g>

  <!-- Summary Footer -->
  <rect x="30" y="410" width="740" height="48" rx="8" fill="#0e172a" stroke="rgba(255,255,255,0.08)" />
  <text x="45" y="432" fill="#fbbf24" font-size="11" font-weight="700">Edexcel Key Production Fact:</text>
  <text x="205" y="432" fill="#cbd5e1" font-size="11">Setting Retune Speed to zero forces pitch to snap instantly to the nearest chromatic note</text>
  <text x="45" y="448" fill="#94a3b8" font-size="10.5">with zero transition time, producing the iconic quantized, steppy vocal effect heard on Cher's "Believe" (1998).</text>
</svg>
