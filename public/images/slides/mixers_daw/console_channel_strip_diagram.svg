<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background: #080d1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgStrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>
    <linearGradient id="goldFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="blueFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" rx="14" fill="url(#bgStrip)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2" />

  <text x="30" y="38" fill="#f59e0b" font-size="12" font-weight="800" letter-spacing="1.5">AO3 CONSOLE ARCHITECTURE &#8226; SIGNAL FLOW</text>
  <text x="30" y="66" fill="#ffffff" font-size="20" font-weight="800">Analog Mixing Console Channel Strip Architecture</text>
  <text x="30" y="86" fill="#94a3b8" font-size="12">Standard modular signal flow from input transducer through preamps, dynamics, EQ, routing, and fader</text>

  <!-- Flow Blocks -->
  <!-- 1. Input Section -->
  <g transform="translate(30, 115)">
    <rect x="0" y="0" width="105" height="280" rx="8" fill="#131c31" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="0" y="0" width="105" height="28" rx="8" fill="#0284c7" fill-opacity="0.25" />
    <text x="52" y="19" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle">1. INPUT</text>
    
    <circle cx="52" cy="60" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="52" y="64" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">GAIN</text>
    <text x="52" y="88" fill="#94a3b8" font-size="9" text-anchor="middle">+10 to +65 dB</text>

    <rect x="15" y="105" width="75" height="22" rx="4" fill="#334155" />
    <text x="52" y="119" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">PAD -20dB</text>

    <rect x="15" y="140" width="75" height="22" rx="4" fill="#334155" />
    <text x="52" y="154" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">&#216; PHASE 180&#176;</text>

    <rect x="15" y="175" width="75" height="22" rx="4" fill="#334155" />
    <text x="52" y="189" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">+48V PHANTOM</text>

    <rect x="15" y="210" width="75" height="26" rx="4" fill="#0369a1" />
    <text x="52" y="226" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">MIC / LINE</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 140,250 L 160,250" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 2. HPF & Filters -->
  <g transform="translate(165, 115)">
    <rect x="0" y="0" width="105" height="280" rx="8" fill="#131c31" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="105" height="28" rx="8" fill="#f59e0b" fill-opacity="0.25" />
    <text x="52" y="19" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">2. FILTER</text>

    <circle cx="52" cy="70" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="52" y="74" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">HPF</text>
    <text x="52" y="102" fill="#94a3b8" font-size="9" text-anchor="middle">80 Hz 18dB/oct</text>
    <text x="52" y="125" fill="#cbd5e1" font-size="8.5" text-anchor="middle">Rumble cut</text>

    <line x1="15" y1="150" x2="90" y2="150" stroke="rgba(255,255,255,0.1)" />

    <rect x="15" y="180" width="75" height="30" rx="4" fill="#475569" />
    <text x="52" y="198" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">INSERT</text>
    <text x="52" y="222" fill="#94a3b8" font-size="8.5" text-anchor="middle">TRS Send/Ret</text>
  </g>

  <!-- 3. 4-Band Parametric EQ -->
  <g transform="translate(300, 115)">
    <rect x="0" y="0" width="125" height="280" rx="8" fill="#131c31" stroke="#22c55e" stroke-width="1.5" />
    <rect x="0" y="0" width="125" height="28" rx="8" fill="#22c55e" fill-opacity="0.25" />
    <text x="62" y="19" fill="#4ade80" font-size="11" font-weight="800" text-anchor="middle">3. 4-BAND EQ</text>

    <text x="12" y="55" fill="#e2e8f0" font-size="9" font-weight="700">HF Shelf (10-16kHz)</text>
    <line x1="12" y1="65" x2="112" y2="65" stroke="rgba(255,255,255,0.1)" />

    <text x="12" y="95" fill="#e2e8f0" font-size="9" font-weight="700">H-MID Parametric</text>
    <text x="12" y="110" fill="#94a3b8" font-size="8.5">Freq + Q + Gain</text>

    <text x="12" y="145" fill="#e2e8f0" font-size="9" font-weight="700">L-MID Parametric</text>
    <text x="12" y="160" fill="#94a3b8" font-size="8.5">Freq + Q + Gain</text>

    <text x="12" y="195" fill="#e2e8f0" font-size="9" font-weight="700">LF Shelf (60-100Hz)</text>
    <line x1="12" y1="205" x2="112" y2="205" stroke="rgba(255,255,255,0.1)" />

    <rect x="20" y="225" width="85" height="22" rx="4" fill="#15803d" />
    <text x="62" y="239" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">EQ IN / OUT</text>
  </g>

  <!-- 4. Dynamics & Aux -->
  <g transform="translate(455, 115)">
    <rect x="0" y="0" width="115" height="280" rx="8" fill="#131c31" stroke="#c084fc" stroke-width="1.5" />
    <rect x="0" y="0" width="115" height="28" rx="8" fill="#c084fc" fill-opacity="0.25" />
    <text x="57" y="19" fill="#e9d5ff" font-size="11" font-weight="800" text-anchor="middle">4. AUX &amp; DYN</text>

    <text x="14" y="55" fill="#ffffff" font-size="9" font-weight="700">Aux 1-2 (Pre)</text>
    <text x="14" y="70" fill="#94a3b8" font-size="8.5">Foldback / Cues</text>

    <text x="14" y="105" fill="#ffffff" font-size="9" font-weight="700">Aux 3-4 (Post)</text>
    <text x="14" y="120" fill="#94a3b8" font-size="8.5">Reverbs &amp; Delays</text>

    <line x1="14" y1="145" x2="100" y2="145" stroke="rgba(255,255,255,0.1)" />

    <text x="14" y="175" fill="#ffffff" font-size="9" font-weight="700">Channel Gate</text>
    <text x="14" y="205" fill="#ffffff" font-size="9" font-weight="700">Channel Comp</text>
    <text x="14" y="220" fill="#94a3b8" font-size="8.5">SSL E-Series Dyn</text>
  </g>

  <!-- 5. Pan & Fader -->
  <g transform="translate(600, 115)">
    <rect x="0" y="0" width="170" height="280" rx="8" fill="#131c31" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="0" y="0" width="170" height="28" rx="8" fill="#f59e0b" fill-opacity="0.25" />
    <text x="85" y="19" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">5. ROUTING &amp; FADER</text>

    <circle cx="85" cy="65" r="16" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
    <text x="85" y="69" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">PAN</text>
    <text x="85" y="95" fill="#94a3b8" font-size="9" text-anchor="middle">Stereo L / R Matrix</text>

    <rect x="20" y="115" width="130" height="20" rx="4" fill="#334155" />
    <text x="85" y="129" fill="#ffffff" font-size="8.5" font-weight="700" text-anchor="middle">BUS ASSIGN: 1-24</text>

    <!-- Fader Track -->
    <rect x="75" y="150" width="20" height="100" rx="4" fill="#0f172a" stroke="#475569" />
    <line x1="85" y1="155" x2="85" y2="245" stroke="#94a3b8" stroke-width="2" />
    <!-- Fader Knob at Unity 0dB -->
    <rect x="65" y="180" width="40" height="22" rx="4" fill="#f8fafc" stroke="#000" stroke-width="1.5" />
    <line x1="85" y1="180" x2="85" y2="202" stroke="#dc2626" stroke-width="2" />

    <text x="120" y="195" fill="#4ade80" font-size="10" font-weight="800">0 dB</text>
    <text x="85" y="268" fill="#cbd5e1" font-size="9" font-weight="700" text-anchor="middle">Main Mix Fader (VCA)</text>
  </g>

  <!-- Summary Footer -->
  <rect x="30" y="415" width="740" height="42" rx="8" fill="#0e172a" stroke="rgba(255,255,255,0.08)" />
  <text x="45" y="440" fill="#fbbf24" font-size="11" font-weight="700">Edexcel Key Knowledge:</text>
  <text x="185" y="440" fill="#94a3b8" font-size="11">Pre-fader sends feed monitors (unaffected by fader moves); post-fader sends feed effects (scales with volume).</text>
</svg>
