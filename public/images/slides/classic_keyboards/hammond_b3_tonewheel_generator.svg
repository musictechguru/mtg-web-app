<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#080e1a" rx="16"/>
  <text x="450" y="40" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Hammond B3 Synchronous Tonewheel Generator</text>
  <text x="450" y="65" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">91 Rotating Toothed Steel Discs on a Constant-Speed Synchronous Motor Drive Shaft</text>

  <!-- Central Rotating Tonewheel -->
  <g transform="translate(320, 230)">
    <circle cx="0" cy="0" r="110" fill="#1e293b" stroke="#64748b" stroke-width="4"/>
    <!-- Gear teeth on rim -->
    <path d="M-115,0 L-105,-15 L-105,15 Z" fill="#94a3b8"/>
    <path d="M115,0 L105,-15 L105,15 Z" fill="#94a3b8"/>
    <path d="M0,-115 L-15,-105 L15,-105 Z" fill="#94a3b8"/>
    <path d="M0,115 L-15,105 L15,105 Z" fill="#94a3b8"/>
    <path d="M-80,-80 L-75,-65 L-65,-75 Z" fill="#94a3b8"/>
    <path d="M80,80 L75,65 L65,75 Z" fill="#94a3b8"/>
    <path d="M-80,80 L-75,65 L-65,75 Z" fill="#94a3b8"/>
    <path d="M80,-80 L75,-65 L65,-75 Z" fill="#94a3b8"/>

    <!-- Drive Shaft Center -->
    <circle cx="0" cy="0" r="24" fill="#475569" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#f59e0b"/>
    <path d="M-45,-45 A65,65 0 0,1 45,-45" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="0" y="45" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Constant 1200 RPM</text>
  </g>

  <!-- Magnetic Pickup Assembly -->
  <g transform="translate(540, 190)">
    <!-- Permanent Magnet Rod -->
    <rect x="0" y="15" width="140" height="35" fill="#334155" stroke="#94a3b8" stroke-width="2" rx="4"/>
    <text x="40" y="37" fill="#ffffff" font-size="12" font-weight="800" font-family="system-ui, sans-serif">Permanent Magnet</text>
    <!-- Pole piece tip facing wheel -->
    <rect x="-25" y="25" width="25" height="15" fill="#cbd5e1" rx="2"/>

    <!-- Wire Coil -->
    <rect x="30" y="10" width="60" height="45" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="3 3"/>
    <text x="60" y="75" fill="#f59e0b" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Induction Coil</text>
    
    <!-- Sine Wave Output -->
    <path d="M150,32 Q170,10 190,32 T230,32 T270,32" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <text x="210" y="65" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Pure Sine Wave Voltage</text>
    <text x="210" y="80" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Passed to busbars &amp; drawbars</text>
  </g>

  <!-- Explanation points -->
  <rect x="50" y="375" width="800" height="95" fill="#0f172a" stroke="#f59e0b" rx="8"/>
  <text x="70" y="402" fill="#f59e0b" font-size="13" font-weight="800" font-family="system-ui, sans-serif">Key Mechanism Principles:</text>
  <text x="70" y="422" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">&bull; As metal teeth pass the magnet, magnetic reluctance varies, inducing a smooth alternating electric current.</text>
  <text x="70" y="440" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">&bull; Number of teeth (2 to 192) and gear ratio determine exact musical frequency &mdash; cannot go out of tune!</text>
  <text x="70" y="458" fill="#cbd5e1" font-size="12" font-family="system-ui, sans-serif">&bull; Unfiltered mechanical key contacts generate authentic transient &quot;Key Click&quot; &mdash; a cherished sonic trademark.</text>
</svg>