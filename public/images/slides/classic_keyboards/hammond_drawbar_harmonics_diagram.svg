<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#080e1a" rx="16"/>
  <text x="450" y="40" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Hammond Organ 9 Harmonic Drawbars (Additive Synthesis)</text>
  <text x="450" y="65" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">Traditional Pipe Footage Equivalents &bull; Sub-Octaves &bull; Fundamental &bull; Higher Harmonics</text>

  <!-- Drawbar groups -->
  <!-- White: Consonants / Octaves (8', 4', 2', 1') -->
  <!-- Brown/Black: Sub-harmonics (16', 5 1/3') -->
  <!-- Black: Dissonants / Mutation stops (2 2/3', 1 3/5', 1 1/3') -->

  <g transform="translate(80, 110)">
    <!-- Drawbar 1: 16' (Sub-octave) Brown -->
    <rect x="0" y="0" width="65" height="220" fill="#78350f" rx="4" stroke="#d97706" stroke-width="2"/>
    <rect x="15" y="160" width="35" height="40" fill="#b45309" rx="3"/>
    <text x="32" y="35" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">16&#39;</text>
    <text x="32" y="255" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Sub-Octave</text>
    <text x="32" y="270" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">-1 Octave</text>

    <!-- Drawbar 2: 5 1/3' (Sub-3rd / Quint) Brown -->
    <rect x="80" y="0" width="65" height="220" fill="#78350f" rx="4" stroke="#d97706" stroke-width="2"/>
    <rect x="95" y="140" width="35" height="40" fill="#b45309" rx="3"/>
    <text x="112" y="35" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">5 1/3&#39;</text>
    <text x="112" y="255" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Quint (5th)</text>
    <text x="112" y="270" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Sub-Fifth</text>

    <!-- Drawbar 3: 8' (Fundamental) Red / White -->
    <rect x="160" y="0" width="65" height="220" fill="#f8fafc" rx="4" stroke="#38bdf8" stroke-width="3"/>
    <rect x="175" y="60" width="35" height="40" fill="#0284c7" rx="3"/>
    <text x="192" y="35" fill="#080e1a" font-size="15" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">8&#39;</text>
    <text x="192" y="255" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Fundamental</text>
    <text x="192" y="270" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Unison Pitch</text>

    <!-- Drawbar 4: 4' (2nd Harmonic / +1 Oct) White -->
    <rect x="240" y="0" width="65" height="220" fill="#f8fafc" rx="4" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="255" y="100" width="35" height="40" fill="#64748b" rx="3"/>
    <text x="272" y="35" fill="#080e1a" font-size="14" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">4&#39;</text>
    <text x="272" y="255" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">2nd Harm</text>
    <text x="272" y="270" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">+1 Octave</text>

    <!-- Drawbar 5: 2 2/3' (3rd Harmonic / Nazard) Black -->
    <rect x="320" y="0" width="65" height="220" fill="#1e293b" rx="4" stroke="#c084fc" stroke-width="2"/>
    <rect x="335" y="130" width="35" height="40" fill="#9333ea" rx="3"/>
    <text x="352" y="35" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">2 2/3&#39;</text>
    <text x="352" y="255" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">3rd Harm</text>
    <text x="352" y="270" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">12th (Oct+5th)</text>

    <!-- Drawbar 6: 2' (4th Harmonic / Blockflote) White -->
    <rect x="400" y="0" width="65" height="220" fill="#f8fafc" rx="4" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="415" y="90" width="35" height="40" fill="#64748b" rx="3"/>
    <text x="432" y="35" fill="#080e1a" font-size="14" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">2&#39;</text>
    <text x="432" y="255" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">4th Harm</text>
    <text x="432" y="270" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">+2 Octaves</text>

    <!-- Drawbar 7: 1 3/5' (5th Harmonic / Tierce) Black -->
    <rect x="480" y="0" width="65" height="220" fill="#1e293b" rx="4" stroke="#c084fc" stroke-width="2"/>
    <rect x="495" y="150" width="35" height="40" fill="#9333ea" rx="3"/>
    <text x="512" y="35" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">1 3/5&#39;</text>
    <text x="512" y="255" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">5th Harm</text>
    <text x="512" y="270" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">17th (2 Oct+3rd)</text>

    <!-- Drawbar 8: 1 1/3' (6th Harmonic / Larigot) Black -->
    <rect x="560" y="0" width="65" height="220" fill="#1e293b" rx="4" stroke="#c084fc" stroke-width="2"/>
    <rect x="575" y="160" width="35" height="40" fill="#9333ea" rx="3"/>
    <text x="592" y="35" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">1 1/3&#39;</text>
    <text x="592" y="255" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">6th Harm</text>
    <text x="592" y="270" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">19th (2 Oct+5th)</text>

    <!-- Drawbar 9: 1' (8th Harmonic / Sifflote) White -->
    <rect x="640" y="0" width="65" height="220" fill="#f8fafc" rx="4" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="655" y="120" width="35" height="40" fill="#64748b" rx="3"/>
    <text x="672" y="35" fill="#080e1a" font-size="14" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">1&#39;</text>
    <text x="672" y="255" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">8th Harm</text>
    <text x="672" y="270" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">+3 Octaves</text>
  </g>

  <!-- Settings callout -->
  <rect x="50" y="410" width="800" height="55" fill="#0f172a" stroke="#c084fc" rx="8"/>
  <text x="450" y="432" fill="#c084fc" font-size="13" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Classic Drawbar Presets (Volume steps 0 to 8):</text>
  <text x="450" y="452" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Gospel / Jazz Jimmy Smith: 888 000 000 &bull; Rock Jon Lord / Deep Purple: 888 888 888 (All Out Full Screamer)</text>
</svg>