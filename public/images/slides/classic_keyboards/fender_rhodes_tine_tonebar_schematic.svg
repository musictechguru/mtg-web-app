<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#080e1a" rx="16"/>
  <text x="450" y="40" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Fender Rhodes Sound Generation &amp; Electromagnetic Transduction</text>
  <text x="450" y="65" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">Neoprene Hammer &bull; Tapered Steel Tine &bull; Heavy Tonebar Resonator &bull; Electromagnetic Pickup</text>

  <!-- Tonebar (Heavy cast metal resonator) -->
  <rect x="280" y="120" width="450" height="35" fill="#475569" stroke="#94a3b8" stroke-width="2" rx="4"/>
  <text x="505" y="143" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Cast Steel Tonebar (Tuning Fork Upper Arm &amp; Resonator)</text>

  <!-- Mounting block connecting tine and tonebar -->
  <rect x="240" y="120" width="40" height="80" fill="#334155" stroke="#64748b" stroke-width="2" rx="4"/>

  <!-- Steel Tine (Thin flexible lower arm) -->
  <line x1="280" y1="195" x2="640" y2="195" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <!-- Tuning spring on tine -->
  <rect x="580" y="187" width="30" height="16" fill="#f59e0b" stroke="#b45309" stroke-width="2" rx="2"/>
  <text x="595" y="225" fill="#f59e0b" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Tuning Spring</text>

  <text x="430" y="225" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Tapered Steel Tine (Vibrating Lower Arm)</text>
  <path d="M620,185 Q640,195 620,205" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Hammer Action -->
  <g transform="translate(150, 260)">
    <!-- Key mechanism -->
    <rect x="-70" y="90" width="200" height="18" fill="#ffffff" rx="3"/>
    <text x="30" y="103" fill="#080e1a" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Piano Key</text>
    <!-- Hammer shank -->
    <line x1="30" y1="90" x2="90" y2="-30" stroke="#94a3b8" stroke-width="4"/>
    <!-- Neoprene hammer tip -->
    <rect x="80" y="-55" width="22" height="28" fill="#f43f5e" stroke="#be123c" stroke-width="2" rx="4"/>
    <text x="115" y="-40" fill="#f43f5e" font-size="12" font-weight="800" font-family="system-ui, sans-serif">Neoprene Hammer Tip</text>
    <text x="115" y="-25" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Strikes underside of tine</text>
  </g>

  <!-- Electromagnetic Pickup -->
  <g transform="translate(670, 155)">
    <rect x="0" y="20" width="120" height="40" fill="#1e293b" stroke="#34d399" stroke-width="2" rx="6"/>
    <!-- Coil winding lines -->
    <line x1="20" y1="25" x2="20" y2="55" stroke="#f59e0b" stroke-width="2"/>
    <line x1="30" y1="25" x2="30" y2="55" stroke="#f59e0b" stroke-width="2"/>
    <line x1="40" y1="25" x2="40" y2="55" stroke="#f59e0b" stroke-width="2"/>
    <!-- Magnet Pole Piece -->
    <rect x="-15" y="32" width="15" height="16" fill="#cbd5e1" stroke="#64748b" stroke-width="1" rx="2"/>
    <text x="60" y="45" fill="#34d399" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Pickup Coil</text>
    <text x="0" y="80" fill="#34d399" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Electromagnetic Pickup</text>
    <text x="0" y="95" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">1 coil per tine (induction)</text>
  </g>

  <!-- Timbral callout -->
  <rect x="50" y="410" width="800" height="55" fill="#0f172a" stroke="#38bdf8" rx="8"/>
  <text x="450" y="432" fill="#38bdf8" font-size="13" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Timbral Identity: Bell-like, mellow, crystalline attack with rich fundamental and long sustain.</text>
  <text x="450" y="452" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Suitcase models feature optical stereo auto-pan tremolo modulating between two 12&quot; speakers.</text>
</svg>