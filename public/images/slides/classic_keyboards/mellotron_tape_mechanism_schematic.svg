<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#080e1a" rx="16"/>
  <text x="450" y="40" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Mellotron M400 Mechanical Tape Replay Action</text>
  <text x="450" y="65" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">Physical 3/8&quot; Magnetic Tape Strip &bull; Capstan Drive &bull; Playback Head &bull; 8-Second Spring Return</text>

  <!-- Key Lever -->
  <rect x="50" y="110" width="280" height="24" fill="#ffffff" rx="4" stroke="#94a3b8" stroke-width="2"/>
  <text x="65" y="127" fill="#0f172a" font-size="12" font-weight="800" font-family="system-ui, sans-serif">35-Note Keyboard Key (Depressed)</text>
  
  <!-- Pivot Point -->
  <circle cx="280" cy="122" r="6" fill="#ef4444"/>
  <text x="295" y="126" fill="#ef4444" font-size="11" font-family="system-ui, sans-serif">Pivot</text>

  <!-- Key Pushrod / Arm -->
  <line x1="220" y1="134" x2="220" y2="190" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="2 2"/>
  <polygon points="215,190 225,190 220,200" fill="#cbd5e1"/>

  <!-- Pinch Roller -->
  <circle cx="220" cy="225" r="22" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
  <text x="220" y="229" fill="#080e1a" font-size="10" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Pinch</text>
  <text x="165" y="215" fill="#38bdf8" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Pinch Roller</text>
  <text x="165" y="230" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">(Pushed down by key)</text>

  <!-- Rotating Capstan Shaft -->
  <circle cx="220" cy="285" r="26" fill="#f59e0b" stroke="#d97706" stroke-width="4"/>
  <text x="220" y="289" fill="#080e1a" font-size="11" font-weight="900" text-anchor="middle" font-family="system-ui, sans-serif">Capstan</text>
  <path d="M205,260 A28,28 0 0,1 245,270" fill="none" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="285" fill="#f59e0b" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Spinning Capstan Shaft</text>
  <text x="260" y="300" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Continuous motor drive across all keys</text>

  <!-- Magnetic Playback Head -->
  <rect x="390" y="235" width="65" height="55" fill="#c084fc" stroke="#9333ea" stroke-width="3" rx="6"/>
  <text x="422" y="260" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Tape</text>
  <text x="422" y="275" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Head</text>
  <text x="380" y="215" fill="#c084fc" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Magnetic Playback Head</text>
  <text x="380" y="310" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Selects Track A, B, or C</text>

  <!-- Tape Path -->
  <!-- Storage Bin Left -->
  <rect x="80" y="240" width="80" height="170" fill="#0f172a" stroke="#334155" stroke-width="2" rx="6"/>
  <text x="120" y="325" fill="#64748b" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Tape Bin</text>
  
  <!-- Tape line passing through -->
  <path d="M120,240 Q130,225 210,255 L390,255 L460,255 Q560,255 580,300 L600,410" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round"/>
  <text x="290" y="245" fill="#a855f7" font-size="12" font-weight="800" font-family="system-ui, sans-serif">3/8&quot; Magnetic Tape Strip (8-Sec Audio)</text>

  <!-- Return Spring & Pulley -->
  <circle cx="580" cy="300" r="16" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <path d="M600,410 C590,380 610,350 600,320 C590,290 610,260 600,230" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="630" y="270" fill="#34d399" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Mechanical Return Spring</text>
  <text x="630" y="290" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Snaps tape back into storage bin</text>
  <text x="630" y="305" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">immediately upon key release</text>

  <!-- Audio Output Signal -->
  <path d="M455,260 L500,260 L520,220 L540,260 L560,260" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="500" y="200" fill="#38bdf8" font-size="12" font-weight="700" font-family="system-ui, sans-serif">Preamplifier &amp; Audio Out</text>

  <!-- 8 Second Limit Callout Box -->
  <rect x="50" y="430" width="800" height="48" fill="#1e1b4b" stroke="#6366f1" rx="8"/>
  <text x="450" y="458" fill="#c7d2fe" font-size="13" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Exam Rule: Notes cannot sustain beyond 8 seconds. Once tape runs out, sound dies until key is released.</text>
</svg>