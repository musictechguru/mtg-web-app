<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#080e1a" rx="16"/>
  <text x="450" y="40" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Hohner Clavinet D6 Tangent &amp; String Action</text>
  <text x="450" y="65" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">Rubber Tangent Strikes Actual Guitar String Against Metal Anvil &bull; Dual Single-Coil Pickups</text>

  <!-- Actual Guitar String -->
  <line x1="80" y1="190" x2="820" y2="190" stroke="#fbbf24" stroke-width="4"/>
  <text x="450" y="175" fill="#fbbf24" font-size="14" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Actual Steel Guitar String (Tuned under tension)</text>

  <!-- Metal Anvil -->
  <rect x="280" y="130" width="30" height="56" fill="#64748b" stroke="#94a3b8" stroke-width="2" rx="3"/>
  <text x="295" y="115" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Metal Anvil</text>

  <!-- Rubber Tangent on Key -->
  <rect x="282" y="194" width="26" height="35" fill="#f97316" stroke="#ea580c" stroke-width="2" rx="4"/>
  <text x="295" y="245" fill="#f97316" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Rubber Tangent Tip</text>

  <!-- Piano Key Shaft -->
  <rect x="160" y="260" width="270" height="20" fill="#ffffff" rx="4" stroke="#cbd5e1"/>
  <text x="220" y="275" fill="#080e1a" font-size="11" font-weight="800" font-family="system-ui, sans-serif">Clavinet Key</text>
  <line x1="295" y1="229" x2="295" y2="260" stroke="#cbd5e1" stroke-width="4"/>

  <!-- Wool Yarn Muting on Left (Damps non-speaking length) -->
  <rect x="80" y="182" width="170" height="16" fill="#a855f7" opacity="0.7" rx="3"/>
  <text x="165" y="170" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Wool Yarn (Mutes Non-Speaking String)</text>

  <!-- Dual Single-Coil Pickups -->
  <g transform="translate(600, 150)">
    <!-- Bridge Pickup -->
    <rect x="0" y="0" width="40" height="80" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="4"/>
    <circle cx="20" cy="40" r="8" fill="#38bdf8"/>
    <text x="20" y="100" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Neck Pickup</text>

    <!-- Neck Pickup -->
    <rect x="80" y="0" width="40" height="80" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="4"/>
    <circle cx="100" cy="40" r="8" fill="#38bdf8"/>
    <text x="100" y="100" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Bridge Pickup</text>
  </g>

  <!-- Castle Switches -->
  <g transform="translate(540, 290)">
    <rect x="0" y="0" width="280" height="65" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" rx="6"/>
    <text x="15" y="22" fill="#fbbf24" font-size="12" font-weight="800" font-family="system-ui, sans-serif">Castle EQ Rocker Switches:</text>
    <text x="15" y="42" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">Brilliant &bull; Treble &bull; Medium &bull; Soft</text>
    <text x="15" y="58" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Pickup selector: A/B (single) or C/D (both in/out of phase)</text>
  </g>

  <!-- Callout box -->
  <rect x="50" y="410" width="800" height="55" fill="#0f172a" stroke="#fbbf24" rx="8"/>
  <text x="450" y="432" fill="#fbbf24" font-size="13" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Timbral Identity: Hyper-percussive, twangy, rhythmic clavichord bite with zero mechanical sustain.</text>
  <text x="450" y="452" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Definitive Funk instrument. Famous: Stevie Wonder &quot;Superstition&quot;, Parliament, Herbie Hancock &quot;Head Hunters&quot;.</text>
</svg>