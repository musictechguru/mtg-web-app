<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#080e1a" rx="16"/>
  <text x="450" y="40" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Wurlitzer 200A Sound Generation &amp; Electrostatic Transduction</text>
  <text x="450" y="65" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">Tuned Flat Steel Reed &bull; Polarized Electrostatic Comb Plate (~170V DC) &bull; Felt Hammer Attack</text>

  <!-- Heavy Reed Bar (Mounting Block) -->
  <rect x="100" y="160" width="140" height="80" fill="#334155" stroke="#64748b" stroke-width="3" rx="6"/>
  <text x="170" y="195" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Reed Bar</text>
  <text x="170" y="215" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">(Grounded Chassis)</text>

  <!-- Steel Reed -->
  <rect x="240" y="190" width="360" height="16" fill="#34d399" stroke="#059669" stroke-width="2" rx="2"/>
  <!-- Solder pyramid for fine tuning -->
  <polygon points="580,190 600,190 590,175" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  <text x="590" y="165" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle" font-family="system-ui, sans-serif">Tuning Solder</text>

  <text x="400" y="175" fill="#34d399" font-size="13" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Flat Tempered Steel Reed (Vibrates when struck)</text>
  <path d="M580,180 Q610,198 580,216" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Electrostatic Pickup (Polarized Comb Plate) -->
  <rect x="550" y="130" width="90" height="40" fill="#1e293b" stroke="#f43f5e" stroke-width="2" rx="4"/>
  <rect x="550" y="226" width="90" height="40" fill="#1e293b" stroke="#f43f5e" stroke-width="2" rx="4"/>
  <text x="595" y="155" fill="#f43f5e" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">+170V DC</text>
  <text x="595" y="251" fill="#f43f5e" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Pickup Plate</text>

  <text x="660" y="195" fill="#f43f5e" font-size="13" font-weight="800" font-family="system-ui, sans-serif">Electrostatic Pickup Plate</text>
  <text x="660" y="215" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">High DC voltage polarized capacitor.</text>
  <text x="660" y="230" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Vibration changes capacitance &rarr; AC voltage</text>

  <!-- Hammer Action -->
  <g transform="translate(350, 310)">
    <!-- Key mechanism -->
    <rect x="-160" y="60" width="240" height="18" fill="#ffffff" rx="3"/>
    <text x="-40" y="73" fill="#080e1a" font-size="11" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Piano Key</text>
    <!-- Felt hammer -->
    <line x1="-40" y1="60" x2="10" y2="-50" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="15" cy="-65" r="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text x="40" y="-60" fill="#e2e8f0" font-size="12" font-weight="800" font-family="system-ui, sans-serif">Felt Hammer Head</text>
    <text x="40" y="-45" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif">Strikes upward against steel reed</text>
  </g>

  <!-- Callout box -->
  <rect x="50" y="410" width="800" height="55" fill="#0f172a" stroke="#34d399" rx="8"/>
  <text x="450" y="432" fill="#34d399" font-size="13" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Timbral Identity: Biting, punchy, barking midrange with natural distortion when struck hard.</text>
  <text x="450" y="452" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Built-in optical vibrato circuit (amplitude modulation). Famous: Supertramp, Ray Charles, Queen.</text>
</svg>