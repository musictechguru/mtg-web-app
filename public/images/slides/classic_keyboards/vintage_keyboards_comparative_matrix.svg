<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#080e1a" rx="16"/>
  <text x="500" y="45" fill="#ffffff" font-size="24" font-weight="800" text-anchor="middle" font-family="system-ui, sans-serif">Classic Electro-Mechanical Keyboards Comparison</text>
  <text x="500" y="75" fill="#94a3b8" font-size="14" text-anchor="middle" font-family="system-ui, sans-serif">Sound Generation, Transduction Methods, Timbral Characteristics &amp; Key Exam Signatures</text>

  <!-- Headers -->
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1">
    <rect x="30" y="100" width="940" height="40" fill="#1e293b" rx="8"/>
    <text x="50" y="125" fill="#c084fc">Instrument</text>
    <text x="190" y="125" fill="#38bdf8">Tone Source</text>
    <text x="340" y="125" fill="#34d399">Transducer / Pickup</text>
    <text x="530" y="125" fill="#fbbf24">Signature Timbre</text>
    <text x="750" y="125" fill="#f472b6">Landmark Track</text>
  </g>

  <!-- Row 1: Mellotron -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
    <rect x="30" y="150" width="940" height="75" fill="#0f172a" stroke="#1e293b" rx="8"/>
    <text x="50" y="182" font-weight="700" fill="#ffffff" font-size="14">Mellotron M400</text>
    <text x="50" y="202" fill="#c084fc" font-size="11">Tape-Replay</text>
    <text x="190" y="182">3/8&quot; Magnetic Tape</text>
    <text x="190" y="202" fill="#94a3b8">(35 individual strips)</text>
    <text x="340" y="182">Magnetic Playback Head</text>
    <text x="340" y="202" fill="#94a3b8">(Pinch roller + capstan)</text>
    <text x="530" y="182">8-sec max note limit,</text>
    <text x="530" y="202" fill="#fbbf24">tape flutter, flute/strings</text>
    <text x="750" y="182" font-weight="600" fill="#ffffff">Strawberry Fields Forever</text>
    <text x="750" y="202" fill="#94a3b8">The Beatles (1967)</text>
  </g>

  <!-- Row 2: Rhodes -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
    <rect x="30" y="235" width="940" height="75" fill="#0f172a" stroke="#1e293b" rx="8"/>
    <text x="50" y="267" font-weight="700" fill="#ffffff" font-size="14">Fender Rhodes</text>
    <text x="50" y="287" fill="#38bdf8" font-size="11">Electric Piano</text>
    <text x="190" y="267">Tapered Steel Tines</text>
    <text x="190" y="287" fill="#94a3b8">+ Heavy Tonebars</text>
    <text x="340" y="267">Electromagnetic Pickups</text>
    <text x="340" y="287" fill="#94a3b8">(1 coil per tine, like guitar)</text>
    <text x="530" y="267">Warm, bell-like chime,</text>
    <text x="530" y="287" fill="#fbbf24">stereo auto-pan tremolo</text>
    <text x="750" y="267" font-weight="600" fill="#ffffff">Chameleon / Babylon Sisters</text>
    <text x="750" y="287" fill="#94a3b8">Herbie Hancock / Steely Dan</text>
  </g>

  <!-- Row 3: Wurlitzer -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
    <rect x="30" y="320" width="940" height="75" fill="#0f172a" stroke="#1e293b" rx="8"/>
    <text x="50" y="352" font-weight="700" fill="#ffffff" font-size="14">Wurlitzer 200A</text>
    <text x="50" y="372" fill="#34d399" font-size="11">Electric Piano</text>
    <text x="190" y="352">Tuned Flat Steel Reeds</text>
    <text x="190" y="372" fill="#94a3b8">(Struck by felt hammers)</text>
    <text x="340" y="352">Electrostatic Pickup</text>
    <text x="340" y="372" fill="#94a3b8">(Polarized plate ~170V DC)</text>
    <text x="530" y="352">Biting, barking midrange,</text>
    <text x="530" y="372" fill="#fbbf24">natural valve overdrive</text>
    <text x="750" y="352" font-weight="600" fill="#ffffff">The Logical Song / What&#39;d I Say</text>
    <text x="750" y="372" fill="#94a3b8">Supertramp / Ray Charles</text>
  </g>

  <!-- Row 4: Clavinet -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
    <rect x="30" y="405" width="940" height="75" fill="#0f172a" stroke="#1e293b" rx="8"/>
    <text x="50" y="437" font-weight="700" fill="#ffffff" font-size="14">Hohner Clavinet D6</text>
    <text x="50" y="457" fill="#fbbf24" font-size="11">Electric Clavichord</text>
    <text x="190" y="437">Real Guitar Strings</text>
    <text x="190" y="457" fill="#94a3b8">(Rubber tangent strikes anvil)</text>
    <text x="340" y="437">Dual Single-Coil Pickups</text>
    <text x="340" y="457" fill="#94a3b8">(Castle filter switches)</text>
    <text x="530" y="437">Staccato, percussive twang,</text>
    <text x="530" y="457" fill="#fbbf24">often paired with Wah pedal</text>
    <text x="750" y="437" font-weight="600" fill="#ffffff">Superstition</text>
    <text x="750" y="457" fill="#94a3b8">Stevie Wonder (1972)</text>
  </g>

  <!-- Row 5: Hammond B3 -->
  <g font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">
    <rect x="30" y="490" width="940" height="85" fill="#0f172a" stroke="#1e293b" rx="8"/>
    <text x="50" y="522" font-weight="700" fill="#ffffff" font-size="14">Hammond B3 Organ</text>
    <text x="50" y="542" fill="#f472b6" font-size="11">+ Leslie 122 Cabinet</text>
    <text x="190" y="522">91 Spinning Tonewheels</text>
    <text x="190" y="542" fill="#94a3b8">Synchronous motor shaft</text>
    <text x="340" y="522">Magnetic Coil Induction</text>
    <text x="340" y="542" fill="#94a3b8">9 additive drawbars</text>
    <text x="530" y="522">Transient key click, harmonic</text>
    <text x="530" y="542" fill="#fbbf24">percussion, Leslie Doppler</text>
    <text x="750" y="522" font-weight="600" fill="#ffffff">Green Onions / Highway Star</text>
    <text x="750" y="542" fill="#94a3b8">Booker T. / Deep Purple</text>
  </g>
</svg>