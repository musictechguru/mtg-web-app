<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="960" height="480" fill="#080e1a"/>
  <rect x="15" y="15" width="930" height="450" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <text x="40" y="52" fill="#38bdf8" font-size="13" font-weight="800" letter-spacing="1.5">ACOUSTIC CABINET ENCLOSURE PHYSICS</text>
  <text x="40" y="82" fill="#ffffff" font-size="22" font-weight="800">Open-Back Combo vs. Closed-Back 4x12 Sealed Cabinet</text>

  <!-- Left: Open-Back Combo -->
  <g transform="translate(50, 110)">
    <rect width="410" height="325" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="30" y="38" fill="#38bdf8" font-size="16" font-weight="800">Open-Back Enclosure (e.g. Fender Twin, AC30)</text>
    <text x="30" y="58" fill="#94a3b8" font-size="11.5">360° Omnidirectional Room Dispersion • High Spill</text>

    <!-- Cabinet Cross Section -->
    <rect x="130" y="85" width="150" height="110" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- Open Back opening -->
    <line x1="130" y1="100" x2="130" y2="180" stroke="#0f172a" stroke-width="4"/>
    <!-- Speaker Cone -->
    <path d="M 260 110 L 230 140 L 260 170" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <!-- Forward sound waves -->
    <path d="M 280 120 A 40 40 0 0 1 280 160" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
    <path d="M 300 110 A 60 60 0 0 1 300 170" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <!-- Rear out of phase sound waves -->
    <path d="M 115 125 A 30 30 0 0 0 115 155" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
    <path d="M 95 115 A 50 50 0 0 0 95 165" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

    <text x="205" y="225" fill="#f43f5e" font-size="10.5" font-weight="700" text-anchor="middle">⚠️ Antiphase Rear Waves Cancel Deep Bass</text>

    <text x="30" y="255" fill="#cbd5e1" font-size="12">• Sound escapes from front and rear of speaker chassis.</text>
    <text x="30" y="275" fill="#cbd5e1" font-size="12">• Rear wave is 180° out-of-phase with front wave.</text>
    <text x="30" y="295" fill="#cbd5e1" font-size="12">• Creates spatial ambiance, but causes low-end phase cancellation.</text>
    <text x="30" y="315" fill="#38bdf8" font-size="11" font-weight="700">Timbre: Airy, 3D room feel, open chiming cleans.</text>
  </g>

  <!-- Right: Closed-Back Sealed Cabinet -->
  <g transform="translate(500, 110)">
    <rect width="410" height="325" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="30" y="38" fill="#22c55e" font-size="16" font-weight="800">Closed-Back Enclosure (e.g. Marshall 1960 4x12)</text>
    <text x="30" y="58" fill="#94a3b8" font-size="11.5">Directional Forward Punch • Tight Sub Resonance</text>

    <!-- Cabinet Cross Section -->
    <rect x="130" y="85" width="150" height="110" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- Sealed back solid line -->
    <line x1="130" y1="85" x2="130" y2="195" stroke="#22c55e" stroke-width="4"/>
    <!-- Speaker Cone -->
    <path d="M 260 110 L 230 140 L 260 170" stroke="#22c55e" stroke-width="3" fill="none"/>
    <!-- Forward sound waves (stronger) -->
    <path d="M 280 120 A 40 40 0 0 1 280 160" stroke="#22c55e" stroke-width="3" fill="none"/>
    <path d="M 305 105 A 70 70 0 0 1 305 175" stroke="#22c55e" stroke-width="2.5" fill="none"/>
    <path d="M 330 95 A 100 100 0 0 1 330 185" stroke="#22c55e" stroke-width="2" fill="none"/>

    <text x="205" y="225" fill="#22c55e" font-size="10.5" font-weight="700" text-anchor="middle">✓ Trapped Air Acts as Acoustic Spring (Damping)</text>

    <text x="30" y="255" fill="#cbd5e1" font-size="12">• Cabinet completely sealed; rear wave trapped inside.</text>
    <text x="30" y="275" fill="#cbd5e1" font-size="12">• Trapped air cushions cone motion, preventing over-excursion.</text>
    <text x="30" y="295" fill="#cbd5e1" font-size="12">• Eliminates phase cancellation, creating tight, punchy low-end.</text>
    <text x="30" y="315" fill="#22c55e" font-size="11" font-weight="700">Timbre: Focused forward projection, tight palm-mute thump.</text>
  </g>
</svg>