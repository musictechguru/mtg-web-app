<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="#080e1a"/>
  <rect x="15" y="15" width="930" height="450" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <text x="40" y="52" fill="#38bdf8" font-size="13" font-weight="800" letter-spacing="1.5">STUDIO RECORDING WORKFLOW • COMPONENT 1 &amp; COMPONENT 3</text>
  <text x="40" y="82" fill="#ffffff" font-size="22" font-weight="800">Bass Guitar: The DI Box &amp; Mic'd Amplifier Parallel Blend</text>

  <!-- Bass Player -->
  <g transform="translate(40, 180)">
    <rect width="120" height="130" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="60" y="35" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle">FENDER PRECISION</text>
    <text x="60" y="55" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">Bass Guitar</text>
    <circle cx="60" cy="85" r="16" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="60" cy="85" r="6" fill="#38bdf8"/>
    <text x="60" y="118" fill="#94a3b8" font-size="10" text-anchor="middle">Passive Hi-Z Signal</text>
  </g>

  <!-- Line to DI Box -->
  <line x1="160" y1="245" x2="210" y2="245" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Active DI Box -->
  <g transform="translate(215, 170)">
    <rect width="140" height="150" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="70" y="30" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle">DIRECT INJECTION</text>
    <text x="70" y="50" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">Active DI Box</text>
    <rect x="20" y="65" width="100" height="22" rx="4" fill="#1e293b"/>
    <text x="70" y="80" fill="#fbbf24" font-size="9.5" font-weight="700" text-anchor="middle">Impedance Transformer</text>
    <text x="70" y="110" fill="#cbd5e1" font-size="10" text-anchor="middle">Hi-Z In → Lo-Z Balanced Out</text>
    <text x="70" y="130" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Unbuffered THRU Jack</text>
  </g>

  <!-- Branch 1: Balanced XLR directly to Console (Upper Path) -->
  <path d="M 355 210 L 460 210 L 460 150 L 680 150" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>
  <rect x="480" y="130" width="170" height="36" rx="6" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1"/>
  <text x="565" y="145" fill="#22c55e" font-size="10.5" font-weight="800" text-anchor="middle">PATH A: BALANCED XLR DI</text>
  <text x="565" y="158" fill="#e2e8f0" font-size="9" text-anchor="middle">Ultra-clean sub, zero spill, transients</text>

  <!-- Branch 2: Thru Jack to Amp Head & Cab (Lower Path) -->
  <path d="M 355 285 L 430 285" stroke="#fbbf24" stroke-width="2.5" fill="none" marker-end="url(#arrow2)"/>

  <!-- Bass Amp & 8x10 Cabinet -->
  <g transform="translate(435, 235)">
    <rect width="130" height="165" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="65" y="24" fill="#fbbf24" font-size="10.5" font-weight="800" text-anchor="middle">AMPEG SVT RIG</text>
    <!-- Amp Head -->
    <rect x="15" y="35" width="100" height="28" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <circle cx="35" cy="49" r="4" fill="#fbbf24"/>
    <circle cx="55" cy="49" r="4" fill="#fbbf24"/>
    <!-- 8x10 Cab -->
    <rect x="15" y="70" width="100" height="85" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <circle cx="40" cy="90" r="10" fill="none" stroke="#475569" stroke-width="1"/>
    <circle cx="75" cy="90" r="10" fill="none" stroke="#475569" stroke-width="1"/>
    <circle cx="40" cy="115" r="10" fill="none" stroke="#475569" stroke-width="1"/>
    <circle cx="75" cy="115" r="10" fill="none" stroke="#475569" stroke-width="1"/>
    <circle cx="40" cy="140" r="10" fill="none" stroke="#475569" stroke-width="1"/>
    <circle cx="75" cy="140" r="10" fill="none" stroke="#475569" stroke-width="1"/>
  </g>

  <!-- Mic in front of Cab -->
  <g transform="translate(585, 305)">
    <rect width="45" height="24" rx="4" fill="#38bdf8"/>
    <line x1="60" y1="317" x2="680" y2="317" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow2)"/>
    <text x="22" y="16" fill="#080e1a" font-size="8.5" font-weight="800" text-anchor="middle">MD421</text>
  </g>
  <rect x="595" y="335" width="170" height="36" rx="6" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="680" y="350" fill="#38bdf8" font-size="10.5" font-weight="800" text-anchor="middle">PATH B: MIC'D CABINET</text>
  <text x="680" y="363" fill="#e2e8f0" font-size="9" text-anchor="middle">Valve growl, speaker compression, grit</text>

  <!-- DAW / Console Mixer Strip -->
  <g transform="translate(780, 120)">
    <rect width="140" height="280" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
    <text x="70" y="32" fill="#c084fc" font-size="12" font-weight="800" text-anchor="middle">DAW MIX BUS</text>
    <text x="70" y="50" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Phase Align &amp; Blend</text>

    <!-- Fader 1 DI -->
    <line x1="45" y1="80" x2="45" y2="190" stroke="#334155" stroke-width="4"/>
    <rect x="35" y="110" width="20" height="12" rx="2" fill="#22c55e"/>
    <text x="45" y="215" fill="#22c55e" font-size="10" font-weight="700" text-anchor="middle">DI Track</text>

    <!-- Fader 2 Mic -->
    <line x1="95" y1="80" x2="95" y2="190" stroke="#334155" stroke-width="4"/>
    <rect x="85" y="130" width="20" height="12" rx="2" fill="#38bdf8"/>
    <text x="95" y="215" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Mic Track</text>

    <!-- Phase button -->
    <rect x="30" y="235" width="80" height="24" rx="4" fill="#7e22ce"/>
    <text x="70" y="251" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">Ø PHASE CHECK</text>
  </g>
</svg>