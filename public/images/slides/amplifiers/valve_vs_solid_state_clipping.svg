<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="tubeG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="ssG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" fill="#080e1a"/>
  <rect x="15" y="15" width="930" height="450" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <text x="40" y="52" fill="#f97316" font-size="13" font-weight="800" letter-spacing="1.5">HARMONIC DISTORTION COMPARATIVE ANALYSIS</text>
  <text x="40" y="82" fill="#ffffff" font-size="22" font-weight="800">Valve Soft Clipping vs. Solid-State Hard Clipping</text>

  <!-- Left: Valve Soft Clipping -->
  <g transform="translate(50, 110)">
    <rect width="410" height="320" rx="14" fill="#0f172a" stroke="#f97316" stroke-width="1.5"/>
    <text x="30" y="40" fill="#f97316" font-size="16" font-weight="800">Valve (Tube) Soft Clipping</text>
    <text x="30" y="62" fill="#94a3b8" font-size="12">Even-Order Harmonics (2nd, 4th) • Musical &amp; Warm</text>

    <!-- Graph axes -->
    <line x1="40" y1="160" x2="370" y2="160" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="205" y1="85" x2="205" y2="235" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Original Clean Sine (dashed) -->
    <path d="M 45 160 Q 85 55 125 160 T 205 160 T 285 160 T 365 160" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Soft Clipped Waveform (smooth rounded shoulders) -->
    <path d="M 45 160 C 70 85 90 95 125 160 C 160 225 180 235 205 160 C 230 85 250 95 285 160 C 320 225 340 235 365 160" fill="none" stroke="#f97316" stroke-width="3.5"/>

    <!-- Bullet Points -->
    <text x="30" y="265" fill="#cbd5e1" font-size="12">• Asymmetric, rounded saturation compress dynamic peaks.</text>
    <text x="30" y="285" fill="#cbd5e1" font-size="12">• Produces musical 2nd harmonic (octave above fundamental).</text>
    <text x="30" y="305" fill="#fbbf24" font-size="11" font-weight="700">Result: Singing sustain, touch sensitivity, and harmonic richness.</text>
  </g>

  <!-- Right: Solid-State Hard Clipping -->
  <g transform="translate(500, 110)">
    <rect width="410" height="320" rx="14" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="30" y="40" fill="#ef4444" font-size="16" font-weight="800">Solid-State (Transistor) Hard Clipping</text>
    <text x="30" y="62" fill="#94a3b8" font-size="12">Odd-Order Harmonics (3rd, 5th, 7th) • Harsh &amp; Square</text>

    <!-- Graph axes -->
    <line x1="40" y1="160" x2="370" y2="160" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="205" y1="85" x2="205" y2="235" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

    <!-- Original Clean Sine (dashed) -->
    <path d="M 45 160 Q 85 55 125 160 T 205 160 T 285 160 T 365 160" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Hard Clipped Waveform (squared off tops) -->
    <path d="M 45 160 L 70 100 L 100 100 L 125 160 L 150 220 L 180 220 L 205 160 L 230 100 L 260 100 L 285 160 L 310 220 L 340 220 L 365 160" fill="none" stroke="#ef4444" stroke-width="3.5"/>

    <!-- Bullet Points -->
    <text x="30" y="265" fill="#cbd5e1" font-size="12">• Exceeding supply rails abruptly shaves off wave peaks.</text>
    <text x="30" y="285" fill="#cbd5e1" font-size="12">• Produces aggressive odd harmonics (3rd, 5th, 7th partials).</text>
    <text x="30" y="305" fill="#f87171" font-size="11" font-weight="700">Result: Brittle, buzz-saw fuzz; ideal for aggressive distortion pedals.</text>
  </g>
</svg>