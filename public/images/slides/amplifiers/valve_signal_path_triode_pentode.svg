<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="url(#bgGrad)"/>
  <rect x="15" y="15" width="930" height="450" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="52" fill="#fbbf24" font-size="13" font-weight="800" letter-spacing="1.5">SIGNAL ARCHITECTURE • EDEXCEL SPECIFICATION</text>
  <text x="40" y="82" fill="#ffffff" font-size="22" font-weight="800">Valve (Tube) Amplifier Complete Signal Flow</text>

  <!-- Flow Line -->
  <path d="M 100 240 L 860 240" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4" fill="none"/>

  <!-- 1. Guitar Input -->
  <g transform="translate(40, 180)">
    <rect width="110" height="120" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <circle cx="55" cy="45" r="16" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="55" cy="45" r="6" fill="#38bdf8"/>
    <text x="55" y="82" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">1/4" Instrument</text>
    <text x="55" y="100" fill="#94a3b8" font-size="10" text-anchor="middle">Hi-Z (1MΩ)</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="155" y1="240" x2="185" y2="240" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 2. Preamp (12AX7 Dual Triode) -->
  <g transform="translate(190, 160)">
    <rect width="135" height="160" rx="12" fill="url(#orangeGrad)" opacity="0.15"/>
    <rect width="135" height="160" rx="12" fill="none" stroke="#f97316" stroke-width="2"/>
    <text x="67" y="32" fill="#f97316" font-size="11" font-weight="800" text-anchor="middle">PREAMP STAGE</text>
    <text x="67" y="54" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">12AX7 / ECC83</text>
    <path d="M 35 100 Q 67 70 100 100" stroke="#f97316" stroke-width="2" fill="none"/>
    <circle cx="67" cy="85" r="4" fill="#fbbf24"/>
    <text x="67" y="122" fill="#cbd5e1" font-size="11" text-anchor="middle">Dual Triode Tube</text>
    <text x="67" y="140" fill="#94a3b8" font-size="9.5" text-anchor="middle">Voltage Gain (Gain / Drive)</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="330" y1="240" x2="355" y2="240" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3. Tone Stack (EQ) -->
  <g transform="translate(360, 175)">
    <rect width="115" height="130" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="57" y="28" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle">TONE STACK</text>
    <text x="57" y="48" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Passive EQ</text>
    <circle cx="30" cy="75" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="57" cy="75" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="84" cy="75" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="57" y="108" fill="#94a3b8" font-size="10" text-anchor="middle">Treble • Mid • Bass</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="480" y1="240" x2="505" y2="240" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4. Phase Inverter & Power Amp (EL34 / 6L6 Pentodes) -->
  <g transform="translate(510, 160)">
    <rect width="145" height="160" rx="12" fill="url(#amberGrad)" opacity="0.15"/>
    <rect width="145" height="160" rx="12" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="72" y="32" fill="#fbbf24" font-size="11" font-weight="800" text-anchor="middle">POWER AMP STAGE</text>
    <text x="72" y="54" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">EL34 / 6L6 Pentodes</text>
    <path d="M 40 100 C 55 75 90 75 105 100" stroke="#fbbf24" stroke-width="2.5" fill="none"/>
    <text x="72" y="122" fill="#cbd5e1" font-size="11" text-anchor="middle">Push-Pull Class AB</text>
    <text x="72" y="140" fill="#94a3b8" font-size="9.5" text-anchor="middle">Current / Power Saturation</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="660" y1="240" x2="685" y2="240" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 5. Output Transformer -->
  <g transform="translate(690, 175)">
    <rect width="110" height="130" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="55" y="28" fill="#c084fc" font-size="11" font-weight="800" text-anchor="middle">OUTPUT XFRMR</text>
    <text x="55" y="48" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Impedance Match</text>
    <!-- Transformer Coils -->
    <path d="M 30 70 A 8 8 0 0 1 30 85 A 8 8 0 0 1 30 100" stroke="#c084fc" stroke-width="2" fill="none"/>
    <line x1="45" y1="65" x2="45" y2="105" stroke="#64748b" stroke-width="2"/>
    <line x1="50" y1="65" x2="50" y2="105" stroke="#64748b" stroke-width="2"/>
    <path d="M 65 70 A 8 8 0 0 1 65 85 A 8 8 0 0 1 65 100" stroke="#c084fc" stroke-width="2" fill="none"/>
    <text x="55" y="120" fill="#94a3b8" font-size="9" text-anchor="middle">3.5kΩ → 4/8/16Ω</text>
  </g>

  <!-- Arrow 5 -->
  <line x1="805" y1="240" x2="825" y2="240" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 6. Speaker Cabinet -->
  <g transform="translate(830, 175)">
    <rect width="90" height="130" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="45" y="28" fill="#22c55e" font-size="11" font-weight="800" text-anchor="middle">SPEAKER</text>
    <circle cx="45" cy="75" r="26" fill="none" stroke="#22c55e" stroke-width="2"/>
    <circle cx="45" cy="75" r="10" fill="#22c55e" opacity="0.4"/>
    <text x="45" y="118" fill="#94a3b8" font-size="9" text-anchor="middle">Acoustic Waves</text>
  </g>

  <!-- Bottom Explanatory Bar -->
  <rect x="40" y="370" width="880" height="75" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="60" y="398" fill="#f8fafc" font-size="13" font-weight="700">Key Edexcel Exam Concept: Preamp Distortion vs. Power Amp Overdrive</text>
  <text x="60" y="422" fill="#94a3b8" font-size="11.5">• Preamp Gain controls 12AX7 saturation (buzz, bite, sustain, high-gain compression) without volume scaling.</text>
  <text x="60" y="438" fill="#94a3b8" font-size="11.5">• Master Volume pushes output pentodes (EL34/6L6) into power tube sag and transformer saturation for dynamic warmth and punch.</text>
</svg>