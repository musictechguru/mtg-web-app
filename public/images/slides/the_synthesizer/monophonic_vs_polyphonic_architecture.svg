<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">MONOPHONIC VS POLYPHONIC ARCHITECTURE</text>
  <text x="400" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">The Jump from Single-Note Leads (Minimoog) to 5-Voice Chords (Prophet-5, 1978)</text>

  <!-- Monophonic (Left) -->
  <g transform="translate(50, 110)">
    <rect width="320" height="280" fill="#131e36" rx="10" stroke="#c084fc" stroke-width="1.5"/>
    <text x="160" y="35" fill="#c084fc" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">MONOPHONIC (1 VOICE)</text>
    <text x="160" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Single Note Priority (Low, High, or Last)</text>
    
    <rect x="30" y="90" width="260" height="60" rx="6" fill="rgba(192,132,252,0.1)"/>
    <text x="160" y="125" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">1 Voice: VCOs &#8594; VCF &#8594; VCA</text>
    
    <text x="160" y="190" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">&#8226; Cannot play harmonic chords</text>
    <text x="160" y="215" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">&#8226; Ideal for basslines and lead solos</text>
    <text x="160" y="240" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Examples: Minimoog, Roland SH-101</text>
  </g>

  <!-- Polyphonic (Right) -->
  <g transform="translate(430, 110)">
    <rect width="320" height="280" fill="#131e36" rx="10" stroke="#34d399" stroke-width="1.5"/>
    <text x="160" y="35" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">POLYPHONIC (PROPHET-5)</text>
    <text x="160" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Microprocessor-Controlled Voice Allocation</text>

    <!-- 5 Voice Cards Stack -->
    <rect x="30" y="80" width="260" height="25" rx="4" fill="rgba(52,211,153,0.15)"/>
    <text x="160" y="97" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Voice 1 Card (2 VCOs, VCF, VCA, 2 Envs)</text>
    <rect x="30" y="110" width="260" height="25" rx="4" fill="rgba(52,211,153,0.15)"/>
    <text x="160" y="127" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Voice 2 Card (2 VCOs, VCF, VCA, 2 Envs)</text>
    <rect x="30" y="140" width="260" height="25" rx="4" fill="rgba(52,211,153,0.15)"/>
    <text x="160" y="157" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Voice 3 Card (2 VCOs, VCF, VCA, 2 Envs)</text>
    
    <rect x="30" y="180" width="260" height="40" rx="6" fill="rgba(251,191,36,0.15)"/>
    <text x="160" y="205" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">Zilog Z80 Microprocessor: Patch Memory</text>
    
    <text x="160" y="245" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Instant digital recall of all analog knob parameters</text>
  </g>
</svg>