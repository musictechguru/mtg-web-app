<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">ROLAND TB-303 BASSLINE &amp; ACID HOUSE PHENOMENON</text>
  <text x="400" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">The Accidental Icon of Dance Music: Diode Ladder Filter, Portamento Slide &amp; Accent</text>

  <g transform="translate(60, 110)">
    <!-- 18dB Filter -->
    <rect x="30" y="20" width="180" height="150" fill="#131e36" rx="8" stroke="#c084fc" stroke-width="1.5"/>
    <text x="120" y="50" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">DIODE LADDER FILTER</text>
    <text x="120" y="80" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">18 dB/Octave (3-Pole)</text>
    <text x="120" y="105" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Squelchy, aggressive resonance</text>
    <text x="120" y="130" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Distorts musically on peak</text>

    <!-- Slide Circuit -->
    <rect x="250" y="20" width="180" height="150" fill="#131e36" rx="8" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="340" y="50" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">SLIDE (PORTAMENTO)</text>
    <text x="340" y="80" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Capacitor Charge Glide</text>
    <text x="340" y="105" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Overlapped 16th notes glide</text>
    <text x="340" y="130" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Envelope does not retrigger</text>

    <!-- Accent Circuit -->
    <rect x="470" y="20" width="180" height="150" fill="#131e36" rx="8" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="560" y="50" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">ACCENT CIRCUIT</text>
    <text x="560" y="80" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Boosts Volume &amp; Filter</text>
    <text x="560" y="105" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Shortens decay for bite</text>
    <text x="560" y="130" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Creates punchy snap attack</text>

    <!-- Summary Box -->
    <rect x="30" y="200" width="620" height="60" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="340" y="225" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Landmark Track: Phuture &#8211; 'Acid Tracks' (1987) &amp; DJ Pierre</text>
    <text x="340" y="245" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Twisting the cutoff and resonance knobs live over an automated pattern defined the sound of Acid House</text>
  </g>
</svg>