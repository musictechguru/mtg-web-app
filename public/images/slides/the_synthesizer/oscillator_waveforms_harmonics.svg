<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">RAW OSCILLATOR WAVEFORMS &amp; HARMONIC SPECTRA</text>

  <!-- 4 Waveforms Grid -->
  <!-- Sawtooth -->
  <g transform="translate(40, 85)">
    <rect width="340" height="150" fill="#131e36" rx="8" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="20" y="30" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="800">1. SAWTOOTH WAVE</text>
    <text x="20" y="50" fill="#94a3b8" font-family="sans-serif" font-size="11">Contains ALL integer harmonics (1/n amplitude)</text>
    <text x="20" y="68" fill="#ffffff" font-family="sans-serif" font-size="11">Sound: Bright, buzzy, rich (Strings, Brass, Leads)</text>
    <!-- Wave plot -->
    <path d="M 20 120 L 70 85 L 70 120 L 120 85 L 120 120 L 170 85" fill="none" stroke="#c084fc" stroke-width="2.5"/>
    <!-- Harmonics bars -->
    <line x1="210" y1="130" x2="210" y2="90" stroke="#c084fc" stroke-width="4"/>
    <line x1="225" y1="130" x2="225" y2="105" stroke="#c084fc" stroke-width="4"/>
    <line x1="240" y1="130" x2="240" y2="112" stroke="#c084fc" stroke-width="4"/>
    <line x1="255" y1="130" x2="255" y2="118" stroke="#c084fc" stroke-width="4"/>
    <line x1="270" y1="130" x2="270" y2="122" stroke="#c084fc" stroke-width="4"/>
    <text x="240" y="142" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">All Harmonics (1,2,3,4,5...)</text>
  </g>

  <!-- Square / Pulse -->
  <g transform="translate(420, 85)">
    <rect width="340" height="150" fill="#131e36" rx="8" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="20" y="30" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="800">2. SQUARE / PULSE WAVE</text>
    <text x="20" y="50" fill="#94a3b8" font-family="sans-serif" font-size="11">Contains ODD harmonics only (50% duty cycle)</text>
    <text x="20" y="68" fill="#ffffff" font-family="sans-serif" font-size="11">Sound: Hollow, woody, nasal (Clarinet, Bass)</text>
    <!-- Wave plot -->
    <path d="M 20 120 L 20 85 L 55 85 L 55 120 L 90 120 L 90 85 L 125 85 L 125 120 L 160 120" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Harmonics bars -->
    <line x1="210" y1="130" x2="210" y2="90" stroke="#38bdf8" stroke-width="4"/>
    <line x1="230" y1="130" x2="230" y2="108" stroke="#38bdf8" stroke-width="4"/>
    <line x1="250" y1="130" x2="250" y2="116" stroke="#38bdf8" stroke-width="4"/>
    <line x1="270" y1="130" x2="270" y2="122" stroke="#38bdf8" stroke-width="4"/>
    <text x="240" y="142" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Odd Only (1, 3, 5, 7...)</text>
  </g>

  <!-- Triangle -->
  <g transform="translate(40, 255)">
    <rect width="340" height="150" fill="#131e36" rx="8" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="20" y="30" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="800">3. TRIANGLE WAVE</text>
    <text x="20" y="50" fill="#94a3b8" font-family="sans-serif" font-size="11">Odd harmonics falling at 1/n&#178; (rapid roll-off)</text>
    <text x="20" y="68" fill="#ffffff" font-family="sans-serif" font-size="11">Sound: Mellow, soft flute, subtle sub-tone</text>
    <!-- Wave plot -->
    <path d="M 20 102 L 45 85 L 95 120 L 145 85 L 170 102" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <!-- Harmonics bars -->
    <line x1="210" y1="130" x2="210" y2="90" stroke="#34d399" stroke-width="4"/>
    <line x1="230" y1="130" x2="230" y2="124" stroke="#34d399" stroke-width="4"/>
    <line x1="250" y1="130" x2="250" y2="128" stroke="#34d399" stroke-width="4"/>
    <text x="240" y="142" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Weak Odd Harmonics</text>
  </g>

  <!-- Sine Wave -->
  <g transform="translate(420, 255)">
    <rect width="340" height="150" fill="#131e36" rx="8" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="20" y="30" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="800">4. SINE WAVE</text>
    <text x="20" y="50" fill="#94a3b8" font-family="sans-serif" font-size="11">Pure fundamental frequency with ZERO overtones</text>
    <text x="20" y="68" fill="#ffffff" font-family="sans-serif" font-size="11">Sound: Pure test tone, sub-bass, 808 kick</text>
    <!-- Wave plot -->
    <path d="M 20 102 Q 45 75 70 102 T 120 102 T 170 102" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <!-- Harmonics bars -->
    <line x1="210" y1="130" x2="210" y2="90" stroke="#fbbf24" stroke-width="4"/>
    <text x="240" y="142" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Fundamental Only</text>
  </g>
</svg>