<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">THE MIDI 1.0 PROTOCOL &amp; 5-PIN DIN STANDARD (1983)</text>
  <text x="400" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Serial Digital Performance Data: 31.25 kbaud, 16 Channels, Transmitting Notes not Audio</text>

  <!-- Connection Diagram -->
  <g transform="translate(60, 110)">
    <!-- Controller Keyboard -->
    <rect x="30" y="20" width="180" height="110" rx="8" fill="#131e36" stroke="#c084fc" stroke-width="1.5"/>
    <text x="120" y="50" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">MASTER KEYBOARD</text>
    <text x="120" y="75" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Generates Performance Data</text>
    <rect x="75" y="90" width="90" height="25" rx="4" fill="rgba(192,132,252,0.2)"/>
    <text x="120" y="107" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">MIDI OUT</text>

    <!-- Cable 1 -->
    <line x1="210" y1="102" x2="310" y2="102" stroke="#ffffff" stroke-width="3"/>
    <polygon points="310,97 320,102 310,107" fill="#ffffff"/>
    <text x="265" y="90" fill="#fbbf24" font-family="sans-serif" font-size="10" text-anchor="middle">5-Pin DIN</text>

    <!-- Synth 1 -->
    <rect x="320" y="20" width="180" height="110" rx="8" fill="#131e36" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="410" y="50" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">SYNTHESIZER 1</text>
    <rect x="330" y="90" width="70" height="25" rx="4" fill="rgba(56,189,248,0.2)"/>
    <text x="365" y="107" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">MIDI IN</text>
    <rect x="420" y="90" width="70" height="25" rx="4" fill="rgba(255,255,255,0.1)"/>
    <text x="455" y="107" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">THRU</text>

    <!-- Cable 2 -->
    <line x1="490" y1="102" x2="550" y2="102" stroke="#ffffff" stroke-width="3"/>
    <polygon points="550,97 560,102 550,107" fill="#ffffff"/>

    <!-- Drum Machine / Module -->
    <rect x="560" y="20" width="110" height="110" rx="8" fill="#131e36" stroke="#34d399" stroke-width="1.5"/>
    <text x="615" y="50" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">MODULE 2</text>
    <rect x="575" y="90" width="80" height="25" rx="4" fill="rgba(52,211,153,0.2)"/>
    <text x="615" y="107" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">MIDI IN</text>
  </g>

  <!-- Data Structure -->
  <g transform="translate(60, 260)">
    <rect width="680" height="130" fill="#131e36" rx="10" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="340" y="30" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">3-BYTE MIDI MESSAGE STRUCTURE (NOTE ON EXAMPLE)</text>
    
    <rect x="40" y="55" width="190" height="50" rx="6" fill="rgba(192,132,252,0.15)"/>
    <text x="135" y="78" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">BYTE 1: STATUS BYTE</text>
    <text x="135" y="95" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Note On + Channel (1–16)</text>

    <rect x="245" y="55" width="190" height="50" rx="6" fill="rgba(56,189,248,0.15)"/>
    <text x="340" y="78" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">BYTE 2: DATA 1 (PITCH)</text>
    <text x="340" y="95" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Note Number (0–127, 60=Mid C)</text>

    <rect x="450" y="55" width="190" height="50" rx="6" fill="rgba(52,211,153,0.15)"/>
    <text x="545" y="78" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">BYTE 3: DATA 2 (VELOCITY)</text>
    <text x="545" y="95" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Key Strike Speed (0–127)</text>
  </g>
</svg>