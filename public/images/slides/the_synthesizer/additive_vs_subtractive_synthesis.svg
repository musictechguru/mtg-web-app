<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">ADDITIVE VS SUBTRACTIVE SYNTHESIS PRINCIPLES</text>
  <text x="400" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Fourier Building-Block Summing vs Sculpting Rich Harmonic Spectra</text>

  <!-- Left: Additive -->
  <g transform="translate(50, 110)">
    <rect width="330" height="280" fill="#131e36" rx="10" stroke="#c084fc" stroke-width="1.5"/>
    <text x="165" y="35" fill="#c084fc" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">ADDITIVE SYNTHESIS</text>
    <text x="165" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">"Building Up from Pure Silence"</text>
    <!-- Sine waves summing -->
    <path d="M 30 100 Q 55 80 80 100 T 130 100" fill="none" stroke="#c084fc" stroke-width="2"/>
    <text x="145" y="105" fill="#ffffff" font-family="sans-serif" font-size="10">+ Sine 1 (Fundamental)</text>
    <path d="M 30 135 Q 42 120 55 135 T 80 135 T 105 135" fill="none" stroke="#c084fc" stroke-width="2"/>
    <text x="145" y="140" fill="#ffffff" font-family="sans-serif" font-size="10">+ Sine 2 (2nd Harmonic)</text>
    <path d="M 30 170 Q 38 160 45 170 T 60 170 T 75 170 T 90 170" fill="none" stroke="#c084fc" stroke-width="2"/>
    <text x="145" y="175" fill="#ffffff" font-family="sans-serif" font-size="10">+ Sine 3 (3rd Harmonic)</text>
    <text x="165" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Example: Drawbar Hammond Organ &amp; Synclavier</text>
  </g>

  <!-- Right: Subtractive -->
  <g transform="translate(420, 110)">
    <rect width="330" height="280" fill="#131e36" rx="10" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="165" y="35" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">SUBTRACTIVE SYNTHESIS</text>
    <text x="165" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">"Carving Away Harmonics from Noise/Buzz"</text>
    <rect x="40" y="90" width="80" height="50" rx="4" fill="rgba(56,189,248,0.15)"/>
    <text x="80" y="120" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Sawtooth</text>
    <text x="140" y="120" fill="#ffffff" font-family="sans-serif" font-size="18">&#8594;</text>
    <rect x="165" y="90" width="120" height="50" rx="4" fill="rgba(192,132,252,0.15)"/>
    <text x="225" y="120" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Low-Pass Filter</text>
    <text x="165" y="195" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Removes high frequencies to sculpt warm timbre</text>
    <text x="165" y="240" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Example: Minimoog, Prophet-5, Roland Juno</text>
  </g>
</svg>