<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">WAVETABLE SYNTHESIS &amp; FRAME INTERPOLATION</text>
  <text x="400" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Scanning Through Single-Cycle Digital Waves: PPG Wave (1981) to Modern Serum / Massive</text>

  <g transform="translate(60, 110)">
    <rect width="680" height="280" fill="#131e36" rx="10" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    
    <!-- 4 Wave Frames -->
    <g transform="translate(40, 40)">
      <rect width="120" height="150" fill="rgba(255,255,255,0.03)" rx="6" stroke="#c084fc" stroke-width="1.5"/>
      <text x="60" y="30" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Frame 1: Sine</text>
      <path d="M 20 100 Q 40 70 60 100 T 100 100" fill="none" stroke="#c084fc" stroke-width="2.5"/>
    </g>

    <g transform="translate(200, 40)">
      <rect width="120" height="150" fill="rgba(255,255,255,0.03)" rx="6" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="60" y="30" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Frame 32: Morph</text>
      <path d="M 20 100 Q 30 70 60 90 T 100 110" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    </g>

    <g transform="translate(360, 40)">
      <rect width="120" height="150" fill="rgba(255,255,255,0.03)" rx="6" stroke="#34d399" stroke-width="1.5"/>
      <text x="60" y="30" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Frame 64: Saw</text>
      <path d="M 20 120 L 60 80 L 60 120 L 100 80" fill="none" stroke="#34d399" stroke-width="2.5"/>
    </g>

    <g transform="translate(520, 40)">
      <rect width="120" height="150" fill="rgba(255,255,255,0.03)" rx="6" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="60" y="30" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Frame 128: Pulse</text>
      <path d="M 20 120 L 20 80 L 60 80 L 60 120 L 100 120" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    </g>

    <!-- Scan Pointer Arrow -->
    <line x1="40" y1="225" x2="640" y2="225" stroke="#ffffff" stroke-width="3"/>
    <polygon points="635,220 645,225 635,230" fill="#ffffff"/>
    <text x="340" y="250" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Wavetable Position Modulation (LFO / Envelope Scanning with Smooth Interpolation)</text>
  </g>
</svg>