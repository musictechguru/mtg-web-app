<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">SUBTRACTIVE SYNTHESIS SIGNAL FLOW</text>
  <text x="400" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Classic Analog Architecture: VCO &#8594; VCF &#8594; VCA with Modulation Control</text>

  <!-- Audio Path Blocks -->
  <!-- VCO -->
  <rect x="60" y="140" width="180" height="110" rx="10" fill="#131e36" stroke="#c084fc" stroke-width="2"/>
  <text x="150" y="175" fill="#c084fc" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">VCO</text>
  <text x="150" y="195" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Voltage Controlled Osc</text>
  <text x="150" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Saw, Square, Triangle, Sine</text>

  <!-- Arrow 1 -->
  <line x1="240" y1="195" x2="310" y2="195" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <polygon points="310,190 320,195 310,200" fill="#ffffff"/>
  <text x="280" y="185" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Raw Audio</text>

  <!-- VCF -->
  <rect x="320" y="140" width="180" height="110" rx="10" fill="#131e36" stroke="#38bdf8" stroke-width="2"/>
  <text x="410" y="175" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">VCF</text>
  <text x="410" y="195" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Voltage Controlled Filter</text>
  <text x="410" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Cutoff &amp; Resonance (Q)</text>

  <!-- Arrow 2 -->
  <line x1="500" y1="195" x2="570" y2="195" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <polygon points="570,190 580,195 570,200" fill="#ffffff"/>
  <text x="540" y="185" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Filtered</text>

  <!-- VCA -->
  <rect x="580" y="140" width="160" height="110" rx="10" fill="#131e36" stroke="#34d399" stroke-width="2"/>
  <text x="660" y="175" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">VCA</text>
  <text x="660" y="195" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Voltage Controlled Amp</text>
  <text x="660" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Dynamic Output Level</text>

  <!-- Output Arrow -->
  <line x1="740" y1="195" x2="780" y2="195" stroke="#34d399" stroke-width="3"/>
  <polygon points="775,190 785,195 775,200" fill="#34d399"/>

  <!-- Modulation Blocks -->
  <!-- LFO -->
  <rect x="180" y="300" width="180" height="90" rx="10" fill="#131e36" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="270" y="330" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">LFO (Sub-Audible &lt;20Hz)</text>
  <text x="270" y="355" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Vibrato (VCO) &amp; Wobble (VCF)</text>
  <line x1="220" y1="300" x2="150" y2="250" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="310" y1="300" x2="380" y2="250" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- ADSR Envelopes -->
  <rect x="460" y="300" width="220" height="90" rx="10" fill="#131e36" stroke="#c084fc" stroke-width="1.5"/>
  <text x="570" y="330" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">ADSR ENVELOPE GENS</text>
  <text x="570" y="355" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Filter Env (VCF) &amp; Amp Env (VCA)</text>
  <line x1="510" y1="300" x2="440" y2="250" stroke="#c084fc" stroke-width="1.5"/>
  <line x1="630" y1="300" x2="660" y2="250" stroke="#c084fc" stroke-width="1.5"/>
</svg>