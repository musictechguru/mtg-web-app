<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">MINIMOOG MODEL D (1970) ARCHITECTURE</text>
  <text x="400" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">The First Normalized Portable Analog Synthesizer</text>

  <!-- 3 VCOs -->
  <g transform="translate(50, 110)">
    <rect width="160" height="270" fill="#131e36" rx="8" stroke="#c084fc" stroke-width="1.5"/>
    <text x="80" y="30" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">OSCILLATOR BANK</text>
    <rect x="15" y="50" width="130" height="55" rx="4" fill="rgba(255,255,255,0.04)"/>
    <text x="80" y="82" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">OSC 1 (Tune &amp; Wave)</text>
    <rect x="15" y="120" width="130" height="55" rx="4" fill="rgba(255,255,255,0.04)"/>
    <text x="80" y="152" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">OSC 2 (Detune Beat)</text>
    <rect x="15" y="190" width="130" height="55" rx="4" fill="rgba(255,255,255,0.04)"/>
    <text x="80" y="215" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">OSC 3 (Audio or LFO)</text>
    <text x="80" y="232" fill="#fbbf24" font-family="sans-serif" font-size="9" text-anchor="middle">Mod Source</text>
  </g>

  <!-- Mixer -->
  <g transform="translate(235, 110)">
    <rect width="130" height="270" fill="#131e36" rx="8" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="65" y="30" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">MIXER</text>
    <text x="65" y="70" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Vol 1</text>
    <text x="65" y="110" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Vol 2</text>
    <text x="65" y="150" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Vol 3</text>
    <text x="65" y="190" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Noise Gen</text>
    <rect x="10" y="220" width="110" height="35" rx="4" fill="rgba(245,158,11,0.15)"/>
    <text x="65" y="242" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Feedback Loop</text>
  </g>

  <!-- 24dB Ladder Filter -->
  <g transform="translate(390, 110)">
    <rect width="190" height="270" fill="#131e36" rx="8" stroke="#38bdf8" stroke-width="2"/>
    <text x="95" y="30" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">24dB LADDER FILTER</text>
    <text x="95" y="60" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Transistor Ladder Circuit</text>
    <!-- Controls -->
    <rect x="20" y="80" width="150" height="40" rx="4" fill="rgba(56,189,248,0.1)"/>
    <text x="95" y="105" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Cutoff Frequency</text>
    <rect x="20" y="130" width="150" height="40" rx="4" fill="rgba(56,189,248,0.1)"/>
    <text x="95" y="155" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Emphasis (Resonance)</text>
    <rect x="20" y="180" width="150" height="70" rx="4" fill="rgba(255,255,255,0.03)"/>
    <text x="95" y="205" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Filter Envelope (ADS)</text>
    <text x="95" y="225" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Attack, Decay, Sustain</text>
  </g>

  <!-- VCA & Output -->
  <g transform="translate(605, 110)">
    <rect width="145" height="270" fill="#131e36" rx="8" stroke="#34d399" stroke-width="1.5"/>
    <text x="72" y="30" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">VCA &amp; OUTPUT</text>
    <rect x="15" y="60" width="115" height="70" rx="4" fill="rgba(52,211,153,0.1)"/>
    <text x="72" y="90" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Loudness Env</text>
    <text x="72" y="110" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Attack, Decay, Sustain</text>
    <rect x="15" y="160" width="115" height="50" rx="4" fill="rgba(255,255,255,0.04)"/>
    <text x="72" y="190" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Pitch &amp; Mod Wheels</text>
  </g>
</svg>