<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">VOLTAGE CONTROLLED FILTER (VCF) RESPONSE</text>
  <text x="400" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Low-Pass Filter Curve, Cutoff Frequency (fc), Resonance Peak (Q) &amp; Filter Slopes</text>

  <!-- Main Frequency Response Plot -->
  <g transform="translate(60, 110)">
    <rect width="680" height="280" fill="#131e36" rx="10" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    
    <!-- Axes -->
    <line x1="60" y1="230" x2="630" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="60" y1="30" x2="60" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
    
    <text x="345" y="260" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Frequency (Hz) &#8594; Logarithmic Scale (20Hz to 20kHz)</text>
    <text x="25" y="130" fill="#94a3b8" font-family="sans-serif" font-size="12" transform="rotate(-90 25 130)" text-anchor="middle">Gain (dB)</text>

    <!-- Flat passband -->
    <path d="M 60 70 L 260 70 C 310 70 330 35 350 40 C 370 45 390 120 430 180 L 480 230" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
    
    <!-- Resonance Peak marker -->
    <circle cx="350" cy="40" r="6" fill="#c084fc"/>
    <text x="350" y="25" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">Resonance Peak (Q Boost)</text>
    
    <!-- Cutoff vertical line -->
    <line x1="350" y1="40" x2="350" y2="230" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="350" y="245" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Cutoff Frequency (fc)</text>

    <!-- Passband vs Stopband Shading -->
    <rect x="60" y="70" width="270" height="160" fill="rgba(56, 189, 248, 0.08)"/>
    <text x="180" y="140" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="800">PASSBAND</text>
    <text x="180" y="160" fill="#94a3b8" font-family="sans-serif" font-size="11">Frequencies Unaffected</text>

    <!-- Filter Slopes -->
    <text x="520" y="110" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="700">Filter Slopes (Rolloff):</text>
    <text x="520" y="135" fill="#ffffff" font-family="sans-serif" font-size="12">&#8226; 24 dB/oct (4-Pole Ladder - Moog)</text>
    <text x="520" y="155" fill="#ffffff" font-family="sans-serif" font-size="12">&#8226; 12 dB/oct (2-Pole - Oberheim)</text>
    <text x="520" y="180" fill="#34d399" font-family="sans-serif" font-size="11">Self-Oscillation occurs at maximum Q</text>
  </g>
</svg>