<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">FREQUENCY MODULATION (FM) SYNTHESIS &amp; OPERATORS</text>
  <text x="400" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">John Chowning Stanford Algorithm &#8594; Yamaha DX7 (1983)</text>

  <!-- Operator Definition -->
  <g transform="translate(60, 110)">
    <rect width="680" height="130" fill="#131e36" rx="10" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="340" y="30" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">WHAT IS AN FM OPERATOR?</text>
    <text x="340" y="55" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">An Operator = A Pure Sine Wave Oscillator + Dedicated Envelope Generator</text>

    <!-- Modulator Box -->
    <rect x="100" y="70" width="180" height="45" rx="6" fill="rgba(192,132,252,0.15)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="190" y="97" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">MODULATOR (Op 2)</text>

    <line x1="280" y1="92" x2="390" y2="92" stroke="#ffffff" stroke-width="2.5"/>
    <polygon points="390,88 400,92 390,96" fill="#ffffff"/>
    <text x="340" y="82" fill="#fbbf24" font-family="sans-serif" font-size="10" text-anchor="middle">Audio-Rate FM</text>

    <!-- Carrier Box -->
    <rect x="400" y="70" width="180" height="45" rx="6" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.5"/>
    <text x="490" y="97" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">CARRIER (Op 1)</text>

    <line x1="580" y1="92" x2="640" y2="92" stroke="#34d399" stroke-width="2.5"/>
    <polygon points="635,88 645,92 635,96" fill="#34d399"/>
    <text x="610" y="82" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">Output</text>
  </g>

  <!-- Algorithms Comparison (Bottom) -->
  <g transform="translate(60, 260)">
    <rect width="680" height="130" fill="#131e36" rx="10" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="340" y="28" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">DX7 OPERATOR ROUTING ALGORITHMS (32 TOTAL)</text>
    
    <!-- Algorithm A: Harmonic Stacks -->
    <rect x="40" y="45" width="280" height="65" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="180" y="70" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Vertical Stack (Mod &#8594; Carrier)</text>
    <text x="180" y="92" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Rich complex harmonic overtones (Bells, Brass)</text>

    <!-- Algorithm B: Additive Carriers -->
    <rect x="360" y="45" width="280" height="65" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="500" y="70" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Parallel Carriers (Pure Sine Sums)</text>
    <text x="500" y="92" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Warm organs, electric pianos (E.Piano 1 preset)</text>
  </g>
</svg>