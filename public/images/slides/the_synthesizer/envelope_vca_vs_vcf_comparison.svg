<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">AMPLIFIER ENVELOPE (VCA) VS FILTER ENVELOPE (VCF)</text>
  <text x="400" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Comparing Dynamic Loudness vs Timbral Brightness Over Time</text>

  <!-- Left: VCA Envelope -->
  <g transform="translate(50, 110)">
    <rect width="330" height="280" fill="#131e36" rx="10" stroke="#34d399" stroke-width="1.5"/>
    <text x="165" y="35" fill="#34d399" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">VCA ENVELOPE (VOLUME)</text>
    <text x="165" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Controls Loudness Contour Over Time</text>
    <!-- Curve -->
    <path d="M 30 180 L 80 90 L 150 140 L 230 140 L 300 200" fill="none" stroke="#34d399" stroke-width="3"/>
    <text x="165" y="235" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Determines note start, sustain, and fade-out</text>
    <text x="165" y="255" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">If VCA Release is short, sound cuts off instantly</text>
  </g>

  <!-- Right: VCF Envelope -->
  <g transform="translate(420, 110)">
    <rect width="330" height="280" fill="#131e36" rx="10" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="165" y="35" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="800" text-anchor="middle">VCF ENVELOPE (TIMBRE)</text>
    <text x="165" y="60" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Controls Filter Cutoff Movement Over Time</text>
    <!-- Curve -->
    <path d="M 30 180 L 60 70 L 140 160 L 230 160 L 290 190" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="165" y="235" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle">Creates pluck "wow" or brass filter sweeps</text>
    <text x="165" y="255" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Fast decay creates sharp percussive synth snap</text>
  </g>
</svg>