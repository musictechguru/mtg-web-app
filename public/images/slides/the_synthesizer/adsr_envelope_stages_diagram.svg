<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">THE 4-STAGE ADSR ENVELOPE GENERATOR</text>
  <text x="400" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Shaping Signal Voltage (VCA Amplitude or VCF Filter Cutoff) Over Time</text>

  <g transform="translate(60, 110)">
    <rect width="680" height="280" fill="#131e36" rx="10" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    
    <!-- Axes -->
    <line x1="60" y1="210" x2="630" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="60" y1="30" x2="60" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="630" y="235" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="end">Time &#8594;</text>
    <text x="35" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11" transform="rotate(-90 35 120)" text-anchor="middle">Voltage / Level</text>

    <!-- ADSR Curve -->
    <!-- Attack: (60, 210) to (180, 50) -->
    <line x1="60" y1="210" x2="180" y2="50" stroke="#c084fc" stroke-width="3.5"/>
    <!-- Decay: (180, 50) to (290, 130) -->
    <line x1="180" y1="50" x2="290" y2="130" stroke="#38bdf8" stroke-width="3.5"/>
    <!-- Sustain: (290, 130) to (470, 130) -->
    <line x1="290" y1="130" x2="470" y2="130" stroke="#34d399" stroke-width="3.5"/>
    <!-- Release: (470, 130) to (600, 210) -->
    <line x1="470" y1="130" x2="600" y2="210" stroke="#fbbf24" stroke-width="3.5"/>

    <!-- Key Down & Key Up markers -->
    <line x1="60" y1="20" x2="60" y2="210" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="70" y="25" width="80" height="20" rx="4" fill="rgba(255,255,255,0.1)"/>
    <text x="110" y="39" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">KEY DOWN</text>

    <line x1="470" y1="20" x2="470" y2="210" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="480" y="25" width="70" height="20" rx="4" fill="rgba(255,255,255,0.1)"/>
    <text x="515" y="39" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">KEY UP</text>

    <!-- Stage Labels -->
    <text x="120" y="120" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="800">ATTACK</text>
    <text x="120" y="138" fill="#94a3b8" font-family="sans-serif" font-size="10">Time to Peak</text>

    <text x="235" y="90" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="800">DECAY</text>
    <text x="235" y="108" fill="#94a3b8" font-family="sans-serif" font-size="10">Time to Sustain</text>

    <text x="380" y="115" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="800">SUSTAIN</text>
    <text x="380" y="133" fill="#94a3b8" font-family="sans-serif" font-size="10">HELD LEVEL (Volts)</text>

    <text x="535" y="160" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="800">RELEASE</text>
    <text x="535" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10">Time to Zero</text>
  </g>
</svg>