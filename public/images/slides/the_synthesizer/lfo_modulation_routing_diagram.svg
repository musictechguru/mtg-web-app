<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">LOW FREQUENCY OSCILLATOR (LFO) MODULATION</text>
  <text x="400" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Cyclic Sub-Audible Control (&lt;20 Hz) Applied to 3 Main Synthesis Destinations</text>

  <!-- LFO Source Block -->
  <g transform="translate(60, 160)">
    <rect width="200" height="150" fill="#131e36" rx="12" stroke="#fbbf24" stroke-width="2"/>
    <text x="100" y="35" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">LFO SOURCE</text>
    <text x="100" y="55" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Rate: 0.1 Hz to 20 Hz</text>
    <!-- Wave icon -->
    <path d="M 40 100 Q 70 70 100 100 T 160 100" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <text x="100" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Sine, Triangle, Sq, S&amp;H</text>
  </g>

  <!-- 3 Destinations -->
  <!-- 1. VCO -> Pitch Vibrato -->
  <g transform="translate(360, 110)">
    <rect width="360" height="80" fill="#131e36" rx="8" stroke="#c084fc" stroke-width="1.5"/>
    <text x="20" y="32" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="800">1. VCO FREQUENCY &#8594; VIBRATO</text>
    <text x="20" y="54" fill="#94a3b8" font-family="sans-serif" font-size="12">Modulating pitch up and down creates musical pitch vibrato</text>
  </g>
  <line x1="260" y1="195" x2="360" y2="150" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- 2. VCF -> Filter Wobble / Auto-Wah -->
  <g transform="translate(360, 205)">
    <rect width="360" height="80" fill="#131e36" rx="8" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="32" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="800">2. VCF CUTOFF &#8594; AUTO-WAH / WOBBLE</text>
    <text x="20" y="54" fill="#94a3b8" font-family="sans-serif" font-size="12">Sweeping the filter cutoff creates rhythmic timbral movement</text>
  </g>
  <line x1="260" y1="235" x2="360" y2="245" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- 3. VCA -> Amplitude Tremolo -->
  <g transform="translate(360, 300)">
    <rect width="360" height="80" fill="#131e36" rx="8" stroke="#34d399" stroke-width="1.5"/>
    <text x="20" y="32" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="800">3. VCA GAIN &#8594; TREMOLO</text>
    <text x="20" y="54" fill="#94a3b8" font-family="sans-serif" font-size="12">Modulating volume up and down produces rhythmic pulsing</text>
  </g>
  <line x1="260" y1="275" x2="360" y2="340" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4"/>
</svg>