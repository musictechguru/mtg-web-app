<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0b1120" rx="16"/>
  <rect x="20" y="20" width="760" height="410" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" rx="12"/>
  
  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800" text-anchor="middle">EDEXCEL COMPONENT 3 SYNTHESIS REVISION MATRIX</text>
  <text x="400" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle">Key Synthesizer Milestones, Eras, Technical Mechanics &amp; Landmark Exemplars</text>

  <!-- 4 Columns Table -->
  <g transform="translate(40, 105)">
    <!-- Header -->
    <rect width="720" height="35" fill="rgba(192,132,252,0.2)" rx="4"/>
    <text x="80" y="23" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="800">ERA &amp; MODEL</text>
    <text x="240" y="23" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="800">SYNTHESIS TYPE</text>
    <text x="420" y="23" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="800">CORE TECHNICAL MECHANISM</text>
    <text x="630" y="23" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="800">EXEMPLAR TRACK</text>

    <!-- Row 1: Moog Modular -->
    <rect y="45" width="720" height="45" fill="#131e36" rx="4"/>
    <text x="80" y="72" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">1960s Moog Modular</text>
    <text x="240" y="72" fill="#94a3b8" font-family="sans-serif" font-size="11">Subtractive Analog</text>
    <text x="420" y="72" fill="#94a3b8" font-family="sans-serif" font-size="11">Patch cables, 1V/Oct CV &amp; Gate</text>
    <text x="630" y="72" fill="#ffffff" font-family="sans-serif" font-size="11">Wendy Carlos (1968)</text>

    <!-- Row 2: Minimoog -->
    <rect y="95" width="720" height="45" fill="#131e36" rx="4"/>
    <text x="80" y="122" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">1970 Minimoog D</text>
    <text x="240" y="122" fill="#94a3b8" font-family="sans-serif" font-size="11">Subtractive Monophonic</text>
    <text x="420" y="122" fill="#94a3b8" font-family="sans-serif" font-size="11">Normalized 3 VCOs, 24dB Ladder Filter</text>
    <text x="630" y="122" fill="#ffffff" font-family="sans-serif" font-size="11">Stevie Wonder / Numan</text>

    <!-- Row 3: Prophet-5 -->
    <rect y="145" width="720" height="45" fill="#131e36" rx="4"/>
    <text x="80" y="172" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">1978 Prophet-5</text>
    <text x="240" y="172" fill="#94a3b8" font-family="sans-serif" font-size="11">Subtractive Polyphonic</text>
    <text x="420" y="172" fill="#94a3b8" font-family="sans-serif" font-size="11">5 Voices, Z80 Patch Preset Memory</text>
    <text x="630" y="172" fill="#ffffff" font-family="sans-serif" font-size="11">Kraftwerk / Japan</text>

    <!-- Row 4: Yamaha DX7 -->
    <rect y="195" width="720" height="45" fill="#131e36" rx="4"/>
    <text x="80" y="222" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">1983 Yamaha DX7</text>
    <text x="240" y="222" fill="#94a3b8" font-family="sans-serif" font-size="11">Digital FM Synthesis</text>
    <text x="420" y="222" fill="#94a3b8" font-family="sans-serif" font-size="11">6 Sine Operators, 32 Algorithms, MIDI</text>
    <text x="630" y="222" fill="#ffffff" font-family="sans-serif" font-size="11">A-ha / Whitney Houston</text>

    <!-- Row 5: Roland TB-303 -->
    <rect y="245" width="720" height="45" fill="#131e36" rx="4"/>
    <text x="80" y="272" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">1982 Roland TB-303</text>
    <text x="240" y="272" fill="#94a3b8" font-family="sans-serif" font-size="11">Acid Bassline Sequencer</text>
    <text x="420" y="272" fill="#94a3b8" font-family="sans-serif" font-size="11">18dB Diode Filter, Slide &amp; Accent</text>
    <text x="630" y="272" fill="#ffffff" font-family="sans-serif" font-size="11">Phuture - Acid Tracks</text>
  </g>
</svg>