<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="720" height="400" rx="12" fill="url(#bg-grad-1)" stroke="#334155" stroke-width="1.5" />
  
  <text x="360" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1">ABBEY ROAD 4-TRACK REDUCTION BOUNCING (1966)</text>
  <text x="360" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Studer J37 1-Inch Tape: Combining Tracks to Overcome 4-Track Physical Limitations</text>

  <!-- Machine 1 (4-Track Initial Tracking) -->
  <g transform="translate(40, 75)">
    <rect width="250" height="230" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <rect width="250" height="28" rx="8" fill="#334155" />
    <text x="125" y="19" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">MACHINE 1: STUDER J37</text>
    
    <!-- Track 1 -->
    <rect x="15" y="40" width="220" height="36" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="25" y="62" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">TRK 1:</text>
    <text x="75" y="62" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5">Ringo's Drums (Close-miked)</text>

    <!-- Track 2 -->
    <rect x="15" y="85" width="220" height="36" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="25" y="107" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">TRK 2:</text>
    <text x="75" y="107" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5">Paul's Bass Guitar (DI/Amp)</text>

    <!-- Track 3 -->
    <rect x="15" y="130" width="220" height="36" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="25" y="152" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">TRK 3:</text>
    <text x="75" y="152" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5">Organ &amp; Guitars</text>

    <!-- Track 4 -->
    <rect x="15" y="175" width="220" height="36" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="25" y="197" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">TRK 4:</text>
    <text x="75" y="197" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5">John's Lead Vocal (ADT)</text>
  </g>

  <!-- Bounce arrows & mixer node -->
  <g transform="translate(295, 175)">
    <path d="M 0,-40 L 40,-5 M 0,-5 L 40,-5 M 0,30 L 40,-5" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="55" cy="-5" r="18" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="55" y="-1" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">MIX</text>
    <path d="M 75,-5 L 125,-5" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowhead)" />
    <text x="95" y="-15" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">BOUNCE</text>
  </g>

  <!-- Machine 2 (Destination Machine) -->
  <g transform="translate(430, 75)">
    <rect width="250" height="230" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <rect width="250" height="28" rx="8" fill="#047857" />
    <text x="125" y="19" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">MACHINE 2: REDUCTION REEL</text>

    <!-- Track 1: Submix -->
    <rect x="15" y="40" width="220" height="36" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="25" y="62" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="800">TRK 1:</text>
    <text x="75" y="62" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">COMBINED RHYTHM SUBMIX</text>

    <!-- Track 2: Free -->
    <rect x="15" y="85" width="220" height="36" rx="4" fill="#0f172a" stroke="#22c55e" stroke-dasharray="3 3" stroke-width="1" />
    <text x="25" y="107" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="700">TRK 2:</text>
    <text x="75" y="107" fill="#86efac" font-family="system-ui, sans-serif" font-size="10.5">OPEN FOR TAPE LOOPS 1-3</text>

    <!-- Track 3: Free -->
    <rect x="15" y="130" width="220" height="36" rx="4" fill="#0f172a" stroke="#22c55e" stroke-dasharray="3 3" stroke-width="1" />
    <text x="25" y="152" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="700">TRK 3:</text>
    <text x="75" y="152" fill="#86efac" font-family="system-ui, sans-serif" font-size="10.5">OPEN FOR TAPE LOOPS 4-5</text>

    <!-- Track 4: Free -->
    <rect x="15" y="175" width="220" height="36" rx="4" fill="#0f172a" stroke="#22c55e" stroke-dasharray="3 3" stroke-width="1" />
    <text x="25" y="197" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="700">TRK 4:</text>
    <text x="75" y="197" fill="#86efac" font-family="system-ui, sans-serif" font-size="10.5">OPEN FOR LEAD VOCALS/SITARS</text>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(40, 320)">
    <rect width="640" height="60" rx="6" fill="#0b1329" stroke="#334155" stroke-width="1" />
    <text x="16" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">EDEXCEL EXAM PRINCIPLE: REDUCTION MIXING (BOUNCING)</text>
    <text x="16" y="44" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">In 1966, 32-track digital consoles did not exist. Recording complex layered songs like 'Tomorrow Never Knows' required bouncing 4 tracks from Machine 1 down to a single track on Machine 2, freeing 3 new tracks for psychedelic tape loops and overdubs.</text>
  </g>
</svg>