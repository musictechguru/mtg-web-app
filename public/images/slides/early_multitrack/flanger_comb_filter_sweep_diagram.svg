<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">FLANGER COMB FILTERING</text>
    <rect x="262" y="0" width="310" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="417" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ultra-Short Delay (0.1-10 ms) &amp; Feedback</text>
  </g>

  <!-- Side-by-side: Chorus vs Flanger -->
  <g transform="translate(30, 60)">
    <!-- Left: CHORUS -->
    <g transform="translate(0, 0)">
      <rect width="355" height="315" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#shadow)" />
      <g transform="translate(16, 14)">
        <rect width="180" height="26" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1" />
        <text x="90" y="18" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">CHORUS EFFECT</text>
      </g>
      <!-- Diagram -->
      <g transform="translate(25, 55)">
        <rect width="305" height="160" rx="6" fill="#0b1120" stroke="#1e293b" />
        <rect x="20" y="20" width="160" height="24" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
        <text x="100" y="36" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Delay: 15 ms – 35 ms</text>
        
        <rect x="20" y="55" width="160" height="24" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
        <text x="100" y="71" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Feedback: Low / Zero</text>

        <!-- Smooth gentle wave -->
        <path d="M 20,130 Q 80,105 150,130 T 280,130" fill="none" stroke="#38bdf8" stroke-width="2.5" />
      </g>
      <!-- Bottom Badge -->
      <g transform="translate(16, 235)">
        <rect width="323" height="60" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1" />
        <text x="161" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">SMOOTH ENSEMBLE DOUBLING</text>
        <text x="161" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5" text-anchor="middle">Adds gentle shimmering width without metallic resonance</text>
      </g>
    </g>

    <!-- Right: FLANGER -->
    <g transform="translate(385, 0)">
      <rect width="355" height="315" rx="8" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.4" filter="url(#shadow)" />
      <g transform="translate(16, 14)">
        <rect width="180" height="26" rx="4" fill="#991b1b" fill-opacity="0.25" stroke="#ef4444" stroke-width="1" />
        <text x="90" y="18" fill="#f87171" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">FLANGER EFFECT</text>
      </g>
      <!-- Comb Filter Spectrum -->
      <g transform="translate(25, 55)">
        <rect width="305" height="160" rx="6" fill="#0b1120" stroke="#1e293b" />
        <rect x="20" y="20" width="160" height="24" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="0.8" />
        <text x="100" y="36" fill="#f87171" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Delay: 0.1 ms – 10 ms</text>
        
        <rect x="20" y="55" width="160" height="24" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="0.8" />
        <text x="100" y="71" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Feedback: High (Resonant)</text>

        <!-- Comb filter jagged notches -->
        <path d="M 20,110 L 50,150 L 80,110 L 110,150 L 140,110 L 170,150 L 200,110 L 230,150 L 260,110 L 290,150" fill="none" stroke="#ef4444" stroke-width="2.5" />
      </g>
      <!-- Bottom Badge -->
      <g transform="translate(16, 235)">
        <rect width="323" height="60" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1" />
        <text x="161" y="24" fill="#f87171" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">HARMONIC COMB FILTER "JET" SWEEP</text>
        <text x="161" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5" text-anchor="middle">Ultra-short delay &amp; feedback create deep sweeping notches</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="24" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="44" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Contrast: Flanging uses an ultra-short delay (0.1–10 ms) with feedback to produce pronounced comb filtering.</text>
  </g>
</svg>