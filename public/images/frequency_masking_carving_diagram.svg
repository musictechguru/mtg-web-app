<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="clashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.04" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Subtle Studio Grid -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="260" x2="800" y2="260" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="460" />
    <line x1="400" y1="0" x2="400" y2="460" />
    <line x1="600" y1="0" x2="600" y2="460" />
  </g>

  <!-- Header Section with Padded Badges -->
  <g transform="translate(30, 16)">
    <!-- Main Title Pill -->
    <rect x="0" y="0" width="280" height="32" rx="6" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-width="1.2" />
    <text x="140" y="21" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">FREQUENCY MASKING</text>

    <!-- Subtitle Pill -->
    <rect x="290" y="0" width="260" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="420" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Midrange Clash &amp; EQ Carving</text>
  </g>

  <!-- Left Card: The Problem (Masking) -->
  <g transform="translate(30, 60)">
    <rect width="355" height="315" rx="8" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Card Header Pill -->
    <g transform="translate(16, 14)">
      <rect width="210" height="26" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
      <text x="105" y="18" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BEFORE: MASKED VOCAL</text>
    </g>

    <!-- Spectrum Display Screen -->
    <g transform="translate(16, 50)">
      <rect width="323" height="190" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" />

      <!-- Horizontal grid -->
      <line x1="0" y1="48" x2="323" y2="48" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="0" y1="95" x2="323" y2="95" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="0" y1="142" x2="323" y2="142" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />

      <!-- Frequency vertical grid -->
      <line x1="80" y1="0" x2="80" y2="190" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="162" y1="0" x2="162" y2="190" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="244" y1="0" x2="244" y2="190" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />

      <!-- Clash Zone Highlight Box -->
      <rect x="115" y="16" width="94" height="174" fill="url(#clashGrad)" stroke="#ef4444" stroke-width="1" stroke-dasharray="4" opacity="0.9" />

      <!-- Clash Zone Badge -->
      <rect x="122" y="24" width="80" height="20" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
      <text x="162" y="38" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CLASH (2 kHz)</text>

      <!-- Loud Guitar Curve -->
      <path d="M 20,170 Q 70,60 120,48 Q 162,42 204,48 Q 255,60 305,170" fill="none" stroke="#f87171" stroke-width="3" />

      <!-- Quiet Vocal Curve Buried -->
      <path d="M 40,170 Q 95,145 130,105 Q 162,95 194,105 Q 230,145 285,170" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5 3" />

      <!-- Signal Labels -->
      <g transform="translate(14, 24)">
        <rect width="86" height="20" rx="3" fill="#0f172a" stroke="#f87171" stroke-width="1" />
        <text x="43" y="14" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Loud Guitars</text>
      </g>

      <g transform="translate(222, 24)">
        <rect width="86" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="43" y="14" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Masked Vocal</text>
      </g>

      <!-- Freq chips at bottom of display -->
      <rect x="18" y="166" width="44" height="16" rx="2" fill="#0f172a" />
      <text x="40" y="178" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">200 Hz</text>

      <rect x="140" y="166" width="44" height="16" rx="2" fill="#0f172a" stroke="#ef4444" stroke-width="0.8" />
      <text x="162" y="178" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">2 kHz</text>

      <rect x="260" y="166" width="46" height="16" rx="2" fill="#0f172a" />
      <text x="283" y="178" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">10 kHz</text>
    </g>

    <!-- Bottom Result Pill -->
    <g transform="translate(16, 252)">
      <rect width="323" height="48" rx="6" fill="#0b1120" stroke="#ef4444" stroke-width="1" />
      <text x="161" y="22" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">VOCAL IS INAUDIBLE</text>
      <text x="161" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="middle">Loud midrange energy masks quiet speech</text>
    </g>
  </g>

  <!-- Right Card: The Solution (EQ Carve) -->
  <g transform="translate(415, 60)">
    <rect width="355" height="315" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Card Header Pill -->
    <g transform="translate(16, 14)">
      <rect width="210" height="26" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
      <text x="105" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">AFTER: EQ CARVED POCKET</text>
    </g>

    <!-- Spectrum Display Screen -->
    <g transform="translate(16, 50)">
      <rect width="323" height="190" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" />

      <!-- Horizontal grid -->
      <line x1="0" y1="48" x2="323" y2="48" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="0" y1="95" x2="323" y2="95" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="0" y1="142" x2="323" y2="142" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />

      <!-- Frequency vertical grid -->
      <line x1="80" y1="0" x2="80" y2="190" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="162" y1="0" x2="162" y2="190" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />
      <line x1="244" y1="0" x2="244" y2="190" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3" />

      <!-- Pocket Zone Highlight Box -->
      <rect x="115" y="16" width="94" height="174" fill="url(#pocketGrad)" stroke="#10b981" stroke-width="1" stroke-dasharray="4" opacity="0.9" />

      <!-- Pocket Badge -->
      <rect x="118" y="24" width="88" height="20" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="162" y="38" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">CLEAR POCKET</text>

      <!-- Guitar Curve Scooped at 2 kHz -->
      <path d="M 20,170 Q 70,60 115,50 Q 140,55 152,102 Q 162,122 172,102 Q 185,55 210,50 Q 255,60 305,170" fill="none" stroke="#f87171" stroke-width="2.5" />

      <!-- Clear Vocal Curve Passing Through -->
      <path d="M 40,170 Q 95,145 130,95 Q 162,54 194,95 Q 230,145 285,170" fill="none" stroke="#38bdf8" stroke-width="3" />

      <!-- Node on clear vocal -->
      <circle cx="162" cy="54" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />

      <!-- Signal Labels -->
      <g transform="translate(14, 24)">
        <rect width="90" height="20" rx="3" fill="#0f172a" stroke="#f87171" stroke-width="1" />
        <text x="45" y="14" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">-4 dB Guitar Cut</text>
      </g>

      <g transform="translate(222, 24)">
        <rect width="86" height="20" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <text x="43" y="14" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Clear Vocal</text>
      </g>

      <!-- Freq chips at bottom of display -->
      <rect x="18" y="166" width="44" height="16" rx="2" fill="#0f172a" />
      <text x="40" y="178" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">200 Hz</text>

      <rect x="140" y="166" width="44" height="16" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="0.8" />
      <text x="162" y="178" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">2 kHz</text>

      <rect x="260" y="166" width="46" height="16" rx="2" fill="#0f172a" />
      <text x="283" y="178" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">10 kHz</text>
    </g>

    <!-- Bottom Result Pill -->
    <g transform="translate(16, 252)">
      <rect width="323" height="48" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1" />
      <text x="161" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">CLARITY RESTORED</text>
      <text x="161" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="middle">Vocal cuts through without extra volume boost</text>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 392)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="26" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="26" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="46" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Rule: Cut competing frequencies on guitars rather than turning up the vocal.</text>
  </g>
</svg>