<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Subtle Studio Grid -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="260" x2="800" y2="260" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="200" y1="0" x2="200" y2="460" />
    <line x1="400" y1="0" x2="400" y2="460" />
    <line x1="600" y1="0" x2="600" y2="460" />
  </g>

  <!-- Header Section with Padded Badges -->
  <g transform="translate(30, 16)">
    <!-- Main Title Pill -->
    <rect x="0" y="0" width="280" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="140" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">THE PHANTOM CENTER</text>

    <!-- Subtitle Pill -->
    <rect x="290" y="0" width="270" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="425" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Stereo Psychoacoustic Localization</text>
  </g>

  <!-- Main Stage Card -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Equilateral Triangle Guidelines -->
    <polygon points="170,105 630,105 400,245" fill="#38bdf8" fill-opacity="0.03" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 4" />

    <!-- 60 Degree Angle Badges -->
    <rect x="260" y="112" width="46" height="18" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <text x="283" y="125" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">60°</text>

    <rect x="494" y="112" width="46" height="18" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <text x="517" y="125" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">60°</text>

    <rect x="377" y="215" width="46" height="18" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <text x="400" y="228" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">60°</text>

    <!-- LEFT SPEAKER (Physical) -->
    <g transform="translate(135, 45)">
      <rect width="70" height="110" rx="8" fill="#0b1120" stroke="#38bdf8" stroke-width="2" />
      <circle cx="35" cy="40" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="35" cy="78" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="35" cy="78" r="7" fill="#38bdf8" />
      <!-- Label Pill -->
      <rect x="-35" y="120" width="140" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="35" y="136" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">LEFT SPEAKER (50%)</text>
    </g>

    <!-- PHANTOM CENTER SPEAKER (Virtual Acoustic Illusion) -->
    <g transform="translate(365, 30)">
      <rect width="70" height="110" rx="8" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" />
      <circle cx="35" cy="40" r="14" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 2" />
      <circle cx="35" cy="78" r="22" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 2" />
      <circle cx="35" cy="78" r="7" fill="#fbbf24" fill-opacity="0.5" />
      <!-- Label Pill -->
      <rect x="-55" y="120" width="180" height="24" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" />
      <text x="35" y="136" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle">PHANTOM CENTER (VIRTUAL)</text>
      <!-- Sub-label Pill -->
      <rect x="-40" y="148" width="150" height="20" rx="3" fill="#0b1120" stroke="#f59e0b" stroke-width="0.8" />
      <text x="35" y="162" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">No Physical Speaker Exists</text>
    </g>

    <!-- RIGHT SPEAKER (Physical) -->
    <g transform="translate(595, 45)">
      <rect width="70" height="110" rx="8" fill="#0b1120" stroke="#38bdf8" stroke-width="2" />
      <circle cx="35" cy="40" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="35" cy="78" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="35" cy="78" r="7" fill="#38bdf8" />
      <!-- Label Pill -->
      <rect x="-35" y="120" width="140" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="35" y="136" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">RIGHT SPEAKER (50%)</text>
    </g>

    <!-- LISTENER AT SWEET SPOT -->
    <g transform="translate(400, 245)">
      <circle cx="0" cy="0" r="16" fill="#0b1120" stroke="#38bdf8" stroke-width="2" />
      <!-- Headphones arc -->
      <path d="M -14,0 A 14,14 0 0,1 14,0" fill="none" stroke="#38bdf8" stroke-width="3" />
      <rect x="-18" y="-4" width="6" height="10" rx="2" fill="#38bdf8" />
      <rect x="12" y="-4" width="6" height="10" rx="2" fill="#38bdf8" />
      <!-- Label Pill -->
      <rect x="-105" y="24" width="210" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="40" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">LISTENER (SWEET SPOT APEX)</text>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 392)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="26" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="26" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="46" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Principle: Equal level &amp; timing at both ears creates a virtual center soundstage image.</text>
  </g>
</svg>