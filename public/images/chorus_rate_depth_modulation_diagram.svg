<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">CHORUS RATE VS DEPTH</text>
    <rect x="262" y="0" width="310" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="417" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">LFO Modulation Speed and Intensity</text>
  </g>

  <!-- Side by side comparison: RATE (Speed) vs DEPTH (Intensity) -->
  <g transform="translate(30, 60)">
    <!-- Left Card: RATE -->
    <g transform="translate(0, 0)">
      <rect width="355" height="315" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" filter="url(#shadow)" />
      <g transform="translate(16, 14)">
        <rect width="190" height="26" rx="4" fill="#0284c7" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1" />
        <text x="95" y="18" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">RATE (LFO SPEED)</text>
      </g>
      <!-- Sine waveform showing cycle speed -->
      <g transform="translate(25, 60)">
        <rect width="305" height="150" rx="6" fill="#0b1120" stroke="#1e293b" />
        <line x1="15" y1="75" x2="290" y2="75" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
        <!-- Fast vs Slow sine comparison -->
        <path d="M 25,75 Q 55,25 85,75 T 145,75 T 205,75 T 265,75" fill="none" stroke="#38bdf8" stroke-width="3" />
        <rect x="75" y="115" width="155" height="22" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
        <text x="152" y="129" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Cycle Speed: 0.5 Hz – 5.0 Hz</text>
      </g>
      <!-- Summary Box -->
      <g transform="translate(16, 235)">
        <rect width="323" height="60" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1" />
        <text x="161" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">CONTROLS MODULATION SPEED</text>
        <text x="161" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5" text-anchor="middle">How rapidly the pitch oscillates back and forth</text>
      </g>
    </g>

    <!-- Right Card: DEPTH -->
    <g transform="translate(385, 0)">
      <rect width="355" height="315" rx="8" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.4" filter="url(#shadow)" />
      <g transform="translate(16, 14)">
        <rect width="190" height="26" rx="4" fill="#7e22ce" fill-opacity="0.25" stroke="#a855f7" stroke-width="1" />
        <text x="95" y="18" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">DEPTH (PITCH AMOUNT)</text>
      </g>
      <!-- Amplitude height comparison -->
      <g transform="translate(25, 60)">
        <rect width="305" height="150" rx="6" fill="#0b1120" stroke="#1e293b" />
        <line x1="15" y1="75" x2="290" y2="75" stroke="#334155" stroke-width="1" stroke-dasharray="3 3" />
        <!-- Tall amplitude wave -->
        <path d="M 25,75 Q 85,15 145,75 T 265,75" fill="none" stroke="#c084fc" stroke-width="3" />
        <!-- Vertical span indicator -->
        <line x1="85" y1="15" x2="85" y2="135" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2 2" />
        <rect x="75" y="115" width="155" height="22" rx="3" fill="#0f172a" stroke="#a855f7" stroke-width="0.8" />
        <text x="152" y="129" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Pitch Deviation: ±5 to ±30 cents</text>
      </g>
      <!-- Summary Box -->
      <g transform="translate(16, 235)">
        <rect width="323" height="60" rx="6" fill="#0b1120" stroke="#a855f7" stroke-width="1" />
        <text x="161" y="24" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">CONTROLS PITCH INTENSITY</text>
        <text x="161" y="44" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9.5" text-anchor="middle">How far the pitch detunes from the dry root note</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="22" r="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="24" y="26" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>
    <text x="44" y="26" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Controls: Rate adjusts the modulation frequency (speed in Hz); Depth controls the pitch deviation amplitude.</text>
  </g>
</svg>