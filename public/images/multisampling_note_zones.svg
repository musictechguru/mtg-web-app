<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Badge Header -->
  <rect x="30" y="24" width="270" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="165" y="45" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">MULTISAMPLING &amp; KEYZONES</text>
  <text x="320" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Mapping individual real recordings across discrete pitch and velocity zones</text>

  <!-- MULTISAMPLING MATRIX CANVAS -->
  <g transform="translate(60, 75)">
    <rect x="0" y="0" width="680" height="240" rx="8" fill="#0b1120" stroke="#334155" stroke-width="1.5" />

    <!-- Velocity Axis Label on Left -->
    <text x="15" y="40" fill="#94a3b8" font-size="10" font-weight="700">VELOCITY</text>
    <text x="15" y="65" fill="#e2e8f0" font-size="10">Forte (127)</text>
    <text x="15" y="130" fill="#e2e8f0" font-size="10">Mezzo (80)</text>
    <text x="15" y="195" fill="#e2e8f0" font-size="10">Piano (30)</text>
    <line x1="75" y1="20" x2="75" y2="215" stroke="#334155" stroke-width="1" />

    <!-- 4 NOTE ZONES (Key ranges) -->
    <!-- ZONE 1: Bass (C1 - B1) -->
    <g transform="translate(85, 20)">
      <rect x="0" y="0" width="135" height="195" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="67" y="20" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">ZONE 1 (C1 - B1)</text>
      
      <!-- 3 Velocity Layers inside Zone 1 -->
      <rect x="10" y="32" width="115" height="45" rx="4" fill="#312e81" stroke="#818cf8" stroke-dasharray="2,2" />
      <text x="67" y="58" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Bass Hard Hit</text>

      <rect x="10" y="85" width="115" height="45" rx="4" fill="#312e81" stroke="#818cf8" stroke-dasharray="2,2" />
      <text x="67" y="111" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Bass Med Hit</text>

      <rect x="10" y="138" width="115" height="45" rx="4" fill="#312e81" stroke="#818cf8" stroke-dasharray="2,2" />
      <text x="67" y="164" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Bass Soft Hit</text>
    </g>

    <!-- ZONE 2: Low-Mid (C2 - B2) -->
    <g transform="translate(230, 20)">
      <rect x="0" y="0" width="135" height="195" rx="6" fill="#082f49" stroke="#0284c7" stroke-width="1.5" />
      <text x="67" y="20" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">ZONE 2 (C2 - B2)</text>
      
      <rect x="10" y="32" width="115" height="45" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-dasharray="2,2" />
      <text x="67" y="58" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Low-Mid Hard</text>

      <rect x="10" y="85" width="115" height="45" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-dasharray="2,2" />
      <text x="67" y="111" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Low-Mid Med</text>

      <rect x="10" y="138" width="115" height="45" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-dasharray="2,2" />
      <text x="67" y="164" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Low-Mid Soft</text>
    </g>

    <!-- ZONE 3: Mid (C3 - B3) -->
    <g transform="translate(375, 20)">
      <rect x="0" y="0" width="135" height="195" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="67" y="20" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">ZONE 3 (C3 - B3)</text>
      
      <rect x="10" y="32" width="115" height="45" rx="4" fill="#047857" stroke="#34d399" stroke-dasharray="2,2" />
      <text x="67" y="58" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Mid Hard Hit</text>

      <rect x="10" y="85" width="115" height="45" rx="4" fill="#047857" stroke="#34d399" stroke-dasharray="2,2" />
      <text x="67" y="111" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Mid Med Hit</text>

      <rect x="10" y="138" width="115" height="45" rx="4" fill="#047857" stroke="#34d399" stroke-dasharray="2,2" />
      <text x="67" y="164" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Mid Soft Hit</text>
    </g>

    <!-- ZONE 4: Treble (C4 - C5) -->
    <g transform="translate(520, 20)">
      <rect x="0" y="0" width="145" height="195" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
      <text x="72" y="20" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle">ZONE 4 (C4 - C5)</text>
      
      <rect x="15" y="32" width="115" height="45" rx="4" fill="#b45309" stroke="#fbbf24" stroke-dasharray="2,2" />
      <text x="72" y="58" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Treble Hard</text>

      <rect x="15" y="85" width="115" height="45" rx="4" fill="#b45309" stroke="#fbbf24" stroke-dasharray="2,2" />
      <text x="72" y="111" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Treble Med</text>

      <rect x="15" y="138" width="115" height="45" rx="4" fill="#b45309" stroke="#fbbf24" stroke-dasharray="2,2" />
      <text x="72" y="164" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">Treble Soft</text>
    </g>

    <!-- Pitch Axis at bottom -->
    <text x="370" y="230" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">KEYBOARD NOTE ZONES (PITCH AXIS →)</text>
  </g>

  <!-- Footer Information Strip -->
  <rect x="60" y="330" width="680" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="80" y="354" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">WHY MULTISAMPLING ON NOTE ZONES IS SUPERIOR:</text>
  <text x="80" y="374" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">1. <strong style="fill:#38bdf8;">Preserves Acoustic Formants:</strong> Each octave sounds genuine without artificial pitch speed distortion.</text>
  <text x="80" y="390" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">2. <strong style="fill:#38bdf8;">Velocity Switching:</strong> Hitting keys harder triggers brighter, more aggressive acoustic timbre captures.</text>
</svg>
