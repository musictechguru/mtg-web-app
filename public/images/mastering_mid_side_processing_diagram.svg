<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0b1120" /><stop offset="50%" stop-color="#0f172a" /><stop offset="100%" stop-color="#020617" /></linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" /><stop offset="100%" stop-color="#0f172a" /></linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" /></filter>
  </defs>
  <rect width="800" height="460" fill="url(#bgGrad)" />

  <!-- Header -->
  <g transform="translate(30, 16)">
    <rect width="250" height="32" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.2" />
    <text x="125" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">MID/SIDE (M/S) MASTERING</text>
    <rect x="262" y="0" width="370" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="447" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Mono-Making Sub-Bass &amp; Side Channel Stereo Air</text>
  </g>

  <!-- Main Comparison Container -->
  <g transform="translate(30, 60)">
    <rect width="740" height="315" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- Left: Mid Channel (L + R) -->
    <g transform="translate(20, 20)">
      <rect width="335" height="275" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1.2" />
      <g transform="translate(15, 12)">
        <rect width="210" height="24" rx="4" fill="#0c4a6e" />
        <text x="105" y="16" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">MID CHANNEL (CENTER: L + R)</text>
      </g>

      <!-- Center Elements Graphic -->
      <g transform="translate(15, 48)">
        <rect width="305" height="120" rx="4" fill="#0f172a" stroke="#1e293b" />
        <!-- Phantom Center Beam -->
        <line x1="152" y1="20" x2="152" y2="105" stroke="#38bdf8" stroke-width="3" />
        <circle cx="152" cy="40" r="12" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" />
        <g transform="translate(100, 32)">
          <rect width="105" height="18" rx="2" fill="#0b1120" stroke="#38bdf8" stroke-width="0.8" />
          <text x="52" y="13" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">LEAD VOCAL / SNARE</text>
        </g>
        <circle cx="152" cy="85" r="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
        <g transform="translate(100, 77)">
          <rect width="105" height="18" rx="2" fill="#0b1120" stroke="#10b981" stroke-width="0.8" />
          <text x="52" y="13" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">KICK &amp; SUB-BASS</text>
        </g>
      </g>

      <g transform="translate(15, 180)">
        <rect width="305" height="80" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
        <text x="12" y="22" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Anchor of the Mixdown</text>
        <text x="12" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Contains all monophonic core energy</text>
        <text x="12" y="56" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• EQ shapes vocal presence &amp; kick punch</text>
        <text x="12" y="70" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="8.5">• Retains central focus &amp; drive</text>
      </g>
    </g>

    <!-- Right: Side Channel (L - R) -->
    <g transform="translate(385, 20)">
      <rect width="335" height="275" rx="6" fill="#0b1120" stroke="#a855f7" stroke-width="1.2" />
      <g transform="translate(15, 12)">
        <rect width="210" height="24" rx="4" fill="#3b0764" />
        <text x="105" y="16" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">SIDE CHANNEL (STEREO: L - R)</text>
      </g>

      <!-- Side EQ Curve Graphic -->
      <g transform="translate(15, 48)">
        <rect width="305" height="120" rx="4" fill="#0f172a" stroke="#1e293b" />
        <!-- Curve: HPF < 100Hz and Boost > 8kHz -->
        <path d="M 25,95 C 45,95 70,85 95,55 L 205,55 C 235,55 255,30 285,25" fill="none" stroke="#c084fc" stroke-width="2.5" />
        <line x1="95" y1="20" x2="95" y2="105" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="2 2" />

        <g transform="translate(30, 20)">
          <rect width="115" height="20" rx="2" fill="#450a0a" stroke="#ef4444" stroke-width="0.8" />
          <text x="57" y="14" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">HPF @ 100 Hz (MONO BASS)</text>
        </g>
        <g transform="translate(180, 80)">
          <rect width="115" height="20" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
          <text x="57" y="14" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">HIGH SHELF (STEREO AIR)</text>
        </g>
      </g>

      <g transform="translate(15, 180)">
        <rect width="305" height="80" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="0.8" />
        <text x="12" y="22" fill="#d8b4fe" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">Stereo Width &amp; Phase Protection</text>
        <text x="12" y="40" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Removes low-frequency stereo phase clutter</text>
        <text x="12" y="56" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="8.5">• Tightens club bass punch on mono subwoofers</text>
        <text x="12" y="70" fill="#34d399" font-family="-apple-system, sans-serif" font-size="8.5">• High-shelf boost adds expansive spatial sparkle</text>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Bar -->
  <g transform="translate(30, 396)">
    <rect width="740" height="44" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(12, 12)">
      <rect width="75" height="20" rx="3" fill="#0284c7" />
      <text x="37" y="14" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">TAKEAWAY</text>
    </g>
    <text x="98" y="27" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">High-passing the Side channel below 100 Hz mono-centers sub-bass, preventing phase cancellation and mud.</text>
  </g>
</svg>
