<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="50%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17223b" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- Outer Header -->
  <g transform="translate(30, 16)">
    <rect width="250" height="34" rx="7" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.3" />
    <text x="125" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">CLEARING "MUD" IN A MIX</text>

    <rect x="262" y="0" width="668" height="34" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1.3" />
    <text x="596" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Controlling Low-Mid Congestion in the 200 Hz – 400 Hz Frequency Range</text>
  </g>

  <!-- Main Container -->
  <g transform="translate(30, 60)">
    <rect width="900" height="396" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.4" filter="url(#shadow)" />

    <!-- LEFT COLUMN: Spectral Frequency Map (Where Mud Accumulates) -->
    <g transform="translate(24, 18)">
      <rect width="420" height="360" rx="8" fill="url(#panelGrad)" stroke="#f59e0b" stroke-width="1.3" />

      <!-- Left Header Badge -->
      <g transform="translate(18, 12)">
        <rect width="384" height="28" rx="6" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.1" />
        <text x="192" y="19" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.8">THE "MUD" SPECTRUM: 200 Hz TO 400 Hz</text>
      </g>

      <!-- Frequency Graph Display -->
      <g transform="translate(18, 48)">
        <rect width="384" height="152" rx="7" fill="#090f1d" stroke="#1e293b" stroke-width="1.2" />

        <!-- Base Axis Line -->
        <line x1="16" y1="110" x2="368" y2="110" stroke="#475569" stroke-width="1.5" />

        <!-- Sub & Bass Zone (20 - 200 Hz) -->
        <rect x="16" y="74" width="80" height="36" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
        <text x="56" y="94" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">SUB &amp; BASS</text>
        <text x="56" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="600" text-anchor="middle">20 - 200 Hz</text>

        <!-- THE MUD ZONE (200 - 400 Hz) Highlight Box -->
        <rect x="104" y="24" width="136" height="86" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
        <rect x="114" y="28" width="116" height="18" rx="3" fill="#f59e0b" />
        <text x="172" y="41" fill="#0b1326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">"MUD ZONE" BUILDUPS</text>

        <!-- Overlapping instrument collision curves -->
        <!-- Bass harmonics -->
        <path d="M 110 90 Q 150 48 190 90" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="2,2" />
        <!-- Guitars & Pads -->
        <path d="M 130 94 Q 170 42 210 94" fill="none" stroke="#f87171" stroke-width="1.8" stroke-dasharray="2,2" />
        <!-- Snare & Vocal boxiness -->
        <path d="M 150 96 Q 185 46 230 96" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="2,2" />

        <!-- Corrective Cut Curve (Cyan dipping down) -->
        <path d="M 110 90 Q 170 126 230 90" fill="none" stroke="#38bdf8" stroke-width="2.4" />
        <rect x="124" y="86" width="96" height="16" rx="3" fill="#0284c7" />
        <text x="172" y="98" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">Gentle -1.5 dB Dip</text>

        <!-- Mids & Highs Zone (400 Hz - 20 kHz) -->
        <rect x="248" y="74" width="120" height="36" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
        <text x="308" y="94" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">CLARITY &amp; AIR</text>
        <text x="308" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="600" text-anchor="middle">400 Hz - 20 kHz (Unmasked)</text>

        <!-- Bottom frequency axis legend -->
        <g transform="translate(16, 122)">
          <rect width="352" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="176" y="14" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" text-anchor="middle">Instruments colliding: Bass, Kick Body, Guitars, Snare, Vocals &amp; Reverb</text>
        </g>
      </g>

      <!-- 2 Detail Boxes for What Causes Mud -->
      <g transform="translate(18, 208)">
        <!-- Box A: Why It Accumulates -->
        <g transform="translate(0, 0)">
          <rect width="384" height="66" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="8" y="8" width="144" height="20" rx="3" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
          <text x="80" y="21" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">WHY "MUD" OCCURS</text>

          <rect x="158" y="8" width="218" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="267" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Frequency Masking &amp; Buildup</text>

          <rect x="8" y="34" width="368" height="24" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.2" font-weight="500" text-anchor="middle">Dense lower fundamentals and mic proximity effects stack up and cloud the mix</text>
        </g>

        <!-- Box B: What EQ Cleans -->
        <g transform="translate(0, 74)">
          <rect width="384" height="66" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="8" y="8" width="144" height="20" rx="3" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
          <text x="80" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">THE CORRECTIVE FIX</text>

          <rect x="158" y="8" width="218" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="267" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Subtle Carving (200 - 400 Hz)</text>

          <rect x="8" y="34" width="368" height="24" rx="3" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.2" font-weight="500" text-anchor="middle">A gentle dip removes wooliness, unmasking vocal clarity and tight kick punch</text>
        </g>
      </g>
    </g>

    <!-- RIGHT COLUMN: 4 Proven Solutions to Eliminate Mud -->
    <g transform="translate(460, 18)">
      <rect width="416" height="360" rx="8" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1.3" />

      <!-- Right Header Badge -->
      <g transform="translate(16, 12)">
        <rect width="384" height="28" rx="6" fill="#059669" fill-opacity="0.25" stroke="#10b981" stroke-width="1.1" />
        <text x="192" y="19" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.8">4 PROVEN WAYS TO ELIMINATE MIX "MUD"</text>
      </g>

      <!-- 4 Stacked Strategy Cards -->
      <g transform="translate(16, 48)">
        <!-- Strategy 1: Targeted Low-Mid EQ Cuts -->
        <g transform="translate(0, 0)">
          <rect width="384" height="68" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="10" y="8" width="164" height="22" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
          <text x="92" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">1. TARGETED 250 Hz CUTS</text>

          <rect x="182" y="8" width="192" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="278" y="22" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Parametric Bell EQ Dip</text>

          <rect x="10" y="36" width="364" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">Apply -2 dB to -4 dB cuts on competing guitars, synths, and bass tracks</text>
        </g>

        <!-- Strategy 2: High-Pass Filtering Non-Bass Tracks -->
        <g transform="translate(0, 76)">
          <rect width="384" height="68" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="10" y="8" width="164" height="22" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
          <text x="92" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">2. HIGH-PASS FILTERING</text>

          <rect x="182" y="8" width="192" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="278" y="22" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Clean Non-Bass Elements</text>

          <rect x="10" y="36" width="364" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">HPF vocals, hi-hats, and guitars above 80–120 Hz to clear unnecessary low-end</text>
        </g>

        <!-- Strategy 3: Filter Reverb Aux Returns -->
        <g transform="translate(0, 152)">
          <rect width="384" height="68" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="10" y="8" width="164" height="22" rx="4" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1" />
          <text x="92" y="22" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">3. FILTER REVERB RETURNS</text>

          <rect x="182" y="8" width="192" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="278" y="22" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Abbey Road Reverb Trick</text>

          <rect x="10" y="36" width="364" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">High-pass reverb returns at 300–500 Hz to prevent cavernous low-mid buildup</text>
        </g>

        <!-- Strategy 4: Dynamic EQ / Multiband Control -->
        <g transform="translate(0, 228)">
          <rect width="384" height="68" rx="6" fill="#090f1d" stroke="#1e293b" stroke-width="1" />
          <rect x="10" y="8" width="164" height="22" rx="4" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
          <text x="92" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" text-anchor="middle">4. DYNAMIC EQ DUPLICATES</text>

          <rect x="182" y="8" width="192" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="278" y="22" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Threshold-Sensitive Taming</text>

          <rect x="10" y="36" width="364" height="24" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
          <text x="192" y="52" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" text-anchor="middle">Compresses 250 Hz only when instruments play together, keeping solo warmth</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Takeaway Container -->
  <g transform="translate(30, 466)">
    <rect width="900" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.3" />

    <!-- Takeaway Tag Badge -->
    <rect x="14" y="11" width="106" height="36" rx="6" fill="#f59e0b" />
    <text x="67" y="33" fill="#0b1326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.8">TAKEAWAY</text>

    <!-- Takeaway Content Box -->
    <rect x="128" y="9" width="758" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="507" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">"Mud" accumulates in the 200–400 Hz range where bass, guitars, snare, and reverbs collide.</text>
    <text x="507" y="39" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Applying gentle parametric cuts and high-passing non-bass tracks unmasks vocal clarity and punch.</text>
  </g>
</svg>
